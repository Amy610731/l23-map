2⁻¹ ＝ 0.5）"], ["② 左子節點的熵", "同一條熵的公式，換成左節點的比例", "違約 p ＝ 7 ÷ 8 ＝ 0.875，正常 p ＝ 1 ÷ 8 ＝ 0.125；log₂0.875 ≈ −0.1926，log₂0.125 ＝ −3；H ＝ −(0.875 × (−0.1926) ＋ 0.125 × (−3)) ≈ 0.1686 ＋ 0.375 ≈ 0.5436"], ["③ 右子節點的熵", "同一條熵的公式，換成右節點的比例", "右邊是 1 筆違約、7 筆正常，比例剛好與左邊對調（1 ÷ 8 與 7 ÷ 8），加起來的算式相同，所以 H ≈ 0.5436"], ["④ 子節點的加權平均熵", "加權熵 ＝ Σ (子節點樣本數 ÷ 父節點樣本數) × 子節點的熵（人數多的子節點占比較大）", "＝ (8 ÷ 16) × 0.5436 ＋ (8 ÷ 16) × 0.5436 ＝ 0.2718 ＋ 0.2718 ≈ 0.5436"], ["⑤ 資訊增益", "資訊增益 IG ＝ 父節點的熵 − 子節點的加權平均熵（切完之後不確定性少了多少）", "＝ 1 − 0.5436 ≈ 0.4564，四捨五入約 0.46，選 D"], ["⑥ 對照其他選項（怎麼算錯的）", "題目指定用熵；基尼不純度、子節點熵、機率比例都不是資訊增益", "A：0.28 是改用基尼不純度的降低量：父 ＝ 1 − (0.5² ＋ 0.5²) ＝ 0.5，子 ＝ 1 − ((7/8)² ＋ (1/8)²) ＝ 1 − (0.765625 ＋ 0.015625) ＝ 0.21875，0.5 − 0.21875 ≈ 0.28（題目要的是熵）。B：0.54 是步驟④的子節點熵，還沒用父節點的 1 去減。C：0.88 ≈ 7 ÷ 8 ＝ 0.875，是把多數類的比例直接當成熵，其實不是任何不純度指標"]], "tip": "資訊增益＝父節點熵 － 子節點加權平均熵；值越大，這次切分越有用。"}}, {"no": 11, "section": "4.2", "topic_id": "4.2-13", "topic": "樸素貝氏", "style": "情境", "stem": "某新聞團隊以樸素貝氏（Naïve Bayes）分類文章，發現「股市」與「股票」這兩個詞幾乎總是同時出現，模型等於把同一份證據重複計入，預測機率變得過度極端。這種現象最直接違反了樸素貝氏的哪一項假設？", "options": {"A": "給定類別時，各特徵之間彼此條件獨立", "B": "各類別的先驗機率必須完全相等", "C": "所有特徵都必須服從常態分佈", "D": "各類別的訓練樣本數必須相同"}, "answer": "A", "explanation": "答案 A。樸素貝氏之所以「樸素」，是假設給定類別時各特徵條件獨立，才能把 P(X|C) 拆成各特徵機率的連乘。兩個高度相關的詞同時出現，連乘時等於重複計算同一證據，造成機率過度自信。先驗不必相等、樣本數不必相同，常態分佈假設也只有高斯樸素貝氏才需要。", "per_option": {"A": "正確：條件獨立假設被相關特徵破壞。", "B": "先驗機率可以不同，這正是模型會學習的部分。", "C": "只有高斯樸素貝氏才假設連續特徵服從常態，文字分類並不需要。", "D": "各類別樣本數不必相同，且與特徵重複計入的現象無關。"}, "guide_ref": "學習指引 p.4-34～4-36", "hot": false}, {"no": 12, "section": "4.2", "topic_id": "4.2-19", "topic": "FP-Growth", "style": "比較", "stem": "某連鎖超商要從數百萬筆交易中挖掘頻繁項目集，資料工程師觀察到 Apriori 需要反覆掃描資料庫並產生大量候選項集，效能不佳。關於改用 FP-Growth 的敘述，下列何者正確？", "options": {"A": "FP-Growth 先掃描一次統計各項目的支持度，再建構 FP 樹壓縮交易資料，共掃描兩次，不產生候選項集", "B": "FP-Growth 逐層產生候選項集，再以最小信賴度過濾候選，整體流程與 Apriori 完全相同", "C": "FP-Growth 是監督式分類演算法，需要先標註出哪些交易包含了目標商品", "D": "FP-Growth 在極度稀疏的資料上壓縮效果最好，記憶體用量一定低於 Apriori"}, "answer": "A", "explanation": "答案 A。FP-Growth 第一次掃描統計支持度並濾掉不頻繁的項目，第二次掃描把交易寫成 FP 樹的路徑，再從樹中遞歸挖出頻繁項集，全程不需產生候選集，所以通常比 Apriori 快。它屬於關聯規則學習而非分類；極度稀疏時樹難以壓縮，優勢反而減弱。", "per_option": {"A": "正確：兩次掃描、FP 樹、不產生候選項集。", "B": "逐層產生候選項集是 Apriori 的做法。", "C": "FP-Growth 屬關聯規則（非監督），不需要標註。", "D": "資料極度稀疏時 FP 樹壓縮效果差，不能說記憶體一定較省。"}, "guide_ref": "學習指引 p.4-49～4-50", "hot": false}, {"no": 13, "section": "4.2", "topic_id": "4.2-21", "topic": "孤立森林", "style": "情境", "stem": "某信用卡中心以孤立森林（Isolation Forest）偵測交易異常。模型計算每筆交易在多棵孤立樹中被單獨孤立所需的平均路徑長度，發現其中一筆的平均路徑長度明顯短於其他交易。這筆交易最可能代表什麼？", "options": {"A": "正常交易：位於資料密集區，需要很多次隨機切分才能被單獨孤立", "B": "無法判斷：路徑長度與是否異常無關，必須先有異常標籤才能算出異常分數", "C": "異常交易：數量少且離群，只需少數幾次隨機切分就被單獨孤立", "D": "正常交易：路徑越短，代表它與其他樣本之間的歐氏距離越小"}, "answer": "C", "explanation": "答案 C。孤立森林的直覺是：異常點少又離群，隨機切分幾刀就能把它單獨隔開，所以平均路徑長度較短、異常分數較高；正常點擠在人群裡，需要切很多刀。它是非監督方法，不需要標籤，也不靠距離計算。", "per_option": {"A": "密集區的正常點需要更多次切分，路徑應該較長，不是較短。", "B": "孤立森林不需要異常標籤，路徑長度正是異常分數的來源。", "C": "正確：路徑短＝容易被孤立＝越可能是異常。", "D": "孤立森林不使用距離度量，且路徑短反而代表較可能是異常。"}, "guide_ref": "學習指引 p.4-51～4-52", "hot": false}, {"no": 14, "section": "4.2", "topic_id": "4.2-22", "topic": "單類別 SVM", "style": "情境", "stem": "某工廠的設備感測器累積了數年的正常運轉資料，但從未發生過嚴重故障，因此幾乎沒有故障樣本可供標註。團隊想建立模型，把明顯偏離正常運轉範圍的新資料標示為異常。下列哪一種方法最適合？", "options": {"A": "標準二元 SVM：需要正常與故障兩類的標註樣本，才能求出分隔兩類的超平面", "B": "邏輯迴歸：需要以正常與故障標籤進行訓練，才能估計屬於故障類的機率", "C": "決策樹分類器：需要至少兩個類別的標籤，才能學出各類別的分類規則", "D": "單類別 SVM（One-Class SVM）：只用正常資料學出包圍正常範圍的邊界"}, "answer": "D", "explanation": "答案 D。單類別 SVM 只需要一個類別（通常是正常資料），以核函數映射到高維空間後找出把正常資料與原點分開的邊界，邊界外的新資料就判為異常，適合異常樣本難以收集的場景。其他三者都是監督式分類器，必須有兩類以上的標註資料。", "per_option": {"A": "標準 SVM 需要兩類樣本才能畫出分隔超平面，缺少故障樣本時無法訓練。", "B": "邏輯迴歸需要正負兩種標籤才能學習。", "C": "決策樹分類器同樣需要多個類別標籤。", "D": "正確：只用正常資料學出邊界，邊界外即異常。"}, "guide_ref": "學習指引 p.4-52～4-53", "hot": false}, {"no": 15, "section": "4.3", "topic_id": "4.3-02", "topic": "激活函數與輸出層", "style": "情境", "stem": "某團隊設計情緒分析神經網路的輸出神經元，希望輸出值能表達從強烈負面到強烈正面的連續強度：負面情緒輸出負值、中性剛好輸出 0、正面情緒輸出正值，且上下界的絕對值相同。下列哪一種輸出激活函數最適合？", "options": {"A": "ReLU：輸入為正時原樣輸出、為負時輸出 0，輸出範圍為 0 以上", "B": "Sigmoid：把輸出壓縮到 0 到 1 之間，常用來表示機率", "C": "Tanh：把輸出壓縮到 −1 到 1 之間，屬於可正可負的有界輸出", "D": "Softmax：把多個輸出轉換為總和等於 1 的機率分佈"}, "answer": "C", "explanation": "答案 C。Tanh 的輸出介於 −1 與 1 之間，以 0 為中心且上下對稱，剛好能讓負面為負值、中性為 0、正面為正值。ReLU 沒有負值輸出也沒有上界；Sigmoid 的範圍是 0～1，雖然 0.5 是區間中點，但輸出恆為正，無法用負值表示負面，中性也不是 0；Softmax 用於多類別機率分佈，各輸出為正且總和為 1。", "per_option": {"A": "ReLU 對負輸入輸出 0，無法表達負面強度，也沒有上界。", "B": "Sigmoid 範圍是 0 到 1，輸出恆為正，無法以負值表達負面，中性（0.5）也不是 0，不符合題目要求的正負對稱。", "C": "正確：Tanh 輸出 −1 到 1，可正可負且對稱。", "D": "Softmax 輸出是總和為 1 的機率分佈，用於多類別分類。"}, "guide_ref": "學習指引 p.4-57～4-58；4-65", "hot": true}, {"no": 16, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "否定", "stem": "關於卷積神經網路（CNN）的敘述，下列何者不正確？", "options": {"A": "同一個卷積核會在整張特徵圖上滑動並共用權重，因此卷積層的參數量與輸入影像的長寬無關", "B": "卷積層輸出特徵圖的通道數，取決於該層使用的卷積核（濾波器）數量", "C": "淺層卷積核多半學到邊緣、紋理等簡單特徵，越深的層越能組合出抽象特徵", "D": "只要加入池化層，CNN 就天生對影像的任意旋轉與縮放具備不變性"}, "answer": "D", "explanation": "答案 D。池化層只帶來對小幅平移的容忍度，CNN 並不會自動具備旋轉與縮放不變性，通常要靠資料增強或特殊設計。卷積層的參數量為 核高×核寬×輸入通道×輸出通道＋偏差，與影像長寬無關；輸出通道數等於卷積核數；淺層學簡單特徵、深層學抽象特徵，這三項都正確。", "per_option": {"A": "敘述正確：權重共享使卷積層參數量與影像大小無關。", "B": "敘述正確：輸出通道數＝卷積核數量。", "C": "敘述正確：特徵由簡單逐層組合成抽象。", "D": "錯誤：池化最多帶來小幅平移不變性，並不保證旋轉與縮放不變。"}, "guide_ref": "學習指引 p.4-67～4-71", "hot": true}, {"no": 17, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "計算", "stem": "某 CNN 接收 32×32×3 的彩色影像，依序經過：Conv2D（8 個 5×5 卷積核，stride＝1，padding＝'valid'）→ ReLU → MaxPooling2D（2×2，stride＝2）→ Flatten。Flatten 後輸出向量的長度為何？", "options": {"A": "588：14×14×3，誤以為通道數仍是輸入的 3", "B": "1568：14×14×8", "C": "2048：16×16×8，誤以為卷積後尺寸不變", "D": "6272：28×28×8，漏算了池化"}, "answer": "B", "explanation": "答案 B。valid 卷積使尺寸由 32 變成 32−5＋1＝28，通道數等於卷積核數 8，得到 28×28×8；2×2 最大池化使長寬減半為 14×14×8；Flatten 後長度＝14×14×8＝1568。", "per_option": {"A": "卷積後通道數由卷積核數量決定（8），不是輸入的 3。", "B": "正確：28→14，通道 8，14×14×8＝1568。", "C": "16×16 是 same padding 加池化的結果，此處為 valid，尺寸會縮小為 28。", "D": "28×28×8 是池化前的大小，題目有經過池化。"}, "guide_ref": "學習指引 p.4-67～4-71", "hot": true, "detail": {"steps": [["① 卷積後的長寬", "valid 卷積的輸出邊長 ＝ 輸入邊長 − 卷積核邊長 ＋ 1（valid＝不補邊，所以會縮小）", "32 − 5 ＋ 1 ＝ 28，長寬變成 28 × 28"], ["② 卷積後的通道數", "輸出通道數 ＝ 卷積核的個數（和輸入的通道數無關，輸入的通道在每個核裡被加總掉了）", "卷積核有 8 個，所以通道數是 8；形狀變成 28 × 28 × 8（ReLU 不改變形狀）"], ["③ 最大池化後的長寬", "池化輸出邊長 ＝ ⌊(邊長 − 池化視窗邊長) ÷ stride⌋ ＋ 1（⌊ ⌋ 是無條件捨去）；通道數不變", "⌊(28 − 2) ÷ 2⌋ ＋ 1 ＝ 13 ＋ 1 ＝ 14；形狀變成 14 × 14 × 8（長寬減半，通道仍是 8）"], ["④ Flatten 攤平", "Flatten 長度 ＝ 高 × 寬 × 通道數（把立體的特徵圖攤成一條向量）", "14 × 14 × 8 ＝ 196 × 8 ＝ 1,568，選 B"], ["⑤ 對照其他選項（怎麼算錯的）", "每個選項都是少做一個步驟或用錯通道數", "A：14 × 14 × 3 ＝ 196 × 3 ＝ 588，把通道數當成輸入的 3，但卷積後通道數是卷積核個數 8。C：16 × 16 × 8 ＝ 256 × 8 ＝ 2,048，那是 same padding（卷積後仍 32 × 32，池化後 16 × 16）的結果，題目是 valid。D：28 × 28 × 8 ＝ 784 × 8 ＝ 6,272，是池化前的大小，漏算池化"]], "tip": "依序算：valid 卷積邊長 −(核邊長 −1)；池化減半；通道看卷積核數；最後長 × 寬 × 通道。", "fig": {"type": "layers", "title": "每一層的形狀", "items": [{"name": "輸入", "shape": "32×32×3"}, {"name": "Conv 5×5，8 個", "shape": "28×28×8", "note": "valid 不補零：32－5＋1 ＝ 28；通道＝8"}, {"name": "ReLU", "shape": "28×28×8", "note": "只改數值，不改形狀"}, {"name": "MaxPool 2×2", "shape": "14×14×8", "note": "長寬減半，通道不變"}, {"name": "Flatten", "shape": "1,568", "note": "14×14×8 ＝ 1,568", "hl": true}], "note": "Flatten 後向量長度 ＝ 14 × 14 × 8 ＝ 1,568"}}}, {"no": 18, "section": "4.3", "topic_id": "4.3-08", "topic": "ResNet", "style": "比較", "stem": "下列深度卷積網路架構與其核心設計的對應，何者正確？", "options": {"A": "VGG：以 Inception 模組並行使用多種尺寸的卷積核，提取多尺度特徵", "B": "GoogLeNet：每一層都與其後所有層密集連接，以重複使用特徵", "C": "DenseNet：以大量 3×3 卷積核重複堆疊，結構單純規整", "D": "ResNet：以殘差（跳躍）連接把輸入加到區塊輸出，緩解深層網路的退化問題"}, "answer": "D", "explanation": "答案 D。ResNet 的殘差連接讓「輸出＝輸入＋子層(輸入)」，梯度可沿捷徑回傳，使數十到數百層的網路也能訓練。Inception 並行多尺度是 GoogLeNet 的特色；密集連接是 DenseNet；以 3×3 卷積堆疊著稱的是 VGG，A、B、C 三項的名稱與設計互相錯置。", "per_option": {"A": "Inception 並行多尺度屬於 GoogLeNet，不是 VGG。", "B": "密集連接屬於 DenseNet，不是 GoogLeNet。", "C": "大量 3×3 卷積堆疊是 VGG 的特色，不是 DenseNet。", "D": "正確：ResNet 的核心是殘差（跳躍）連接。"}, "guide_ref": "學習指引 p.4-71～4-72；4-81", "hot": true}, {"no": 19, "section": "4.3", "topic_id": "4.3-09", "topic": "RNN 與 LSTM", "style": "情境", "stem": "某團隊用基本 RNN 處理長度達 500 個時間步的感測序列，發現模型幾乎只受最近數十步輸入的影響，序列早期的資訊對預測沒有作用，且訓練損失難以降低。最可能的原因為何？", "options": {"A": "經時間反向傳播（BPTT）時，梯度沿時間步連乘而指數級縮小（梯度消失）", "B": "各時間步共用同一組權重，使模型無法分辨序列中資料的先後順序", "C": "隱藏狀態的維度過大，造成模型記住所有訓練序列而發生嚴重過擬合", "D": "序列太長使輸出層的 Softmax 飽和，因此較早期的輸入資訊被直接丟棄"}, "answer": "A", "explanation": "答案 A。基本 RNN 訓練時把序列沿時間展開成深層網路再反向傳播，梯度要經過很多次連乘，長序列下會指數級衰減（梯度消失），導致早期資訊學不到、損失也降不下來。這正是 LSTM 以門控與細胞狀態來改善的問題。權重共享反而是 RNN 能處理任意長度序列的原因；過擬合會使訓練損失很低，與題述不符。", "per_option": {"A": "正確：BPTT 中梯度連乘衰減，無法捕捉長期依賴。", "B": "權重共享不會讓模型失去順序資訊，順序由隱藏狀態逐步傳遞。", "C": "過擬合的特徵是訓練損失很低，與題目「訓練損失難以降低」矛盾。", "D": "Softmax 位於輸出端，與早期輸入無法影響預測無關。"}, "guide_ref": "學習指引 p.4-72～4-76", "hot": false}, {"no": 20, "section": "4.3", "topic_id": "4.3-18", "topic": "PyTorch 與 JAX", "style": "比較", "stem": "某團隊正在評估各種深度學習框架。關於常見深度學習框架的敘述，下列何者正確？", "options": {"A": "PyTorch 由 Google 開發，採靜態計算圖，須先編譯整張圖才能執行", "B": "PyTorch 採動態計算圖，運算在定義時立即執行，並內建自動微分引擎（Autograd）", "C": "JAX 由 AWS 主要支持，核心特色是多語言綁定與混合式（符號式＋命令式）程式設計", "D": "MXNet 由 Google 開發，定位為結合 NumPy 介面、自動微分與 GPU／TPU 加速的數值計算庫"}, "answer": "B", "explanation": "答案 B。PyTorch 由 Facebook AI Research（FAIR）開發，特色是動態計算圖與內建 Autograd，運算即時執行、除錯直覺。JAX 是 Google 的 NumPy 風格數值計算庫；MXNet 才是 AWS 主要支持、支援混合式程式設計。C、D 把兩者的開發者與特色對調，A 則把 PyTorch 的開發者與計算圖類型都說錯。", "per_option": {"A": "PyTorch 不是 Google 開發，也不是以靜態圖為招牌。", "B": "正確：動態計算圖加 Autograd 是 PyTorch 的招牌。", "C": "多語言綁定與混合式設計是 MXNet 的特色，且 JAX 由 Google 開發。", "D": "NumPy 風格加自動微分與 GPU／TPU 加速的是 JAX，MXNet 主要由 AWS 支持。"}, "guide_ref": "學習指引 p.4-91～4-92", "hot": false}, {"no": 21, "section": "4.3", "topic_id": "4.3-19", "topic": "程式碼閱讀：深度學習", "style": "情境", "stem": "某工程師撰寫如下 PyTorch 訓練迴圈（model、criterion、optimizer 皆已正確建立），訓練多個批次後發現損失不穩定、難以收斂。最可能的原因為何？\n```\nfor x, y in loader:\n    pred = model(x)\n    loss = criterion(pred, y)\n    loss.backward()\n    optimizer.step()\n```", "options": {"A": "loss.backward() 應放在 optimizer.step() 之後，否則梯度尚未計算", "B": "迴圈中未呼叫 model.eval()，導致訓練模式下無法計算梯度", "C": "缺少 optimizer.zero_grad()，PyTorch 預設會累加梯度，使各批次的梯度互相混入", "D": "缺少 loss.item() 轉換，導致 loss.backward() 無法執行"}, "answer": "C", "explanation": "答案 C。PyTorch 的 backward() 會把梯度累加到參數的 .grad 上，若沒有在每個批次前呼叫 optimizer.zero_grad()，舊批次的梯度會混進新批次，更新方向就會錯亂。標準順序是 zero_grad → 前向 → loss → backward → step。", "per_option": {"A": "順序本來就是先 backward 再 step，題目的順序沒有錯。", "B": "model.eval() 是推論時才用；訓練時使用訓練模式才是正確的，且不影響梯度計算。", "C": "正確：缺少 zero_grad，梯度會跨批次累加。", "D": "loss.item() 只是取出數值用來記錄，不影響 backward 的執行。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 梯度為什麼會累加", "不清零時：.grad（新）＝ .grad（舊）＋ 這個批次算出的梯度（backward 是「加到」.grad 上，不是覆蓋）", "舉例（題目沒給數字）：某個參數第 1 批的梯度是 2、第 2 批是 3。沒有 zero_grad：第 2 批更新時用到的是 2 ＋ 3 ＝ 5，混進了第 1 批的舊梯度，而不是 3"], ["② 加上 zero_grad 後", "每批開頭 zero_grad() 把 .grad 歸零，所以 .grad ＝ 0 ＋ 這批梯度", "舉例（題目沒給數字）：第 2 批開頭先歸零，更新用的就是 0 ＋ 3 ＝ 3，只反映這一批。正確順序：zero_grad → 前向 → 算 loss → backward → step，選 C"]], "code": [["for x, y in loader:", "for 迴圈：loader（資料載入器 DataLoader）每次吐出一批資料；x ＝ 這一批的輸入特徵，y ＝ 對應的正確答案（標籤）。每繞一圈處理一個批次（batch）"], ["pred = model(x)", "前向傳播：把這批輸入 x 丟進模型，得到預測值 pred"], ["loss = criterion(pred, y)", "criterion ＝ 損失函數（衡量預測離答案有多遠）。傳入預測 pred 與答案 y，得到一個數字 loss，越大代表預測越差"], ["loss.backward()", "backward ＝ 反向傳播：從 loss 往回算出每個參數的梯度（參數該往哪個方向調、調多少），並把結果「加」到各參數的 .grad 上，不是覆蓋。所以舊梯度如果沒清掉就會累積"], ["optimizer.step()", "optimizer ＝ 優化器（負責更新權重）；step ＝ 走一步：用參數目前的 .grad 更新權重。這段程式缺的是更新前的 optimizer.zero_grad()（zero ＝ 歸零、grad ＝ 梯度：把 .grad 清成 0），導致上一批的梯度被一起拿來更新"]], "tip": "PyTorch 梯度預設會累加：每個批次都要先 zero_grad()，再 backward()、step()。"}}, {"no": 22, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "計算", "stem": "某模型的「月用電量」特徵在訓練集的最小值為 20、最大值為 120，團隊以訓練集的統計量建立 MinMaxScaler。上線後出現一筆用電量為 170 的新資料，經同一個 scaler 轉換後的值為何？", "options": {"A": "1.5", "B": "1.0：scaler 會自動把超出範圍的值截斷在 1", "C": "1.7：170÷100，漏減最小值", "D": "轉換失敗：超出訓練範圍的值會使 scaler 丟出例外"}, "answer": "A", "explanation": "答案 A。Min-Max 公式為 (x−min)÷(max−min)＝(170−20)÷(120−20)＝1.5。scaler 只用訓練集的 min、max 計算，不會截斷，也不會報錯，所以新資料超出訓練範圍時轉換結果可以大於 1 或小於 0（若要限制可設定 clip）。", "per_option": {"A": "正確：(170−20)÷(120−20)＝1.5，可超出 0～1。", "B": "預設不會截斷，超出範圍的值照公式轉換為 1.5。", "C": "170÷100 沒有減去最小值，不是 Min-Max 的公式。", "D": "MinMaxScaler 遇到超出範圍的值不會丟出例外。"}, "guide_ref": "學習指引 p.5-6～5-8", "hot": true, "detail": {"steps": [["① 套用 Min-Max 公式（只用訓練集的最小、最大值）", "轉換值 ＝ (x − 訓練集最小值) ÷ (訓練集最大值 − 訓練集最小值)", "分子：170 − 20 ＝ 150；分母：120 − 20 ＝ 100。（檢查：訓練集的 20 會變 (20 − 20) ÷ 100 ＝ 0、120 會變 (120 − 20) ÷ 100 ＝ 1，所以訓練範圍對應 0～1）"], ["② 相除", "轉換值 ＝ 分子 ÷ 分母", "150 ÷ 100 ＝ 1.5，選 A（170 超出訓練最大值 120，所以結果大於 1；scaler 不會截斷也不會報錯）"], ["③ 對照其他選項（怎麼算錯的）", "預設情況下 MinMaxScaler 照公式轉換，不截斷（clip 預設關閉）、不報錯", "B：若有截斷才會得 1.0，但預設不截斷。C：170 ÷ 100 ＝ 1.7，分子漏減最小值 20（應是 170 − 20 ＝ 150）。D：scaler 只是代公式，超出範圍不會丟例外"]], "tip": "Min-Max 只用訓練集的 min、max；新資料超出訓練範圍，轉換值就會超出 0～1。"}}, {"no": 23, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "情境", "stem": "某財務特徵「單季淨利」呈明顯右偏，且同時包含正值、零與負值。資料科學家希望由資料自動估計最適的冪次轉換參數 λ，使分佈更接近常態，同時不能因負值而報錯。下列哪一種轉換最適當？", "options": {"A": "對數轉換（np.log）：只能處理正值，零與負值會產生無窮大或 NaN", "B": "Box-Cox 轉換：可自動估計 λ，但要求資料必須全為正值", "C": "平方根轉換（np.sqrt）：只能處理非負數，負值會產生 NaN", "D": "Yeo-Johnson 轉換：可自動估計 λ，且能處理零與負值"}, "answer": "D", "explanation": "答案 D。Yeo-Johnson 是 Box-Cox 的延伸，同樣能自動尋找最適冪次，但可以處理零與負值，適合含負值的右偏特徵。Box-Cox 要求資料嚴格為正；np.log 與 np.sqrt 對負值無法計算，也不會自動估計參數。", "per_option": {"A": "np.log 對零與負值無定義，也不會自動找參數。", "B": "Box-Cox 要求全為正值，遇到零或負值會失敗。", "C": "np.sqrt 對負值產生 NaN，也沒有自動估計 λ 的功能。", "D": "正確：Yeo-Johnson 自動估計 λ 且支援零與負值。"}, "guide_ref": "學習指引 p.5-6～5-8", "hot": true}, {"no": 24, "section": "5.1", "topic_id": "5.1-02", "topic": "PCA 與降維", "style": "情境", "stem": "某團隊對 200 個特徵的客戶資料做 PCA，保留前 10 個主成分後訓練流失預測模型，結果預測力不如直接用與流失標籤相關性最高的 10 個原始特徵。下列何者最能解釋此現象？", "options": {"A": "PCA 屬於有監督降維，會先依流失標籤挑選特徵，因此標籤中的雜訊會被一併放大", "B": "主成分之間彼此高度相關，造成嚴重的共線性，因此後續模型的表現變差", "C": "PCA 是無監督方法，依變異量排序主成分而不使用標籤，變異大的方向未必與流失相關", "D": "降維一定會讓預測力下降，因此不應該對任何分類任務使用 PCA 這類降維方法"}, "answer": "C", "explanation": "答案 C。PCA 找的是「資料變異最大的方向」，完全不看標籤，所以前幾個主成分保留的是變異大的資訊，不保證與預測目標相關；有時與標籤最相關的訊號就藏在變異較小的方向。若需要考慮標籤，可改用 LDA 等有監督降維，或直接做特徵選擇。", "per_option": {"A": "PCA 是無監督方法，不會使用標籤；LDA 才是有監督降維。", "B": "主成分彼此正交（不相關），並不會造成共線性。", "C": "正確：PCA 依變異量而非與標籤的關聯性排序。", "D": "降維不一定降低預測力，有時還能降噪，只是需視資料與目標而定。"}, "guide_ref": "學習指引 p.5-6、3-13～3-15", "hot": true}, {"no": 25, "section": "5.1", "topic_id": "5.1-09", "topic": "程式碼閱讀：前處理", "style": "情境", "stem": "下列程式執行後，印出的結果為何？\n```\nimport pandas as pd\ndf = pd.DataFrame({'age': [20, 30, None, 50, 100]})\ndf['age'] = df['age'].fillna(df['age'].median())\nprint(df['age'].mean())\n```", "options": {"A": "40.0：中位數本身", "B": "48.0", "C": "50.0：用平均數填補時才會得到的平均", "D": "nan：遺漏值會使平均數無法計算"}, "answer": "B", "explanation": "答案 B。非遺漏值為 20、30、50、100，中位數＝(30＋50)÷2＝40，遺漏值被填成 40，資料變成 20、30、40、50、100，平均＝240÷5＝48.0。若改用平均數填補，平均才會維持原本的 50.0；pandas 的 mean() 預設會略過遺漏值，而且此時已無遺漏值。", "per_option": {"A": "40.0 是填補值（中位數），不是填補後整欄的平均。", "B": "正確：填補後 (20＋30＋40＋50＋100)÷5＝48.0。", "C": "50.0 是原先非遺漏值的平均，用平均數填補才會維持不變。", "D": "遺漏值已被填補，且 mean() 預設本來就會略過 NaN。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 找出有數值的資料", "median 計算時會略過遺漏值（None）；先排序，個數為偶數時，中位數取中間兩個數的平均", "有數值的是 20、30、50、100，共 4 筆（偶數筆），中間兩個數是 30 與 50"], ["② 算中位數", "中位數 ＝ (中間兩數之和) ÷ 2", "(30 ＋ 50) ÷ 2 ＝ 80 ÷ 2 ＝ 40"], ["③ 用中位數填補遺漏值", "fillna(值)：把每個遺漏值換成括號裡的值", "None 換成 40，這欄變成 20、30、40、50、100"], ["④ 算填補後的平均", "平均 ＝ 總和 ÷ 筆數", "(20 ＋ 30 ＋ 40 ＋ 50 ＋ 100) ÷ 5 ＝ 240 ÷ 5 ＝ 48.0，選 B"], ["⑤ 對照其他選項（怎麼算錯的）", "填補值、填補前的平均、填補後的平均是三個不同的數字", "A：40.0 是填補用的中位數，不是填補後整欄的平均。C：填補前有數值的平均是 (20 ＋ 30 ＋ 50 ＋ 100) ÷ 4 ＝ 200 ÷ 4 ＝ 50；用平均數 50 填補才會讓整欄平均仍是 (200 ＋ 50) ÷ 5 ＝ 50.0，但本題是用中位數。D：遺漏值已被填補，而且 mean() 本來就會略過遺漏值，不會得到 nan"]], "code": [["import pandas as pd", "匯入 pandas（處理表格資料的套件），簡稱 pd"], ["df = pd.DataFrame({'age': [20, 30, None, 50, 100]})", "DataFrame ＝ 表格。建立一個只有 age 一欄、五筆資料的表格；None ＝ 遺漏值（放進表格後會變成 NaN，意思是 Not a Number，「沒有數值」）"], ["df['age'] = df['age'].fillna(df['age'].median())", "由內往外看：df['age'].median() ＝ 算 age 欄的中位數（median ＝ 中位數，自動略過遺漏值），得到 40.0；fillna ＝ fill（填）na（缺值）：把這欄所有遺漏值換成括號內的值；最後把填好的欄位存回 df['age']"], ["print(df['age'].mean())", "mean ＝ 平均數；對填補後的 age 欄算平均（20、30、40、50、100 → 48.0）；print ＝ 把結果印出來"]], "tip": "先看「填什麼」再算平均：用中位數填，整欄平均會被填補值改變；mean() 預設略過遺漏值。"}}, {"no": 26, "section": "5.1", "topic_id": "5.1-09", "topic": "程式碼閱讀：前處理", "style": "情境", "stem": "下列程式執行後，印出的結果為何？\n```\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\ny = pd.Series([0]*180 + [1]*20)\nX = pd.DataFrame({'f': range(200)})\n_, _, _, y_test = train_test_split(X, y, test_size=0.25, stratify=y, random_state=7)\nprint(y_test.value_counts().to_dict())\n```", "options": {"A": "{0: 40, 1: 10}", "B": "{0: 45, 1: 5}", "C": "{0: 50, 1: 0}", "D": "每次執行的比例都不同，無法事先確定"}, "answer": "B", "explanation": "答案 B。test_size＝0.25 使測試集有 50 筆；stratify＝y 讓測試集的類別比例與整體相同（0 類 90%、1 類 10%），因此 0 類 45 筆、1 類 5 筆。分層抽樣保證比例一致，與 random_state 無關。", "per_option": {"A": "{0: 40, 1: 10} 的比例是 80:20，與原資料 90:10 不符。", "B": "正確：50 筆依 90:10 分層，得到 45 與 5。", "C": "全是 0 類代表沒有分層；有了 stratify 就不會發生。", "D": "stratify 會讓比例固定，不會因每次執行而改變。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 算測試集有幾筆", "測試集筆數 ＝ 總筆數 × test_size", "總筆數 ＝ 180 ＋ 20 ＝ 200（y 有 180 個 0、20 個 1）；200 × 0.25 ＝ 50"], ["② 算整體各類別的比例", "類別比例 ＝ 該類筆數 ÷ 總筆數", "0 類：180 ÷ 200 ＝ 0.9；1 類：20 ÷ 200 ＝ 0.1"], ["③ 分層後測試集各類的筆數", "測試集某類筆數 ＝ 測試集筆數 × 該類的整體比例（stratify 就是要求測試集比例與整體一樣）", "0 類：50 × 0.9 ＝ 45；1 類：50 × 0.1 ＝ 5；45 ＋ 5 ＝ 50，印出 {0: 45, 1: 5}，選 B"], ["④ 對照其他選項（怎麼算錯的）", "有 stratify 時比例固定，random_state 只決定「抽到哪幾筆」，不影響每類筆數", "A：{0: 40, 1: 10} 的 1 類比例是 10 ÷ 50 ＝ 0.2（80:20），與整體的 0.1 不符。C：{0: 50, 1: 0} 代表完全沒抽到 1 類，有 stratify 就不會發生。D：比例固定，每次執行都得到 45 與 5"]], "code": [["import pandas as pd", "匯入 pandas（處理表格資料的套件），簡稱 pd"], ["from sklearn.model_selection import train_test_split", "從 sklearn 的 model_selection（模型選擇）模組匯入 train_test_split（把資料切成訓練集與測試集的函式）"], ["y = pd.Series([0]*180 + [1]*20)", "Series ＝ 一欄資料。[0]*180 ＝ 180 個 0 排在一起，+ [1]*20 再接上 20 個 1，共 200 筆標籤：0 占 90%、1 占 10%（不平衡）"], ["X = pd.DataFrame({'f': range(200)})", "建立特徵表格，只有一欄 f，值是 0 到 199（range(200) ＝ 從 0 數到 199 共 200 個數），和 y 的筆數對得上"], ["_, _, _, y_test = train_test_split(X, y, test_size=0.25, stratify=y, random_state=7)", "train_test_split 會回傳四樣東西，順序是 X_train、X_test、y_train、y_test；前三個用底線 _ 表示「不需要」，只留第四個 y_test。參數：test_size=0.25 ＝ 25% 當測試集（50 筆）；stratify=y ＝ 分層抽樣，依 y 的類別比例切，讓測試集的 0:1 也是 9:1；random_state=7 ＝ 固定亂數種子，讓結果可重現（只影響抽到哪幾筆，不影響每類筆數）"], ["print(y_test.value_counts().to_dict())", "value_counts ＝ 數每個值各出現幾次；to_dict ＝ 轉成字典（{值: 次數}）；print 印出，結果是 {0: 45, 1: 5}"]], "tip": "stratify＝讓測試集的類別比例和整體一樣；先算測試集總筆數，再乘各類比例。"}}, {"no": 27, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "情境", "stem": "某醫院的胸部 X 光肺炎偵測 CNN 達到高準確率，但放射科醫師要求系統在每張影像上標示「模型判斷時最關注哪些區域」，以便確認模型沒有依賴影像角落的文字標記。下列哪一種方法最適合？", "options": {"A": "Grad-CAM：利用最後卷積層的梯度產生熱力圖，疊在影像上標示對判斷貢獻較大的區域", "B": "混淆矩陣：呈現整體各類別預測正確與錯誤的數量，無法指出單張影像的關注區域", "C": "偏依圖（PDP）：呈現單一表格特徵與預測輸出的整體關係，並非針對影像區域", "D": "整體特徵重要性：由樹模型輸出各表格特徵的整體重要程度，不適用於影像像素"}, "answer": "A", "explanation": "答案 A。Grad-CAM 是影像模型常用的解釋工具，利用梯度產生熱力圖，直觀看出模型依據影像的哪些區域做判斷，可用來檢查模型是否依賴不該依賴的線索。混淆矩陣只呈現整體表現；PDP 與整體特徵重要性則主要用於表格資料的特徵層級解釋。", "per_option": {"A": "正確：熱力圖標出影像中對判斷貢獻大的區域。", "B": "混淆矩陣只統計整體分類結果，沒有空間資訊。", "C": "PDP 針對表格特徵與輸出的整體關係，不是影像區域。", "D": "整體特徵重要性是全域、表格特徵層級的資訊，不是影像像素層級。"}, "guide_ref": "學習指引 p.5-14～5-15", "hot": true}, {"no": 28, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "否定", "stem": "某醫療與金融團隊正在討論模型的可解釋性。下列敘述何者錯誤？", "options": {"A": "淺層決策樹的分割規則可以直接檢視，屬於高解釋性模型", "B": "LIME 在單筆樣本附近以簡單模型近似黑盒模型的行為，屬於局部解釋", "C": "偏依圖（PDP）呈現某個特徵與預測輸出之間的整體關係，屬於全域解釋", "D": "隨機森林提供的整體特徵重要性，足以說明某位特定客戶為何被拒絕貸款"}, "answer": "D", "explanation": "答案 D。整體特徵重要性反映的是「哪些特徵對模型整體預測比較重要」，無法回答單一客戶為什麼被拒絕；要解釋單筆預測，應使用 SHAP、LIME 等局部解釋工具。淺層決策樹的規則可直接閱讀；LIME 為局部近似；PDP 呈現特徵與輸出的整體趨勢。", "per_option": {"A": "敘述正確：淺層決策樹屬高解釋性模型。", "B": "敘述正確：LIME 是局部解釋方法。", "C": "敘述正確：PDP 是全域解釋工具。", "D": "錯誤：整體特徵重要性是全域資訊，無法解釋個案。"}, "guide_ref": "學習指引 p.5-14～5-15", "hot": true}, {"no": 29, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "情境", "stem": "某團隊以 5 折交叉驗證比較 40 組超參數組合，挑出平均分數最高的一組（0.91），並直接對外宣稱「模型上線後的預期準確率為 0.91」。下列評論何者最恰當？", "options": {"A": "這是合理的做法，因為交叉驗證已讓每筆資料都輪流當過驗證集，所以分數不會偏高", "B": "應把折數改為 LOOCV（留一法），這樣得到的分數就能視為上線表現的不偏估計", "C": "該分數是 40 組中挑出的最高值而偏樂觀，應另用從未參與調參的獨立測試集估計", "D": "只要把折數由 5 提高到 20，挑選最高分數所造成的偏樂觀問題就會完全消失"}, "answer": "C", "explanation": "答案 C。從許多組候選中挑最高分，等於在驗證分數上做了選擇，最高分往往含有運氣成分而高估真實表現（選擇偏誤）。要得到可信的最終估計，應保留一份從未參與調參的獨立測試集，或使用巢狀交叉驗證（外層估計效能、內層調參）。改折數無法消除這種偏誤。", "per_option": {"A": "輪流當驗證集不能消除「挑最高分」造成的樂觀偏誤。", "B": "LOOCV 只是改變切分方式，同樣有挑選最高分的偏誤。", "C": "正確：需要未參與調參的資料或巢狀交叉驗證來估計最終效能。", "D": "增加折數不能解決選擇偏誤，而且會增加運算成本。"}, "guide_ref": "學習指引 p.5-17～5-18、5-26～5-29", "hot": true}, {"no": 30, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "情境", "stem": "某醫療團隊要用 2,000 張皮膚影像訓練分類模型，這些影像來自 300 位病患，同一位病患平均有 6～7 張。若直接使用一般的隨機 K 折交叉驗證，驗證分數遠高於上線後的實際表現。下列哪一種驗證方式最能避免此問題？", "options": {"A": "分層 K 折（StratifiedKFold）：維持每折的類別比例，但不保證同一病患的影像都在同一折", "B": "分組 K 折（GroupKFold）：以病患編號分組，確保同一病患的影像不會同時出現在訓練折與驗證折", "C": "重複 K 折（Repeated K-fold）：多次隨機重切後平均，降低切分隨機波動，但仍可能把同一病患拆到不同折", "D": "留一法（LOOCV）：每次只留一張影像驗證，同一病患的其他影像仍留在訓練集"}, "answer": "B", "explanation": "答案 B。同一病患的影像高度相似，若分散在訓練折與驗證折，模型等於「認得這個人」，驗證分數會虛高（組內洩漏）。GroupKFold 以病患為單位切分，確保同一病患只出現在其中一邊，才能模擬面對全新病患的情況。分層、重複 K 折與 LOOCV 都沒有處理分組問題。", "per_option": {"A": "分層只管類別比例，不處理同一病患跨折的問題。", "B": "正確：依病患分組切分，避免病患資訊同時出現在兩邊。", "C": "重複 K 折仍是隨機切分，同一病患依然可能跨折。", "D": "LOOCV 每次只留一張，同一病患的其他影像仍在訓練集，洩漏更嚴重。"}, "guide_ref": "學習指引 p.5-17～5-18（GroupKFold 指引未載，依 sklearn 文件）", "hot": true}, {"no": 31, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "情境", "stem": "某工廠的瑕疵分類模型要分辨「正常」「輕微瑕疵」「嚴重瑕疵」三類。測試集 1,000 筆中三類依序有 800、150、50 筆，各類召回率依序為 0.99、0.80、0.20。管理層要求評估指標不能被樣本數多的類別掩蓋，嚴重瑕疵的漏檢要同等被看見。下列哪一個指標最符合此要求？", "options": {"A": "整體準確率（Accuracy）：所有預測正確的比例，約 0.92", "B": "加權平均召回率（Weighted-average Recall）：依各類樣本數加權，約 0.92", "C": "宏平均召回率（Macro-average Recall）：各類召回率直接簡單平均，約 0.66", "D": "僅報告「正常」類的召回率：0.99"}, "answer": "C", "explanation": "答案 C。整體準確率與加權平均召回率都由多數類主導：(792＋120＋10)÷1000＝0.922，掩蓋了嚴重瑕疵召回率只有 0.20 的問題。宏平均是各類召回率直接平均 (0.99＋0.80＋0.20)÷3≈0.66，每一類權重相同，少數類表現差會明顯拉低分數。", "per_option": {"A": "整體準確率被多數類主導，約 0.92，看不出少數類的問題。", "B": "加權平均依樣本數加權，等於讓多數類主導，約 0.92。", "C": "正確：宏平均讓每個類別權重相同，少數類的漏檢會被看見。", "D": "只看正常類召回率完全忽略了瑕疵類別。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true}, {"no": 32, "section": "5.3", "topic_id": "5.3-03", "topic": "學習曲線判讀", "style": "情境", "stem": "某團隊調整決策樹的最大深度 max_depth，記錄訓練與驗證準確率如下：\n深度 2：訓練 0.78／驗證 0.76\n深度 4：訓練 0.86／驗證 0.83\n深度 6：訓練 0.92／驗證 0.88\n深度 8：訓練 0.97／驗證 0.86\n深度 10：訓練 0.995／驗證 0.82\n深度 12：訓練 1.00／驗證 0.79\n若以泛化能力為準，應選擇哪個深度，理由為何？", "options": {"A": "深度 2：訓練與驗證準確率最接近，代表模型最穩定", "B": "深度 6：驗證準確率最高，之後訓練準確率持續上升而驗證準確率下滑", "C": "深度 10：訓練準確率接近滿分，代表模型已充分學到資料規律", "D": "深度 12：訓練準確率達到 1.00，代表模型表現最佳"}, "answer": "B", "explanation": "答案 B。要看驗證準確率而不是訓練準確率：驗證準確率在深度 6 達到最高 0.88，之後深度繼續增加，訓練準確率升到接近 1，驗證卻下滑，代表開始過擬合。深度 2 雖然落差最小，但驗證準確率只有 0.76，屬於欠擬合。", "per_option": {"A": "落差小但整體準確率低，是欠擬合，不是最佳選擇。", "B": "正確：驗證準確率最高的轉折點就是最佳深度。", "C": "訓練準確率接近滿分但驗證下滑，是過擬合的徵兆。", "D": "訓練準確率 1.00 且驗證最低，是最嚴重的過擬合。"}, "guide_ref": "學習指引 p.5-19～5-20", "hot": true}, {"no": 33, "section": "5.3", "topic_id": "5.3-04", "topic": "殘差分析", "style": "情境", "stem": "某工程師以線性迴歸預測各店面月營收，殘差圖顯示：預測營收愈高，殘差的散布範圍愈寬，整體呈喇叭形。為使殘差的變異更均勻，下列哪一種處理最常被採用？", "options": {"A": "加入特徵的二次項或交互作用項：主要用來修正殘差呈 U 形的非線性問題", "B": "將資料依時間排序並改用時間序列模型：主要用來處理殘差自相關", "C": "對目標變數取對數（Log）等變數穩定轉換，壓縮高值區的離散程度", "D": "刪除殘差最大的前 5% 樣本：只適用於少數離群值造成的問題"}, "answer": "C", "explanation": "答案 C。喇叭形代表殘差變異數隨預測值增大而增加（異質變異），常見於營收、價格這類愈大愈分散的目標。對目標取對數可壓縮高值區的離散程度，使殘差變異更均勻。二次項是針對 U 形的非線性；時間序列模型是處理自相關；刪除極端點只針對少數離群值。", "per_option": {"A": "二次項針對的是殘差系統性彎曲，不是散布寬度變化。", "B": "時間序列模型針對的是殘差彼此相關，不是喇叭形。", "C": "正確：對目標取 Log 可讓變異數趨於一致。", "D": "喇叭形是整體散布隨預測值變寬，不是少數離群點，刪除無法解決。"}, "guide_ref": "學習指引 p.5-24", "hot": true}, {"no": 34, "section": "5.3", "topic_id": "5.3-05", "topic": "迴歸評估指標", "style": "情境", "stem": "某團隊在測試集上評估房價迴歸模型，報告顯示 R²＝−0.35。下列對此數值的解讀，何者最正確？", "options": {"A": "模型在測試集上的預測，比直接以測試集目標平均值當預測還要差", "B": "模型解釋了 35% 的房價變異，只是解釋的方向相反", "C": "R² 不可能為負值，這表示計算過程中一定出現了錯誤", "D": "模型預測的平均誤差為 −35%，代表模型有系統性低估"}, "answer": "A", "explanation": "答案 A。R²＝1−RSS÷TSS，TSS 代表「直接猜平均值」的誤差平方和。R²＝0 表示與猜平均值一樣好；R² 為負表示 RSS 比 TSS 還大，也就是模型比直接猜平均值更差。R² 在測試集上是可能為負的，並不是準確率，也不是誤差百分比。", "per_option": {"A": "正確：R² 為負＝比猜平均值還差。", "B": "R² 衡量的是解釋變異的比例，負值不是「方向相反的解釋力」。", "C": "在測試集上 R² 可以為負，不代表一定是計算錯誤。", "D": "R² 不是誤差百分比，也不能解讀成系統性低估。"}, "guide_ref": "學習指引 p.5-22～5-24", "hot": true}, {"no": 35, "section": "5.3", "topic_id": "5.3-09", "topic": "資料洩漏與 Pipeline", "style": "情境", "stem": "某團隊要預測房價，先對全部資料依「城市」計算平均房價並將其作為新特徵（Target Encoding），之後才切分訓練集與測試集並評估。模型測試表現極佳，上線後卻大幅退步。最可能的原因為何？", "options": {"A": "城市欄位是類別型特徵，一定要改用 One-hot 編碼，否則模型根本無法使用它", "B": "編碼值是用包含測試資料在內的目標值（房價）算出，測試集的答案提前滲入特徵，造成資料洩漏", "C": "Target Encoding 一定會使特徵維度爆炸，因此造成模型嚴重過擬合", "D": "切分前應先對全部資料做標準化，才能讓訓練集與測試集的分佈完全一致"}, "answer": "B", "explanation": "答案 B。Target Encoding 會用到目標值。若在切分前用全部資料計算城市平均房價，測試集房價的資訊就已混進特徵，測試分數被高估，這是資料洩漏。正確做法是只用訓練資料（交叉驗證時是每折的訓練部分）計算編碼，再套用到驗證／測試資料。切分前對全資料做標準化也同樣是洩漏。", "per_option": {"A": "類別特徵有多種編碼方式，並非一定要 One-hot，也不是此題的問題。", "B": "正確：目標值資訊從測試集洩漏進特徵。", "C": "Target Encoding 產生一個數值欄位，不會造成維度爆炸。", "D": "切分前對全資料標準化本身就是洩漏，不是解法。"}, "guide_ref": "指引未載", "hot": false}, {"no": 36, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "情境", "stem": "某團隊以封閉解訓練線性迴歸，因多個特徵高度共線，XᵀX 接近奇異（行列式趨近 0），反矩陣數值極不穩定。改用 Ridge 迴歸（解為 (XᵀX＋λI)⁻¹Xᵀy，λ＞0）後即可穩定求解。其主要原因為何？", "options": {"A": "L1 範數項會把部分特徵的權重壓成 0，因此直接移除了共線的特徵", "B": "懲罰項使所有權重精確變為 0，XᵀX 因此不再參與運算", "C": "在 XᵀX 的對角線加上 λI，使矩陣變得可逆且數值穩定", "D": "懲罰項會先對特徵做標準化，因此共線性自然消失"}, "answer": "C", "explanation": "答案 C。Ridge 的 L2 懲罰使解變成 (XᵀX＋λI)⁻¹Xᵀy，在 XᵀX 的對角線加上 λ，讓矩陣變成正定而可逆，條件數也大幅改善，所以即使特徵共線也能穩定求解。把權重壓成 0 的是 L1（Lasso）；L2 只讓權重變小、不歸零；正則化也不會自動做標準化。", "per_option": {"A": "歸零權重的是 L1，而 Ridge 使用的是 L2 懲罰。", "B": "L2 只讓權重變小，不會精確變為 0，且 XᵀX 仍參與運算。", "C": "正確：加上 λI 使矩陣可逆、穩定。", "D": "正則化不包含標準化，標準化也無法消除完全共線。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true}, {"no": 37, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "情境", "stem": "某工程師使用 sklearn 的 LogisticRegression(penalty='l2', C=1.0) 訓練，出現明顯過擬合（訓練 AUC 0.99、驗證 AUC 0.78），想要加強正則化的力道。下列調整何者最恰當？", "options": {"A": "將 C 調大為 100，使懲罰項的權重提高", "B": "將 C 調小為 0.01，因為 C 與正則化強度成反比", "C": "將 penalty 改為 None，讓模型自行決定權重的大小", "D": "將 max_iter 調大，讓最佳化器多跑幾輪以收斂"}, "answer": "B", "explanation": "答案 B。sklearn 的 LogisticRegression 以 C 表示正則化強度的「倒數」，C 越小、正則化越強。要加強正則化應把 C 調小（如 0.01）。調大 C 會放鬆限制，使過擬合更嚴重；取消懲罰項（None）等於不正則化；max_iter 只影響最佳化迭代次數。", "per_option": {"A": "C 調大反而減弱正則化，會加重過擬合。", "B": "正確：C 是正則化強度的倒數，調小 C 才是加強正則化。", "C": "penalty 設為 None 就是取消正則化，與目標相反。", "D": "max_iter 控制迭代次數，與正則化強度無關。"}, "guide_ref": "學習指引 p.5-42～5-45（參數 C 指引未載，依 sklearn 文件）", "hot": true}, {"no": 38, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "情境", "stem": "某團隊只有 200 筆樣本，卻有 5,000 個特徵；線性模型的訓練集 R² 接近 1.0，驗證集 R² 卻只有 0.1。下列哪一種處理最能直接緩解此過擬合？", "options": {"A": "先做特徵選擇或降維，並搭配 L1／L2 正則化，降低模型的自由度", "B": "加入特徵的多項式與交互作用項，讓模型有更多資訊可以學習", "C": "增加訓練輪數，直到訓練集上的誤差降為 0 為止", "D": "移除驗證集，把全部資料都用於訓練，藉此增加可用的樣本數"}, "answer": "A", "explanation": "答案 A。特徵遠多於樣本時，模型很容易把訓練資料的雜訊都背下來。減少特徵（特徵選擇或降維）並加上 L1／L2 正則化，能降低模型複雜度，是直接對症的做法。增加特徵或多項式項只會讓模型更複雜；訓練到誤差為零是在加重過擬合；移除驗證集則失去監控過擬合的依據。", "per_option": {"A": "正確：降低特徵維度並正則化，限制模型自由度。", "B": "增加特徵與交互作用會使模型更複雜，加重過擬合。", "C": "訓練到誤差為 0 等於完全記住訓練資料。", "D": "移除驗證集無法改善過擬合，還讓問題更難被發現。"}, "guide_ref": "學習指引 p.5-45～5-46", "hot": true}, {"no": 39, "section": "5.4", "topic_id": "5.4-03", "topic": "學習率", "style": "計算", "stem": "某團隊使用階梯式學習率遞減（Step Decay）：初始學習率 0.1，每經過 10 個 epoch 就乘以 0.5。已完成 25 個 epoch 後，下一個 epoch 所使用的學習率為何？", "options": {"A": "0.0125：誤以為已遞減三次", "B": "0.0177：誤用連續指數 0.1×0.5^(25/10)", "C": "0.05：只遞減一次", "D": "0.025"}, "answer": "D", "explanation": "答案 D。Step Decay 是每滿 10 個 epoch 才遞減一次，不是連續變化。已完成 25 個 epoch，共經過 floor(25÷10)＝2 次遞減，學習率＝0.1×0.5²＝0.025。", "per_option": {"A": "0.0125 是遞減三次的結果，但只經過兩個完整的 10 epoch。", "B": "0.0177 是把遞減當成連續函數計算，階梯式遞減並非如此。", "C": "0.05 只遞減一次，但已完成 25 個 epoch，包含兩個完整的 10 epoch。", "D": "正確：0.1×0.5²＝0.025。"}, "guide_ref": "學習指引 p.5-19、5-31～5-32", "hot": true, "detail": {"steps": [["① 算已遞減幾次", "遞減次數 ＝ ⌊已完成 epoch 數 ÷ 每幾個 epoch 遞減一次⌋（⌊ ⌋ 是無條件捨去，要「滿」一個區間才算一次）", "25 ÷ 10 ＝ 2.5，捨去得 2 次（第 10 個與第 20 個 epoch 結束時各減一次，第 30 個還沒到）"], ["② 算學習率", "學習率 ＝ 初始學習率 × 衰減倍率^遞減次數", "0.1 × 0.5² ＝ 0.1 × 0.25 ＝ 0.025，選 D"], ["③ 對照其他選項（怎麼算錯的）", "選項分別用了錯的遞減次數，或誤用連續公式", "A：0.1 × 0.5³ ＝ 0.1 × 0.125 ＝ 0.0125，是遞減三次，但 25 個 epoch 只滿兩個 10。B：0.1 × 0.5^(25 ÷ 10) ＝ 0.1 × 0.5^2.5 ≈ 0.1 × 0.1768 ≈ 0.0177，是把遞減當成連續變化。C：0.1 × 0.5¹ ＝ 0.05，只減了一次"]], "tip": "Step Decay 是「滿一個區間才減一次」的階梯：次數＝⌊epoch ÷ 區間⌋。"}}, {"no": 40, "section": "5.4", "topic_id": "5.4-04", "topic": "資料增強", "style": "否定", "stem": "某團隊在訓練影像分類模型時統一加入「隨機水平翻轉」的資料增強。下列哪一個任務最不適合使用此增強方式？", "options": {"A": "花卉品種分類：花朵左右翻轉後仍然是同一個品種，標籤不變", "B": "交通標誌分類（含向左轉與向右轉）：翻轉後語意與標籤會互相對調", "C": "貓狗分類：動物左右翻轉後仍然是同一種動物，類別標籤不變", "D": "水果成熟度分級：水果左右翻轉後，成熟度的判斷結果不會改變"}, "answer": "B", "explanation": "答案 B。資料增強的前提是變換不能改變標籤語意。「向左轉」標誌水平翻轉後看起來就是「向右轉」標誌，卻仍帶著原來的標籤，等於餵給模型錯誤答案。花卉、貓狗與水果的類別不會因左右翻轉而改變，適合使用。", "per_option": {"A": "花卉品種不因左右翻轉改變。", "B": "正確：翻轉會使方向性標誌的語意與標籤互換，產生錯誤標籤。", "C": "貓狗類別與左右方向無關。", "D": "成熟度由顏色與外觀決定，與左右方向無關。"}, "guide_ref": "學習指引 p.5-9、5-47", "hot": true}, {"no": 41, "section": "5.4", "topic_id": "5.4-05", "topic": "模型量化", "style": "情境", "stem": "某團隊在單張 GPU 上訓練大型影像模型，常因顯示記憶體不足而中斷，且每個 epoch 耗時過長。他們的目標是「加快訓練並節省訓練時的記憶體」，並不是縮小最終部署的模型檔。下列哪一種技術最符合此目標？", "options": {"A": "訓練後量化（Post-training Quantization）：把訓練完成的權重轉為低位元整數，主要用來縮小部署模型", "B": "剪枝（Pruning）：移除不重要的權重以縮小模型，通常在訓練完成後進行", "C": "混合精度訓練（Mixed Precision Training）：訓練時同時使用 FP16 與 FP32，並搭配梯度縮放", "D": "知識蒸餾（Knowledge Distillation）：以大模型的輸出指導小模型，目的是取得較小的模型"}, "answer": "C", "explanation": "答案 C。混合精度訓練在訓練過程中同時使用 FP16 與 FP32，可加速運算並節省記憶體，需要硬體支援與梯度縮放，目標是「加速訓練」。量化、剪枝與蒸餾都屬於模型壓縮，目的是縮小或加速部署用的模型，而不是加速訓練本身。", "per_option": {"A": "訓練後量化是在訓練完成之後才進行，不能加速訓練。", "B": "剪枝通常在訓練後移除權重，主要用來縮小模型。", "C": "正確：混合精度訓練的目標就是加速訓練與節省記憶體。", "D": "蒸餾需要先有大模型，目的是得到小模型，反而增加訓練工作。"}, "guide_ref": "學習指引 p.5-51～5-52", "hot": false}, {"no": 42, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "情境", "stem": "三家醫院各自持有私密的月度病患人數，希望共同算出三家的總人數；任何一家都不得得知另外兩家的原始數字，也不依賴任何集中式的運算伺服器。下列哪一種技術最符合這個需求？", "options": {"A": "聯邦學習（Federated Learning）：資料留在本地訓練模型，只回傳模型參數更新，目的在建立共同的模型", "B": "同態加密（Homomorphic Encryption）：資料加密後交給單一伺服器直接運算，解密後得到結果", "C": "差分隱私（Differential Privacy）：在結果中加入精心設計的噪聲，使個別資料難以被辨識", "D": "安全多方計算（MPC）：多方在不揭露各自輸入的前提下，共同算出函數結果"}, "answer": "D", "explanation": "答案 D。安全多方計算讓多個參與者各自持有秘密輸入，在不揭露輸入的前提下共同算出某個函數（如總和）的結果，不需要可信的第三方或集中伺服器。聯邦學習的目的是共同訓練模型；同態加密仰賴單一伺服器對密文運算；差分隱私是在結果加噪聲，並不提供「多方共同計算」。（補充：官方指引未專章介紹 MPC，屬延伸觀念；本題從「多方各自保密輸入、共同算出結果、沒有集中伺服器」即可判斷。）", "per_option": {"A": "聯邦學習用來共同訓練模型，傳的是模型參數更新，不是計算總和。", "B": "同態加密需要單一伺服器對密文運算，與「不依賴集中式伺服器」不符。", "C": "差分隱私是加噪聲保護個人，會使總和不精確，也不是多方共同計算的協定。", "D": "正確：MPC 讓多方在不揭露輸入下共同算出結果。"}, "guide_ref": "學習指引 p.6-10～6-12（MPC 指引未詳述）", "hot": true}, {"no": 43, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "情境", "stem": "某平台以差分隱私（Differential Privacy）發佈各行政區的平均薪資統計，隱私預算參數 ε 原為 5。為了加強對個人的保護，資料團隊將 ε 調降為 0.5。下列敘述何者最正確？", "options": {"A": "加入的噪聲變大，個人隱私保護更強，但統計結果的準確度下降", "B": "加入的噪聲變小，個人隱私保護減弱，但統計結果更準確", "C": "噪聲大小不變，ε 只決定資料傳輸時加密的位元長度", "D": "隱私保護與準確度可以同時提高，因為 ε 越小代表演算法越精確"}, "answer": "A", "explanation": "答案 A。差分隱私的 ε 越小，代表允許的隱私洩漏越少，需要加入更多噪聲，個人資料更難被推斷，但發佈的統計結果也更不準確，這是隱私與資料效用之間的取捨。因此 ε 由 5 降到 0.5，噪聲變大、隱私更強、準確度下降。", "per_option": {"A": "正確：ε 變小＝噪聲變大、隱私更強、準確度下降。", "B": "方向剛好相反：噪聲變小對應的是 ε 變大、隱私保護減弱。", "C": "ε 控制的是噪聲大小與隱私預算，與加密位元長度無關。", "D": "隱私與準確度是相互取捨的，無法同時提高。"}, "guide_ref": "學習指引 p.6-10～6-12（ε 取捨為通用知識，指引未詳述）", "hot": true}, {"no": 44, "section": "6.2", "topic_id": "6.2-01", "topic": "偏見類型與成因", "style": "情境", "stem": "某臉部辨識系統在整體測試集上的準確率達 98%，但對某一膚色群體的誤判率高達 15%。稽核發現：各膚色群體在訓練資料中的比例已與目標人口一致，且標註皆經多位標註者交叉複核、判斷一致。此偏見最可能來自下列何者？", "options": {"A": "取樣偏差（Sampling Bias）：訓練樣本沒有涵蓋目標群體中的部分族群", "B": "模型層面的偏見：目標函數只追求整體平均準確率，沒有公平性約束，少數群體的誤差被平均掉", "C": "標籤偏差（Label Bias）：標註者的主觀判斷或刻板印象被帶進標籤", "D": "資料量過大導致模型過擬合，使各群體的表現不一致"}, "answer": "B", "explanation": "答案 B。偏見可能來自資料，也可能來自模型。題目已排除取樣偏差（比例一致）與標籤偏差（標註一致），剩下的是模型層面：目標函數只優化整體平均準確率，沒有公平性約束時，少數群體的較高錯誤率會被平均數掩蓋，仍可能受到犧牲。資料量大與過擬合並不是偏見類型。", "per_option": {"A": "題目已說明群體比例與目標人口一致，不是取樣偏差。", "B": "正確：資料沒問題時，只追求整體平均的目標函數也會造成不公平。", "C": "標註已被多人交叉複核且一致，不是標籤偏差。", "D": "過擬合是技術問題，不是偏見的類型，也不能解釋特定群體的落差。"}, "guide_ref": "學習指引 p.6-14～6-17", "hot": true}, {"no": 45, "section": "6.2", "topic_id": "6.2-05", "topic": "去偏方法", "style": "情境", "stem": "某貸款評分模型的通過門檻為 60 分。稽核發現 B 群體的分數系統性偏低：同樣是 60 分，B 群體的實際還款率明顯高於 A 群體。公司決定不更動門檻（全體仍為 60 分）、也不重新訓練模型，而是將 B 群體的分數校正（例如原 60 分調整為 65 分），讓相同分數在各群體代表相同的違約風險。這屬於下列哪一類去偏方法？", "options": {"A": "後處理（Post-processing）中的結果校準：門檻不動，改變分數的意義或數值", "B": "後處理（Post-processing）中的門檻調整：對不同群體設定不同的通過門檻", "C": "前處理（Pre-processing）中的重新抽樣：調整訓練資料中各群體的樣本比例", "D": "模型內處理（In-processing）中的公平性正規化：在損失函數加入公平性懲罰項"}, "answer": "A", "explanation": "答案 A。去偏依介入時機分為前處理（改資料）、模型內處理（改訓練）與後處理（改輸出）。題目沒有動資料也沒有重新訓練，而是在輸出階段調整分數、門檻維持不變，屬於後處理中的「結果校準」。若改成對各群體設定不同門檻（如 B 群體 55 分通過），才是「門檻調整」。", "per_option": {"A": "正確：不動門檻、只調整分數，屬後處理的結果校準。", "B": "門檻調整是改變各群體的通過標準，題目的門檻並未改變。", "C": "重新抽樣需要重新處理資料並再訓練，題目明確說不重新訓練。", "D": "公平性正規化發生在訓練階段，題目不重新訓練模型。"}, "guide_ref": "學習指引 p.6-20～6-23", "hot": false}, {"no": 46, "section": "X", "topic_id": "X-01", "topic": "參數量與運算量", "style": "計算", "stem": "下列 Keras 模型的總可訓練參數量為何？\n```\nmodel = Sequential([\n    Input(shape=(100,)),\n    Embedding(10000, 16),\n    GlobalAveragePooling1D(),\n    Dense(8, activation='relu'),\n    Dense(1, activation='sigmoid')\n])\n```", "options": {"A": "160,136：漏算了 Dense 層的偏差", "B": "170,145：誤以為嵌入向量也有偏差", "C": "160,145", "D": "16,000,145：誤把輸入序列長度 100 乘進嵌入層"}, "answer": "C", "explanation": "答案 C。Embedding(10000, 16) 的參數＝10000×16＝160,000（與序列長度無關，也沒有偏差）；Input 與 GlobalAveragePooling1D 都沒有可訓練參數；Dense(8)＝16×8＋8＝136；Dense(1)＝8×1＋1＝9。總計 160,000＋136＋9＝160,145。", "per_option": {"A": "160,136 漏算了兩個 Dense 層的偏差（8＋1＝9）。", "B": "嵌入層是查表，沒有偏差項，不能算成 10000×17。", "C": "正確：160,000＋136＋9＝160,145。", "D": "嵌入層的參數只取決於詞彙表大小與嵌入維度，序列長度不影響參數量。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① Embedding 層", "嵌入層參數 ＝ 詞彙表大小 × 嵌入維度（等於一張查詢表，沒有偏差項，也和序列長度無關）", "10,000 × 16 ＝ 160,000"], ["② Input 與 GlobalAveragePooling1D", "只改變形狀或取平均，沒有可學習的權重，參數量 ＝ 0", "Input 只是宣告形狀；GlobalAveragePooling1D 把序列中每個詞的向量逐維度取平均，輸出長度 16 的向量。兩者參數都是 0"], ["③ 第一個 Dense 層", "Dense 參數 ＝ 輸入數 × 輸出數 ＋ 輸出數（最後一項是偏差，每個輸出神經元各一個）", "輸入 16（池化輸出的長度）、輸出 8：16 × 8 ＋ 8 ＝ 128 ＋ 8 ＝ 136"], ["④ 第二個 Dense 層", "同一條 Dense 公式", "輸入 8、輸出 1：8 × 1 ＋ 1 ＝ 9"], ["⑤ 全部相加", "總參數 ＝ 各層參數相加", "160,000 ＋ 0 ＋ 0 ＋ 136 ＋ 9 ＝ 160,145，選 C"], ["⑥ 對照其他選項（怎麼算錯的）", "選項分別漏掉偏差、多算偏差，或誤乘序列長度", "A：兩個 Dense 都沒算偏差：16 × 8 ＋ 8 × 1 ＝ 128 ＋ 8 ＝ 136，160,000 ＋ 136 ＝ 160,136，少了 8 ＋ 1 ＝ 9 個偏差。B：把嵌入層誤當有偏差，10,000 × (16 ＋ 1) ＝ 170,000，170,000 ＋ 136 ＋ 9 ＝ 170,145。D：10,000 × 16 × 100 ＝ 16,000,000，再加 145 ＝ 16,000,145，誤把序列長度乘進去（序列長度不增加參數）"]], "code": [["model = Sequential([", "Sequential ＝ 依序堆疊：把各層由上到下串成一條流水線，資料依序流過每一層"], ["Input(shape=(100,))", "宣告輸入形狀：每筆資料是長度 100 的向量（100 個詞的編號）。它只是宣告，不是真的一層，沒有參數"], ["Embedding(10000, 16)", "嵌入層：詞彙表有 10,000 個詞，每個詞對應一個長度 16 的向量（查表）。輸入 100 個詞編號，輸出形狀是 (100, 16)；參數 ＝ 10,000 × 16 ＝ 160,000"], ["GlobalAveragePooling1D()", "Global ＝ 全部、Average ＝ 平均、Pooling ＝ 池化（把資訊彙整縮小）、1D ＝ 一維序列：把 100 個詞的向量逐維度取平均，變成一條長度 16 的向量。沒有參數"], ["Dense(8, activation='relu')", "Dense ＝ 全連接層，有 8 個神經元，每個神經元連到全部 16 個輸入；activation='relu' ＝ 輸出再過 ReLU（負數變 0、正數不變）。參數 ＝ 16 × 8 ＋ 8 ＝ 136"], ["Dense(1, activation='sigmoid')", "1 個神經元；sigmoid 把輸出壓到 0～1 之間，當成二元分類的機率。參數 ＝ 8 × 1 ＋ 1 ＝ 9"]], "tip": "Embedding＝詞彙表 × 維度（無偏差）；Dense＝輸入 × 輸出 ＋ 輸出；池化、Input 為 0。", "fig": {"type": "layers", "title": "每一層的形狀與參數", "items": [{"name": "Input", "shape": "100", "note": "100 個詞的編號，沒有參數"}, {"name": "Embedding", "shape": "100×16", "note": "參數 10,000×16 ＝ 160,000（無偏差）"}, {"name": "GlobalAvgPool", "shape": "16", "note": "逐維度取平均，沒有參數"}, {"name": "Dense(8)", "shape": "8", "note": "參數 16×8＋8 ＝ 136"}, {"name": "Dense(1)", "shape": "1", "note": "參數 8×1＋1 ＝ 9"}], "note": "總參數 ＝ 160,000 ＋ 0 ＋ 136 ＋ 9 ＝ 160,145"}}}, {"no": 47, "section": "X", "topic_id": "X-02", "topic": "時間序列驗證", "style": "情境", "stem": "某電商的需求預測模型，團隊判斷三年前的資料已不具代表性，希望每次驗證都「只用最近 12 個月的資料訓練，再預測緊接著的下一個月」，並隨時間往後推移進行多次驗證。下列哪一種做法最符合？", "options": {"A": "滾動視窗驗證（Rolling Window）：訓練視窗長度固定，逐折往後滑動，訓練資料永遠是最近一段", "B": "擴張視窗驗證（Expanding Window）：訓練起點固定，訓練集隨折數增加愈來愈大", "C": "分層 K 折交叉驗證：維持每折的類別比例，並在隨機打亂資料後再切分", "D": "留一法交叉驗證：每次只留一筆資料當驗證，其餘所有資料都用於訓練"}, "answer": "A", "explanation": "答案 A。「訓練視窗固定為最近 12 個月、逐折往後滑動」正是滾動視窗驗證，能反映資料環境隨時間改變（概念漂移）。擴張視窗的訓練集會越來越大、包含很舊的資料；分層 K 折與留一法都會打亂時間順序，讓未來資料進入訓練集而造成洩漏。", "per_option": {"A": "正確：固定長度視窗往後滑動，訓練的總是最近資料。", "B": "擴張視窗保留所有舊資料，訓練集愈來愈大，不符合只用最近 12 個月。", "C": "分層 K 折會隨機打亂，破壞時間順序並造成洩漏。", "D": "留一法同樣讓未來資料進入訓練集，且每次訓練包含舊資料。"}, "guide_ref": "指引未載", "hot": true}, {"no": 48, "section": "X", "topic_id": "X-02", "topic": "時間序列驗證", "style": "否定", "stem": "某團隊要替每日銷量這類時間序列資料設計模型驗證流程。下列敘述何者錯誤？", "options": {"A": "驗證資料的時間點必須晚於訓練資料，才能模擬「用過去預測未來」", "B": "只要採用分層 K 折（Stratified K-Fold），即使資料有時間順序也不會發生資料洩漏", "C": "scikit-learn 的 TimeSeriesSplit 預設為擴張視窗，訓練集會逐折變大", "D": "可透過 max_train_size 限制 TimeSeriesSplit 的訓練長度，使行為接近滾動視窗"}, "answer": "B", "explanation": "答案 B。一般的 K 折（包含分層 K 折）會隨機打亂資料，使未來的資料進入訓練集，造成資料洩漏、分數虛高；分層只管類別比例，不處理時間順序。時間序列驗證必須「訓練在前、驗證在後」，TimeSeriesSplit 預設為擴張視窗，設定 max_train_size 可限制訓練長度而接近滾動視窗。", "per_option": {"A": "敘述正確：驗證集必須在訓練集之後。", "B": "錯誤：分層 K 折只維持類別比例，仍會打亂時間而洩漏未來資訊。", "C": "敘述正確：TimeSeriesSplit 預設為擴張視窗。", "D": "敘述正確：max_train_size 可限制訓練長度，接近滾動視窗。"}, "guide_ref": "指引未載", "hot": true}, {"no": 49, "section": "X", "topic_id": "X-03", "topic": "網格與隨機搜尋", "style": "計算", "stem": "某團隊的模型每次訓練（單一折）需 2 分鐘。網格搜尋 6×5×4＝120 組、搭配 5 折交叉驗證，需要 600 次訓練、共 20 小時。改用隨機搜尋，總運算預算只有 4 小時（所有訓練依序執行）。在 5 折交叉驗證下，最多可以評估幾組超參數組合？", "options": {"A": "48：未考慮每次訓練的時間", "B": "120：這是可執行的訓練次數，不是組合數", "C": "24", "D": "600：這是網格搜尋所需的訓練次數"}, "answer": "C", "explanation": "答案 C。4 小時＝240 分鐘，每次訓練 2 分鐘，最多可執行 240÷2＝120 次訓練。每組超參數需做 5 折，因此最多評估 120÷5＝24 組。", "per_option": {"A": "48＝240÷5，忽略了每次訓練要花 2 分鐘。", "B": "120 是總訓練次數，每組還要訓練 5 次，所以組合數是 120÷5。", "C": "正確：240÷2＝120 次訓練，再除以 5 折＝24 組。", "D": "600 是網格搜尋 120 組×5 折所需的訓練次數，已超出 4 小時預算。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 預算換成分鐘", "分鐘 ＝ 小時 × 60", "4 × 60 ＝ 240 分鐘"], ["② 最多能訓練幾次", "訓練次數 ＝ 總預算分鐘 ÷ 單次訓練分鐘", "240 ÷ 2 ＝ 120 次"], ["③ 每組超參數要訓練幾次", "每組訓練次數 ＝ 交叉驗證的折數（每一折各訓練一次）", "5 折 → 每組要訓練 5 次"], ["④ 最多能評估幾組", "可評估組數 ＝ 總訓練次數 ÷ 每組訓練次數", "120 ÷ 5 ＝ 24 組，選 C"], ["⑤ 對照其他選項（怎麼算錯的）", "選項分別把次數、分鐘、組數混在一起", "A：240 ÷ 5 ＝ 48，直接拿分鐘去除折數，忘了每次訓練要 2 分鐘。B：120 是步驟②的總訓練次數，還沒除以 5 折。D：網格搜尋 120 組 × 5 折 ＝ 600 次，600 × 2 ＝ 1,200 分鐘 ＝ 20 小時，超出 4 小時預算"]], "tip": "可評估組數＝（預算 ÷ 單次訓練時間）÷ 折數：先算次數，再除以每組要訓練幾次。", "fig": {"type": "folds", "title": "預算內每組都要做 5 折", "k": 5, "note": "4 小時＝240 分；240÷2＝120 次訓練；120÷5 折＝最多 24 組"}}}, {"no": 50, "section": "X", "topic_id": "X-04", "topic": "蒙地卡羅方法", "style": "計算", "stem": "某風險團隊以蒙地卡羅模擬估計投資組合的虧損機率，用 10,000 次模擬得到的標準誤差約為 0.8 個百分點。若希望把標準誤差降到 0.2 個百分點，在其他條件不變下，約需要多少次模擬？", "options": {"A": "20,000：誤把誤差降為 1/4 當作樣本數需要 √4 倍", "B": "40,000：誤認誤差與模擬次數成反比", "C": "80,000：沒有對應的計算依據", "D": "160,000"}, "answer": "D", "explanation": "答案 D。蒙地卡羅的標準誤差約與 1/√N 成正比。要把誤差由 0.8 降到 0.2（降為 1/4），模擬次數需變為 4²＝16 倍，即 10,000×16＝160,000 次。誤差減半約需 4 倍樣本，降為 1/4 則需 16 倍。", "per_option": {"A": "20,000 是把 √4 當成倍數，方向弄反了：誤差降為 1/4 需要 4 的平方倍。", "B": "40,000 是假設誤差與 N 成反比（4 倍），但實際上與 √N 成反比。", "C": "80,000 沒有任何公式支持，誤差降為 1/4 需要 16 倍。", "D": "正確：N 需放大 4²＝16 倍，即 160,000。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 誤差要縮小幾倍", "縮小倍數 ＝ 舊標準誤差 ÷ 新標準誤差", "0.8 ÷ 0.2 ＝ 4（誤差要變成原來的 1/4）"], ["② 誤差與模擬次數的關係", "標準誤差 ∝ 1 ÷ √N（N ＝ 模擬次數），所以 N 要放大「縮小倍數的平方」倍", "誤差縮小 4 倍 → N 放大 4² ＝ 16 倍（驗算：√16 ＝ 4）"], ["③ 算新的模擬次數", "新 N ＝ 舊 N × 放大倍數", "10,000 × 16 ＝ 160,000，選 D"], ["④ 驗算新的標準誤差", "新誤差 ＝ 舊誤差 × √(舊 N ÷ 新 N)", "0.8 × √(10,000 ÷ 160,000) ＝ 0.8 × √(1/16) ＝ 0.8 × 0.25 ＝ 0.2，剛好達標"], ["⑤ 對照其他選項（用同一條驗算式）", "把各選項的 N 代入同一條驗算式，看誤差是否真的降到目標", "A：20,000 ＝ 10,000 × 2（乘了 √4）。0.8 × √(10,000 ÷ 20,000) ≈ 0.8 × 0.707 ≈ 0.566，未達標。B：40,000 ＝ 10,000 × 4，誤以為誤差與 N 成反比。0.8 × √(1/4) ＝ 0.4，未達標。C：80,000 ＝ 10,000 × 8。0.8 × √(1/8) ≈ 0.283，未達標"]], "tip": "蒙地卡羅誤差∝1/√N：誤差要縮 k 倍，模擬次數要放大 k² 倍。"}}], "6": [{"no": 1, "section": "3.1", "topic_id": "3.1-02", "topic": "連續分佈與 PDF", "style": "計算", "stem": "某接駁公車每 20 分鐘發一班車，乘客不看時刻表、隨機抵達站牌，因此等車時間 T（分鐘）可視為 0 到 20 之間的連續均勻分佈，其機率密度函數在此區間內恆為 1/20。若要估計「乘客等車超過 15 分鐘」的機率，下列何者正確？", "options": {"A": "0.75：把 0 到 15 分鐘的面積當成超過 15 分鐘的機率", "B": "0.25：密度曲線在 15 到 20 之間的面積，即 5×(1/20)", "C": "0.05：直接把某一點的密度值 1/20 當成機率來使用", "D": "0：連續型隨機變數取任何值或區間的機率都是 0，只剩密度值有意義"}, "answer": "B", "explanation": "答案 B。連續型隨機變數的機率是機率密度函數（PDF）在該區間下的面積：P(T>15)＝(20−15)×(1/20)＝0.25。密度值 1/20 本身不是機率，區間機率也不為 0，只有「剛好等於某一個值」的機率才是 0。", "per_option": {"A": "0.75 是等車「不超過 15 分鐘」的機率，區間取反了。", "B": "正確：區間機率＝密度曲線下的面積＝(20−15)×(1/20)＝0.25。", "C": "密度值不是機率，必須乘上區間寬度（對區間積分）才是機率。", "D": "只有「剛好等於某一點」的機率為 0；落在一段區間內的機率不為 0。"}, "guide_ref": "學習指引 p.3-3～3-4", "hot": false, "detail": {"steps": [["① 先確認密度（不是機率）", "均勻分佈的密度 ＝ 1 ÷ 區間總長度（連續分佈裡，密度只是「每單位長度的機率濃度」，不是機率）", "1 ÷ 20 ＝ 0.05"], ["② 找出「超過 15 分鐘」的區間寬度", "區間寬度 ＝ 上界 − 下界", "超過 15 分鐘就是 15 到 20 這段：20 − 15 ＝ 5 分鐘"], ["③ 算機率（長方形面積）", "區間機率 ＝ 密度 × 區間寬度（密度固定時，就是長方形面積；一般情形是密度曲線下的面積）", "5 × (1 ÷ 20) ＝ 5 × 0.05 ＝ 0.25，選 B"], ["④ 驗算", "全部區間的機率加起來必為 1", "不超過 15 分鐘（0 到 15）：15 × 0.05 ＝ 0.75；0.75 ＋ 0.25 ＝ 1 ✓"], ["⑤ 對照其他選項（怎麼算錯的）", "選項分別是取反的區間、單點的密度值、單點機率", "A：0.75 ＝ 15 × 0.05，是不超過 15 分鐘的機率，區間取反了。C：0.05 就是密度值 1 ÷ 20，沒有乘上區間寬度。D：只有「剛好等於某一點」（寬度 0）的機率才是 0 × 0.05 ＝ 0；本題的區間寬度是 5，不是 0"]], "tip": "連續分佈：機率＝密度 × 區間寬度（面積）；單點機率才是 0。"}}, {"no": 2, "section": "3.1", "topic_id": "3.1-03", "topic": "貝氏定理與條件機率", "style": "計算", "stem": "某工廠有甲、乙兩台機器生產同款零件，乙機器生產的零件占全部產量的 30%，且乙機器生產的零件中有 4% 為不良品。若從全部零件中隨機抽取一件，則「該零件由乙機器生產且為不良品」的機率為何？", "options": {"A": "0.04：乙機器生產的零件為不良品的條件機率 P(不良｜乙)", "B": "0.30：零件由乙機器生產的機率，沒有計入「不良」的條件", "C": "0.34：兩個機率相加，表示乙機器或不良品的總占比", "D": "0.012：聯合機率＝P(不良｜乙)×P(乙)＝0.04×0.30"}, "answer": "D", "explanation": "答案 D。乘法規則：P(A∩B)＝P(B｜A)×P(A)。此處 P(乙∩不良)＝0.04×0.30＝0.012。這個聯合機率正是貝氏定理的分子，貝氏定理再把它除以 P(不良) 就得到 P(乙｜不良)。", "per_option": {"A": "0.04 是「已知由乙生產」之下不良的機率 P(不良｜乙)，不是聯合機率。", "B": "0.30 只是 P(乙)，沒有計入「且為不良品」這個條件。", "C": "兩個條件同時成立要用乘法（且）；相加不是聯合機率。", "D": "正確：聯合機率＝條件機率×條件事件的機率，0.04×0.30＝0.012。"}, "guide_ref": "學習指引 p.3-5～3-6", "hot": true, "detail": {"steps": [["① 認出題目給的兩個數字", "聯合機率 P(乙 且 不良) ＝ P(乙) × P(不良｜乙)（｜讀作「在…的條件下」）", "P(乙) ＝ 0.30（乙機器占全部產量的比例）；P(不良｜乙) ＝ 0.04（乙機器生產的零件中不良的比例）"], ["② 相乘", "同一條乘法規則：「且」用乘，不是加", "0.30 × 0.04 ＝ 0.012，選 D（全部零件中有 1.2% 是乙機器生產的不良品）"], ["③ 用實際件數驗算", "件數 ＝ 總件數 × 比例", "舉例（題目沒給數字）：總共 1,000 件，乙機器 ＝ 1,000 × 0.30 ＝ 300 件，其中不良 ＝ 300 × 0.04 ＝ 12 件，12 ÷ 1,000 ＝ 0.012 ✓"], ["④ 對照其他選項（怎麼算錯的）", "選項分別是條件機率、邊際機率、相加", "A：0.04 是 P(不良｜乙)，只在乙機器的零件裡看不良比例。B：0.30 只是 P(乙)，沒計入「且不良」。C：0.30 ＋ 0.04 ＝ 0.34，把「且」誤用成加法；兩個條件同時成立要相乘"]], "tip": "「且」→ 相乘：P(A 且 B) ＝ P(A) × P(B｜A)；它也是貝氏定理的分子。", "fig": {"type": "tree", "title": "機率樹（假設 1,000 件）", "total": "1,000 件", "branches": [{"label": "甲機器", "p": "70%", "n": "700 件", "leaves": [{"label": "不良與否", "p": "未給", "n": "不影響答案"}]}, {"label": "乙機器", "p": "30%", "n": "300 件", "leaves": [{"label": "不良", "p": "4%", "n": "12 件"}, {"label": "良品", "p": "96%", "n": "288 件"}]}], "result": "P(乙且不良) ＝ 12 ÷ 1,000 ＝ 0.30 × 0.04 ＝ 0.012 ＝ 1.2%（乘法規則，沒有除法）"}}}, {"no": 3, "section": "3.2", "topic_id": "3.2-01", "topic": "向量矩陣運算", "style": "計算", "stem": "某團隊用 1,000 筆房屋資料、8 個特徵建立線性迴歸，以封閉解 θ = (XᵀX)⁻¹Xᵀy 求權重，其中設計矩陣 X 的形狀為 (1000, 8)、目標向量 y 的形狀為 (1000, 1)。下列關於矩陣形狀的敘述何者正確？", "options": {"A": "XᵀX 為 (8, 8)，算出的 θ 為 (8, 1)：每個特徵對應一個權重", "B": "XᵀX 為 (1000, 1000)，算出的 θ 為 (1000, 1)：每筆樣本對應一個權重", "C": "XᵀX 為 (8, 8)，算出的 θ 為 (1000, 1)：Xᵀy 之後仍保留樣本維度", "D": "XᵀX 為 (8, 1000)，算出的 θ 為 (8, 1)：XᵀX 的形狀與 Xᵀ 相同"}, "answer": "A", "explanation": "答案 A。矩陣乘法 (a×b)(b×c)→(a×c)。Xᵀ 為 (8,1000)，乘上 X(1000,8) 得 XᵀX＝(8,8)；其反矩陣仍是 (8,8)，乘 Xᵀ(8,1000) 得 (8,1000)，最後乘 y(1000,1) 得 θ＝(8,1)，也就是 8 個特徵各一個權重。", "per_option": {"A": "正確：(8,1000)×(1000,8)＝(8,8)；反矩陣與 Xᵀ 相乘得 (8,1000)，再乘 y 得 (8,1)。", "B": "XᵀX 是 Xᵀ(8×1000) 乘 X(1000×8)，結果是 8×8，不會是 1000×1000；權重數量也等於特徵數而非樣本數。", "C": "(8,1000)×(1000,1) 時中間的 1000 會被消去，結果是 (8,1)，不會保留樣本維度。", "D": "(8,1000)×(1000,8) 的結果是 (8,8)；(8,1000) 是 Xᵀ 本身的形狀。"}, "guide_ref": "學習指引 p.3-9～3-11", "hot": true, "detail": {"steps": [["① 先認出各矩陣的形狀", "矩陣乘法形狀規則：(a, b) 乘 (b, c) ＝ (a, c)，前者的欄數要等於後者的列數，中間相同的 b 會被消掉。X 的形狀是 (n, p)（n ＝ 樣本數、p ＝ 特徵數），轉置後 Xᵀ 是 (p, n)", "n ＝ 1,000、p ＝ 8：X 是 (1000, 8)，Xᵀ 是 (8, 1000)，y 是 (1000, 1)"], ["② XᵀX", "(p, n) 乘 (n, p) ＝ (p, p)", "(8, 1000) × (1000, 8)：中間的 1000 被消掉，得 (8, 8)"], ["③ 反矩陣", "反矩陣的形狀與原矩陣相同", "(XᵀX)⁻¹ 仍是 (8, 8)"], ["④ (XᵀX)⁻¹ 乘 Xᵀ", "(p, p) 乘 (p, n) ＝ (p, n)", "(8, 8) × (8, 1000)：中間的 8 被消掉，得 (8, 1000)"], ["⑤ 再乘 y 得到 θ", "(p, n) 乘 (n, 1) ＝ (p, 1)", "(8, 1000) × (1000, 1)：中間的 1000 被消掉，得 (8, 1)，也就是 8 個特徵各一個權重，選 A"], ["⑥ 對照其他選項（怎麼算錯的）", "權重個數 ＝ 特徵數 p；乘法時中間的數字會被消掉，不會保留", "B：(1000, 1000) 是 X 乘 Xᵀ（順序反過來）的形狀，不是 XᵀX；權重數也不是樣本數。C：最後 (8, 1000) × (1000, 1) 時中間的 1000 已被消掉，不會留下 1000。D：(8, 1000) 是 Xᵀ 自己的形狀，XᵀX 是 (8, 8)"]], "tip": "矩陣相乘看「中間相同、頭尾留下」；線性迴歸的權重個數＝特徵數。", "fig": {"type": "matrix", "title": "矩陣形狀一路相乘", "op": "·", "ops": [{"name": "反矩陣", "r": 8, "c": 8}, {"name": "Xᵀ", "r": 8, "c": 1000}, {"name": "y", "r": 1000, "c": 1}], "out": {"name": "θ", "r": 8, "c": 1}, "note": "XᵀX 是 8×8（取反矩陣仍 8×8）；中間的 8、1000 被消掉，θ 是 8×1"}}}, {"no": 4, "section": "3.2", "topic_id": "3.2-02", "topic": "線性變換的幾何", "style": "情境", "stem": "某資料團隊對二維特徵向量 x = (x₁, x₂) 左乘矩陣 A = [[1, 0], [0, 0]]，觀察到 (3, 4) 被轉成 (3, 0)、(5, −2) 被轉成 (5, 0)。關於這個線性變換，下列何者最適當？", "options": {"A": "縮放（Scaling）：各座標軸等比例放大或縮小，向量方向保持不變", "B": "旋轉（Rotation）：每個向量的長度保持不變，只有方向發生改變", "C": "投影（Projection）：把向量壓到 x₁ 軸，x₂ 的資訊被丟掉", "D": "剪切（Shear）：一個座標隨另一座標的大小而傾斜，其餘維持不變"}, "answer": "C", "explanation": "答案 C。矩陣 A 把 (x₁, x₂) 變成 (x₁, 0)：x₂ 的資訊被捨棄，所有點都落在 x₁ 軸，這正是「投影」。投影會把高維資料壓到子空間（所以能降維），也因此丟失的資訊無法由結果還原；旋轉不改長度、縮放不改方向，都不會把資訊歸零。", "per_option": {"A": "縮放不會讓向量落到同一條軸上；(3,4)→(3,0) 方向已改變。", "B": "(3,4) 長度為 5，轉換後 (3,0) 長度為 3，長度改變了，不是旋轉。", "C": "正確：所有輸出的第二個座標都變成 0，向量被壓到 x₁ 軸，且 x₂ 資訊無法復原。", "D": "剪切矩陣形如 [[1,k],[0,1]]，不會把某個座標直接歸零。"}, "guide_ref": "學習指引 p.3-11～3-13", "hot": false}, {"no": 5, "section": "3.3", "topic_id": "3.3-01", "topic": "最佳化問題的組成", "style": "情境", "stem": "某團隊要學習三個子模型的組合權重 w₁、w₂、w₃，用以加權平均它們的預測，並要求每個權重都不得為負且三者總和必須等於 1。在最佳化問題的組成要素中，這項「權重必須非負且總和為 1」的規定屬於下列哪一項？", "options": {"A": "目標函數（Objective Function）：衡量預測與真實答案的偏差，是要被最小化的量", "B": "可行域（Feasible Region）：規定參數允許取值的範圍，如非負、總和為 1", "C": "決策變數（Decision Variables）：可被調整的參數，例如 w₁、w₂、w₃ 本身", "D": "梯度（Gradient）：損失函數對各參數的偏微分，指出損失下降的方向"}, "answer": "B", "explanation": "答案 B。最佳化問題有三個要素：目標函數（要最小化什麼）、決策變數（可調的參數）、可行域（參數允許的範圍）。「非負」「總和為 1」「上下限」這類限制都屬於可行域；w₁～w₃ 是決策變數，加權後的驗證誤差則可作為目標函數。", "per_option": {"A": "目標函數是要最小化的損失，不是對參數取值範圍的限制。", "B": "正確：非負與總和為 1 是對參數可取值範圍的限制，即可行域。", "C": "w₁～w₃ 才是決策變數；題目問的是對它們的取值規定。", "D": "梯度是計算更新方向的工具，不是參數允許範圍的規定。"}, "guide_ref": "學習指引 p.3-18～3-20", "hot": false}, {"no": 6, "section": "3.3", "topic_id": "3.3-03", "topic": "損失函數選擇", "style": "情境", "stem": "某工廠以自編碼器（Autoencoder）學習「正常產品」的灰階影像：模型先把影像壓縮成低維表示，再還原成與輸入同尺寸的影像，訓練目標是讓還原出的每個像素都盡量貼近原始影像。此訓練最適合採用下列哪一類損失函數？", "options": {"A": "重建損失（Reconstruction Loss）：以逐像素的均方誤差衡量還原結果與輸入的差距", "B": "對比損失（Contrastive Loss）：依成對樣本是否相似，拉近相似樣本、推遠不相似樣本", "C": "排序損失（Ranking Loss）：要求相關項目的分數高於不相關項目，用於搜尋與推薦", "D": "焦點損失（Focal Loss）：降低易分類樣本的權重，聚焦難分類樣本，用於類別不平衡的分類"}, "answer": "A", "explanation": "答案 A。損失函數要配合任務：自編碼器等重建任務使用重建損失（常見為逐像素的 MSE），衡量還原結果與輸入的差距；對比損失用於相似度學習、排序損失用於搜尋推薦、Focal Loss 用於類別不平衡的分類。", "per_option": {"A": "正確：自編碼器的目標就是還原輸入，用重建損失衡量還原誤差。", "B": "對比損失用於相似度學習（如人臉驗證），需要成對標註，不是逐像素還原。", "C": "排序損失處理項目的先後順序，與影像還原無關。", "D": "焦點損失用於不平衡的分類任務，而此處是影像重建而非分類。"}, "guide_ref": "學習指引 p.3-21～3-23", "hot": true}, {"no": 7, "section": "3.3", "topic_id": "3.3-05", "topic": "動量與 Adam", "style": "情境", "stem": "某工程師以 Adam 訓練模型，超參數為 β₁ = 0.9、β₂ = 0.999。他觀察到少數雜訊較大的批次會讓更新方向左右擺動，因此希望更新方向更依賴過去累積的梯度、較不受單一批次影響，同時不想改變各參數步長的自適應縮放方式。下列哪項調整最直接？", "options": {"A": "降低 β₂（Second-moment Decay）：讓二階動量更快反映最新的梯度平方", "B": "增大 ε（Epsilon）：增加分母的數值穩定項，避免除以零", "C": "降低學習率（Learning Rate）：縮小每一步的更新幅度，不改變方向的組成", "D": "調高 β₁（First-moment Decay，如 0.9→0.99）：對歷史梯度取更長的移動平均"}, "answer": "D", "explanation": "答案 D。Adam 的一階動量 m_t＝β₁·m_{t−1}＋(1−β₁)·g_t，是梯度的指數移動平均；β₁ 越接近 1，歷史梯度權重越大，方向越平滑、越不受單一批次雜訊影響。β₂ 控制的是梯度平方的二階動量，用來縮放各參數的步長。", "per_option": {"A": "β₂ 控制二階動量，影響的是各參數的步長縮放而非方向平滑，也違反「不改變自適應縮放」的條件。", "B": "ε 是避免除以零的小常數，過大只會抑制步長縮放，並不會讓方向依賴歷史梯度。", "C": "降低學習率只縮小步幅，更新方向仍是原本的比例，不會更依賴歷史梯度。", "D": "正確：β₁ 控制一階動量（梯度方向的移動平均），越接近 1 越依賴歷史梯度。"}, "guide_ref": "學習指引 p.3-24～3-26", "hot": true}, {"no": 8, "section": "3.3", "topic_id": "3.3-08", "topic": "梯度裁剪", "style": "否定", "stem": "下列關於梯度裁剪（Gradient Clipping）的敘述，何者「錯誤」？", "options": {"A": "按梯度範數裁剪時，若範數超過門檻，會把整個梯度等比例縮小，梯度方向維持不變", "B": "RNN 與深層網路訓練時若損失突然變成 NaN，常用它來抑制梯度爆炸", "C": "梯度裁剪會把過小的梯度往上拉，主要用來解決深層網路的梯度消失", "D": "它限制的對象是梯度，而不是損失函數的數值本身"}, "answer": "C", "explanation": "答案 C。梯度裁剪替梯度設定上限：超過門檻就按比例縮小或截斷，讓每一步更新幅度受控，是處理「梯度爆炸」的優先技術。它不會把過小的梯度放大，所以不能用來解決梯度消失（梯度消失要靠 ReLU、殘差連接等設計處理）。", "per_option": {"A": "正確：按範數裁剪只縮小長度、方向不變。", "B": "正確：梯度爆炸造成的數值溢位是梯度裁剪的典型使用情境。", "C": "錯誤敘述：梯度裁剪是設「上限」處理梯度爆炸，不會放大過小的梯度，也不能解決梯度消失。", "D": "正確：被限幅的是梯度，損失值不受影響。"}, "guide_ref": "學習指引 p.3-27", "hot": false}, {"no": 9, "section": "4.1", "topic_id": "4.1-04", "topic": "強化學習", "style": "情境", "stem": "某物流公司用強化式學習訓練倉儲機器人的取貨路徑策略，訓練完成後需評估策略好壞。機器人在每個回合結束時都會得到一份累積報酬，並記錄是否完成全部訂單。下列哪一種評估方式最符合強化式學習的特性？", "options": {"A": "靜態準確率（Static Accuracy）：在帶標註測試集上檢查每步動作是否等於標準答案", "B": "平均累積報酬與成功率（Average Return）：多個回合統計並觀察策略穩定性", "C": "單步即時報酬（Immediate Reward）：只看單一步驟報酬是否最大，作為整體策略好壞", "D": "訓練損失（Training Loss）：以訓練損失的下降幅度作為策略品質，不必再與環境互動"}, "answer": "B", "explanation": "答案 B。強化式學習的目標是長期累積報酬最大，沒有逐步的標準答案，因此評估要在環境（模擬或實際）中跑多個回合，看平均累積報酬、成功率（任務達成率）與策略穩定性、收斂速度，而不是靜態的準確率。", "per_option": {"A": "強化式學習沒有每一步的標準答案，靜態準確率不適用。", "B": "正確：強化式學習以長期累積報酬、成功率與穩定性評估策略。", "C": "目標是長期累積報酬最大，單步報酬高不代表整體策略好。", "D": "損失下降不等於策略在環境中表現好，仍須實際與環境互動來評估。"}, "guide_ref": "學習指引 p.4-9～4-11", "hot": false}, {"no": 10, "section": "4.2", "topic_id": "4.2-01", "topic": "線性迴歸", "style": "情境", "stem": "某房地產團隊以多元線性迴歸預測房價（單位：萬元），模型包含「屋齡」「坪數」「距捷運距離」三個特徵，訓練後得到「坪數」的係數為 3.2。在其他特徵保持不變的前提下，這個係數最適當的解讀為何？", "options": {"A": "坪數每增加 1 坪，預測房價平均增加 3.2 萬元", "B": "坪數每增加 1%，預測房價平均增加 3.2%", "C": "坪數可以解釋房價總變異中的 3.2%", "D": "坪數與房價的相關係數為 3.2，顯示兩者呈強烈正相關"}, "answer": "A", "explanation": "答案 A。線性迴歸 y＝β₀＋β₁x₁＋…＋βₙxₙ 中，βᵢ 代表在其他特徵不變時，xᵢ 每增加 1 單位，預測 y 平均改變 βᵢ 單位（這裡 y 的單位是萬元）。它不是百分比、不是解釋變異比例，也不是相關係數。", "per_option": {"A": "正確：線性迴歸係數代表該特徵每增加一單位，預測值的平均變化量（其他特徵固定）。", "B": "係數是以「單位」計的絕對變化，不是百分比對百分比的關係。", "C": "解釋變異比例是 R² 的意思，與係數大小無關。", "D": "相關係數介於 −1 到 1 之間，3.2 不可能是相關係數；迴歸係數與相關係數是不同的量。"}, "guide_ref": "學習指引 p.4-12～4-14", "hot": false}, {"no": 11, "section": "4.2", "topic_id": "4.2-07", "topic": "XGBoost", "style": "情境", "stem": "某團隊以 XGBoost 預測客戶流失，訓練集 AUC 為 0.99，驗證集僅 0.85，確認為過擬合。若要沿用 XGBoost 並降低過擬合，下列哪組調整最適當？", "options": {"A": "提高 max_depth 並增加樹的數量，讓每棵樹與整體模型能學到更細的規律", "B": "將 subsample 與 colsample_bytree 都設為 1.0，取消每棵樹的隨機抽樣", "C": "降低 max_depth，並提高 reg_lambda（L2）與 gamma（分裂門檻）", "D": "大幅提高 learning_rate 並移除早停機制，讓模型更快速地擬合訓練資料"}, "answer": "C", "explanation": "答案 C。XGBoost 的目標函數內建正則化（L1/L2 與樹複雜度懲罰）。要降低過擬合，可降低 max_depth、提高 reg_lambda 或 gamma（讓分裂需要更大的損失下降才進行）、降低 learning_rate 搭配早停，並保留 subsample／colsample 的隨機抽樣。", "per_option": {"A": "更深更多的樹會讓模型更複雜，加重過擬合。", "B": "隨機抽樣資料列與欄位有助降低變異，取消後更容易過擬合。", "C": "正確：限制樹深並加重對樹複雜度與葉權重的懲罰，可抑制過擬合。", "D": "更大的學習率與沒有早停會讓模型更貼合訓練資料，不是防過擬合的做法。"}, "guide_ref": "學習指引 p.4-22～4-24", "hot": true}, {"no": 12, "section": "4.2", "topic_id": "4.2-14", "topic": "K-means", "style": "計算", "stem": "某團隊以 K-means（K=2）分群二維資料，初始質心為 c₁＝(1, 1)、c₂＝(8, 8)。資料點為 (1, 2)、(3, 2)、(2, 5)、(8, 9)、(9, 8)、(10, 10)。完成第一次「分配到最近質心」後，進行「更新質心」，則第 1 群的新質心為何？", "options": {"A": "(1.75, 2.5)：把舊質心 (1, 1) 也一併納入平均", "B": "(2, 2)：取各座標的中位數", "C": "(1, 1)：質心在第一次迭代後不會移動", "D": "(2, 3)：第 1 群三個點各座標的平均"}, "answer": "D", "explanation": "答案 D。距離計算：三個點 (1,2)、(3,2)、(2,5) 距離 c₁ 較近，另外三點距離 c₂ 較近。更新質心＝群內所有點的平均：c₁＝(6/3, 9/3)＝(2, 3)，c₂＝(27/3, 27/3)＝(9, 9)。再重複「分配→更新」直到質心不再移動。", "per_option": {"A": "質心更新只對群內的資料點取平均，舊質心不是資料點。", "B": "K-means 以平均值（而非中位數）更新質心，這也是它對離群值敏感的原因。", "C": "分配完成後，質心會移到群內平均的位置，除非剛好重合。", "D": "正確：(1,2)、(3,2)、(2,5) 的平均＝((1+3+2)/3, (2+2+5)/3)＝(2, 3)。"}, "guide_ref": "學習指引 p.4-41～4-42", "hot": false, "detail": {"steps": [["① 算每個點到兩個質心的距離，分到較近的一群", "歐氏距離 d ＝ √((x₁ − x₂)² ＋ (y₁ − y₂)²)（兩點的直線距離）；每個點歸到距離較小的質心", "(1,2)：到 c₁ ＝ √(0² ＋ 1²) ＝ 1，到 c₂ ＝ √((−7)² ＋ (−6)²) ＝ √85 ≈ 9.22 → 群 1。(3,2)：到 c₁ ＝ √(2² ＋ 1²) ＝ √5 ≈ 2.24，到 c₂ ＝ √((−5)² ＋ (−6)²) ＝ √61 ≈ 7.81 → 群 1。(2,5)：到 c₁ ＝ √(1² ＋ 4²) ＝ √17 ≈ 4.12，到 c₂ ＝ √((−6)² ＋ (−3)²) ＝ √45 ≈ 6.71 → 群 1。(8,9)：到 c₁ ＝ √(7² ＋ 8²) ＝ √113 ≈ 10.63，到 c₂ ＝ √(0² ＋ 1²) ＝ 1 → 群 2。(9,8)：到 c₁ ≈ 10.63，到 c₂ ＝ √(1² ＋ 0²) ＝ 1 → 群 2。(10,10)：到 c₁ ＝ √(9² ＋ 9²) ＝ √162 ≈ 12.73，到 c₂ ＝ √(2² ＋ 2²) ＝ √8 ≈ 2.83 → 群 2"], ["② 更新第 1 群的質心", "新質心 ＝ (群內所有點 x 的平均, 群內所有點 y 的平均)（質心就是這一群的平均位置）", "群 1 有 (1,2)、(3,2)、(2,5)：x ＝ (1 ＋ 3 ＋ 2) ÷ 3 ＝ 6 ÷ 3 ＝ 2；y ＝ (2 ＋ 2 ＋ 5) ÷ 3 ＝ 9 ÷ 3 ＝ 3；新質心 ＝ (2, 3)，選 D"], ["③ 順便算第 2 群（確認方法）", "同一條平均公式", "群 2 有 (8,9)、(9,8)、(10,10)：x ＝ (8 ＋ 9 ＋ 10) ÷ 3 ＝ 27 ÷ 3 ＝ 9；y ＝ (9 ＋ 8 ＋ 10) ÷ 3 ＝ 27 ÷ 3 ＝ 9；新質心 ＝ (9, 9)"], ["④ 對照其他選項（怎麼算錯的）", "質心只用「群內的資料點」取「平均」；不含舊質心、不用中位數", "A：把舊質心 (1,1) 也算進去（4 個點）：x ＝ (1 ＋ 1 ＋ 3 ＋ 2) ÷ 4 ＝ 7 ÷ 4 ＝ 1.75，y ＝ (1 ＋ 2 ＋ 2 ＋ 5) ÷ 4 ＝ 10 ÷ 4 ＝ 2.5。B：取中位數：x 排序 1、2、3 → 2，y 排序 2、2、5 → 2，得 (2, 2)；K-means 用的是平均（用中位數的是另一種演算法 K-medians），平均的 y 因為有 5 被拉高成 3。C：新質心 (2, 3) 與舊質心 (1, 1) 並不相同，質心有移動"]], "tip": "K-means 一輪＝「分配（找最近質心）」＋「更新（群內取平均）」。"}}, {"no": 13, "section": "4.2", "topic_id": "4.2-16", "topic": "DBSCAN", "style": "情境", "stem": "某團隊對一維感測讀值 0、1、2、3、4、5.8、12 執行 DBSCAN，設定鄰域半徑 Eps＝1.5（距離 ≤ Eps 即視為鄰居，鄰域點數含自己）、MinPts＝3。依此設定，下列判斷何者正確？", "options": {"A": "全部噪聲（All Noise）：讀值 4 與 5.8 都是噪聲點，因為鄰域點數都少於 MinPts", "B": "邊界點與噪聲點（Border / Noise）：讀值 4 是邊界點，讀值 5.8 是噪聲點", "C": "核心與邊界（Core / Border）：讀值 4 是核心點，讀值 5.8 是邊界點", "D": "全部邊界（All Border）：讀值 4 與 5.8 都是邊界點，因為它們都靠近密度較高的區域"}, "answer": "B", "explanation": "答案 B。以 Eps＝1.5、MinPts＝3（含自己）計：1 的鄰域＝{0,1,2}、2＝{1,2,3}、3＝{2,3,4}，各有 3 點，是核心點；0 與 4 的鄰域只有 2 點但落在核心點的鄰域內，是邊界點；5.8（鄰域僅自己）與 12 不在任何核心點鄰域內，是噪聲點。", "per_option": {"A": "鄰域點數不足不一定是噪聲；4 落在核心點 3 的鄰域內，是邊界點。", "B": "正確：4 的鄰域只有 {3,4} 共 2 點（非核心），但落在核心點 3 的鄰域內，故為邊界點；5.8 不在任何核心點的鄰域內，為噪聲。", "C": "4 的鄰域（距離 ≤1.5）只有 3 和自己，點數 2 < 3，不是核心點；5.8 與 4 距離 1.8 > Eps，不是任何核心點的鄰居。", "D": "5.8 與最近的核心點 3 相距 2.8 > Eps，沒有被涵蓋，因此是噪聲點，不是邊界點。"}, "guide_ref": "學習指引 p.4-43～4-44", "hot": false}, {"no": 14, "section": "4.2", "topic_id": "4.2-20", "topic": "異常偵測", "style": "情境", "stem": "某工廠的風機只有大量「正常運轉」的震動感測紀錄，從未累積過任何標註為故障的樣本，卻希望上線後能自動偵測未曾見過的異常震動。下列哪一種方法最適合？", "options": {"A": "單類別支援向量機（One-Class SVM）：只用正常資料學出包住正常樣本的邊界，邊界外視為異常", "B": "羅吉斯迴歸（Logistic Regression）：需要同時有正常與故障兩種標籤的樣本，才能學出分類界線", "C": "多類別 Softmax 分類器：需為每一種故障類型準備足量的標註樣本", "D": "線性迴歸（Linear Regression）：預測連續數值，輸出本身並不是正常或異常的判定"}, "answer": "A", "explanation": "答案 A。異常稀少且常沒有標註，因此異常偵測多用非監督或半監督方法：One-Class SVM 只用正常資料學出邊界，邊界外就是異常；孤立森林則靠隨機切分、路徑越短越異常。需要故障標籤的監督式分類在此情境不適用。", "per_option": {"A": "正確：只需正常資料即可學習邊界，符合沒有故障標註的情境。", "B": "沒有故障標註就無法做監督式二元分類。", "C": "同樣需要各類別的標註樣本，也無法辨識未曾見過的異常。", "D": "線性迴歸預測連續值，不能直接做異常判定，也需要目標值。"}, "guide_ref": "學習指引 p.4-50～4-53", "hot": false}, {"no": 15, "section": "4.3", "topic_id": "4.3-02", "topic": "激活函數與輸出層", "style": "情境", "stem": "某團隊建立 10 個隱藏層的全連接網路，所有隱藏層皆使用 Sigmoid 激活函數。訓練時發現靠近輸入端的前幾層權重幾乎不更新、整體損失下降極慢。若只考慮替換隱藏層的激活函數，下列哪一項最適當？", "options": {"A": "Tanh（Hyperbolic Tangent）：輸出壓縮在 −1 到 1 之間，兩端仍會飽和", "B": "Softmax（Normalized Exponential）：輸出為總和 1 的機率分佈，用於多分類輸出層", "C": "ReLU（Rectified Linear Unit）：輸入為正時原樣輸出，正區間梯度不被壓縮", "D": "線性激活（Linear Activation）：不做任何轉換，多層會等同單層線性模型"}, "answer": "C", "explanation": "答案 C。Sigmoid 的導數最大僅 0.25，且兩端飽和，層數一深，反向傳播逐層相乘後梯度趨近 0，前面幾層就學不動（梯度消失）。ReLU 在正區間導數恆為 1，不會被逐層壓縮，且計算簡單，是隱藏層最常用的激活函數。", "per_option": {"A": "Tanh 雖以 0 為中心，兩端仍會飽和、梯度趨近 0，無法根本解決梯度消失。", "B": "Softmax 用於多分類輸出層，放在隱藏層會破壞表示能力，也不能解決梯度消失。", "C": "正確：ReLU 在正區間梯度為 1，反向傳播時不會逐層縮小，是隱藏層常用選擇。", "D": "線性激活會讓多層網路退化成單層線性模型，失去非線性表達能力。"}, "guide_ref": "學習指引 p.4-57～4-58；5-36", "hot": true}, {"no": 16, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "否定", "stem": "下列關於卷積神經網路（CNN）的敘述，何者「錯誤」？", "options": {"A": "靠近輸入的卷積層多半學到邊緣、紋理等簡單局部特徵，越後面的層越能組合出抽象的形狀與物件部位", "B": "同一個卷積核在整張特徵圖上共用權重，使參數量遠少於同尺寸輸入的全連接層", "C": "卷積與池化層提取特徵之後，通常會展平並接全連接層，將特徵映射成類別分數", "D": "卷積核的數量決定輸出特徵圖的寬與高，與輸出通道數無關"}, "answer": "D", "explanation": "答案 D。卷積核的數量決定輸出的通道數（例如 32 個核就輸出 32 個通道）；輸出的寬高則由輸入大小、核大小、padding 與 stride 決定。CNN 的階層式特徵（簡單→抽象）、權重共享以及「卷積池化→Flatten→全連接」的結尾都是正確的描述。", "per_option": {"A": "正確：CNN 具有由簡單到抽象的階層式特徵。", "B": "正確：權重共享與局部連接是 CNN 參數少、效率高的主因。", "C": "正確：常見結構為卷積＋池化→Flatten→全連接層→輸出層。", "D": "錯誤敘述：卷積核（濾波器）的數量決定輸出通道數；輸出的寬高由輸入大小、核大小、padding 與 stride 決定。"}, "guide_ref": "學習指引 p.4-67～4-71", "hot": true}, {"no": 17, "section": "4.3", "topic_id": "4.3-08", "topic": "ResNet", "style": "情境", "stem": "某團隊比較兩個只由卷積層、激活函數與池化層依序堆疊而成的網路，在同一資料集上的結果：20 層網路的訓練誤差率為 8%、驗證誤差率為 10%；加深到 56 層後，訓練誤差率反而升到 14%、驗證誤差率為 16%。下列診斷與對策何者最適當？", "options": {"A": "殘差連接（Skip Connection）：連訓練誤差率都升高屬退化現象，跳躍連接讓各層只學殘差", "B": "Dropout 與資料增強（Dropout / Data Augmentation）：56 層出現過擬合，需加強正則化", "C": "更多訓練資料（More Data）：訓練誤差率偏高，代表模型見過的樣本數量不足", "D": "將隱藏層的 ReLU 全換成 Sigmoid：壓縮輸出範圍能穩定深層訓練"}, "answer": "A", "explanation": "答案 A。深層網路加深後「訓練誤差也升高」稱為退化（degradation），主因是堆疊過深的普通網路難以最佳化（常歸因於梯度難以有效傳回前面的層），並非過擬合。ResNet 以跳躍連接（輸出＝輸入＋F(輸入)）讓梯度與資訊能直達前面的層，使數百層的網路也能訓練。", "per_option": {"A": "正確：訓練誤差也變差，屬深層網路的退化現象（官方指引將其與梯度消失並列），ResNet 的殘差連接正是為此設計。", "B": "過擬合的特徵是訓練誤差低、驗證誤差高；這裡訓練誤差本身就變高，不是過擬合。", "C": "資料量不足主要造成訓練好、驗證差的落差；兩個網路用同一資料集，加深後訓練誤差卻上升，問題在網路結構。", "D": "Sigmoid 兩端飽和，梯度反而更小，會讓深層網路更難訓練。"}, "guide_ref": "學習指引 p.4-71～4-72；4-81", "hot": true}, {"no": 18, "section": "4.3", "topic_id": "4.3-12", "topic": "注意力機制", "style": "情境", "stem": "某媒體公司要開發「輸入一段文章開頭，自動依序續寫後續內容」的功能，團隊在 Transformer 家族的 BERT 與 GPT 兩類模型之間選型。下列敘述何者最適當？", "options": {"A": "BERT 類為僅解碼器、單向的模型，逐字預測下一個詞，因此最適合續寫文章", "B": "GPT 類為僅解碼器、單向自迴歸模型，依前文逐字預測下一個詞，適合續寫與生成", "C": "GPT 類同時參考前後文做雙向理解，並以遮蓋詞彙再還原的方式預訓練，因此最適合續寫", "D": "BERT 與 GPT 都是僅編碼器的架構，差別只在參數量大小，兩者續寫能力相同"}, "answer": "B", "explanation": "答案 B。BERT 只用 Transformer 編碼器，採雙向注意力，擅長分類、問答等理解任務；GPT 只用解碼器，採因果遮罩（只看左邊已有的詞）的單向自迴歸，每次預測下一個詞，所以續寫、對話等生成任務選 GPT 類模型。", "per_option": {"A": "BERT 是僅編碼器、雙向的模型，擅長理解而非逐字生成。", "B": "正確：自迴歸解碼器的設計目標就是逐字生成。", "C": "遮蓋再還原與雙向理解是 BERT 的特色；GPT 是單向自迴歸。", "D": "兩者架構並不相同（BERT 為編碼器、GPT 為解碼器），差別不只是參數量。"}, "guide_ref": "學習指引 p.4-76～4-83", "hot": true}, {"no": 19, "section": "4.3", "topic_id": "4.3-12", "topic": "注意力機制", "style": "計算", "stem": "某團隊使用標準自注意力（Self-Attention）處理文件，每個注意力頭都要計算一個「序列長度 × 序列長度」的注意力分數矩陣。若輸入長度由 512 個 token 增加為 2,048 個 token，單一注意力頭的分數矩陣元素數量約變為原來的幾倍？", "options": {"A": "4 倍：序列長度增加為 4 倍，元素數也只隨之增加 4 倍", "B": "8 倍：長度增加 4 倍，且 Q 與 K 兩個矩陣各自放大一次", "C": "64 倍：元素數隨序列長度的三次方成長，即 4³＝64", "D": "16 倍：元素數隨序列長度的平方成長，即 4²＝16"}, "answer": "D", "explanation": "答案 D。自注意力要讓每個位置和所有位置計算相關性，分數矩陣為 n×n：512²＝262,144，2,048²＝4,194,304，比值＝16。這也是長文本計算量與記憶體需求快速膨脹的原因（複雜度隨序列長度平方成長）。", "per_option": {"A": "分數矩陣是 n×n，元素數隨 n 的平方成長，不是線性。", "B": "分數矩陣的大小只取決於序列長度 n（n×n），與 Q、K 的個數無關。", "C": "分數矩陣是 n×n（平方），不是三次方。", "D": "正確：長度變 4 倍，n×n 矩陣的元素數變 4²＝16 倍。"}, "guide_ref": "學習指引 p.4-76～4-83", "hot": true, "detail": {"steps": [["① 算分數矩陣的元素數", "分數矩陣是 n × n（n ＝ 序列長度，每個位置對每個位置都要算一個分數），元素數 ＝ n²", "原本：512² ＝ 512 × 512 ＝ 262,144；變長後：2,048² ＝ 2,048 × 2,048 ＝ 4,194,304"], ["② 算倍數", "倍數 ＝ 新元素數 ÷ 舊元素數", "4,194,304 ÷ 262,144 ＝ 16"], ["③ 用長度倍數驗算", "元素數倍數 ＝ (長度倍數)²（長度變幾倍，元素數變那個數字的平方倍）", "長度倍數 ＝ 2,048 ÷ 512 ＝ 4；4² ＝ 16，兩種算法一致，選 D"], ["④ 對照其他選項（怎麼算錯的）", "選項分別把平方誤當成一次方、乘 2、三次方", "A：4 倍只是長度的倍數，沒有平方。B：4 × 2 ＝ 8，把 Q、K 當成各放大一次；但矩陣大小只看 n × n。C：4³ ＝ 64，誤用三次方；分數矩陣只有兩個維度（n × n）"]], "tip": "自注意力的分數矩陣是 n × n：長度變 k 倍，運算量與記憶體變 k² 倍。"}}, {"no": 20, "section": "4.3", "topic_id": "4.3-14", "topic": "遷移學習", "style": "情境", "stem": "某團隊要用 ImageNet 預訓練的 ResNet 辨識工廠 X 光影像中的零件瑕疵，已蒐集約 2 萬張標註影像（資料量不算少），但這類灰階 X 光影像與 ImageNet 的日常彩色照片差異很大。下列哪一種遷移學習做法最適當？", "options": {"A": "特徵萃取（Feature Extraction）：凍結所有預訓練的卷積層，只重新訓練最後的分類層", "B": "從頭訓練（Training from Scratch）：捨棄預訓練權重並隨機初始化，認為預訓練特徵完全無用", "C": "全面微調（Full Fine-Tuning）：解凍較多甚至全部的層，以很小的學習率（如 1e-4）更新", "D": "大學習率微調（High-LR Fine-Tuning）：以與從頭訓練相同的大學習率（如 0.1）更新全部層"}, "answer": "C", "explanation": "答案 C。遷移學習的策略取決於資料量與領域差異：資料少且領域相近，凍結預訓練層、只訓練新分類層；資料足夠且領域差異大，就解凍較多層微調（Fine-Tuning），讓較高層特徵適應新領域。微調要用很小的學習率（如 1e-4），避免破壞預訓練特徵。", "per_option": {"A": "只訓練最後一層適合資料少且領域相近的情況；此處領域差異大、資料足夠，凍結高層特徵會限制表現。", "B": "低階特徵（邊緣、紋理）仍可遷移，預訓練權重通常仍比隨機初始化更好。", "C": "正確：資料量足夠且領域差異大，應微調更多層，並用小學習率保護預訓練特徵。", "D": "學習率過大會破壞預訓練學到的特徵，微調應使用很小的學習率。"}, "guide_ref": "學習指引 p.4-82", "hot": true}, {"no": 21, "section": "4.3", "topic_id": "4.3-19", "topic": "程式碼閱讀：深度學習", "style": "情境", "stem": "某工程師以 Keras 建立二元分類模型（標籤為 0 或 1），程式如下。訓練後發現模型對任何輸入的預測機率都固定為 1.0，無法學習。最可能的原因為何？\n```\nmodel = Sequential([\n    Dense(32, activation='relu', input_shape=(20,)),\n    Dense(1, activation='softmax')\n])\nmodel.compile(optimizer='adam', loss='binary_crossentropy')\n```", "options": {"A": "隱藏層的 ReLU 與 binary_crossentropy 不相容，應改成 tanh", "B": "輸出層只有 1 個神經元卻用 softmax，輸出恆為 1.0，應改用 sigmoid", "C": "二元分類的損失函數必須使用 mse，使用 binary_crossentropy 會讓輸出固定", "D": "input_shape 應寫成 (20, 1)，否則輸出層無法正確接收隱藏層的資料"}, "answer": "B", "explanation": "答案 B。Softmax 是對一組輸出做 e^zᵢ／Σe^zⱼ；只有 1 個輸出時，分子分母相同，結果永遠是 1.0，模型無法區分類別。二元分類應使用「Dense(1, activation='sigmoid') ＋ binary_crossentropy」；多類別才用「Dense(K, activation='softmax')」。", "per_option": {"A": "隱藏層激活函數與損失函數沒有相容性問題，ReLU 搭配二元交叉熵很常見。", "B": "正確：單一輸出做 softmax 一定等於 1.0；二元分類單神經元應搭配 sigmoid。", "C": "二元分類的標準損失是二元交叉熵，改用 mse 並不能解決輸出恆為 1.0。", "D": "Dense 層接收長度 20 的特徵向量，input_shape=(20,) 是正確寫法。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 看 softmax 做了什麼", "softmax(zᵢ) ＝ e^(zᵢ) ÷ Σⱼ e^(zⱼ)（每個輸出先取指數，再除以全部指數的總和，所以所有輸出加起來一定是 1）", "只有 1 個輸出神經元時，分母的總和只剩它自己這一項"], ["② 只有 1 個輸出時的結果", "分子與分母相同：e^z ÷ e^z ＝ 1", "舉例（題目沒給數字）：z ＝ 3 → e³ ÷ e³ ＝ 1；z ＝ −5 → e⁻⁵ ÷ e⁻⁵ ＝ 1。不論 z 是多少，輸出都恆為 1.0，模型無法學習，這就是題目的症狀"], ["③ 改用 sigmoid 對照", "sigmoid(z) ＝ 1 ÷ (1 ＋ e^(−z))（把單一數字壓到 0～1，會隨 z 改變）", "舉例（題目沒給數字）：z ＝ 3 → 1 ÷ (1 ＋ e⁻³) ≈ 1 ÷ 1.0498 ≈ 0.953；z ＝ −5 → 1 ÷ (1 ＋ e⁵) ≈ 1 ÷ 149.41 ≈ 0.0067。輸出會跟著 z 改變，才學得動，選 B"]], "code": [["model = Sequential([", "Sequential ＝ 依序堆疊：把各層由上到下串成一條流水線，資料依序流過"], ["Dense(32, activation='relu', input_shape=(20,)),", "Dense ＝ 全連接層，有 32 個神經元；activation='relu' ＝ 輸出過 ReLU（負數變 0、正數不變）；input_shape=(20,) ＝ 每筆資料有 20 個特徵（只有第一層要寫輸入形狀）。這一層沒有問題"], ["Dense(1, activation='softmax')", "輸出層只有 1 個神經元，卻用 softmax：softmax 是把「多個輸出」變成機率分佈，只有 1 個輸出時永遠等於 1.0。二元分類的單一輸出應該用 sigmoid（Dense(1, activation='sigmoid')）"], ["model.compile(optimizer='adam', loss='binary_crossentropy')", "compile ＝ 設定訓練方式：optimizer='adam' ＝ 用 Adam 優化器更新權重；loss='binary_crossentropy' ＝ 二元交叉熵損失函數，二元分類的標準選擇，預測機率離 0／1 標籤越遠損失越大。這行寫法是對的，問題在輸出層的 softmax"]], "tip": "二元分類：Dense(1, sigmoid) ＋ binary_crossentropy；多類別才用 Dense(K, softmax)。"}}, {"no": 22, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "計算", "stem": "某銀行風控團隊要比較兩個尺度不同的特徵：「年齡」平均 40 歲、標準差 8 歲；「年收入」平均 80 萬元、標準差 30 萬元。某位客戶 56 歲、年收入 125 萬元。若以 Z-score 標準化，下列判斷何者正確？", "options": {"A": "年齡 Z 為 2.0、年收入為 1.5，年齡偏離平均的標準差數較多", "B": "年收入較偏離平均，因為原始差距 45 萬元大於年齡差距 16 歲", "C": "兩者 Z-score 相同，因為標準化會把特徵都壓縮到 0 到 1", "D": "兩者無法比較，因為標準化後各特徵仍保有各自原本的單位"}, "answer": "A", "explanation": "答案 A。Z-score＝(x−μ)/σ：年齡 (56−40)/8＝2.0，年收入 (125−80)/30＝1.5。標準化後兩者都是「距離平均幾個標準差」的無單位數值，可以直接比較；Z-score 的範圍並不限於 0 到 1。", "per_option": {"A": "正確：(56−40)/8＝2.0；(125−80)/30＝1.5。", "B": "原始差距單位不同、不可直接比；標準化才能用「幾個標準差」比較。", "C": "Z-score 不會壓縮到 0～1（那是 Min-Max），且此處兩者數值不同。", "D": "標準化後的值是「距離平均幾個標準差」，已無單位，正是為了讓不同尺度可比較。"}, "guide_ref": "學習指引 p.5-6～5-8", "hot": true, "detail": {"steps": [["① Z-score 公式", "Z ＝ (x − 平均數) ÷ 標準差（意思是「距離平均幾個標準差」）", "年齡：x ＝ 56、平均 40、標準差 8；年收入：x ＝ 125、平均 80、標準差 30"], ["② 算年齡的 Z", "同一條公式", "(56 − 40) ÷ 8 ＝ 16 ÷ 8 ＝ 2.0"], ["③ 算年收入的 Z", "同一條公式", "(125 − 80) ÷ 30 ＝ 45 ÷ 30 ＝ 1.5"], ["④ 比較", "Z 的絕對值越大，離平均越遠", "2.0 ＞ 1.5，所以年齡偏離平均的標準差數較多，選 A"], ["⑤ 對照其他選項（怎麼算錯的）", "不同單位不能直接比原始差距；Z-score 沒有壓到 0～1，也沒有單位", "B：原始差距 16 歲與 45 萬元單位不同，不能直接比；除以各自標準差後，45 ÷ 30 ＝ 1.5 反而比 16 ÷ 8 ＝ 2.0 小。C：Z-score 不限於 0～1（那是 Min-Max）；而且 2.0 與 1.5 本來就不相同。D：歲 ÷ 歲、萬元 ÷ 萬元，單位被約掉，Z 是無單位的，所以可以直接比"]], "tip": "Z-score＝距離平均幾個標準差：無單位，所以不同尺度的特徵可以直接比。"}}, {"no": 23, "section": "5.1", "topic_id": "5.1-02", "topic": "PCA 與降維", "style": "情境", "stem": "某信貸團隊有 30 個高度相關的財務比率，線性迴歸的係數因多重共線性而極不穩定。團隊願意犧牲部分特徵的直觀意義，希望以線性方式轉換出彼此不相關的新特徵再建模。下列哪種做法最適當？", "options": {"A": "t-SNE（t-distributed Stochastic Neighbor Embedding）：保留局部鄰域結構，適合視覺化", "B": "Min-Max 縮放（Min-Max Scaling）：把每個特徵壓縮到 0 到 1，不改變特徵間的相關性", "C": "對數轉換（Log Transform）：只改變分佈的偏態，特徵之間仍然高度相關", "D": "主成分分析（PCA）：正交變換產生彼此不相關的主成分，取前幾個作新特徵"}, "answer": "D", "explanation": "答案 D。PCA 透過正交變換把原特徵轉成彼此不相關的主成分，並依解釋變異量排序，取前幾個即可降維並去除共線性；代價是主成分是原特徵的線性組合，不易直接解釋。縮放與取對數都不會改變特徵之間的相關結構。", "per_option": {"A": "t-SNE 是非線性的視覺化工具，不保證穩定的線性結構，也不適合當預測模型的輸入。", "B": "縮放是線性變換，不會消除特徵間的相關性。", "C": "對數轉換主要處理偏態，無法讓特徵彼此不相關。", "D": "正確：主成分彼此正交（線性不相關），可緩解共線性，代價是難以對應原始特徵意義。"}, "guide_ref": "學習指引 p.5-6；3-13～3-15", "hot": true}, {"no": 24, "section": "5.1", "topic_id": "5.1-03", "topic": "特徵工程策略", "style": "情境", "stem": "某外送平台預測各時段的訂單量，特徵中有「下單小時」（0～23）。工程師發現直接把小時當數值餵給線性模型，會讓模型認為 23 時與 0 時相差最遠（差 23），但現實中兩者只差 1 小時。他希望只新增少量欄位，且讓 23 時與 0 時在特徵空間中彼此相鄰。下列哪項特徵工程最適當？", "options": {"A": "標準化（Standardization）：把小時轉成平均 0、標準差 1 的數值，大小關係不變", "B": "獨熱編碼（One-hot Encoding）：為 24 個小時各開一欄，共新增 24 個欄位", "C": "週期性編碼（Cyclical Encoding）：新增 sin(2π·小時/24) 與 cos(2π·小時/24)", "D": "標籤編碼（Label Encoding）：把小時當類別重新對應成整數編號"}, "answer": "C", "explanation": "答案 C。對星期幾、月份、小時這類週期性欄位，可用 sin／cos 轉換，把值映射到單位圓上，保留相鄰關係（23 時與 0 時很近）且只用兩個欄位。標準化與 Label Encoding 仍保有線性大小關係；One-hot 則讓所有小時彼此等距，也要 24 欄。", "per_option": {"A": "標準化只改變尺度，23 與 0 仍是線性順序的兩端，距離最遠。", "B": "會新增 24 欄，且任兩個小時的距離都相同，無法表達 23 時與 0 時相鄰。", "C": "正確：三角函數編碼保留週期結構，23 時與 0 時會落在圓上相鄰的位置。", "D": "仍然是 0～23 的整數順序，23 與 0 依舊相距最遠。"}, "guide_ref": "學習指引 p.5-9", "hot": true}, {"no": 25, "section": "5.1", "topic_id": "5.1-04", "topic": "類別特徵編碼", "style": "情境", "stem": "某電商要用線性模型預測轉換率，特徵中有「商品編號類別」，共 3,000 種且與目標關聯很強；訓練資料約 20 萬筆。工程師不希望特徵欄位數大量增加，也不希望模型誤以為類別之間有大小順序。下列哪種編碼最適當？", "options": {"A": "目標編碼（Target Encoding）：以各類別的目標平均值取代類別，只需一欄", "B": "獨熱編碼（One-hot Encoding）：為每個類別各開一個 0/1 欄位", "C": "標籤編碼（Label Encoding）：把類別對應成整數編號後直接輸入模型", "D": "直接刪除該欄位（Drop Feature）：類別太多的特徵通常不會有用"}, "answer": "A", "explanation": "答案 A。無序且高基數（3,000 種）的類別：One-hot 會讓維度爆炸，Label Encoding 會引入假順序。Target Encoding 以各類別的目標統計量（如平均轉換率）取代類別，只佔一欄；但必須只用訓練折的目標值計算（可搭配平滑），否則會造成資料洩漏。", "per_option": {"A": "正確：不增加維度、不引入假順序，適合高基數且與目標高度相關的類別。", "B": "3,000 種類別會產生 3,000 欄，造成維度爆炸、吃記憶體並拖慢訓練。", "C": "編號大小對線性模型會被當成類別的高低順序，產生錯誤的數值關係。", "D": "題目已說明這個特徵與目標關聯很強，刪除會損失重要資訊。"}, "guide_ref": "學習指引 p.5-7～5-8", "hot": false}, {"no": 26, "section": "5.1", "topic_id": "5.1-09", "topic": "程式碼閱讀：前處理", "style": "情境", "stem": "某資料分析師以 pandas 處理含缺值的資料，程式如下，執行後印出的結果為何？\n```\nimport pandas as pd\ndf = pd.DataFrame({'age': [25, None, 40, 35, None],\n                   'city': ['A', 'B', None, 'A', 'B']})\ndf['age'] = df['age'].fillna(df['age'].mean())\nprint(df.dropna().shape)\n```", "options": {"A": "(2, 2)", "B": "(4, 2)", "C": "(3, 2)", "D": "(5, 2)"}, "answer": "B", "explanation": "答案 B。age 平均數＝(25+40+35)/3≈33.33，fillna 會把 age 的兩個缺值都補上；此時只剩 city 的第 3 列（索引 2）仍有缺值，dropna() 刪除該列，所以形狀為 (4, 2)。先補值再刪除，與直接刪除的結果不同。", "per_option": {"A": "這是沒有先補 age 就直接 dropna 的結果（有缺值的 3 列都被刪除）；程式已先用 fillna 補齊 age。", "B": "正確：age 的兩個缺值先被平均數補齊，只剩 city 缺值的那一列被刪除，剩 4 列 2 欄。", "C": "誤以為 fillna 只補第一個缺值；實際上整個 age 欄的缺值都會被平均數填補。", "D": "誤以為 dropna 不會處理文字欄；city 欄的缺值同樣會讓該列被刪除。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 算 age 的平均數", "平均 ＝ 有數值的總和 ÷ 有數值的筆數（mean 會略過遺漏值）", "(25 ＋ 40 ＋ 35) ÷ 3 ＝ 100 ÷ 3 ≈ 33.33"], ["② fillna 之後的 age 欄", "fillna(值)：把整欄所有遺漏值都換成該值", "兩個 None 都變成 33.33：age 欄 ＝ 25、33.33、40、35、33.33，age 已沒有遺漏值"], ["③ dropna 逐列檢查", "dropna()：只要某一列「任何一欄」有遺漏值，就整列刪掉", "第 0 列 (25, A) 完整；第 1 列 (33.33, B) 完整；第 2 列 (40, None) 的 city 缺值 → 刪除；第 3 列 (35, A) 完整；第 4 列 (33.33, B) 完整。共刪 1 列"], ["④ 算形狀", "shape ＝ (剩下的列數, 欄數)", "(5 − 1, 2) ＝ (4, 2)，選 B"], ["⑤ 對照其他選項（怎麼算錯的）", "選項分別是沒補 age 直接刪、只補一個缺值、完全沒刪", "A：(2, 2) 是沒補 age 直接 dropna：有缺值的列是第 1 列（age）、第 2 列（city）、第 4 列（age）共 3 列，5 − 3 ＝ 2。C：(3, 2) 是誤以為只補一個 age 缺值：剩下一個 age 缺值列加上 city 缺值列共 2 列被刪，5 − 2 ＝ 3；但 fillna 其實補滿整欄。D：(5, 2) 是誤以為 dropna 不處理文字欄，但 city 的 None 也算遺漏值"]], "code": [["import pandas as pd", "匯入 pandas（處理表格資料的套件），簡稱 pd"], ["df = pd.DataFrame({'age': [25, None, 40, 35, None],", "DataFrame ＝ 表格。建立 age 欄：五筆資料，其中兩筆是 None（遺漏值，放進表格後會變成 NaN，意思是 Not a Number）"], ["'city': ['A', 'B', None, 'A', 'B']})", "建立 city 欄：五筆文字資料，第 3 筆（索引 2）是 None（遺漏值）"], ["df['age'] = df['age'].fillna(df['age'].mean())", "由內往外看：df['age'].mean() ＝ 算 age 欄的平均數（mean ＝ 平均，略過遺漏值）≈ 33.33；fillna ＝ fill（填）na（缺值）：把 age 欄所有遺漏值換成括號內的值；結果存回 df['age']。注意只補 age，city 的缺值還在"], ["print(df.dropna().shape)", "dropna ＝ drop（丟掉）na（缺值）：把任何有遺漏值的整列刪掉，回傳新表格（不改動原本的 df）；.shape ＝ 表格形狀 (列數, 欄數)；print ＝ 印出結果，這裡是 (4, 2)"]], "tip": "先看哪些欄補了值，再用 dropna 逐列找還有缺值的列：先補後刪，結果和直接刪不同。"}}, {"no": 27, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "情境", "stem": "某銀行需向一位被拒絕貸款的客戶解釋原因，所用的黑盒模型為梯度提升樹。分析師在這位客戶的資料附近產生大量略微擾動的樣本，取得黑盒模型對這些樣本的預測，再以一個簡單的線性模型去擬合這些結果，並用線性模型的係數說明各特徵對這一筆預測的影響。此做法屬於下列哪一種方法？", "options": {"A": "偏依圖（Partial Dependence Plot）：呈現某特徵在整體資料上與平均預測之間的關係", "B": "Grad-CAM（Gradient-weighted Class Activation Mapping）：利用卷積層梯度產生熱力圖，標示影像中影響預測的區域", "C": "全域特徵重要性（Global Feature Importance）：彙總各特徵對整體模型表現的貢獻，無法針對單一客戶說明", "D": "LIME（Local Interpretable Model-agnostic Explanations）：以簡單模型近似單筆樣本附近的黑盒行為"}, "answer": "D", "explanation": "答案 D。LIME 是模型無關的局部解釋方法：在單筆樣本附近產生擾動樣本、取得黑盒模型的預測，再用簡單的線性模型近似該區域的決策行為，以其係數說明這一筆預測。SHAP 同樣能做局部解釋；PDP 與全域重要性則屬全域解釋，無法回答個案問題。", "per_option": {"A": "PDP 是全域解釋，看某特徵與預測的整體關係，不針對單一客戶。", "B": "Grad-CAM 用於影像模型，不適用於表格資料的貸款模型。", "C": "全域重要性只說明整體哪些特徵重要，無法說明這一位客戶為何被拒絕。", "D": "正確：擾動單筆樣本、用簡單模型近似局部行為，正是 LIME 的作法。"}, "guide_ref": "學習指引 p.5-14～5-15", "hot": true}, {"no": 28, "section": "5.2", "topic_id": "5.2-02", "topic": "偏差與變異", "style": "情境", "stem": "某團隊以 KNN 分類，K＝1 時訓練準確率為 100%，驗證準確率僅 78%。把 K 逐步調大到 15 後，訓練準確率降為 90%，驗證準確率升到 86%。從偏差與變異的角度看，把 K 調大帶來的主要變化為何？", "options": {"A": "變異上升、偏差下降：模型更貼合訓練資料，因此驗證表現變好", "B": "偏差與變異同時下降：K 越大，模型在這兩方面都必然更好", "C": "變異下降、偏差上升：決策邊界更平滑，模型變簡單，較不受雜訊點影響", "D": "偏差與變異都不變：K 只影響預測時的計算速度，與模型表現無關"}, "answer": "C", "explanation": "答案 C。K＝1 時模型最複雜，訓練準確率 100% 但驗證差（高變異、過擬合）；K 增大，決策邊界變平滑，模型變簡單，偏差上升、變異下降，因此訓練準確率降低、驗證準確率提高。若 K 再增至過大，偏差會太高而導致欠擬合，所以要在兩者間找平衡點。", "per_option": {"A": "訓練準確率反而從 100% 下降，代表更不貼合訓練資料，方向相反。", "B": "偏差與變異通常此消彼長，K 過大則偏差持續上升而導致欠擬合。", "C": "正確：K 越大模型越簡單，偏差升高而變異降低；此處降低變異帶來驗證表現提升。", "D": "K 決定參考多少鄰居，會直接改變決策邊界的平滑程度與模型複雜度。"}, "guide_ref": "學習指引 p.5-16", "hot": false}, {"no": 29, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "計算", "stem": "某團隊有 10 萬筆資料，每訓練一次模型約需 20 分鐘（不論折數，每次訓練時間視為相同）。評估作業只能循序執行，且必須在 2 小時（120 分鐘）內完成一次完整的交叉驗證。下列哪種設定可以在時限內完成？", "options": {"A": "5 折交叉驗證（5-fold）：需訓練 5 次，約 100 分鐘", "B": "10 折交叉驗證（10-fold）：需訓練 10 次，約 200 分鐘", "C": "留一法（LOOCV）：每筆資料輪流當驗證集，需訓練 10 萬次", "D": "重複 5 折交叉驗證 3 次（Repeated 5-fold × 3）：需訓練 15 次，約 300 分鐘"}, "answer": "A", "explanation": "答案 A。交叉驗證的訓練成本≈折數×單次訓練時間：5 折＝5×20＝100 分鐘（可行）；10 折＝200 分鐘；重複 5 折 3 次＝15 次＝300 分鐘；LOOCV 要訓練 n＝100,000 次。資料量大、訓練昂貴時，通常只能選折數較少的 K 折（常見 K＝5）。", "per_option": {"A": "正確：5 × 20＝100 分鐘 < 120 分鐘。", "B": "10 × 20＝200 分鐘，超過 120 分鐘。", "C": "LOOCV 的折數等於樣本數，需訓練 10 萬次，成本遠超時限。", "D": "15 × 20＝300 分鐘，超過 120 分鐘。"}, "guide_ref": "學習指引 p.5-17～5-18；5-26～5-29", "hot": true, "detail": {"steps": [["① 先算時限與公式", "總時間 ＝ 訓練次數 × 單次訓練時間；K 折的訓練次數 ＝ K；重複 K 折 R 次 ＝ K × R；LOOCV 的訓練次數 ＝ 樣本數", "時限 ＝ 2 小時 ＝ 2 × 60 ＝ 120 分鐘；單次訓練 20 分鐘"], ["② 逐一算各選項的總時間，與 120 分鐘比", "有沒有達標：總時間 ≤ 時限才可行", "A：5 折 ＝ 5 × 20 ＝ 100 分鐘，未超過 120，可行。B：10 折 ＝ 10 × 20 ＝ 200 分鐘，超過。D：重複 5 折 3 次 ＝ 5 × 3 ＝ 15 次，15 × 20 ＝ 300 分鐘，超過。C：LOOCV ＝ 100,000 次，100,000 × 20 ＝ 2,000,000 分鐘（約 1,389 天），遠遠超過"], ["③ 結論", "只有總時間不超過時限的選項才能在限期內完成", "只有 A（100 分鐘）達標，選 A"]], "tip": "交叉驗證成本＝訓練次數 × 單次時間；資料大、訓練貴時選折數少的 K 折。", "fig": {"type": "folds", "title": "5 折：訓練 5 次", "k": 5, "note": "5 折＝5×20＝100 分（≤120 可行）；10 折要 200 分，超時"}}}, {"no": 30, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "情境", "stem": "某團隊開發信用卡盜刷偵測模型。業務單位尚未決定要把警示門檻設在 0.3、0.5 還是 0.8，但團隊必須先在兩個候選模型之間做出選擇。下列哪個指標最適合在不固定單一門檻的情況下，比較兩個模型的整體區分能力？", "options": {"A": "固定門檻 0.5 下的準確率（Accuracy）：預測正確的樣本占全部樣本的比例", "B": "ROC-AUC：ROC 曲線（假正率對真正率）下的面積，反映所有門檻下的整體區分能力", "C": "固定門檻 0.5 下的 F1 分數（F1-score）：該門檻下精確率與召回率的調和平均", "D": "均方根誤差（RMSE）：衡量連續預測值與實際值差距的迴歸指標，用於迴歸任務"}, "answer": "B", "explanation": "答案 B。ROC 曲線以假正率為橫軸、真正率為縱軸，隨門檻變動畫出；AUC 是曲線下面積，代表模型在所有可能門檻下的整體區分能力（越接近 1 越好，0.5 約等於隨機猜測），因此適合在門檻尚未決定、需要比較模型時使用。", "per_option": {"A": "只反映單一門檻下的結果，且在類別不平衡時容易失真。", "B": "正確：AUC 綜合所有門檻，越接近 1 區分能力越好，適合尚未決定門檻時比較模型。", "C": "同樣只反映單一門檻，門檻改變後數值就不同。", "D": "RMSE 用於迴歸任務，不是分類模型區分能力的指標。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true}, {"no": 31, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "計算", "stem": "某銀行詐欺偵測模型在 100,000 筆交易（其中 200 筆為詐欺）上測試，真正率（TPR）為 90%，假正率（FPR）為 2%。主管認為這兩項數字都很漂亮，但風控人員擔心「被警示的交易中真正是詐欺的比例」（精確率）可能很低。下列何者最接近該模型此時的精確率？", "options": {"A": "約 90%：精確率等於 TPR", "B": "約 98%：精確率等於 1−FPR", "C": "約 8%：180 ÷ (180＋1,996)", "D": "約 50%：TPR 與 FPR 的平均值"}, "answer": "C", "explanation": "答案 C。實際詐欺 200 筆，負類 99,800 筆。TP＝200×90%＝180；FP＝99,800×2%＝1,996；精確率＝TP÷(TP＋FP)＝180÷2,176≈8.3%。類別極不平衡時，即使 FPR 只有 2%，龐大的負類仍會產生大量誤報，使被警示交易中真詐欺的比例很低。", "per_option": {"A": "精確率的分母是被警示的總數（TP＋FP），與 TPR（分母為實際詐欺數）不同。", "B": "1 − FPR 是特異度（Specificity），不是精確率。", "C": "正確：TP＝200×0.9＝180；FP＝99,800×0.02＝1,996；180/2,176≈8.3%。", "D": "精確率不是 TPR 與 FPR 的平均，必須用 TP 與 FP 的實際筆數計算。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true, "detail": {"steps": [["① 算負類（正常交易）筆數", "負類 ＝ 總筆數 − 正類筆數", "100,000 − 200 ＝ 99,800"], ["② 算 TP（抓到的詐欺）", "TP ＝ 正類筆數 × TPR（真正率＝實際詐欺中被抓到的比例）", "200 × 0.90 ＝ 180"], ["③ 算 FN（漏掉的詐欺）", "FN ＝ 正類筆數 − TP", "200 − 180 ＝ 20"], ["④ 算 FP（誤報的正常交易）", "FP ＝ 負類筆數 × FPR（假正率＝實際正常交易中被誤報的比例）", "99,800 × 0.02 ＝ 1,996"], ["⑤ 算 TN（正確放行的正常交易）", "TN ＝ 負類筆數 − FP", "99,800 − 1,996 ＝ 97,804。檢查：180 ＋ 20 ＋ 1,996 ＋ 97,804 ＝ 100,000 ✓"], ["⑥ 算精確率", "精確率 Precision ＝ TP ÷ (TP ＋ FP)（被警示的交易中，真的是詐欺的比例）", "180 ÷ (180 ＋ 1,996) ＝ 180 ÷ 2,176 ≈ 0.0827，約 8.3%，選 C"], ["⑦ 對照其他選項（怎麼算錯的）", "TPR、特異度、平均值都不是精確率", "A：90% 是 TPR ＝ 180 ÷ (180 ＋ 20) ＝ 0.9，分母是實際詐欺 200 筆，不是被警示的 2,176 筆。B：1 − FPR ＝ 1 − 0.02 ＝ 0.98 是特異度（97,804 ÷ 99,800 ≈ 0.98），不是精確率。D：(0.90 ＋ 0.02) ÷ 2 ＝ 0.46，約接近 50%，但把 TPR 與 FPR 平均沒有任何意義"]], "cm": {"pos": "詐欺", "neg": "正常", "tp": 180, "fp": 1996, "fn": 20, "tn": 97804}, "tip": "類別極不平衡時，小小的 FPR 乘上巨大的負類，FP 會遠多於 TP，精確率就很低。"}}, {"no": 32, "section": "5.3", "topic_id": "5.3-03", "topic": "學習曲線判讀", "style": "情境", "stem": "某團隊訓練迴歸網路，直接預測目標平均值的損失約為 1.00。監控結果：第 5 輪訓練損失 0.52、驗證損失 0.55；第 15 輪訓練 0.31、驗證 0.34；第 30 輪訓練 0.26、驗證 0.29；第 40 輪訓練 0.26、驗證 0.29。下列判讀何者最適當？", "options": {"A": "過擬合（Overfitting）：驗證損失高於訓練損失，代表模型只記住了訓練資料", "B": "欠擬合（Underfitting）：訓練損失沒有降到 0，代表模型的容量不足以學習資料", "C": "資料洩漏（Data Leakage）：兩者如此接近，必然是驗證集混入了訓練資料", "D": "良好配適（Good Fit）：兩條損失都已收斂且差距很小，沒有過擬合跡象"}, "answer": "D", "explanation": "答案 D。看學習曲線要比「差距」與「走向」：兩條損失一起下降、後期持平，且驗證損失只略高於訓練損失（0.29 對 0.26），沒有回升，屬配適良好。過擬合要看到訓練持續下降而驗證停滯或回升、落差擴大；欠擬合則是兩條都停在很高的損失。", "per_option": {"A": "過擬合的訊號是驗證損失停止下降甚至回升、與訓練損失的落差持續擴大；這裡差距小且穩定。", "B": "訓練損失已從基準 1.00 降到 0.26，且驗證損失同步改善；損失不需降到 0 才算好。", "C": "洩漏通常讓驗證表現好得不合理；兩者接近且略有落差是正常的健康現象。", "D": "正確：兩條曲線同步下降、後期持平且差距小，是健康的學習曲線。"}, "guide_ref": "學習指引 p.5-19～5-20", "hot": true}, {"no": 33, "section": "5.3", "topic_id": "5.3-04", "topic": "殘差分析", "style": "計算", "stem": "某團隊預測三天的便當銷量，以「殘差＝實際值−預測值」檢視結果：第 1 天實際 120 個、預測 112 個；第 2 天實際 90 個、預測 105 個；第 3 天實際 75 個、預測 75 個。下列各日殘差與意義，何者正確？", "options": {"A": "第 1 天 +8（預測偏低）、第 2 天 −15（預測偏高）、第 3 天 0（預測剛好）", "B": "第 1 天 −8（預測偏低）、第 2 天 +15（預測偏高）、第 3 天 0（預測剛好）", "C": "第 1 天 +8（預測偏高）、第 2 天 −15（預測偏低）、第 3 天 0（預測剛好）", "D": "第 1 天 8、第 2 天 15、第 3 天 0：殘差只看大小，不分正負"}, "answer": "A", "explanation": "答案 A。殘差＝實際值−預測值：第 1 天 120−112＝+8（預測偏低，低估）；第 2 天 90−105＝−15（預測偏高，高估）；第 3 天 75−75＝0。殘差圖（預測值對殘差）理想上應隨機散布在 0 附近；保留正負號才看得出系統性高估或低估。", "per_option": {"A": "正確：殘差＝實際−預測；正值代表預測低於實際，負值代表預測高於實際。", "B": "符號算反了：依「實際−預測」，第 1 天為 120−112＝+8。", "C": "數值正確但解讀相反：殘差為正代表預測值低於實際值。", "D": "殘差的正負號帶有「高估或低估」的資訊，殘差圖正是靠正負分布判讀模型問題。"}, "guide_ref": "學習指引 p.5-24", "hot": true, "detail": {"steps": [["① 殘差公式與正負意義", "殘差 ＝ 實際值 − 預測值。正 → 預測偏低（低估）；負 → 預測偏高（高估）；0 → 剛好", "題目已定義殘差＝實際值−預測值，照這個方向算"], ["② 逐日計算", "同一條公式", "第 1 天：120 − 112 ＝ +8，實際比預測多，預測偏低。第 2 天：90 − 105 ＝ −15，實際比預測少，預測偏高。第 3 天：75 − 75 ＝ 0，剛好。選 A"], ["③ 對照其他選項（怎麼算錯的）", "符號方向、解讀方向、是否保留正負號，三件事都要對", "B：用了「預測 − 實際」：112 − 120 ＝ −8、105 − 90 ＝ +15，符號整個反了。C：數字 +8、−15 正確，但解讀相反：預測 112 低於實際 120，應是偏低而非偏高。D：取絕對值得 8、15、0，丟掉正負號，就看不出高估或低估"]], "tip": "殘差＝實際 − 預測：正→低估、負→高估；別丟掉正負號。"}}, {"no": 34, "section": "5.3", "topic_id": "5.3-05", "topic": "迴歸評估指標", "style": "情境", "stem": "兩個團隊各自建立迴歸模型：甲團隊預測房價，測試集 R² 為 0.92；乙團隊預測股票次日報酬率，測試集 R² 為 0.05。主管想據此直接判定「甲團隊的模型比乙團隊好」。關於 R² 的解讀，下列何者最適當？", "options": {"A": "R² 為 0.92 代表甲模型的預測準確率為 92%，所以一定優於乙模型", "B": "R² 是各資料集內解釋變異的比例，不同任務或資料集的 R² 不能直接比較", "C": "R² 只要大於 0 就代表模型已具實務價值，乙模型的 0.05 已可上線", "D": "R² 是不受資料影響的標準化指標，因此跨任務時數值較大者一定較好"}, "answer": "B", "explanation": "答案 B。R²＝1−RSS/TSS，衡量的是「相對於直接猜平均，模型多解釋了多少變異」，高度依賴各資料集本身的變異結構；因此不同任務或資料集之間的 R² 無法直接比較。股價報酬本身雜訊極高，R² 偏低很常見，是否有價值要看實際的業務誤差與效益。", "per_option": {"A": "R² 不是準確率，而是模型解釋變異的比例。", "B": "正確：不同任務或資料集的 R² 無法直接比較，是否可用要看業務情境。", "C": "R² 略大於 0 只比猜平均稍好，是否可上線需看業務誤差容忍度，不能只憑 R² 大於 0。", "D": "正因為 R² 取決於各資料集本身的變異，跨任務、跨資料集的 R² 不能直接比較大小。"}, "guide_ref": "學習指引 p.5-22～5-24", "hot": true}, {"no": 35, "section": "5.3", "topic_id": "5.3-09", "topic": "資料洩漏與 Pipeline", "style": "情境", "stem": "某連鎖咖啡店用過去兩年依日期排序的每日銷售紀錄預測銷量，工程師的驗證程式如下。測試誤差極低，但模型上線後預測誤差大幅上升。下列哪一項最可能是主因？\n```\nX = df[['day_index', 'dow', 'promo']]\ny = df['sales']\nX_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.2, shuffle=True, random_state=0)\nmodel.fit(X_tr, y_tr)\nprint(mean_absolute_error(y_te, model.predict(X_te)))\n```", "options": {"A": "測試集過小（Small Test Set）：隨機誤差造成評估偏低，只要把測試集增加到 50% 即可", "B": "資料不足（Insufficient Data）：應改用更複雜的模型並增加網路層數，以提高擬合能力", "C": "特徵未標準化（Unscaled Feature）：日期特徵沒有標準化，造成測試誤差被系統性低估", "D": "時間洩漏（Temporal Leakage）：隨機切分讓測試日夾雜在訓練日之間，模型看過鄰近的未來資料"}, "answer": "D", "explanation": "答案 D。時間序列資料有先後順序，隨機切分會把測試日前後的日子放進訓練集，模型等於「偷看」了未來的資訊，測試誤差被低估。正確做法是依時間切分（訓練在前、測試在後），交叉驗證則用 TimeSeriesSplit 或滾動窗口，確保訓練資料永遠早於驗證資料。", "per_option": {"A": "問題在於切分方式造成洩漏，而不是測試集大小；加大測試集仍然會洩漏。", "B": "測試誤差很低而上線誤差高，是評估被高估而非模型能力不足。", "C": "特徵是否標準化不會造成測試誤差被系統性低估。", "D": "正確：時間序列隨機切分會讓訓練資料包含測試期間前後的資訊，造成洩漏而高估表現。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 隨機切分讓測試日夾在訓練日之間", "shuffle=True 會先把整張表的列隨機洗牌再切；時間序列相鄰的日子很相似，所以測試日的前後幾天會落在訓練集裡", "舉例（題目沒給數字）：資料是第 1 到 10 天。隨機切分後，測試集可能是第 4、8 天，訓練集是 1、2、3、5、6、7、9、10。第 4 天的銷量和第 3、5 天很接近，模型訓練時等於已經看過它「前後的答案」，測試分數會變得很漂亮"], ["② 正確做法", "依時間切：訓練集全部早於測試集；交叉驗證用 TimeSeriesSplit（訓練集依時間逐次變長、驗證集永遠排在訓練集之後）", "舉例（題目沒給數字）：用第 1 到 8 天訓練、第 9 到 10 天測試，模型沒有看過未來，測試誤差才接近上線後的真實誤差，選 D"]], "code": [["X = df[['day_index', 'dow', 'promo']]", "df ＝ 資料表；雙層中括號 ＝ 選出多欄當作特徵 X。day_index ＝ 第幾天（日期編號，依時間遞增）、dow ＝ day of week（星期幾）、promo ＝ promotion（是否促銷）"], ["y = df['sales']", "單層中括號 ＝ 選出一欄當作預測目標 y；sales ＝ 銷量"], ["X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.2, shuffle=True, random_state=0)", "train_test_split 把資料切成四份，順序是：訓練特徵 X_tr、測試特徵 X_te、訓練目標 y_tr、測試目標 y_te（tr ＝ train 訓練、te ＝ test 測試）。test_size=0.2 ＝ 20% 當測試集；shuffle=True ＝ 切之前先隨機洗牌（這就是問題：日期順序被打亂，測試日夾在訓練日之間）；random_state=0 ＝ 固定亂數種子，結果可重現"], ["model.fit(X_tr, y_tr)", "fit ＝ 學習（訓練）：用訓練集的特徵與答案，讓模型學出參數"], ["print(mean_absolute_error(y_te, model.predict(X_te)))", "由內往外看：model.predict(X_te) ＝ 用學好的模型對測試特徵做預測；mean_absolute_error(真實值, 預測值) ＝ 平均絕對誤差（MAE）：每筆算 |真實 − 預測|，再取平均（參數順序是先真實後預測）；print ＝ 印出。因為切分造成洩漏，這個誤差被低估"]], "tip": "時間序列不能隨機切：要依時間切（訓練在前、測試在後），否則等於偷看未來。", "fig": {"type": "flow", "title": "時間序列怎麼切", "cols": [{"label": "✗ 題目的寫法", "bad": true, "steps": ["依日期排好的資料", "!shuffle=True 隨機切", "測試日夾在訓練日間", "測試誤差偏低"], "note": "訓練集已看過測試日前後的銷量，等於偷看未來"}, {"label": "✓ 正確寫法", "steps": ["依日期排好的資料", "前 80% 當訓練集", "後 20% 當測試集", "只用過去預測未來"], "note": "交叉驗證改用 TimeSeriesSplit"}]}}}, {"no": 36, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "否定", "stem": "下列關於 L1／L2 正則化的敘述，何者「錯誤」？", "options": {"A": "加入 L1 或 L2 懲罰項的目的，在於限制模型複雜度以降低過擬合的風險", "B": "面對一組高度相關的特徵，L1 可能只保留其中一個並將其餘歸零，L2 則傾向分攤權重", "C": "選擇正則化係數 λ 時，應挑使訓練集損失最小的 λ，因為這代表模型擬合得最好", "D": "λ 設得過大時，模型受到過強的限制，可能反而造成欠擬合"}, "answer": "C", "explanation": "答案 C。Loss＝原始損失＋λ×懲罰。訓練集上的損失在 λ＝0 時最小，若以此選 λ，等於放棄正則化、最容易過擬合。λ 是超參數，應用驗證集或交叉驗證找出驗證表現最好的值；λ 過小易過擬合，過大則欠擬合。", "per_option": {"A": "正確：正則化透過懲罰權重大小來限制模型複雜度。", "B": "正確：Lasso 的選擇可能不穩定，Ridge 則較穩定。", "C": "錯誤敘述：訓練損失在 λ＝0（不正則化）時最小；λ 應以驗證集或交叉驗證的表現來選。", "D": "正確：λ 並非越大越好，過大會讓模型過度簡化。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true}, {"no": 37, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "計算", "stem": "某層神經元輸出為 [0.4, 0.8, 0.6, 1.0]。訓練時套用丟棄率（Dropout rate）0.2 的倒置 Dropout（Inverted Dropout），本次隨機遮罩為 [1, 0, 1, 1]（1 表示保留、0 表示丟棄），保留的輸出會乘上 1/(1−0.2) 以維持期望值不變。這一層經過 Dropout 後的輸出為何？", "options": {"A": "[0.5, 0, 0.75, 1.25]", "B": "[0.4, 0, 0.6, 1.0]", "C": "[0.32, 0, 0.48, 0.8]", "D": "[0.5, 0.8, 0.75, 1.25]"}, "answer": "A", "explanation": "答案 A。倒置 Dropout 在訓練時把保留下來的輸出除以保留機率
