 (1−rate)＝0.8，即乘 1.25，使輸出的期望值與不丟棄時相同，推論時就不必再縮放也不丟棄。計算：[0.4×1.25, 0, 0.6×1.25, 1.0×1.25]＝[0.5, 0, 0.75, 1.25]。", "per_option": {"A": "正確：保留的元素乘以 1.25：0.4→0.5、0.6→0.75、1.0→1.25，被丟棄的位置為 0。", "B": "漏了縮放：保留的輸出需乘上 1/(1−0.2)＝1.25。", "C": "把保留比例 0.8 當作乘數，方向相反；應乘上其倒數 1.25。", "D": "遮罩為 0 的位置應被丟棄成 0，而不是保留原值。"}, "guide_ref": "學習指引 p.5-45～5-46", "hot": true, "detail": {"steps": [["① 算縮放倍數", "縮放倍數 ＝ 1 ÷ (1 − 丟棄率) ＝ 1 ÷ 保留機率（倒置 Dropout 在訓練時就把保留的值放大，補回被丟掉的部分）", "1 ÷ (1 − 0.2) ＝ 1 ÷ 0.8 ＝ 1.25"], ["② 套用遮罩與縮放", "輸出 ＝ 原輸出 × 遮罩 × 縮放倍數（遮罩 1 ＝ 保留、0 ＝ 丟棄）", "0.4 × 1 × 1.25 ＝ 0.5；0.8 × 0 × 1.25 ＝ 0；0.6 × 1 × 1.25 ＝ 0.75；1.0 × 1 × 1.25 ＝ 1.25 → [0.5, 0, 0.75, 1.25]，選 A"], ["③ 驗算「期望值不變」", "保留機率 × 縮放倍數 ＝ 1，代表平均而言輸出大小不變", "0.8 × 1.25 ＝ 1，所以推論時不丟棄、也不必再縮放"], ["④ 對照其他選項（怎麼算錯的）", "選項分別漏縮放、縮放方向反、沒有丟棄", "B：[0.4, 0, 0.6, 1.0] 沒有乘 1.25，漏了縮放。C：把保留機率 0.8 當成乘數：0.4 × 0.8 ＝ 0.32、0.6 × 0.8 ＝ 0.48、1.0 × 0.8 ＝ 0.8，方向相反（變得更小，應該放大）。D：第 2 個位置遮罩是 0，應該被丟成 0，卻保留了 0.8"]], "tip": "倒置 Dropout：訓練時保留的值乘 1/(1−丟棄率)；被丟的歸 0。"}}, {"no": 38, "section": "5.4", "topic_id": "5.4-03", "topic": "學習率", "style": "情境", "stem": "某工程師訓練影像分類網路時，把學習率從 1e-3 改成 1e-7 後重新訓練，發現 100 個 epoch 內訓練損失只從 2.30 緩慢降到 2.28，曲線平滑、沒有任何震盪。若其他設定都不變，下列哪一種處理最合理？", "options": {"A": "加強正則化（More Regularization）：提高 Dropout 比率與 L2 係數，因為損失降不下去代表過擬合", "B": "加深網路（Deeper Network）：改用層數更多的網路，因為損失降得慢代表容量不足", "C": "再降學習率（Lower Learning Rate）：調小到 1e-9，因為步幅越小越穩定，最終一定更準", "D": "調大學習率（Increase Learning Rate）：逐步調到 1e-5、1e-4、1e-3 並觀察損失下降速度"}, "answer": "D", "explanation": "答案 D。學習率決定每次更新的步幅：太大會震盪或發散，太小則收斂極慢、甚至卡在較差的位置。本題損失平滑但幾乎不下降，且學習率已被調得很小，應逐步調大並觀察，也可搭配遞減、ReduceLROnPlateau 或 warm-up 等調度策略。", "per_option": {"A": "過擬合是訓練損失低、驗證損失高；這裡連訓練損失都幾乎沒下降。", "B": "更深的網路不會解決步幅過小的問題，反而更難訓練。", "C": "學習率過小只會讓收斂極慢，甚至停在高損失的位置，並不會更準。", "D": "正確：損失平滑但下降極慢，是學習率過小的典型現象，應調大並觀察。"}, "guide_ref": "學習指引 p.5-19；5-31～5-32", "hot": true}, {"no": 39, "section": "5.4", "topic_id": "5.4-04", "topic": "資料增強", "style": "情境", "stem": "某團隊用 PyTorch 訓練影像分類模型，將隨機水平翻轉（RandomHorizontalFlip）與隨機色彩抖動（ColorJitter）寫進同一個 transform，並同時套用在訓練集與驗證集。結果發現每次重新評估驗證集，準確率都會在 ±3% 之間波動，難以比較不同實驗。下列哪項修正最適當？", "options": {"A": "強化驗證增強（Augmented Validation）：對驗證集套用更強的隨機增強，使評估更貼近真實", "B": "訓練專用增強（Train-only Augmentation）：驗證與測試集用固定前處理，隨機增強只用在訓練集", "C": "關閉增強（No Augmentation）：關閉訓練集的資料增強，讓訓練與驗證使用相同處理", "D": "加大驗證集（Larger Validation Set）：把驗證集大小加倍，就能完全消除隨機增強造成的波動"}, "answer": "B", "explanation": "答案 B。資料增強的目的是讓模型在訓練時看到更多樣的樣本、提升泛化。驗證與測試資料要代表「真實使用時的資料」，應只做縮放、正規化等確定性處理；若連驗證集都隨機翻轉或改色，每次評估的輸入都不同，結果就會波動且失真。", "per_option": {"A": "隨機增強會讓評估結果更不穩定，且偏離真實資料的分佈。", "B": "正確：評估資料應維持固定、貼近真實分佈，隨機增強只用於訓練。", "C": "資料增強有助於提升泛化，不應為了評估穩定而關閉訓練端的增強。", "D": "增加資料量只能降低波動，無法解決評估資料被隨機改動的根本問題。"}, "guide_ref": "學習指引 p.5-9；5-47", "hot": true}, {"no": 40, "section": "5.4", "topic_id": "5.4-06", "topic": "知識蒸餾與剪枝", "style": "否定", "stem": "下列關於知識蒸餾（Knowledge Distillation）與剪枝（Pruning）的敘述，何者「錯誤」？", "options": {"A": "知識蒸餾讓小型學生模型學習大型教師模型的輸出（如軟標籤），目的是在體積小的前提下逼近教師的表現", "B": "若教師模型帶有偏誤，這些偏誤也可能被傳遞給學生模型", "C": "知識蒸餾不需要額外的訓練時間與運算資源，因為學生模型只是直接複製教師模型的權重", "D": "剪枝若移除過多的權重或神經元，模型的準確率可能明顯下降"}, "answer": "C", "explanation": "答案 C。蒸餾是讓學生模型學習教師模型的輸出（軟標籤）來逼近其表現，學生要另外訓練，因此需要額外的訓練時間與運算資源，並非直接複製權重；教師的偏誤可能傳給學生。剪枝則是移除影響小的權重或神經元，剪得過多會使準確率明顯下降。", "per_option": {"A": "正確：這是蒸餾的定義與目的。", "B": "正確：學生向教師學習，偏誤可能一併被繼承。", "C": "錯誤敘述：蒸餾須另外訓練學生模型，需要額外的訓練時間與資源，且不是複製權重。", "D": "正確：剪太多會損害準確率，常需搭配微調。"}, "guide_ref": "學習指引 p.5-49～5-51", "hot": false}, {"no": 41, "section": "5.4", "topic_id": "5.4-07", "topic": "批次大小", "style": "情境", "stem": "某團隊微調模型時，批次大小 64 在 GPU 上發生記憶體不足（Out of Memory）。他們希望維持與批次 64 等效的梯度估計穩定度與原有的學習率設定，同時讓單次前向與反向傳播能放進記憶體。下列哪種做法最適當？", "options": {"A": "梯度累積（Gradient Accumulation）：批次降為 16，累積 4 次梯度後才執行一次 step()", "B": "小批次即時更新（Smaller Mini-batch）：批次降為 16，每個小批次都立即更新，學習率不變", "C": "增大批次（Larger Batch）：批次增大為 256，並把學習率同步提高 4 倍", "D": "提高學習率（Higher Learning Rate）：維持批次 64，改把學習率提高 4 倍來補償記憶體不足"}, "answer": "A", "explanation": "答案 A。批次大小受 GPU 記憶體限制，且與學習率高度耦合。想維持等效批次 64 又放得進記憶體，可用梯度累積：小批次 16 連續做 4 次反向傳播、累加梯度（實作上每次的損失要先除以 4，累加後才等於 64 筆的平均梯度），之後才 step() 並清除梯度，效果近似批次 64。直接改小批次且每次更新，則梯度雜訊與更新頻率都改變了。", "per_option": {"A": "正確：梯度累積在不增加單次記憶體的前提下，維持等效的批次大小。", "B": "這樣每次只用 16 筆更新，梯度雜訊變大、更新次數變多，並非等效的批次 64。", "C": "批次增大只會讓記憶體問題更嚴重。", "D": "學習率與記憶體用量無關，不能解決記憶體不足。"}, "guide_ref": "學習指引 p.5-32～5-33", "hot": false}, {"no": 42, "section": "6.1", "topic_id": "6.1-01", "topic": "隱私風險類型", "style": "情境", "stem": "某資料團隊要釋出一份用戶資料集供外部研究，需先盤點欄位的隱私風險。下列哪個欄位「單獨存在」就足以指向特定個人，屬於直接識別資訊，應列為最優先遮罩或移除的對象？", "options": {"A": "性別與出生年月（Quasi-identifiers）：兩欄合併後可縮小範圍，但無法單獨確定是誰", "B": "身分證字號（National ID Number）：單獨即可指向特定個人", "C": "郵遞區號（Postal Code）：只能指出大致的所在地區，同一區域有許多人", "D": "職業類別（Occupation）：同一種職業的人數眾多，單獨無法鎖定特定個人"}, "answer": "B", "explanation": "答案 B。隱私風險依「能否認出一個人」分為：直接識別（姓名、身分證字號、Email、電話、金融帳號，單獨即可指向某人，優先級最高）、間接識別（性別、出生年月、職業、地區等準識別資訊，組合後才可能認出）、再識別（已去識別化的資料與外部資料比對後被還原）。", "per_option": {"A": "屬準識別資訊（間接識別），需與其他欄位交叉比對才可能認出個人。", "B": "正確：身分證字號是典型的直接識別資訊（PII）。", "C": "只能指出地區，屬間接識別資訊。", "D": "職業類別單獨無法識別，屬準識別資訊。"}, "guide_ref": "學習指引 p.6-3", "hot": false}, {"no": 43, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "情境", "stem": "數家醫院採用聯邦學習合作訓練診斷模型，各院只上傳模型梯度而不上傳病歷。資安顧問提醒：即使不上傳原始資料，攻擊者仍可能從上傳的梯度逆向推導出部分訓練樣本。下列哪項做法最能針對此風險補強？", "options": {"A": "提高上傳頻率（More Frequent Upload）：每個訓練步驟都上傳梯度，讓攻擊者無法累積資訊", "B": "集中式訓練（Centralized Training）：把全部病歷集中到中央伺服器，統一管理與存取控制", "C": "梯度縮放（Gradient Scaling）：對梯度做 Min-Max 縮放，把數值壓到 0 到 1 之間", "D": "差分隱私（Differential Privacy）：在上傳的更新中加入設計過的噪聲"}, "answer": "D", "explanation": "答案 D。聯邦學習讓資料留在本地、只傳回模型參數更新，但弱點是通訊成本高，且參數更新仍可能被逆向推導。實務上常再搭配差分隱私（對更新加入噪聲，使個別樣本難以被辨識）或安全多方計算、同態加密等技術補強。", "per_option": {"A": "上傳次數越多，攻擊者可觀察到的資訊反而越多，且通訊成本更高。", "B": "集中病歷違背聯邦學習「資料不出院」的目的，並擴大單點外洩風險。", "C": "縮放是可逆的線性轉換，不會消除梯度中所含的個人資訊。", "D": "正確：對更新加噪聲可降低從梯度逆推出個別樣本的風險。"}, "guide_ref": "學習指引 p.6-10～6-12", "hot": true}, {"no": 44, "section": "6.2", "topic_id": "6.2-01", "topic": "偏見類型與成因", "style": "情境", "stem": "某銀行開發信用核准模型時，為避免歧視，已將「族群」欄位從訓練資料中移除，但保留了「居住郵遞區號」。事後稽核發現，由於不同族群集中居住在不同區域，模型仍對特定族群的核准率明顯偏低。這個問題最符合下列哪一種偏見來源？", "options": {"A": "取樣偏差（Sampling Bias）：訓練樣本沒有涵蓋要預測的全體族群", "B": "標籤偏差（Label Bias）：人工標註帶有主觀判斷或刻板印象", "C": "特徵偏差（Feature Bias）：保留的特徵與敏感屬性高度相關，成為代理變數", "D": "過擬合（Overfitting）：模型記住訓練資料的雜訊，不屬於偏見類型"}, "answer": "C", "explanation": "答案 C。移除敏感欄位不代表公平：若其他特徵（如郵遞區號、購物類別）與敏感屬性高度相關，就是敏感屬性的「代理變數」，模型仍會學到差別對待，這屬於特徵偏差。取樣偏差是樣本無法代表全體，標籤偏差則來自帶主觀的標註。", "per_option": {"A": "題目沒有提到樣本未涵蓋特定族群，問題出在保留的特徵。", "B": "題目沒有提到標註過程的主觀判斷。", "C": "正確：郵遞區號是族群的代理變數，特徵設計本身帶入了偏見。", "D": "過擬合是泛化問題，而非偏見來源；偏見來自特徵與敏感屬性的關聯。"}, "guide_ref": "學習指引 p.6-14～6-17", "hot": true}, {"no": 45, "section": "6.2", "topic_id": "6.2-03", "topic": "公平性指標", "style": "計算", "stem": "某貸款模型在 A 族群 200 名申請者中核准 120 人，在 B 族群 100 名申請者中核准 36 人。若以統計均等（Demographic Parity）檢視，下列敘述何者正確？", "options": {"A": "A 族群核准率為 60%、B 族群為 36%，相差 24 個百分點，不符合統計均等", "B": "A、B 族群的核准人數相差 84 人，只要讓 B 族群多核准 84 人就能達成統計均等", "C": "只要模型沒有把族群當作輸入特徵，就自動符合統計均等", "D": "只要兩個族群的模型準確率相近，就符合統計均等"}, "answer": "A", "explanation": "答案 A。統計均等要求各群體獲得正向預測（核准）的比例相近：A＝120/200＝60%，B＝36/100＝36%，差 24 個百分點，明顯不符。它只看結果比例，不管實際是否有資格；與是否使用族群特徵、準確率高低都無關。", "per_option": {"A": "正確：統計均等比較的是各族群被判為正向（核准）的比例。", "B": "統計均等比較的是比例而非人數，兩族群人數不同，不能用人數差修正。", "C": "沒用族群欄位不代表結果比例相同，其他特徵可能是代理變數。", "D": "統計均等看的是通過率，而不是準確率。"}, "guide_ref": "學習指引 p.6-17～6-19", "hot": false, "detail": {"steps": [["① 算各族群的核准率", "核准率 ＝ 核准人數 ÷ 申請人數（統計均等看的是各群被判為正向的比例）", "A 族群：120 ÷ 200 ＝ 0.60 ＝ 60%；B 族群：36 ÷ 100 ＝ 0.36 ＝ 36%"], ["② 算差距", "差距 ＝ 兩個核准率相減（以百分點計）", "60% − 36% ＝ 24 個百分點"], ["③ 判斷", "統計均等要求各族群的核准率相近", "差 24 個百分點，差距很大，不符合統計均等，選 A"], ["④ 對照其他選項（怎麼算錯的）", "統計均等比的是「比例」，不是人數、不是有沒有用族群欄位、不是準確率", "B：人數差 120 − 36 ＝ 84，但兩族群申請人數不同；若 B 族群多核准 84 人就是 36 ＋ 84 ＝ 120 人，120 ÷ 100 ＝ 120%，核准人數超過申請人數，不可能。要追平 A 族群的 60%，B 族群只需核准 100 × 0.6 ＝ 60 人，多 60 − 36 ＝ 24 人。C：沒用族群欄位不代表比例相同，其他特徵可能是代理變數。D：看的是核准率，不是準確率，沒有算式可以由準確率推出核准率"]], "tip": "統計均等＝各群「被核准的比例」要相近；比比例，不比人數。"}}, {"no": 46, "section": "X", "topic_id": "X-01", "topic": "參數量與運算量", "style": "計算", "stem": "某卷積層對 32×32×3 的輸入影像使用 16 個 3×3 卷積核，padding='same'、stride=1，輸出為 32×32×16。若只計算卷積核的乘加次數（MACs，不含偏差項），這一層的運算量最接近下列哪個數字？", "options": {"A": "432", "B": "448", "C": "147,456", "D": "442,368"}, "answer": "D", "explanation": "答案 D。卷積核每個輸出位置要做 3×3×3＝27 次乘加，共 16 個核、輸出 32×32＝1,024 個位置：27×16×1,024＝442,368。參數量則是 (3×3×3+1)×16＝448，與影像大小無關。這也說明卷積層「參數少、運算量大」。", "per_option": {"A": "這是權重數 3×3×3×16，與影像大小無關；運算量還要乘上輸出的高×寬。", "B": "這是含偏差的參數量 (3×3×3+1)×16，屬於參數而非運算量。", "C": "漏乘了輸入通道數 3：3×3×16×32×32＝147,456。", "D": "正確：3×3×3×16×32×32＝442,368。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 一個卷積核在一個輸出位置的乘加次數", "單核單位置 MACs ＝ 核高 × 核寬 × 輸入通道數（每個輸出數字要把核蓋住的那塊所有格子乘一遍再加總）", "3 × 3 × 3 ＝ 27（輸入是彩色 3 通道）"], ["② 輸出位置數", "輸出位置數 ＝ 輸出高 × 輸出寬", "padding='same'、stride=1，輸出長寬與輸入相同：32 × 32 ＝ 1,024"], ["③ 乘上卷積核個數", "總 MACs ＝ 單核單位置 MACs × 輸出位置數 × 卷積核個數", "27 × 1,024 × 16 ＝ 27,648 × 16 ＝ 442,368，選 D"], ["④ 對照：參數量（與影像大小無關）", "參數量 ＝ (核高 × 核寬 × 輸入通道數 ＋ 1) × 卷積核個數（＋1 是偏差）", "(27 ＋ 1) × 16 ＝ 28 × 16 ＝ 448。運算量 442,368 遠大於參數量 448，因為同一組核要在每個位置重複使用"], ["⑤ 對照其他選項（怎麼算錯的）", "選項分別漏掉輸出位置數、誤用參數量、漏掉輸入通道數", "A：27 × 16 ＝ 432，只有權重個數，沒乘輸出位置 1,024。B：448 是含偏差的參數量，不是運算量。C：3 × 3 × 16 × 1,024 ＝ 144 × 1,024 ＝ 147,456，漏乘輸入通道 3（147,456 × 3 ＝ 442,368）"]], "tip": "卷積運算量＝核高×核寬×輸入通道×輸出高×輸出寬×核個數；參數量與影像大小無關。", "fig": {"type": "layers", "title": "每一層的形狀與運算量", "items": [{"name": "輸入", "shape": "32×32×3"}, {"name": "Conv 3×3，16 個", "shape": "32×32×16", "note": "每核每位置 3×3×3 ＝ 27 次乘加", "hl": true}], "note": "乘加 27×16×1,024 ＝ 442,368（參數只有 448）"}}}, {"no": 47, "section": "X", "topic_id": "X-03", "topic": "網格與隨機搜尋", "style": "情境", "stem": "某團隊要調 5 個超參數，其中只有 learning_rate 對表現影響很大。網格搜尋為每個超參數各設 3 個候選值（共 3⁵＝243 組）；隨機搜尋則在相同範圍內抽樣 243 組，且 learning_rate 從連續分佈抽值。比較兩者對這個重要超參數「實際測試過的不同取值數」，下列敘述何者正確？", "options": {"A": "兩者都測到 243 個不同的 learning_rate，因為都跑了 243 組", "B": "網格搜尋只測到 3 種 learning_rate 值，隨機搜尋約測到 243 種", "C": "網格搜尋測到 243 個不同的 learning_rate，隨機搜尋只會重複測到 3 個", "D": "隨機搜尋保證測到全域最佳的 learning_rate，因此一定優於網格搜尋"}, "answer": "B", "explanation": "答案 B。網格搜尋共 3×3×3×3×3＝243 組，但每個超參數只有 3 個候選值，learning_rate 只被測試 3 種取值（每種重複 81 次）；隨機搜尋 243 組中，learning_rate 每次都是新抽的值。當只有少數超參數真正重要時，隨機搜尋在相同預算下通常更有效率，但不保證找到最佳組合。", "per_option": {"A": "網格搜尋的每個超參數只有事先列好的 3 個候選值，會重複出現。", "B": "正確：網格重複使用同樣 3 個值，隨機每組都是新值。", "C": "剛好相反：網格只有 3 個值；隨機搜尋從連續分佈抽樣，幾乎每次都是新值。", "D": "隨機搜尋不保證找到最佳組合，只是在預算相同時通常更有效率。"}, "guide_ref": "指引未載", "hot": true}, {"no": 48, "section": "X", "topic_id": "X-05", "topic": "AutoML", "style": "情境", "stem": "下列四個團隊中，哪一個最適合優先導入 AutoML（自動化機器學習）工具？", "options": {"A": "需要自訂損失函數與特殊網路結構，並精細控制特徵工程細節的研究團隊", "B": "已有成熟的 MLOps 流程與資深工程師，且模型長期穩定運作的團隊", "C": "缺乏專職資料科學家、需在兩週內比較多種模型並建立基準模型的行銷團隊", "D": "必須逐一向監理機關說明每個特徵與決策規則細節、要求完全透明的金融團隊"}, "answer": "C", "explanation": "答案 C。AutoML 自動化前處理、特徵工程、模型選擇與超參數調整，最適合缺專職人力、時間緊迫、想快速比較多種模型並建立基準線的團隊；限制是黑箱程度較高、客製化與細節控制有限，所以高度客製或要求完全透明的專案，仍以手工建模為主。", "per_option": {"A": "高度客製化、需精細控制的專案，手工建模更合適。", "B": "已有成熟流程與專業人力的團隊，導入 AutoML 的優勢較小。", "C": "正確：AutoML 適合缺人力、時間緊、需要快速比較多模型與建立基準線的情境。", "D": "AutoML 的黑箱程度較高、細節控制有限，不利於需要完全透明的場景。"}, "guide_ref": "指引未載", "hot": false}, {"no": 49, "section": "X", "topic_id": "X-06", "topic": "LoRA 微調", "style": "情境", "stem": "某公司有 5 個部門，各自需要一個針對自家文件風格微調的 70 億參數語言模型，但儲存空間與 GPU 顯存都有限。若採用 LoRA（Low-Rank Adaptation）而不是完整微調（Full Fine-Tuning），最主要的好處為何？", "options": {"A": "共用基底（LoRA Adapter）：共用凍結的基底模型，每個部門只另存一組很小的低秩矩陣", "B": "推論加速（Faster Inference）：每個部門仍各存一份完整模型，但低秩分解讓推論速度明顯變快", "C": "基底剪枝（Base Pruning）：須先把基底模型剪枝成原本的 1/5 大小，才能同時服務 5 個部門", "D": "權重取代（Weight Replacement）：低秩矩陣取代基底模型權重，微調後可刪除基底模型"}, "answer": "A", "explanation": "答案 A。LoRA 凍結預訓練權重 W，只訓練兩個瘦矩陣 B（d×r）與 A（r×k），以 ΔW＝B×A 作為更新量，可訓練參數只佔原模型一小部分，因此省顯存。多個任務或部門共用同一份基底模型，各自只需存一組小 adapter；權重也可合併回原模型，推論不增加延遲。", "per_option": {"A": "正確：LoRA 凍結原權重、只訓練並保存小的低秩更新量。", "B": "LoRA 的重點是不必各存完整模型；且權重可合併回原模型，並不會讓推論變快。", "C": "LoRA 不需要剪枝基底模型。", "D": "低秩矩陣是疊加在凍結的基底權重之上（ΔW＝B×A），基底模型仍然必要。"}, "guide_ref": "指引未載", "hot": false}, {"no": 50, "section": "X", "topic_id": "X-07", "topic": "RAG 混合搜尋", "style": "情境", "stem": "某企業的內部規章每週都會修訂，客服機器人需要根據最新條文回答問題，並希望能在答案中引用出處，同時不想每次修訂都重新訓練大型語言模型。下列哪種做法最適當？", "options": {"A": "每週以最新規章全量微調（Full Fine-Tuning）模型：知識寫入權重，但每次修訂都要重新訓練", "B": "調高取樣溫度（Temperature）：讓模型生成更多樣化的答案以涵蓋可能的修訂內容", "C": "縮小模型並剪枝（Pruning）：減少參數量使回答速度變快，降低推論成本", "D": "檢索增強生成（RAG）：先檢索相關條文片段再生成答案，更新時只需更新知識庫索引"}, "answer": "D", "explanation": "答案 D。RAG 先從外部知識庫檢索相關片段，再讓 LLM 依這些片段回答：可使用最新或內部資料、降低幻覺，也能附上來源；知識更新時只需更新知識庫與索引，不必重新訓練模型。微調會把知識寫進權重，更新昂貴，且難以追溯出處。", "per_option": {"A": "成本高、更新慢，也難以標示答案出處。", "B": "提高溫度只增加輸出的隨機性，不會讓模型取得新條文，還可能增加幻覺。", "C": "剪枝是壓縮技術，無法讓模型知道新的條文。", "D": "正確：RAG 可使用最新或內部資料、降低幻覺，且更新不需重訓。"}, "guide_ref": "指引未載", "hot": false}], "7": [{"no": 1, "section": "3.1", "topic_id": "3.1-03", "topic": "貝氏定理與條件機率", "style": "計算", "stem": "某醫院轉診門診的就診者中，約 20% 真的罹患某疾病。該院使用的快篩對患者的陽性率為 90%，對非患者的偽陽性率為 5%。若某位就診者的快篩結果為陽性，其真正罹患該疾病的機率最接近下列何者？", "options": {"A": "90%：快篩對患者的陽性率，就等於陽性者罹病的機率", "B": "約 82%：0.18 ÷ (0.18＋0.04)", "C": "18%：P(患病且陽性)＝0.9×0.2 本身就是所求的機率", "D": "95%：非患者的陰性率 1−0.05，就是陽性者罹病的機率"}, "answer": "B", "explanation": "答案 B。貝氏定理：P(患病|陽性)＝P(陽性|患病)×P(患病) ÷ P(陽性)。分子 0.9×0.2＝0.18；分母（邊際機率）＝0.9×0.2＋0.05×0.8＝0.18＋0.04＝0.22；後驗≈0.818。這裡先驗（盛行率）高達 20%，同一項快篩的陽性預測價值就明顯高於盛行率只有 1% 的一般族群。", "per_option": {"A": "把似然 P(陽性|患病) 當成後驗 P(患病|陽性)，兩者條件方向相反，不是同一個數。", "B": "正確：後驗＝0.18 ÷ (0.18＋0.04)≈0.818。", "C": "0.18 只是聯合機率 P(患病∩陽性)，還要除以邊際機率 P(陽性)＝0.22。", "D": "1−0.05 是 P(陰性|非患者)，與 P(患病|陽性) 無關。"}, "guide_ref": "學習指引 p.3-5～3-6", "hot": true, "detail": {"steps": [["① 貝氏定理（要算什麼）", "P(患病｜陽性) ＝ P(陽性｜患病) × P(患病) ÷ P(陽性)（「｜」念作「在…的前提下」；要算的是「已知快篩陽性，真的有病的機率」）", "題目給的：P(患病) ＝ 20% ＝ 0.2；P(陽性｜患病) ＝ 90% ＝ 0.9；P(陽性｜非患者) ＝ 5% ＝ 0.05。下面分子、分母各算一步"], ["② 分子（有病而且陽性）", "分子 ＝ P(陽性｜患病) × P(患病)（有病的人裡，快篩抓得到的那一塊）", "＝ 0.9 × 0.2 ＝ 0.18"], ["③ 分母（所有陽性的人）", "P(陽性) ＝ P(陽性｜患病)×P(患病) ＋ P(陽性｜非患者)×P(非患者)（陽性來自兩種人：真患者，和被誤判的非患者；P(非患者) ＝ 1 − P(患病)）", "P(非患者) ＝ 1 − 0.2 ＝ 0.8；P(陽性) ＝ 0.18 ＋ 0.05 × 0.8 ＝ 0.18 ＋ 0.04 ＝ 0.22"], ["④ 相除得到答案", "後驗機率 ＝ 分子 ÷ 分母", "＝ 0.18 ÷ 0.22 ≈ 0.818，約 82%，選 B"], ["⑤ 用人數想想看（幫助理解）", "人數法：各族群人數 × 各自的陽性率，再看陽性者中真患者占多少", "舉例（題目沒給數字）：假設有 1,000 人。患者 1,000 × 0.2 ＝ 200 人，其中陽性 200 × 0.9 ＝ 180 人；非患者 1,000 × 0.8 ＝ 800 人，其中陽性 800 × 0.05 ＝ 40 人。陽性共 180 ＋ 40 ＝ 220 人，真患者占 180 ÷ 220 ≈ 0.818，與上面一致"], ["⑥ 對照其他選項（怎麼算錯的）", "P(陽性｜患病)、聯合機率、P(陰性｜非患者) 都不是 P(患病｜陽性)", "A：90% ＝ 題目給的 P(陽性｜患病) ＝ 0.9，這是「有病的人中陽性的比例」，條件方向反了。C：18% ＝ 步驟②的分子 0.9 × 0.2 ＝ 0.18，還沒除以步驟③的 0.22。D：95% ＝ 1 − 0.05 ＝ 0.95，是「非患者中檢驗陰性的比例」，與「陽性者是否有病」無關"]], "tip": "貝氏定理＝「真陽性」÷「所有陽性（真陽性＋偽陽性）」；盛行率越高，陽性者真有病的機率越高。", "fig": {"type": "tree", "title": "機率樹（假設 1,000 人）", "total": "1,000 人", "branches": [{"label": "患病", "p": "20%", "n": "200 人", "leaves": [{"label": "陽性", "p": "90%", "n": "180 人", "hl": "num"}, {"label": "陰性", "p": "10%", "n": "20 人"}]}, {"label": "非患者", "p": "80%", "n": "800 人", "leaves": [{"label": "陽性", "p": "5%", "n": "40 人", "hl": "den"}, {"label": "陰性", "p": "95%", "n": "760 人"}]}], "result": "P(患病｜陽性) ＝ 180 ÷ (180＋40) ＝ 180 ÷ 220 ≈ 81.8%"}}}, {"no": 2, "section": "3.1", "topic_id": "3.1-04", "topic": "參數估計與假設檢定", "style": "情境", "stem": "某電商將新版推薦演算法與舊版做 A/B 測試，以虛無假設 H0「兩版本的點擊率無差異」進行雙尾檢定，設定顯著水準 α＝0.05，得到 p 值為 0.03。下列對此結果的解讀何者最正確？", "options": {"A": "新版本點擊率優於舊版本的機率為 97%，因為 1−0.03＝0.97，所以新版本幾乎確定較好", "B": "虛無假設 H0 成立的機率只有 3%，所以兩版本點擊率無差異這件事幾乎不可能發生", "C": "新版本的點擊率比舊版本高出 3 個百分點，p 值直接反映效果大小，數值愈小代表提升愈大", "D": "H0 為真時，出現此差異（或更極端）的機率約 3%，小於 α，故拒絕 H0，差異達統計顯著"}, "answer": "D", "explanation": "答案 D。假設檢定的決策方式：先設 H0（無差異）與 α，再計算 p 值＝在 H0 為真時，觀察到當前或更極端資料的機率。p＝0.03＜α＝0.05，故拒絕 H0，認為差異具統計顯著性。常見誤解是把 p 值當成「H0 為真的機率」或「效果大小」；它既不是這兩者，也不等於「新版本較好的機率」。", "per_option": {"A": "p 值不是「新版本較好的機率」，也不是 1−p。", "B": "p 值是在假設 H0 為真下計算的，不是 H0 為真的機率。", "C": "p 值只反映證據強弱，不是效果大小；效果大小要看差異本身或信賴區間。", "D": "正確：p 值是「假設 H0 為真時，得到此結果或更極端結果的機率」；0.03＜0.05 故拒絕 H0。"}, "guide_ref": "學習指引 p.3-7", "hot": false}, {"no": 3, "section": "3.2", "topic_id": "3.2-03", "topic": "特徵值分解", "style": "情境", "stem": "某分析師對三個特徵資料的協方差矩陣 Σ（對稱方陣）做特徵值分解 Σ＝QΛQᵀ，得到的三個特徵值為 6、3、1。下列詮釋何者正確？", "options": {"A": "特徵值 1 對應的方向保留了最多資訊，因此應優先作為第一個主成分，其餘方向再依序遞增選取", "B": "三個特徵值加總為 10，表示這份資料中共有 10 個彼此獨立、各自帶有資訊的特徵", "C": "特徵向量彼此正交；特徵值 6 的方向變異最大，三個特徵值總和 10 即總變異量", "D": "只要 Q 是可逆矩陣即可，對稱矩陣的三個特徵向量之間不必彼此垂直，長度也可以不同"}, "answer": "C", "explanation": "答案 C。對稱的協方差矩陣可寫成 Σ＝QΛQᵀ：Q 是正交矩陣，每一欄是一條互相垂直的主軸方向；Λ 對角線上的特徵值是各方向上的變異量，所以最大特徵值 6 的方向是變異最大的方向（第一主成分）。特徵值總和等於 Σ 對角線（各特徵變異數）的總和＝6＋3＋1＝10。", "per_option": {"A": "特徵值愈大代表該方向變異愈大、資訊愈多，第一主成分對應最大的特徵值 6。", "B": "特徵值總和是總變異量，不是獨立特徵的個數；這裡只有 3 個特徵。", "C": "正確：對稱矩陣的特徵向量正交；特徵值代表該方向的變異量，總和等於協方差矩陣的跡（變異數總和）。", "D": "對稱矩陣的特徵向量可取成相互正交，Q 是正交矩陣，不只是可逆。"}, "guide_ref": "學習指引 p.3-13～3-14", "hot": false}, {"no": 4, "section": "3.2", "topic_id": "3.2-04", "topic": "奇異值分解 SVD", "style": "情境", "stem": "某影音平台想以奇異值分解（SVD）分析一個 2,000 位使用者 × 500 部影片的評分矩陣 X（X＝UΣVᵀ），藉此找出潛在的觀影偏好。下列對此做法的說明何者正確？", "options": {"A": "SVD 只適用方陣，必須先把評分矩陣補成 2,000×2,000 的方陣才能分解", "B": "SVD 適用非方陣；奇異值非負、愈大愈重要，保留前 k 個即為低秩近似", "C": "奇異值可以是負值，負的奇異值代表使用者對該類影片有負向偏好，正的則代表正向偏好", "D": "只保留前 k 個奇異值後，近似矩陣的秩仍維持為 500，因此不會達到降維效果"}, "answer": "B", "explanation": "答案 B。SVD 能分解任意 m×n 實數矩陣：U 的欄對應使用者側的潛在方向，V 的欄對應影片側的潛在方向，Σ 的非負奇異值代表各潛在方向的重要性。只保留前 k 個最大的奇異值與對應向量，就得到秩為 k 的低秩近似，這是推薦系統、潛在語意分析與影像壓縮的基礎。", "per_option": {"A": "SVD 不要求方陣，這正是它與特徵值分解的主要差別。", "B": "正確：SVD 適用任意實數矩陣，奇異值非負，截斷到前 k 個即低秩近似。", "C": "奇異值一定是非負實數；使用者的偏好方向由 U、V 的向量表示，不是由奇異值的正負表示。", "D": "保留前 k 個奇異值得到的近似矩陣，秩最多為 k，因此能達成降維與壓縮。"}, "guide_ref": "學習指引 p.3-14", "hot": false}, {"no": 5, "section": "3.3", "topic_id": "3.3-02", "topic": "非凸與局部最優", "style": "情境", "stem": "某團隊用相同的小型 CNN 與相同資料，只改變隨機種子重複訓練 10 次，驗證準確率落在 87%～93% 之間，差異明顯。團隊判斷這是因為損失曲面為非凸、每次出發點不同而落入不同的局部最優。下列哪一種作法最適當？", "options": {"A": "把損失函數換成均方誤差（MSE），因為 MSE 是凸函數，可保證神經網路只有單一全域最小值", "B": "採用 He、Xavier 等初始化並搭配動量或 Adam，再以多組種子重複訓練、依驗證表現挑選", "C": "把學習率調到極大，讓參數一步跨越所有局部最小值，直接落到全域最小值，訓練結果就不再受起點影響", "D": "把全部權重都初始化為 0，讓每次訓練都從同一點出發，藉此消除不同種子之間結果的差異"}, "answer": "B", "explanation": "答案 B。神經網路的損失函數對權重是非凸的，存在多個局部最小值與鞍點，結果會受起點影響。緩解方法包括適當的初始化（He、Xavier）、動量與 Adam 等優化機制、學習率調整；實務上也會用多組種子重複訓練、依驗證表現挑選。全 0 初始化會造成對稱性問題，是典型錯誤。", "per_option": {"A": "MSE 對預測值是凸的，但網路的損失對權重仍是非凸，換損失函數不會讓問題變凸。", "B": "正確：非凸問題無法保證全域最優，實務上靠好的初始化、動量機制，並以多次訓練降低運氣成分。", "C": "學習率過大會震盪甚至發散，並不會保證跳到全域最小值。", "D": "全部初始化為 0 會讓同一層神經元的梯度完全相同、無法分化，網路學不到有用的特徵。"}, "guide_ref": "學習指引 p.3-20～3-21", "hot": false}, {"no": 6, "section": "3.3", "topic_id": "3.3-03", "topic": "損失函數選擇", "style": "情境", "stem": "某新聞平台要為每篇文章自動標註主題標籤，一篇文章可能同時屬於「財經」「科技」「國際」等多個主題，也可能不符合任何一個主題。下列哪一種輸出層與損失函數的搭配最適當？", "options": {"A": "Softmax 搭配類別交叉熵（Categorical Cross-Entropy）：各主題機率總和為 1，適合每篇文章只屬於單一主題", "B": "線性輸出搭配均方誤差（MSE）：把每個主題視為連續數值進行迴歸，再自行訂定門檻", "C": "每個主題各一個輸出節點並搭配 Sigmoid，損失用二元交叉熵（Binary Cross-Entropy）：獨立判斷每個主題是否成立", "D": "單一輸出節點搭配對比損失（Contrastive Loss）：學習兩篇文章之間是否相似"}, "answer": "C", "explanation": "答案 C。多標籤分類中，各標籤彼此不互斥，所以每個標籤用一個 Sigmoid 輸出獨立的機率，損失採二元交叉熵並對各標籤加總（平均）。Softmax＋類別交叉熵假設類別互斥（機率和為 1），適合單標籤多類別；MSE 是迴歸損失；對比損失是相似度學習用的。", "per_option": {"A": "Softmax 讓各類機率相互競爭、總和為 1，只適合單標籤的多類別分類。", "B": "分類任務套用迴歸損失，訓練效率與機率意義都較差，不是標準選擇。", "C": "正確：多標籤分類要讓每個標籤各自獨立判斷，用 Sigmoid＋二元交叉熵。", "D": "對比損失用於學習成對樣本的相似度（如人臉驗證），不是用來預測多個標籤。"}, "guide_ref": "學習指引 p.3-21～3-23", "hot": true}, {"no": 7, "section": "3.3", "topic_id": "3.3-04", "topic": "小批次梯度下降", "style": "情境", "stem": "某影像資料集依類別排序存放（前 3,000 張全是貓、接著 3,000 張全是狗……）。工程師以批次大小 64 依檔案順序取出批次、不打亂資料，訓練時發現損失每換到下一個類別就明顯跳升，呈階梯狀波動。下列何者最能解釋此現象並提出對策？", "options": {"A": "批次大小 64 太大，導致無法估計梯度；應改成每次只用一筆樣本的隨機梯度下降", "B": "每個批次幾乎只含單一類別，梯度估計偏離整體分布；應在每個 epoch 前打亂資料", "C": "小批次梯度下降本來就會讓損失依資料順序跳動，屬正常現象，不需要調整，繼續訓練即可", "D": "模型容量不足以同時記住多個類別，應增加隱藏層數量與神經元數，降低損失的跳動"}, "answer": "B", "explanation": "答案 B。小批次梯度下降是用「一小批樣本的梯度」去估計整體梯度，前提是每批樣本具有代表性。資料依類別排序又不打亂時，每批只含單一類別，估計出的方向偏向該類別，換類別時損失就跳動。對策是每個 epoch 前隨機打亂資料（shuffle），讓各批次混合多個類別。", "per_option": {"A": "批次大小 64 並不會使梯度無法估計；改成單筆樣本只會讓梯度雜訊更大。", "B": "正確：小批次的梯度是整體梯度的估計，批次內類別單一會使估計嚴重偏誤，需每輪打亂（shuffle）。", "C": "批次若有代表性，損失不會依類別順序呈階梯波動；這是需要修正的問題，不是正常現象。", "D": "問題出在批次取樣方式，不是模型容量；增加層數也無法解決順序造成的梯度偏差。"}, "guide_ref": "學習指引 p.3-23～3-24", "hot": false}, {"no": 8, "section": "3.3", "topic_id": "3.3-05", "topic": "動量與 Adam", "style": "計算", "stem": "某優化器採用動量法，更新式為 v_t＝0.9·v_{t−1}＋g_t（v_0＝0，g_t 為第 t 步的梯度，參數沿 −v_t 方向更新）。對同一個參數，情境甲的連續三步梯度為 +2、+2、+2；情境乙為 +2、−2、+2。第 3 步的 v_3 分別為何？", "options": {"A": "甲 6.00、乙 2.00：把三步梯度直接加總，沒有計入衰減係數 0.9", "B": "甲 5.42、乙 1.82：方向一致時累積放大，正負交替時彼此部分抵消", "C": "甲 2.00、乙 2.00：只採用當步梯度，沒有累積過去的方向", "D": "甲 0.54、乙 0.18：誤用 (1−β) 加權平均，而非題目給定的更新式"}, "answer": "B", "explanation": "答案 B。依 v_t＝0.9·v_{t−1}＋g_t 逐步算。甲：v1＝2，v2＝0.9×2＋2＝3.8，v3＝0.9×3.8＋2＝5.42。乙：v1＝2，v2＝0.9×2−2＝−0.2，v3＝0.9×(−0.2)＋2＝1.82。方向一致的維度速度越累積越大，梯度正負交替的維度則互相抵消，所以動量法能加速收斂並減少震盪。", "per_option": {"A": "漏掉 0.9 的衰減，直接把梯度相加。", "B": "正確：甲 v1＝2、v2＝3.8、v3＝5.42；乙 v1＝2、v2＝−0.2、v3＝1.82。", "C": "這等於沒有動量，v_3 只剩當步梯度。", "D": "題目已給定 v_t＝0.9·v_{t−1}＋g_t，沒有 (1−β) 的係數。"}, "guide_ref": "學習指引 p.3-24～3-26", "hot": true, "detail": {"steps": [["① 動量公式", "v_t ＝ β × v_(t−1) ＋ g_t（β 是衰減係數，上一步的「速度」打折後，再加上這一步的梯度 g_t；v_0 ＝ 0）", "題目給 β ＝ 0.9，所以每一步都是「上一步的 v × 0.9 ＋ 這步梯度」。先算情境甲（梯度 +2、+2、+2）"], ["② 甲：第 1 步", "v₁ ＝ β × v₀ ＋ g₁", "＝ 0.9 × 0 ＋ 2 ＝ 2"], ["③ 甲：第 2 步", "v₂ ＝ β × v₁ ＋ g₂", "＝ 0.9 × 2 ＋ 2 ＝ 1.8 ＋ 2 ＝ 3.8"], ["④ 甲：第 3 步", "v₃ ＝ β × v₂ ＋ g₃", "＝ 0.9 × 3.8 ＋ 2 ＝ 3.42 ＋ 2 ＝ 5.42"], ["⑤ 乙：第 1、2 步（梯度 +2、−2、+2）", "同一條公式 v_t ＝ β × v_(t−1) ＋ g_t", "v₁ ＝ 0.9 × 0 ＋ 2 ＝ 2；v₂ ＝ 0.9 × 2 ＋ (−2) ＝ 1.8 − 2 ＝ −0.2"], ["⑥ 乙：第 3 步", "v₃ ＝ β × v₂ ＋ g₃", "＝ 0.9 × (−0.2) ＋ 2 ＝ −0.18 ＋ 2 ＝ 1.82。結果：甲 5.42、乙 1.82，選 B（方向一致越累積越大，正負交替互相抵消）"], ["⑦ 對照其他選項（怎麼算錯的）", "A：不衰減的直接加總 v ＝ g₁＋g₂＋g₃；C：只取當步梯度 v ＝ g₃；D：加權平均式 v_t ＝ β × v_(t−1) ＋ (1−β) × g_t（題目的式子沒有 (1−β)）", "A：甲 2 ＋ 2 ＋ 2 ＝ 6，乙 2 ＋ (−2) ＋ 2 ＝ 2，沒乘 0.9。C：只看第 3 步的 g₃ ＝ 2，甲乙都是 2，等於沒有動量。D：甲 v₁ ＝ 0.1×2 ＝ 0.2，v₂ ＝ 0.9×0.2 ＋ 0.2 ＝ 0.38，v₃ ＝ 0.9×0.38 ＋ 0.2 ＝ 0.542 ≈ 0.54；乙 v₁ ＝ 0.2，v₂ ＝ 0.9×0.2 ＋ 0.1×(−2) ＝ −0.02，v₃ ＝ 0.9×(−0.02) ＋ 0.2 ＝ 0.182 ≈ 0.18"]], "tip": "動量＝把過去的方向「滾雪球」帶著走：方向一致越滾越大，正負交替就互相抵消。"}}, {"no": 9, "section": "4.1", "topic_id": "4.1-06", "topic": "特徵空間與假設空間", "style": "情境", "stem": "某工程師有一份二維資料（特徵 x1、x2）：A 類點密集分布在原點附近的圓內，B 類點分布在外圍的圓環上，兩類在平面上沒有重疊。他以邏輯迴歸訓練，不論訓練多久、如何調整學習率，準確率都只在 50% 上下。下列哪一項最能說明原因與對策？", "options": {"A": "邏輯迴歸的假設空間只含線性邊界，沒有環形邊界；可加入 x1²＋x2² 特徵或改用非線性模型", "B": "特徵空間只有兩個維度，任何分類器在二維特徵空間中都無法分開這兩類資料，須先蒐集更多原始特徵", "C": "訓練輪數（epoch）不足，只要持續訓練並適度調整學習率，直線邊界最終會被學成環形", "D": "資料中含有大量標籤雜訊，應先請專家重新標註全部資料，再重新訓練才可能提升準確率"}, "answer": "A", "explanation": "答案 A。每個模型能表達的函數範圍稱為假設空間：邏輯迴歸只能畫出直線（平面）邊界，同心圓需要曲線邊界，假設空間裡沒有合適的函數，調整訓練時間或學習率都沒用。解法是改變特徵空間（例如加入 x1²＋x2² 讓兩類在新特徵上線性可分），或改用假設空間較大的非線性模型。", "per_option": {"A": "正確：假設空間（模型能表達的函數範圍）裡沒有合適形狀時，再怎麼訓練也學不好。", "B": "二維空間中，決策樹、RBF 核 SVM、神經網路等都能分開同心圓，問題不在維度數量。", "C": "線性邊界的形狀不會因訓練更久而變成曲線。", "D": "題目說明兩類沒有重疊，並未提到標註錯誤。"}, "guide_ref": "學習指引 p.4-3～4-4", "hot": false}, {"no": 10, "section": "4.2", "topic_id": "4.2-02", "topic": "Lasso 與嶺迴歸", "style": "否定", "stem": "關於 Lasso 迴歸與嶺迴歸（Ridge Regression）的敘述，下列何者「不正確」？", "options": {"A": "Lasso 在損失函數中加入係數絕對值總和，可把部分係數壓成 0，兼具特徵選擇效果", "B": "嶺迴歸加入係數平方和的懲罰，使係數整體縮小，特別適合多重共線性嚴重的情況", "C": "兩者的 λ 愈大限制愈強，λ 過大都可能造成欠擬合，通常以交叉驗證選擇", "D": "兩者因為加入了懲罰項，所以能直接捕捉特徵與目標之間的非線性關係"}, "answer": "D", "explanation": "答案 D。答案為「能直接捕捉非線性關係」那一項，它是錯的。Lasso（L1）與嶺迴歸（L2）只是在線性迴歸的損失函數上加懲罰項，用來防止係數過大、處理共線性或做特徵選擇，模型本身仍是線性的；要處理非線性，必須另外加入多項式／交互特徵或改用非線性模型。", "per_option": {"A": "敘述正確：L1 懲罰具稀疏化與特徵選擇效果。", "B": "敘述正確：L2 懲罰縮小係數、穩定估計，適合共線性。", "C": "敘述正確：λ 控制限制強度，過大會壓過頭而欠擬合，需靠交叉驗證選擇。", "D": "不正確（本題答案）：兩者仍是線性模型，正則化只限制係數大小，無法自行產生非線性。"}, "guide_ref": "學習指引 p.4-14～4-17", "hot": false}, {"no": 11, "section": "4.2", "topic_id": "4.2-03", "topic": "支援向量迴歸 SVR", "style": "情境", "stem": "某團隊用 RBF 核函數的支援向量迴歸（SVR）預測用電量，訓練誤差極低但驗證誤差明顯偏高，預測曲線貼著每個訓練點上下起伏。下列哪一項調整最能緩解此問題？", "options": {"A": "降低 C 並適度縮小 RBF 的 γ，減輕對超出容忍帶誤差的追逐，讓曲線更平滑", "B": "同時增大 C 與 γ，讓模型對每個超出容忍帶的點都更敏感，更貼近訓練資料", "C": "把 ε 設為 0，使任何大小的誤差都會被計入懲罰，模型就不會再過度彎曲、貼著每個點", "D": "增加最佳化的迭代次數上限，讓求解收斂得更徹底，訓練誤差與驗證誤差就會一起下降"}, "answer": "A", "explanation": "答案 A。SVR 的目標函數兼顧「模型簡單平滑」（½‖w‖²）與「超出 ε 容忍帶的誤差」（C 倍的懲罰）。C 愈大愈強迫曲線貼近每個點；RBF 的 γ 愈大，單一樣本的影響範圍愈小、曲線愈細碎。訓練誤差極低、驗證誤差高是過擬合，應降低 C 並適度縮小 γ（必要時也可調大 ε）。", "per_option": {"A": "正確：C 愈大愈在意超出 ε 的誤差、γ 愈大曲線愈細碎，降低兩者可降低複雜度。", "B": "增大 C 與 γ 會讓模型更複雜、更貼近訓練點，過擬合更嚴重。", "C": "ε＝0 代表連微小誤差也計入，模型更緊貼資料，反而更容易過擬合。", "D": "SVR 的求解是凸問題，更徹底的收斂不會改變模型的複雜度，也不能緩解過擬合。"}, "guide_ref": "學習指引 p.4-17～4-19", "hot": false}, {"no": 12, "section": "4.2", "topic_id": "4.2-04", "topic": "決策樹", "style": "計算", "stem": "某房仲公司以迴歸樹預測房屋單價（萬元／坪）。訓練後，某個葉節點內的 4 筆訓練樣本單價分別為 50、52、54、68；另一個葉節點內的 3 筆為 32、36、34。新房屋經由各層條件判斷後落入前一個葉節點，迴歸樹對它的預測值為何？", "options": {"A": "56：該葉節點內訓練樣本單價的平均值", "B": "53：該葉節點內訓練樣本單價的中位數", "C": "約 46.6：全部 7 筆訓練樣本單價的平均，沒有使用分裂條件", "D": "45：兩個葉節點平均值（56 與 34）再取平均"}, "answer": "A", "explanation": "答案 A。迴歸樹每個葉節點的預測值，是落在該葉節點的訓練樣本目標值的平均：(50＋52＋54＋68)÷4＝224÷4＝56。因為每個葉節點輸出固定值，迴歸樹的預測呈階梯狀（分段常數）。", "per_option": {"A": "正確：(50＋52＋54＋68)÷4＝56。", "B": "迴歸樹的葉節點輸出是平均值，不是中位數。", "C": "那是整體平均，等於沒有用到樹的分裂結果。", "D": "新樣本只會落入一個葉節點，預測值只由該葉節點決定，不會再與其他葉節點平均。"}, "guide_ref": "學習指引 p.4-19～4-21", "hot": false, "detail": {"steps": [["① 迴歸樹怎麼預測", "迴歸樹的預測值 ＝ 新樣本落入的那個葉節點裡，所有訓練樣本目標值的平均", "新房屋落入「第一個葉節點」，裡面的單價是 50、52、54、68，共 4 筆；另一個葉節點（32、36、34）與這個新房屋無關"], ["② 加總", "總和 ＝ 全部樣本值相加", "＝ 50 ＋ 52 ＋ 54 ＋ 68 ＝ 224"], ["③ 除以筆數", "平均 ＝ 總和 ÷ 筆數", "＝ 224 ÷ 4 ＝ 56，選 A"], ["④ 對照其他選項（怎麼算錯的）", "中位數 ＝ 排序後最中間的值（偶數筆時取中間兩個的平均）；全體平均 ＝ 全部加總 ÷ 全部筆數；「再平均」＝ 兩個葉節點的平均值再取平均", "B：排序 50、52、54、68，中間兩個是 52 與 54，(52 ＋ 54) ÷ 2 ＝ 53，但迴歸樹用的是平均不是中位數。C：另一個葉節點 32 ＋ 36 ＋ 34 ＝ 102；(224 ＋ 102) ÷ 7 ＝ 326 ÷ 7 ≈ 46.6，把兩個葉節點混在一起，等於沒用樹的分裂。D：另一個葉節點平均 102 ÷ 3 ＝ 34；(56 ＋ 34) ÷ 2 ＝ 45，但新房屋只會落在一個葉節點，不會再跟別的葉節點平均"]], "tip": "迴歸樹的葉節點輸出「平均值」，分類樹的葉節點輸出「多數決的類別」。"}}, {"no": 13, "section": "4.2", "topic_id": "4.2-05", "topic": "隨機森林", "style": "情境", "stem": "某銀行以隨機森林偵測信用卡盜刷，資料中盜刷交易僅占 0.2%。模型整體準確率達 99.8%，但在測試集上只抓到 15% 的盜刷交易。下列對此現象的說明與對策何者最適當？", "options": {"A": "樹的數量增加到足夠多時，多數決會自動校正類別比例，不平衡問題將不再存在，不需調整任何設定", "B": "隨機森林在極端不平衡下仍可能偏向多數類；應搭配類別權重或重採樣，並改看召回率、F1 評估", "C": "隨機森林屬於 Bagging，每棵樹獨立抽樣訓練，因此完全不受類別比例影響，不必另外處理", "D": "把 max_depth 設為無限制，讓每個葉節點都達到純淨，就能完整找出全部盜刷交易"}, "answer": "B", "explanation": "答案 B。盜刷只占 0.2% 時，把所有交易都判為正常就有 99.8% 準確率，所以準確率沒有參考價值。隨機森林雖抗過擬合，但遇到極端不平衡仍可能偏向多數類別；做法是設定類別權重、對少數類過採樣或對多數類欠採樣，並用召回率、精確率、F1 或 AUC 評估。", "per_option": {"A": "增加樹的數量主要降低變異，多數決反而可能讓少數類被多數類淹沒。", "B": "正確：隨機森林仍可能偏向多數類別，需處理不平衡並用適合的指標評估。", "C": "Bagging 的重抽樣仍會保留原本的類別比例，並不會免疫於不平衡。", "D": "不限深度只會加重過擬合，且全部猜成正常交易的模型準確率本來就接近 99.8%。"}, "guide_ref": "學習指引 p.4-21～4-22、4-38～4-39", "hot": false}, {"no": 14, "section": "4.2", "topic_id": "4.2-06", "topic": "梯度提升樹", "style": "情境", "stem": "某團隊用梯度提升樹（學習率 0.3、最大深度 10、500 棵樹）訓練違約預測模型，發現訓練損失持續下降，驗證損失在第 120 棵樹之後開始回升。下列哪一項處理最適當？", "options": {"A": "繼續增加樹的數量，直到訓練損失降到接近 0 為止，讓模型把訓練資料完全學會", "B": "提高學習率，讓每一棵新樹更大幅度地修正前面累積的殘差，以加快驗證損失下降", "C": "降低學習率、限制樹深，並用驗證集早停（Early Stopping）決定樹的數量", "D": "增加最大深度，使每棵樹能學到更多細節與特徵交互作用，藉此降低驗證損失"}, "answer": "C", "explanation": "答案 C。梯度提升樹是依序疊加弱學習器、每棵樹學習前面的殘差。訓練損失持續下降而驗證損失回升，是過擬合訊號；學習率高、樹太深都會加重。處理方式是降低學習率、限制樹深（可再配合子樣本比例），並用驗證集早停，讓驗證損失不再改善時停止加樹。", "per_option": {"A": "訓練損失已持續下降、驗證損失回升，再加樹只會更過擬合。", "B": "學習率愈高，每棵樹的修正愈激進，更容易過擬合。", "C": "正確：學習率過高、樹過深都容易過擬合，早停可依驗證損失決定何時停止加樹。", "D": "樹愈深愈容易過擬合；驗證損失回升代表需要降低複雜度而非提高。"}, "guide_ref": "學習指引 p.4-22、4-39", "hot": false}, {"no": 15, "section": "4.3", "topic_id": "4.3-01", "topic": "人工神經元與感知器", "style": "計算", "stem": "某感知器（Perceptron）使用步階函數（z≥0 時輸出 1，否則輸出 0），目前權重 w＝(0.2, −0.4)、偏置 b＝0.1，學習率 η＝0.1。遇到一筆樣本 x＝(1, 2)，其真實標籤 y＝1。依感知器學習規則（w ← w＋η(y−ŷ)x，b ← b＋η(y−ŷ)）更新一次後，新的 w 與 b 為何？", "options": {"A": "w＝(0.3, −0.2)，b＝0.2：ŷ＝0 但 y＝1，權重與偏置都朝誤差方向調整", "B": "w＝(0.3, −0.2)，b＝0.1：權重已更新，但偏置不參與感知器的學習規則", "C": "w＝(0.1, −0.6)，b＝0.0：預測不足時，沿誤差的反方向調整權重與偏置", "D": "w＝(0.2, −0.4)，b＝0.1：z 為負、輸出 0 本身是合法輸出，因此不需要更新"}, "answer": "A", "explanation": "答案 A。先算 z＝0.2×1＋(−0.4)×2＋0.1＝−0.5＜0，步階輸出 ŷ＝0，但 y＝1，誤差 y−ŷ＝+1。更新：w＝(0.2＋0.1×1×1, −0.4＋0.1×1×2)＝(0.3, −0.2)；b＝0.1＋0.1×1＝0.2。感知器只在分類錯誤時更新，且更新量與誤差大小、輸入大小成正比。", "per_option": {"A": "正確：z＝0.2×1＋(−0.4)×2＋0.1＝−0.5，ŷ＝0；w 增加 0.1×1×(1,2)，b 增加 0.1。", "B": "題目給的學習規則明確包含偏置更新 b ← b＋η(y−ŷ)。", "C": "方向相反：當 y−ŷ＝+1 時，應該加上 η·x，而不是減掉。", "D": "只要預測與真實標籤不同（ŷ≠y）就要更新，與輸出是 0 或 1 無關。"}, "guide_ref": "學習指引 p.4-54～4-56", "hot": false, "detail": {"steps": [["① 算 z（加權和）", "z ＝ w₁×x₁ ＋ w₂×x₂ ＋ b（每個權重乘上對應輸入、全部加起來，再加偏置）", "＝ 0.2×1 ＋ (−0.4)×2 ＋ 0.1 ＝ 0.2 − 0.8 ＋ 0.1 ＝ −0.5"], ["② 步階函數得到預測 ŷ", "步階函數：z ≥ 0 輸出 1，否則輸出 0", "z ＝ −0.5 ＜ 0，所以 ŷ ＝ 0"], ["③ 算誤差", "誤差 ＝ y − ŷ（真實標籤 − 預測）；誤差不是 0 才要更新", "＝ 1 − 0 ＝ +1，預測錯了，要更新"], ["④ 更新權重", "新 wᵢ ＝ wᵢ ＋ η × (y−ŷ) × xᵢ（每個權重各自加上「學習率 × 誤差 × 對應輸入」）", "w₁ ＝ 0.2 ＋ 0.1×1×1 ＝ 0.3；w₂ ＝ −0.4 ＋ 0.1×1×2 ＝ −0.4 ＋ 0.2 ＝ −0.2，所以新 w ＝ (0.3, −0.2)"], ["⑤ 更新偏置", "新 b ＝ b ＋ η × (y−ŷ)（偏置可想成輸入固定為 1 的權重）", "＝ 0.1 ＋ 0.1×1 ＝ 0.2，所以答案是 w ＝ (0.3, −0.2)、b ＝ 0.2，選 A"], ["⑥ 對照其他選項（怎麼算錯的）", "正確方向是「加上」η×(y−ŷ)×x；偏置也要更新；ŷ ≠ y 就要更新", "B：w 對了，但 b 沒動，仍是 0.1，題目的規則有 b ← b ＋ η(y−ŷ)，應是 0.2。C：方向相反，用「減」：w ＝ (0.2 − 0.1×1, −0.4 − 0.1×2) ＝ (0.1, −0.6)，b ＝ 0.1 − 0.1 ＝ 0.0。D：不更新，但 ŷ ＝ 0 與 y ＝ 1 不同，感知器只要分類錯就要更新"]], "tip": "感知器只在「猜錯」時更新：新權重 ＝ 舊權重 ＋ 學習率 × 誤差 × 輸入。"}}, {"no": 16, "section": "4.3", "topic_id": "4.3-03", "topic": "前向與反向傳播", "style": "計算", "stem": "某兩層線性網路為 h＝w1·x、ŷ＝w2·h，損失 L＝½(ŷ−y)²。已知 x＝2、w1＝3、w2＝0.5、真實值 y＝1。利用連鎖律做一次反向傳播，損失對 w1 的梯度 ∂L/∂w1 為何？", "options": {"A": "12：∂L/∂ŷ · h ＝ 2×6，這其實是損失對 w2 的梯度", "B": "4：(ŷ−y) · x ＝ 2×2，漏乘了後一層的權重 w2", "C": "2：∂L/∂ŷ · w2 · x ＝ 2×0.5×2，依連鎖律逐項相乘", "D": "1：w2 · x ＝ 0.5×2，漏乘了損失對輸出的梯度 (ŷ−y)"}, "answer": "C", "explanation": "答案 C。先前向：h＝3×2＝6，ŷ＝0.5×6＝3，L＝½×(3−1)²＝2。再反向，依連鎖律從輸出往回乘：∂L/∂ŷ＝ŷ−y＝2；∂ŷ/∂h＝w2＝0.5；∂h/∂w1＝x＝2；所以 ∂L/∂w1＝2×0.5×2＝2。（同理 ∂L/∂w2＝2×h＝12。）反向傳播只負責算梯度，更新權重是優化器的工作。", "per_option": {"A": "12 是 ∂L/∂w2＝(ŷ−y)·h＝2×6，對象搞錯了。", "B": "連鎖律要把路徑上的每一項都乘進來，w1 的梯度必須經過 w2。", "C": "正確：前向得 h＝6、ŷ＝3，(ŷ−y)＝2，故 ∂L/∂w1＝2×0.5×2＝2。", "D": "漏掉最前端的 ∂L/∂ŷ＝(ŷ−y)＝2。"}, "guide_ref": "學習指引 p.4-58～4-61", "hot": false, "detail": {"steps": [["① 前向：算 h", "h ＝ w1 × x", "＝ 3 × 2 ＝ 6"], ["② 前向：算預測 ŷ", "ŷ ＝ w2 × h", "＝ 0.5 × 6 ＝ 3"], ["③ 前向：算損失 L", "L ＝ ½ × (ŷ − y)²", "＝ ½ × (3 − 1)² ＝ ½ × 4 ＝ 2（這題問的是梯度，L 本身只是確認前向通了）"], ["④ 連鎖律的算式", "∂L/∂w1 ＝ ∂L/∂ŷ × ∂ŷ/∂h × ∂h/∂w1（從輸出一路往回，每一段「變化率」相乘；∂ 念作「偏微分」，意思是「某個量變一點點，另一個量跟著變多少」）", "拆成三段各自的公式：∂L/∂ŷ ＝ ŷ − y（把 ½(ŷ−y)² 微分，平方的次方掉下來剛好和 ½ 約掉）；∂ŷ/∂h ＝ w2；∂h/∂w1 ＝ x"], ["⑤ 三段代入", "把步驟①～③的數字代進上面三個公式", "∂L/∂ŷ ＝ 3 − 1 ＝ 2；∂ŷ/∂h ＝ w2 ＝ 0.5；∂h/∂w1 ＝ x ＝ 2"], ["⑥ 相乘得到答案", "∂L/∂w1 ＝ (∂L/∂ŷ) × (∂ŷ/∂h) × (∂h/∂w1)", "＝ 2 × 0.5 × 2 ＝ 2，選 C"], ["⑦ 對照其他選項（怎麼算錯的）", "w2 的梯度：∂L/∂w2 ＝ ∂L/∂ŷ × ∂ŷ/∂w2 ＝ (ŷ−y) × h；少乘任何一段，連鎖律就斷掉", "A：12 ＝ (ŷ−y) × h ＝ 2 × 6，這是 w2 的梯度，不是 w1 的。B：4 ＝ (ŷ−y) × x ＝ 2 × 2，漏乘 w2 ＝ 0.5。D：1 ＝ w2 × x ＝ 0.5 × 2，漏乘 (ŷ−y) ＝ 2"]], "tip": "反向傳播＝連鎖律：從損失出發，沿路每一段的變化率全部乘起來，一段都不能漏。"}}, {"no": 17, "section": "4.3", "topic_id": "4.3-04", "topic": "多層感知器 MLP", "style": "情境", "stem": "某工程師為表格型的房價資料建立多層感知器，堆疊了 5 個隱藏層，但不小心把所有隱藏層的激活函數都設為恆等函數（輸出等於輸入）。訓練後發現其預測效果與一般線性迴歸幾乎相同。最主要的原因為何？", "options": {"A": "層數太多導致梯度消失，使前面各層的權重幾乎不會被更新，模型只能學到線性關係", "B": "隱藏層之間採用全連接，使參數過多而過擬合，因此表現退化成與線性迴歸相同", "C": "輸入層的節點數必須等於隱藏層的節點數，否則各層之間的運算無法銜接而退化成線性關係", "D": "多層線性變換的組合仍等價於單一線性變換，沒有非線性激活，堆疊再多層也沒用"}, "answer": "D", "explanation": "答案 D。多層感知器的非線性能力來自隱藏層的非線性激活函數（如 ReLU）。若激活函數是恆等函數，每層只是矩陣乘法加偏置，多層組合起來仍等價於一個線性變換，所以堆疊再多層，表現也只相當於線性迴歸。", "per_option": {"A": "梯度消失是深層網路搭配飽和型激活函數的問題；恆等函數的梯度恆為 1。", "B": "過擬合會使訓練與驗證表現落差大，不會讓模型剛好等同線性迴歸。", "C": "MLP 各層節點數可以不同，這與是否為線性無關。", "D": "正確：W5(…(W2(W1x)))仍是 x 的線性函數，網路退化為單層線性模型。"}, "guide_ref": "學習指引 p.4-64～4-67", "hot": false}, {"no": 18, "section": "4.3", "topic_id": "4.3-05", "topic": "過擬合與正則化", "style": "否定", "stem": "關於神經網路中抑制過擬合（Overfitting）的各種做法，下列敘述何者錯誤？", "options": {"A": "Dropout（隨機失活）：訓練時隨機屏蔽部分神經元，避免神經元之間過度依賴", "B": "早停法（Early Stopping）：當驗證損失不再改善時提前結束訓練，避免模型過度記憶訓練資料", "C": "彈性網路（Elastic Net）：同時加入 L1 與 L2 兩種懲罰項，兼顧權重稀疏與權重縮小", "D": "減少訓練資料量：資料變少後模型需要記憶的內容減少，因此較不容易過擬合"}, "answer": "D", "explanation": "答案 D。本題要選錯誤的敘述，也就是「減少訓練資料量」那一項，它是錯的。資料量愈少、模型愈容易把雜訊也記下來，過擬合更嚴重。抑制過擬合的正途是取得更多資料、資料增強、降低模型複雜度，以及 L1／L2／Elastic Net、Dropout、早停等正則化手段。", "per_option": {"A": "敘述正確：Dropout 是常用的正則化手段。", "B": "敘述正確：早停法在驗證損失停止下降時結束訓練。", "C": "敘述正確：Elastic Net＝L1＋L2。", "D": "錯誤（本題答案）：資料變少會讓模型更容易記住雜訊，過擬合更嚴重；應增加資料或做資料增強。"}, "guide_ref": "學習指引 p.4-62～4-64", "hot": false}, {"no": 19, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "計算", "stem": "某 CNN 的輸入影像為 64×64×3，第一層為 Conv2D：16 個 5×5 濾波器、步幅（stride）為 2、不補零（padding='valid'）。此層輸出特徵圖的形狀（高×寬×通道）為何？", "options": {"A": "30×30×16：(64−5)÷2 取整數後加 1＝30，通道數等於濾波器數 16", "B": "60×60×16：以步幅 1 計算 (64−5)＋1，忽略了步幅 2", "C": "32×32×16：以為步幅 2 就是把 64×64 直接減半，等同 same padding 的結果", "D": "30×30×3：空間尺寸算對，但誤以為輸出通道數沿用輸入的 3 個通道"}, "answer": "A", "explanation": "答案 A。不補零（valid）的卷積輸出邊長＝floor((輸入−核大小)÷步幅)＋1＝floor((64−5)÷2)＋1＝floor(29.5)＋1＝29＋1＝30。輸出通道數由濾波器個數決定，為 16，所以形狀是 30×30×16。", "per_option": {"A": "正確：floor((64−5)/2)＋1＝floor(29.5)＋1＝30；輸出通道由濾波器數決定。", "B": "步幅 2 時每次移動 2 格，輸出尺寸要用 (輸入−核)÷步幅＋1。", "C": "32×32 需要 same padding 才會出現；題目是 valid（不補零）。", "D": "輸出通道數＝濾波器個數（16），與輸入通道數無關。"}, "guide_ref": "學習指引 p.4-67～4-71", "hot": true, "detail": {"steps": [["① 算輸出的高與寬", "valid 卷積的輸出邊長 ＝ floor((輸入邊長 − 核邊長) ÷ 步幅) ＋ 1（valid ＝ 不補零；floor ＝ 無條件捨去；步幅 ＝ 濾波器每次移動幾格）", "＝ floor((64 − 5) ÷ 2) ＋ 1 ＝ floor(59 ÷ 2) ＋ 1 ＝ floor(29.5) ＋ 1 ＝ 29 ＋ 1 ＝ 30，所以高 × 寬 ＝ 30 × 30"], ["② 算輸出通道數", "輸出通道數 ＝ 濾波器的個數（每個濾波器產生一張特徵圖，與輸入通道數無關）", "題目有 16 個濾波器，所以通道數 ＝ 16"], ["③ 合在一起", "輸出形狀 ＝ 高 × 寬 × 通道", "＝ 30 × 30 × 16，選 A"], ["④ 對照其他選項（怎麼算錯的）", "步幅 1：邊長 ＝ 輸入 − 核 ＋ 1；same 補零：邊長 ＝ ceil(輸入 ÷ 步幅)（ceil ＝ 無條件進位）；通道數看濾波器個數", "B：64 − 5 ＋ 1 ＝ 60，等於當成步幅 1 算，忽略步幅 2。C：ceil(64 ÷ 2) ＝ 32，這是 same padding（補零）才會有的結果，題目是 valid。D：尺寸 30 × 30 對，但通道數寫 3 是輸入的通道數，輸出通道數應該是濾波器個數 16"]], "tip": "valid 卷積邊長 ＝ ⌊(輸入 − 核) ÷ 步幅⌋ ＋ 1；輸出通道 ＝ 濾波器數。", "fig": {"type": "layers", "title": "每一層的形狀", "items": [{"name": "輸入", "shape": "64×64×3"}, {"name": "Conv 5×5，16 個", "shape": "30×30×16", "note": "⌊(64－5)÷2⌋＋1 ＝ 29＋1 ＝ 30", "hl": true}], "note": "valid 不補零、stride＝2；通道數＝濾波器數 16"}}}, {"no": 20, "section": "4.3", "topic_id": "4.3-14", "topic": "遷移學習", "style": "情境", "stem": "某團隊載入在 ImageNet 上預訓練的 ResNet 作為特徵萃取器（卷積層全部凍結，只訓練新接上的分類層），但自己的影像前處理使用與預訓練時不同的尺寸與正規化方式，結果初期準確率遠低於預期。下列哪一項最能說明應沿用預訓練時的輸入前處理？", "options": {"A": "前處理只影響推論速度，與特徵品質無關，可依團隊習慣自行決定，不必與預訓練時一致", "B": "預訓練模型的卷積核大小會隨輸入尺寸自動改變，前處理不一致會造成權重失效", "C": "被凍結的層不參與前向運算，因此輸入前處理只需符合新增的分類層即可，不必考慮凍結層", "D": "預訓練權重是在特定的輸入尺度與分布下學得，前處理不一致會使凍結層萃取的特徵失準"}, "answer": "D", "explanation": "答案 D。遷移學習借用的是預訓練模型在特定輸入分布（尺寸、像素範圍、均值與標準差）上學到的特徵。凍結層仍會做前向運算，所以輸入前處理若與預訓練不一致，萃取出的特徵就會偏掉，連帶讓只訓練的分類層學不好。因此遷移學習時應沿用預訓練模型指定的前處理。", "per_option": {"A": "前處理會改變輸入分布，直接影響特徵品質，並非只影響速度。", "B": "卷積核大小是固定的權重形狀，不會隨輸入尺寸改變。", "C": "凍結只是不更新權重，這些層仍參與前向運算並產生特徵。", "D": "正確：預訓練特徵對輸入分布有依賴，需與預訓練時的尺寸與正規化對齊。"}, "guide_ref": "學習指引 p.4-82", "hot": true}, {"no": 21, "section": "4.3", "topic_id": "4.3-19", "topic": "程式碼閱讀：深度學習", "style": "情境", "stem": "某工程師以 Keras 預測房價（單位：萬元，約 800～3,000），程式如下。訓練 50 個 epoch 後，所有輸入的預測值都接近 1.0，損失居高不下。最可能的原因為何？\n```\nmodel = Sequential([\n    Dense(64, activation='relu', input_shape=(12,)),\n    Dense(1, activation='sigmoid')\n])\nmodel.compile(optimizer='adam', loss='mse')\nmodel.fit(X_train, y_train, epochs=50)\n```", "options": {"A": "損失函數 mse 只適用於分類任務，迴歸任務應改用 binary_crossentropy", "B": "輸出層的 Sigmoid 將輸出限制在 0～1，無法輸出數千的房價；迴歸輸出層應不加激活函數", "C": "隱藏層的 ReLU 不能搭配 mse 損失，應改用 tanh 才能輸出大於 1 的值", "D": "epochs 只有 50 太少，增加訓練輪數後 Sigmoid 的輸出最終就能超過 1"}, "answer": "B", "explanation": "答案 B。迴歸任務的輸出應能涵蓋目標值的範圍，所以輸出層用線性（不加激活函數）搭配 mse。Sigmoid 會把任何輸入壓進 (0, 1)，面對 800～3,000 的目標值只能一路逼近 1.0，損失當然下不來。二元分類才用「Dense(1, activation='sigmoid')＋binary_crossentropy」。", "per_option": {"A": "mse 正是迴歸的標準損失；binary_crossentropy 用於二元分類。", "B": "正確：Sigmoid 輸出恆在 (0, 1)，目標值遠大於 1 時預測只能貼近 1.0。", "C": "ReLU 與 mse 沒有相容性問題；問題在輸出層的值域限制。", "D": "Sigmoid 的值域永遠不超過 1，再多訓練輪數也不會改變。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① Sigmoid 的值域", "sigmoid(z) ＝ 1 ÷ (1 ＋ e^(−z))（把任何數字壓進 0～1 之間；e ≈ 2.718，是自然對數的底）", "舉例（題目沒給數字）：z ＝ 0 → 1 ÷ (1 ＋ 1) ＝ 0.5；z ＝ 5 → 1 ÷ (1 ＋ e⁻⁵) ≈ 1 ÷ 1.0067 ≈ 0.993；z ＝ 100 → 約 1.000。不管 z 多大，輸出都不會超過 1"], ["② 為什麼損失下不來", "mse ＝ (預測值 − 真實值)² 的平均（誤差平方）", "舉例（題目沒給數字）：真實房價 1,500 萬元、預測值被壓在 1.0，誤差平方 ＝ (1.0 − 1,500)² ＝ 1,499² ＝ 2,247,001，非常大，而且模型怎麼學都改不了，因為輸出上限是 1，選 B"], ["③ 對照其他選項（怎麼想錯的）", "迴歸用線性輸出（不加激活函數）搭配 mse；二元分類才用 sigmoid ＋ binary_crossentropy", "A：mse 正是迴歸的標準損失；binary_crossentropy 是分類用的。C：ReLU 在隱藏層沒問題（輸出可以大於 1），問題出在最後一層。D：sigmoid 的上限永遠是 1，訓練再多輪也超不過"]], "code": [["model = Sequential([", "Sequential ＝ 依序堆疊：把各層由上到下串成一條流水線，資料依序流過每一層"], ["Dense(64, activation='relu', input_shape=(12,)),", "Dense ＝ 全連接層，有 64 個神經元；activation='relu' ＝ 輸出經過 ReLU（負數變 0、正數不變）；input_shape=(12,) ＝ 每筆資料有 12 個特徵（只有第一層需要寫輸入形狀）。這一層沒問題"], ["Dense(1, activation='sigmoid')", "輸出層只有 1 個神經元，激活函數是 sigmoid ＝ 把輸出壓進 0～1。預測房價（約 800～3,000 萬）需要的是任意大的數字，所以這一行就是問題所在；迴歸的輸出層應寫 Dense(1)（不加激活函數）"], ["model.compile(optimizer='adam', loss='mse')", "compile ＝ 設定訓練方式：optimizer='adam' ＝ 用 Adam 優化器更新權重；loss='mse' ＝ 均方誤差（mean squared error）損失函數，迴歸的標準選擇。這行寫法是對的"], ["model.fit(X_train, y_train, epochs=50)", "fit ＝ 開始訓練（學習、算出權重）；X_train ＝ 訓練用的輸入特徵；y_train ＝ 訓練用的正確答案（房價）；epochs=50 ＝ 把整份訓練資料完整看 50 輪"]], "tip": "迴歸：最後一層不加激活函數（線性）＋ mse；二元分類：Dense(1, sigmoid) ＋ binary_crossentropy。"}}, {"no": 22, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "情境", "stem": "某銀行用 K 近鄰（KNN）以歐氏距離找出相似客戶，特徵為年齡（20～60 歲）與年收入（30,000～2,000,000 元），直接以原始數值計算距離。結果相似客戶幾乎只由收入高低決定，年齡差異幾乎不影響結果。下列哪一種處理最適當？", "options": {"A": "KNN 是以多數決投票來分類，並不使用距離，因此不需要縮放，應檢查是否為資料錯誤", "B": "用包含測試集的全部資料計算平均與標準差再縮放，確保兩個資料集的尺度完全一致", "C": "兩個特徵都做 Z-score 或 Min-Max 縮放，統計量只由訓練集算出再套用到測試集", "D": "刪除年收入特徵，因為尺度較大的特徵會使距離式模型完全失效，只用年齡建模即可"}, "answer": "C", "explanation": "答案 C。KNN 以距離找鄰居，數值範圍大的特徵（收入）會主導歐氏距離，年齡幾乎被忽略。解法是對特徵做 Z-score 或 Min-Max 縮放，讓各特徵影響力相近。縮放用到的平均、標準差（或最大最小值）只能從訓練集計算，再套用到測試集，否則會造成資料洩漏。", "per_option": {"A": "多數決是在找到「最近的 K 個鄰居」之後才進行，鄰居本身就是依距離挑選的。", "B": "把測試集納入統計量會造成資料洩漏。", "C": "正確：距離式模型必須讓各特徵尺度相近，且縮放統計量只能從訓練集取得，避免洩漏。", "D": "刪除特徵會損失資訊，正確做法是縮放而非刪除。"}, "guide_ref": "學習指引 p.5-6～5-8", "hot": true}, {"no": 23, "section": "5.1", "topic_id": "5.1-02", "topic": "PCA 與降維", "style": "情境", "stem": "某團隊有一份已標註的資料：50 個特徵、3 個類別，希望降維後讓類別彼此更容易分開。下列哪一種方法與可降到的最大維數最適當？", "options": {"A": "主成分分析（PCA）：無監督，保留變異最大的方向，與標籤無關，最多可降到類別數的 3 維", "B": "線性判別分析（LDA）：有監督，找最佳分類投影方向，最多可降到與類別數相同的 3 維", "C": "LDA：有監督，最大化類別間差異、最小化類別內變異，最多降到類別數減 1，即 2 維", "D": "t-SNE：非線性降維，降到 2 維後，可直接當作梯度提升樹等模型的輸入特徵"}, "answer": "C", "explanation": "答案 C。目標是「讓類別更容易分開」且已有標籤，適合有監督的 LDA：它找出最大化類別間差異、最小化類別內變異的投影方向。C 個類別最多只能得到 C−1 個有意義的判別方向（此處 3−1＝2 維，此上限屬教科書補充）。PCA 不用標籤、只看變異；t-SNE 適合畫圖探索，不適合當預測模型的輸入。", "per_option": {"A": "PCA 不看標籤，且可降到的維數與類別數無關。", "B": "LDA 方向正確，但維數上限是類別數減 1，不是等於類別數。", "C": "正確：LDA 利用標籤找最能分開類別的投影方向，維數上限為 min(特徵數, 類別數−1)＝2。", "D": "t-SNE 主要用於視覺化，不保留全域結構，也不適合作為模型輸入特徵。"}, "guide_ref": "學習指引 p.3-13～3-15（C−1 上限屬教科書補充）", "hot": true}, {"no": 24, "section": "5.1", "topic_id": "5.1-03", "topic": "特徵工程策略", "style": "情境", "stem": "某電商用含截距項的線性迴歸預測訂單金額，欄位「付款方式」有信用卡、轉帳、貨到付款三種無大小順序的類別。下列哪一種編碼處理最適當？", "options": {"A": "One-Hot 編碼並刪除一個類別欄：不引入大小順序，也避免三欄和恆為 1 的完全共線", "B": "標籤編碼（Label Encoding）：以 0、1、2 表示三種付款方式，只用一欄、保留類別資訊", "C": "One-Hot 編碼並保留全部三欄：資訊最完整，且與截距項同時使用時不會有任何問題，可直接建模", "D": "目標編碼（Target Encoding）：以全部資料中各付款方式的平均訂單金額取代類別，只用一欄"}, "answer": "A", "explanation": "答案 A。無序類別不能用 0、1、2 這種標籤編碼，否則線性模型會以為「貨到付款＞轉帳＞信用卡」。應改用 One-Hot；但線性迴歸含截距項時，三個虛擬變數相加恆為 1，會與截距完全共線，所以要刪掉一個類別欄（drop_first）。目標編碼若用全部資料計算，會造成目標洩漏。", "per_option": {"A": "正確：無序類別用 One-Hot；刪一欄可避免與截距項形成完全共線（虛擬變數陷阱）。", "B": "0、1、2 會被線性模型當成有大小與間距的數值，引入不存在的順序。", "C": "三欄加總恆為 1，與截距項完全共線，線性迴歸的係數無法唯一求解。", "D": "用全部資料的目標平均值編碼，會把目標資訊帶入特徵而造成洩漏。"}, "guide_ref": "學習指引 p.5-9～5-10", "hot": true}, {"no": 25, "section": "5.1", "topic_id": "5.1-05", "topic": "缺失值處理", "style": "否定", "stem": "關於資料前處理中缺失值（Missing Values）的處理方式，下列敘述何者錯誤？", "options": {"A": "預測模型填補（以其他欄位預測缺值）在特徵之間相關性很低時效果最好", "B": "缺失比例極低、樣本充足且缺失沒有特定偏向時，直接刪除含缺值的資料列是可行的做法", "C": "以平均數填補缺失值簡單易行，但會降低特徵的變異性，並可能造成偏差", "D": "新增「是否缺失」的指標欄位，可讓模型學習缺失本身所帶有的資訊"}, "answer": "A", "explanation": "答案 A。本題要選錯誤的敘述，也就是「相關性很低時效果最好」那一項，它是錯的：用其他欄位預測缺值，要靠欄位間有足夠的相關性；相關性低時預測出來的補值幾乎等於猜測。刪除法僅適用缺失極少且無偏；均值填補簡單但降低變異；缺失指標欄位則適合缺失本身有訊息的情況。", "per_option": {"A": "錯誤（本題答案）：預測模型填補依賴其他欄位的資訊，特徵之間相關性高時效果才好。", "B": "敘述正確：在缺失極少且無偏時，刪除是最單純的做法。", "C": "敘述正確：均值填補會壓縮變異並產生偏差。", "D": "敘述正確：缺失指標編碼讓缺失本身成為特徵。"}, "guide_ref": "學習指引 p.5-2～5-4", "hot": false}, {"no": 26, "section": "5.1", "topic_id": "5.1-06", "topic": "異常值偵測與處理", "style": "否定", "stem": "關於異常值（Outlier）的偵測與處理，下列敘述何者錯誤？", "options": {"A": "IQR 法常將低於 Q1−1.5×IQR 或高於 Q3＋1.5×IQR 的資料點視為異常", "B": "Isolation Forest、LOF 屬於機器學習法，適合用在高維資料的異常偵測", "C": "只要統計方法判定為異常值，就應一律刪除，因為異常值必定來自輸入錯誤", "D": "在詐欺偵測中，異常值可能正是要找的訊號，宜標記保留，不可直接刪除"}, "answer": "C", "explanation": "答案 C。本題要選錯誤的敘述，也就是「一律刪除」那一項，它是錯的。異常值可能來自輸入錯誤，也可能是真實的極端事件，甚至是要預測的目標（如詐欺）。處理策略有三種：確認為錯誤時移除；想保留資料但降低影響時截尾或轉換（Log、Box-Cox）；異常本身有預測價值時標記保留。", "per_option": {"A": "敘述正確：這是 IQR 法的常見做法。", "B": "敘述正確：Isolation Forest、LOF 是機器學習異常偵測方法。", "C": "錯誤（本題答案）：異常值也可能是真實的極端事件或有預測價值的訊號，要依原因決定移除、截尾轉換或標記保留。", "D": "敘述正確：詐欺交易本身就是異常，直接刪除會失去目標。"}, "guide_ref": "學習指引 p.5-3", "hot": false}, {"no": 27, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "情境", "stem": "某銀行用梯度提升樹預測客戶流失機率，並以 SHAP 解釋某位客戶的預測：模型的平均預測流失率（基準值）為 0.45，這位客戶的預測為 0.72；其中「近三個月客服來電次數」的 SHAP 值為 +0.30，「合約剩餘月數」為 −0.15，其餘特徵合計 +0.12。下列解讀何者最正確？", "options": {"A": "SHAP 值加基準值等於此客戶預測（0.45＋0.30−0.15＋0.12＝0.72）；來電次數推高、合約月數拉低", "B": "SHAP 值為負的特徵對預測沒有貢獻，因此「合約剩餘月數」可以從模型中刪除，不影響預測", "C": "「客服來電次數」的 SHAP 值為正，證明增加客服來電會因果性地導致客戶流失，應限制來電次數", "D": "SHAP 只能說明這一位客戶的預測，無法把多位客戶的 SHAP 值彙總成全域特徵重要性，需另用其他方法"}, "answer": "A", "explanation": "答案 A。SHAP 把一筆預測分解成「基準值＋各特徵貢獻」：0.45＋0.30−0.15＋0.12＝0.72。正值表示該特徵把預測推高，負值表示拉低，兩者都是有資訊的貢獻。SHAP 解釋的是模型的行為，不是因果關係；單筆的 SHAP 值也可彙總成全域重要性。", "per_option": {"A": "正確：SHAP 是可加性的特徵貢獻分解，正值推高預測、負值拉低預測。", "B": "負的 SHAP 值代表該特徵把這筆預測拉低，仍有貢獻，不代表可刪除。", "C": "SHAP 解釋的是模型為何如此預測，不代表現實中的因果關係。", "D": "SHAP 除了局部解釋，也可彙總（例如取絕對值平均）成全域特徵重要性。"}, "guide_ref": "學習指引 p.5-14～5-15", "hot": true}, {"no": 28, "section": "5.2", "topic_id": "5.2-03", "topic": "任務類型與模型配對", "style": "情境", "stem": "某零售店只有最近 48 個月的月銷售額，季節性週期明顯，只需預測未來 3 個月，且主管希望模型結構簡單、容易說明。下列哪一種方法最適當？", "options": {"A": "LSTM（長短期記憶網路）：以門控機制記憶長期依賴，通常需要大量序列資料才能穩定訓練", "B": "K-means：依距離把月份分為球狀群集，適合群數已知的分群任務", "C": "支援向量機分類（SVM）：適合邊界清楚、高維小樣本的分類任務", "D": "ARIMA（自迴歸整合移動平均模型）：適合資料量不大、短期預測且週期性明顯的時間序列"}, "answer": "D", "explanation": "答案 D。選模型先看任務：這是「用歷史數值預測未來數值」的時間序列預測。資料只有 48 個月、季節性明顯、只預測短期，且要求簡單好說明，ARIMA（或帶季節項的 SARIMA）最合適。LSTM 等神經網路需要較多資料；K-means 是分群；SVM 分類預測的是類別。", "per_option": {"A": "LSTM 能處理序列，但 48 筆資料太少、結構也不易說明。", "B": "K-means 是無監督分群，不是預測未來數值。", "C": "SVM 分類預測的是類別，不是連續的銷售額。", "D": "正確：小量資料、短期、有週期的時間序列，ARIMA 結構簡單且易解釋。"}, "guide_ref": "學習指引 p.5-11～5-13", "hot": false}, {"no": 29, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "情境", "stem": "某團隊有 2,000 筆標註資料，要用交叉驗證估計模型的泛化能力，在 K＝2 與 K＝10 之間猶豫。下列比較何者最正確？", "options": {"A": "K＝2：每折驗證集最大，估計偏差一定最小，且訓練成本最低，在任何資料量下都應一律優先採用", "B": "K＝10：訓練集占 90%，估計較接近全資料訓練的表現，但訓練次數約為 K＝2 的 5 倍", "C": "K＝10：總資料量相同，所以訓練總時間與 K＝2 相同，差別只在資料切成幾份，成本不會增加", "D": "K 值只影響隨機切分的運氣，不影響每次訓練使用的資料量，也不影響估計的偏差，因此可隨意選擇"}, "answer": "B", "explanation": "答案 B。K 折交叉驗證每次用 (K−1)/K 的資料訓練。K＝2 只有 1,000 筆訓練，K＝10 則有 1,800 筆，後者更接近最終用全部資料訓練的情況，因此估計偏差較小；代價是要訓練 10 次而不是 2 次，訓練次數約 5 倍（每次訓練用的資料也較多，總運算量增加得更多）。實務上常用 K＝5 或 10 做折衷。", "per_option": {"A": "K＝2 時每次只用一半資料訓練，模型通常比全資料訓練的更差，估計偏悲觀（偏差較大）。", "B": "正確：K 愈大每次訓練用的資料愈接近全部資料，估計偏差較小，但需訓練 K 次，運算成本隨之增加。", "C": "交叉驗證要訓練 K 次；K＝10 的訓練次數是 K＝2 的 5 倍，每次訓練集也較大，總訓練時間只會更長，不會相同。", "D": "K 決定每次訓練集的大小，會直接影響估計的偏差與運算成本。"}, "guide_ref": "學習指引 p.5-17～5-18、5-26～5-29", "hot": true}, {"no": 30, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "情境", "stem": "某分類模型的 5 折交叉驗證準確率依序為 0.91、0.90、0.92、0.91、0.64。在報告模型表現之前，最適當的第一步是什麼？", "options": {"A": "檢查第 5 折的資料（類別分布、時間或群組、資料排序等），找出表現偏低的原因再決定如何報告", "B": "直接報告平均值 0.856 作為模型的穩定表現，因為平均已涵蓋所有折的結果，不需另外說明各折差異", "C": "刪除表現最差的第 5 折，只報告其餘四折的平均 0.91，因為該折必定是離群值，不具代表性", "D": "改用留一法（LOOCV），因為折數愈多，每折的驗證集愈小，就一定能消除單一折的異常"}, "answer": "A", "explanation": "答案 A。交叉驗證不只看平均，也要看各折的變異。前四折都在 0.90～0.92，唯獨第 5 折 0.64，代表那一折的資料可能有特殊分布（例如類別比例懸殊、資料依順序排列、含特定群組）。應先查明原因，再決定是否需要分層、分組或重新切分，而不是直接取平均或刪除該折。", "per_option": {"A": "正確：各折分數差異過大是警訊，先診斷原因（切分不均、資料分布差異、洩漏或群組效應），再解讀結果。", "B": "平均值會掩蓋某折的嚴重異常，也無法反映模型的穩定性。", "C": "擅自刪除表現差的折，是挑選對自己有利的結果，且無法證明它是離群值。", "D": "換成 LOOCV 不保證解決問題，且成本極高；根因（資料切分）仍未查明。"}, "guide_ref": "學習指引 p.5-17～5-18", "hot": true}, {"no": 31, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "情境", "stem": "某社群平台的自動封鎖系統會直接停權被判為「惡意帳號」的使用者。誤封正常使用者會引發大量客訴與信任危機，而漏掉少數惡意帳號可由人工巡查補救。評估模型時，下列哪一種指標與調整方向最適當？", "options": {"A": "以召回率（Recall）為主要指標，必要時降低判定門檻，確保惡意帳號幾乎全數被抓到", "B": "以精確率（Precision）為主要指標，必要時提高門檻，讓被判為惡意的帳號中真正惡意的比例更高", "C": "以準確率（Accuracy）為主要指標，因為惡意帳號占比很低時，準確率最能反映整體品質", "D": "以 F1 為主要指標，並要求精確率與召回率權重完全相等，因為任何情境下兩者都同等重要"}, "answer": "B", "explanation": "答案 B。先看哪一種錯誤代價高：誤封正常使用者是誤報（False Positive），代價高；漏掉惡意帳號是漏報（False Negative），可補救。因此應重視精確率 TP÷(TP＋FP)，並可提高判定門檻，讓「被判為惡意」的更可信，代價是召回率下降。準確率在不平衡資料下會誤導。", "per_option": {"A": "漏報代價高時才重視召回率；本題誤封的代價高。", "B": "正確：誤報（FP）代價高時重視精確率 TP÷(TP＋FP)；提高門檻可減少誤判，但召回率會下降。", "C": "惡意帳號占比低時，全部判為正常也有很高的準確率，準確率會誤導。", "D": "F1 把兩者視為同等重要，與題目「誤封代價遠高於漏掉」的需求不符。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true}, {"no": 32, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "計算", "stem": "某模型對 1,000 筆資料進行預測，資料中實際為正類的有 300 筆；模型共預測 200 筆為正類，其中精確率（Precision）為 0.75。此模型的召回率（Recall）與 F1 分數分別約為何？", "options": {"A": "Recall＝0.75、F1＝0.75：把精確率誤當成召回率，沒有計算 TP 與實際正類數", "B": "Recall＝0.67、F1＝0.71：以預測正類數 200 除以實際正類數 300 計算召回率", "C": "Recall＝0.50、F1＝0.625：以精確率與召回率的算術平均數取代調和平均數", "D": "Recall＝0.50、F1＝0.60：TP＝150，Recall＝150÷300，F1 為調和平均"}, "answer": "D", "explanation": "答案 D。Precision＝TP÷預測正類數，所以 TP＝0.75×200＝150。Recall＝TP÷實際正類數＝150÷300＝0.5。F1＝2×P×R÷(P＋R)＝2×0.75×0.5÷1.25＝0.6（調和平均，比算術平均 0.625 低，因為較小的值會拉低 F1）。", "per_option": {"A": "精確率的分母是預測為正類的數量，召回率的分母是實際正類的數量，兩者不同。", "B": "200 是預測為正類的數量，不是 TP；召回率的分子必須是 TP＝150。", "C": "F1 是調和平均數，不是算術平均數；算術平均會高估。", "D": "正確：TP＝150、FN＝150，Recall＝0.5；F1＝2×0.75×0.5÷1.25＝0.6。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true, "detail": {"steps": [["① 由精確率反推 TP", "Precision ＝ TP ÷ 預測為正類的數量，所以 TP ＝ Precision × 預測為正類的數量（TP ＝ 預測正類而且真的是正類）", "TP ＝ 0.75 × 200 ＝ 150"], ["② 算 FP", "預測為正類的數量 ＝ TP ＋ FP，所以 FP ＝ 預測為正類的數量 − TP（FP ＝ 預測正類但其實是負類）", "FP ＝ 200 − 150 ＝ 50"], ["③ 算 FN", "實際為正類的數量 ＝ TP ＋ FN，所以 FN ＝ 實際為正類的數量 − TP（FN ＝ 實際是正類卻被漏掉）", "FN ＝ 300 − 150 ＝ 150"], ["④ 算 TN（填滿混淆矩陣）", "TN ＝ 總筆數 − TP − FP − FN", "＝ 1,000 − 150 − 50 − 150 ＝ 650"], ["⑤ 算召回率 Recall", "Recall ＝ TP ÷ (TP ＋ FN) ＝ TP ÷ 實際為正類的數量", "＝ 150 ÷ (150 ＋ 150) ＝ 150 ÷ 300 ＝ 0.5"], ["⑥ 算 F1", "F1 ＝ 2 × Precision × Recall ÷ (Precision ＋ Recall)（調和平均，會被較小的那個拉低）", "＝ 2 × 0.75 × 0.5 ÷ (0.75 ＋ 0.5) ＝ 0.75 ÷ 1.25 ＝ 0.6，所以 Recall ＝ 0.50、F1 ＝ 0.60，選 D"], ["⑦ 對照其他選項（怎麼算錯的）", "召回率的分子是 TP、分母是實際正類數；F1 是調和平均，不是算術平均", "A：把 Precision 0.75 當成 Recall，F1 也就變成 0.75。B：用預測正類數 200 ÷ 實際正類數 300 ≈ 0.67 當 Recall，分子錯用 200（不是 TP）；F1 ＝ 2 × 0.75 × 0.67 ÷ (0.75 ＋ 0.67) ≈ 1.0 ÷ 1.42 ≈ 0.71。C：Recall 0.50 對，但 F1 用算術平均 (0.75 ＋ 0.5) ÷ 2 ＝ 0.625，不是調和平均的 0.6"]], "cm": {"pos": "正類", "neg": "負類", "tp": 150, "fp": 50, "fn": 150, "tn": 650}, "tip": "Precision 看「預測正類」裡抓對幾個；Recall 看「實際正類」裡抓到幾個；F1 是兩者的調和平均。"}}, {"no": 33, "section": "5.3", "topic_id": "5.3-03", "topic": "學習曲線判讀", "style": "情境", "stem": "某團隊畫出學習曲線（橫軸為訓練樣本數，縱軸為準確率）：訓練準確率始終維持在 0.99 左右；驗證準確率隨樣本數由 0.70 逐步升到 0.80，且曲線仍在上升，兩條曲線之間的差距隨樣本數增加而縮小。下列判讀與建議何者最適當？", "options": {"A": "屬於高偏差（欠擬合）：模型太簡單，應增加模型複雜度或加入更多特徵", "B": "已達最佳狀態：訓練準確率高達 0.99，不需再調整模型或蒐集資料", "C": "屬於高變異（過擬合）：增加訓練資料通常有幫助，也可搭配正則化", "D": "屬於資料洩漏：驗證準確率低於訓練準確率，代表驗證集混入了訓練資料"}, "answer": "C", "explanation": "答案 C。判讀學習曲線要看「差距＋走向」：訓練準確率高且持平、驗證準確率明顯較低但隨樣本數上升、兩者差距在縮小，屬於高變異（過擬合）。這種情況增加訓練資料通常能繼續提升驗證表現，也可以用正則化、降低模型複雜度、資料增強等手段。高偏差則是兩條曲線都停在低處且貼近。", "per_option": {"A": "高偏差的特徵是訓練與驗證都差且接近，而本題訓練準確率很高。", "B": "訓練與驗證落差大，代表泛化能力仍不足，不能只看訓練準確率。", "C": "正確：訓練表現極高、驗證表現明顯較低且仍在上升，是高變異；更多資料能縮小差距。", "D": "洩漏會讓驗證分數異常偏高，而不是低於訓練分數。"}, "guide_ref": "學習指引 p.5-19～5-20", "hot": true}, {"no": 34, "section": "5.3", "topic_id": "5.3-04", "topic": "殘差分析", "style": "情境", "stem": "某工程師完成多元線性迴歸後繪製殘差圖：殘差隨機散布在 0 的上下，沒有彎曲或規律，寬度從左到右大致一致，也沒有明顯的極端點；但模型的 R² 只有 0.55。下列判讀何者最適當？", "options": {"A": "殘差沒有規律代表模型已捕捉全部可預測的訊息，R² 偏低只是計算誤差，不需要再處理", "B": "殘差沒有規律代表模型漏掉了非線性關係，應立即加入高次項或交互項，並改用更複雜的模型", "C": "殘差無系統性規律，表示線性形式與等變異假設大致成立；R² 偏低較可能因缺少有資訊的特徵", "D": "殘差隨機散布代表違反獨立性假設，殘差之間彼此相關，應改用時間序列模型，並加入滯後特徵"}, "answer": "C", "explanation": "答案 C。殘差圖的警訊是「有規律」：U 形或波浪代表漏掉非線性、喇叭形代表變異數不一致、相鄰殘差相關代表自相關、少數極端點可能是異常值。本題殘差隨機且寬度一致，這些問題都沒有出現，表示模型形式大致合理。R² 偏低多半是因為特徵缺乏足夠資訊或資料本身雜訊大，應補充新特徵而不是盲目加複雜項。", "per_option": {"A": "R² 是解釋變異的比例，偏低反映模型確實沒解釋掉的部分，不是計算誤差。", "B": "漏掉非線性時，殘差會呈 U 形或波浪等系統性彎曲，本題沒有。", "C": "正確：健康的殘差圖代表模型形式沒有明顯問題；解釋力不足需要更多有資訊的特徵。", "D": "違反獨立性（自相關）時，殘差會呈現相鄰彼此相關的規律，隨機散布反而代表沒有此問題。"}, "guide_ref": "學習指引 p.5-24", "hot": true}, {"no": 35, "section": "5.3", "topic_id": "5.3-09", "topic": "資料洩漏與 Pipeline", "style": "情境", "stem": "某工程師評估房價模型，程式如下，測試集 R² 高達 0.93。下列對此流程的評論何者最正確？\n```\nscaler = StandardScaler()\nX_scaled = scaler.fit_transform(X)\nX_tr, X_te, y_tr, y_te = train_test_split(X_scaled, y, test_size=0.2, random_state=42)\nmodel = LinearRegression().fit(X_tr, y_tr)\nprint(r2_score(y_te, model.predict(X_te)))\n```", "options": {"A": "StandardScaler 會把特徵壓縮到 0～1 的區間，破壞原始分布，應改用 Min-Max 縮放", "B": "縮放器用含測試集的全部資料算統計量造成洩漏；應先切分，只用訓練集 fit，再對測試集 transform", "C": "test_size＝0.2 代表只用 20% 的資料訓練，訓練資料過少，是此流程最主要的問題，應改成 0.8", "D": "random_state＝42 固定亂數種子，會使每次切分結果相同，導致測試結果過度樂觀，評估分數不可信"}, "answer": "B", "explanation": "答案 B。正確流程是先 train_test_split，再對訓練集 scaler.fit_transform，測試集只 scaler.transform。本題先對全部資料 fit_transform，平均與標準差已經「看過」測試集，屬於資料洩漏，評估結果不再是對全新資料的真實估計。更穩當的做法是把縮放與模型放進 Pipeline。", "per_option": {"A": "Z-score 標準化得到平均 0、標準差 1，不會壓縮到 0～1（那是 Min-Max）。", "B": "正確：先對全資料 fit 再切分，統計量含有測試資料，是資料洩漏；應切分後只對訓練集 fit。", "C": "test_size＝0.2 是 20% 作測試、80% 訓練，並非只用 20% 訓練。", "D": "固定 random_state 只是讓切分可重現，不會使結果樂觀。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 標準化在算什麼", "z-score ＝ (x − 平均) ÷ 標準差（平均與標準差都是從「fit 時看到的資料」算出來的）", "舉例（題目沒給數字）：訓練集某特徵為 10、20、30，測試集為 100。只用訓練集算，平均 ＝ (10 ＋ 20 ＋ 30) ÷ 3 ＝ 20；若先把全部資料合在一起，平均 ＝ (10 ＋ 20 ＋ 30 ＋ 100) ÷ 4 ＝ 40。測試資料 100 把平均拉到 40，等於測試集影響了縮放的標準，這就是資料洩漏"], ["② 正確流程", "先切分，再只對訓練集 fit；測試集只 transform（套用訓練集算出的平均與標準差）", "題目程式在第二行對全部資料 X 做 fit_transform，之後才 train_test_split，順序顛倒，選 B"], ["③ 對照其他選項（怎麼想錯的）", "StandardScaler ＝ 標準化（平均 0、標準差 1）；Min-Max ＝ 壓到 0～1；test_size ＝ 測試集的比例", "A：StandardScaler 不會壓到 0～1，壓到 0～1 的是 Min-Max。C：test_size=0.2 ＝ 20% 當測試、80% 當訓練，不是只用 20% 訓練。D：random_state=42 只是固定亂數種子，讓切分每次相同、可以重現，不會讓分數變樂觀"]], "code": [["scaler = StandardScaler()", "建立一個標準化器（StandardScaler ＝ 把每個特徵轉成平均 0、標準差 1）；這時還沒看任何資料"], ["X_scaled = scaler.fit_transform(X)", "fit_transform ＝ fit（學習：算出每個特徵的平均與標準差）＋ transform（套用：把資料轉換）一次做完；傳入的 X 是「全部資料」，包含之後的測試集，所以平均與標準差已經看過測試資料，這是洩漏的來源；回傳轉換後的 X_scaled"], ["X_tr, X_te, y_tr, y_te = train_test_split(X_scaled, y, test_size=0.2, random_state=42)", "train_test_split ＝ 把資料切成訓練集與測試集；test_size=0.2 ＝ 20% 當測試、80% 當訓練；random_state=42 ＝ 固定亂數種子，讓每次切法一樣；回傳四個東西：訓練特徵 X_tr、測試特徵 X_te、訓練答案 y_tr、測試答案 y_te。問題是它切的是「已經縮放過」的資料"], ["model = LinearRegression().fit(X_tr, y_tr)", "LinearRegression ＝ 線性迴歸模型；.fit(X_tr, y_tr) ＝ 用訓練特徵與訓練答案學習（算出係數），並回傳學好的模型"], ["print(r2_score(y_te, model.predict(X_te)))", "model.predict(X_te) ＝ 用學好的模型預測測試特徵的房價；r2_score(真實值, 預測值) ＝ 計算 R²（決定係數，越接近 1 代表預測越準）；print ＝ 印出結果。這個 0.93 因為前面的洩漏而偏樂觀"]], "tip": "先切分、後前處理；縮放器只 fit 訓練集。最穩的做法是把縮放器與模型包進 Pipeline。", "fig": {"type": "flow", "title": "標準化的位置", "cols": [{"label": "✗ 題目的寫法", "bad": true, "steps": ["全部資料 X", "!scaler.fit 全部 X", "train_test_split", "訓練、算 R²"], "note": "平均與標準差已看過測試集，R² 偏高"}, {"label": "✓ 正確寫法", "steps": ["全部資料 X", "train_test_split", "scaler.fit 訓練集", "測試集只 transform", "訓練、算 R²"], "note": "最穩是把 scaler 和模型包進 Pipeline"}]}}}, {"no": 36, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "計算", "stem": "某模型以梯度下降訓練，損失為「資料損失」加上 L2 懲罰 (λ/2)·w²，其中 λ＝0.5。某權重目前 w＝2.0，學習率 η＝0.1，資料損失對 w 的梯度為 0.4。更新一步後，新的 w 為何？", "options": {"A": "1.96：只用資料損失的梯度，沒有計入 L2 懲罰項的梯度", "B": "1.86：w − η(0.4＋λw)＝2.0−0.1×1.4", "C": "1.90：只計入 L2 懲罰項的梯度，漏掉資料損失的梯度", "D": "1.76：把懲罰項的梯度誤算成 2λw，與題目給定的 (λ/2)·w² 不符"}, "answer": "B", "explanation": "答案 B。L2 懲罰 (λ/2)·w² 對 w 的梯度是 λw＝0.5×2.0＝1.0，所以總梯度＝0.4＋1.0＝1.4，更新後 w＝2.0−0.1×1.4＝1.86。等價寫法 w ← (1−ηλ)w − η·∇資料損失＝0.95×2.0−0.04＝1.86，這就是 L2 又被稱為權重衰減（weight decay）的原因：每步先讓權重按比例縮小。", "per_option": {"A": "漏掉 L2 項的梯度 λw＝1.0，等於沒有正則化。", "B": "正確：總梯度＝0.4＋0.5×2.0＝1.4；w＝2.0−0.1×1.4＝1.86。", "C": "漏掉資料損失的梯度 0.4，只剩權重衰減。", "D": "(λ/2)·w² 對 w 微分得 λw，不是 2λw。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true, "detail": {"steps": [["① L2 懲罰項的梯度", "d/dw [ (λ/2)·w² ] ＝ λ·w（平方項微分：次方 2 掉下來乘，(λ/2) × 2 ＝ λ）", "＝ 0.5 × 2.0 ＝ 1.0"], ["② 總梯度", "總梯度 ＝ 資料損失的梯度 ＋ 懲罰項的梯度", "＝ 0.4 ＋ 1.0 ＝ 1.4"], ["③ 梯度下降更新", "新 w ＝ w − η × 總梯度（η ＝ 學習率，往梯度的反方向走一小步）", "＝ 2.0 − 0.1 × 1.4 ＝ 2.0 − 0.14 ＝ 1.86，選 B"], ["④ 換個寫法驗算（weight decay）", "新 w ＝ (1 − η × λ) × w − η × 資料損失的梯度（先把 w 按比例縮小，所以 L2 又叫權重衰減）", "＝ (1 − 0.1 × 0.5) × 2.0 − 0.1 × 0.4 ＝ 0.95 × 2.0 − 0.04 ＝ 1.9 − 0.04 ＝ 1.86，與步驟③相同"], ["⑤ 對照其他選項（怎麼算錯的）", "正確的總梯度 ＝ 資料梯度 ＋ λ·w，兩項缺一不可", "A：只用資料梯度，2.0 − 0.1 × 0.4 ＝ 1.96，漏掉 L2。C：只用 L2 梯度，2.0 − 0.1 × 1.0 ＝ 1.90，漏掉資料損失。D：把懲罰項梯度算成 2λw ＝ 2 × 0.5 × 2.0 ＝ 2.0，總梯度 0.4 ＋ 2.0 ＝ 2.4，2.0 − 0.1 × 2.4 ＝ 1.76；但 (λ/2)·w² 微分是 λw，不是 2λw"]], "tip": "L2 正則化＝每步多一個 λ·w 的拉力，把權重往 0 拉（權重衰減）。"}}, {"no": 37, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "情境", "stem": "某工程師畫出線性模型的係數路徑圖（橫軸為正則化強度 λ 由小到大，縱軸為各特徵的係數）：10 條曲線中，有 6 條在 λ 增大到某些值之後變成 0 並維持為 0；其餘 4 條隨 λ 增大持續縮小，但始終不等於 0。這張圖最可能來自下列哪一種正則化？", "options": {"A": "L2 正則化（Ridge）：平方懲罰會讓係數逐步縮小，並在 λ 夠大時全部精確等於 0", "B": "無正則化的普通最小平方法（OLS）：係數不隨 λ 變化，因此每條曲線都是水平線", "C": "L1 正則化（Lasso）：絕對值懲罰會把不重要的係數壓成 0，形成稀疏模型", "D": "早停法（Early Stopping）：提早結束訓練使係數停在較小的值，但並不會讓部分係數精確為 0"}, "answer": "C", "explanation": "答案 C。係數路徑圖的判讀：若隨 λ 增大，有些係數會在某個有限的 λ 後精確變成 0 並維持，代表有特徵選擇效果，這是 L1（Lasso）的特徵；L2（Ridge）的係數只會平滑地縮小、趨近 0 卻不會精確等於 0。因此本圖來自 Lasso。", "per_option": {"A": "L2 只會讓係數趨近 0，不會精確等於 0。", "B": "OLS 沒有 λ，係數不會變化，也不會有歸零的曲線。", "C": "正確：只有 L1 懲罰會讓部分係數在有限的 λ 下精確歸零，其餘係數縮小。", "D": "早停是以訓練輪數控制複雜度，不會把部分係數精確設為 0，也不是以 λ 為軸。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true}, {"no": 38, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "情境", "stem": "某信用風險團隊的單棵決策樹在訓練集準確率為 100%，測試集僅 78%。樹的最大深度未設限，部分葉節點只含 1 筆樣本。下列哪一項作法最適當？", "options": {"A": "進一步增加最大深度，讓每個節點都被切得更純，以提高測試集準確率，使訓練與測試表現一致", "B": "對所有特徵做標準化後重新訓練，因為決策樹對特徵尺度非常敏感，標準化能降低過擬合", "C": "把最少樣本數設為 1，並移除所有停止條件，讓樹完整學到資料中的全部規律", "D": "限制最大深度並提高葉節點最少樣本數（預剪枝），或改用隨機森林等集成方法以降低變異"}, "answer": "D", "explanation": "答案 D。訓練準確率 100%、測試準確率只有 78%，是典型的過擬合；葉節點只有 1 筆樣本，代表樹已經在記憶個別樣本。處理方式：限制 max_depth、提高 min_samples_leaf／min_samples_split（預剪枝），或改用隨機森林等集成方法降低變異。決策樹本來就不需要特徵標準化。", "per_option": {"A": "樹愈深愈容易過擬合，測試準確率會更差。", "B": "決策樹以切分點比較，對特徵尺度不敏感，標準化不會改善過擬合。", "C": "沒有停止條件會讓樹記住雜訊，過擬合更嚴重。", "D": "正確：限制樹的複雜度或改用集成方法，是緩解單棵樹過擬合的標準做法。"}, "guide_ref": "學習指引 p.5-45～5-46", "hot": true}, {"no": 39, "section": "5.4", "topic_id": "5.4-03", "topic": "學習率", "style": "情境", "stem": "某工程師訓練深度網路，訓練開始後僅數十步損失就變成 NaN，檢查發現權重數值異常龐大。目前學習率為 1.0。下列哪一項處理最直接有效？", "options": {"A": "再提高學習率，讓參數更快跳出不穩定的區域，同時縮短每一步更新所需的時間", "B": "把 Dropout 比例提高到 0.7，降低神經元之間的依賴即可讓梯度穩定", "C": "降低學習率（如縮小 10～100 倍），必要時加入梯度裁剪限制單步更新幅度", "D": "把批次大小減為 1，逐筆更新可使每一步的梯度變小，數值就不會再爆炸"}, "answer": "C", "explanation": "答案 C。損失變 NaN、權重異常巨大，是學習率過大導致梯度爆炸／發散的典型現象：每次更新步伐太大，數值越滾越大，最後溢位。最直接的處理是把學習率調小（並可搭配 warm-up、梯度裁剪）。Dropout 是防過擬合、調批次大小也無法直接限制更新幅度。", "per_option": {"A": "提高學習率只會讓更新更激進，爆炸更嚴重。", "B": "Dropout 是抑制過擬合的手段，不能解決數值爆炸。", "C": "正確：學習率過大造成更新步伐過大、數值爆炸；調小學習率並限制梯度大小最直接。", "D": "批次大小為 1 會讓梯度雜訊更大，並不會讓梯度變小。"}, "guide_ref": "學習指引 p.5-19、5-31～5-32", "hot": true}, {"no": 40, "section": "5.4", "topic_id": "5.4-04", "topic": "資料增強", "style": "情境", "stem": "某工廠做電路板瑕疵檢測（瑕疵多為細小的亮點），工程師對影像加入隨機亮度調整（±80%）與大半徑高斯模糊作為資料增強，標籤維持原標註。訓練後模型對「有瑕疵」類別的召回率反而下降。下列哪一項最可能是原因與對策？", "options": {"A": "亮度調整與模糊屬於不適用於影像的增強方式，影像增強只應使用翻轉與旋轉，改用這兩種即可", "B": "增強後的影像數量變多，導致模型記憶更多樣本而過擬合，應立即停止使用任何資料增強", "C": "亮度與模糊會改變影像的尺寸，使輸入形狀與模型不符，應先把所有影像統一為相同尺寸", "D": "強度過大的變換讓部分影像的瑕疵幾乎消失，卻仍標為有瑕疵，形成標籤雜訊；應限制增強強度"}, "answer": "D", "explanation": "答案 D。資料增強的關鍵是「變換後標籤的語意不變」。瑕疵只是細小亮點，亮度調整 ±80% 與大半徑模糊可能讓瑕疵幾乎看不見，影像卻仍標成「有瑕疵」，就是標籤雜訊，會讓模型學到錯誤對應，召回率下降。應依場景限制增強強度，必要時用人工抽查確認增強後瑕疵仍可辨識。", "per_option": {"A": "亮度與模糊本來就是常見的影像增強方式，問題在強度而非類型。", "B": "資料增強的目的就是降低過擬合，樣本變多樣不會使模型更容易記憶。", "C": "亮度調整與高斯模糊不會改變影像尺寸。", "D": "正確：增強不能改變標籤的語意；過強的變換會讓瑕疵消失卻保留「有瑕疵」標籤，等於餵錯誤答案。"}, "guide_ref": "學習指引 p.5-9、5-47", "hot": true}, {"no": 41, "section": "5.4", "topic_id": "5.4-05", "topic": "模型量化", "style": "比較", "stem": "某團隊要把模型部署到手機，採用三種不同的模型壓縮手法：甲，把權重由 32 位元浮點數轉成 8 位元整數；乙，移除對輸出影響很小的權重或神經元；丙，讓小型模型學習大型模型的輸出分布。三者依序最適當的名稱為何？", "options": {"A": "甲：剪枝（Pruning）；乙：量化（Quantization）；丙：知識蒸餾（Knowledge Distillation）", "B": "甲：量化（Quantization）；乙：剪枝（Pruning）；丙：知識蒸餾（Knowledge Distillation）", "C": "甲：量化（Quantization）；乙：知識蒸餾（Knowledge Distillation）；丙：剪枝（Pruning）", "D": "甲：混合精度訓練（Mixed Precision）；乙：剪枝（Pruning）；丙：量化（Quantization）"}, "answer": "B", "explanation": "答案 B。三種都是模型壓縮／輕量化：量化（降低權重數值精度，如 FP32→INT8，縮小檔案並加速）、剪枝（移除對輸出貢獻很小的權重或神經元）、知識蒸餾（以大模型的輸出分布當教師訊號，訓練小模型）。混合精度訓練則是訓練技巧，目的在加速訓練、省顯存，不是部署壓縮。", "per_option": {"A": "把甲與乙對調：剪枝是移除權重，量化才是降低位元數。", "B": "正確：降低數值精度＝量化；移除不重要的權重＝剪枝；小模型學大模型＝知識蒸餾。", "C": "把乙與丙對調：移除權重是剪枝，大教小才是知識蒸餾。", "D": "混合精度訓練是訓練時並用 FP16 與 FP32 以加速與省記憶體，不是部署用的壓縮；丙也不是量化。"}, "guide_ref": "學習指引 p.5-51～5-52", "hot": false}, {"no": 42, "section": "6.1", "topic_id": "6.1-02", "topic": "風險評估與PIA", "style": "情境", "stem": "某醫院準備把去識別化的門診資料釋出給外部研究者。資料已做過遮蔽與泛化處理，主管想先驗證這份匿名化結果是否仍可能被還原成特定個人。下列哪一項作法最適當？", "options": {"A": "建立風險矩陣，以發生機率×影響程度排序各項隱私風險，並以此直接證明匿名化已經有效", "B": "進行再識別模擬：用外部公開資料交叉比對、分析欄位組合，風險高就強化匿名化或縮小釋出", "C": "將所有欄位再以 SHA-256 雜湊一次，因為雜湊不可逆，就能保證資料不會被還原", "D": "擴充資料集，納入更多外部欄位一併釋出，以提高研究價值，並藉由欄位變多稀釋個人特徵"}, "answer": "B", "explanation": "答案 B。驗證匿名化是否有效，要站在攻擊者的角度做「再識別模擬」：用外部公開資料與欄位組合去嘗試重新識別個人。若結果風險偏高，就要強化匿名化（更強的泛化、分桶、擾動）、縮小釋出範圍，必要時不公開。風險矩陣（機率×影響）是排序風險優先度，不是驗證匿名化。", "per_option": {"A": "風險矩陣用來排序處理優先序，並不能驗證資料是否仍可被還原。", "B": "正確：再識別模擬（交叉比對、欄位組合分析）能直接檢驗匿名化是否真的有效。", "C": "雜湊在原值種類有限時仍可被彩虹表等方式還原，也不是驗證匿名化的方法。", "D": "增加欄位會提高被交叉比對再識別的風險，而不是稀釋。"}, "guide_ref": "學習指引 p.6-4～6-7", "hot": false}, {"no": 43, "section": "6.1", "topic_id": "6.1-03", "topic": "基礎匿名化技術", "style": "情境", "stem": "某公司把會員手機號碼（10 位數字）以 SHA-256 雜湊後交給合作夥伴，用來比對雙方名單中的重複會員。資安顧問指出這樣做仍有再識別風險。最主要的原因為何？", "options": {"A": "SHA-256 是可逆的編碼方式，只要取得雜湊值並知道演算法，就能直接解回原始號碼", "B": "雜湊值的長度固定，因此會洩漏手機號碼的位數、所屬的電信業者與使用地區", "C": "同一個號碼每次雜湊的結果都不同，導致雙方無法用雜湊值來比對是否為重複會員", "D": "手機號碼取值範圍有限，攻擊者可預先算出所有可能號碼的雜湊值建成對照表，再反推原始號碼"}, "answer": "D", "explanation": "答案 D。雜湊是單向、不可逆的，且同輸入得同輸出，所以可用於比對。但手機號碼的可能值有限（10 位數字最多約 100 億種組合，實際有效的手機號碼更少），攻擊者可以把所有可能號碼都雜湊一遍建成對照表（彩虹表／窮舉），再拿來反查原始號碼。因此雜湊並非萬無一失，原值種類少時需搭配加鹽（salt）等措施，或改用其他匿名化手法。", "per_option": {"A": "SHA-256 是單向函數，無法直接解回，風險來自窮舉比對。", "B": "固定長度的輸出不會洩漏原值的位數或電信業者。", "C": "雜湊是確定性的，同一輸入每次輸出相同，所以才能用來比對。", "D": "正確：原值種類有限時，雜湊值可被彩虹表或窮舉對照還原（可加鹽 salt 降低風險）。"}, "guide_ref": "學習指引 p.6-7～6-9", "hot": false}, {"no": 44, "section": "6.2", "topic_id": "6.2-02", "topic": "資料偏見三類", "style": "情境", "stem": "某銀行用過去十年的房貸核准紀錄訓練信用模型。資料涵蓋各族群、各地區且樣本量充足，核准結果為客觀紀錄、無標註爭議；但歷史上某族群的核准率長期偏低，反映過往的不平等待遇，模型學到後也複製了這個差異。依學習指引的分類，這屬於哪一類資料偏見？", "options": {"A": "來源偏誤（Source Bias）：蒐集階段未均衡涵蓋應被代表的群體或情境", "B": "製程偏誤（Process Bias）：標註或編輯過程中，因主觀或文化差異造成不一致", "C": "演算法偏見（Algorithmic Bias）：即使資料具代表性，演算法仍因追求整體效能而忽略少數群體", "D": "內容偏誤（Content Bias）：資料本身帶有刻板印象或歷史不平等，模型學習後加以複製"}, "answer": "D", "explanation": "答案 D。學習指引把資料偏見分成三類：來源偏誤（出在蒐集：誰被抽到）、內容偏誤（出在資料內容：資料寫了什麼，含刻板印象或歷史不平等，例如信用審核歷史資料隱含歧視）、製程偏誤（出在標註與編輯：誰標、怎麼標）。本題資料覆蓋足夠、也無標註爭議，偏差來自歷史紀錄本身，所以是內容偏誤。", "per_option": {"A": "題目說明資料涵蓋各族群、各地區且樣本充足，沒有蒐集覆蓋不均的問題。", "B": "核准結果是客觀紀錄、沒有標註者主觀判斷，不是製程偏誤。", "C": "演算法偏見屬於模型偏見，成因在演算法設計；本題問的是資料偏見，偏差來自資料內容。", "D": "正確：偏差來自資料內容本身的歷史不平等，屬內容偏誤。"}, "guide_ref": "學習指引 p.6-15～6-16", "hot": false}, {"no": 45, "section": "6.2", "topic_id": "6.2-04", "topic": "不利影響比與評估工具", "style": "情境", "stem": "某中小型團隊的訓練流程完全建立在 scikit-learn 的 Pipeline 上，想用最少的程式改動，在公平性約束下重新訓練模型並檢查各群體的表現差異，不需要大量指標或完整的去偏演算法庫。下列哪一項工具最適合？", "options": {"A": "AI Fairness 360（IBM）：提供逾 70 種公平性指標，並涵蓋前處理、模型內處理、後處理的完整去偏方法", "B": "不利影響比（Disparate Impact）80% 規則：比較群體間正向結果比例的比值，但本身不提供再訓練功能", "C": "Fairlearn（Microsoft）：與 scikit-learn 高度相容、易整合，可在公平性約束下再訓練", "D": "LIME：在單筆預測附近以簡單模型近似，用來解釋個別預測，並非公平性再訓練工具，也不提供公平性指標"}, "answer": "C", "explanation": "答案 C。學習指引介紹兩個開源公平性工具：IBM 的 AI Fairness 360 支援逾 70 種指標、前中後處理的去偏方法齊全，適合研究與企業試驗；Microsoft 的 Fairlearn 與 scikit-learn 高度相容、易整合，提供公平性約束下的再訓練，但去偏功能較少，適合中小型專案。本題要求最少改動、功能簡單，故選 Fairlearn。", "per_option": {"A": "AI Fairness 360 功能完整，適合研究與企業試驗；題目明確不需要大量指標與完整去偏庫。", "B": "80% 規則只是檢驗比例的方法，不是可執行再訓練的工具。", "C": "正確：Fairlearn 與 scikit-learn 高度相容、易整合，適合中小型專案。", "D": "LIME 是可解釋性工具，不是公平性約束下再訓練的工具。"}, "guide_ref": "學習指引 p.6-19～6-20", "hot": false}, {"no": 46, "section": "X", "topic_id": "X-01", "topic": "參數量與運算量", "style": "計算", "stem": "某 Keras 模型的一段結構為：輸入特徵圖有 16 個通道，接 Conv2D(32, (3,3), padding='same')（含偏差），再接 BatchNormalization()。BatchNormalization 每個通道有 4 個參數：縮放 γ 與平移 β（可訓練），以及移動平均與移動變異數（由統計累積，不可訓練）。這兩層合計的可訓練參數（Trainable params）數量為何？", "options": {"A": "4,704：卷積層 4,640，加上 BatchNormalization 的 γ、β 共 64", "B": "4,768：把 BatchNormalization 不可訓練的移動平均與移動變異數也算進可訓練參數", "C": "4,672：只把 BatchNormalization 計成每通道 1 個可訓練參數（32 個）", "D": "4,640：只計算卷積層，忽略 BatchNormalization 的可訓練參數 γ 與 β"}, "answer": "A", "explanation": "答案 A。卷積層參數量＝核高×核寬×輸入通道×輸出通道＋輸出通道（偏差）＝3×3×16×32＋32＝4,608＋32＝4,640。BatchNormalization 在 32 個通道上，可訓練的 γ、β 共 2×32＝64，不可訓練的移動平均與移動變異數另有 64 個。可訓練參數＝4,640＋64＝4,704；總參數＝4,768。", "per_option": {"A": "正確：4,640＋64＝4,704。", "B": "4,768 是總參數（含 64 個不可訓練參數），不是可訓練參數。", "C": "BatchNormalization 的 γ 與 β 各有一組，可訓練的是每通道 2 個。", "D": "BatchNormalization 的 γ、β 是可學習的參數，必須算進去。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 卷積層的參數量", "Conv2D 參數量 ＝ 核高 × 核寬 × 輸入通道數 × 濾波器數 ＋ 濾波器數（最後一項是每個濾波器各 1 個偏差；padding 只影響輸出大小，不影響參數量）", "＝ 3 × 3 × 16 × 32 ＋ 32 ＝ 144 × 32 ＋ 32 ＝ 4,608 ＋ 32 ＝ 4,640"], ["② BatchNormalization 的參數量", "BN 每個通道的參數：可訓練的是 γ 與 β；不可訓練的是移動平均與移動變異數。可訓練（不可訓練）參數 ＝ 每通道的個數 × 通道數；通道數 ＝ 前一層輸出的通道數", "BN 接在卷積後，通道數 ＝ 32；可訓練：γ、β 各 1 個，每通道 2 個，2 × 32 ＝ 64；不可訓練：移動平均、移動變異數各 1 個，2 × 32 ＝ 64（題目說每通道共 4 個，4 × 32 ＝ 128 ＝ 64 ＋ 64）"], ["③ 合計可訓練參數", "可訓練參數 ＝ 卷積層參數 ＋ BN 的可訓練參數", "＝ 4,640 ＋ 64 ＝ 4,704，選 A（總參數 ＝ 4,640 ＋ 64 ＋ 64 ＝ 4,768）"], ["④ 對照其他選項（怎麼算錯的）", "可訓練 ≠ 總參數；BN 的可訓練參數是每通道 2 個（γ 與 β）", "B：4,768 ＝ 4,640 ＋ 64 ＋ 64 是「總參數」，多算了 64 個不可訓練的。C：4,640 ＋ 32 ＝ 4,672，BN 每通道只算 1 個，少了一個。D：4,640 只有卷積層，漏掉 BN 的 γ 與 β"]], "tip": "可訓練參數＝會被梯度更新的；BN 的移動平均／變異數是統計累積，不可訓練。", "fig": {"type": "layers", "title": "每一層的通道與參數", "items": [{"name": "輸入", "shape": "16 通道"}, {"name": "Conv 3×3，32 個", "shape": "32 通道", "note": "參數 (3×3×16＋1)×32 ＝ 4,640"}, {"name": "BatchNorm", "shape": "32 通道", "note": "可訓練 γ、β：2×32 ＝ 64（另有 64 不可訓練）", "hl": true}], "note": "可訓練 ＝ 4,640 ＋ 64 ＝ 4,704（總參數 4,768）"}}}, {"no": 47, "section": "X", "topic_id": "X-02", "topic": "時間序列驗證", "style": "情境", "stem": "某銀行以 2023 年資料訓練違約模型，並用 2024 年資料做單一次驗證，AUC 表現良好。但客群與景氣每季都在變，主管想知道模型在不同時期是否都穩定。下列哪一種驗證設計最適當？", "options": {"A": "改用 5 折 shuffle 的 K 折交叉驗證：折數增加後，各時期的資料都有機會被驗證", "B": "把 2023 與 2024 年資料全部混合後隨機抽 20% 當驗證集，使訓練與驗證的分布一致，結果更可靠", "C": "維持單一次驗證，但把驗證集改成隨機抽出的 20% 資料，以消除時間造成的偏差", "D": "多折時間序列驗證（TimeSeriesSplit 或滾動視窗）：每折以較早資料訓練、較晚資料驗證"}, "answer": "D", "explanation": "答案 D。資料有時間順序時，驗證集必須在訓練集之後。固定單一次切分只驗證了一個時期，客群改變後驗證集就會過時，也看不出穩定度。應採用多折的前向驗證（TimeSeriesSplit 的擴張視窗，或固定長度的滾動視窗），每折都以較早資料訓練、較晚資料驗證，並比較各折分數，才能發現概念漂移。", "per_option": {"A": "隨機打亂的 K 折會讓未來資料進入訓練集，造成時間洩漏。", "B": "隨機混合抽樣同樣破壞時間順序，且分數會被高估。", "C": "只驗證一次無法呈現不同時期的穩定度；隨機抽樣也會造成時間洩漏。", "D": "正確：多折前向驗證能保持「過去訓練、未來驗證」，並檢視不同時期的穩定度。"}, "guide_ref": "指引未載", "hot": true}, {"no": 48, "section": "X", "topic_id": "X-04", "topic": "蒙地卡羅方法", "style": "計算", "stem": "某投資團隊以蒙地卡羅方法模擬投資組合 30 日後的損失，共抽樣模擬 10,000 次。把模擬損失由小到大排序：第 500 筆為 120 萬元、第 9,500 筆為 480 萬元、最大值為 1,350 萬元，平均損失為 210 萬元。若以 95% 信心水準估計風險值（VaR，即有 95% 機率損失不會超過的門檻），結果最接近下列何者？", "options": {"A": "約 210 萬元：以模擬損失的平均值作為 95% 風險值", "B": "約 120 萬元：取由小到大第 500 筆，也就是第 5 百分位", "C": "約 480 萬元：取模擬損失分布的第 95 百分位，即由小到大第 9,500 筆", "D": "約 1,350 萬元：以模擬到的最大損失作為 95% 風險值，確保完全不會被超過"}, "answer": "C", "explanation": "答案 C。蒙地卡羅方法用大量隨機情境得到損失的分布，再取分位數得風險區間。95% VaR＝損失分布的第 95 百分位：10,000 次的 95% 位置是由小到大第 9,500 筆，即 480 萬元，意思是在 95% 的模擬情境下，損失不會超過 480 萬元。平均值與最大值都不是 VaR。", "per_option": {"A": "平均值描述的是期望損失，不是某個信心水準下的門檻。", "B": "第 500 筆是第 5 百分位，代表 5% 機率損失不會超過它，與 95% 風險值相反。", "C": "正確：10,000×95%＝9,500，第 9,500 筆（由小到大）就是損失分布的第 95 百分位。", "D": "最大值是極端情況，VaR 是特定信心水準的分位數，不是最大值。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 找出第 95 百分位在第幾筆", "VaR（信心水準 c）＝ 把模擬損失由小到大排序後，第 (抽樣次數 × c) 筆的損失值", "10,000 × 95% ＝ 9,500，所以看由小到大排序的第 9,500 筆"], ["② 讀出數值", "該位置的損失值 ＝ VaR（有「信心水準」比例的模擬情境，損失不會超過它）", "題目給第 9,500 筆 ＝ 480 萬元，所以 95% VaR ≈ 480 萬元（95% 的模擬情境，損失不會超過 480 萬），選 C"], ["③ 對照其他選項（怎麼想錯的）", "平均 ＝ 期望損失；第 5 百分位位置 ＝ 抽樣次數 × 5%；最大值 ＝ 100% 位置", "A：210 萬是平均損失，不是某個信心水準的門檻。B：10,000 × 5% ＝ 500，第 500 筆是第 5 百分位（120 萬），代表只有 5% 情境的損失比它小，方向剛好相反。D：1,350 萬是最大值（第 10,000 筆，相當於 100% 位置），不是 95%"]], "tip": "VaR＝損失分布的某個分位數：95% VaR 就是「由小到大排到 95% 位置」的那個損失。"}}, {"no": 49, "section": "X", "topic_id": "X-08", "topic": "信用評分卡", "style": "計算", "stem": "某銀行信用評分卡將「年收入」分箱，其中一個分箱內的好客戶占全部好客戶的 20%，壞客戶占全部壞客戶的 5%。設證據權重 WOE＝ln(好客戶占比 ÷ 壞客戶占比)。此分箱的 WOE 與解讀為何？", "options": {"A": "約 +1.39：該箱好客戶占比高於壞客戶占比，風險相對較低", "B": "約 −1.39：該箱壞客戶占比較高，風險相對較高", "C": "約 4.00：WOE 直接等於兩個占比的比值，不必取自然對數", "D": "約 0.15：WOE 為兩個占比的差，代表該箱的預測力很弱"}, "answer": "A", "explanation": "答案 A。WOE＝ln(0.20÷0.05)＝ln 4≈1.386。WOE 為正，表示該分箱中好客戶的占比高於壞客戶的占比，風險相對較低；WOE 為負則偏向壞客戶。評分卡先分箱、計算各箱 WOE，再用資訊值（IV）評估變數的預測力，最後以邏輯迴歸建模。", "per_option": {"A": "正確：ln(0.20÷0.05)＝ln 4≈1.386，正值代表偏向好客戶。", "B": "符號相反：好客戶占比較大時 WOE 為正。", "C": "4 只是占比比值，WOE 還要取自然對數。", "D": "WOE 不是兩個占比的差；0.15 是占比差，不是題目所定義的 WOE。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 公式與題目數字", "WOE ＝ ln(好客戶占比 ÷ 壞客戶占比)（ln ＝ 自然對數，以 e ≈ 2.718 為底；占比 ＝ 該箱的好（壞）客戶數 ÷ 全部好（壞）客戶數）", "好客戶占比 ＝ 20% ＝ 0.20；壞客戶占比 ＝ 5% ＝ 0.05"], ["② 先算比值", "比值 ＝ 好客戶占比 ÷ 壞客戶占比", "＝ 0.20 ÷ 0.05 ＝ 4"], ["③ 取自然對數", "WOE ＝ ln(比值)（ln x ＝ 「e 的幾次方等於 x」）", "＝ ln 4 ≈ 1.386，約 +1.39（因為 e 的 1.386 次方 ≈ 4）"], ["④ 解讀正負", "WOE ＞ 0：好客戶占比 ＞ 壞客戶占比，風險較低；WOE ＜ 0：壞客戶占比較高，風險較高；WOE ＝ 0：兩者相當", "WOE ≈ 1.39 ＞ 0，好客戶占比較高，風險相對較低，選 A"], ["⑤ 對照其他選項（怎麼算錯的）", "WOE 的括號裡是「好 ÷ 壞」的比值，再取 ln；不是差，也不是不取 ln", "B：ln(0.05 ÷ 0.20) ＝ ln 0.25 ≈ −1.39，是把好壞顛倒；題目的好客戶占比較大，WOE 應為正。C：4 ＝ 0.20 ÷ 0.05，只是比值，漏掉取 ln。D：0.15 ＝ 0.20 − 0.05，是占比的差，不是 WOE"]], "tip": "WOE ＝ ln(好占比 ÷ 壞占比)：正值偏好客戶（低風險），負值偏壞客戶（高風險）。"}}, {"no": 50, "section": "X", "topic_id": "X-09", "topic": "時間複雜度", "style": "計算", "stem": "某團隊要在客戶名單中找出重複資料。方法甲：雙層迴圈兩兩比對，時間複雜度為 O(n²)；方法乙：先排序再比較相鄰資料，時間複雜度為 O(n log n)。資料量由 1 萬筆放大到 100 萬筆時（log₂10⁴≈13.3、log₂10⁶≈19.9），兩種方法的執行時間成長倍數，下列估計何者最接近？", "options": {"A": "甲約 10,000 倍；乙約 150 倍", "B": "甲約 10,000 倍；乙約 100 倍：忽略了 log n 因子的成長", "C": "甲約 200 倍；乙約 150 倍：把 n² 當成 2n 計算", "D": "甲約 100 倍；乙約 100 倍：兩者都視為與資料量成正比"}, "answer": "A", "explanation": "答案 A。資料量放大 k＝100 倍：O(n²) 約成長 k²＝10,000 倍；O(n log n) 約成長 k×(log 10⁶ ÷ log 10⁴)＝100×(19.9÷13.3)≈150 倍。這說明大規模全點對比對（O(n²)）很快變得不可行，改用排序或索引（O(n log n)）能大幅縮短時間。Big-O 描述成長趨勢，不是實際秒數。", "per_option": {"A": "正確：甲 (100)²＝10,000；乙 100×(19.9÷13.3)≈150。", "B": "O(n log n) 還要乘上 log 因子的增加（19.9÷13.3≈1.5），所以約 150 倍而非 100 倍。", "C": "n² 放大 100 倍時應成長 100²＝10,000 倍，不是 200 倍。", "D": "O(n²) 與資料量的平方成正比，O(n log n) 也不是線性。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 資料量放大幾倍", "放大倍數 k ＝ 新資料量 ÷ 舊資料量", "＝ 1,000,000 ÷ 10,000 ＝ 100"], ["② 方法甲 O(n²) 的成長倍數", "O(n²)：執行時間跟 n 的平方成正比，n 放大 k 倍，時間放大 k² 倍", "＝ 100² ＝ 10,000 倍"], ["③ 方法乙 O(n log n) 的成長倍數", "成長倍數 ＝ (新 n × log₂新 n) ÷ (舊 n × log₂舊 n) ＝ k × (log₂新 n ÷ log₂舊 n)", "＝ 100 × (19.9 ÷ 13.3) ＝ 100 × 1.496 ≈ 150 倍，所以甲約 10,000 倍、乙約 150 倍，選 A"], ["④ 對照其他選項（怎麼算錯的）", "O(n log n) 的倍數 ＝ k × log 因子的變化；O(n²) 的倍數 ＝ k²；線性 O(n) 的倍數 ＝ k", "B：乙 100 倍 ＝ 只算 k，忽略 log 因子也變大了（19.9 ÷ 13.3 ≈ 1.5）。C：甲 200 倍 ＝ 2 × 100，把 n² 當成 2n。D：甲乙都 100 倍，把兩者都當成線性成長"]], "tip": "資料放大 k 倍：O(n²) 約放大 k² 倍；O(n log n) 約 k 倍再多一點。Big-O 看的是成長趨勢，不是實際秒數。"}}], "8": [{"no": 1, "section": "3.1", "topic_id": "3.1-05", "topic": "顯著水準與 p 值", "style": "情境", "stem": "某製藥團隊檢定新藥是否比現有藥物更能降低血壓，原本把顯著水準 α 設為 0.05。審查委員要求降低「藥其實無效卻被判定有效」的誤報風險，團隊因此將 α 改為 0.01，其他設定與資料皆不變。下列敘述何者最正確？", "options": {"A": "檢定算出的 p 值會同步縮小為原來的五分之一，因此更容易得到顯著結果", "B": "型一錯誤的容許上限被提高，拒絕虛無假設的門檻變得更寬鬆", "C": "型一錯誤的容許上限降為 1%，需 p 值小於 0.01 才能拒絕虛無假設", "D": "虛無假設為真的機率由 5% 降為 1%，代表新藥真正有效的把握提高到 99%"}, "answer": "C", "explanation": "答案 C。α 是檢定前就設定的型一錯誤機率上限，也就是「虛無假設其實為真卻被拒絕」的風險。把 α 從 0.05 降到 0.01，表示只接受更低的誤報風險，p 值必須小於 0.01 才能拒絕虛無假設，門檻變嚴；其他條件不變時，型二錯誤（漏掉真正有效的藥）的機率通常會上升。p 值是看過資料後才算出的數字，不會因為 α 改變而改變。", "per_option": {"A": "p 值由資料與虛無假設計算而來，調整 α 不會改變 p 值。", "B": "方向相反：α 變小是門檻變嚴，不是變寬鬆。", "C": "正確：α 是事前設定的型一錯誤上限，降低 α 使拒絕虛無假設更困難。", "D": "α 不是「虛無假設為真的機率」，而是虛無假設為真時錯誤拒絕它的機率上限。"}, "guide_ref": "學習指引 p.3-7～3-8", "hot": false}, {"no": 2, "section": "3.1", "topic_id": "3.1-06", "topic": "描述統計量", "style": "情境", "stem": "工程師分析工廠感測器讀數時，計算描述統計量，發現峰度（Kurtosis）遠高於常態分佈的基準，直方圖呈現尖峰，且兩端尾巴很長。這個結果最直接的提示是什麼？", "options": {"A": "分佈尾端較厚，極端值機率偏高，建模前宜檢查離群值與穩健處理", "B": "分佈明顯偏向一側，應改以平均數取代中位數來描述典型讀數，因為平均數會用到每一筆資料點", "C": "特徵之間高度相關，應先以主成分分析（PCA）消除共線性", "D": "特徵尺度差異過大，只要做標準化就能讓峰度降為常態水準"}, "answer": "A", "explanation": "答案 A。峰度描述分佈是否「尖峰厚尾」，高峰度代表尾端較厚、極端值出現機率較高，可作為異常值多寡的參考，建模前應檢查離群值，必要時改用穩健方法。分佈是否偏向一側看的是偏態；特徵間相關性要看相關係數；標準化只是平移與縮放，不會改變峰度，也不會讓尾巴變薄。", "per_option": {"A": "正確：高峰度＝厚尾，極端值機率較高。", "B": "偏向一側是偏態的概念；且偏態資料反而更不適合用平均數描述集中趨勢。", "C": "峰度是單一變數的形狀指標，與特徵之間的相關性無關。", "D": "標準化不會改變分佈形狀，因此不會改變峰度。"}, "guide_ref": "學習指引 p.3-8", "hot": false}, {"no": 3, "section": "3.2", "topic_id": "3.2-05", "topic": "非負矩陣分解 NMF", "style": "計算", "stem": "某團隊要從文件—詞語矩陣 X 萃取潛在主題。X 有 1,200 篇文件（列）、5,000 個詞語（欄），元素為詞頻（皆 ≥ 0）。他們用非負矩陣分解（NMF）取 k = 20 個主題，使 X ≈ WH。下列哪一項同時正確描述了 W、H 的形狀與兩者合計的元素個數？", "options": {"A": "W 為 20×1,200、H 為 5,000×20，合計 124,000 個元素", "B": "W 為 1,200×20、H 為 20×5,000，合計 6,000,000 個元素，與 X 相同", "C": "W 為 1,200×20、H 為 20×5,000，合計 24,000 個元素", "D": "W 為 1,200×20、H 為 20×5,000，合計 124,000 個元素"}, "answer": "D", "explanation": "答案 D。X（m×n）≈ W（m×k）× H（k×n），所以 W 是 1,200×20（文件×主題）、H 是 20×5,000（主題×詞語）。元素個數：1,200×20 ＝ 24,000，20×5,000 ＝ 100,000，合計 124,000，只有 X 的 6,000,000 個元素的約 2.07%，這就是用潛在主題壓縮並保留可解釋性的好處。", "per_option": {"A": "形狀顛倒：20×1,200 與 5,000×20 無法相乘得到 1,200×5,000。", "B": "形狀正確，但合計元素數不是 6,000,000；那是 X 本身的元素數。", "C": "形狀正確，但 24,000 只算了 W，漏掉 H 的 100,000 個元素。", "D": "正確：24,000＋100,000＝124,000。"}, "guide_ref": "學習指引 p.3-15", "hot": false, "detail": {"steps": [["① 決定 W、H 的形狀", "X (m×n) ≈ W (m×k) × H (k×n)（矩陣相乘：左邊的欄數要等於右邊的列數，都是 k，相乘後剩下 m×n）", "X 有 1,200 列（文件）、5,000 欄（詞語），所以 m ＝ 1,200、n ＝ 5,000；主題數 k ＝ 20。W ＝ 1,200×20（文件×主題），H ＝ 20×5,000（主題×詞語）。檢查：(1,200×20) × (20×5,000) → 中間的 20 對消 → 1,200×5,000，和 X 同形"], ["② 算 W 的元素個數", "矩陣元素個數 ＝ 列數 × 欄數", "＝ 1,200 × 20 ＝ 24,000"], ["③ 算 H 的元素個數", "矩陣元素個數 ＝ 列數 × 欄數", "＝ 20 × 5,000 ＝ 100,000"], ["④ 合計", "合計 ＝ W 的元素個數 ＋ H 的元素個數", "＝ 24,000 ＋ 100,000 ＝ 124,000，選 D"], ["⑤ 和原矩陣 X 比（為什麼叫壓縮）", "壓縮比 ＝ (W ＋ H 的元素個數) ÷ X 的元素個數", "X ＝ 1,200 × 5,000 ＝ 6,000,000；124,000 ÷ 6,000,000 ≈ 0.0207 ≈ 2.07%"], ["⑥ 對照其他選項（怎麼算錯的）", "矩陣 A (a×b) 能乘矩陣 B (c×d)，必須 b ＝ c", "A：W 寫 20×1,200、H 寫 5,000×20，左邊欄數 1,200 ≠ 右邊列數 5,000，無法相乘（元素數 24,000 ＋ 100,000 ＝ 124,000 剛好一樣，但形狀錯）。B：形狀對，但 6,000,000 是 X 自己的元素數，不是 W ＋ H。C：24,000 只算了 W，漏掉 H 的 100,000"]], "tip": "X ≈ W × H：W 是「文件×主題」，H 是「主題×詞語」；k 小得多，所以元素個數比 X 少很多。"}}, {"no": 4, "section": "3.2", "topic_id": "3.2-06", "topic": "維度簡化與 PCA", "style": "否定", "stem": "團隊在討論主成分分析（PCA）的特性與使用方式。關於 PCA 的敘述，下列何者錯誤？", "options": {"A": "各主成分彼此正交，第一主成分是資料變異最大的方向，其後依序遞減", "B": "PCA 是從原始特徵挑出變異最大的幾個欄位，降維後每個欄位仍對應原本的某個特徵", "C": "各特徵單位差異很大時，通常先做標準化，以免大尺度特徵因為數值大而主導主成分的方向", "D": "可依累積解釋變異比例（例如達 90%）決定要保留幾個主成分"}, "answer": "B", "explanation": "答案 B。本題要選錯誤的敘述。PCA 產生的是原始特徵的線性組合（新的座標軸），不是從原欄位中挑選子集；挑選原欄位屬於特徵選擇。其餘三項都正確：主成分彼此正交且依變異大小排序；PCA 對尺度敏感，通常先標準化；實務上常看累積解釋變異比例來決定保留幾個主成分。", "per_option": {"A": "敘述正確：主成分正交，且第一主成分的變異最大。", "B": "錯誤（本題答案）：PCA 產生的是線性組合的新特徵，不是挑選原欄位。", "C": "敘述正確：PCA 以變異為依據，未標準化時大尺度特徵會主導。", "D": "敘述正確：累積解釋變異比例是常用的選擇依據。"}, "guide_ref": "學習指引 p.3-12～3-16", "hot": false}, {"no": 5, "section": "3.3", "topic_id": "3.3-06", "topic": "自適應學習率", "style": "計算", "stem": "訓練 RNN 時使用 RMSprop，衰減係數 ρ = 0.9。某個參數的梯度平方滑動平均在前一步為 s = 0.1，這一步的梯度 g = 2，學習率 η = 0.007，忽略 ε。依 s ← ρ·s + (1−ρ)·g² 更新後，這一步的更新量大小 η·g／√s 約為多少？", "options": {"A": "約 0.0069：把梯度平方持續累加而不衰減，等同 Adagrad 的做法", "B": "0.02：以滑動平均更新 s 後，再計算 η·g／√s", "C": "0.007：只用當前梯度平方，完全不參考歷史", "D": "約 0.0074：把 ρ 與 1−ρ 的權重對調"}, "answer": "B", "explanation": "答案 B。RMSprop 以滑動平均更新：s = 0.9×0.1 + 0.1×2² = 0.09 + 0.4 = 0.49，√s = 0.7，更新量 = 0.007×2／0.7 = 0.02。對照 Adagrad：它不衰減地累加平方梯度，s 會一路變大，學習率持續縮小；RMSprop 的滑動平均只看最近的梯度，修正了衰減過快的問題。", "per_option": {"A": "這是 Adagrad 式的累加（s = 0.1+4 = 4.1），不是 RMSprop 的滑動平均。", "B": "正確：s = 0.49、√s = 0.7，更新量 0.02。", "C": "忽略了歷史資訊（前一步的 s），不符合滑動平均的公式。", "D": "權重對調後變成幾乎只看當前梯度的平方，公式用反了。"}, "guide_ref": "學習指引 p.3-25", "hot": false, "detail": {"steps": [["① 更新滑動平均 s", "s ← ρ × s_舊 ＋ (1 − ρ) × g²（s 是梯度平方的滑動平均：舊的 s 占 ρ 比例，這一步的 g² 占 1−ρ 比例）", "＝ 0.9 × 0.1 ＋ (1 − 0.9) × 2² ＝ 0.09 ＋ 0.1 × 4 ＝ 0.09 ＋ 0.4 ＝ 0.49"], ["② 開根號", "√s（RMSprop 用 s 的平方根來縮放步伐）", "＝ √0.49 ＝ 0.7（0.7 × 0.7 ＝ 0.49）"], ["③ 算更新量", "更新量大小 ＝ η × g ÷ √s（梯度大、歷史也大，就把步伐縮小）", "＝ 0.007 × 2 ÷ 0.7 ＝ 0.014 ÷ 0.7 ＝ 0.02，選 B"], ["④ 對照其他選項（怎麼算錯的）", "Adagrad：s ← s_舊 ＋ g²（不衰減地累加）；只看當前：s ＝ g²；權重對調：s ← (1−ρ) × s_舊 ＋ ρ × g²", "A：Adagrad 式累加 s ＝ 0.1 ＋ 4 ＝ 4.1，√4.1 ≈ 2.025，0.014 ÷ 2.025 ≈ 0.0069。C：只用當前梯度，s ＝ g² ＝ 4，√4 ＝ 2，0.014 ÷ 2 ＝ 0.007。D：對調權重 s ＝ 0.1 × 0.1 ＋ 0.9 × 4 ＝ 0.01 ＋ 3.6 ＝ 3.61，√3.61 ＝ 1.9，0.014 ÷ 1.9 ≈ 0.0074"]], "tip": "RMSprop＝Adagrad 加上「衰減」：用滑動平均只記最近的梯度，學習率不會越縮越小。"}}, {"no": 6, "section": "3.3", "topic_id": "3.3-07", "topic": "收斂判準與不穩因素", "style": "情境", "stem": "某團隊訓練分類模型時，訓練損失仍以每個 epoch 約 0.1% 的幅度緩慢下降，但驗證集 F1 從第 20 個 epoch 起連續 10 個 epoch 沒有進步，還略為下滑。下列哪一種決策最符合收斂判準的做法？", "options": {"A": "以驗證集效能不再提升作為停止依據，停止訓練並保留驗證表現最佳的權重", "B": "因為訓練損失仍在下降，代表模型尚未收斂，應繼續訓練直到訓練損失接近 0", "C": "驗證指標停滯是學習率太小所致，應立即把學習率調高 10 倍再繼續訓練", "D": "只要訓練步數達到預設上限就可證明模型已收斂，不必再參考任何指標"}, "answer": "A", "explanation": "答案 A。收斂判準之一是驗證集效能不再提升甚至下降，這代表泛化能力已到上限，再訓練只會讓模型更貼近訓練資料（過擬合）。訓練損失還在降並不代表該繼續，要以驗證集為準。步數上限只是保底的停止條件，要搭配其他判準，以免尚未收斂就停，也不能拿來「證明」已收斂。", "per_option": {"A": "正確：驗證效能停滯＝泛化已到上限，應停止並保留最佳權重。", "B": "訓練損失下降不代表泛化變好，繼續訓練可能加重過擬合。", "C": "驗證指標停滯並不等於學習率太小；亂調高學習率反而可能造成震盪或發散。", "D": "步數上限只是保底條件，無法證明已收斂。"}, "guide_ref": "學習指引 p.3-26～3-27", "hot": false}, {"no": 7, "section": "3.3", "topic_id": "3.3-08", "topic": "梯度裁剪", "style": "情境", "stem": "團隊訓練 RNN 時，偶爾會出現個別批次的梯度全域範數高達 1e6，使參數被推得很遠、損失突然變成 NaN；多數批次的梯度大小都正常。團隊希望只在梯度異常大的批次才介入限制更新幅度，同時盡量不改變整體梯度的方向。下列哪一種做法最適當？", "options": {"A": "把損失乘上很小的固定常數，讓所有批次的梯度永遠縮小，不分正常或異常", "B": "把梯度中絕對值小於 1e-3 的元素全部設為 0，藉此去除梯度雜訊", "C": "對每個梯度元素各自截斷到 [−c, c] 範圍，各元素獨立處理，不看整體長度", "D": "當全域範數超過門檻，將整個梯度等比例縮小到門檻長度（按範數裁剪），方向不變"}, "answer": "D", "explanation": "答案 D。梯度裁剪針對梯度爆炸：按範數裁剪在全域範數超過門檻時，把整個梯度向量等比例縮到門檻長度，正常批次不受影響，且方向不變。對每個元素各自截斷（按值裁剪）會改變各元素的相對比例，進而改變梯度方向。固定縮小損失等於永久降低學習率，所有批次都被影響；把小梯度歸零則與梯度爆炸無關。", "per_option": {"A": "所有批次都被永久縮小，等於降低學習率，不是「只在異常批次介入」。", "B": "清除小梯度無法處理過大的梯度，也會丟失資訊。", "C": "逐元素截斷會改變各元素的相對比例，梯度方向被改變。", "D": "正確：按範數等比例縮放，只限制長度、保留方向，僅在超過門檻時才作用。"}, "guide_ref": "學習指引 p.3-27", "hot": false}, {"no": 8, "section": "3.3", "topic_id": "3.3-09", "topic": "穩定訓練策略", "style": "情境", "stem": "某團隊希望學習率能自動調整：不要依固定的 epoch 時程降低，而是只有當驗證損失連續幾個 epoch 停滯時才把學習率縮小（例如乘以 0.1），降低後仍要繼續訓練。下列哪一種機制最符合需求？", "options": {"A": "階梯式遞減（Step Decay）：每隔固定的 epoch 數就把學習率乘上固定倍率", "B": "餘弦退火（Cosine Annealing）：學習率依餘弦曲線平滑地由大變小", "C": "指標停滯時降學習率（ReduceLROnPlateau）：監控指定指標，連續數個 epoch 沒有改善才調降學習率", "D": "提早停止（Early Stopping）：驗證指標連續數個 epoch 沒有改善就終止整個訓練"}, "answer": "C", "explanation": "答案 C。三種學習率調整的觸發方式不同：Step Decay 與 Cosine Annealing 都是事先排定的時程，與當下的訓練狀況無關；ReduceLROnPlateau 則是監控指標，停滯時才降低學習率並繼續訓練，符合題意。Early Stopping 看起來也監控停滯，但它的動作是終止訓練，而不是調整學習率。", "per_option": {"A": "依固定間隔降低，與指標是否停滯無關。", "B": "依預先設定的曲線平滑下降，同樣與指標無關。", "C": "正確：指標停滯才降低學習率，且訓練繼續。", "D": "動作是終止訓練而不是降學習率，與「降低後仍要繼續訓練」衝突。"}, "guide_ref": "學習指引 p.3-27", "hot": false}, {"no": 9, "section": "4.1", "topic_id": "4.1-07", "topic": "損失函數與任務對應", "style": "情境", "stem": "某物流公司同時建立兩個模型：甲模型預測每筆訂單的配送時間（分鐘），資料中有少數因颱風造成的極端延誤，團隊希望訓練時不要被這些極端值過度牽動；乙模型判斷訂單是否會延誤（是／否）。下列哪一組損失函數搭配最適當？", "options": {"A": "甲：均方誤差（MSE）；乙：二元交叉熵（Binary Cross-Entropy）", "B": "甲：平均絕對誤差（MAE）；乙：二元交叉熵（Binary Cross-Entropy）", "C": "甲：平均絕對誤差（MAE）；乙：均方誤差（MSE）", "D": "甲：二元交叉熵（Binary Cross-Entropy）；乙：平均絕對誤差（MAE）"}, "answer": "B", "explanation": "答案 B。甲是迴歸任務，且希望降低極端值的影響：MAE 只取誤差的絕對值，對異常值較有魯棒性；MSE 把誤差平方，會對大誤差給予很重的懲罰，使模型被極端延誤牽動。乙是二元分類，應使用衡量預測機率分佈與真實標籤差距的交叉熵。把交叉熵配到迴歸、或把 MAE／MSE 當分類的主要損失，都不適當。", "per_option": {"A": "乙正確，但甲的 MSE 會放大極端延誤的影響，與需求相反。", "B": "正確：迴歸且要抗極端值用 MAE，二元分類用交叉熵。", "C": "甲正確，但乙的分類任務應使用交叉熵而非 MSE。", "D": "任務與損失函數完全對調：交叉熵用於分類，MAE 用於迴歸。"}, "guide_ref": "學習指引 p.4-4", "hot": false}, {"no": 10, "section": "4.2", "topic_id": "4.2-07", "topic": "XGBoost", "style": "比較", "stem": "某團隊把原本使用的傳統梯度提升決策樹（GBDT）換成 XGBoost 後，在同一份大型表格資料上，過擬合情形減輕、訓練也更快。下列哪一項最能說明 XGBoost 相對於傳統 GBDT 的主要改進？", "options": {"A": "各棵樹彼此獨立、同時訓練，最後以投票或平均合併結果，因此天生不會過擬合", "B": "只保留一階導數並移除所有正則化項，換取較低的計算成本與更快的訓練速度", "C": "採葉子式（Leaf-wise）成長，每次只分裂增益最大的葉子，是 XGBoost 的主要特色，也是它速度快的原因", "D": "目標函數加入 L1／L2 與樹複雜度懲罰，用二階導數（Hessian）加速找分裂點，並支援並行"}, "answer": "D", "explanation": "答案 D。XGBoost 仍是以決策樹為弱學習器的 Boosting，改進在於：目標函數內建 L1／L2 與葉節點數量、權重的懲罰以抑制過擬合；用二階導數資訊加速尋找最佳分裂點；Block 結構與多核／GPU 並行加速計算。各樹獨立訓練再平均是 Bagging（如隨機森林）的作法；葉子式成長是 LightGBM 的特色，XGBoost 預設是層級式（Level-wise）。", "per_option": {"A": "這是 Bagging 的描述；XGBoost 的樹是依序修正前一輪的誤差。", "B": "方向相反：XGBoost 加入正則化並使用二階導數資訊。", "C": "葉子式成長是 LightGBM 的特色；XGBoost 預設是層級式成長。", "D": "正確：正則化、二階導數、Block 結構與並行。"}, "guide_ref": "學習指引 p.4-22～4-24", "hot": true}, {"no": 11, "section": "4.2", "topic_id": "4.2-08", "topic": "LightGBM", "style": "情境", "stem": "某團隊要在約 2,000 萬筆、500 個連續型特徵的表格資料上訓練梯度提升樹。原本採用逐一掃描每個特徵所有可能取值的方式尋找分裂點，結果記憶體吃緊且速度很慢。改用 LightGBM 後，下列哪一項機制最直接降低了尋找分裂點的計算量與記憶體用量？", "options": {"A": "直方圖演算法（Histogram-based）：先把連續特徵分箱成少數離散桶，再在桶的邊界上尋找分裂點", "B": "層級式成長（Level-wise）：同一深度的所有葉子一起分裂，讓樹保持平衡", "C": "把 max_depth 與 num_leaves 都調到最大，讓每棵樹長得更深更細，以提高擬合能力並加快訓練", "D": "以 Bagging 對資料做 bootstrap 抽樣，讓各棵樹彼此獨立並行訓練"}, "answer": "A", "explanation": "答案 A。LightGBM 以直方圖演算法把連續特徵離散化成固定數量的桶，只需在桶邊界上評估分裂，計算複雜度與記憶體都大幅下降，這是它在大資料、大特徵數上又快又省的關鍵；再搭配葉子式（Leaf-wise）成長，優先分裂增益最大的葉子。層級式成長是 XGBoost 的作法；把樹長得更深更細反而更耗資源且易過擬合；Bagging 是隨機森林的機制。", "per_option": {"A": "正確：分箱後只需評估桶邊界，降低計算量與記憶體。", "B": "層級式成長是 XGBoost 的作法，且與降低掃描成本無直接關係。", "C": "樹長得更深更細只會增加計算與過擬合風險。", "D": "Bagging 是隨機森林的機制，不是 LightGBM 降低計算量的方式。"}, "guide_ref": "學習指引 p.4-22～4-25", "hot": false}, {"no": 12, "section": "4.2", "topic_id": "4.2-13", "topic": "樸素貝氏", "style": "計算", "stem": "垃圾郵件過濾器以樸素貝氏分類。訓練資料統計：垃圾郵件占 30%；在垃圾郵件中，出現「免費」一詞的機率為 0.6、出現「中獎」一詞的機率為 0.5；在正常郵件中，兩詞的機率分別為 0.1 與 0.05。一封同時含有「免費」與「中獎」的新郵件，其為垃圾郵件的後驗機率最接近下列何者？（假設給定類別下兩詞條件獨立）", "options": {"A": "0.72", "B": "0.09", "C": "0.96", "D": "0.30"}, "answer": "C", "explanation": "答案 C。樸素貝氏假設給定類別下特徵條件獨立。垃圾分子：0.3×0.6×0.5 = 0.09；正常分子：0.7×0.1×0.05 = 0.0035；證據 P(X) = 0.09 + 0.0035 = 0.0935；後驗 = 0.09／0.0935 ≈ 0.963。", "per_option": {"A": "0.72 是只看「免費」一個詞的後驗（0.18／0.25），沒有納入「中獎」。", "B": "0.09 只是垃圾郵件的未正規化分子，還沒除以證據 P(X)。", "C": "正確：0.09／(0.09＋0.0035) ≈ 0.963。", "D": "0.30 只是先驗機率，沒有使用任何詞語證據。"}, "guide_ref": "學習指引 p.4-34～4-36", "hot": false, "detail": {"steps": [["① 垃圾郵件的分子", "垃圾分子 ＝ P(垃圾) × P(詞1｜垃圾) × P(詞2｜垃圾)（樸素貝氏：假設在同一個類別下，各個詞互相獨立，所以機率可以直接連乘）", "＝ 0.3 × 0.6 × 0.5 ＝ 0.09"], ["② 正常郵件的分子", "正常分子 ＝ P(正常) × P(詞1｜正常) × P(詞2｜正常)；P(正常) ＝ 1 − P(垃圾)", "P(正常) ＝ 1 − 0.3 ＝ 0.7；＝ 0.7 × 0.1 × 0.05 ＝ 0.0035"], ["③ 證據 P(X)", "P(X) ＝ 垃圾分子 ＋ 正常分子（這封信同時有兩個詞的所有可能來源）", "＝ 0.09 ＋ 0.0035 ＝ 0.0935"], ["④ 後驗機率", "P(垃圾｜兩個詞) ＝ 垃圾分子 ÷ P(X)", "＝ 0.09 ÷ 0.0935 ≈ 0.9626，約 0.96，選 C"], ["⑤ 對照其他選項（怎麼算錯的）", "只看一個詞：垃圾 ＝ P(垃圾)×P(詞1｜垃圾)，正常 ＝ P(正常)×P(詞1｜正常)，再各自除以兩者之和；未正規化分子 ＝ 還沒除以證據", "A：只看「免費」：垃圾 0.3 × 0.6 ＝ 0.18，正常 0.7 × 0.1 ＝ 0.07，0.18 ÷ (0.18 ＋ 0.07) ＝ 0.18 ÷ 0.25 ＝ 0.72，沒納入「中獎」。B：0.09 ＝ 步驟①的分子，沒除以步驟③的 0.0935。D：0.30 ＝ 題目給的先驗 P(垃圾)，沒用到任何詞語證據"]], "tip": "樸素貝氏＝先驗 × 各特徵機率連乘，再對所有類別正規化（除以總和）。"}}, {"no": 13, "section": "4.2", "topic_id": "4.2-14", "topic": "K-means", "style": "情境", "stem": "分析師對同一份顧客資料重複執行 K-means（K = 4），每次得到的群集邊界與總群內平方和（SSE）都略有不同。下列哪一種作法最能改善這種結果不穩定的情形？", "options": {"A": "對所有特徵先做 Min-Max 縮放，縮放後每次執行的結果就會完全固定", "B": "使用 k-means++ 初始化，並多次初始化後保留 SSE 最小者", "C": "把最大迭代次數設為 1，避免質心被反覆更新而造成結果漂移不定", "D": "把 K 設為樣本數，讓每個資料點都自成一群，結果就不會再變動"}, "answer": "B", "explanation": "答案 B。K-means 只保證收斂到局部最佳解，結果對初始質心敏感，所以每次跑可能略有不同。實務上用 k-means++ 讓初始質心彼此分散，並多次初始化、取 SSE 最小的那次，可明顯提升穩定度。縮放只影響距離尺度，不會消除初始化的隨機性；只迭代一次會得到未收斂的結果；K 等於樣本數則失去分群意義。", "per_option": {"A": "縮放處理的是尺度問題，初始質心的隨機性依然存在。", "B": "正確：針對初始質心敏感，用 k-means++ 與多次初始化並選 SSE 最小者。", "C": "只迭代一次會讓質心尚未收斂，結果更差。", "D": "K 等於樣本數時每點一群，失去分群意義。"}, "guide_ref": "學習指引 p.4-41～4-42", "hot": false}, {"no": 14, "section": "4.2", "topic_id": "4.2-16", "topic": "DBSCAN", "style": "否定", "stem": "關於 DBSCAN 分群演算法，下列敘述何者錯誤？", "options": {"A": "執行前必須事先指定群數 K，否則演算法無法開始運作", "B": "可以找出月牙形等非球形、任意形狀的群集", "C": "各群密度差異很大時，單一組 Eps 與 MinPts 往往難以同時兼顧", "D": "沒有被任何核心點鄰域涵蓋的低密度點，會被標記為噪聲點"}, "answer": "A", "explanation": "答案 A。本題要選錯誤的敘述。DBSCAN 的優點之一就是不需要預先指定群數，群數由資料的密度結構自動決定；需要調的是鄰域半徑 Eps 與核心點門檻 MinPts。它能找出任意形狀的群集、自動標出噪聲點；缺點是對 Eps／MinPts 敏感，且密度不均的群集效果不佳。", "per_option": {"A": "錯誤（本題答案）：DBSCAN 不需預先指定群數，那是 K-means 的限制。", "B": "敘述正確：基於密度，可找任意形狀群集。", "C": "敘述正確：密度不均是 DBSCAN 的已知缺點。", "D": "敘述正確：既非核心點也不在核心點鄰域內者為噪聲點。"}, "guide_ref": "學習指引 p.4-43～4-44", "hot": false}, {"no": 15, "section": "4.3", "topic_id": "4.3-02"
