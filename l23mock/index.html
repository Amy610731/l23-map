（此點為主流教科書說法）。", "per_option": {"A": "L1 懲罰的是係數的絕對值，係數大小會隨特徵尺度改變；被歸零並不必然代表不重要。", "B": "λ = 0 等於完全沒有正則化，不會產生任何特徵選擇效果。", "C": "同樣的影響力，尺度大的特徵只需很小的係數，因此受罰較輕；標準化後各特徵才在相同基準上受罰。", "D": "L1 與 L2 的懲罰都作用在係數大小上，都受特徵尺度影響；Ridge 也同樣需要標準化。"}, "guide_ref": "學習指引 p.5-42～5-45（特徵尺度影響為主流教科書說法，指引未明載）", "hot": true}, {"no": 37, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "情境", "stem": "某團隊訓練時發現驗證損失帶有輕微的雜訊波動，但整體在第 12 個 epoch 達到最低後便開始上升，訓練損失則持續下降。團隊要設定提早停止（Early Stopping），下列哪一種設定最適當？", "options": {"A": "監控訓練損失（Training Loss）：連續 1 個 epoch 沒有下降就立刻停止，以節省訓練時間", "B": "監控測試損失（Test Loss）：測試損失一上升就停止，以取得最佳的最終測試分數，避免模型繼續訓練", "C": "過短的 patience（Short Patience）：監控驗證損失，只要有一次沒改善就立刻停止，以避免任何過擬合的風險", "D": "適度 patience（Moderate Patience）：監控驗證損失，連續約 5 個 epoch 沒改善才停止並還原最佳權重"}, "answer": "D", "explanation": "答案 D。早停要看驗證集（不是訓練集或測試集）的損失；驗證損失有波動時，要設定適度的 patience（例如連續 5～10 個 epoch 沒改善才停），並在停止後還原到驗證表現最佳時的權重。patience 太短會欠擬合，太長則可能仍過擬合。", "per_option": {"A": "訓練損失會一路下降，無法反映過擬合；patience 為 1 也容易被雜訊誤觸發。", "B": "用測試集決定停止點，等於讓測試集參與調參，造成資料洩漏。", "C": "驗證損失本來就有雜訊波動，patience 太短會在模型學完之前過早停止，造成欠擬合。", "D": "監控驗證損失才能偵測過擬合；適度的 patience 可容忍雜訊波動，還原最佳權重則保留最佳模型。"}, "guide_ref": "學習指引 p.5-45～5-46", "hot": true}, {"no": 38, "section": "5.4", "topic_id": "5.4-08", "topic": "網路深度與寬度", "style": "否定", "stem": "某團隊在設計全連接神經網路的深度（層數）與寬度（每層神經元數）時，進行了下列討論。何者敘述錯誤？", "options": {"A": "無限堆疊（Unlimited Stacking）：持續堆疊層數，即使沒有適當的初始化、批次正規化或殘差連接，網路越深效果也一定單調提升", "B": "模型容量（Model Capacity）：深度（層數）與寬度（每層神經元數）共同決定神經網路的容量與參數量", "C": "過擬合與欠擬合（Overfitting & Underfitting）：過寬、參數過多的網路較容易過擬合；過淺的網路則可能表達力不足而欠擬合", "D": "資源成本（Resource Cost）：深而寬的模型需要更多訓練時間與硬體資源，部署前也要一併考量"}, "answer": "A", "explanation": "答案 A。網路的深度與寬度要依任務與資料量設計：過深而缺乏初始化、批次正規化或殘差連接，會因梯度消失而訓練不起來；過寬易過擬合；過淺易欠擬合。無規劃地堆疊層數不保證效果。", "per_option": {"A": "網路過深而缺乏這些穩定機制，容易梯度消失、難以收斂，加層不保證變好。", "B": "深度與寬度是神經網路容量與參數量的兩個主要設計維度，敘述正確。", "C": "寬度與參數量過大易過擬合，過淺則表達力不足，敘述正確。", "D": "容量越大，訓練與部署成本越高，敘述正確。"}, "guide_ref": "學習指引 p.5-33～5-35", "hot": false}, {"no": 39, "section": "5.4", "topic_id": "5.4-09", "topic": "優化器選用", "style": "情境", "stem": "某團隊要在記憶體極度吃緊的裝置上訓練一個小型模型，無法再多存任何與參數量同等級的額外狀態（例如梯度的歷史累積值或速度向量）；團隊願意花時間手動調整學習率。下列哪一種優化器的記憶體需求最低、最符合此限制？", "options": {"A": "Adam：結合一階動量與二階動量，收斂快而穩，但需額外儲存梯度歷史", "B": "Adagrad：為每個參數累積梯度平方和以調整學習率，適合稀疏特徵", "C": "隨機梯度下降（SGD）：只用當批梯度更新參數，不另外保留任何歷史狀態", "D": "動量法（Momentum）：保留過去梯度的慣性以減少震盪、加快收斂"}, "answer": "C", "explanation": "答案 C。SGD 只用當批梯度更新，不需保存歷史資訊，記憶體需求最低，但容易受雜訊影響、收斂慢、依賴學習率。Momentum 要保存速度、Adagrad 要保存梯度平方累積、Adam 要保存一階與二階動量，都需要額外的狀態空間。", "per_option": {"A": "Adam 需為每個參數額外保存一階、二階動量，記憶體需求較高。", "B": "需為每個參數額外保存累積值，不符合「不能多存額外狀態」的限制。", "C": "不保留任何歷史狀態，是記憶體需求最低的優化器，代價是收斂較慢、對學習率敏感。", "D": "需額外保存與參數量同等級的速度向量，不符合記憶體限制。"}, "guide_ref": "學習指引 p.5-37～5-42", "hot": false}, {"no": 40, "section": "5.4", "topic_id": "5.4-10", "topic": "ElasticNet", "style": "情境", "stem": "某基因研究有 20,000 個特徵，其中許多基因成群高度相關。團隊希望模型能把不重要的特徵係數壓為 0 以簡化模型，同時避免在相關特徵之間每次訓練都隨機挑選不同的代表。下列哪一種方法最適當？", "options": {"A": "Lasso（L1 正則化）：懲罰係數絕對值總和，可把不重要特徵的係數壓為 0", "B": "Ridge（L2 正則化）：懲罰係數平方和，讓係數整體變小並由相關特徵共同分攤", "C": "普通最小平方法（OLS）：不加任何懲罰項，只最小化誤差平方和，是最基本的線性迴歸求解方式，計算簡單且有封閉解", "D": "彈性網路（Elastic Net）：同時加入 L1 與 L2 懲罰，兼具特徵選擇與相關特徵分攤權重"}, "answer": "D", "explanation": "答案 D。Elastic Net 的損失函數同時含 L1 與 L2 懲罰：L1 保留特徵選擇能力，L2 防止過度稀疏並讓高度相關的特徵一起分攤權重，對多重共線性特別有效；代價是要同時調兩個正則化係數。", "per_option": {"A": "會做特徵選擇，但在高度相關的特徵間傾向只挑一個，且每次訓練挑到的可能不同。", "B": "能分攤相關特徵的權重，但不會把任何係數壓為 0，無法簡化模型。", "C": "沒有正則化，面對共線性與大量特徵時估計極不穩定，也不會做特徵選擇。", "D": "L1 成分負責把部分係數壓為 0，L2 成分讓高度相關特徵共同分攤，兩個需求同時滿足。"}, "guide_ref": "學習指引 p.5-45", "hot": false}, {"no": 41, "section": "5.4", "topic_id": "5.4-11", "topic": "重取樣與類別權重", "style": "否定", "stem": "某工廠的瑕疵品只占全部產品的 1%，團隊討論如何處理類別不平衡。關於重取樣與類別權重的敘述，下列何者錯誤？", "options": {"A": "SMOTE：在少數類樣本之間合成新樣本，可保留原始資料，但可能產生不自然的資料點", "B": "類別權重調整（Class Weight）：做法是複製少數類樣本，使訓練資料集的筆數增加", "C": "隨機欠採樣（Random Undersampling）：刪減多數類樣本，可能丟失有價值的資料，少數類本來就很稀少時尤其不適合", "D": "權重過大（Over-weighting）：提高少數類權重時若設得過大，可能造成過度補償"}, "answer": "B", "explanation": "答案 B。類別權重調整不更動樣本數，只在損失函數中讓少數類的錯誤算得更重，保留完整資料、資源消耗低；單純複製少數類樣本屬於過採樣（容易過擬合），不是類別權重。評估時也別只看 Accuracy，應搭配 F1、Recall、AUC。", "per_option": {"A": "SMOTE 的特性與缺點，敘述正確。", "B": "類別權重是在損失函數中提高少數類的錯誤權重，不更動樣本數；複製少數類是過採樣。", "C": "欠採樣的代價是丟資料，敘述正確。", "D": "權重需謹慎調整，過大會過度補償，過小又無法解決失衡，敘述正確。"}, "guide_ref": "學習指引 p.5-47～5-49", "hot": false}, {"no": 42, "section": "6.1", "topic_id": "6.1-03", "topic": "基礎匿名化技術", "style": "情境", "stem": "某公司要釋出員工薪資資料給外部研究者分析整體薪資分布，要求不可讓研究者取得任何人的真實薪資；同時研究者拿到的每一筆薪資仍須是單一數值（不能是區間或類別），才能直接計算平均數與標準差，且結果要與原始資料相近。下列哪一種匿名化技術最適當？", "options": {"A": "隨機擾動（Noise Addition）：對數值加入隨機噪聲，保留整體統計特性", "B": "雜湊（Hashing）：以 SHA-256 等單向函數轉成固定長度字串，不可逆，可用於比對", "C": "遮蔽（Masking）：把薪資的部分數字用符號蓋掉，保留原本的格式，簡單但可能被推回", "D": "分桶（Binning）：把薪資轉成區間，如 50K–60K，降低精度並減少個別識別風險"}, "answer": "A", "explanation": "答案 A。五種基礎技術各有特點：遮蔽＝蓋掉部分內容、雜湊＝單向不可逆編碼、泛化＝降低精度、分桶＝數值變區間、隨機擾動＝對數值加噪聲。只有隨機擾動能同時做到「不給真實值」、「每筆仍是單一數值」與「保留平均數、標準差等整體統計」；分桶雖能降低識別風險，但輸出的是區間而非數值。", "per_option": {"A": "個別數值被擾動而無法還原真實值，平均數與標準差等整體特性仍大致保留。", "B": "雜湊後的字串無法做平均數、標準差等數值分析。", "C": "被蓋掉的數字無法計算，也可能搭配其他資料被推回。", "D": "研究者拿到的是區間而非每筆單一數值，不符合題目「每筆仍須是數值」的條件，也無法直接算出原始的平均數與標準差。"}, "guide_ref": "學習指引 p.6-7～6-9", "hot": false}, {"no": 43, "section": "6.1", "topic_id": "6.1-04", "topic": "K-匿名與L/T", "style": "計算", "stem": "某醫院要釋出 12 筆就診紀錄，以「年齡層」與「性別」作為準識別欄位。依這兩欄分群後，各群組的人數為：20～29 歲男性 4 人、20～29 歲女性 3 人、30～39 歲男性 3 人、30～39 歲女性 2 人。這份資料最高滿足下列哪一個 K-匿名？", "options": {"A": "2-匿名（K = 2）", "B": "3-匿名（K = 3）", "C": "4-匿名（K = 4）", "D": "12-匿名（K = 12）"}, "answer": "A", "explanation": "答案 A。K-匿名要求每筆紀錄在準識別欄位上至少與其他 K−1 筆相同，也就是每個群組至少 K 人，所以 K 等於最小群組的人數：min(4, 3, 3, 2) = 2。此外，K-匿名只管準識別欄位，群組內敏感值若全相同仍會洩漏，需靠 L-多樣性補強。", "per_option": {"A": "K-匿名取決於最小群組人數：最小的群組只有 2 人，所以最高為 K = 2。", "B": "3 是群組人數的常見值（或平均），但有一個群組只有 2 人，達不到 3。", "C": "4 是最大群組的人數，K-匿名看的是最小群組。", "D": "12 是總筆數，只有全部紀錄在準識別欄位上完全相同才可能達到。"}, "guide_ref": "學習指引 p.6-10", "hot": false, "detail": {"steps": [["① 確認群組人數加得起來", "各群組人數加總 ＝ 總筆數", "4 ＋ 3 ＋ 3 ＋ 2 ＝ 12，與題目的 12 筆一致"], ["② 找最小的群組", "K-匿名的 K ＝ 所有群組人數中最小的那一個（每個人至少要跟 K－1 個人長得一樣）", "K ＝ min(4, 3, 3, 2) ＝ 2（30～39 歲女性只有 2 人），所以最高是 2-匿名，選 A"], ["③ 對照其他選項", "要滿足 K，「每一群」都要至少 K 人，只要有一群不夠就不成立", "B：3 剛好是平均（12 ÷ 4 ＝ 3），但有一群只有 2 人，不夠。C：4 是最大群組的人數，K-匿名看的是最小群組。D：12 是總筆數，要全部 12 人在準識別欄位上都一樣（只有一個群組）才可能"]], "tip": "K-匿名的 K ＝ 最小群組的人數，短板決定等級。"}}, {"no": 44, "section": "6.2", "topic_id": "6.2-04", "topic": "不利影響比與評估工具", "style": "計算", "stem": "某公司的招聘模型在某次篩選中，男性申請者 120 人中有 54 人通過（45%），女性申請者 100 人中有 33 人通過（33%）。依不利影響比（Disparate Impact）的 80% 規則檢視，下列判斷何者正確？", "options": {"A": "不利影響比 = 45% ÷ 33% ≈ 1.36，高於 0.8，沒有間接歧視的疑慮，可直接視為合規", "B": "通過率差距為 12 個百分點，小於 20 個百分點，沒有間接歧視的疑慮", "C": "不利影響比 = 33% ÷ 45% ≈ 0.73，低於 0.8，有間接歧視的疑慮，需進一步檢視", "D": "不利影響比 ≈ 0.73，但只要女性通過率高於 30% 就視為合規"}, "answer": "C", "explanation": "答案 C。男性通過率 54／120 = 45%，女性 33／100 = 33%。不利影響比 = 33% ÷ 45% ≈ 0.733，低於 0.8，可能構成間接歧視，需進一步檢視。這個指標只看比例，無法指出偏差的原因。", "per_option": {"A": "分子分母放反了；應以較低通過率除以較高通過率。", "B": "80% 規則比較的是通過率的比值，不是差值，也不存在 20 個百分點的門檻。", "C": "不利影響比是較低群體的通過率除以較高群體的通過率，0.73 < 0.8，達到需檢視的程度。", "D": "80% 規則沒有「通過率高於 30% 即合規」這種門檻，判斷依據是比值是否達 0.8。"}, "guide_ref": "學習指引 p.6-19～6-20", "hot": false, "detail": {"steps": [["① 算各群的通過率", "通過率 ＝ 通過人數 ÷ 申請人數", "男性 ＝ 54 ÷ 120 ＝ 0.45（45%）；女性 ＝ 33 ÷ 100 ＝ 0.33（33%）"], ["② 算不利影響比（Disparate Impact）", "DI ＝ 較低的通過率 ÷ 較高的通過率（分子放低的那一群）", "＝ 0.33 ÷ 0.45 ≈ 0.733，約 0.73"], ["③ 套用 80% 規則判斷", "DI 低於規則的門檻 → 有間接歧視的疑慮，需進一步檢視；達到門檻才算過關", "門檻是 0.8（即 80%）；0.73 ＜ 0.8，有疑慮，選 C"], ["④ 對照其他選項", "這個規則比的是「比值」，而且分子是較低的通過率", "A：45 ÷ 33 ≈ 1.36，分子分母放反了，不能拿來跟 0.8 比。B：45 － 33 ＝ 12 個百分點是差值，規則比的是比值，沒有「差 20 個百分點」的門檻。D：0.73 算對了，但規則沒有「女性通過率高於 30% 就合規」這種門檻，女性 33% 超過 30% 也一樣不達標"]], "tip": "不利影響比 ＝ 低通過率 ÷ 高通過率，未達 0.8（80%）就要檢視。"}}, {"no": 45, "section": "6.2", "topic_id": "6.2-06", "topic": "組織公平性治理", "style": "情境", "stem": "某金融公司的信貸評分模型被外界質疑可能對特定族群不公平，管理層要建立長期的組織公平性治理機制。下列哪一種做法最符合指引所述的治理原則？", "options": {"A": "單一團隊自決（Single-team Decision）：由資料科學團隊獨自決定公平性指標，上線後若有客訴再由同一團隊自行檢視", "B": "一次性稽核（One-off Audit）：只在模型首次上線前做一次公平性稽核，之後只要不更動模型就不再審查", "C": "封閉式內審（Closed Internal Review）：公平性審查只留在公司內部，不產出報告也不引入第三方驗證，以避免洩漏商業機密", "D": "跨部門審查委員會（Cross-functional Review Board）：納入法務、技術、產品、倫理與風險管理，專案早期就參與，並留存紀錄、定期稽核"}, "answer": "D", "explanation": "答案 D。確保 AI 公平不能只靠技術，還要變成制度：跨部門公平性審查委員會（專案早期就參與）、明確問責與審查紀錄、定期稽核與日常監控、多元化團隊與培訓，以及公開報告、第三方驗證等資訊揭露。", "per_option": {"A": "缺乏跨部門與獨立審查，也是事後補救而非專案早期介入。", "B": "應定期稽核，新系統或重大更新時也要審查，並納入日常監控。", "C": "指引建議公開公平性報告、引入第三方獨立驗證，並與利益關係人溝通。", "D": "跨部門、早期介入、明確問責與定期稽核，正是公平性治理的核心。"}, "guide_ref": "學習指引 p.6-23～6-25", "hot": false}, {"no": 46, "section": "X", "topic_id": "X-01", "topic": "參數量與運算量", "style": "計算", "stem": "某團隊以 Keras 建立下列手寫數字分類模型：\n```\nmodel = Sequential([\n    Conv2D(8, (3, 3), padding='same', activation='relu', input_shape=(28, 28, 1)),\n    MaxPooling2D((2, 2)),\n    Flatten(),\n    Dense(10, activation='softmax')\n])\n```\n請問 model.count_params() 回傳的可學習參數總數為何？（卷積層與全連接層皆含偏差）", "options": {"A": "15,690", "B": "15,762", "C": "15,770", "D": "62,810"}, "answer": "C", "explanation": "答案 C。卷積層：3×3×1（輸入通道）×8（輸出通道）+ 8（偏差）= 80。padding='same' 使尺寸維持 28×28，MaxPooling(2,2) 縮成 14×14，沒有可學習參數；Flatten 後為 14×14×8 = 1,568 維，Dense(10)：1,568×10 + 10 = 15,690。總計 80 + 15,690 = 15,770。", "per_option": {"A": "只算了 Dense 層，漏掉卷積層的 80 個參數。", "B": "卷積層漏算了 8 個偏差（只算 72 個權重）。", "C": "卷積層 3×3×1×8+8 = 80；池化後 14×14×8 = 1,568 維，Dense 為 1,568×10+10 = 15,690；合計 15,770。", "D": "忘了 MaxPooling 會把特徵圖縮成 14×14，誤用 28×28×8 = 6,272 維接 Dense，Dense 部分變成 62,730。"}, "guide_ref": "指引未載（主流教科書／官方文件說法）", "hot": true, "detail": {"steps": [["① 算卷積層的參數", "卷積層參數 ＝ 核高 × 核寬 × 輸入通道數 × 濾波器數 ＋ 偏差（每個濾波器一個，個數 ＝ 濾波器數）", "權重 ＝ 3 × 3 × 1 × 8 ＝ 72；偏差 ＝ 8；合計 72 ＋ 8 ＝ 80"], ["② 追蹤特徵圖大小（池化沒有參數）", "padding='same'、步幅 1 時，輸出的長寬 ＝ 輸入的長寬；池化視窗邊長 p 會使長寬各 ÷ p；通道數不變", "卷積後：28 × 28 × 8（通道數 ＝ 濾波器數 8）；池化 (2,2) 後：長寬各 ÷ 2 ＝ 14 × 14 × 8。池化只取最大值，沒有可學習參數，＝ 0"], ["③ Flatten（攤平）後的維度", "維度 ＝ 高 × 寬 × 通道數", "＝ 14 × 14 × 8 ＝ 196 × 8 ＝ 1,568"], ["④ 算 Dense（全連接）層的參數", "Dense 參數 ＝ 輸入維度 × 神經元數 ＋ 偏差（個數 ＝ 神經元數）", "＝ 1,568 × 10 ＋ 10 ＝ 15,680 ＋ 10 ＝ 15,690"], ["⑤ 加總（model.count_params() 就是把每一層的參數量加起來）", "總參數 ＝ 卷積層 ＋ 池化層 ＋ Flatten ＋ Dense", "＝ 80 ＋ 0 ＋ 0 ＋ 15,690 ＝ 15,770，選 C"], ["⑥ 對照其他選項（怎麼算錯的）", "每個選項都是少算一塊或某一步算錯", "A：15,690 只有 Dense，漏掉卷積層的 80。B：72 ＋ 15,690 ＝ 15,762，卷積層漏了 8 個偏差。D：忘了池化縮小，Flatten 變成 28 × 28 × 8 ＝ 6,272，Dense ＝ 6,272 × 10 ＋ 10 ＝ 62,730，加卷積的 80 ＝ 62,810"]], "code": [["model = Sequential([", "Sequential＝循序模型，括號裡的層會由上往下一層接一層串起來，前一層的輸出就是下一層的輸入"], ["Conv2D(8, (3, 3), padding='same', activation='relu', input_shape=(28, 28, 1)),", "Conv2D＝二維卷積層。8＝8 個濾波器（輸出 8 個通道）；(3, 3)＝每個濾波器大小 3×3；padding='same'＝四周補 0，讓輸出長寬維持 28×28；activation='relu'＝輸出後套用 ReLU（負的變 0）；input_shape=(28, 28, 1)＝輸入是 28×28、1 個通道（灰階）的圖"], ["MaxPooling2D((2, 2)),", "最大池化層：每個 2×2 的小區塊只留最大值，長寬各縮成一半（28→14）。它只是挑最大值，沒有可學習的參數"], ["Flatten(),", "Flatten＝攤平：把 14×14×8 的立體特徵圖拉成一條長度 1,568 的向量，才能接全連接層。沒有參數"], ["Dense(10, activation='softmax')", "Dense＝全連接層，10 個神經元（對應 10 個數字類別）；每個神經元連到全部 1,568 個輸入，所以有 1,568×10 個權重加 10 個偏差。softmax 把 10 個輸出轉成加總為 1 的機率"]], "tip": "算參數量：只有卷積層與 Dense 有參數；池化、Flatten 是 0，但它們會改變特徵圖大小。", "fig": {"type": "layers", "title": "每一層的形狀", "items": [{"name": "輸入", "shape": "28×28×1"}, {"name": "Conv 3×3，8 個", "shape": "28×28×8", "note": "參數 (3×3×1＋1)×8 ＝ 80"}, {"name": "MaxPool 2×2", "shape": "14×14×8", "note": "沒有參數，長寬各除以 2"}, {"name": "Flatten", "shape": "1,568", "note": "14×14×8 ＝ 1,568，沒有參數"}, {"name": "Dense(10)", "shape": "10", "note": "參數 (1,568＋1)×10 ＝ 15,690", "hl": true}], "note": "總參數 ＝ 80 ＋ 0 ＋ 0 ＋ 15,690 ＝ 15,770"}}}, {"no": 47, "section": "X", "topic_id": "X-01", "topic": "參數量與運算量", "style": "計算", "stem": "為了讓影像模型能跑在手機上，團隊把一個標準 3×3 卷積層（輸入 32 通道、輸出 64 通道，不含偏差）改成深度可分離卷積：先做深度卷積（Depthwise，3×3，每個輸入通道各用一個 3×3 濾波器），再做逐點卷積（Pointwise，1×1，32→64 通道），兩者同樣不含偏差。改造後這一層的參數量為多少？", "options": {"A": "2,048", "B": "2,336", "C": "2,624", "D": "18,432"}, "answer": "B", "explanation": "答案 B。標準卷積：3×3×32×64 = 18,432。深度可分離卷積：深度卷積每個輸入通道一個 3×3 濾波器，3×3×32 = 288；逐點卷積 1×1×32×64 = 2,048；合計 2,336，約為原本的 1／7.9。這就是 MobileNet 能大幅降低參數量與運算量的原因。", "per_option": {"A": "只算了逐點卷積，漏掉深度卷積的 288 個參數。", "B": "深度卷積 3×3×32 = 288，加上逐點卷積 1×1×32×64 = 2,048，共 2,336。", "C": "深度卷積誤用輸出通道數 64（3×3×64 = 576），應使用輸入通道數 32。", "D": "這是原本標準卷積的參數量 3×3×32×64，不是改造後的數字。"}, "guide_ref": "指引未載（主流教科書／官方文件說法）", "hot": true, "detail": {"steps": [["① 先算標準卷積（對照用）", "標準卷積參數 ＝ 核高 × 核寬 × 輸入通道數 × 輸出通道數（不含偏差）", "＝ 3 × 3 × 32 × 64 ＝ 288 × 64 ＝ 18,432"], ["② 算深度卷積（Depthwise）", "深度卷積參數 ＝ 核高 × 核寬 × 輸入通道數（每個輸入通道各一個濾波器，通道之間不混合）", "＝ 3 × 3 × 32 ＝ 288"], ["③ 算逐點卷積（Pointwise）", "逐點卷積參數 ＝ 1 × 1 × 輸入通道數 × 輸出通道數", "＝ 1 × 1 × 32 × 64 ＝ 2,048"], ["④ 加總並對到答案", "深度可分離卷積參數 ＝ 深度卷積 ＋ 逐點卷積", "＝ 288 ＋ 2,048 ＝ 2,336，選 B；與標準卷積相比：18,432 ÷ 2,336 ≈ 7.9，約省 7.9 倍"], ["⑤ 對照其他選項", "每個選項都是用錯通道數或漏算一塊", "A：2,048 只有逐點卷積，漏掉深度卷積的 288。C：深度卷積誤用輸出通道 64：3 × 3 × 64 ＝ 576，576 ＋ 2,048 ＝ 2,624，但深度卷積是每個「輸入」通道一個濾波器，應該是 32。D：18,432 是改造前的標準卷積"]], "tip": "深度可分離卷積 ＝ 先逐通道做空間濾波（Depthwise），再用 1×1 混合通道（Pointwise）。", "fig": {"type": "layers", "title": "深度可分離卷積（每層參數）", "items": [{"name": "輸入", "shape": "32 通道"}, {"name": "Depthwise 3×3", "shape": "32 通道", "note": "每個輸入通道一個濾波器 3×3×32 ＝ 288"}, {"name": "Pointwise 1×1", "shape": "64 通道", "note": "1×1×32×64 ＝ 2,048", "hl": true}], "note": "合計 288 ＋ 2,048 ＝ 2,336（標準卷積 18,432，約省 7.9 倍）"}}}, {"no": 48, "section": "X", "topic_id": "X-02", "topic": "時間序列驗證", "style": "情境", "stem": "某零售商用過去三年的每日銷售資料預測下週需求。工程師使用打亂順序的 5 折交叉驗證，驗證 R² 高達 0.95，但模型上線後的實際 R² 只有 0.60。下列何者最可能是造成落差的主因，並該如何改善？", "options": {"A": "折數過少（Too Few Folds）：折數太少使評估不夠穩定，只要把折數改為 50 折，驗證分數就會與上線表現一致", "B": "未做縮放（Missing Scaling）：銷售資料沒有做標準化；應使用 Min-Max 縮放後重新做同樣的打亂交叉驗證", "C": "留一法（LOOCV）：每次只留 1 筆資料驗證，資料利用最大且不會有資料洩漏，因此應改用留一法", "D": "資料洩漏（Data Leakage）：隨機打亂使未來資料進入訓練集而高估表現；應改用滾動視窗或 TimeSeriesSplit"}, "answer": "D", "explanation": "答案 D。時間序列不可隨機打亂：一般 K-fold、分層 K-fold、留一法都會讓未來資料進入訓練集。正確做法是訓練集永遠在前、驗證集在後，多折往時間後方推進（滾動視窗、擴張視窗或 TimeSeriesSplit），也能檢視模型面對環境變化時是否仍然穩健。", "per_option": {"A": "增加折數不會解決時間順序問題，隨機切分仍會讓未來資料進入訓練集。", "B": "縮放與落差無關，問題出在切分方式，不是尺度。", "C": "留一法同樣沒有尊重時間順序，訓練集仍包含驗證那筆之後的未來資料。", "D": "時間序列有先後順序與前後相關，驗證資料必須在訓練資料之後，才能模擬「用過去預測未來」。"}, "guide_ref": "指引未載（主流教科書／官方文件說法）", "hot": true}, {"no": 49, "section": "X", "topic_id": "X-03", "topic": "網格與隨機搜尋", "style": "計算", "stem": "某團隊使用下列程式進行超參數搜尋：\n```\nfrom scipy.stats import randint, loguniform\nparams = {'n_estimators': randint(100, 500),\n          'max_depth': [3, 5, 7, 9],\n          'learning_rate': loguniform(1e-3, 1e-1)}\nsearch = RandomizedSearchCV(model, params, n_iter=20, cv=5)\nsearch.fit(X, y)\n```\n不計最後以最佳參數重新訓練（refit）的那一次，search.fit 期間總共會訓練幾次模型？", "options": {"A": "20 次", "B": "100 次", "C": "120 次", "D": "無法計算：n_estimators 與 learning_rate 取自連續分佈，組合數無窮多，次數沒有上限"}, "answer": "B", "explanation": "答案 B。隨機搜尋（Random Search）在指定範圍內隨機抽樣固定次數（n_iter = 20）的組合，成本由自己控制；每組還要做 cv = 5 折，所以總訓練次數 = 20 × 5 = 100。網格搜尋才是各超參數候選數連乘；隨機搜尋也可以從連續分佈抽值。", "per_option": {"A": "只算了抽樣的組合數，漏乘了交叉驗證的折數 5。", "B": "隨機搜尋只抽 n_iter = 20 組，每組做 5 折交叉驗證：20 × 5 = 100。", "C": "把 20 組與 20×5 = 100 次相加，運算方式錯誤。", "D": "隨機搜尋的成本由 n_iter 決定，與搜尋空間大小無關，這正是它預算可控的優點。"}, "guide_ref": "指引未載（主流教科書／官方文件說法）", "hot": true, "detail": {"steps": [["① 算要比較幾組超參數", "隨機搜尋的組合數 ＝ n_iter（直接指定抽幾組，與搜尋空間大小無關；連續分佈也只是抽值的來源）", "n_iter ＝ 20，所以只抽 20 組"], ["② 算總訓練次數", "總訓練次數 ＝ 組合數 × 交叉驗證折數（每一組都要在每一折各訓練一次）", "＝ 20 × 5 ＝ 100 次，選 B"], ["③ 對照其他選項", "A、C 是計算方式錯，D 是觀念錯", "A：20 只算了組合數，漏乘折數。C：20 ＋ 20 × 5 ＝ 120，把組合數又加了一次。D：隨機搜尋的次數由 n_iter 決定，不是所有可能組合，所以不是無窮"]], "code": [["from scipy.stats import randint, loguniform", "從 scipy.stats（統計模組）匯入兩種「抽樣分佈」：randint＝隨機整數、每個整數機率相同；loguniform＝對數均勻分佈，在對數尺度上均勻，適合學習率這種跨好幾個數量級的值"], ["params = {'n_estimators': randint(100, 500),", "params＝搜尋範圍的字典（名稱: 取值方式）。n_estimators＝樹的數量；randint(100, 500)＝從 100 到 499 之間隨機抽一個整數（上界 500 不含）"], ["'max_depth': [3, 5, 7, 9],", "max_depth＝樹的最大深度；中括號是固定清單，每次從 3、5、7、9 四個值裡抽一個"], ["'learning_rate': loguniform(1e-3, 1e-1)}", "learning_rate＝學習率；loguniform(1e-3, 1e-1)＝在 0.001 到 0.1 之間按對數均勻抽值（1e-3 ＝ 0.001）"], ["search = RandomizedSearchCV(model, params, n_iter=20, cv=5)", "RandomizedSearchCV＝隨機搜尋加交叉驗證。model＝要調的模型；params＝上面的搜尋範圍；n_iter=20＝總共隨機抽 20 組超參數；cv=5＝每一組用 5 折交叉驗證評分"], ["search.fit(X, y)", "fit＝開始執行：對 20 組超參數，每組各做 5 折訓練與評分（共 100 次），最後選出最佳組合並以它重新訓練一次（題目說不計這次）"]], "tip": "隨機搜尋次數 ＝ n_iter × cv 折數，預算自己控制。", "fig": {"type": "folds", "title": "隨機搜尋：每組做 5 折", "k": 5, "note": "n_iter 20 組 × 5 折 ＝ 100 次訓練（不含最後 refit）"}}}, {"no": 50, "section": "X", "topic_id": "X-04", "topic": "蒙地卡羅方法", "style": "計算", "stem": "某團隊以蒙地卡羅方法模擬 20,000 次生產情境，結果「機台 B 故障」的情境共 2,500 次；其中「機台 B 故障且全線停工」同時發生的有 500 次。依模擬結果，估計 P(全線停工 | 機台 B 故障) 約為多少？", "options": {"A": "0.025", "B": "0.125", "C": "0.20", "D": "0.80"}, "answer": "C", "explanation": "答案 C。蒙地卡羅模擬估計條件機率時：P(A|B) = (A 與 B 同時發生的次數) ÷ (B 發生的次數) = 500 ÷ 2,500 = 0.20。分母是條件事件 B 的次數，不是總模擬次數 20,000。", "per_option": {"A": "500／20,000 是聯合機率 P(停工 且 故障)，不是條件機率。", "B": "2,500／20,000 是故障本身的機率 P(機台 B 故障)。", "C": "條件機率 = 500／2,500 = 0.20。", "D": "這是 1 − 0.20，即「故障時沒有停工」的比例。"}, "guide_ref": "指引未載（主流教科書／官方文件說法）", "hot": true, "detail": {"steps": [["① 套用條件機率公式", "P(A｜B) ＝ A 與 B 同時發生的次數 ÷ B 發生的次數（分母是「已知條件」B 的次數，不是總模擬次數）", "A＝全線停工、B＝機台 B 故障：＝ 500 ÷ 2,500 ＝ 0.20，選 C"], ["② 對照其他選項（各自算的是哪個機率）", "每個選項都是不同的「次數 ÷ 次數」", "A：500 ÷ 20,000 ＝ 0.025，是聯合機率 P(停工 且 故障)，分母誤用總次數。B：2,500 ÷ 20,000 ＝ 0.125，是故障本身的機率 P(故障)。D：1 － 0.20 ＝ 0.80，是「故障時沒有停工」的比例"]], "tip": "條件機率：分母是「已知發生」的那件事的次數。"}}], "4": [{"no": 1, "section": "3.1", "topic_id": "3.1-03", "topic": "貝氏定理與條件機率", "style": "計算", "stem": "某廠商用一種檢測程序篩檢罕見故障：設備群中實際有故障的比例為 2%。檢測對「有故障」的設備回報陽性的機率為 95%，對「無故障」的設備誤報陽性的機率為 10%。某台設備獨立檢測兩次（在已知有無故障的條件下，兩次結果彼此獨立），結果兩次都是陽性。若把第一次檢測後得到的後驗機率，當作第二次檢測的先驗機率再做一次貝氏更新，這台設備確實有故障的機率約為多少？", "options": {"A": "約 16.2%：只更新了第一次檢測的結果，第二次陽性未被納入", "B": "約 32.4%：把第一次的後驗直接乘以 2", "C": "約 64.8%：以第一次後驗作為新的先驗，再代入貝氏定理更新", "D": "約 90.3%：直接用兩次命中率相乘 0.95 × 0.95"}, "answer": "C", "explanation": "答案 C。第一次陽性：後驗＝0.02×0.95÷(0.02×0.95＋0.98×0.10)＝0.019÷0.117≈0.162。把 0.162 當作第二次的先驗再更新：0.162×0.95÷(0.162×0.95＋0.838×0.10)≈0.154÷0.238≈0.648。關鍵觀念是貝氏更新可以串接——上一輪的後驗就是下一輪的先驗，罕見事件要多次證據才會讓信念大幅提高。", "per_option": {"A": "這是第一次陽性後的後驗，漏掉了第二次證據。", "B": "貝氏更新不是把機率線性相加或相乘，必須重新代入公式。", "C": "正確：兩次更新後後驗由 16.2% 升到約 64.8%。", "D": "0.95 × 0.95 只是兩次都命中的機率，忽略了先驗只有 2% 與誤報率。"}, "guide_ref": "學習指引 p.3-5～3-6", "hot": true, "detail": {"steps": [["① 第一次陽性：算分子與分母", "後驗 P(故障｜陽性) ＝ 先驗 × 命中率 ÷ [先驗 × 命中率 ＋ (1 － 先驗) × 誤報率]", "分子 ＝ 0.02 × 0.95 ＝ 0.019；(1 － 先驗) × 誤報率 ＝ 0.98 × 0.10 ＝ 0.098；分母 ＝ 0.019 ＋ 0.098 ＝ 0.117"], ["② 第一次的後驗", "後驗 ＝ 分子 ÷ 分母", "＝ 0.019 ÷ 0.117 ≈ 0.1624（約 16.2%）"], ["③ 第二次陽性：把上一步的後驗當新先驗再更新", "同樣公式，先驗換成上一輪的後驗", "新先驗 ＝ 0.1624；分子 ＝ 0.1624 × 0.95 ≈ 0.1543；(1 － 0.1624) × 0.10 ≈ 0.8376 × 0.10 ≈ 0.0838；分母 ≈ 0.1543 ＋ 0.0838 ≈ 0.2381；後驗 ≈ 0.1543 ÷ 0.2381 ≈ 0.648（約 64.8%），選 C"], ["④ 用「一次算兩次證據」驗算", "兩次檢測獨立時，分子、分母各把命中率、誤報率各乘兩次", "分子 ＝ 0.02 × 0.95 × 0.95 ＝ 0.01805；分母 ＝ 0.01805 ＋ 0.98 × 0.10 × 0.10 ＝ 0.01805 ＋ 0.0098 ＝ 0.02785；0.01805 ÷ 0.02785 ≈ 0.648，與上一步一致"], ["⑤ 對照其他選項（怎麼算錯的）", "每個選項都是少做一步或用錯數字", "A：0.162 是第一次後驗，沒納入第二次陽性。B：0.162 × 2 ≈ 0.324，貝氏更新不是乘 2。D：0.95 × 0.95 ＝ 0.9025，只是兩次都命中的機率，沒考慮先驗只有 2% 與 10% 的誤報"]], "tip": "貝氏可串接：上一輪的後驗就是下一輪的先驗；罕見事件要多次證據才會升高。", "fig": {"type": "tree", "title": "兩次檢測都陽性（假設 10 萬台）", "total": "10 萬台", "branches": [{"label": "有故障", "p": "2%", "n": "2,000 台", "leaves": [{"label": "兩次陽性", "p": "90.25%", "n": "1,805 台", "hl": "num"}, {"label": "其他", "p": "9.75%", "n": "195 台"}]}, {"label": "無故障", "p": "98%", "n": "98,000 台", "leaves": [{"label": "兩次陽性", "p": "1%", "n": "980 台", "hl": "den"}, {"label": "其他", "p": "99%", "n": "97,020 台"}]}], "result": "P(故障｜兩次陽性) ＝ 1,805 ÷ (1,805＋980) ＝ 1,805 ÷ 2,785 ≈ 64.8%"}}}, {"no": 2, "section": "3.1", "topic_id": "3.1-06", "topic": "描述統計量", "style": "情境", "stem": "某外送平台分析近一個月的單筆訂單金額，發現分佈明顯右偏：平均為 520 元、中位數為 310 元，其中少數企業團購單的金額高達數萬元。行銷主管想用「一個數字」向新加入的店家說明一般顧客單筆通常花多少錢。下列哪一個統計量最適合？", "options": {"A": "中位數（Median）：將資料排序後取中間位置的值，較不受少數極端高值影響", "B": "平均數（Mean）：所有金額加總後除以訂單筆數，會被少數極端高值往右拉", "C": "標準差（Standard Deviation）：衡量資料相對於平均數的離散程度，描述的是分散而非典型水準", "D": "峰度（Kurtosis）：衡量分佈尾部的厚薄與尖峰程度，可作為異常值多寡的參考"}, "answer": "A", "explanation": "答案 A。資料右偏且有少數極端高值時，平均數會被往右拉高（520 元遠高於中位數 310 元），不能代表一般顧客。中位數是排序後的中間值，不易受極端值影響，較適合描述偏態資料的典型水準。標準差與峰度分別描述離散程度與尾部厚薄，都不是集中趨勢。", "per_option": {"A": "正確：偏態且有離群值時，中位數較能代表典型水準。", "B": "平均數被團購大單拉高，高估一般顧客的花費。", "C": "標準差是離散程度，不是集中趨勢。", "D": "峰度描述尾部形狀，不能用來說明典型金額。"}, "guide_ref": "學習指引 p.3-8", "hot": false}, {"no": 3, "section": "3.2", "topic_id": "3.2-06", "topic": "維度簡化與 PCA", "style": "否定", "stem": "某資料團隊對 120 維的感測器資料使用主成分分析（PCA）降維，再把結果交給後續模型訓練。關於 PCA 的敘述，下列何者錯誤？", "options": {"A": "各主成分彼此正交，第二個主成分是在與第一個垂直的方向上，找剩餘變異最大者", "B": "主成分是原始特徵的線性組合，降維後得到的是重組出的新特徵而非挑選原本的欄位", "C": "可對協方差矩陣做特徵值分解，或對資料矩陣做奇異值分解（SVD）來求得主成分，這兩種做法是等價的", "D": "PCA 會挑出與目標標籤相關性最高的方向當主成分，因此降維後一定保留最多預測資訊"}, "answer": "D", "explanation": "答案 D。PCA 是非監督式方法，只依資料本身的變異結構找出變異最大且彼此正交的方向，完全不使用標籤，因此不保證保留與目標最相關的資訊。主成分是原特徵的線性組合，可由協方差矩陣特徵值分解或 SVD 求得。若要保留與標籤相關的方向，應考慮有監督的方法（如 LDA）或其他特徵選擇。", "per_option": {"A": "正確敘述：主成分之間互相正交。", "B": "正確敘述：PCA 是特徵重組，不是特徵選擇。", "C": "正確敘述：這是 PCA 的兩種常見實作方式。", "D": "錯誤：PCA 是非監督式方法，只看資料本身的變異，完全不使用標籤。"}, "guide_ref": "學習指引 p.3-12～3-16", "hot": false}, {"no": 4, "section": "3.2", "topic_id": "3.2-07", "topic": "最小平方估計", "style": "計算", "stem": "某團隊以最小平方估計（OLS）擬合簡單線性迴歸 ŷ ＝ θ₀ ＋ θ₁x，用廣告投放天數 x 預測新增會員數 y（單位：百人）。共 4 筆資料：(1, 3)、(2, 5)、(3, 6)、(4, 10)。擬合完成後，預測 x ＝ 5 時的 ŷ 約為多少？", "options": {"A": "10.0：直接沿用最後一筆資料的 y 值", "B": "11.5：由 θ₁＝2.2、θ₀＝0.5 的擬合直線算出", "C": "12.3：只用首尾兩點 (1, 3)、(4, 10) 連線外推", "D": "14.0：以最後兩點的斜率 4 往後外推一步"}, "answer": "B", "explanation": "答案 B。OLS 最小化殘差平方和。x̄＝2.5、ȳ＝6；斜率 θ₁＝Σ(x−x̄)(y−ȳ)÷Σ(x−x̄)²＝11÷5＝2.2；截距 θ₀＝6−2.2×2.5＝0.5。x＝5 時 ŷ＝0.5＋2.2×5＝11.5。", "per_option": {"A": "OLS 預測值來自擬合直線，不是直接沿用最後一筆觀測值。", "B": "正確：最小化殘差平方和後，直線為 ŷ＝0.5＋2.2x。", "C": "OLS 使用全部資料點，不是只連首尾兩點。", "D": "只看最後兩點會被單一波動牽著走，不是最小化整體平方誤差。"}, "guide_ref": "學習指引 p.3-16～3-17", "hot": false, "detail": {"steps": [["① 算 x 與 y 的平均", "x̄ ＝ Σx ÷ n；ȳ ＝ Σy ÷ n（n 是資料筆數）", "x̄ ＝ (1 ＋ 2 ＋ 3 ＋ 4) ÷ 4 ＝ 10 ÷ 4 ＝ 2.5；ȳ ＝ (3 ＋ 5 ＋ 6 ＋ 10) ÷ 4 ＝ 24 ÷ 4 ＝ 6"], ["② 算每筆資料離平均多遠（離差）", "x 的離差 ＝ x － x̄；y 的離差 ＝ y － ȳ", "x 的離差：1 － 2.5 ＝ −1.5、2 － 2.5 ＝ −0.5、3 － 2.5 ＝ 0.5、4 － 2.5 ＝ 1.5；y 的離差：3 － 6 ＝ −3、5 － 6 ＝ −1、6 － 6 ＝ 0、10 － 6 ＝ 4"], ["③ 算 Sxy 與 Sxx", "Sxy ＝ Σ(x 離差 × y 離差)；Sxx ＝ Σ(x 離差)²", "Sxy ＝ (−1.5)(−3) ＋ (−0.5)(−1) ＋ 0.5 × 0 ＋ 1.5 × 4 ＝ 4.5 ＋ 0.5 ＋ 0 ＋ 6 ＝ 11；Sxx ＝ 2.25 ＋ 0.25 ＋ 0.25 ＋ 2.25 ＝ 5"], ["④ 算斜率 θ₁ 與截距 θ₀", "θ₁ ＝ Sxy ÷ Sxx；θ₀ ＝ ȳ － θ₁ × x̄（直線一定通過平均點）", "θ₁ ＝ 11 ÷ 5 ＝ 2.2；θ₀ ＝ 6 － 2.2 × 2.5 ＝ 6 － 5.5 ＝ 0.5"], ["⑤ 預測 x ＝ 5", "ŷ ＝ θ₀ ＋ θ₁ × x", "＝ 0.5 ＋ 2.2 × 5 ＝ 0.5 ＋ 11 ＝ 11.5，選 B"], ["⑥ 對照其他選項（怎麼算錯的）", "每個選項都不是用全部資料擬合出來的", "A：直接沿用最後一筆 y ＝ 10，沒有擬合直線。C：只連首尾兩點，斜率 ＝ (10 － 3) ÷ (4 － 1) ≈ 2.333，ŷ ＝ 3 ＋ 2.333 × (5 － 1) ≈ 12.33。D：只看最後兩點，斜率 ＝ (10 － 6) ÷ (4 － 3) ＝ 4，ŷ ＝ 10 ＋ 4 × (5 － 4) ＝ 14"]], "tip": "OLS 直線必過 (x̄, ȳ)；斜率 ＝ Sxy ÷ Sxx。"}}, {"no": 5, "section": "3.3", "topic_id": "3.3-03", "topic": "損失函數選擇", "style": "情境", "stem": "某物流公司以迴歸模型預測包裹配送時間。資料中偶爾出現天災造成的極端延誤，工程師希望這些少數極端值不要主導訓練；同時又希望誤差接近 0 時損失曲線平滑、梯度隨誤差縮小而逐漸變小，以利訓練後期穩定收斂。下列哪一種損失函數最能同時滿足這兩項需求？", "options": {"A": "均方誤差（MSE）：對誤差平方，大誤差產生更大的懲罰與梯度", "B": "Huber 損失（Huber Loss）：小誤差用平方、大誤差轉為線性懲罰", "C": "平均絕對誤差（MAE）：對誤差取絕對值，梯度大小近似固定", "D": "二元交叉熵（Binary Cross-Entropy）：衡量預測機率與二元標籤之間的差距"}, "answer": "B", "explanation": "答案 B。需求有兩個：抗離群，以及誤差接近 0 時損失平滑、梯度漸小。MSE 平滑但平方放大極端誤差；MAE 抗離群，但梯度大小近似固定、在 0 處不可微；Huber 小誤差用平方（平滑、梯度隨誤差縮小）、大誤差轉線性（限制離群影響），剛好兩者兼顧。交叉熵是分類損失，不適用連續數值預測。", "per_option": {"A": "MSE 平滑，但平方會放大極端誤差，讓離群值主導訓練。", "B": "正確：小誤差區平滑，大誤差區限制離群影響。", "C": "MAE 抗離群，但梯度大小固定、在 0 處不平滑，接近收斂時仍易來回跳動。", "D": "這是二元分類的損失，不適用於連續數值預測。"}, "guide_ref": "學習指引 p.3-21～3-23", "hot": true}, {"no": 6, "section": "3.3", "topic_id": "3.3-04", "topic": "小批次梯度下降", "style": "計算", "stem": "某團隊以小批次梯度下降（Mini-batch Gradient Descent）訓練分類模型。訓練集共 10,050 筆資料，批次大小（batch size）為 128，最後一個不足 128 筆的批次不會被丟棄，仍會用來更新一次參數。若訓練 10 個 epoch，模型參數總共更新幾次？", "options": {"A": "10 次：把每個 epoch 當成只更新一次（等同全批次）", "B": "79 次：只算了一個 epoch 的更新次數，漏乘 epoch 數", "C": "780 次：每個 epoch 更新 78 次，捨去最後不足的批次", "D": "790 次：每個 epoch 更新 79 次，共 10 個 epoch"}, "answer": "D", "explanation": "答案 D。每個 epoch 的更新次數＝⌈10,050÷128⌉＝⌈78.52⌉＝79（78 個完整批次，加上 1 個 66 筆的批次）。10 個 epoch 共 79×10＝790 次。若捨去最後不足的批次則是 780 次，但題目明確說明最後一批仍會更新。", "per_option": {"A": "這是全批次梯度下降的更新次數，不是 batch size 128。", "B": "漏乘了 10 個 epoch。", "C": "題目明講最後一批仍會更新，不能捨去。", "D": "正確：⌈10,050÷128⌉＝79，79×10＝790。"}, "guide_ref": "學習指引 p.3-23～3-24", "hot": false, "detail": {"steps": [["① 算每個 epoch 要更新幾次", "每個 epoch 的更新次數 ＝ ⌈資料筆數 ÷ 批次大小⌉（⌈ ⌉ 是無條件進位，因為最後不足一批也要更新）", "10,050 ÷ 128 ≈ 78.52，進位得 79。拆開看：78 × 128 ＝ 9,984（78 個完整批次），剩 10,050 － 9,984 ＝ 66 筆再組成 1 個批次，共 78 ＋ 1 ＝ 79"], ["② 算總更新次數", "總更新次數 ＝ 每個 epoch 的更新次數 × epoch 數", "＝ 79 × 10 ＝ 790，選 D"], ["③ 對照其他選項", "每個選項都漏了一個條件", "A：10，把每個 epoch 當成只更新 1 次（1 × 10），那是全批次梯度下降。B：79 只算一個 epoch，漏乘 10。C：78 × 10 ＝ 780，捨去了最後 66 筆的批次，但題目說它仍要更新"]], "tip": "更新次數 ＝ ⌈筆數 ÷ batch size⌉ × epoch 數；最後不足一批要看題目有沒有丟棄。"}}, {"no": 7, "section": "3.3", "topic_id": "3.3-05", "topic": "動量與 Adam", "style": "否定", "stem": "某團隊在比較訓練深度神經網路的優化器（Optimizer）時，整理了下列敘述。何者錯誤？", "options": {"A": "RMSprop 與 Adagrad 都內建動量（Momentum）機制，所以不會有任何震盪問題", "B": "動量法（Momentum）累積過去梯度的方向，方向一致的維度越走越快，來回震盪的維度互相抵消，因而能減緩震盪", "C": "Adam 同時追蹤梯度的一階動量與梯度平方的二階動量，並為每個參數調整各自的更新步長", "D": "Adam 的自適應學習率讓梯度尺度差異很大的參數，也能得到比較合理的更新幅度"}, "answer": "A", "explanation": "答案 A。Momentum 與 Adam 才有動量機制；RMSprop 與 Adagrad 只做自適應學習率（用梯度平方的累積調整步長），沒有累積方向的動量。Adam＝動量（一階）＋RMSprop（二階）＋每個參數各自的學習率。因此說 RMSprop 與 Adagrad 都內建動量是錯的。", "per_option": {"A": "錯誤：兩者只做自適應學習率，沒有累積方向的動量。", "B": "正確敘述：這是動量法的核心。", "C": "正確敘述：Adam＝動量＋RMSprop。", "D": "正確敘述：每個參數有自己的有效學習率。"}, "guide_ref": "學習指引 p.3-24～3-26", "hot": true}, {"no": 8, "section": "3.3", "topic_id": "3.3-08", "topic": "梯度裁剪", "style": "計算", "stem": "某團隊訓練 RNN 時損失偶爾暴增，於是在 loss.backward() 之後、optimizer.step() 之前加入下列程式碼。假設某次反向傳播後，模型只有一個參數張量，其梯度向量為 [30.0, 40.0]（L2 範數為 50）。執行裁剪後，該梯度向量變成什麼？\n```\ntorch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=5.0)\n```", "options": {"A": "[0.6, 0.8]：縮成範數為 1 的單位向量", "B": "[5.0, 5.0]：每個元素各自截斷到最大值 5.0", "C": "[3.0, 4.0]：整個向量等比例縮小到範數 5", "D": "[30.0, 40.0]：裁剪只限制損失值，梯度不變"}, "answer": "C", "explanation": "答案 C。clip_grad_norm_ 依整體 L2 範數縮放：範數 50 超過 max_norm 5，縮放係數＝5÷50＝0.1，梯度變成 [3.0, 4.0]（範數剛好為 5），方向不變。逐元素截斷到 5 是「按值裁剪」，會改變方向；縮成單位向量的範數是 1，不是 5。裁剪的對象是梯度本身，不是損失值。", "per_option": {"A": "裁剪是縮到範數上限 5，不是縮成單位向量。", "B": "這是按值裁剪（clip_grad_value_）的結果；clip_grad_norm_ 是整體按比例縮放。", "C": "正確：縮放係數 5÷50＝0.1，方向不變。", "D": "梯度裁剪限制的是梯度，不是損失值。"}, "guide_ref": "學習指引 p.3-27", "hot": false, "detail": {"steps": [["① 算梯度的總範數（向量長度）", "‖g‖ ＝ √(各分量平方的總和)（L2 範數）", "＝ √(30² ＋ 40²) ＝ √(900 ＋ 1,600) ＝ √2,500 ＝ 50"], ["② 算縮放係數", "縮放係數 ＝ max_norm ÷ ‖g‖，只有在 ‖g‖ 大於 max_norm 時才會縮；沒超過就不動", "50 ＞ 5，要縮：係數 ＝ 5 ÷ 50 ＝ 0.1（PyTorch 分母實際再加一個極小的數避免除以零，結果仍約等於 0.1）"], ["③ 套用到梯度", "新梯度 ＝ 舊梯度 × 縮放係數（每個分量乘同一個係數，所以方向不變）", "＝ (30 × 0.1, 40 × 0.1) ＝ (3.0, 4.0)；檢查新範數 ＝ √(9 ＋ 16) ＝ √25 ＝ 5，剛好等於上限，選 C"], ["④ 對照其他選項", "各選項是把裁剪誤解成別的操作", "A：[0.6, 0.8] 是除以 50（30 ÷ 50、40 ÷ 50），縮成範數 1 的單位向量，但上限是 5 不是 1。B：[5.0, 5.0] 是逐元素截斷（clip_grad_value_），3:4 的比例變成 1:1，方向被改了。D：範數 50 超過上限 5，一定會被縮，裁剪處理的是梯度不是損失"]], "code": [["torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=5.0)", "clip＝裁剪、grad＝梯度、norm＝範數（向量長度），函式名稱字面意思就是「按範數裁剪梯度」；結尾的底線 _ 是 PyTorch 慣例，代表直接修改傳進去的東西（就地修改梯度）；它會回傳裁剪前的總範數（這題是 50），但裁剪後的梯度不是回傳值，而是直接改在參數的 .grad 上。model.parameters()＝取得模型所有參數，裁剪的是它們身上的梯度（梯度要在 loss.backward() 之後才存在）；max_norm=5.0＝梯度總範數的上限，超過就整串等比例縮到 5"]], "tip": "clip_grad_norm_：整串梯度等比例縮到上限，方向不變；逐元素截斷才會改變方向。"}}, {"no": 9, "section": "4.1", "topic_id": "4.1-03", "topic": "非監督式學習", "style": "情境", "stem": "某連鎖零售業者對 8 萬名會員的消費行為做 K-means 分群，手上完全沒有任何預先標註的類別或參考分群。團隊想比較 K＝3、4、5 三種分群結果哪一種群內較緊密、群間較分離，應優先使用下列哪一個評估指標？", "options": {"A": "準確率（Accuracy）：預測類別與真實標籤一致的比例", "B": "蘭德指數（Rand Index）：以分群結果與參考分群的配對一致程度來衡量，需要事先知道正確分群", "C": "輪廓係數（Silhouette Score）：只依資料本身衡量群內緊密與群間分離程度", "D": "曲線下面積（AUC）：衡量模型對正負樣本的排序區分能力"}, "answer": "C", "explanation": "答案 C。沒有任何參考標籤時，只能使用內部評估指標，依資料本身判斷群內緊密與群間分離程度；輪廓係數是典型代表，可用來比較不同的 K。Rand Index 需要參考分群（外部指標）；Accuracy、AUC 是監督式分類指標，需要真實標籤。", "per_option": {"A": "需要真實標籤，無標籤時無法計算。", "B": "屬外部指標，必須有參考分群或標籤。", "C": "正確：屬內部評估指標，不需標籤即可比較不同 K。", "D": "屬監督式二元分類指標，需要真實標籤。"}, "guide_ref": "學習指引 p.4-7～4-9", "hot": false}, {"no": 10, "section": "4.2", "topic_id": "4.2-11", "topic": "支援向量機 SVM", "style": "情境", "stem": "某團隊要區分兩類感測樣本，只有 2 個特徵、共約 3,000 筆。散佈圖顯示一類集中在中心，另一類呈環狀包圍在外圈，無法用任何一條直線分開。他們打算使用支援向量機（SVM）。下列哪一種做法最能解決這個問題？", "options": {"A": "線性核（Linear Kernel）：在原空間找最大間隔的直線，並把懲罰參數 C 調到極大以強迫分開", "B": "RBF 核（RBF Kernel）：以核函數映射到更高維空間，再找最大間隔超平面", "C": "硬間隔 SVM（Hard-margin SVM）搭配線性核：要求所有樣本都被一條直線正確分開，且間隔最大", "D": "RBF 核但將 γ 設為趨近 0：每個樣本的影響範圍極大，使邊界近似一條直線而無法分開環狀資料"}, "answer": "B", "explanation": "答案 B。環狀資料在原空間無法被直線分開。SVM 靠核函數（如 RBF）把資料隱含地映射到更高維特徵空間，在該空間找最大間隔超平面，對應回原空間就是非線性邊界。線性核即使把 C 調極大也無法分開；硬間隔要求資料完全可分，此資料做不到；γ 趨近 0 的 RBF 核邊界近似直線，同樣無效。", "per_option": {"A": "線性核只能畫直線，環狀資料不可能被直線分開。", "B": "正確：核函數讓資料在高維空間可線性分隔，對應回原空間是非線性邊界。", "C": "資料本身線性不可分，硬間隔條件無法成立。", "D": "γ 趨近 0 使邊界接近直線，同樣分不開環狀資料。"}, "guide_ref": "學習指引 p.4-28～4-30", "hot": false}, {"no": 11, "section": "4.2", "topic_id": "4.2-12", "topic": "K 最近鄰 KNN", "style": "情境", "stem": "某客服平台以 K 最近鄰（KNN）將新進客訴工單分類。模型「訓練」只花了幾秒，但上線後每筆新工單的預測都需要比對 200 萬筆歷史工單，回應時間偏高。下列哪一項最能說明此現象的原因？", "options": {"A": "反向傳播（Backpropagation）：KNN 訓練時需更新大量權重，使預測延遲不斷累積", "B": "K 值過小（Small K）：K 設得太小，使模型需要反覆迭代才能收斂", "C": "未做特徵標準化（No Feature Scaling）：使距離值在預測階段被重複計算多次", "D": "惰性學習（Lazy Learning）：訓練時幾乎只存資料，距離計算與投票都留到預測時才做"}, "answer": "D", "explanation": "答案 D。KNN 是非參數的惰性學習：不建立顯式模型，訓練階段只是把資料存起來，所有距離計算與投票都在預測時才進行，所以訓練快、預測慢，且資料越多越慢。它沒有權重與反向傳播；K 值與標準化會影響分類品質，但不是預測慢的原因。", "per_option": {"A": "KNN 沒有權重，也沒有反向傳播。", "B": "K 影響分類結果品質，不影響是否需要迭代收斂；KNN 本來就沒有迭代訓練。", "C": "未標準化會讓距離失真，但不是預測慢的原因。", "D": "正確：計算集中在預測階段，資料越多預測越慢。"}, "guide_ref": "學習指引 p.4-32～4-34", "hot": false}, {"no": 12, "section": "4.2", "topic_id": "4.2-15", "topic": "階層式分群", "style": "情境", "stem": "某生技團隊對 20 個基因表現樣本做凝聚式階層分群，並畫出樹狀圖（Dendrogram）。團隊事先並不知道該分幾群。他們在距離高度 1.5 處畫一條水平線，這條線與樹狀圖的 4 條垂直線相交。關於這個結果，下列何者正確？", "options": {"A": "在此高度切割會得到 4 個群集；若改在更低的高度切割，群數通常會增加", "B": "在此高度切割會得到 3 個群集，因為交點數要再減 1，這是階層式分群的標準算法", "C": "20 個樣本在此高度已全部合併成同一群，因為水平線切在最終合併點", "D": "必須在分群前先指定 K＝4，否則無法畫出樹狀圖"}, "answer": "A", "explanation": "答案 A。在樹狀圖某高度畫水平線，與線相交的垂直線數量就是群數，所以 4 條線代表 4 群。往下（更低）切會把已合併的群拆開，群數增加；往上切群數減少。階層式分群不必事先指定 K，建完樹狀圖再決定切割高度，這是它相對於 K-means 的優點。", "per_option": {"A": "正確：水平線與垂直線的交點數就是群數，切得越低群越多。", "B": "群數就是交點數，不需要減 1。", "C": "若全部合併為同一群，只會與 1 條垂直線相交。", "D": "階層式分群不需預先指定 K，建完樹狀圖後才決定切割高度。"}, "guide_ref": "學習指引 p.4-42～4-43", "hot": false}, {"no": 13, "section": "4.2", "topic_id": "4.2-17", "topic": "t-SNE/UMAP", "style": "情境", "stem": "某團隊要把 50 萬筆商品嵌入向量（768 維）降到 2 維做視覺化，希望同時看出群集內部的鄰近關係與群集之間的相對位置。資料在高維空間分佈於非線性流形，且降維所需的執行時間必須在可控範圍內。下列哪一種方法最適合？", "options": {"A": "主成分分析（PCA）：以線性投影保留變異最大的方向，速度快但難以展開非線性流形", "B": "UMAP（Uniform Manifold Approximation and Projection）：以模糊拓撲建立鄰近關係，通常比 t-SNE 快且兼顧局部與全局結構", "C": "t-SNE（t-distributed Stochastic Neighbor Embedding）：主要保留局部鄰域，計算成本高，群集間的距離與群集的大小都不具可靠意義，視覺上易誤判", "D": "線性判別分析（LDA）：以類別標籤最大化類間差異，需要有標籤的資料"}, "answer": "B", "explanation": "答案 B。資料在非線性流形上，PCA 的線性投影難以展開；LDA 需要標籤。50 萬筆規模下 t-SNE 計算成本高，且主要保留局部結構，群集間的距離不具可靠意義。UMAP 通常比 t-SNE 快，且較能兼顧局部與全局結構，最符合需求。（注意：UMAP 對全局結構的保留只是「通常優於 t-SNE」，並非保證，群集間距離仍應謹慎解讀。）", "per_option": {"A": "PCA 是線性降維，無法展開非線性流形。", "B": "正確：符合大資料量、非線性、兼顧全局的需求。", "C": "t-SNE 在 50 萬筆規模成本過高，且不保證呈現全局結構。", "D": "LDA 是有監督方法，此情境不需要也沒有標籤。"}, "guide_ref": "學習指引 p.4-44～4-47", "hot": false}, {"no": 14, "section": "4.2", "topic_id": "4.2-18", "topic": "Apriori", "style": "計算", "stem": "某超商分析 2,000 筆交易，其中 400 筆包含牛奶、1,800 筆包含麵包，同時包含牛奶與麵包的有 360 筆。針對關聯規則「牛奶 ⇒ 麵包」，下列敘述何者正確？", "options": {"A": "支持度為 0.9、信賴度為 0.18", "B": "信賴度 0.9 很高，因此牛奶與麵包之間存在強烈的正相關", "C": "提升度（Lift）為 0.9，屬於負相關", "D": "信賴度 0.9，但提升度為 1.0，兩者近似獨立，規則並無實質關聯"}, "answer": "D", "explanation": "答案 D。支持度＝360÷2,000＝0.18；信賴度＝360÷400＝0.9；P(麵包)＝1,800÷2,000＝0.9；提升度＝0.9÷0.9＝1.0，代表兩者獨立。信賴度很高只是因為幾乎每個人都會買麵包，並不代表牛奶帶動了麵包，必須看 Lift（大於 1 才是正相關）。", "per_option": {"A": "兩者顛倒了：支持度是 0.18、信賴度是 0.9。", "B": "麵包本來就有 90% 的交易包含，信賴度高不代表有關聯。", "C": "0.9 是信賴度，提升度要再除以 P(麵包)。", "D": "正確：Lift＝0.9÷0.9＝1.0。"}, "guide_ref": "學習指引 p.4-48～4-49", "hot": false, "detail": {"steps": [["① 算支持度（Support）", "支持度 ＝ 同時包含前項與後項的交易數 ÷ 總交易數", "＝ 360 ÷ 2,000 ＝ 0.18"], ["② 算信賴度（Confidence）", "信賴度 ＝ 同時包含前項與後項的交易數 ÷ 包含前項的交易數", "＝ 360 ÷ 400 ＝ 0.9"], ["③ 算後項（麵包）本來的比例", "P(後項) ＝ 包含後項的交易數 ÷ 總交易數", "＝ 1,800 ÷ 2,000 ＝ 0.9"], ["④ 算提升度（Lift）", "Lift ＝ 信賴度 ÷ P(後項)；大於 1 是正相關、等於 1 是獨立、小於 1 是負相關", "＝ 0.9 ÷ 0.9 ＝ 1.0，代表買牛奶並沒有讓買麵包的機率變高，兩者近似獨立，選 D"], ["⑤ 對照其他選項", "支持度、信賴度、提升度是三個不同的數字", "A：兩者顛倒了，支持度是 0.18、信賴度是 0.9。B：信賴度 0.9 很高，但麵包本來就有 0.9 的交易包含，基準線就這麼高，不能推出強相關。C：0.9 是信賴度，提升度還要再除以 P(麵包) 才是 1.0"]], "tip": "信賴度高不一定有關聯，要看 Lift（信賴度 ÷ 後項本來的比例）。"}}, {"no": 15, "section": "4.3", "topic_id": "4.3-02", "topic": "激活函數與輸出層", "style": "情境", "stem": "某團隊要辨識 XOR 型態的資料，建立了多層全連接網路，但所有隱藏層都使用線性激活函數 f(x)＝x。實驗發現不論把網路從 3 層加深到 10 層，準確率都停在與單層線性模型相近的水準。下列哪一項最能解釋原因並指出較適當的改法？", "options": {"A": "非線性激活（Non-linear Activation）：多層線性運算的組合仍等價於單一線性轉換，應在隱藏層改用 ReLU 等函數", "B": "加深網路（Deeper Network）：層數仍然不足，應繼續加深到 50 層以上，網路才會自行產生非線性", "C": "梯度裁剪（Gradient Clipping）：發生了梯度爆炸，應限制梯度範數避免更新過大", "D": "輸出層 Softmax（Softmax Output）：輸出層缺少 Softmax，補上後網路即可學到 XOR 型態的邊界，損失也會隨之收斂"}, "answer": "A", "explanation": "答案 A。線性激活函數的多層組合仍是一個線性轉換（W₃(W₂(W₁x))＝Wx），不論加到幾層都只能表達線性邊界，學不了 XOR 這類非線性關係。根本解法是引入非線性激活（如 ReLU）。繼續加深線性層無效；梯度裁剪針對梯度爆炸；輸出層的 Softmax 只負責轉成機率分佈。", "per_option": {"A": "正確：激活函數最根本的作用就是引入非線性。", "B": "線性層無論堆多深都仍是線性，加深沒有幫助。", "C": "梯度爆炸會使損失發散或出現 NaN，不會讓表現停在線性模型水準。", "D": "Softmax 只把輸出轉成機率，補不回隱藏層缺少的非線性。"}, "guide_ref": "學習指引 p.4-57～4-58", "hot": true}, {"no": 16, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "計算", "stem": "某影像分類 CNN 的第一個卷積層為 Conv2D（32 個 3×3 濾波器，輸入為 RGB 三通道），第二個卷積層為 Conv2D（64 個 3×3 濾波器），兩層皆使用偏置項（bias）。第二個卷積層的可訓練參數量為多少？", "options": {"A": "640：忽略輸入通道數，只算 64×(3×3＋1)", "B": "18,432：算了權重但漏掉偏置項", "C": "18,496：64×(3×3×32＋1)", "D": "36,928：誤把 64 當成輸入通道數"}, "answer": "C", "explanation": "答案 C。卷積層參數量＝輸出通道數×(卷積核高×寬×輸入通道數＋1)。第二層的輸入通道數是第一層的濾波器數 32，所以＝64×(3×3×32＋1)＝64×289＝18,496。漏掉偏置得 18,432；誤用 64 當輸入通道數得 36,928；忽略輸入通道數得 640。", "per_option": {"A": "每個濾波器要對所有輸入通道都有權重，輸入通道數不能忽略。", "B": "每個濾波器還有 1 個偏置，共 64 個。", "C": "正確：輸入通道數是上一層的 32，不是 3。", "D": "輸入通道數是上一層的輸出通道 32，不是本層的 64。"}, "guide_ref": "學習指引 p.4-67～4-71", "hot": true, "detail": {"steps": [["① 找出第二層的輸入通道數", "下一層的輸入通道數 ＝ 上一層的濾波器數（輸出通道數）", "第一層有 32 個濾波器 → 第二層的輸入通道是 32（RGB 的 3 只是第一層的輸入通道，與第二層無關）"], ["② 算第二層的參數量", "參數量 ＝ 濾波器數 ×（核高 × 核寬 × 輸入通道數 ＋ 1）（括號裡的 1 是每個濾波器的偏置）", "＝ 64 ×（3 × 3 × 32 ＋ 1）＝ 64 ×（288 ＋ 1）＝ 64 × 289 ＝ 18,496，選 C"], ["③ 對照其他選項（怎麼算錯的）", "每個選項改動了公式的某一塊", "A：忽略輸入通道數：64 ×（3 × 3 ＋ 1）＝ 64 × 10 ＝ 640。B：漏了偏置：64 × 288 ＝ 18,432。D：輸入通道誤用本層的 64：64 ×（3 × 3 × 64 ＋ 1）＝ 64 × 577 ＝ 36,928"]], "tip": "卷積層參數 ＝ 濾波器數 ×（核面積 × 輸入通道數 ＋ 1）；輸入通道看上一層。", "fig": {"type": "layers", "title": "兩個卷積層的通道數", "items": [{"name": "輸入 RGB", "shape": "3 通道"}, {"name": "Conv1 3×3，32 個", "shape": "32 通道", "note": "參數 (3×3×3＋1)×32 ＝ 896"}, {"name": "Conv2 3×3，64 個", "shape": "64 通道", "note": "輸入通道看上一層 32：(3×3×32＋1)×64 ＝ 18,496", "hl": true}], "note": "第二層的輸入通道＝第一層濾波器數 32，不是 RGB 的 3"}}}, {"no": 17, "section": "4.3", "topic_id": "4.3-12", "topic": "注意力機制", "style": "情境", "stem": "某團隊自行實作簡化版 Transformer 編碼器，僅有詞嵌入與自注意力層。測試時發現，把句子的詞序打亂後（例如「狗咬人」與「人咬狗」），模型對每個詞產生的表示向量只是隨之重新排列，無法反映兩句語意的差異。為解決此問題，最適當的做法是下列何者？", "options": {"A": "多頭注意力（Multi-head Attention）：把頭數加倍，讓模型自行從更多子空間學出詞序", "B": "位置編碼（Positional Encoding）：將位置向量加到詞嵌入上，注入順序資訊", "C": "移除值向量（Dropping V）：拿掉 V，只用 Q 與 K 計算注意力權重來決定輸出", "D": "前饋網路（Feed-forward Network）：加大隱藏層維度，增加每個位置的模型容量"}, "answer": "B", "explanation": "答案 B。自注意力以加權求和計算，本身不含順序資訊，輸入詞序重排只會讓輸出同樣重排，無法區分「狗咬人」與「人咬狗」。Transformer 沒有循環結構，需用位置編碼（常見為正弦、餘弦函數）加到詞嵌入上，注入順序資訊。增加頭數、改變 V 或加大前饋層都不會提供位置資訊。", "per_option": {"A": "增加頭數只增加關聯的種類，輸入中仍沒有任何順序資訊。", "B": "正確：自注意力本身不含順序資訊，需額外注入位置。", "C": "移除 V 會讓注意力無法輸出內容，也不會增加順序資訊。", "D": "前饋網路逐位置獨立運算，加大容量不會產生詞序資訊。"}, "guide_ref": "學習指引 p.4-80～4-81", "hot": true}, {"no": 18, "section": "4.3", "topic_id": "4.3-14", "topic": "遷移學習", "style": "情境", "stem": "某團隊用預訓練 ResNet18 做 5 類醫學影像分類，訓練資料僅 800 張。程式如下：\n```\nimport torch, torch.nn as nn, torchvision\nmodel = torchvision.models.resnet18(weights='DEFAULT')\nfor p in model.parameters():\n    p.requires_grad = False\nmodel.fc = nn.Linear(512, 5)\nopt = torch.optim.Adam(model.parameters(), lr=1e-3)\n```\n之後訓練迴圈（前向傳播、loss.backward()、opt.step()）正常執行。下列敘述何者正確？", "options": {"A": "所有層的權重都會被更新，因為優化器接收了 model.parameters() 的全部參數", "B": "全部權重都不會更新，因為 requires_grad＝False 已經凍結整個模型", "C": "只有預訓練的卷積層會更新，新接上的 fc 層因為隨機初始化而被排除", "D": "只有新建立的 fc 層會被更新；預訓練層的參數沒有梯度，權重保持不變"}, "answer": "D", "explanation": "答案 D。迴圈先把所有預訓練參數的 requires_grad 設為 False，之後新建的 nn.Linear 預設 requires_grad＝True，所以只有 fc 的權重與偏置會得到梯度並被更新。優化器雖然收到全部參數，但被凍結的參數沒有梯度，Adam 會略過它們。這就是只訓練最後一層的特徵萃取式遷移學習，適合 800 張的小資料集。（補充：BatchNorm 的 running mean／variance 是緩衝區而非可訓練參數，在 train() 模式下仍會更新，但這不影響本題所問的權重更新。）", "per_option": {"A": "凍結的參數沒有梯度，優化器會略過它們。", "B": "凍結發生在換上 fc 層之前，新建的 fc 預設可訓練。", "C": "剛好相反：新 fc 層可訓練，預訓練層被凍結。", "D": "正確：這就是特徵萃取式的遷移學習。"}, "guide_ref": "學習指引 p.4-82", "hot": true, "detail": {"steps": [["① 哪些參數會被更新（判斷法）", "參數要被更新，必須同時：requires_grad 為 True（有梯度）＋ 被交給優化器。凍結的參數 requires_grad 為 False，反向傳播不產生梯度，優化器略過它", "預訓練的所有層：被迴圈設成 False（凍結），不更新。model.fc：是之後才新建的，nn.Linear 預設 requires_grad 為 True，要更新。所以只有 fc 的權重（512 × 5 個）與偏差（5 個）會訓練，選 D"]], "code": [["import torch, torch.nn as nn, torchvision", "匯入三個套件：torch＝PyTorch 本體；torch.nn（簡寫 nn）＝神經網路的各種層；torchvision＝影像相關的資料與預訓練模型"], ["model = torchvision.models.resnet18(weights='DEFAULT')", "載入 ResNet18（一種 18 層的影像分類網路）。weights='DEFAULT'＝使用預設的預訓練權重（已經在大型影像資料集學好的參數），這就是遷移學習的起點"], ["for p in model.parameters():", "model.parameters()＝取出模型所有可學習參數；for 迴圈逐一處理，p 代表其中一個參數"], ["p.requires_grad = False", "requires_grad＝是否需要梯度；設成 False＝凍結，反向傳播時不會為它算梯度，所以不會被更新"], ["model.fc = nn.Linear(512, 5)", "fc＝fully connected 的縮寫，是 ResNet 最後輸出分類的那一層。把它換成新的 nn.Linear(512, 5)（全連接層，512 個輸入、5 個輸出，對應 5 個類別）。新建的層是在凍結之後才產生，requires_grad 預設為 True，所以可訓練，而且是隨機初始化"], ["opt = torch.optim.Adam(model.parameters(), lr=1e-3)", "建立 Adam 優化器（負責更新權重）。model.parameters()＝把全部參數都交給它，但沒梯度的（被凍結的，.grad 是 None）會被略過；lr＝學習率，1e-3 ＝ 0.001"]], "tip": "遷移學習只訓練最後一層：先把預訓練層 requires_grad 設 False，再換上新的輸出層。"}}, {"no": 19, "section": "4.3", "topic_id": "4.3-15", "topic": "自編碼器", "style": "情境", "stem": "某半導體廠只有大量「正常」晶圓影像，幾乎沒有瑕疵樣本。團隊以正常影像訓練自編碼器（Autoencoder），其瓶頸層維度遠小於輸入維度。上線後要判定一張新晶圓影像是否異常，最合適的作法是下列何者？", "options": {"A": "重構誤差（Reconstruction Error）：比較輸入與還原結果，誤差超過正常驗證資料決定的門檻就判為異常", "B": "Softmax 機率（Softmax Probability）：取編碼器的潛在向量，計算它屬於「瑕疵」類別的機率", "C": "判別器分數（Discriminator Score）：讓判別器網路對新影像輸出真／假分數，分數低者判為異常", "D": "訓練損失曲線（Training Loss Curve）：觀察訓練階段的損失曲線，持續下降就代表新晶圓為正常"}, "answer": "A", "explanation": "答案 A。自編碼器只看過正常資料，能把正常影像還原得很好、重構誤差小；異常影像不符合它學到的結構，重構誤差會變大。實務上用正常驗證資料的誤差分佈（例如取某個高百分位）設定門檻。它是非監督模型，沒有「瑕疵類別」輸出；判別器屬於 GAN；訓練損失曲線不能判斷單張新影像。", "per_option": {"A": "正確：只熟悉正常資料的模型，還原異常資料時誤差會變大。", "B": "沒有瑕疵標籤，自編碼器也沒有瑕疵類別的輸出。", "C": "判別器屬於 GAN 架構，不是自編碼器的組成。", "D": "訓練損失曲線反映整體訓練狀況，無法對單張新影像做判斷。"}, "guide_ref": "學習指引 p.4-85～4-87", "hot": false}, {"no": 20, "section": "4.3", "topic_id": "4.3-16", "topic": "生成對抗網路 GAN", "style": "情境", "stem": "某團隊用生成對抗網路（GAN）生成手寫數字 0～9。訓練後期生成器產出的影像看起來非常逼真，判別器也很難分辨真假，但團隊發現生成的數字幾乎全是 1 和 7，其他數字很少出現。此現象最可能稱為什麼？", "options": {"A": "過擬合（Overfitting）：模型記住訓練資料的雜訊，在新資料上泛化能力下降", "B": "梯度消失（Gradient Vanishing）：反向傳播時梯度逐層縮小，使前面的層難以學習", "C": "模式崩潰（Mode Collapse）：生成器只產出少數幾種能騙過判別器的樣本，缺乏多樣性", "D": "欠擬合（Underfitting）：模型太簡單，無法擬合訓練資料的基本趨勢"}, "answer": "C", "explanation": "答案 C。生成器只產出少數幾種能騙過判別器的樣本，多樣性嚴重不足，稱為模式崩潰，是 GAN 的典型缺點之一。過擬合是對訓練資料的記憶，會表現為新資料泛化變差；梯度消失是訓練信號太弱；欠擬合是模型過於簡單。此處影像逼真但類別單一，符合模式崩潰。", "per_option": {"A": "過擬合描述的是訓練與驗證表現落差，不是生成樣本種類過少。", "B": "梯度消失是訓練信號過弱，與生成樣本缺乏多樣性無關。", "C": "正確：樣本逼真但種類極少，是 GAN 的典型問題。", "D": "影像已非常逼真，並非擬合能力不足。"}, "guide_ref": "學習指引 p.4-87～4-89", "hot": false}, {"no": 21, "section": "4.3", "topic_id": "4.3-17", "topic": "TensorFlow 與 Keras", "style": "否定", "stem": "某團隊正在比較深度學習框架，並整理了下列說明。何者錯誤？", "options": {"A": "TensorFlow 由 Google 開發，早期採靜態計算圖，TensorFlow 2.x 起改為預設即時執行（Eager Execution）", "B": "PyTorch 是 Google 開發的框架，與 TensorFlow 同屬 Google 的生態系", "C": "Keras 是使用者友善的高階神經網路 API，自 TensorFlow 2.0 起成為其官方高階 API（tf.keras）", "D": "TensorFlow Lite 可將模型部署到行動與嵌入式裝置，TensorFlow Serving 則用於提供線上模型服務"}, "answer": "B", "explanation": "答案 B。PyTorch 是由 Facebook AI Research（FAIR，今 Meta）開發，不是 Google。TensorFlow 由 Google 在 2015 年發布，早期用靜態計算圖，2.x 起預設即時執行；Keras 自 TF 2.0 起為官方高階 API；TensorFlow Lite 用於行動與嵌入式裝置，TensorFlow Serving 提供線上模型服務。", "per_option": {"A": "正確敘述。", "B": "錯誤：PyTorch 由 Facebook AI Research（FAIR，今 Meta）開發。", "C": "正確敘述。", "D": "正確敘述。"}, "guide_ref": "學習指引 p.4-89～4-91", "hot": false}, {"no": 22, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "情境", "stem": "某工廠以感測器資料訓練異常預測模型。其中約 2% 的讀數因設備故障而出現極端尖峰（為一般數值的數百倍）。資料科學家需要對特徵做縮放，並希望縮放時所用的統計量本身不會被這些尖峰拉動，以免正常讀數被擠壓進極小的區間。下列哪一種縮放方式最適當？", "options": {"A": "Min-Max 縮放（Min-Max Scaling）：以最小值與最大值將資料壓到 0～1", "B": "標準化（Z-score Standardization）：以平均數與標準差縮放", "C": "最大絕對值縮放（Max-Abs Scaling）：除以資料的最大絕對值", "D": "穩健縮放（Robust Scaling）：以中位數與四分位距（IQR）縮放"}, "answer": "D", "explanation": "答案 D。需求是縮放所用的統計量不被尖峰牽動。Min-Max 用最大／最小值、Max-Abs 用最大絕對值，尖峰會主導縮放比例，正常讀數被擠進很窄的區間；Z-score 的平均數與標準差也會被尖峰拉動。Robust Scaling 使用中位數與 IQR，對極端值具有高度抵抗性，最適合此情境。", "per_option": {"A": "尖峰會成為最大值，正常讀數被擠進極小區間。", "B": "平均數與標準差都會被尖峰拉動，標準差被明顯撐大。", "C": "最大絕對值同樣由尖峰決定，正常讀數被壓縮。", "D": "正確：中位數與 IQR 對極端值有高度抵抗性。"}, "guide_ref": "學習指引 p.5-6～5-8", "hot": true}, {"no": 23, "section": "5.1", "topic_id": "5.1-02", "topic": "PCA 與降維", "style": "情境", "stem": "某工程師想用 PCA 去除影像資料中的雜訊：先降維、再還原回原本維度，期望捨棄變異小的成分。他的程式如下，但還原後的資料與原資料幾乎完全相同，沒有達到去雜訊的效果。\n```\nfrom sklearn.decomposition import PCA\npca = PCA()\nZ = pca.fit_transform(X)\nX_back = pca.inverse_transform(Z)\n```\n最可能的原因是什麼？", "options": {"A": "X 沒有先標準化，使 PCA 自動保留了所有主成分", "B": "還原時應改用 transform 而非 inverse_transform，否則會得到原資料，降噪也就沒有作用", "C": "建立 PCA 時沒有指定 n_components，預設保留全部主成分，還原後等於沒有捨棄任何成分", "D": "沒有把標籤 y 傳入 fit_transform，PCA 因而無法辨識雜訊"}, "answer": "C", "explanation": "答案 C。PCA() 沒有指定 n_components，預設保留全部主成分；用全部成分還原會得到與原資料幾乎相同的結果，等於沒有捨棄變異小（多半是雜訊）的成分。要去雜訊應設定 PCA(n_components=0.95) 或固定個數，再 inverse_transform。PCA 是非監督，不需要 y；inverse_transform 才是還原函式。", "per_option": {"A": "是否標準化不會改變預設保留的主成分數量。", "B": "inverse_transform 才是從主成分空間還原的正確函式。", "C": "正確：保留全部成分就不會有降噪效果。", "D": "PCA 是非監督方法，不需要標籤。"}, "guide_ref": "學習指引 p.5-6、3-13～3-15", "hot": true, "detail": {"steps": [["① 保留成分的比例決定「去掉多少」", "保留的變異比例 ＝ 保留的主成分變異數加總 ÷ 全部主成分變異數加總；保留越少，被捨棄的細節（多半是雜訊）越多", "舉例（題目沒給數字）：4 個主成分的變異數為 5、3、1、1，加總 10。全部保留：10 ÷ 10 ＝ 100%，還原後幾乎等於原資料，沒有去噪。只保留前 2 個：(5 ＋ 3) ÷ 10 ＝ 80%，捨掉的 20% 才是被去除的部分"], ["② 為什麼這段程式沒去噪", "PCA() 不指定 n_components → 預設保留全部成分", "全部保留就是 100% 還原，等於沒有捨棄任何成分，選 C。要去噪應寫 PCA(n_components=0.95)（保留 95% 變異）或指定固定個數"]], "code": [["from sklearn.decomposition import PCA", "從 sklearn 的 decomposition（分解）模組匯入 PCA（主成分分析，用來降維）"], ["pca = PCA()", "建立 PCA 工具。括號裡沒有指定 n_components（要保留的主成分數量），預設會保留全部成分，這就是問題所在"], ["Z = pca.fit_transform(X)", "fit＝學習（從 X 算出主成分方向）；transform＝轉換（把 X 投影到主成分上，得到座標 Z）；fit_transform 是兩步一次做完。因為沒有降維（影像資料通常樣本數遠多於特徵數），Z 的欄數會跟 X 一樣多"], ["X_back = pca.inverse_transform(Z)", "inverse_transform＝反向轉換：把主成分座標 Z 轉回原本的特徵空間。因為所有成分都保留，轉回來的 X_back 幾乎等於 X"]], "tip": "PCA 去雜訊：要指定 n_components（或變異比例）捨棄小成分，再 inverse_transform。"}}, {"no": 24, "section": "5.1", "topic_id": "5.1-03", "topic": "特徵工程策略", "style": "情境", "stem": "某電力公司要預測每天的用電量，工程師想新增一個代表「近期用電水準」的移動平均特徵，並要求模型上線預測時，不會用到尚未發生的資料。下列哪一種計算方式最適當？", "options": {"A": "向後視窗（Trailing Window）：依時間排序，每個預測日只取其之前 7 天的用電量求平均", "B": "置中視窗（Centered Window）：以預測日為中心取前後各 3 天求平均，讓曲線更平滑、更貼近當天", "C": "全域平均（Global Mean）：先用整份資料（含預測日之後）算出平均用電量，當作每一天的特徵", "D": "隨機抽樣平均（Random Sampling Mean）：每個預測日隨機抽 7 天的用電量求平均，增加特徵多樣性"}, "answer": "A", "explanation": "答案 A。時間序列特徵必須只使用預測時刻之前已經發生的資料。置中移動平均會用到預測日之後的資料，屬於未來資訊洩漏；全域平均含未來資料；隨機抽樣則破壞時間結構。正確做法是依時間排序，對每個預測日只取其前 7 天計算滾動平均（rolling mean）。", "per_option": {"A": "正確：只用預測時刻之前已知的資料。", "B": "置中視窗包含預測日之後的資料，等於偷看未來。", "C": "全域平均含未來資料，而且每天都一樣，沒有時間資訊。", "D": "隨機抽樣破壞時間順序，失去「近期」的意義。"}, "guide_ref": "學習指引 p.5-9～5-10", "hot": true}, {"no": 25, "section": "5.1", "topic_id": "5.1-04", "topic": "類別特徵編碼", "style": "情境", "stem": "某服飾電商的「尺寸」欄位有 S、M、L、XL 四種，確實具有 S＜M＜L＜XL 的大小順序。工程師希望編碼後保留這個順序資訊，且不增加欄位數量。下列哪一種作法最適當？", "options": {"A": "標籤編碼（Label Encoding）：用 LabelEncoder 直接編碼，依字母排序得到 L＝0、M＝1、S＝2、XL＝3", "B": "序數編碼（Ordinal Encoding）：用 OrdinalEncoder 明確指定 [['S','M','L','XL']]，編碼為 0、1、2、3", "C": "獨熱編碼（One-hot Encoding）：編成四個 0／1 欄位，期待模型自行從欄位中學出大小順序", "D": "目標編碼（Target Encoding）：以各尺寸對應的平均銷量取代類別，編碼值由目標統計量決定"}, "answer": "B", "explanation": "答案 B。LabelEncoder 依字母順序編碼（L、M、S、XL → 0、1、2、3），S 會被編得比 M 大，順序是錯的。OrdinalEncoder 可用 categories 參數明確指定 S＜M＜L＜XL，編碼成 0～3，保留順序且不增加欄位。One-hot 會增加欄位且不帶順序；Target Encoding 取決於目標統計量，不保證符合尺寸順序。", "per_option": {"A": "字母順序不等於大小順序，S 會被編得比 M 大。", "B": "正確：明確指定順序，保留大小資訊且不增加欄位。", "C": "One-hot 不帶順序資訊，而且增加欄位數。", "D": "編碼值取決於目標統計量，不保證符合尺寸大小順序，且須防資料洩漏。"}, "guide_ref": "學習指引 p.5-7～5-8", "hot": false}, {"no": 26, "section": "5.1", "topic_id": "5.1-09", "topic": "程式碼閱讀：前處理", "style": "計算", "stem": "閱讀下列程式，最後印出的數值最接近下列何者？\n```\nimport pandas as pd\nfrom sklearn.preprocessing import StandardScaler\ntrain = pd.DataFrame({'x': [2, 4, 6, 8]})\ntest = pd.DataFrame({'x': [10]})\nsc = StandardScaler().fit(train)\nprint(round(float(sc.transform(test)[0][0]), 2))\n```", "options": {"A": "0.00：以測試集自己的平均與標準差進行轉換的結果", "B": "1.94：以樣本標準差（ddof＝1，約 2.58）計算的結果", "C": "5.00：只減去訓練集平均數，沒有再除以標準差的結果", "D": "2.24：(10−5)÷√5，平均數 5 與標準差 √5 都來自訓練集"}, "answer": "D", "explanation": "答案 D。StandardScaler 只用訓練集計算：平均＝5、母體標準差＝√5≈2.236（sklearn 使用 ddof＝0）。測試值 10 轉換為 (10−5)÷2.236≈2.24。若誤把測試集也拿來 fit，單筆資料會得到 0；用樣本標準差（ddof＝1，約 2.582）會得 1.94；只減平均而沒除以標準差則是 5.00。", "per_option": {"A": "程式只用 train 做 fit，沒有用測試集自己的統計量。", "B": "StandardScaler 使用母體標準差（ddof＝0），不是樣本標準差。", "C": "標準化還要除以標準差。", "D": "正確：訓練集平均 5、母體標準差 √5≈2.236。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 算訓練集的平均數 μ", "μ ＝ Σx ÷ n", "＝ (2 ＋ 4 ＋ 6 ＋ 8) ÷ 4 ＝ 20 ÷ 4 ＝ 5"], ["② 算訓練集的標準差 σ（sklearn 用母體標準差，分母是 n）", "σ ＝ √(Σ(x － μ)² ÷ n)", "Σ(x － μ)² ＝ (2 － 5)² ＋ (4 － 5)² ＋ (6 － 5)² ＋ (8 － 5)² ＝ 9 ＋ 1 ＋ 1 ＋ 9 ＝ 20；σ ＝ √(20 ÷ 4) ＝ √5 ≈ 2.236"], ["③ 把測試值標準化", "z ＝ (x － μ) ÷ σ（μ、σ 都用訓練集的）", "＝ (10 － 5) ÷ 2.236 ＝ 5 ÷ 2.236 ≈ 2.236，round 到兩位小數是 2.24，選 D"], ["④ 對照其他選項（怎麼算錯的）", "每個選項都是在公式的某個地方換了東西", "A：用測試集自己 fit，單筆資料平均 ＝ 10、標準差 ＝ 0，sklearn 遇到標準差 0 會把分母當成 1，得到 (10 － 10) ÷ 1 ＝ 0。B：用樣本標準差（分母 n－1）：√(20 ÷ 3) ≈ 2.582，5 ÷ 2.582 ≈ 1.94，但 StandardScaler 用的是分母 n。C：只減平均沒除標準差：10 － 5 ＝ 5.00"]], "code": [["import pandas as pd", "匯入 pandas（處理表格資料的套件），並簡稱 pd"], ["from sklearn.preprocessing import StandardScaler", "從 sklearn 的 preprocessing（前處理）模組匯入 StandardScaler（標準化器：把資料變成平均 0、標準差 1）"], ["train = pd.DataFrame({'x': [2, 4, 6, 8]})", "DataFrame＝表格。建立訓練資料，只有一欄叫 x，四筆資料 2、4、6、8"], ["test = pd.DataFrame({'x': [10]})", "建立測試資料：同樣一欄 x，只有一筆，值為 10"], ["sc = StandardScaler().fit(train)", "建立標準化器，並用 fit（學習）只看訓練資料 train，記下它的平均數（5）與標準差（√5）。測試資料不參與，才不會資料洩漏"], ["print(round(float(sc.transform(test)[0][0]), 2))", "由內往外看：sc.transform(test)＝套用剛才學到的平均數與標準差，把測試資料轉換（回傳二維陣列）；[0][0]＝取第 1 列第 1 欄的那個數；float＝轉成一般小數；round(…, 2)＝四捨五入到小數第 2 位；print＝印出結果"]], "tip": "標準化：平均數與標準差只從訓練集學（fit），測試集只套用（transform）。"}}, {"no": 27, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "情境", "stem": "某房仲平台以梯度提升樹預測房價。模型上線前，法遵人員想了解：在其他特徵維持原本分佈下，「屋齡」從 0 年增加到 40 年時，整體而言預測房價平均會如何變化，用來檢查模型是否符合常理（例如屋齡越大不應使房價越高）。下列哪一種工具最能回答此問題？", "options": {"A": "SHAP 單筆解釋（Local Explanation）：說明某一筆預測中各特徵的貢獻", "B": "整體特徵重要性（Global Feature Importance）：排序各特徵對模型整體的貢獻大小", "C": "偏依圖（Partial Dependence Plot, PDP）：呈現某特徵在不同取值下，模型預測的平均變化趨勢", "D": "LIME（Local Interpretable Model-agnostic Explanations）：在單筆樣本附近以簡單模型近似局部決策"}, "answer": "C", "explanation": "答案 C。法遵人員想看的是「單一特徵在不同取值下，預測的平均變化趨勢」，這正是偏依圖（PDP）的用途，可檢查方向是否合理。整體特徵重要性只告訴你重要與否，不顯示方向與形狀；SHAP（單筆解釋）與 LIME 用來解釋單一筆預測的原因。", "per_option": {"A": "SHAP 單筆解釋回答的是某一筆預測的原因，不是整體平均趨勢（本選項指的是單筆解釋，而非整體彙總圖）。", "B": "只能說屋齡重不重要，看不出變化方向與形狀。", "C": "正確：可檢查屋齡與預測房價的整體關係是否合理。", "D": "LIME 是局部解釋，不提供整體平均趨勢。"}, "guide_ref": "學習指引 p.5-14～5-15", "hot": true}, {"no": 28, "section": "5.2", "topic_id": "5.2-02", "topic": "偏差與變異", "style": "情境", "stem": "某銀行用單棵完全生長的決策樹預測違約。團隊發現，每次從歷史資料重新抽樣訓練，產生的樹結構與預測結果差異很大，驗證表現也不穩定，但訓練集上的誤差幾乎為零。團隊改用隨機森林（Random Forest）。從偏差與變異（Bias-Variance）的角度，這項改變最主要改善的是什麼？", "options": {"A": "降低變異（Variance Reduction）：平均多棵以不同樣本與特徵訓練的樹，預測較不受資料擾動影響", "B": "降低偏差（Bias Reduction）：讓每棵樹比單棵樹更深、更複雜，使擬合能力更強", "C": "速度取捨（Speed Trade-off）：同時提高偏差與變異，以換取較快的訓練速度", "D": "特徵重要性（Feature Importance）：偏差與變異都不變，只是讓模型能輸出各特徵的重要程度，方便解釋模型"}, "answer": "A", "explanation": "答案 A。單棵深樹訓練誤差幾乎為零、對訓練資料擾動很敏感，是高變異。隨機森林以 bootstrap 抽樣與隨機選特徵訓練多棵樹，再平均預測，使結果對資料擾動較不敏感，主要降低變異。它並不是讓單棵樹更複雜，特徵重要性也只是附帶功能。", "per_option": {"A": "正確：單棵深樹是高變異，平均多棵樹可降低變異。", "B": "單棵樹本來就已完全生長，問題在變異而非偏差。", "C": "隨機森林並非為了用偏差與變異換速度。", "D": "特徵重要性只是附帶功能，不是改用隨機森林的主要效益。"}, "guide_ref": "學習指引 p.5-16", "hot": false}, {"no": 29, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "計算", "stem": "某團隊用 GridSearchCV 調整 SVM：C 取 4 個候選值、gamma 取 3 個候選值、kernel 取 2 種，並設定 cv＝5。不含最後以最佳參數在整個訓練集重新訓練的那一次，搜尋過程中模型總共要訓練幾次？", "options": {"A": "24 次：只算超參數組合數，沒有乘上折數", "B": "120 次：(4×3×2) 組超參數 × 5 折", "C": "45 次：把候選數相加 (4＋3＋2) 後再乘折數", "D": "600 次：折數被重複乘了兩次"}, "answer": "B", "explanation": "答案 B。網格搜尋是全組合：4×3×2＝24 組超參數，每組做 5 折交叉驗證要訓練 5 次，共 24×5＝120 次。只算組合數是 24；把候選數相加（4＋3＋2＝9）再乘折數得 45，是常見錯誤——網格搜尋是連乘而不是相加。", "per_option": {"A": "每組超參數還要做 5 折，各訓練一次。", "B": "正確：網格搜尋是連乘，再乘折數。", "C": "網格搜尋是全組合，候選數要連乘而不是相加。", "D": "5 折只乘一次。"}, "guide_ref": "學習指引 p.5-17～5-18（網格搜尋次數為延伸計算，指引未載）", "hot": true, "detail": {"steps": [["① 算超參數組合數", "網格搜尋是全組合：組合數 ＝ 各超參數候選數連乘（不是相加）", "＝ 4 × 3 × 2 ＝ 24 組"], ["② 算總訓練次數", "總訓練次數 ＝ 組合數 × 交叉驗證折數（每組每折各訓練一次）", "＝ 24 × 5 ＝ 120 次，選 B"], ["③ 對照其他選項（怎麼算錯的）", "每個選項的錯法都不同", "A：24 只算組合數，漏乘折數。C：把候選數相加 4 ＋ 3 ＋ 2 ＝ 9，再 9 × 5 ＝ 45，網格搜尋是連乘。D：120 × 5 ＝ 600，折數乘了兩次"]], "tip": "GridSearchCV 次數 ＝ 各候選數連乘 × cv 折數。", "fig": {"type": "folds", "title": "每組都要做 5 折", "k": 5, "note": "4×3×2 ＝ 24 組 × 5 折 ＝ 120 次訓練（不含最後 refit）"}}}, {"no": 30, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "情境", "stem": "某支付平台的詐欺偵測模型，以預測機率 ≥ 0.5 判定為詐欺交易。營運主管希望抓到更多實際的詐欺交易，要求把判定門檻調降到 0.3，其他條件不變。一般而言，調降門檻後最可能出現下列哪一種變化？", "options": {"A": "召回率（Recall）與精確率（Precision）同時上升", "B": "召回率下降、精確率上升，因為被判為詐欺的交易變少", "C": "召回率上升、精確率通常下降，因為更多正常交易被誤判為詐欺", "D": "兩者都不變，因為門檻不會影響混淆矩陣"}, "answer": "C", "explanation": "答案 C。門檻降低代表更容易判為詐欺：真正的詐欺被抓到的更多（召回率上升），但同時有更多正常交易被誤判（假陽性增加），精確率通常下降。召回率與精確率之間有取捨關係。門檻直接決定每筆預測的類別，必然影響混淆矩陣。", "per_option": {"A": "兩者之間有取捨，通常無法同時上升。", "B": "門檻降低，被判為詐欺的交易只會變多。", "C": "正確：抓到更多詐欺，同時誤報也增加。", "D": "門檻直接決定每筆預測的類別，一定會改變混淆矩陣。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true}, {"no": 31, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "計算", "stem": "某疾病篩檢模型在測試集上的混淆矩陣為：TP＝100、FN＝40、FP＝60、TN＝540。若醫院關心「沒有生病的人被誤判為陽性的比例」，也就是假陽性率（False Positive Rate, FPR），其值為多少？", "options": {"A": "約 8.1%：以 FP 除以全部 740 筆", "B": "約 28.6%：FN÷(FN＋TP)", "C": "37.5%：FP÷(FP＋TP)", "D": "10.0%：FP÷(FP＋TN)"}, "answer": "D", "explanation": "答案 D。FPR＝FP÷(FP＋TN)＝60÷(60＋540)＝10%（等於 1−特異度 90%）。60÷740≈8.1% 是把分母誤用為全部樣本；28.6% 是 FN÷(FN＋TP)（漏報率）；37.5% 是 FP÷(FP＋TP)（即 1−精確率），都不是 FPR。", "per_option": {"A": "FPR 的分母是實際為負類的人數 (FP＋TN)，不是全部樣本。", "B": "這是漏報率（1−召回率），不是 FPR。", "C": "這是誤報比例（1−精確率），不是 FPR。", "D": "正確：60÷600＝10%，等於 1−特異度（90%）。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true, "detail": {"steps": [["① 找出實際沒生病的人數", "實際為負類的人數 ＝ FP ＋ TN（假陽性是從「沒生病」的人裡誤判出來的）", "＝ 60 ＋ 540 ＝ 600"], ["② 算假陽性率（FPR）", "FPR ＝ FP ÷ (FP ＋ TN)", "＝ 60 ÷ 600 ＝ 0.10 ＝ 10%，選 D"], ["③ 用特異度驗算", "特異度 ＝ TN ÷ (TN ＋ FP)；FPR ＝ 1 － 特異度", "特異度 ＝ 540 ÷ 600 ＝ 0.9；FPR ＝ 1 － 0.9 ＝ 0.1，一致"], ["④ 對照其他選項（各自算的是哪個指標）", "分母不同，指標就不同", "A：總樣本 ＝ 100 ＋ 40 ＋ 60 ＋ 540 ＝ 740；60 ÷ 740 ≈ 0.081，分母誤用全部樣本。B：FN ÷ (FN ＋ TP) ＝ 40 ÷ 140 ≈ 0.286，是漏報率（1 － 召回率，召回率 ＝ 100 ÷ 140 ≈ 0.714）。C：FP ÷ (FP ＋ TP) ＝ 60 ÷ 160 ＝ 0.375，是 1 － 精確率（精確率 ＝ 100 ÷ 160 ＝ 0.625）"]], "cm": {"pos": "生病", "neg": "沒生病", "tp": 100, "fp": 60, "fn": 40, "tn": 540}, "tip": "FPR 的分母是「實際沒病的人」(FP＋TN)；FPR ＝ 1 － 特異度。"}}, {"no": 32, "section": "5.3", "topic_id": "5.3-03", "topic": "學習曲線判讀", "style": "情境", "stem": "某團隊繪製學習曲線（橫軸為訓練樣本數，縱軸為 RMSE）。當樣本數從 500 增加到 20,000，訓練 RMSE 由 1.0 緩慢上升到 6.2，驗證 RMSE 由 11.5 下降到 6.5；兩條曲線在約 10,000 筆之後幾乎重疊並停止變化，但業務目標要求 RMSE 低於 3。下列判斷與下一步何者最適當？", "options": {"A": "高偏差（High Bias）：兩條曲線已收斂但誤差偏高，應提高模型容量或加入更具資訊的特徵", "B": "高變異（High Variance）：訓練與驗證的落差很大，應再蒐集大量資料並加強正則化", "C": "過擬合（Overfitting）：模型已經背下訓練資料，應提早停止訓練並提高 Dropout 比例", "D": "已達最佳（Converged）：學習曲線已趨於平穩，代表模型已達最佳，可直接上線"}, "answer": "A", "explanation": "答案 A。兩條曲線隨樣本增加已收斂並重疊，但誤差仍高於目標，屬高偏差（模型太簡單或特徵資訊不足）。此時再蒐集更多相同資料幾乎沒有改善，應提高模型容量、換更強的模型，或加入更具資訊的特徵。若兩條曲線之間仍有大落差、驗證誤差持續下降，才是增加資料有效的情形。", "per_option": {"A": "正確：曲線重疊且誤差仍高於目標，屬高偏差。", "B": "兩條曲線已幾乎重疊，落差很小，並非高變異。", "C": "過擬合會看到訓練誤差遠低於驗證誤差。", "D": "平穩不代表達標，6.5 仍遠高於 3 的業務目標。"}, "guide_ref": "學習指引 p.5-19～5-20", "hot": true}, {"no": 33, "section": "5.3", "topic_id": "5.3-04", "topic": "殘差分析", "style": "情境", "stem": "某團隊檢視房價迴歸模型的殘差圖（橫軸為預測值、縱軸為殘差）：大多數點隨機分佈在 0 附近，上下寬度大致一致，沒有彎曲或喇叭形的趨勢；但有 3 個點的殘差高達標準差的 6 倍以上。下列處理方式何者最適當？", "options": {"A": "增加模型容量（Increase Capacity）：立即改用更深的神經網路，因為殘差大代表模型容量不足", "B": "多項式特徵（Polynomial Features）：加入高次項，把圖中所有極端點的殘差壓到 0 附近", "C": "時間序列建模（Time-series Modeling）：判定殘差存在自相關，改用時間序列模型重新建模", "D": "異常值檢查（Outlier Inspection）：先查這 3 筆是否為輸入錯誤或特殊事件，再決定修正、排除或改用穩健損失"}, "answer": "D", "explanation": "答案 D。殘差圖整體健康（隨機、寬度一致、無彎曲或喇叭形），少數極大殘差通常代表異常值或特殊事件。應先檢查是否為輸入錯誤或有業務原因，再決定修正、排除，或改用對離群值較穩健的損失（如 Huber、MAE）。換更深的網路、加高次多項式、套用時間序列模型都不對症。", "per_option": {"A": "整體殘差圖健康，問題在少數點，不是整體容量不足。", "B": "殘差圖沒有彎曲趨勢，不需要增加非線性項，且會有過擬合風險。", "C": "圖中看不到殘差依序相關的規律，也沒有時間資訊。", "D": "正確：少數極大殘差通常代表異常值。"}, "guide_ref": "學習指引 p.5-24", "hot": true}, {"no": 34, "section": "5.3", "topic_id": "5.3-05", "topic": "迴歸評估指標", "style": "情境", "stem": "兩位工程師分別訓練了房價預測模型 A 與 B。在同一份測試集上，兩者的 MAE 都是 5.0 萬元，但模型 A 的 RMSE 為 5.2 萬元，模型 B 的 RMSE 為 9.1 萬元。關於兩個模型誤差的特性，下列推論何者最合理？", "options": {"A": "模型 B 的誤差分佈較均勻，每筆預測都約差 5 萬元", "B": "模型 B 的誤差中混有少數很大的誤差，平方後被放大，使 RMSE 遠高於 MAE", "C": "模型 A 的 R² 一定比模型 B 低，因為它的 RMSE 較小", "D": "模型 A 存在少數極端誤差，所以 RMSE 才會接近 MAE"}, "answer": "B", "explanation": "答案 B。兩模型 MAE 相同，但 B 的 RMSE（9.1）遠大於 MAE（5.0）：RMSE 先平方再平均，會放大大誤差，兩者差距越大代表誤差分佈越不均、含有少數很大的誤差。A 的 RMSE 接近 MAE，誤差較均勻。RMSE 較小的模型 R² 較高，而不是較低。", "per_option": {"A": "若誤差均勻，RMSE 會接近 MAE，B 的 RMSE 卻高出許多。", "B": "正確：RMSE 對大誤差敏感，與 MAE 差距大代表誤差分佈不均。", "C": "RMSE 較小的模型 R² 較高，不是較低。", "D": "極端誤差會讓 RMSE 遠大於 MAE，A 的兩者接近代表誤差均勻。"}, "guide_ref": "學習指引 p.5-22～5-24", "hot": true}, {"no": 35, "section": "5.3", "topic_id": "5.3-09", "topic": "資料洩漏與 Pipeline", "style": "情境", "stem": "某工程師想在交叉驗證中同時做標準化並調整 SVM 的 C 值，並避免標準化造成資料洩漏。程式如下：\n```\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.svm import SVC\nfrom sklearn.model_selection import GridSearchCV\npipe = Pipeline([('scaler', StandardScaler()), ('svc', SVC())])\ngs = GridSearchCV(pipe, {'C': [0.1, 1, 10]}, cv=5)\ngs.fit(X, y)\n```\n執行 gs.fit(X, y) 的結果最可能為何？", "options": {"A": "拋出 ValueError：'C' 不是 Pipeline 本身的參數，參數名稱應寫成 'svc__C'", "B": "成功執行，並只對 SVC 的 C 做搜尋，因為 GridSearchCV 會自動比對到內部的 SVC，不需要加上步驟名稱", "C": "成功執行，但 StandardScaler 仍會用全部資料 fit，造成資料洩漏", "D": "拋出 KeyError：Pipeline 的步驟名稱不可取為 'scaler'"}, "answer": "A", "explanation": "答案 A。GridSearchCV 的參數字典作用於傳入的估計器，也就是 Pipeline；Pipeline 本身沒有名為 C 的參數，必須寫成「步驟名__參數名」，即 'svc__C'，否則在 fit 時拋出 ValueError（Invalid parameter 'C' for estimator Pipeline）。把 scaler 放進 Pipeline 後，每一折只會用該折訓練資料 fit，不會洩漏，這部分設計是對的。", "per_option": {"A": "正確：Pipeline 的參數名稱格式為「步驟名__參數名」。", "B": "GridSearchCV 不會自動比對內部步驟，必須用步驟名稱前綴。", "C": "放進 Pipeline 後，每一折只用該折訓練資料 fit，不會洩漏；而且程式根本無法成功執行。", "D": "'scaler' 是合法的步驟名稱，錯誤出在參數名稱。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 管線裡參數名稱的寫法", "Pipeline 內某步驟的參數名稱 ＝ 步驟名稱 ＋ 兩個底線 ＋ 參數名稱", "步驟名稱是 'svc'（Pipeline 清單裡取的名字），要調的參數是 C → 要寫成 'svc__C'。題目寫成 'C'，但 Pipeline 本身沒有叫 C 的參數，所以 fit 時會拋出 ValueError，選 A"]], "code": [["from sklearn.pipeline import Pipeline", "匯入 Pipeline（管線）：把「前處理 → 模型」串成一條，fit 時依序執行。放進管線後，交叉驗證每一折都只用該折的訓練資料去 fit 前處理，不會資料洩漏"], ["from sklearn.preprocessing import StandardScaler", "匯入 StandardScaler（標準化器，把資料轉成平均 0、標準差 1）"], ["from sklearn.svm import SVC", "匯入 SVC（Support Vector Classifier，支持向量機分類器）。它有一個超參數 C，控制對分類錯誤的懲罰強度"], ["from sklearn.model_selection import GridSearchCV", "匯入 GridSearchCV（網格搜尋加交叉驗證：把候選參數全部試一遍，挑最好的）"], ["pipe = Pipeline([('scaler', StandardScaler()), ('svc', SVC())])", "建立管線，中括號裡每一項是 (步驟名稱, 工具)。第一步 'scaler' ＝ 標準化；第二步 'svc' ＝ SVC 分類。這兩個名稱是自己取的，後面指定參數時要用到"], ["gs = GridSearchCV(pipe, {'C': [0.1, 1, 10]}, cv=5)", "GridSearchCV 的第一個參數 pipe＝要調的對象（整條管線）；第二個參數是候選字典，鍵 'C' 是要調的參數名稱、值是候選清單 [0.1, 1, 10]；cv=5＝5 折交叉驗證。問題在鍵：對整條管線來說沒有 'C'，必須寫 'svc__C'"], ["gs.fit(X, y)", "fit＝開始執行搜尋。GridSearchCV 檢查到 'C' 不是 Pipeline 的合法參數，這時拋出 ValueError（Invalid parameter 'C'）"]], "tip": "Pipeline 搭配 GridSearchCV：參數名要寫「步驟名__參數名」，如 svc__C。", "fig": {"type": "flow", "title": "Pipeline 搭配 GridSearchCV", "cols": [{"label": "✗ 題目的寫法", "bad": true, "steps": ["建 Pipeline", "scaler → svc", "!參數寫成 'C'", "fit 檢查參數名", "ValueError"], "note": "Pipeline 本身沒有叫 C 的參數，fit 一開始就報錯"}, {"label": "✓ 正確寫法", "steps": ["建 Pipeline", "scaler → svc", "參數寫成 'svc__C'", "每折只 fit 訓練折", "正常選出最佳 C"], "note": "步驟名 ＋ 兩個底線 ＋ 參數名"}]}}}, {"no": 36, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "情境", "stem": "某電信公司建立客戶流失模型，特徵共 600 個，其中有多組高度相關的特徵（例如「月通話分鐘數」與「月通話次數」）。團隊希望部分不重要特徵的係數能被壓成 0 以簡化模型，同時又希望高度相關的特徵能一起被保留，避免每次重新訓練時隨機只選中其中一個。下列哪一種方法最適當？", "options": {"A": "套索迴歸（Lasso，L1 正則化）：絕對值懲罰使部分係數歸零，面對高度相關特徵時傾向任選其一", "B": "嶺迴歸（Ridge，L2 正則化）：平方懲罰使係數普遍縮小但不會歸零", "C": "彈性網路（Elastic Net）：結合 L1 與 L2 懲罰，兼具稀疏化與對相關特徵群組的穩定性", "D": "普通最小平方法（OLS）：不施加懲罰，直接最小化平方誤差"}, "answer": "C", "explanation": "答案 C。需求有兩個：部分係數歸零（稀疏）與相關特徵群組穩定保留。Lasso 能歸零，但面對高度相關特徵傾向任選其一，且每次訓練可能不同；Ridge 不會歸零；OLS 不處理共線性。Elastic Net 結合 L1（稀疏）與 L2（穩定、讓相關特徵分攤權重），兩者兼顧。", "per_option": {"A": "Lasso 能歸零，但相關特徵只留其一且每次可能不同，與需求衝突。", "B": "Ridge 不會讓係數歸零，無法精簡特徵。", "C": "正確：L1 負責稀疏，L2 讓相關特徵分攤權重。", "D": "OLS 沒有懲罰，不會歸零，遇共線性時係數估計還會不穩定。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true}, {"no": 37, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "情境", "stem": "某影像分類模型的訓練集準確率為 99%、驗證集準確率為 81%。工程師在 PyTorch 中將優化器改為下列寫法，其中新加入 weight_decay＝1e-4。\n```\nopt = torch.optim.SGD(model.parameters(), lr=0.01, weight_decay=1e-4)\n```\n關於 weight_decay，下列說明何者最正確？", "options": {"A": "學習率衰減（Learning Rate Decay）：每個 epoch 結束後把學習率乘以 1e-4，使學習率逐步變小", "B": "丟棄法（Dropout）：每次訓練隨機把 1e-4 比例的神經元輸出設為 0", "C": "梯度裁剪（Gradient Clipping）：將梯度的 L2 範數限制在 1e-4 以內，防止梯度爆炸", "D": "L2 正則化（L2 Regularization）：在損失中對權重大小施加懲罰，讓權重傾向變小以緩解過擬合"}, "answer": "D", "explanation": "答案 D。PyTorch 優化器的 weight_decay 參數（權重衰減）就是對權重施加 L2 懲罰，讓權重傾向變小，降低模型複雜度以緩解過擬合（訓練 99%、驗證 81%）。它不是學習率衰減（那是 lr_scheduler）、不是 Dropout，也不是梯度裁剪（clip_grad_norm_）。", "per_option": {"A": "學習率衰減要靠 lr_scheduler，與 weight_decay 無關。", "B": "隨機關閉神經元是 Dropout，不是 weight_decay。", "C": "限制梯度範數是梯度裁剪（clip_grad_norm_）。", "D": "正確：weight_decay 即權重衰減，等同對權重施加 L2 正則化，懲罰過大的權重。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true, "detail": {"steps": [["① L2 正則化的更新式（以最單純的 SGD 為例）", "L2 懲罰：總損失 ＝ 原損失 ＋ (λ ÷ 2) × Σw²；對 w 微分後多出 λ × w，所以 w_new ＝ w － 學習率 × (梯度 ＋ λ × w)（weight_decay 就是 λ。這是最單純的 SGD；Adam 的 weight_decay 與 AdamW 的做法不同）", "舉例（題目沒給 w 與梯度）：w ＝ 10、梯度 ＝ 0.5，取題目的 lr ＝ 0.01、weight_decay ＝ 1e-4（＝ 0.0001）。懲罰項 λ × w ＝ 0.0001 × 10 ＝ 0.001，有效梯度 ＝ 0.5 ＋ 0.001 ＝ 0.501；w_new ＝ 10 － 0.01 × 0.501 ＝ 9.99499。沒有 weight_decay 時：10 － 0.01 × 0.5 ＝ 9.995。有 weight_decay 的 w 縮得多一點，權重傾向變小"], ["② 對照其他選項", "weight_decay 是優化器的參數，對象是權重本身", "A：學習率衰減要用 lr_scheduler。B：隨機關閉神經元是 Dropout（nn.Dropout）。C：限制梯度範數是 clip_grad_norm_。D：weight_decay ＝ 權重衰減 ＝ L2 正則化，緩解過擬合（訓練 99%、驗證 81%），選 D"]], "code": [["opt = torch.optim.SGD(model.parameters(), lr=0.01, weight_decay=1e-4)", "torch.optim.SGD＝隨機梯度下降優化器（optim＝optimizer，優化器，負責更新權重）。model.parameters()＝要更新的所有參數；lr＝學習率，每次更新走多大一步，0.01；weight_decay（權重衰減）＝每次更新時額外讓權重縮一點，數值 1e-4 ＝ 0.0001，等同對權重加 L2 懲罰，用來緩解過擬合"]], "tip": "weight_decay ＝ 權重衰減 ＝ L2 正則化；學習率衰減要靠 lr_scheduler。"}}, {"no": 38, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "情境", "stem": "某團隊用 Dropout 比例 0.3 訓練全連接網路，訓練準確率 97%、驗證準確率 84%。為了縮小落差，他們一次把 Dropout 比例調到 0.9，結果訓練準確率降到 58%、驗證準確率 55%，兩者都很低且接近。下列解讀與調整何者最適當？", "options": {"A": "過擬合已完全消除，應把 Dropout 比例提高到 0.99 以進一步改善", "B": "Dropout 比例過高使模型容量被壓得太小而欠擬合，應把比例降回中等程度", "C": "訓練與驗證準確率已經接近，代表模型達到最佳，應停止調整", "D": "Dropout 在驗證階段仍會隨機關閉神經元，才使驗證準確率下降，應在訓練時關閉 Dropout"}, "answer": "B", "explanation": "答案 B。Dropout 比例 0.9 代表訓練時幾乎關掉九成神經元，模型容量被壓得過小，訓練與驗證表現都低且接近，是欠擬合，應把比例降回中等程度。落差縮小不等於變好；Dropout 只在訓練階段啟用，驗證與推論時是關閉的。", "per_option": {"A": "兩者都低是欠擬合，不是改善。", "B": "正確：訓練與驗證都低且接近，是欠擬合。", "C": "接近不代表好，兩者都只有五成多。", "D": "Dropout 只在訓練階段啟用，驗證與推論時是關閉的。"}, "guide_ref": "學習指引 p.5-45～5-46", "hot": true}, {"no": 39, "section": "5.4", "topic_id": "5.4-03", "topic": "學習率", "style": "情境", "stem": "某團隊把影像模型的批次大小從 32 改為 512 以加速訓練，其餘設定（包含學習率 0.001）都沒變。結果訓練的收斂速度明顯變慢，驗證表現也變差。下列哪一項是最優先的處理方式？", "options": {"A": "重調學習率（Learning Rate Re-tuning）：批次大小與學習率高度耦合，應重新調整學習率", "B": "加深網路（Deeper Network）：學習率與批次大小無關，應保持學習率不變並把網路加深一倍", "C": "重新標註資料（Re-labeling）：批次變大會使資料的標籤雜訊增加，應重新標註全部訓練資料", "D": "合併驗證集（Merging Validation Set）：把驗證集併入訓練集，補足較大批次所需要的資料量"}, "answer": "A", "explanation": "答案 A。批次大小與學習率高度耦合：批次變大後梯度估計較穩，但更新次數變少，原本的學習率不再適用，通常需要重新調整（有時需調大並搭配 warm-up）。因此第一步是重調學習率。換網路深度、標籤或驗證集配置都與批次大小的改變無直接關係。", "per_option": {"A": "正確：批次改變後，原學習率通常不再適用。", "B": "兩者高度耦合，且加深網路與本次改動無直接關係。", "C": "批次大小不會改變標籤品質。", "D": "併入驗證集會失去評估依據，也無法解決學習率不匹配。"}, "guide_ref": "學習指引 p.5-31～5-32", "hot": true}, {"no": 40, "section": "5.4", "topic_id": "5.4-04", "topic": "資料增強", "style": "否定", "stem": "某團隊用手腕加速度計的時序資料（每筆為 3 軸、2 秒視窗）辨識「揮手」「敲桌」「擦拭」三種動作，但每類只有約 150 筆。他們討論資料增強的做法。下列何者不適合作為增強手法？", "options": {"A": "抖動（Jittering）：對訊號加入小幅隨機雜訊，模擬感測器誤差", "B": "視窗裁切（Window Cropping）：從原始視窗隨機截取連續片段並補齊長度", "C": "隨機打亂時間點（Random Time-step Shuffling）：把序列中各時間點的順序隨機重排", "D": "幅度縮放（Magnitude Scaling）：將整段訊號乘上接近 1 的隨機係數，模擬佩戴鬆緊差異"}, "answer": "C", "explanation": "答案 C。時序資料增強不能破壞時間結構與標籤語意。隨機打亂時間點會摧毀動作的時序形狀，不同動作的訊號都變成雜訊，並不適合。抖動、視窗裁切與幅度縮放都保留動作的時間形狀與類別語意，是常見做法。", "per_option": {"A": "適合：不改變動作的時間形狀與類別。", "B": "適合：保留連續的時間結構。", "C": "不適合：打亂順序會摧毀動作的時間結構，等於改變語意。", "D": "適合：保留波形形狀，僅改變幅度。"}, "guide_ref": "學習指引 p.5-47", "hot": true}, {"no": 41, "section": "5.4", "topic_id": "5.4-05", "topic": "模型量化", "style": "情境", "stem": "某團隊把訓練好的 FP32 影像模型直接量化成 INT8，以部署在僅支援整數運算的 Edge TPU 上，模型體積縮小為約四分之一，但準確率下降了 4 個百分點，超出可接受範圍。團隊仍須維持 INT8 部署，並希望補救量化所造成的精度損失。下列哪一項做法最適當？", "options": {"A": "改用混合精度訓練（Mixed Precision Training）：訓練時混用 FP16 與 FP32 以加速訓練並節省記憶體", "B": "對模型做權重剪枝（Pruning）：移除不重要的權重以縮小模型", "C": "把模型改回 FP32 部署，放棄 Edge TPU", "D": "採用量化感知訓練（Quantization-Aware Training, QAT）：訓練或微調時模擬量化誤差，讓模型適應低精度"}, "answer": "D", "explanation": "答案 D。直接量化造成精度下降是量化的常見問題，指引建議搭配量化感知訓練（QAT）：訓練或微調階段就模擬量化誤差，讓模型適應低精度後再轉成 INT8。混合精度訓練是為了加速訓練、節省記憶體，不是部署壓縮；剪枝是移除權重；改回 FP32 則違反 INT8 部署的要求。", "per_option": {"A": "混合精度是訓練技巧，不是部署壓縮，也不能修復 INT8 量化誤差。", "B": "剪枝是移除權重以縮小模型，無法修正量化誤差，甚至可能讓精度更差，與量化造成的精度損失沒有直接對應。", "C": "題目要求仍須維持 INT8 部署。", "D": "正確：直接量化掉準確率時的標準對策。"}, "guide_ref": "學習指引 p.5-51～5-52", "hot": false}, {"no": 42, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "情境", "stem": "某連鎖診所要把病患的血糖數值交給外部雲端平台計算全體平均與標準差，但診所不願讓雲端供應商看到任何明文數值。診所先在本地以自己持有的金鑰將數值加密後上傳，雲端平台在不持有金鑰的情況下完成計算並回傳加密後的結果，診所再自行解密取得最終統計數值。這項做法屬於下列哪一種隱私強化技術？", "options": {"A": "聯邦學習（Federated Learning）：資料留在各機構本地，只回傳模型參數更新", "B": "同態加密（Homomorphic Encryption）：加密後的資料可直接進行加、乘等運算，解密結果等同明文運算", "C": "差分隱私（Differential Privacy）：對結果或訓練加入噪聲，使單一個人的資料難以被察覺，並以隱私預算 ε 量化保護強度", "D": "雜湊與數位簽章（Hash & Digital Signature）：驗證資料來源並偵測傳輸中是否被竄改"}, "answer": "B", "explanation": "答案 B。雲端在沒有金鑰的情況下直接對密文做運算，診所解密後結果與明文計算相同，這是同態加密的定義。聯邦學習是資料不離開本地、只傳參數更新；差分隱私是加入噪聲保護個體；雜湊與數位簽章用於驗證完整性與來源，不能讓雲端對密文運算。", "per_option": {"A": "此情境的資料有上傳到雲端（加密後），並不是留在本地只傳參數更新。", "B": "正確：對密文運算，解密後與明文運算結果相同。", "C": "差分隱私靠加入噪聲保護個體，結果會有誤差，不具備「對密文運算、解密後等同明文運算」的性質。", "D": "用於驗證完整性與來源，不能讓雲端對密文做運算。"}, "guide_ref": "學習指引 p.6-10～6-12", "hot": true}, {"no": 43, "section": "6.1", "topic_id": "6.1-06", "topic": "合規與資料治理", "style": "否定", "stem": "某保險公司準備用客戶資料訓練理賠風險模型。下列做法中，何者不屬於合規的資料治理做法？", "options": {"A": "客戶原先同意的用途是保單聯絡，公司因模型有商業價值，便直接拿其通訊與理賠紀錄訓練，不另行告知", "B": "只蒐集訓練所需的最低限度欄位，並記錄每個欄位的蒐集目的、保存期間與負責單位", "C": "對外共享訓練資料前先做去識別化，並進行再識別風險測試、保留完整的風險評估紀錄", "D": "建立處理紀錄（資料來源、法律依據、處理流程與保護措施），並定期進行內部稽核與檢討"}, "answer": "A", "explanation": "答案 A。個資應依告知的目的使用（目的限制）。原本同意的用途是保單聯絡，挪作模型訓練屬於目的外使用，應另行告知並取得同意，或有其他法定依據；「有商業價值」不構成理由。其餘三項（資料最小化、去識別化與再識別測試、處理紀錄與定期稽核）都是指引建議的合規做法。", "per_option": {"A": "不符合：挪作未告知的用途，違反目的限制。", "B": "符合：資料最小化與目的限制。", "C": "符合：去識別化需搭配再識別測試與紀錄。", "D": "符合：透明與紀錄保存。"}, "guide_ref": "學習指引 p.6-11～6-13", "hot": false}, {"no": 44, "section": "6.2", "topic_id": "6.2-01", "topic": "偏見類型與成因", "style": "情境", "stem": "某團隊開發皮膚癌影像辨識 App，訓練影像全部來自北歐三家醫院，病患幾乎都是淺膚色，標註由多位皮膚科醫師依病理切片結果確認，標註品質一致。App 上市後，對深膚色使用者的辨識準確率明顯偏低。此偏見最主要屬於下列哪一種？", "options": {"A": "標籤偏差（Label Bias）：標記資料本身帶有主觀偏見", "B": "特徵偏差（Feature Bias）：特徵的選擇或設計本身就偏頗", "C": "取樣偏差（Sampling Bias）：訓練樣本無法代表實際要服務的全體族群", "D": "過擬合（Overfitting）：模型記住訓練資料的細節，在新資料上泛化變差"}, "answer": "C", "explanation": "答案 C。訓練樣本只涵蓋淺膚色族群，無法代表實際使用者，這是取樣偏差。題目已說明標註由病理確認、品質一致，排除標籤偏差；特徵偏差指特徵設計本身偏頗，題幹未提；過擬合是技術問題，而不是偏見類型。", "per_option": {"A": "標註依病理結果確認且品質一致，沒有主觀偏見的跡象。", "B": "題幹沒有提到特徵設計的問題。", "C": "正確：樣本只涵蓋淺膚色族群。", "D": "過擬合是技術問題而非偏見類型；根本原因是樣本沒有涵蓋深膚色。"}, "guide_ref": "學習指引 p.6-14～6-17", "hot": true}, {"no": 45, "section": "6.2", "topic_id": "6.2-03", "topic": "公平性指標", "style": "情境", "stem": "某法院評估再犯風險預測工具。委員會要求：在「實際會再犯」的人當中，各族群被正確預測為高風險的比例要相同；同時在「實際不會再犯」的人當中，各族群被誤判為高風險的比例也要相同。符合這項要求的公平性指標是下列何者？", "options": {"A": "均衡機率（Equalized Odds）：要求各群體的真陽性率（TPR）與假陽性率（FPR）都一致", "B": "機會平等（Equal Opportunity）：只要求各群體的真陽性率（TPR）相同，也就是實際為正者被正確預測的比例", "C": "群體平等率（Demographic Parity）：要求各群體獲得正向預測的比例相近", "D": "準確率平等（Accuracy Parity）：要求各群體的整體準確率相同"}, "answer": "A", "explanation": "答案 A。同時要求各族群 TPR（實際會再犯者被正確預測為高風險）與 FPR（實際不會再犯者被誤判為高風險）一致，是均衡機率（Equalized Odds），最嚴格也最難達成。機會平等只要求 TPR；群體平等率只比較正向預測的比例，不看實際結果；準確率平等看整體準確率，不是此處的雙條件。", "per_option": {"A": "正確：同時約束 TPR 與 FPR，最嚴格。", "B": "只約束 TPR，沒有約束誤判率 FPR。", "C": "只看預測為正的比例，不區分實際是否會再犯。", "D": "整體準確率相同不保證 TPR 與 FPR 各自一致。"}, "guide_ref": "學習指引 p.6-17～6-19", "hot": false}, {"no": 46, "section": "X", "topic_id": "X-05", "topic": "AutoML", "style": "情境", "stem": "某製造公司使用 AutoML 平台，在 6 小時內自動嘗試數百組前處理、特徵工程與演算法組合，找到驗證 AUC 最高的集成模型。但稽核單位詢問「為何選用這些特徵組合、能否逐步重現並調整其中某個細節」時，團隊難以完整回答。這最能反映 AutoML 的哪一項主要限制？", "options": {"A": "無法調參（No Hyperparameter Tuning）：AutoML 無法自動調整超參數，必須由人工逐一指定每組參數", "B": "僅限分類（Classification Only）：AutoML 只能處理分類任務，無法處理迴歸任務", "C": "人工特徵工程（Manual Feature Engineering）：必須先由人工完成所有特徵工程，平台只負責部署", "D": "黑箱與有限客製化（Black-box & Limited Customization）：對特徵工程與演算法細節的控制有限"}, "answer": "D", "explanation": "答案 D。稽核問「為何選這些特徵組合、能否逐步重現並調整細節」，反映 AutoML 黑箱程度較高、客製化與細節控制有限；需要精細控制的高度客製專案，手工建模更合適。AutoML 本來就會自動調超參數、可處理分類與迴歸，也不需要人工先完成全部特徵工程。", "per_option": {"A": "AutoML 的賣點之一正是自動調整超參數。", "B": "AutoML 同時支援分類與迴歸等任務。", "C": "AutoML 通常也會自動完成特徵工程。", "D": "正確：稽核要求細節可說明、可調整，這是 AutoML 的弱項。"}, "guide_ref": "指引未載", "hot": false}, {"no": 47, "section": "X", "topic_id": "X-06", "topic": "LoRA 微調", "style": "計算", "stem": "某團隊用 LoRA 微調一個 32 層的語言模型。他們只在每一層的 W_q 與 W_v 兩個矩陣上套用 LoRA，這兩個矩陣的形狀皆為 4096×4096，秩 r＝8（每個被套用的矩陣新增 B：4096×8 與 A：8×4096 兩個可訓練的小矩陣，原權重凍結）。LoRA 新增的可訓練參數總數為多少？", "options": {"A": "2,097,152：每個矩陣只計入 A 或 B 其中之一", "B": "4,194,304：8×(4,096＋4,096)×2 個矩陣×32 層", "C": "8,388,608：誤以為四個矩陣（W_q、W_k、W_v、W_o）都套用了 LoRA", "D": "1,073,741,824：4,096×4,096×2×32，相當於全量微調這些矩陣"}, "answer": "B", "explanation": "答案 B。每個被套用的矩陣新增參數＝r×(d＋k)＝8×(4,096＋4,096)＝65,536。每層 2 個矩陣、共 32 層：65,536×2×32＝4,194,304。若誤以為套用 4 個矩陣會得 8,388,608；漏算一半（只算 A 或 B）得 2,097,152；1,073,741,824 是全量微調這些矩陣的參數量。", "per_option": {"A": "每個矩陣有 A 與 B 兩個小矩陣，都要計入。", "B": "正確：每個矩陣 65,536 個參數。", "C": "題目只套用在 W_q 與 W_v 兩個矩陣。", "D": "這是全量微調這些矩陣的參數量，LoRA 只訓練低秩小矩陣。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 算 B 與 A 各有幾個參數", "B 的參數 ＝ 輸出維度 × r；A 的參數 ＝ r × 輸入維度（r 是秩）", "B：4,096 × 8 ＝ 32,768；A：8 × 4,096 ＝ 32,768"], ["② 單一矩陣新增的參數", "新增參數 ＝ B ＋ A ＝ r ×（輸出維度 ＋ 輸入維度）", "＝ 32,768 ＋ 32,768 ＝ 8 ×（4,096 ＋ 4,096）＝ 65,536"], ["③ 乘上矩陣數與層數", "總新增參數 ＝ 單一矩陣新增參數 × 每層套用的矩陣數 × 層數", "＝ 65,536 × 2（W_q、W_v）× 32 ＝ 131,072 × 32 ＝ 4,194,304，選 B"], ["④ 對照其他選項（怎麼算錯的）", "每個選項改了「矩陣數」或「少算一個小矩陣」", "A：只計 A 或 B 其中之一：32,768 × 2 × 32 ＝ 2,097,152。C：以為四個矩陣（W_q、W_k、W_v、W_o）都套用：65,536 × 4 × 32 ＝ 8,388,608。D：全量微調這些矩陣：4,096 × 4,096 ＝ 16,777,216，再 × 2 × 32 ＝ 1,073,741,824；LoRA 的 4,194,304 只有它的 1／256（約 0.39%）"]], "tip": "LoRA 每個矩陣新增 r×(d＋k) 個參數，遠小於全量微調的 d×k。"}}, {"no": 48, "section": "X", "topic_id": "X-07", "topic": "RAG 混合搜尋", "style": "計算", "stem": "某企業 RAG 系統採用混合搜尋，以 RRF（倒數排名融合）合併向量搜尋與 BM25 兩路結果，公式為每路得分＝1÷(k＋名次)，各路加總，k＝60。三份文件在兩路檢索中的名次如下：文件 X：向量搜尋第 1、BM25 第 5；文件 Y：向量搜尋第 2、BM25 第 2；文件 Z：向量搜尋第 6、BM25 第 1。融合後排名第一的文件及其約略分數為何？", "options": {"A": "文件 X，約 0.0318：因為向量搜尋排第 1", "B": "文件 X，約 0.0164：只計入向量搜尋的得分", "C": "文件 Y，約 0.0323：1÷62＋1÷62", "D": "文件 Z，約 0.0315：因為 BM25 排第 1"}, "answer": "C", "explanation": "答案 C。分數＝1÷(60＋名次)。X＝1/61＋1/65≈0.01639＋0.01538＝0.03178；Y＝1/62＋1/62≈0.03226；Z＝1/66＋1/61≈0.01515＋0.01639＝0.03155。Y 在兩路都名列前茅（均第 2），總分最高。RRF 只看名次，獎勵在兩路都排名靠前的文件，而不是只在單一路拿第 1 的文件。", "per_option": {"A": "X 的總分約 0.0318，仍低於 Y。", "B": "RRF 要把兩路得分加總，不能只計一路。", "C": "正確：兩路都排第 2，總分最高。", "D": "Z 的總分約 0.0315，低於 Y。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 算文件 X 的 RRF 分數", "RRF 分數 ＝ Σ 各路 1 ÷ (k ＋ 名次)", "向量搜尋第 1：1 ÷ (60 ＋ 1) ＝ 1 ÷ 61 ≈ 0.01639；BM25 第 5：1 ÷ (60 ＋ 5) ＝ 1 ÷ 65 ≈ 0.01538；合計 ≈ 0.03178"], ["② 算文件 Y 的 RRF 分數", "同上", "向量搜尋第 2：1 ÷ 62 ≈ 0.01613；BM25 第 2：1 ÷ 62 ≈ 0.01613；合計 ≈ 0.03226"], ["③ 算文件 Z 的 RRF 分數", "同上", "向量搜尋第 6：1 ÷ 66 ≈ 0.01515；BM25 第 1：1 ÷ 61 ≈ 0.01639；合計 ≈ 0.03154"], ["④ 比較並對照選項", "分數越高排名越前", "Y（0.03226）＞ X（0.03178）＞ Z（0.03154），第一名是 Y，約 0.0323，選 C。A：X 約 0.0318，比 Y 低。B：只算向量搜尋 1 ÷ 61 ≈ 0.0164，但 RRF 要兩路加總。D：Z 約 0.0315，也比 Y 低"]], "tip": "RRF 獎勵「兩路都排得靠前」的文件，而不是只在某一路拿第 1。"}}, {"no": 49, "section": "X", "topic_id": "X-08", "topic": "信用評分卡", "style": "計算", "stem": "某銀行信用評分卡的開發樣本與近期申請樣本，在「月收入」分箱上的占比如下：低收入箱——開發 50%、近期 25%；中收入箱——開發 30%、近期 30%；高收入箱——開發 20%、近期 45%。PSI＝Σ（近期占比−開發占比）×ln（近期占比÷開發占比）。已知 ln(0.5)＝−0.693、ln(1.0)＝0、ln(2.25)＝0.811。依常見經驗門檻（PSI＜0.1 穩定、0.1～0.25 輕度偏移、＞0.25 顯著偏移），此變數的 PSI 約為多少、應如何解讀？", "options": {"A": "約 0.00，穩定：把各箱占比差直接相加，總和為 0", "B": "約 0.17，輕度偏移：只計入低收入箱的貢獻，漏算高收入箱", "C": "約 0.20，輕度偏移：只計入高收入箱的貢獻，漏算低收入箱", "D": "約 0.38，顯著偏移：三箱貢獻相加，應檢視客群變動並評估重建模型"}, "answer": "D", "explanation": "答案 D。PSI＝(0.25−0.50)×ln0.5＋(0.30−0.30)×ln1.0＋(0.45−0.20)×ln2.25＝0.173＋0＋0.203≈0.376，超過 0.25 屬顯著偏移（0.1／0.25 是業界常見的經驗門檻，並非官方或法規規定，各機構可自訂），應檢視客群變動並評估重新校準或重建模型。把各箱占比差直接相加會得到 0，是錯誤算法；0.17、0.20 各只算了單一箱。", "per_option": {"A": "占比差的總和一定為 0，PSI 並不是占比差的加總。", "B": "漏算了高收入箱的貢獻。", "C": "漏算了低收入箱的貢獻。", "D": "正確：0.173＋0＋0.203≈0.376，大於 0.25。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 算每個分箱的占比比值", "比值 ＝ 近期占比 ÷ 開發占比", "低收入：0.25 ÷ 0.50 ＝ 0.5；中收入：0.30 ÷ 0.30 ＝ 1.0；高收入：0.45 ÷ 0.20 ＝ 2.25（題目已給 ln(0.5) ＝ −0.693、ln(1.0) ＝ 0、ln(2.25) ＝ 0.811）"], ["② 算每個分箱對 PSI 的貢獻", "貢獻 ＝ (近期占比 － 開發占比) × ln(比值)", "低收入：(0.25 － 0.50) × (−0.693) ＝ (−0.25) × (−0.693) ≈ 0.173；中收入：(0.30 － 0.30) × 0 ＝ 0；高收入：(0.45 － 0.20) × 0.811 ＝ 0.25 × 0.811 ≈ 0.203"], ["③ 加總得到 PSI", "PSI ＝ 各分箱貢獻相加", "＝ 0.173 ＋ 0 ＋ 0.203 ＝ 0.376，約 0.38"], ["④ 對照門檻解讀", "PSI 越大，分布偏移越明顯（常見經驗門檻，非法規）", "門檻：小於 0.1 穩定、0.1 到 0.25 輕度偏移、大於 0.25 顯著偏移。0.376 ＞ 0.25，顯著偏移，應檢視客群變動並評估重建模，選 D"], ["⑤ 對照其他選項", "每個選項都是少加了某一箱，或用錯算法", "A：把占比差直接相加：(−0.25) ＋ 0 ＋ 0.25 ＝ 0，兩邊占比各自加總都是 100%，差值總和必為 0，不是 PSI。B：0.173 ≈ 0.17，只算了低收入箱。C：0.203 ≈ 0.20，只算了高收入箱"]], "tip": "PSI ＝ Σ(近期占比 － 開發占比) × ln(近期 ÷ 開發)；每一箱貢獻都不會是負的。"}}, {"no": 50, "section": "X", "topic_id": "X-09", "topic": "時間複雜度", "style": "計算", "stem": "某平台的使用者 ID 已排序並存放於陣列。以二分搜尋（Binary Search）查找某個 ID，資料量為 1,024 筆時，最壞情況約需比較 10 次。當資料量成長為 1,048,576 筆（約 1,024 倍）時，最壞情況約需比較幾次？", "options": {"A": "約 20 次：次數隨資料量的對數成長，只增加約 10 次", "B": "約 100 次：把原本的 10 次平方", "C": "約 10,240 次：以為次數隨資料量等比例成長", "D": "約 1,048,576 次：逐筆掃描的最壞情況"}, "answer": "A", "explanation": "答案 A。二分搜尋每次砍掉一半，最壞比較次數約為 log₂n。1,024＝2¹⁰ → 約 10 次；1,048,576＝2²⁰ → 約 20 次，資料成長 1,024 倍，次數只增加約 10 次。比較次數隨資料量等比例成長，是線性搜尋 O(n) 的特性。", "per_option": {"A": "正確：log₂ 1,048,576＝20。", "B": "二分搜尋的次數不是平方成長。", "C": "等比例成長是線性搜尋（O(n)）的特性。", "D": "這是線性掃描，不是二分搜尋。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 先看二分搜尋的次數怎麼算", "每比較一次就砍掉一半資料，最壞比較次數 ≈ log₂(資料量) ＝ 要把資料量對折幾次才剩 1 筆（2 的幾次方等於資料量，指數就是次數）", "1,024 ＝ 2¹⁰ → 約 10 次（與題目一致）；1,048,576 ＝ 2²⁰ → log₂ ＝ 20 → 約 20 次，選 A"], ["② 用「資料成長幾倍」驗算", "log₂(a × b) ＝ log₂(a) ＋ log₂(b)：資料量乘上某倍數，次數只加上「那個倍數的 log₂」", "資料成長 1,024 倍，次數增加 log₂(1,024) ＝ 10，所以 10 ＋ 10 ＝ 20，與上一步一致"], ["③ 對照其他選項", "每個選項把「對數成長」誤當成別種成長", "B：10² ＝ 100，次數不是平方成長。C：10 × 1,024 ＝ 10,240，次數隨資料量等比例成長是線性搜尋的特性。D：1,048,576 是逐筆掃描（線性搜尋）的最壞情況"]], "tip": "二分搜尋 O(log n)：資料翻 1,024 倍，次數只多 10 次。"}}], "5": [{"no": 1, "section": "3.1", "topic_id": "3.1-01", "topic": "離散分佈與 PMF", "style": "情境", "stem": "某工廠品管員每批從產線隨機抽檢 10 件產品，假設各件是否為不良品彼此獨立，且每件的不良率固定為 2%。若要描述「一批抽檢的 10 件中，恰好有 k 件不良品」的機率，應採用下列哪一種機率分佈？", "options": {"A": "二項分佈（Binomial Distribution）：描述 n 次獨立的伯努利試驗中，成功次數的機率分佈", "B": "伯努利分佈（Bernoulli Distribution）：描述單次試驗只有成功或失敗兩種結果的機率", "C": "泊松分佈（Poisson Distribution）：描述固定時間內稀有事件發生的次數，次數沒有固定上限", "D": "常態分佈（Normal Distribution）：描述連續型數值圍繞平均值對稱分佈的機率密度"}, "answer": "A", "explanation": "答案 A。抽檢固定 10 次、每次獨立且不良率相同，要計的是「10 次中不良的次數」，這正是二項分佈：P(X=k)＝C(10,k)×0.02^k×0.98^(10−k)，k 從 0 到 10 的機率加總為 1。伯努利只描述單次試驗；泊松的次數沒有上限，不適合最多只有 10 件的情況；常態分佈是連續型，用機率密度函數（PDF）而非 PMF。", "per_option": {"A": "正確：n＝10 次獨立試驗、成功機率固定，計數成功次數即二項分佈。", "B": "伯努利只描述單一件產品「是否不良」，不是 10 件中的不良件數。", "C": "泊松用於固定時間或空間內的稀有事件次數且無固定上限；此處試驗次數固定為 10。", "D": "常態分佈屬連續型，這裡的不良件數是只能取 0～10 整數值的離散變數。"}, "guide_ref": "學習指引 p.3-3～3-4", "hot": false}, {"no": 2, "section": "3.1", "topic_id": "3.1-03", "topic": "貝氏定理與條件機率", "style": "定義", "stem": "某垃圾郵件過濾器統計歷史信件，30% 為垃圾信；垃圾信中有 60% 含「限時優惠」一詞，正常信中僅 5% 含該詞。收到一封含該詞的新信時，過濾器以貝氏定理計算它是垃圾信的機率，分母為 0.3×0.6＋0.7×0.05＝0.215。這個 0.215 在貝氏定理中扮演什麼角色？", "options": {"A": "先驗機率（Prior）：尚未看到證據前，一封信是垃圾信的初始信念比例", "B": "後驗機率（Posterior）：看到該詞之後，信件是垃圾信的更新後機率", "C": "邊際機率（Marginal Probability）：任一封信含該詞的總機率", "D": "似然（Likelihood）：在已知信件是垃圾信的條件下，出現該詞的機率"}, "answer": "C", "explanation": "答案 C。0.215 是把「垃圾信且含該詞」(0.18) 與「正常信且含該詞」(0.035) 兩種情況加總，也就是任一封信含該詞的總機率，即貝氏定理的分母 P(B)。後驗機率 P(垃圾|含詞)＝0.18÷0.215≈0.837；0.3 是先驗，0.6 與 0.05 是似然。", "per_option": {"A": "先驗是看到證據前的 0.3，不是 0.215。", "B": "後驗是 0.18÷0.215≈0.837，0.215 是它的分母。", "C": "正確：分母＝各種情況下 B 發生的總機率，稱為邊際機率或證據。", "D": "似然是 0.6（垃圾信中含該詞）與 0.05（正常信中含該詞），不是兩者的加權總和。"}, "guide_ref": "學習指引 p.3-5～3-6", "hot": true}, {"no": 3, "section": "3.2", "topic_id": "3.2-01", "topic": "向量矩陣運算", "style": "計算", "stem": "在 Ridge 迴歸中，L2 懲罰項需要用到權重向量的長度。若某模型的權重向量為 w＝[3, −4, 12]，其 L2 範數（‖w‖₂）為何？", "options": {"A": "19：各元素取絕對值後加總", "B": "11：各元素直接相加", "C": "169：各元素平方後加總，未開根號", "D": "13：各元素平方後加總，再開根號"}, "answer": "D", "explanation": "答案 D。‖w‖₂＝√(3²＋(−4)²＋12²)＝√(9＋16＋144)＝√169＝13。19 是 L1 範數（絕對值加總），169 是平方和（尚未開根號）。", "per_option": {"A": "這是 L1 範數 |3|＋|−4|＋|12|＝19，不是 L2。", "B": "直接相加 3−4＋12＝11，沒有任何範數的定義如此。", "C": "169 只是平方和，L2 範數還要開根號。", "D": "正確：√(9＋16＋144)＝13。"}, "guide_ref": "學習指引 p.3-9～3-11", "hot": true, "detail": {"steps": [["① 每個元素平方", "平方 ＝ 元素 × 元素（負數乘負數會變正數，所以平方一定不是負的）", "3² ＝ 3 × 3 ＝ 9；(−4)² ＝ (−4) × (−4) ＝ 16；12² ＝ 12 × 12 ＝ 144"], ["② 平方加總", "平方和 ＝ 各元素的平方全部加起來", "9 ＋ 16 ＋ 144 ＝ 169"], ["③ 開根號", "L2 範數 ‖w‖₂ ＝ √(平方和)（也就是向量的「長度」）", "√169 ＝ 13（因為 13 × 13 ＝ 169），選 D"], ["④ 對照其他選項（怎麼算錯的）", "L1 範數 ＝ 各元素的絕對值相加；L2 範數＝平方和再開根號；兩者都不是「直接相加」", "A：|3| ＋ |−4| ＋ |12| ＝ 3 ＋ 4 ＋ 12 ＝ 19，這是 L1 範數（Lasso 用的）。B：3 ＋ (−4) ＋ 12 ＝ 11，正負號互相抵銷，不是任何範數。C：169 就是步驟②的平方和，少了步驟③開根號"]], "tip": "L2 範數＝先平方、再加總、最後開根號；L1 範數＝絕對值加總。"}}, {"no": 4, "section": "3.2", "topic_id": "3.2-01", "topic": "向量矩陣運算", "style": "情境", "stem": "某分析師以封閉解 θ＝(XᵀX)⁻¹Xᵀy 訓練線性迴歸，但特徵矩陣中「身高（公分）」與「身高（公尺）」兩欄完全成比例。執行 np.linalg.inv(X.T @ X) 時丟出 Singular matrix 的例外訊息。下列哪一種處理最恰當？", "options": {"A": "改用偽逆（np.linalg.pinv）求解，或先刪除其中一個重複欄位", "B": "先對 XᵀX 取轉置再求反矩陣，轉置後的矩陣就會變成可逆", "C": "改用 np.linalg.det 計算行列式，並以行列式取代反矩陣來求解 θ", "D": "先把各特徵欄位做標準化（Z-score），標準化之後兩欄就不再共線"}, "answer": "A", "explanation": "答案 A。兩欄完全成比例使 XᵀX 的行列式為 0、反矩陣不存在。矩陣不可逆時可改用偽逆（pinv）取得最小範數解，或直接移除重複特徵。轉置不改變可逆性；det 回傳的是一個純量而非反矩陣；標準化只改變尺度，完全線性相關的兩欄標準化後仍然相同。", "per_option": {"A": "正確：不可逆時改用偽逆，或移除冗餘特徵。", "B": "轉置不會改變矩陣是否可逆，奇異矩陣轉置後仍是奇異矩陣。", "C": "det 算出的是行列式（單一數字），不是反矩陣，無法用來解 θ。", "D": "標準化後兩欄仍完全線性相關，XᵀX 仍然奇異。"}, "guide_ref": "學習指引 p.3-9～3-11", "hot": true}, {"no": 5, "section": "3.3", "topic_id": "3.3-02", "topic": "非凸與局部最優", "style": "否定", "stem": "關於非凸（Non-convex）函數的最佳化，下列敘述何者錯誤？", "options": {"A": "神經網路的損失函數通常非凸，曲面上可能同時存在多個局部最小值與鞍點", "B": "使用動量並搭配合適的權重初始化，可降低梯度下降停在不佳解的機率", "C": "梯度下降的最終結果可能隨起始點不同而改變", "D": "只要把學習率設得夠小，梯度下降在非凸函數上就保證收斂到全域最佳解"}, "answer": "D", "explanation": "答案 D。非凸函數存在多個局部最小值與鞍點，梯度下降只保證沿著梯度下降到某個梯度為零的點，不保證是全域最佳；把學習率調小只會讓步伐更小，無法使它跳出局部最小值。真正可緩解的是適當初始化、動量與學習率調整策略。", "per_option": {"A": "敘述正確：非凸損失常見多個局部最小值與鞍點。", "B": "敘述正確：動量與適當初始化是常見的緩解手段。", "C": "敘述正確：非凸問題的結果與起始點有關。", "D": "錯誤：學習率調小不能保證全域最佳，反而更容易停在附近的局部最小值。"}, "guide_ref": "學習指引 p.3-20～3-21", "hot": false}, {"no": 6, "section": "3.3", "topic_id": "3.3-03", "topic": "損失函數選擇", "style": "情境", "stem": "某電商搜尋團隊為每個查詢字串訓練模型，替多個候選商品打分，希望相關商品的分數一律高於不相關商品；評估重點是商品之間的相對排序，而不是每個分數的絕對數值。下列哪一種損失函數最符合此需求？", "options": {"A": "均方誤差（MSE）：逐一最小化預測分數與標註分數之間的平方誤差", "B": "重建損失（Reconstruction Loss）：衡量模型輸出與輸入原始資料的差異，用於自編碼器", "C": "排序損失（Ranking Loss）：比較成對或列表中項目的分數，懲罰相關項目排在不相關項目之後", "D": "焦點損失（Focal Loss）：降低容易分類樣本的權重，聚焦難分類樣本，用於類別不平衡"}, "answer": "C", "explanation": "答案 C。排序損失關注資料之間的相對次序，常用於搜尋引擎與推薦系統，剛好對應「相關商品要排在不相關商品之前」。MSE 追求每個分數的絕對值接近標註；重建損失是自編碼器的目標；Focal Loss 處理分類中的類別不平衡。", "per_option": {"A": "MSE 要求絕對分數貼近標註，並未直接約束商品間的相對順序。", "B": "重建損失用於還原輸入（自編碼器、生成模型），與排序無關。", "C": "正確：排序損失直接以相對順序為優化目標。", "D": "Focal Loss 是分類損失，用來處理類別不平衡。"}, "guide_ref": "學習指引 p.3-21～3-23", "hot": true}, {"no": 7, "section": "3.3", "topic_id": "3.3-04", "topic": "小批次梯度下降", "style": "情境", "stem": "某物聯網閘道器的記憶體極小，感測資料以串流方式逐筆抵達且無法保存歷史資料；模型必須在每一筆新資料抵達時立刻更新一次參數，不能等待累積資料。下列哪一種梯度下降策略最符合此限制？", "options": {"A": "全批次梯度下降（Batch GD）：每次更新都使用整份訓練集計算梯度，更新穩定但成本高", "B": "小批次梯度下降（Mini-batch，批次大小 256）：每次更新使用一小批資料，須先累積足夠樣本", "C": "牛頓法（Newton's Method）：利用二階導數矩陣估計曲率，每次更新需要額外的矩陣運算與儲存", "D": "隨機梯度下降（SGD）：每次只用一筆樣本計算梯度並更新，速度快且節省記憶體"}, "answer": "D", "explanation": "答案 D。SGD 每次僅用一筆樣本就能更新，不需保存歷史資料，適合記憶體有限與線上（串流）學習。全批次需要整份資料；小批次要先累積一批才能更新，與「每筆到達就更新」的限制不符；牛頓法需處理 Hessian 矩陣，更不適合極小記憶體。", "per_option": {"A": "全批次需要完整訓練集，串流情境下無法執行。", "B": "小批次必須先累積 256 筆才更新，違反「不能等待累積」的限制。", "C": "牛頓法需要二階導數矩陣，儲存與運算成本更高。", "D": "正確：每次一筆樣本即更新，符合串流與低記憶體需求。"}, "guide_ref": "學習指引 p.3-23～3-24", "hot": false}, {"no": 8, "section": "3.3", "topic_id": "3.3-05", "topic": "動量與 Adam", "style": "情境", "stem": "某工程師使用 Adam 訓練模型，觀察到某些參數的梯度長期偏大、某些參數的梯度長期偏小，但 Adam 會自動讓前者的有效更新步長較小、後者較大。這種逐參數調整步長的行為，主要來自 Adam 的哪一項機制？", "options": {"A": "二階動量：追蹤梯度平方的指數移動平均，並以其平方根作為更新量的分母", "B": "一階動量：累積過去梯度的方向，使方向一致的維度越走越快", "C": "梯度裁剪（Gradient Clipping）：將梯度限制在固定範圍內，避免梯度爆炸", "D": "學習率預熱（Warm-up）：訓練初期從很小的學習率逐步升高到目標值"}, "answer": "A", "explanation": "答案 A。Adam 把梯度平方的移動平均（二階動量，源自 RMSprop 的想法）放在分母，梯度長期偏大的參數分母大、有效步長自然變小，反之則變大，因此達到逐參數自適應。一階動量主要累積方向以加速並減少震盪，並不依參數大小調整步長。", "per_option": {"A": "正確：二階動量當分母，達成每個參數各自的自適應步長。", "B": "一階動量負責累積梯度方向（慣性），不是依梯度大小縮放步長。", "C": "梯度裁剪是對整體梯度設上限，並非逐參數自適應。", "D": "預熱是隨訓練時間調整整體學習率，與各參數梯度大小無關。"}, "guide_ref": "學習指引 p.3-24～3-26", "hot": true}, {"no": 9, "section": "4.1", "topic_id": "4.1-05", "topic": "強化學習的類型", "style": "情境", "stem": "某倉儲機器人在網格地圖中學習導航，每一步只有上、下、左、右四個離散動作。團隊使用的演算法會為每個「狀態－動作對」學習長期期望回報的估計值（Q 值），決策時挑選估計值最高的動作，且不另外學習環境的轉移與回饋模型。這屬於強化學習中的哪一類方法？", "options": {"A": "策略學習（Policy Learning，如策略梯度法）：直接學習從狀態輸出動作（或動作機率）的策略", "B": "價值學習（Value-Based，如 Q-learning）：先學狀態或狀態－動作對的價值，再據此挑動作", "C": "模型式學習（Model-Based）：以學習環境的轉移與回饋機制為核心，用來提升策略更新效率", "D": "監督式學習（Supervised Learning）：依據每一步事先標註好的正確動作來訓練模型"}, "answer": "B", "explanation": "答案 B。先估計每個狀態－動作對的價值（Q 值），再選價值最高的動作，是價值學習的典型做法，Q-learning 即為代表。策略梯度法是直接學策略、不經過價值比較；模型式方法的重點是學環境的轉移與回饋；強化學習不依賴逐步標註的正確動作，而是靠獎勵訊號試誤。", "per_option": {"A": "策略學習直接輸出動作或動作機率，不需先估計每個動作的 Q 值再取最大。", "B": "正確：學習 Q 值並挑最高者，屬價值學習。", "C": "模型式學習強調學習環境本身的轉移與回饋，題幹重點在學價值而非建環境模型。", "D": "強化學習的訓練訊號是獎勵，不是預先標註的正確動作。"}, "guide_ref": "學習指引 p.4-10", "hot": false}, {"no": 10, "section": "4.2", "topic_id": "4.2-04", "topic": "決策樹", "style": "計算", "stem": "某銀行以決策樹評估一個二元特徵的切分品質。父節點共有 16 筆樣本，其中 8 筆違約、8 筆正常；以該特徵切分後，左子節點 8 筆（7 筆違約、1 筆正常），右子節點 8 筆（1 筆違約、7 筆正常）。若以 log₂ 計算熵，此次切分的資訊增益（Information Gain）最接近下列何者？", "options": {"A": "0.28", "B": "0.54", "C": "0.88", "D": "0.46"}, "answer": "D", "explanation": "答案 D。父節點熵＝−(0.5×log₂0.5＋0.5×log₂0.5)＝1。左右子節點的熵相同，均為 −(7/8×log₂(7/8)＋1/8×log₂(1/8))≈0.544，加權平均≈0.544。資訊增益＝1−0.544≈0.46。", "per_option": {"A": "0.28 是基尼不純度的降低量 (0.5−0.219)，不是以熵計算的資訊增益。", "B": "0.54 是子節點的熵，還沒有用父節點的熵去減。", "C": "0.88 是把多數類比例 7/8 誤當成熵，並非任何不純度指標。", "D": "正確：1−0.544≈0.46。"}, "guide_ref": "學習指引 p.4-19～4-21、4-30～4-31", "hot": false, "detail": {"steps": [["① 父節點的熵", "熵 H ＝ −Σ p × log₂(p)（p 是各類別在該節點所占的比例，Σ 是全部類別加起來；熵越大代表越混亂）", "違約比例 p ＝ 8 ÷ 16 ＝ 0.5，正常比例也是 0.5；H ＝ −(0.5 × log₂0.5 ＋ 0.5 × log₂0.5) ＝ −(0.5 × (−1) ＋ 0.5 × (−1)) ＝ 1（log₂0.5 ＝ −1，因為
