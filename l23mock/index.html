開根號，正負兩個都要）", "2－λ ＝ 1 → λ ＝ 1；2－λ ＝ －1 → λ ＝ 3；所以特徵值是 3 與 1，選 B"], ["③ 用「跡」與「行列式」驗算（兩個好用的檢查法）", "跡（對角線元素和）＝ 特徵值的總和；行列式 ＝ 特徵值的乘積", "跡 ＝ 2 ＋ 2 ＝ 4，特徵值總和 ＝ 3 ＋ 1 ＝ 4 ✔；行列式 ＝ 2×2 － 1×1 ＝ 3，特徵值乘積 ＝ 3 × 1 ＝ 3 ✔"], ["④ 對照其他選項（用同一個檢查法）", "正確的一組特徵值必須同時滿足「和 ＝ 跡、積 ＝ 行列式」", "A：2 與 2，和 ＝ 4 看似對，但積 ＝ 2×2 ＝ 4，不等於行列式 3（特徵值等於對角線元素只在對角矩陣成立）。C：4 與 3 是跡與行列式本身，不是特徵值。D：3 與 －1，和 ＝ 3 ＋ (－1) ＝ 2，不等於跡 4；積 ＝ 3 × (－1) ＝ －3，不等於 3"]], "tip": "二階方陣特徵值：和 ＝ 跡、積 ＝ 行列式，兩個條件一解就出來。"}}, {"no": 5, "section": "3.3", "topic_id": "3.3-03", "topic": "損失函數選擇", "style": "情境", "stem": "某連鎖零售業者要預測各分店的「明日銷量」，單店銷量從約 20 件到約 20,000 件不等。業務主管認為「實際 20 件卻只預測 10 件」與「實際 20,000 件卻只預測 10,000 件」同樣嚴重（兩者都只預測到實際值的一半）。若希望訓練時的損失函數也用這種標準看待誤差，應優先選擇下列哪種損失函數？", "options": {"A": "均方對數誤差（MSLE）：先對預測值與實際值取對數（常用 log(1＋x)）再算平方誤差，使損失主要反映兩者倍數上的差距", "B": "均方誤差（MSE）：對誤差進行平方處理，使大誤差產生更大的懲罰與梯度，因此絕對誤差大的高銷量分店會主導整體損失", "C": "平均絕對誤差（MAE）：對誤差進行線性懲罰，梯度近似固定，但仍以絕對差距計算，銷量大的分店其誤差自然佔較高權重", "D": "Huber 損失（Huber Loss）：小誤差採平方、大誤差轉線性，以降低離群值影響，但誤差仍以絕對差距衡量，大小分店並未被同等看待"}, "answer": "A", "explanation": "答案 A。log(1+預測) − log(1+實際) 近似於兩者比值的對數，因此「20 件少預測 10 件」與「20,000 件少預測 10,000 件」的對數差分別約 0.65 與 0.69，損失相近，符合主管要求的標準。MSE、MAE、Huber 都以絕對差距計算，高銷量分店的 10,000 件誤差會遠大於低銷量分店的 10 件誤差並主導訓練。已用 Python 驗算對數差。", "per_option": {"A": "正確：取對數後的差距反映倍數關係，大小分店被同等看待。", "B": "MSE 以絕對誤差平方計算，高銷量分店的誤差（10,000）遠大於低銷量（10），會主導損失。", "C": "MAE 仍是絕對差距，10,000 件的誤差比 10 件的誤差大 1,000 倍，沒有按倍數看待。", "D": "Huber 只是在大誤差處改成線性，衡量方式仍是絕對差距，不能反映倍數關係。"}, "guide_ref": "指引未載（MSLE 為函式庫常見迴歸損失；指引 p.3-21～3-23 載 MSE／MAE／Huber）", "hot": true}, {"no": 6, "section": "3.3", "topic_id": "3.3-04", "topic": "小批次梯度下降", "style": "情境", "stem": "某團隊訓練影像分類器，原本批次大小為 256，驗證準確率為 91%。為了縮短訓練時間，他們把批次大小提高到 16,384（學習率等設定已適度調整），結果訓練損失曲線變得非常平滑、單輪速度大幅提升，訓練準確率也相近，但最終驗證準確率降到 88%。下列何者最能解釋此現象並給出合理的處置？", "options": {"A": "批次越大，梯度的估計越不準確，才使模型在驗證集表現下降；應繼續加大批次，並把學習率再調低，以進一步減少梯度雜訊", "B": "超大批次讓每個 epoch 的參數更新次數大幅減少，只要把 epoch 數同比例拉高就一定能完全回到原本的表現，與泛化能力無關", "C": "超大批次使梯度雜訊變小，缺乏小批次帶來的隨機擾動，較容易收斂到泛化較差的尖銳極小值；可縮小批次，或搭配學習率預熱與正則化補救", "D": "批次大小只影響訓練速度與記憶體用量，不會影響模型最終的泛化表現，驗證準確率下降 3 個百分點純屬隨機誤差，不必處理"}, "answer": "C", "explanation": "答案 C。批次越大，梯度估計越接近全批次梯度，雜訊變小；小批次的雜訊相當於一種隨機擾動，有助於跳出尖銳的極小值，找到較平坦、泛化較好的解（這是大批次訓練常被觀察到的經驗現象，「尖銳極小值」是主流解釋之一，並非嚴格定理；適度調整學習率與預熱可縮小但不一定完全消除落差）。過大批次因此可能出現「訓練表現不差、驗證變差」的泛化落差，可縮小批次，或搭配學習率預熱、正則化、資料增強來補救。", "per_option": {"A": "大批次的梯度估計更準確、雜訊更小，問題不在於雜訊太多。", "B": "只增加 epoch 不保證回到原本表現，且說「一定」「完全」過於絕對；泛化落差與批次大小有關。", "C": "正確：雜訊變小使擾動不足，較容易落入尖銳極小值而泛化變差（經驗觀察，非絕對定理）。", "D": "批次大小會影響優化行為與泛化，不只是速度與記憶體；3 個百分點的穩定落差不宜視為隨機誤差。"}, "guide_ref": "學習指引 p.3-23～3-24（批次過大的泛化現象屬延伸）", "hot": false}, {"no": 7, "section": "3.3", "topic_id": "3.3-05", "topic": "動量與 Adam", "style": "情境", "stem": "某工程師自行實作 Adam 優化器，每步更新量為 m̂ ÷ (√v̂ ＋ ε)（m̂ 為一階動量、v̂ 為二階動量，皆已偏差修正）。他為了讓公式更簡潔，把分母中的 ε 拿掉。訓練一個含有許多死亡神經元的網路時，那些梯度恆為 0 的參數在第一步更新就讓權重變成 NaN，其他參數則一切正常。下列何者最能解釋原因？", "options": {"A": "拿掉 ε 後，一階動量失去衰減作用，累積的梯度越來越大，最終在數值上溢位而成為 NaN，與梯度是否為 0 無關，因此只要降低學習率或加大批次就能完全避免這個問題", "B": "梯度恆為 0 的參數，其一階與二階動量都是 0，更新量變成 0÷0 而產生 NaN；ε 的作用就是讓分母不為 0，維持數值穩定", "C": "拿掉 ε 後，學習率無法隨訓練逐步衰減，後期的更新步伐過大而發散，所有參數最終都應該受到同樣影響", "D": "梯度為 0 本身就會讓權重變成 NaN，與 Adam 的公式無關，這個問題只要加上梯度裁剪就能完全避免"}, "answer": "B", "explanation": "答案 B。梯度恆為 0 時，m̂ 與 v̂ 都為 0，更新量 = 0÷√0，即 0÷0，結果為 NaN。ε（常設 1e-8 左右）加在分母，確保 √v̂ ＋ ε 永遠大於 0，這是 Adam 數值穩定的重要設計，與學習率衰減、動量衰減無關。", "per_option": {"A": "一階動量有衰減係數 β1 控制；題目的 NaN 只出現在梯度恆為 0 的參數，與溢位無關。", "B": "正確：0÷0 產生 NaN，ε 防止分母為 0。", "C": "ε 不負責學習率衰減；若是學習率過大，所有參數都會受影響，與題目只有零梯度參數出問題不符。", "D": "梯度為 0 時 SGD 只會讓權重不變；NaN 來自公式中的 0÷0，而梯度裁剪不能解決它。"}, "guide_ref": "學習指引 p.3-24～3-26（ε 細節屬延伸）", "hot": true}, {"no": 8, "section": "3.3", "topic_id": "3.3-08", "topic": "梯度裁剪", "style": "情境", "stem": "某工程師訓練 RNN 時，為了在有限的 GPU 記憶體下等效使用 4 倍批次，採用梯度累積：每個小批次各自執行 loss.backward()，累積滿 4 個小批次後才執行一次 optimizer.step() 更新權重。他同時想用梯度裁剪（clip_grad_norm_）避免梯度爆炸。下列哪一種做法最適當？", "options": {"A": "在每個小批次的 loss.backward() 之後都立刻裁剪一次，累積滿 4 次後直接 optimizer.step()，不需要再處理，因為每份梯度都已被限制在安全範圍內", "B": "在 optimizer.step() 之後才裁剪梯度，這樣下一輪累積開始前，梯度就已經被限制在安全範圍內，能避免下一次更新過大", "C": "在 optimizer.zero_grad() 之後、下一輪 backward 之前裁剪，因為清零之後才能確定梯度的最終大小並進行限制", "D": "累積滿 4 個小批次後、optimizer.step() 之前，對累積後的總梯度裁剪一次，再更新權重並清零梯度"}, "answer": "D", "explanation": "答案 D。梯度裁剪要限制的是「實際拿來更新權重的梯度」，在梯度累積時就是累積後的總梯度，所以應在累積完成、optimizer.step() 之前裁剪一次。A 把每份梯度分別裁剪再相加，總範數最多可達 4 倍的門檻，也改變了等效大批次的梯度方向；B 在更新之後裁剪已來不及；C 清零後梯度為 0，裁剪沒有意義。", "per_option": {"A": "各份梯度分別裁剪後再相加，總範數可能超過門檻，並扭曲等效大批次的梯度。", "B": "step() 已經用過未裁剪的梯度更新權重，事後裁剪來不及防止爆炸。", "C": "zero_grad() 之後梯度為 0（或 None），沒有東西可裁剪。", "D": "正確：裁剪累積後的總梯度，再 step() 與清零。"}, "guide_ref": "學習指引 p.3-27（梯度累積情境屬延伸）", "hot": false}, {"no": 9, "section": "4.1", "topic_id": "4.1-04", "topic": "強化學習", "style": "情境", "stem": "某倉儲機器人以強化式學習尋找從出貨口到貨架的路徑。訓練初期代理人會隨機嘗試各種走法，但訓練到一半後，工程師發現它幾乎只走第一次找到的那條可行路線（共 40 步），環境中其實存在只需 25 步的路線卻從未被嘗試。獎勵設計與環境模擬器都已確認沒有問題。下列何者最可能是原因與合理的處置？", "options": {"A": "探索不足：策略太早偏向「利用」已知可行路線，應維持較高的探索率並放慢其衰減（如 ε-greedy 的 ε），或加入探索獎勵，讓代理人持續嘗試新動作", "B": "報酬過於稀疏：應把折扣因子設為 0，讓代理人只在乎當下這一步的報酬，才能更快找到最短路徑，同時減少需要評估的未來狀態數量，並讓代理人更容易學會多步之後才有獎勵的路徑", "C": "學習率過低：只要把學習率調大 10 倍，就能保證代理人收斂到全域最佳路線，不需要再調整任何探索相關的設定", "D": "代理人缺少標準答案：應改為蒐集人工標註的最短路徑，再以監督式學習取代強化式學習，因為強化式學習無法找到最佳路徑"}, "answer": "A", "explanation": "答案 A。強化式學習需要在「探索」（嘗試未知動作以發現更好的策略）與「利用」（採用目前已知最佳動作）之間取得平衡。ε 衰減太快或探索不足，代理人會被困在第一個找到的次佳策略。處置是維持適度探索，例如放慢 ε 衰減、加入探索獎勵。折扣因子設 0 會讓代理人變得短視，更難學到需要多步才拿到獎勵的路徑。", "per_option": {"A": "正確：探索不足使策略困在次佳路線，需保持探索。", "B": "折扣因子為 0 代表只看立即報酬，會讓代理人更短視，不利於找出多步路徑。", "C": "調大學習率不能保證收斂到全域最佳，也無法解決沒有嘗試新動作的問題。", "D": "強化式學習的目標就是在沒有標準答案下透過試誤找到好策略，並非無法找到最佳路徑。"}, "guide_ref": "學習指引 p.4-9～4-11（探索與利用屬延伸）", "hot": false}, {"no": 10, "section": "4.2", "topic_id": "4.2-07", "topic": "XGBoost", "style": "否定", "stem": "關於 XGBoost 的運作與特性，下列敘述何者錯誤？", "options": {"A": "目標函數除了預測損失外，還加入對葉節點數量與葉節點權重大小的正則化項，用來抑制每棵樹變得過度複雜", "B": "尋找分裂點時同時使用損失函數的一階導數（梯度）與二階導數（Hessian）資訊，讓分裂增益的評估更精確", "C": "預設的樹成長方式是葉子優先（Leaf-wise）：每次只挑選全樹中增益最大的單一葉子分裂，同一深度的其他葉子可能完全不被考慮", "D": "支援稀疏資料，並以 Block 結構與多核心 CPU 或 GPU 並行加速單棵樹的分裂點搜尋，提升大資料下的訓練速度，適合處理含大量零值的特徵"}, "answer": "C", "explanation": "答案 C（錯誤的敘述）。XGBoost 預設採層級式成長（Level-wise）：同一深度的所有葉節點一起考慮分裂，逐層長到深度上限；葉子優先（Leaf-wise，每次只分裂全樹增益最大的單一葉子）是 LightGBM 的預設方式。A、B、D 分別為正則化、二階導數與並行／稀疏支援，都是 XGBoost 相對 GBDT 的特色。", "per_option": {"A": "正確敘述：葉節點數與葉權重的 L1／L2 懲罰是 XGBoost 的正則化項。", "B": "正確敘述：使用梯度與 Hessian 計算分裂增益。", "C": "錯誤敘述：XGBoost 預設是層級式（Level-wise）成長，葉子優先是 LightGBM 的預設。", "D": "正確敘述：Block 結構與多核／GPU 並行加速分裂點搜尋，並支援稀疏資料。"}, "guide_ref": "學習指引 p.4-22～4-24", "hot": true}, {"no": 11, "section": "4.2", "topic_id": "4.2-13", "topic": "樸素貝氏", "style": "情境", "stem": "某工廠要用樸素貝氏分類器，依「馬達溫度（℃）」、「振動幅度（mm/s）」、「電流（A）」三個連續數值的感測器特徵，預測設備狀態為「正常」、「預警」或「故障」。工程師需要選擇樸素貝氏的變體，下列何者最適當？", "options": {"A": "多項式樸素貝氏（Multinomial Naive Bayes）：以特徵出現的次數或頻率建模，常用於詞頻、計數資料的文本分類", "B": "伯努利樸素貝氏（Bernoulli Naive Bayes）：特徵為「是否出現」的 0／1 二元值，常用於詞彙有無的短文本分類", "C": "類別型樸素貝氏（Categorical Naive Bayes）：假設每個特徵只能取有限個離散類別，直接統計各類別值出現的頻率來估計機率", "D": "高斯樸素貝氏（Gaussian Naive Bayes）：假設各特徵在每個類別下近似常態分佈，以平均數與變異數估計 P(x|類別)"}, "answer": "D", "explanation": "答案 D。三個特徵都是連續數值，高斯樸素貝氏假設每個特徵在各類別下服從常態分佈，用該類別的平均數與變異數估計似然。多項式與伯努利適合計數或二元特徵（如詞頻、詞彙有無），類別型適合離散類別特徵。樸素貝氏對輸入的分佈假設敏感，因此要依特徵型態選對變體。", "per_option": {"A": "多項式變體用於計數／頻率資料，不是連續的感測器數值。", "B": "伯努利變體要求特徵為 0／1，連續數值需先二值化才能用，且會損失資訊。", "C": "類別型變體針對有限離散類別，連續數值需先分箱，並非最直接的選擇。", "D": "正確：連續特徵用高斯樸素貝氏，以常態分佈估計似然。"}, "guide_ref": "學習指引 p.4-34～4-36（變體選擇屬延伸）", "hot": false}, {"no": 12, "section": "4.2", "topic_id": "4.2-14", "topic": "K-means", "style": "情境", "stem": "某電商用 K-means 對顧客分群，嘗試 K＝1 到 7，記錄群內平方和（SSE）：K＝1 為 980、K＝2 為 600、K＝3 為 240、K＝4 為 215、K＝5 為 200、K＝6 為 190、K＝7 為 182。依手肘法（Elbow Method），下列何者最適當？", "options": {"A": "選 K＝7，因為 SSE 最小，代表群內最緊密、分群效果最好，沒有任何理由選擇更小的 K", "B": "選 K＝3，因為 K＝3 之後 SSE 的下降幅度驟減（K＝3→4 只降 25），再增加群數的邊際效益很小", "C": "選 K＝2，因為 K＝1→2 的 SSE 降幅最大（380），代表第一次分群帶來的改善最顯著，之後的降幅都比它小", "D": "無法用 SSE 判斷 K，因為 K-means 的 SSE 會隨 K 增加而單調下降，手肘法必須搭配輪廓係數，單看 SSE 完全不能使用"}, "answer": "B", "explanation": "答案 B。SSE 隨 K 增加必然單調下降（K 等於樣本數時為 0），所以不能選最小的；手肘法找的是曲線由陡轉平的轉折點。降幅依序為 380、360、25、15、10、8，K＝3 之後降幅驟減，K＝3 即為手肘點。已用 Python 計算降幅。", "per_option": {"A": "SSE 隨 K 單調下降，取最小值會一路選到 K＝樣本數，失去分群意義。", "B": "正確：K＝3 為曲線由陡轉平的轉折點。", "C": "只看第一步降幅最大並不是手肘；K＝2→3 仍降了 360，之後才驟減。", "D": "SSE 單調下降正是手肘法使用的前提，觀察降幅轉折即可判斷，不是完全不能用。"}, "guide_ref": "學習指引 p.4-41～4-42（手肘法屬延伸）", "hot": false}, {"no": 13, "section": "4.2", "topic_id": "4.2-16", "topic": "DBSCAN", "style": "情境", "stem": "某資安團隊要用 DBSCAN 對網路連線紀錄分群，已決定 MinPts＝5，但不知道鄰域半徑 Eps 該設多少。他們想在正式分群之前，先依資料本身的分佈找出合理的 Eps 起點。下列哪一種做法最適當？", "options": {"A": "k-距離圖（k-distance Plot）：計算每個點到第 k 個最近鄰（k 取 MinPts）的距離，由小到大排序後畫成曲線，取曲線明顯彎折處的距離作為 Eps 的參考", "B": "手肘法（Elbow Method）：嘗試不同群數並畫出群內平方和，取下降趨緩的轉折點作為 Eps，因為群內平方和同樣能反映鄰域半徑的大小", "C": "輪廓係數（Silhouette Coefficient）：先任意設定 Eps 完成分群後計算係數，若超過 0.5 就視為 Eps 已合理，不需再依資料的距離分佈調整，輪廓係數越高代表分群越好", "D": "將所有點兩兩之間的距離取平均數後，直接當作 Eps，因為平均距離最能代表資料點彼此靠近的典型程度，也就是合理的鄰域大小"}, "answer": "A", "explanation": "答案 A。常用的 Eps 選法是 k-距離圖：每個點取到第 k 個最近鄰的距離（k 常取 MinPts），排序畫圖，曲線由平緩轉為陡升的彎折處，大致就是「正常點」與「離群點」距離的分界，可作為 Eps 的起點。手肘法用來挑 K-means 的群數；輪廓係數必須先完成分群才算得出；全體平均距離往往遠大於局部鄰域，會把大多數點併成一群。", "per_option": {"A": "正確：k-距離圖的彎折處是 Eps 的常用參考。", "B": "手肘法挑的是 K-means 群數 K，DBSCAN 沒有質心與群內平方和，Eps 不是群數。", "C": "輪廓係數要先分群才能算，且不能用單一門檻取代對距離分佈的檢視。", "D": "全體平均距離遠大於局部鄰域尺度，Eps 過大會把幾乎所有點併成一群。"}, "guide_ref": "學習指引 p.4-43～4-44（Eps 選法屬延伸）", "hot": false}, {"no": 14, "section": "4.2", "topic_id": "4.2-20", "topic": "異常偵測", "style": "情境", "stem": "某物流公司分析配送車輛的 GPS 資料，市區路段的點分佈非常密集，郊區路段的點則本來就比較稀疏。工程師想找出異常的軌跡點，卻發現若以整體資料的 Z-score（距離平均超過 3 個標準差視為異常）判斷，郊區大量正常的稀疏點被誤判為異常，而市區附近一些真正偏離的點卻被漏掉。下列哪種方法最能改善這個問題？", "options": {"A": "維持全域 Z-score，但把門檻提高到 5 個標準差：門檻越高，被誤判的正常點越少，也不會漏掉市區附近真正偏離的點，不需要更換任何偵測方法", "B": "計算所有點到全體質心的歐氏距離並排序，取距離最大的前 1% 視為異常，因為距離質心越遠就越不正常", "C": "先把資料標準化後，再計算同一個全域 Z-score：標準化之後，各區域之間的密度差異就會消失，不再影響判斷", "D": "局部離群因子（LOF）：比較每個點與其近鄰的局部密度，局部密度明顯低於鄰居的點才視為異常，因此能適應市區與郊區不同的密度"}, "answer": "D", "explanation": "答案 D。問題的根源是「正常」的密度因區域而異，全域統計量（平均、標準差、到質心的距離）無法反映局部差異。LOF 比較一個點與其近鄰的局部密度，只有密度明顯低於鄰居的點才算異常，因此郊區稀疏但彼此相似的點不會被誤判。提高門檻、取質心距離前 1%、標準化都仍是全域判斷。", "per_option": {"A": "提高門檻只會讓更多真正的偏離點被漏掉，不能處理密度不均。", "B": "到全體質心的距離仍是全域標準，郊區點離質心遠會被誤判。", "C": "標準化是線性轉換，不會消除區域之間的密度差異。", "D": "正確：LOF 以局部密度比較，能同時適應疏密不同的區域。"}, "guide_ref": "學習指引 p.4-50～4-53（LOF 屬延伸）", "hot": false}, {"no": 15, "section": "4.3", "topic_id": "4.3-02", "topic": "激活函數與輸出層", "style": "情境", "stem": "某團隊建立神經網路，預測某裝置電池的「剩餘電量比例」，目標值介於 0 與 1 之間（0＝沒電、1＝滿電）。他們希望模型本身輸出的預測值就不會超出這個合理範圍，而不是事後再手動截斷。輸出層應如何設計較為適當？", "options": {"A": "1 個神經元搭配線性激活（不加激活函數）：迴歸任務一律使用線性輸出，輸出值可以是任意實數，再交由後處理決定如何處理超出範圍的數值", "B": "1 個神經元搭配 ReLU：ReLU 能保證輸出為非負值，只要訓練資料的目標值都不大於 1，模型的預測值就不會超過 1", "C": "1 個神經元搭配 Sigmoid，輸出落在 0 到 1 之間", "D": "1 個神經元搭配 Softmax：Softmax 的輸出介於 0 到 1 之間，且可解釋為機率，所以對單一輸出神經元使用就能得到 0 到 1 的預測值"}, "answer": "C", "explanation": "答案 C。Sigmoid 把任意實數壓縮到 (0, 1)，適合值域固定在 0 到 1 的比例型目標，且模型本身就不會輸出範圍外的值。線性輸出沒有上下界；ReLU 只有下界、沒有上界，仍可能超過 1；單一神經元的 Softmax 輸出恆為 1，沒有資訊量。", "per_option": {"A": "線性輸出沒有上下界，無法滿足「模型本身輸出就不超出範圍」的需求。", "B": "ReLU 只保證非負，沒有上界；訓練資料的最大值不能限制模型輸出。", "C": "正確：Sigmoid 輸出 (0,1)，符合值域固定的比例型目標。", "D": "只有一個神經元時 Softmax 的輸出恆為 1，無法表達 0 到 1 的變化。"}, "guide_ref": "學習指引 p.4-57～4-58、4-65", "hot": true}, {"no": 16, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "否定", "stem": "關於 1×1 卷積（Pointwise Convolution）在 CNN 中的用途，下列敘述何者錯誤？", "options": {"A": "可在每個空間位置上對各通道做線性組合，因此能用來增加或減少特徵圖的通道數，而不改變特徵圖的高度與寬度", "B": "因為卷積核只有 1×1，所以完全不會融合不同通道的資訊，只能對單一通道的每個像素各自縮放數值", "C": "搭配非線性激活函數時，也能為網路增加非線性表達能力，且參數量只有「輸入通道×輸出通道＋輸出通道」", "D": "常被放在 3×3 卷積之前先降低通道數（瓶頸結構），以減少後續卷積的參數量與運算量"}, "answer": "B", "explanation": "答案 B（錯誤的敘述）。1×1 卷積的核雖然在空間上只有一個點，但會跨越所有輸入通道（核形狀為 1×1×輸入通道），對每個位置的各通道做加權組合，因此是在融合通道資訊。它不改變空間大小、可改變通道數，參數量為 輸入通道×輸出通道＋輸出通道，常用於 ResNet、Inception 等的瓶頸設計。", "per_option": {"A": "正確敘述：1×1 卷積可調整通道數，空間尺寸不變。", "B": "錯誤敘述：1×1 卷積會跨所有通道做線性組合，正是跨通道融合資訊。", "C": "正確敘述：加上激活函數增加非線性，參數量公式也正確。", "D": "正確敘述：瓶頸結構先降維，再做 3×3 卷積，可節省參數與運算。"}, "guide_ref": "學習指引 p.4-67～4-71（1×1 卷積屬延伸）", "hot": true}, {"no": 17, "section": "4.3", "topic_id": "4.3-08", "topic": "ResNet", "style": "計算", "stem": "某殘差區塊的輸出為 ReLU(x ＋ F(x))，也就是先把捷徑輸入 x 與卷積分支的輸出 F(x) 逐元素相加，再通過 ReLU。已知某位置的 x＝[3, −2, 1, −4]，F(x)＝[−1, 1, −2, 5]，則該區塊的輸出為何？", "options": {"A": "[2, 0, 0, 1]：先逐元素相加得 [2, −1, −1, 1]，再把負值截為 0", "B": "[2, −1, −1, 1]：只做逐元素相加，忽略了相加之後還要再通過 ReLU 的步驟", "C": "[3, 1, 1, 5]：先分別對 x 與 F(x) 各套 ReLU，再把兩者逐元素相加，順序與題目所述相反", "D": "[0, 1, 0, 5]：只取卷積分支 F(x) 經 ReLU 的結果，捷徑的輸入 x 沒有加入計算"}, "answer": "A", "explanation": "答案 A。x ＋ F(x) = [3−1, −2+1, 1−2, −4+5] = [2, −1, −1, 1]；再套 ReLU（負值變 0）得 [2, 0, 0, 1]。B 漏了 ReLU；C 先 ReLU 再相加，與「相加之後再 ReLU」不同；D 忽略捷徑 x，等於沒有殘差連接。已用 NumPy 驗算。", "per_option": {"A": "正確：[2,−1,−1,1] 經 ReLU 為 [2,0,0,1]。", "B": "沒有套用 ReLU，負值應變成 0。", "C": "順序反了：題目是先相加再 ReLU，ReLU(x)＋ReLU(F) 的結果不同。", "D": "忽略了捷徑連接的 x，殘差區塊的輸出必須包含 x。"}, "guide_ref": "學習指引 p.4-71～4-72", "hot": true, "detail": {"steps": [["① 先逐元素相加（殘差區塊的「殘差連接」：捷徑輸入 x 加上卷積分支輸出 F(x)）", "sᵢ ＝ xᵢ ＋ F(x)ᵢ（逐元素＝兩個向量同一個位置的數字各自相加；i 是位置編號）", "x ＝ [3, －2, 1, －4]，F(x) ＝ [－1, 1, －2, 5]：s ＝ [3＋(－1), －2＋1, 1＋(－2), －4＋5] ＝ [2, －1, －1, 1]"], ["② 再套 ReLU（修正線性單元：負的變 0，正的不變）", "ReLU(s) ＝ max(0, s)（max 是取兩者中較大的）", "max(0, 2) ＝ 2；max(0, －1) ＝ 0；max(0, －1) ＝ 0；max(0, 1) ＝ 1 → 輸出 ＝ [2, 0, 0, 1]，選 A"], ["③ 對照其他選項（各自算錯在哪）", "順序是「先相加、再 ReLU」，顛倒或漏掉都會不同", "B：[2, －1, －1, 1] 只做了第①步，沒有 ReLU，負值還在。C：先各自 ReLU 再相加：ReLU(x) ＝ [3, 0, 1, 0]，ReLU(F) ＝ [0, 1, 0, 5]，相加 ＝ [3, 1, 1, 5]，順序反了。D：只取 ReLU(F) ＝ [0, 1, 0, 5]，沒有加上捷徑的 x"]], "tip": "殘差區塊：輸出 ＝ ReLU(x ＋ F(x))，先相加、再把負值截成 0。"}}, {"no": 18, "section": "4.3", "topic_id": "4.3-09", "topic": "RNN 與 LSTM", "style": "情境", "stem": "某公司有兩項序列任務：任務一是離線處理客服通話逐字稿，替「每一個詞」標註所屬的情緒標籤（整份逐字稿已完整取得）；任務二是即時預測機台「下一秒」的振動值（預測當下只能取得已經發生的資料）。工程師考慮使用雙向 LSTM（Bidirectional LSTM）。下列判斷何者最適當？", "options": {"A": "兩項任務都適合，因為雙向 LSTM 的兩個方向可以平行計算，推論時間一定比單向 LSTM 更短，也不會增加參數量", "B": "兩項任務都不適合，因為雙向 LSTM 只能用於影像資料，序列資料必須使用單向 LSTM 才能保留時間順序", "C": "只有任務二適合，因為即時預測需要同時參考過去與未來兩個方向的資訊，才能提高下一秒預測的準確度", "D": "只有任務一適合：整段序列已知，每個位置都能同時利用前後文；任務二預測時看不到未來資料，反向分支無法使用"}, "answer": "D", "explanation": "答案 D。雙向 LSTM 由一個正向與一個反向 LSTM 組成，每個時間步能同時使用前文與後文，前提是整段序列已經取得，所以適合離線的序列標註。即時預測下一秒時，未來資料根本不存在，反向分支沒有輸入可用，使用雙向結構既不合理也會造成資訊洩漏的錯誤設計。", "per_option": {"A": "雙向結構要多跑一個方向，參數量與計算量都約為單向的兩倍，並不會更快。", "B": "雙向 LSTM 本來就是用來處理文字、語音等序列資料，不是只能用於影像。", "C": "即時預測時未來資料尚未發生，無法提供給反向分支。", "D": "正確：離線標註已取得完整序列可用雙向，即時預測看不到未來不適用。"}, "guide_ref": "學習指引 p.4-72～4-76（雙向結構屬延伸）", "hot": false}, {"no": 19, "section": "4.3", "topic_id": "4.3-12", "topic": "注意力機制", "style": "情境", "stem": "某團隊用 Transformer 的編碼器—解碼器架構做中翻英。解碼器在逐字產生英文譯文時，每一步都需要「回頭參考」中文來源句中最相關的部分。這個功能主要由解碼器中的哪個機制負責？", "options": {"A": "遮罩自注意力（Masked Self-Attention）：讓每個位置只能看到已生成的前面的詞，Q、K、V 都來自解碼器自己，用來維持自迴歸的因果順序", "B": "交叉注意力（Cross-Attention）：Q 來自解碼器目前的表示，K 與 V 來自編碼器對來源句的輸出，使每個譯文詞能對來源句各位置分配權重", "C": "編碼器自注意力（Encoder Self-Attention）：來源句內各詞兩兩計算關聯並產生上下文表示，但發生在編碼階段，不隨譯文逐字生成而進行", "D": "位置編碼（Positional Encoding）：把詞的順序資訊加到詞嵌入上，讓模型得知來源句與譯文中各詞的前後位置關係"}, "answer": "B", "explanation": "答案 B。編碼器—解碼器注意力（交叉注意力）中，Q 來自解碼器，K 與 V 來自編碼器輸出，解碼器每生成一個詞，就能依相關程度對來源句各位置加權取資訊。遮罩自注意力只處理已生成的譯文，不看來源句；編碼器自注意力只在來源句內部；位置編碼只提供順序資訊，不負責跨句對齊。", "per_option": {"A": "遮罩自注意力只看已生成的譯文，不接觸來源句。", "B": "正確：交叉注意力以解碼器的 Q 去查詢編碼器輸出的 K、V。", "C": "編碼器自注意力只處理來源句內部，且在編碼階段完成。", "D": "位置編碼只加入順序資訊，不能讓譯文詞對來源句加權取資訊。"}, "guide_ref": "學習指引 p.4-76～4-83（交叉注意力屬延伸）", "hot": true}, {"no": 20, "section": "4.3", "topic_id": "4.3-14", "topic": "遷移學習", "style": "情境", "stem": "某團隊微調預訓練影像模型做瑕疵分類：他們把原本的輸出層換成隨機初始化的新分類層後，直接解凍所有層一起訓練。結果第一個 epoch 損失劇烈波動，最終驗證準確率甚至低於「只訓練新分類層」的做法。下列哪種訓練流程最能避免這個問題？", "options": {"A": "維持全部解凍，但把學習率調高 10 倍，讓新分類層更快收斂，預訓練的各層也能同步適應新資料，整體只需要訓練一次、不必分階段進行", "B": "把所有預訓練層的權重重新隨機初始化，避免舊特徵干擾新分類層的學習，再從頭開始訓練整個網路", "C": "分兩階段：先凍結預訓練層、只訓練新分類層使其收斂；再解凍部分或全部預訓練層，以很小的學習率一起微調", "D": "只訓練新分類層，並且永遠不解凍任何預訓練層，因為只要解凍就一定會破壞預訓練特徵而降低準確率"}, "answer": "C", "explanation": "答案 C。隨機初始化的新分類層一開始輸出很差，產生的大梯度會往回傳，破壞預訓練層已學好的通用特徵。常見做法是兩階段：先凍結主幹、只訓練新頭使其收斂，再解凍並用很小的學習率微調。調大學習率會更破壞特徵；重新隨機初始化等於放棄遷移學習；永遠凍結則可能錯失微調帶來的提升，且「一定會降低」過於絕對。", "per_option": {"A": "學習率調大會讓預訓練層更容易被破壞，波動只會更嚴重。", "B": "重新隨機初始化就失去預訓練的優勢，不是遷移學習。", "C": "正確：先訓練新頭，再用小學習率微調，是常用的兩階段做法。", "D": "永遠凍結並非必要；資料足夠時微調常能進一步提升，「一定降低」是過度絕對的說法。"}, "guide_ref": "學習指引 p.4-82", "hot": true}, {"no": 21, "section": "4.3", "topic_id": "4.3-19", "topic": "程式碼閱讀：深度學習", "style": "情境", "stem": "某工程師用 PyTorch 建立二元分類器（X 為特徵張量，y 為形狀 (N, 1) 的 0／1 浮點標籤），執行訓練時損失無法正常計算。程式碼如下：\n```\nmodel = nn.Sequential(nn.Linear(10, 16), nn.ReLU(), nn.Linear(16, 1))\nloss_fn = nn.BCELoss()\nloss = loss_fn(model(X), y)\n```\n下列何者最能說明問題與修正方式？", "options": {"A": "ReLU 不適合用於二元分類的隱藏層，隱藏層必須改成 Sigmoid，BCELoss 才能正常計算損失，其他部分不需要調整", "B": "最後一層應改成 nn.Linear(16, 2)，因為二元分類需要兩個輸出神經元，各自對應一個類別，BCELoss 才能計算", "C": "BCELoss 只能用於多類別分類，二元分類應改用 nn.CrossEntropyLoss，並且在輸出層後面額外加上 Softmax", "D": "nn.BCELoss 要求輸入已是 0 到 1 的機率，但最後一層輸出的是未經轉換的原始分數；應在最後加上 nn.Sigmoid()，或改用 BCEWithLogitsLoss"}, "answer": "D", "explanation": "答案 D。nn.BCELoss 的輸入必須是 0 到 1 之間的機率，但最後一層 Linear(16, 1) 輸出的是可正可負的原始分數（logits），超出範圍會報錯或造成數值異常。修正方式有二：在最後加 nn.Sigmoid()，或改用內含 Sigmoid 且數值更穩定的 nn.BCEWithLogitsLoss（此時模型最後不再加 Sigmoid）。隱藏層用 ReLU 沒有問題。", "per_option": {"A": "隱藏層用 ReLU 沒有問題，問題在輸出的值域。", "B": "BCELoss 搭配單一輸出神經元即可；兩個輸出神經元是另一種 CrossEntropyLoss 的作法。", "C": "BCELoss 正是用於二元分類；CrossEntropyLoss 內含 Softmax，也不應再額外加 Softmax。", "D": "正確：BCELoss 要機率輸入，需加 Sigmoid 或改用 BCEWithLogitsLoss。"}, "guide_ref": "指引未載（程式碼閱讀）", "hot": false, "detail": {"steps": [["① BCELoss 的公式（BCE ＝ Binary Cross Entropy，二元交叉熵）", "損失 ＝ －[ y × log(p) ＋ (1－y) × log(1－p) ]（y 是正確答案 0 或 1；p 是模型預測「是 1」的機率，必須介於 0 與 1 之間，因為 log 的括號裡不能是 0 或負數）", "題目的模型最後一層是 nn.Linear(16, 1)，輸出的是「原始分數」（logit），可以是任何正負數，不是機率"], ["② 為什麼原始分數會出問題", "損失 ＝ －[ y × log(p) ＋ (1－y) × log(1－p) ]（y 是正確答案 0 或 1；p 是模型預測「是 1」的機率，必須介於 0 與 1 之間，因為 log 的括號裡不能是 0 或負數；BCELoss 會直接把模型輸出當成 p）", "舉例（題目沒給數字）：若 p ＝ 1.5，則 1－p ＝ －0.5，log(－0.5) 算不出來，損失就壞掉"], ["③ 修正：用 Sigmoid 把原始分數壓進 0～1", "Sigmoid：σ(z) ＝ 1 ÷ (1＋e⁻ᶻ)，不管 z 多大多小，結果都落在 0 與 1 之間", "舉例（題目沒給數字）：z ＝ 2 → σ(2) ＝ 1 ÷ (1＋e⁻²) ≈ 0.88，是合法的機率。做法有兩種：在最後加 nn.Sigmoid()，或改用內含 Sigmoid 的 nn.BCEWithLogitsLoss（此時模型最後不用再加 Sigmoid），選 D"], ["④ 對照其他選項", "問題在「輸出的值域」，不在隱藏層或輸出個數", "A：隱藏層用 ReLU 沒問題。B：BCELoss 本來就搭配單一輸出神經元；兩個輸出是 CrossEntropyLoss 的作法。C：BCELoss 正是二元分類用的；CrossEntropyLoss 已內含 Softmax，不用再額外加"]], "code": [["model = nn.Sequential(...)", "model＝模型；nn＝neural network（神經網路）模組；Sequential＝「依序的」，括號裡的層會照順序一層接一層，上一層的輸出就是下一層的輸入"], ["nn.Linear(10, 16)", "Linear＝線性層（全連接層），做 輸出 ＝ 輸入 × 權重 ＋ 偏差。(10, 16) ＝ 輸入有 10 個特徵、輸出 16 個數字（16 個神經元）"], ["nn.ReLU()", "ReLU＝修正線性單元，負數變 0、正數不變，給模型加入「非線性」。這是隱藏層的標準用法，沒有問題"], ["nn.Linear(16, 1)", "輸入 16 個數字、輸出 1 個數字。二元分類只需要一個輸出（代表「是 1 的可能性」）。但這個數字是原始分數（logit），可正可負，還沒有變成機率——問題就在這裡"], ["loss_fn = nn.BCELoss()", "loss_fn＝損失函數；BCE＝Binary Cross Entropy（二元交叉熵）；Loss＝損失。它要求第一個參數（預測值）已經是 0～1 之間的機率"], ["loss = loss_fn(model(X), y)", "model(X)＝把特徵 X 丟進模型，得到預測（這裡是原始分數）；y＝正確答案（0 或 1 的浮點數，形狀 (N, 1) 要和預測一致）；loss_fn(預測, 答案)＝比較兩者，算出「錯多少」。因為預測不是機率，這行算不出正常的損失"]], "tip": "BCELoss 要吃「機率」；模型最後輸出原始分數就要加 Sigmoid，或直接用 BCEWithLogitsLoss。"}}, {"no": 22, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "情境", "stem": "某團隊以 TF-IDF 把客服文字轉成 5 萬維的稀疏矩陣（絕大多數元素為 0，已用稀疏格式儲存以節省記憶體），要餵給線性 SVM。他們想把各特徵縮放到相近尺度，但不希望縮放後原本的 0 變成非 0，導致矩陣膨脹成稠密矩陣、記憶體爆量。下列哪種做法最適當？", "options": {"A": "MaxAbs 縮放（MaxAbsScaler）：將每個特徵除以其絕對值的最大值，縮放到 [−1, 1]，0 仍為 0，不破壞稀疏結構", "B": "標準化（StandardScaler，含平均數置中）：每個特徵減去平均數再除以標準差，使平均為 0、標準差為 1；置中後原本的 0 會變成非 0 值", "C": "Box-Cox 轉換（Box-Cox Transformation）：以最大概似法找出最佳冪次參數，使分佈更接近常態，但要求輸入必須為嚴格正值", "D": "Yeo-Johnson 轉換（Yeo-Johnson Transformation）：可處理含 0 與負值的資料並自動尋找冪次，但目的在改變分佈形狀，而不是縮放到相近尺度"}, "answer": "A", "explanation": "答案 A。稀疏矩陣的關鍵是保持 0 不變。MaxAbsScaler 只做除法（除以各特徵絕對值最大值），0÷任何數仍為 0，因此稀疏性完整保留。標準化預設的「減平均數」會把 0 變成非 0，使稀疏矩陣變稠密；Box-Cox 要求嚴格正值，無法處理 0；Yeo-Johnson 目的在改變分佈形狀，並非把特徵縮放到相近尺度。", "per_option": {"A": "正確：只除不減，0 仍為 0，稀疏結構不變。", "B": "置中把 0 變成非 0，稀疏矩陣會被迫變稠密。", "C": "Box-Cox 要求嚴格正值，稀疏矩陣大量的 0 不符合要求，且目的不是縮放。", "D": "Yeo-Johnson 是改變分佈形狀的轉換，不是縮放到相近尺度，也不保證保持稀疏。"}, "guide_ref": "學習指引 p.5-6～5-8（MaxAbs 縮放屬延伸）", "hot": true}, {"no": 23, "section": "5.1", "topic_id": "5.1-02", "topic": "PCA 與降維", "style": "情境", "stem": "某材料實驗室蒐集感測資料，二維散布圖中，合格品集中在中心附近，不良品則呈環狀分佈在外圈（兩類的中心點幾乎重合）。團隊想先把資料降成 1 維作為後續分類器的輸入，且上線後必須能對新進資料套用同一個轉換。下列哪種降維方式最適當？", "options": {"A": "線性判別分析（LDA）：找出使類間距離最大、類內距離最小的線性投影方向，需要類別標籤，保證兩類在降維後能被分開", "B": "一般 PCA 取第一主成分：投影到變異最大的線性方向，環狀外圈與中心的點會自動被分到投影軸的兩側，因此不需要引入核函數或其他任何非線性降維方法", "C": "核主成分分析（Kernel PCA）：先以核函數（如 RBF）隱含地映射到高維空間再做 PCA，可捕捉非線性結構，且能對新資料做轉換", "D": "t-SNE：保留局部鄰域結構，適合視覺化；但沒有可直接套用到新資料的轉換函數，不適合作為上線模型的輸入"}, "answer": "C", "explanation": "答案 C。這是非線性結構（環狀）：線性方法（PCA、LDA）投影到一條直線，兩類中心重合，無法保證分開；t-SNE 只適合視覺化，沒有可套用到新資料的轉換。Kernel PCA 以核函數處理非線性結構，並提供對新資料的轉換，符合需求。", "per_option": {"A": "兩類中心重合時類間散佈接近 0，LDA 的線性投影無法分開環狀分佈。", "B": "PCA 的投影是線性的，環狀外圈會與中心點重疊在投影軸上，不會自動分開。", "C": "正確：Kernel PCA 可處理非線性結構，並能轉換新資料。", "D": "t-SNE 無法對新資料做同一轉換，不適合上線使用。"}, "guide_ref": "學習指引 p.5-6、3-13～3-15（Kernel PCA 屬延伸）", "hot": true}, {"no": 24, "section": "5.1", "topic_id": "5.1-03", "topic": "特徵工程策略", "style": "情境", "stem": "某保險公司用邏輯迴歸預測「年度是否理賠」，發現風險與駕駛人年齡呈 U 形：年輕駕駛與高齡駕駛的理賠率都偏高，中年駕駛較低。直接把「年齡」當成單一數值特徵放進模型，效果很差。下列哪種特徵工程最能讓這個線性模型捕捉此關係？", "options": {"A": "對年齡做 Z-score 標準化：讓年齡的平均為 0、標準差為 1，模型就能學到年齡兩端風險較高的趨勢", "B": "將年齡分箱（Binning）成數個區間（例如 18–24、25–39、40–64、65 以上）並做 One-hot 編碼，讓各年齡區間學到各自獨立的權重", "C": "對年齡取對數（Log Transform）：壓縮較大的年齡值，使分佈更接近常態，模型就能擬合 U 形關係", "D": "建立「年齡 × 性別」的互動特徵：互動特徵能同時處理年齡與性別對風險的非線性影響，因此能描述兩端偏高的形狀；它是為了捕捉特徵之間的交叉作用，也常用於調整模型對不同族群的預測差異"}, "answer": "B", "explanation": "答案 B。線性模型對單一數值特徵只能學出單調（越大越高或越低）的關係。把年齡分箱後做 One-hot，每個區間有自己的權重，就能學出「兩端高、中間低」的 U 形。標準化與取對數都是單調轉換，不改變關係的形狀；單純加入年齡 × 性別，年齡的影響依性別不同，但仍是單調趨勢，不能產生 U 形。", "per_option": {"A": "標準化是線性轉換，關係仍是單調的，無法產生 U 形。", "B": "正確：分箱後每個區間有獨立權重，可學出 U 形。", "C": "取對數是單調轉換，不會讓線性模型學出 U 形。", "D": "互動特徵讓年齡效果依性別不同，但年齡本身仍是單調的，並不能描述兩端偏高。"}, "guide_ref": "學習指引 p.5-9～5-10（分箱屬延伸）", "hot": true}, {"no": 25, "section": "5.1", "topic_id": "5.1-04", "topic": "類別特徵編碼", "style": "情境", "stem": "某廣告團隊用目標編碼（Target Encoding）處理「投放版位 ID」（共 4,000 種）。其中版位 X 只出現 2 次，且 2 次都有轉換，因此被編成轉換率 1.0；版位 Y 出現 5,000 次，轉換率 0.03。模型上線後，版位 X 的新曝光幾乎都沒有轉換。下列何者最能改善此問題？", "options": {"A": "改用 Label Encoding：把版位 ID 編成 0～3,999 的整數，讓模型自行學習各版位的差異，同時也避免目標編碼的洩漏風險", "B": "改用 One-hot 編碼：為 4,000 個版位各建一個欄位，樣本數很少的版位也會有自己的欄位，因此不會再被高估", "C": "把目標編碼的結果統一乘以 0.5 縮小，因為所有版位的轉換率都被高估，縮小之後版位 X 的編碼值就會變得合理", "D": "加入平滑（Smoothing）：以該類別平均與全體平均依樣本數加權，樣本越少越向全體平均收縮，並在交叉驗證的訓練折內計算"}, "answer": "D", "explanation": "答案 D。樣本很少的類別，其目標平均不可靠（2 筆全部轉換不代表真實轉換率 100%）。平滑目標編碼用加權平均：編碼值 = (n×類別平均 + m×全體平均) ÷ (n + m)，n 越小越向全體平均收縮；並且要在訓練折內計算，避免用到驗證資料的標籤造成洩漏。Label Encoding 會引入假順序；One-hot 會造成維度爆炸，也無法解決稀少樣本的估計問題；統一乘以 0.5 沒有依據。", "per_option": {"A": "Label Encoding 會讓模型誤以為版位 ID 有大小順序，不適合 4,000 種無序類別。", "B": "One-hot 造成 4,000 個稀疏欄位，稀少版位的欄位幾乎沒有訓練樣本，問題未解決。", "C": "統一縮小無法區分樣本多寡，版位 Y 的可靠編碼也會被扭曲。", "D": "正確：平滑讓稀少類別向全體平均收縮，並在訓練折內計算以避免洩漏。"}, "guide_ref": "學習指引 p.5-7～5-8（平滑屬延伸）", "hot": false}, {"no": 26, "section": "5.1", "topic_id": "5.1-09", "topic": "程式碼閱讀：前處理", "style": "計算", "stem": "下列程式碼執行後的輸出為何？\n```\nimport pandas as pd\nages = pd.Series([18, 30, 34, 45, 52, 67, 70])\ngroup = pd.cut(ages, bins=[0, 30, 50, 100], labels=['青', '壯', '老'])\nprint((group == '壯').sum())\n```", "options": {"A": "2：pd.cut 預設區間為左開右閉，「壯」對應 (30, 50]，只有 34 與 45 落在其中，30 屬於前一組", "B": "3：把區間視為左閉右開，「壯」對應 [30, 50)，因此 30、34、45 三個值都被算進「壯」這一組", "C": "0：labels 是文字而 bins 是數值，兩者型別不同無法對應，所有資料都會被轉成 NaN，等於沒有任何人屬於「壯」", "D": "程式出錯：labels 的個數必須與 bins 的個數相同（都是 4 個），否則 pd.cut 會直接拋出例外而無法產生輸出"}, "answer": "A", "explanation": "答案 A。pd.cut 預設 right=True，區間為左開右閉：(0, 30]、(30, 50]、(50, 100]。因此 18、30 屬於「青」，34、45 屬於「壯」，52、67、70 屬於「老」；(group == '壯').sum() 為 2。labels 的個數應為 bins 邊界數減 1（這裡 4 個邊界、3 個標籤），本題寫法正確。已實際執行驗證。", "per_option": {"A": "正確：左開右閉，30 歸前一組，「壯」只有 34 與 45。", "B": "把區間誤當成左閉右開，才會把 30 算進「壯」。", "C": "labels 與 bins 的型別本來就可以不同，不會因此全部變 NaN。", "D": "labels 個數應為 bins 邊界數減 1，題目寫法正確，不會出錯。"}, "guide_ref": "指引未載（程式碼閱讀）", "hot": false, "detail": {"steps": [["① 先搞懂 pd.cut 的區間規則", "預設 right=True：每一組是「左開右閉」(a, b]，意思是 a 不包含、b 包含，即 a ＜ x ≤ b（小括號＝不含，中括號＝含）", "bins ＝ [0, 30, 50, 100] 有 4 個邊界，切出 3 組：青 ＝ (0, 30]、壯 ＝ (30, 50]、老 ＝ (50, 100]"], ["② 把每個年齡放進對應的組", "看 x 落在哪個 (a, b]：a ＜ x ≤ b", "18 → 青；30 → 青（30 ≤ 30，右邊是閉的，歸前一組）；34 → 壯（30 ＜ 34 ≤ 50）；45 → 壯；52 → 老；67 → 老；70 → 老"], ["③ 數有幾個「壯」", "(group == '壯') 逐筆比較，結果是 True／False；.sum() 把 True 當 1、False 當 0 加起來", "七筆結果 ＝ [F, F, T, T, F, F, F]，加總 ＝ 0＋0＋1＋1＋0＋0＋0 ＝ 2，輸出 2，選 A"], ["④ 對照其他選項", "每個選項都是對某個規則的誤解", "B：3 是把區間當成左閉右開 [30, 50)，30 才會進「壯」，但預設不是。C：labels 的型別（文字）和 bins（數字）本來就可以不同，只是貼標籤，不會變 NaN。D：labels 的個數應為「邊界數－1」＝ 4－1 ＝ 3，題目給 3 個標籤，剛好正確，不會出錯"]], "code": [["import pandas as pd", "import＝匯入套件；pandas 是處理表格資料的工具；as pd＝取外號 pd，之後寫 pd.xxx 就等於 pandas.xxx"], ["ages = pd.Series([18, 30, 34, 45, 52, 67, 70])", "Series＝一欄有編號的資料（像表格的一欄）。把 7 個年齡裝進去，存成變數 ages"], ["group = pd.cut(ages, bins=[0, 30, 50, 100], labels=['青', '壯', '老'])", "cut＝切（把連續數字切成幾段）。ages＝要切的資料；bins＝箱子的邊界，[0, 30, 50, 100] 切成 (0, 30]、(30, 50]、(50, 100] 三段（預設左開右閉）；labels＝每一段的名字，依序是青、壯、老。結果存成 group，每個年齡都對應到一個標籤"], ["print((group == '壯').sum())", "group == '壯'＝逐筆問「是不是壯？」，得到一串 True／False；.sum()＝加總，True 算 1，所以等於「壯」的人數；print＝把結果印出來。答案是 2（34 與 45）"]], "tip": "pd.cut 預設左開右閉 (a, b]：剛好等於邊界的數，歸「前一組」。"}}, {"no": 27, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "否定", "stem": "關於排列特徵重要性（Permutation Feature Importance）的敘述，下列何者不正確？", "options": {"A": "它與模型類型無關，只需要能對資料做預測，因此可用於隨機森林、梯度提升樹、神經網路等黑箱模型", "B": "做法是在驗證資料上隨機打亂某個特徵的值，觀察評估指標下降多少；下降越多，表示模型越依賴該特徵", "C": "結果可以證明該特徵與目標之間具有因果關係，因此可以直接據以調整業務策略，不需要再做額外實驗", "D": "若兩個特徵高度相關，打亂其中一個時另一個仍可提供類似資訊，該特徵的重要性可能被低估"}, "answer": "C", "explanation": "答案 C（不正確的敘述）。排列重要性衡量的是「模型預測有多依賴某特徵」，反映的是相關性與模型行為，不是真實世界的因果關係；要主張因果須靠實驗設計或因果推論方法。A、B、D 分別說明它與模型無關、計算方式、以及高度相關特徵時可能低估重要性的限制，皆為正確敘述。", "per_option": {"A": "正確敘述：它是模型無關（model-agnostic）的方法。", "B": "正確敘述：打亂特徵後指標下降越多，代表越依賴該特徵。", "C": "不正確敘述：模型依賴某特徵不等於因果，需要實驗或因果推論才能證明。", "D": "正確敘述：相關特徵會彼此補位，使單獨打亂其一時的影響被低估。"}, "guide_ref": "學習指引 p.5-14～5-15（排列重要性屬延伸）", "hot": true}, {"no": 28, "section": "5.2", "topic_id": "5.2-02", "topic": "偏差與變異", "style": "情境", "stem": "某迴歸模型在測試資料上的均方誤差（MSE）為 24，經分解為：偏差平方 9、變異 5、不可約誤差（資料本身的雜訊）10。團隊打算嘗試更複雜的模型，下列敘述何者最適當？", "options": {"A": "只要模型夠複雜，偏差與變異都能降到 0，因此測試 MSE 理論上可以持續降低並趨近於 0，不受資料雜訊影響，只是訓練時間會變長", "B": "即使偏差平方與變異都被壓到 0，測試 MSE 仍不會低於 10，因為不可約誤差來自資料本身的雜訊，換模型無法消除", "C": "更複雜的模型通常會同時降低偏差與變異，所以只要改用更複雜的模型，測試 MSE 就一定會比 24 更低", "D": "測試 MSE 中的 10 屬於模型的偏差，代表模型過於簡單，因此應優先增加模型複雜度來消除這 10 的誤差"}, "answer": "B", "explanation": "答案 B。期望預測誤差 = 偏差² + 變異 + 不可約誤差（9 + 5 + 10 = 24）。不可約誤差來自資料本身的隨機雜訊，與模型無關，所以誤差下限為 10。增加複雜度通常降低偏差、提高變異，兩者此消彼長，並不保證總誤差下降。", "per_option": {"A": "不可約誤差無法透過模型消除，誤差不可能趨近 0。", "B": "正確：不可約誤差 10 是測試 MSE 的下限。", "C": "更複雜的模型通常降低偏差、提高變異，不保證總誤差下降。", "D": "10 是不可約誤差（雜訊），不是模型偏差；增加複雜度無法消除。"}, "guide_ref": "學習指引 p.5-16（不可約誤差屬延伸）", "hot": false}, {"no": 29, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "情境", "stem": "某醫療團隊的資料共 500 筆，其中某罕見疾病的陽性只有 8 筆。工程師想用分層 10 折交叉驗證（Stratified 10-fold）評估分類模型的召回率。下列判斷何者最適當？", "options": {"A": "合適，分層抽樣會自動把 8 筆陽性複製到每一折，確保每一折的驗證資料都有陽性可供計算召回率", "B": "合適，分層 K 折讓每折的陽性比例與整體相同，所以 10 折每折各有 0.8 筆陽性，平均後不影響評估結果，因此可以放心使用而不需要調整折數", "C": "不合適，因為交叉驗證只能用在樣本數超過 1,000 筆的資料，這種情況應直接使用單次留出法，不需要分層", "D": "不合適：陽性只有 8 筆，少於折數 10，至少有兩折沒有任何陽性，無法計算召回率；應降低折數（如 4 折）並可重複多次"}, "answer": "D", "explanation": "答案 D。分層 K 折是把每個類別的樣本盡量平均分到各折，但樣本不會被複製；8 筆陽性分到 10 折，至少有 2 折分不到陽性，那兩折的召回率分母為 0，無法計算。少數類別的樣本數至少要不小於折數，所以應降低折數（如 4 折，每折約 2 筆陽性），並可搭配重複分層交叉驗證來降低切分的隨機性。", "per_option": {"A": "分層不會複製樣本，每個樣本只出現在一折的驗證集中。", "B": "樣本是整數筆，不可能有 0.8 筆；有些折分不到陽性，召回率無法計算。", "C": "交叉驗證沒有「超過 1,000 筆才能使用」的限制，小資料反而更需要。", "D": "正確：少數類樣本數小於折數，會有折沒有陽性，需降低折數。"}, "guide_ref": "學習指引 p.5-17～5-18、5-26～5-29", "hot": true}, {"no": 30, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "定義", "stem": "某風控團隊報告：詐欺偵測模型的 ROC-AUC 為 0.85。主管想知道這個數字的直觀意義。下列解讀何者最適當？", "options": {"A": "隨機各抽一筆詐欺交易與一筆正常交易，模型給詐欺交易的分數高於正常交易的機率約為 85%", "B": "在預設門檻 0.5 之下，模型預測正確的交易筆數占全部交易筆數的比例為 85%，也就是整體準確率為 85%", "C": "模型抓出了 85% 的詐欺交易，而且被模型標為詐欺的交易之中，也有 85% 真的是詐欺，兩個指標都是 85%", "D": "有 85% 的正常交易被模型正確放行，因此誤報率（FPR）為 15%，這個數值與詐欺交易的偵測率無關"}, "answer": "A", "explanation": "答案 A。ROC-AUC 的機率解釋是：隨機抽一個正類樣本與一個負類樣本，模型給正類的分數高於負類的機率。它衡量的是排序能力，與特定門檻無關。B 是準確率，C 是召回率與精確率，D 是特異度與 FPR，都需要先固定門檻才能計算。", "per_option": {"A": "正確：AUC＝正類分數高於負類分數的機率，衡量排序能力。", "B": "準確率需要固定門檻才算得出，與 AUC 不同。", "C": "召回率與精確率都取決於門檻，AUC 不是這兩者。", "D": "特異度與 FPR 取決於門檻，AUC 是整條 ROC 曲線下的面積。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true}, {"no": 31, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "計算", "stem": "某癌症篩檢模型在驗證集的精確率（Precision）為 0.50、召回率（Recall）為 0.80。由於漏診的代價遠高於誤報，團隊改用 F2 分數（F-beta，β＝2，公式為 (1＋β²)·P·R ÷ (β²·P＋R)）評估。此模型的 F2 約為多少？", "options": {"A": "約 0.62：這是 F1 分數（P 與 R 的調和平均 2PR÷(P＋R)），β＝1 時 P 與 R 的權重相同，沒有偏重召回率", "B": "約 0.71：代入公式 5×0.5×0.8 ÷ (4×0.5＋0.8)＝2.0÷2.8，召回率的權重高於精確率", "C": "約 0.65：取精確率與召回率的算術平均 (0.5＋0.8)÷2，把兩者視為同等重要", "D": "約 0.80：F2 偏重召回率，所以直接等於召回率的數值，不受精確率影響"}, "answer": "B", "explanation": "答案 B。F2 = (1+4)×P×R ÷ (4×P + R) = 5×0.5×0.8 ÷ (4×0.5 + 0.8) = 2.0 ÷ 2.8 ≈ 0.714。β 越大越偏重召回率；F1 約 0.615，算術平均為 0.65，都不是 F2。F2 仍會受精確率影響。已用 Python 驗算。", "per_option": {"A": "0.62 是 F1，沒有偏重召回率。", "B": "正確：代入公式得 2.0÷2.8≈0.714。", "C": "算術平均不是 F-beta 的定義，且沒有偏重召回率。", "D": "F2 仍是 P 與 R 的加權調和平均，精確率較低會把分數拉低，不會等於 R。"}, "guide_ref": "學習指引 p.5-20～5-22（F-beta 屬延伸）", "hot": true, "detail": {"steps": [["① 寫出 F-beta 公式", "Fβ ＝ (1＋β²) × P × R ÷ (β² × P ＋ R)（P ＝ 精確率 Precision，R ＝ 召回率 Recall；β 越大，越偏重召回率）", "題目：β ＝ 2 → β² ＝ 4，1＋β² ＝ 5；P ＝ 0.50，R ＝ 0.80"], ["② 算分子", "分子 ＝ (1＋β²) × P × R", "＝ 5 × 0.5 × 0.8 ＝ 2.0"], ["③ 算分母並相除", "分母 ＝ β² × P ＋ R；F ＝ 分子 ÷ 分母", "分母 ＝ 4 × 0.5 ＋ 0.8 ＝ 2.0 ＋ 0.8 ＝ 2.8；F2 ＝ 2.0 ÷ 2.8 ≈ 0.714，約 0.71，選 B"], ["④ 對照其他選項", "F1 ＝ 2×P×R ÷ (P＋R)（β 取 1 的特例）；算術平均 ＝ (P＋R) ÷ 2", "A：F1 ＝ 2 × 0.5 × 0.8 ÷ (0.5 ＋ 0.8) ＝ 0.8 ÷ 1.3 ≈ 0.62，P 與 R 權重相同，沒偏重召回率。C：(0.5 ＋ 0.8) ÷ 2 ＝ 0.65，算術平均不是 F-beta。D：0.80 就是 R 本身，但 F2 仍受 P 影響，P 偏低會把分數拉低（0.71 ＜ 0.80）"]], "tip": "Fβ：β 越大越看重召回率；F2 ＝ 5PR ÷ (4P＋R)。"}}, {"no": 32, "section": "5.3", "topic_id": "5.3-03", "topic": "學習曲線判讀", "style": "情境", "stem": "某工程師訓練二元分類神經網路，記錄如下：第 10 個 epoch 時，訓練損失 0.30、驗證損失 0.45、驗證準確率 84%；第 30 個 epoch 時，訓練損失 0.05、驗證損失 0.62、驗證準確率 85%。下列判讀何者最適當？", "options": {"A": "沒有過擬合，因為驗證準確率仍從 84% 微升到 85%；準確率才是最終目標，所以驗證損失上升可以忽略不計", "B": "欠擬合，因為第 30 個 epoch 的驗證損失 0.62 遠高於訓練損失 0.05，代表模型容量不足，應該加大網路規模，所以下一步應優先加大網路層數與神經元數量", "C": "已有過擬合徵兆：模型對訓練資料越來越有把握，對驗證資料卻變得過度自信、錯誤預測的損失變大；以驗證損失為準，應回到約第 10 個 epoch 附近早停", "D": "資料洩漏造成的假象，因為過擬合時驗證準確率一定會下降，所以驗證準確率上升就代表資料洩漏"}, "answer": "C", "explanation": "答案 C。訓練損失持續下降（0.30→0.05），驗證損失卻由 0.45 升到 0.62，兩者落差擴大，是過擬合的典型訊號。驗證準確率只看對錯，不看信心；模型對錯誤的預測越來越有信心，損失會上升但準確率可能持平，所以不能只看準確率。依已記錄的數字，驗證損失較低的是第 10 個 epoch，應回到該附近（或驗證損失最低的 epoch）作為早停點。", "per_option": {"A": "準確率不反映預測機率的信心程度；驗證損失上升仍是過擬合訊號。", "B": "訓練損失已經很低，高驗證損失代表過擬合，不是欠擬合。", "C": "正確：訓練損失降、驗證損失升，過度自信，宜在驗證損失最低處早停。", "D": "過擬合時驗證準確率不一定下降，「一定」過於絕對，且沒有證據顯示洩漏。"}, "guide_ref": "學習指引 p.5-19～5-20", "hot": true}, {"no": 33, "section": "5.3", "topic_id": "5.3-04", "topic": "殘差分析", "style": "計算", "stem": "某房價迴歸模型的殘差經檢查近似常態分佈、平均為 0，殘差標準差為 4（萬元）。對某物件，模型預測成交價為 120 萬元。若以約 95% 的把握估計，這個物件的實際成交價大約落在哪個範圍？", "options": {"A": "約 116～124 萬元：預測值 ±1 個標準差（±4 萬），在常態分佈下大約涵蓋 68% 的情況，是最常使用的區間", "B": "約 108～132 萬元：預測值 ±3 個標準差（±12 萬），在常態分佈下大約涵蓋 99.7% 的情況", "C": "約 114～126 萬元：預測值 ±1.5 個標準差（±6 萬），在常態分佈下大約涵蓋 87% 的情況", "D": "約 112～128 萬元：預測值 ±1.96 個標準差（約 ±8 萬），在常態分佈下大約涵蓋 95% 的情況"}, "answer": "D", "explanation": "答案 D。殘差近似常態、平均為 0 時，實際值約有 95% 落在預測值 ± 1.96 個殘差標準差內：120 ± 1.96×4 ≈ 120 ± 7.84，約 112～128 萬元。±1σ 約 68%、±3σ 約 99.7%，都不是 95%。已用 Python 驗算。", "per_option": {"A": "±1σ 只涵蓋約 68%，把握不夠。", "B": "±3σ 涵蓋約 99.7%，區間比 95% 的需求寬很多。", "C": "±1.5σ 約涵蓋 87%，未達 95%。", "D": "正確：±1.96σ 約涵蓋 95%，區間約 112～128。"}, "guide_ref": "學習指引 p.5-24（區間估計屬延伸）", "hot": true, "detail": {"steps": [["① 先決定要乘幾個標準差（常態分佈的「經驗法則」）", "實際值 ≈ 預測值 ± z × σ（前提：殘差近似常態、平均為 0，題目已給這個條件；σ 讀作 sigma，是殘差標準差；z 是「幾個標準差」，z 越大，涵蓋的機率越高）", "常態分佈下：±1σ 約涵蓋 68%、±1.96σ 約涵蓋 95%、±3σ 約涵蓋 99.7%。題目要約 95% → z ＝ 1.96"], ["② 算區間的半寬", "半寬 ＝ z × σ", "σ ＝ 4（萬元）→ 半寬 ＝ 1.96 × 4 ＝ 7.84（萬元）"], ["③ 算上下界", "下界 ＝ 預測值 － 半寬；上界 ＝ 預測值 ＋ 半寬", "預測值 ＝ 120：下界 ＝ 120 － 7.84 ＝ 112.16；上界 ＝ 120 ＋ 7.84 ＝ 127.84 → 約 112～128 萬元，選 D"], ["④ 對照其他選項（用同一公式換不同的 z）", "區間 ＝ 預測值 ± z × σ", "A：z ＝ 1 → ± 1 × 4 ＝ ± 4 → 116～124，只涵蓋約 68%。B：z ＝ 3 → ± 3 × 4 ＝ ± 12 → 108～132，涵蓋約 99.7%，比 95% 寬。C：z ＝ 1.5 → ± 1.5 × 4 ＝ ± 6 → 114～126，涵蓋約 87%，不到 95%"]], "tip": "95% 區間 ＝ 預測值 ± 1.96σ（口訣：約 2 個標準差）。"}}, {"no": 34, "section": "5.3", "topic_id": "5.3-05", "topic": "迴歸評估指標", "style": "否定", "stem": "某需求預測團隊的商品常有「當日銷量為 0」的情況。關於迴歸評估指標在這類資料上的使用，下列敘述何者錯誤？", "options": {"A": "只要把實際值為 0 的資料改成極小的數（如 0.0001）再計算，MAPE 就會恢復正常，且不會讓整體平均被少數幾筆誤差放大", "B": "MAPE 以實際值為分母，實際值為 0 時該筆的百分比誤差無法定義（除以 0），含大量 0 的資料不適合直接使用，這是 MAPE 的已知限制", "C": "WAPE（加權絕對百分比誤差）＝Σ|誤差|÷Σ實際值，以總量當分母，單日銷量為 0 不會造成除以 0，常用於需求預測", "D": "MAE 以原本的單位呈現平均絕對誤差，不需要把實際值當分母，因此不受實際值為 0 的影響"}, "answer": "A", "explanation": "答案 A（錯誤的敘述）。把 0 換成極小值，分母變得接近 0，該筆的百分比誤差會變得極大，整體 MAPE 反而被少數幾筆嚴重拉高，並沒有恢復正常。B、C、D 分別說明 MAPE 對 0 的問題，以及 WAPE 與 MAE 不以單筆實際值為分母而不受影響，皆為正確敘述。", "per_option": {"A": "錯誤敘述：分母趨近 0 會使百分比誤差暴增，MAPE 被少數筆主導。", "B": "正確敘述：實際值為 0 時 MAPE 無法定義。", "C": "正確敘述：WAPE 的分母是總量，不會出現單筆除以 0。", "D": "正確敘述：MAE 不用實際值當分母，不受零值影響。"}, "guide_ref": "學習指引 p.5-22～5-24（WAPE 屬延伸）", "hot": true}, {"no": 35, "section": "5.3", "topic_id": "5.3-09", "topic": "資料洩漏與 Pipeline", "style": "情境", "stem": "某團隊要用 PCA 降維後訓練分類器，並評估模型對新資料的泛化能力。下列哪一種流程既不會造成資料洩漏，也能讓測試成績可靠地反映對新資料的泛化能力？", "options": {"A": "先對全部資料 fit PCA（保留 95% 的變異量），再切分訓練集與測試集，模型只用訓練集訓練，測試集只用來評估", "B": "切分之後，分別對訓練集與測試集各自呼叫 fit_transform 做 PCA，讓兩者都能得到各自最適合的主成分", "C": "先切分，只用訓練集 fit PCA 與分類器（以 Pipeline 包裝），測試集只套用已 fit 好的轉換後再評估", "D": "先用 PCA 對訓練集與測試集合併後的資料降維，再用測試集的標籤挑選要保留的主成分數量，最後以同一份測試集報告成績，成績因此會比真實情況樂觀許多"}, "answer": "C", "explanation": "答案 C。任何「會從資料學習參數」的前處理（含 PCA、標準化、特徵選擇）都只能用訓練集 fit，再把學到的轉換套用到測試集。A 讓 PCA 的主成分方向已經看過測試集；B 的訓練集與測試集各自 fit，會被投影到不同的座標空間，兩者無法比較，測試成績失去意義（測試集不應參與 fit）；D 更直接用了測試集的標籤。", "per_option": {"A": "PCA 在切分前 fit，主成分方向已包含測試集資訊，屬洩漏。", "B": "測試集自己 fit PCA，座標空間與訓練集不同，分類器學到的特徵意義無法套用到測試集，評估結果無意義。", "C": "正確：只用訓練集 fit，測試集只 transform，並以 Pipeline 防止誤用。", "D": "用測試集標籤挑參數是目標洩漏，成績被高估。"}, "guide_ref": "指引未載（資料洩漏與 Pipeline）", "hot": false}, {"no": 36, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "定義", "stem": "從貝氏觀點（最大後驗估計，MAP）來看，在線性模型的損失函數中加入 L1 懲罰與 L2 懲罰，分別相當於對模型權重假設下列哪一種先驗分佈？", "options": {"A": "L1 對應高斯（常態）先驗，讓權重向 0 平滑收縮；L2 對應拉普拉斯先驗，在 0 附近尖峰，容易讓權重剛好等於 0，這正是兩種正則化最主要的數學差異", "B": "L1 對應拉普拉斯先驗，在 0 附近呈尖峰，易使權重剛好為 0；L2 對應以 0 為中心的高斯先驗，權重向 0 收縮但很少恰為 0", "C": "L1 與 L2 都對應均勻先驗，兩者只是懲罰項的寫法不同，並不隱含對權重大小的任何偏好，差別僅在計算效率", "D": "L1 對應高斯先驗；L2 對應均勻先驗，因為平方項在 0 附近變化平緩，視同對所有權重大小一視同仁"}, "answer": "B", "explanation": "答案 B。MAP 估計等於最大化「似然 × 先驗」，取負對數後，先驗的負對數就是懲罰項：拉普拉斯先驗的負對數與 |w| 成正比（L1），高斯先驗的負對數與 w² 成正比（L2）。拉普拉斯分佈在 0 附近呈尖峰，所以 L1 容易把權重壓成剛好為 0；高斯分佈較平滑，所以 L2 使權重變小但很少恰為 0。", "per_option": {"A": "把 L1、L2 的對應顛倒了。", "B": "正確：L1↔拉普拉斯先驗，L2↔高斯先驗。", "C": "均勻先驗不產生懲罰項，L1、L2 都隱含對大權重的偏好。", "D": "L1 對應拉普拉斯而非高斯，L2 也不是均勻先驗。"}, "guide_ref": "學習指引 p.5-42～5-45（貝氏觀點屬延伸）", "hot": true}, {"no": 37, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "情境", "stem": "某工程師手寫 Ridge 迴歸的訓練程式，發現當目標變數（如房價）的平均值約為 800 萬元、遠離 0 時，若把截距項 b 也一併納入 λ‖w‖² 的懲罰，調大 λ 之後預測誤差明顯變大。業界實作通常「不對截距項加懲罰」，主要原因是下列何者？", "options": {"A": "截距項的數值通常最大，若不排除，懲罰項會被截距項主導，導致其他權重完全不受約束，起不到正則化的效果，這也是實務上排除截距項的主要考量", "B": "截距項只是單一個參數，數學上無法對單一參數的平方求梯度，因此在實作上只能略過截距項、不納入懲罰", "C": "截距項會使模型複雜度增加，所以不論如何都應該把它固定為 0，才能有效避免過擬合並降低模型的變異", "D": "截距項只負責平移整體預測水準，不決定特徵影響或曲線彎曲程度；對它收縮會把預測拉向 0 而非資料平均，造成系統性偏差"}, "answer": "D", "explanation": "答案 D。正則化的目的是限制模型複雜度（特徵權重不要太大）。截距項只決定整體預測的水準，與模型彎曲、對特徵的敏感度無關；若連它一起收縮，λ 變大時預測會被拉向 0，而不是資料的平均，造成系統性偏低或偏高，卻對降低複雜度沒有幫助。所以一般不對截距項加懲罰。", "per_option": {"A": "截距不會主導懲罰項，不排除它的原因是收縮截距會造成偏差，不是數值大小。", "B": "對單一參數求梯度沒有任何困難，並非不能懲罰截距的原因。", "C": "截距項是模型必要的平移，固定為 0 會使預測無法對齊資料水準。", "D": "正確：收縮截距會把預測拉向 0，造成系統性偏差，又無助於降低複雜度。"}, "guide_ref": "學習指引 p.5-42～5-45（截距項處理屬延伸）", "hot": true}, {"no": 38, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "情境", "stem": "某團隊的詐欺偵測資料中詐欺僅占 1%。為了平衡類別，他們把詐欺樣本「直接複製」20 次後再訓練梯度提升樹，結果訓練集 AUC 達 0.99，驗證集（維持原始比例，且不含任何複製樣本）AUC 只有 0.80。下列何者最能說明原因與改善方向？", "options": {"A": "複製讓訓練集的樣本數增加，足以讓模型學到更一般化的詐欺規則；驗證集 AUC 偏低是因為驗證集太小，不需要處理", "B": "重複的詐欺樣本讓模型反覆記住同樣幾筆資料的細節而過擬合；可改用 SMOTE 合成內插樣本、調整類別權重，並限制樹深度或加入正則化", "C": "原因是類別不平衡本身造成欠擬合，應再把詐欺樣本多複製到 100 次，直到詐欺與正常樣本數量完全相等為止，這樣模型就不會再因為樣本不足而表現不佳", "D": "訓練集與驗證集 AUC 的落差是資料洩漏造成的，只要把驗證集併回訓練集重新評估，就能得到可信的成績"}, "answer": "B", "explanation": "答案 B。直接複製少數類樣本不會增加新資訊，模型會記住這些重複樣本的細節，訓練 AUC 很高但泛化很差（過擬合）。對策包括：用 SMOTE 在近鄰間內插合成新樣本、使用類別權重而不複製資料、限制模型複雜度（樹深度、正則化）。把驗證集併回訓練集只會讓評估失去意義。", "per_option": {"A": "複製不會增加新資訊，驗證集太小並非主因。", "B": "正確：重複樣本使模型記憶而過擬合，可用 SMOTE、類別權重、限制複雜度。", "C": "複製更多次只會更加重記憶，與欠擬合無關。", "D": "題目已說明驗證集獨立且不含複製樣本，沒有洩漏；併回訓練集會讓評估失效。"}, "guide_ref": "學習指引 p.5-45～5-46（類別平衡與過擬合屬延伸）", "hot": true}, {"no": 39, "section": "5.4", "topic_id": "5.4-03", "topic": "學習率", "style": "計算", "stem": "某團隊使用餘弦退火學習率排程：lr_t ＝ ½ × lr_max × (1 ＋ cos(π × t ÷ T))，其中 lr_max＝0.1、總步數 T＝100。在第 t＝25 步時，學習率約為多少？", "options": {"A": "約 0.085：代入 ½×0.1×(1＋cos(π/4))，餘弦曲線前期下降較慢，因此高於線性遞減的結果", "B": "約 0.075：這是線性遞減 0.1×(1−25÷100) 的結果，沒有套用題目給定的餘弦公式", "C": "約 0.015：誤把公式中的「1＋cos」寫成「1−cos」，得到的是 ½×0.1×(1−cos(π/4))", "D": "約 0.050：以為餘弦退火在前四分之一的步數就會降到初始值的一半，實際上要到 t＝T÷2 才會降到一半"}, "answer": "A", "explanation": "答案 A。cos(π×25/100) = cos(π/4) ≈ 0.7071，lr = 0.5×0.1×(1+0.7071) ≈ 0.0854。餘弦退火前期下降較慢、中期較快、後期又趨緩；t=T/2 時才恰降到一半（0.05）。已用 Python 驗算。", "per_option": {"A": "正確：0.5×0.1×(1＋0.7071)≈0.0854。", "B": "0.075 是線性遞減的結果，不是餘弦公式。", "C": "0.0146 是把 1＋cos 誤寫成 1−cos 的結果。", "D": "在 t＝T/2 時才會降到一半（0.05），t＝25 時仍高於 0.08。"}, "guide_ref": "學習指引 p.5-19、5-31～5-32（餘弦退火屬延伸）", "hot": true, "detail": {"steps": [["① 寫出公式（餘弦退火：學習率像餘弦曲線從 lr_max 慢慢降到 0）", "lr_t ＝ ½ × lr_max × (1 ＋ cos(π × t ÷ T))（t ＝ 目前第幾步，T ＝ 總步數，π ≈ 3.14159；cos 在弧度制下計算）", "題目：lr_max ＝ 0.1、T ＝ 100、t ＝ 25"], ["② 先算 cos 裡面的角度與餘弦值", "進度 ＝ t ÷ T；角度 ＝ π × 進度；再取 cos", "進度 ＝ 25 ÷ 100 ＝ 0.25；角度 ＝ π × 0.25 ＝ π/4；cos(π/4) ≈ 0.7071（π/4 就是 45 度）"], ["③ 代入公式", "lr_t ＝ ½ × lr_max × (1 ＋ cos 值)", "＝ 0.5 × 0.1 × (1 ＋ 0.7071) ＝ 0.05 × 1.7071 ≈ 0.0854，約 0.085，選 A"], ["④ 對照其他選項", "線性遞減：lr ＝ lr_max × (1 － t ÷ T)；半程 t ＝ T÷2 時 cos(π/2) ＝ 0", "B：線性遞減 0.1 × (1 － 0.25) ＝ 0.1 × 0.75 ＝ 0.075，不是餘弦公式。C：把 1＋cos 寫成 1－cos：0.05 × (1 － 0.7071) ＝ 0.05 × 0.2929 ≈ 0.0146，約 0.015。D：0.050 是 t ＝ T÷2 才有的值：0.5 × 0.1 × (1 ＋ 0) ＝ 0.05；t ＝ 25 還沒走到一半，學習率仍高於 0.08"]], "tip": "餘弦退火：前期降得慢，走到一半步數時學習率才剛好降到 lr_max 的一半。"}}, {"no": 40, "section": "5.4", "topic_id": "5.4-04", "topic": "資料增強", "style": "情境", "stem": "某客服團隊的意圖分類資料每類只有約 60 句，想用文字資料增強擴充訓練集。要求是：保留原句的意圖，且增強後的句子不只是換掉幾個字，連句型結構也要有所變化。下列哪種方法最適當？", "options": {"A": "同義詞替換（Synonym Replacement）：隨機把句中部分詞換成同義詞，句型結構維持不變，主要改變的是用字", "B": "隨機交換詞序（Random Swap）：隨機交換句中兩個詞的位置產生新句，增加語序的變化，但可能破壞文法與語意", "C": "回譯（Back-Translation）：先把句子翻譯成另一種語言再翻回原語言，通常能保留原意並產生措辭與句型都不同的釋義", "D": "隨機插入或刪除字元（Character-level Noise）：模擬打字錯誤，增加模型對拼字錯誤的耐受度，但不會改變句型"}, "answer": "C", "explanation": "答案 C。回譯經過另一種語言的翻譯再翻回，措辭與句型常會自然改變，同時大致保留原意，適合需要保留語意且希望句型也有變化的情境。同義詞替換只改用字；隨機交換詞序可能破壞文法與語意；字元層級雜訊只模擬錯字，不改變句型。", "per_option": {"A": "同義詞替換不改變句型結構，不符合要求。", "B": "隨機交換詞序可能產生不通順或語意改變的句子，風險高。", "C": "正確：回譯能保留原意並改變措辭與句型。", "D": "字元雜訊不改變句型，主要用於拼字耐受度。"}, "guide_ref": "學習指引 p.5-9、5-47（回譯屬延伸）", "hot": true}, {"no": 41, "section": "5.4", "topic_id": "5.4-05", "topic": "模型量化", "style": "計算", "stem": "某團隊要把一個 70 億（7B）參數的語言模型部署到只有 8 GB 顯示卡記憶體的裝置。目前權重以 FP16（每個參數 2 位元組）儲存，約需 14 GB。若改用 4 位元（INT4）量化儲存權重（忽略縮放因子等額外開銷，1 GB＝10⁹ 位元組），權重大小約為多少？", "options": {"A": "約 7 GB：每個參數 1 位元組，相當於 8 位元（INT8）量化的大小，4 位元量化並不會比 8 位元更小，因此量化到 4 位元沒有儲存上的優勢", "B": "約 1.75 GB：每個參數 0.25 位元組，相當於 2 位元量化的大小，與 4 位元的儲存量對應", "C": "約 14 GB：量化只改變數值的精度與運算方式，不會改變模型權重所需的儲存空間，因此大小與 FP16 相同", "D": "約 3.5 GB：7×10⁹ 個參數 × 0.5 位元組，可放進 8 GB 顯示卡記憶體（仍須預留啟動值等其他空間）"}, "answer": "D", "explanation": "答案 D。4 位元 = 0.5 位元組，7×10⁹ × 0.5 = 3.5×10⁹ 位元組 = 3.5 GB，約為 FP16（14 GB）的 1/4。實際部署還需預留啟動值（activations）、KV 快取等空間，但權重本身可放進 8 GB。INT8 為 7 GB，2 位元為 1.75 GB。已用 Python 驗算。", "per_option": {"A": "7 GB 是 INT8（1 位元組）的大小，4 位元只有一半。", "B": "1.75 GB 是 2 位元的大小，不是 4 位元。", "C": "量化降低每個參數的位元數，儲存空間會等比例縮小。", "D": "正確：7×10⁹×0.5 位元組＝3.5 GB。"}, "guide_ref": "學習指引 p.5-51～5-52", "hot": false, "detail": {"steps": [["① 先把「位元」換成「位元組」（1 位元組 ＝ 8 位元）", "每個參數佔的位元組數 ＝ 位元數 ÷ 每位元組含的位元數", "INT4（4 位元）：4 ÷ 8 ＝ 0.5 位元組（FP16 是 16 位元 ÷ 8 ＝ 2 位元組，與題目一致）"], ["② 算權重總大小", "總大小（GB）＝ 參數個數 × 每個參數的位元組數 ÷ 每 GB 的位元組數", "參數 ＝ 7 × 10⁹，1 GB ＝ 10⁹ 位元組：7×10⁹ × 0.5 ＝ 3.5×10⁹ 位元組 ＝ 3.5 GB，選 D（約為 FP16 的 14 GB 的 1/4，放得進 8 GB）"], ["③ 對照其他選項（換成不同位元數）", "每個選項只是用了不同的「每參數位元組數」", "A：7 GB ＝ 7×10⁹ × 1 位元組 ÷ 10⁹，1 位元組 ＝ 8 位元，是 INT8 的大小，4 位元只有它的一半。B：1.75 GB ＝ 7×10⁹ × 0.25 ÷ 10⁹，0.25 位元組 ＝ 2 位元，不是 4 位元。C：14 GB ＝ 7×10⁹ × 2 ÷ 10⁹，那是 FP16 沒量化的大小；量化的目的就是縮小儲存"]], "tip": "量化大小 ＝ 參數數 × 位元數 ÷ 8 位元組；4 位元就是 FP16 的 1/4。"}}, {"no": 42, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "否定", "stem": "關於本地差分隱私（Local Differential Privacy）與中央式差分隱私（Central DP）的比較，下列敘述何者錯誤？", "options": {"A": "本地差分隱私在資料離開使用者裝置之前就先加入噪聲，即使收集資料的伺服器不被完全信任，個人原始資料也不會外洩", "B": "兩者的差別只在噪聲加在哪個位置：中央式是在使用者端加噪聲後再上傳，而本地式是由可信的伺服器收集原始資料後，再對統計結果加噪聲", "C": "在相同隱私預算 ε 下，本地差分隱私因每位使用者各自加噪聲，通常需要更多使用者的資料，才能達到與中央式相近的統計準確度，這也是本地式較少用於小規模資料的原因", "D": "不論本地或中央式，隱私預算 ε 越小，隱私保護越強，但輸出結果的準確度通常越低"}, "answer": "B", "explanation": "答案 B（錯誤的敘述）。兩者的位置說反了：本地差分隱私是在「使用者端」先加噪聲再上傳，伺服器不需被信任；中央式則是可信的伺服器先收集原始資料，再對統計結果加噪聲。因為本地式每人各自加噪聲，噪聲總量較大，通常需要更多樣本才能維持準確度。ε 越小隱私越強、結果越不準，兩種模式皆然。", "per_option": {"A": "正確敘述：本地式在上傳前加噪聲，不必信任伺服器。", "B": "錯誤敘述：把本地式與中央式的加噪聲位置說反了。", "C": "正確敘述：本地式噪聲較大，需要更多樣本。", "D": "正確敘述：ε 越小隱私越強、準確度越低。"}, "guide_ref": "學習指引 p.6-10～6-12（本地差分隱私屬延伸）", "hot": true}, {"no": 43, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "情境", "stem": "某醫院為了公開研究資料，已刪除病患姓名與身分證字號，但保留「出生年月日」、「性別」與「郵遞區號」後公開釋出。攻擊者取得一份公開的選民名冊（含姓名、出生年月日、性別、郵遞區號），仍可能將部分病患的診斷紀錄對應到特定個人。這種風險最適合稱為下列何者？", "options": {"A": "資料投毒（Data Poisoning）：攻擊者在訓練資料中植入惡意樣本，使模型學到錯誤的規則，破壞模型的可靠度", "B": "模型反推攻擊（Model Inversion）：利用模型輸出的信心分數，反推訓練資料中的敏感特徵，屬於針對已訓練模型的攻擊", "C": "連結攻擊（Linkage Attack）：利用準識別碼（Quasi-identifier）的組合，與外部公開資料比對，重新識別個人", "D": "同態加密失效（Homomorphic Encryption Failure）：加密資料在雲端運算時被意外解密，導致原始數值外洩給雲端業者"}, "answer": "C", "explanation": "答案 C。刪除姓名與身分證字號只移除了直接識別碼，但出生日期、性別、郵遞區號這類準識別碼的組合常具有高度獨特性，可與外部公開資料（如選民名冊）比對而重新識別個人，這稱為連結攻擊。對策包括 K-匿名、泛化／抑制準識別碼、差分隱私等。", "per_option": {"A": "資料投毒針對訓練資料的完整性，與公開資料被比對無關。", "B": "模型反推針對已訓練模型的輸出，題目並沒有模型。", "C": "正確：準識別碼組合與外部資料比對即為連結攻擊。", "D": "題目沒有使用加密或雲端運算，與同態加密無關。"}, "guide_ref": "學習指引 p.6-10～6-12（連結攻擊屬延伸）", "hot": true}, {"no": 44, "section": "6.2", "topic_id": "6.2-01", "topic": "偏見類型與成因", "style": "情境", "stem": "某銀行確認貸款模型的訓練資料各族群樣本數均衡、標註客觀，但仍發現模型對少數族群的核准率明顯偏低；模型雖未使用族群欄位，卻能從郵遞區號等特徵間接推得族群。團隊想在「模型訓練階段」降低模型對敏感屬性資訊的依賴，下列哪種做法最適當？", "options": {"A": "對抗式去偏見訓練（Adversarial Debiasing）：另加一個判別器嘗試由模型內部表示猜出敏感屬性，主模型則被訓練到讓判別器猜不出，同時維持預測表現", "B": "加大正規化力道：增加 L2 懲罰以簡化模型，簡化後的模型因為特徵關聯變少，通常能自動讓各族群得到更公平的結果", "C": "只要移除郵遞區號欄位就能保證公平，因為模型已無法從任何其他特徵推得族群資訊，不需要再檢查各族群的表現，因此不需要再進一步檢查各族群的預測表現與核准率差異，也不必調整訓練流程", "D": "只在測試階段對少數族群的預測結果進行人工加分，訓練流程與損失函數都維持原樣，藉此讓各族群的核准率趨近一致"}, "answer": "A", "explanation": "答案 A。資料已平衡、標註客觀，偏見來自模型層面（目標函數只追求整體表現、可從代理變數推得敏感屬性）。對抗式去偏見訓練在訓練階段引入判別器，迫使模型的內部表示不攜帶敏感屬性資訊，屬於「訓練中」的緩解方法。強化正規化可能反而傷害少數群體；移除單一欄位無法保證消除其他代理變數；事後人工加分屬於後處理而非訓練階段。", "per_option": {"A": "正確：對抗式訓練讓表示不含敏感屬性資訊，屬訓練階段的去偏見。", "B": "過強的正規化會簡化特徵關聯，可能傷害少數群體，並非保證公平。", "C": "還有其他代理變數，「保證」過於絕對。", "D": "屬於後處理（事後調整），不是訓練階段，且人工加分缺乏原則。"}, "guide_ref": "學習指引 p.6-14～6-17", "hot": true}, {"no": 45, "section": "6.2", "topic_id": "6.2-03", "topic": "公平性指標", "style": "情境", "stem": "某法院導入再犯風險評分系統。法院要求：當系統對某人給出「高風險」標記時，這個標記的可信程度不能因被告所屬族群而不同；也就是被標為高風險的人之中，真正再犯的比例在各族群應相近。這項要求最符合下列哪一種公平性指標？", "options": {"A": "統計均等（Demographic Parity）：各族群被預測為正向（高風險）的比例相近，只看結果比例，不管實際是否再犯", "B": "機會平等（Equal Opportunity）：在真正會再犯的人當中，各族群被正確標為高風險的比例（TPR）相近", "C": "均衡機率（Equalized Odds）：真陽性率（TPR）與假陽性率（FPR）在各族群都要相近，最嚴格也最難完全達成", "D": "預測值平價（Predictive Parity）：在被預測為正向的人之中，實際為正向的比例（精確率）在各族群相近"}, "answer": "D", "explanation": "答案 D。題目要求的是「被標為高風險的人之中，真正再犯的比例」各族群相近，這是精確率（PPV）的族群一致性，即預測值平價。統計均等看被預測為正向的比例；機會平等看真正再犯者中被抓到的比例（TPR）；均衡機率要求 TPR 與 FPR 都一致。這幾種指標通常無法同時完全達成，要依場景選擇。", "per_option": {"A": "統計均等比較的是各族群被標為高風險的比例，不是標記的可信程度。", "B": "機會平等的條件是「實際再犯者」，題目的條件是「被標為高風險者」，方向相反。", "C": "均衡機率比較 TPR 與 FPR，不是被標為高風險者中的真實比例。", "D": "正確：預測為正向者中的真實正向比例（精確率）一致，即預測值平價。"}, "guide_ref": "學習指引 p.6-17～6-19（預測值平價屬延伸）", "hot": false}, {"no": 46, "section": "X", "topic_id": "X-01", "topic": "參數量與運算量", "style": "計算", "stem": "某影像分類網路採用 ResNet 常見的瓶頸（Bottleneck）區塊：輸入 256 通道，依序經過 1×1 卷積（256→64 通道）、3×3 卷積（64→64 通道，same padding）、1×1 卷積（64→256 通道），各層皆含偏差，不計批次正規化與捷徑連接。這個區塊的可訓練參數總數為多少？", "options": {"A": "69,632：只計算三層的權重（16,384＋36,864＋16,384），漏算了三層的偏差（64＋64＋256），因此總數看起來比實際的少一些，也是常見的計算疏漏", "B": "1,180,160：以為使用的是兩層 3×3 卷積且輸入輸出皆為 256 通道，每層 3×3×256×256＋256＝590,080", "C": "70,016：(256×64＋64)＋(3×3×64×64＋64)＋(64×256＋256)＝16,448＋36,928＋16,640", "D": "36,928：只計算中間的 3×3 卷積層，兩側的 1×1 卷積層屬於通道調整，不含可訓練參數"}, "answer": "C", "explanation": "答案 C。第一個 1×1 卷積：256×64＋64 = 16,448；3×3 卷積：3×3×64×64＋64 = 36,928；最後的 1×1 卷積：64×256＋256 = 16,640；合計 70,016。若改成兩層 3×3 卷積且全程 256 通道，參數會高達 1,180,160，瓶頸結構先降通道再升通道，大幅減少參數。已用 Python 驗算。", "per_option": {"A": "漏算偏差：三層偏差共 64＋64＋256＝384，70,016 才是含偏差的總數。", "B": "那是兩層 3×3、256→256 卷積的參數量，與題目的瓶頸結構不同。", "C": "正確：三層卷積參數含偏差合計 70,016。", "D": "1×1 卷積同樣有權重與偏差，並非沒有可訓練參數。"}, "guide_ref": "指引未載（參數量計算）", "hot": true, "detail": {"steps": [["① 寫出卷積層參數量公式", "參數 ＝ 核高 × 核寬 × 輸入通道 × 輸出通道 ＋ 輸出通道（前面是權重個數；最後的「＋輸出通道」是偏差，每個輸出通道一個）", "題目三層都含偏差；k×k 卷積的核高 ＝ 核寬 ＝ k（1×1 就是 1，3×3 就是 3）"], ["② 第一層：1×1 卷積（256 → 64）", "參數 ＝ 1 × 1 × 輸入通道 × 輸出通道 ＋ 輸出通道", "＝ 1 × 1 × 256 × 64 ＋ 64 ＝ 16,384 ＋ 64 ＝ 16,448"], ["③ 第二層：3×3 卷積（64 → 64）", "參數 ＝ 3 × 3 × 輸入通道 × 輸出通道 ＋ 輸出通道", "＝ 3 × 3 × 64 × 64 ＋ 64 ＝ 36,864 ＋ 64 ＝ 36,928"], ["④ 第三層：1×1 卷積（64 → 256）", "參數 ＝ 1 × 1 × 輸入通道 × 輸出通道 ＋ 輸出通道", "＝ 1 × 1 × 64 × 256 ＋ 256 ＝ 16,384 ＋ 256 ＝ 16,640"], ["⑤ 三層相加", "總參數 ＝ 各層參數相加", "＝ 16,448 ＋ 36,928 ＋ 16,640 ＝ 70,016，選 C"], ["⑥ 對照其他選項", "每個錯誤選項都用錯了層結構或漏了偏差", "A：只算權重 16,384 ＋ 36,864 ＋ 16,384 ＝ 69,632，漏了偏差 64 ＋ 64 ＋ 256 ＝ 384；69,632 ＋ 384 ＝ 70,016。B：兩層 3×3、256 → 256：每層 3 × 3 × 256 × 256 ＋ 256 ＝ 589,824 ＋ 256 ＝ 590,080；兩層 ＝ 2 × 590,080 ＝ 1,180,160，是另一種結構。D：36,928 只有中間 3×3 層，兩側 1×1 卷積也有權重與偏差，不能略過"]], "tip": "卷積參數 ＝ 核高×核寬×輸入通道×輸出通道 ＋ 輸出通道（偏差）；瓶頸先降通道再升通道，省很多參數。", "fig": {"type": "layers", "title": "瓶頸區塊每層的通道與參數", "items": [{"name": "輸入", "shape": "256 通道"}, {"name": "Conv 1×1（降）", "shape": "64 通道", "note": "參數 256×64＋64 ＝ 16,448"}, {"name": "Conv 3×3", "shape": "64 通道", "note": "參數 3×3×64×64＋64 ＝ 36,928"}, {"name": "Conv 1×1（升）", "shape": "256 通道", "note": "參數 64×256＋256 ＝ 16,640", "hl": true}], "note": "總參數 ＝ 16,448 ＋ 36,928 ＋ 16,640 ＝ 70,016"}}}, {"no": 47, "section": "X", "topic_id": "X-02", "topic": "時間序列驗證", "style": "情境", "stem": "某連鎖超商要在每週一預測「未來 7 天」的各品項銷量，並希望驗證設計貼近實際部署。手上有 3 年的每日銷量資料。下列哪一種驗證設計最適當？", "options": {"A": "採前向（Walk-forward）驗證：每一折以某個週一之前的資料訓練，驗證窗口取緊接其後的 7 天，並將起點逐週往後推進，最後彙總各折誤差", "B": "將 3 年資料隨機打亂後做 5 折交叉驗證，使每折的驗證資料都隨機涵蓋各個日期，各季節與假日都能平均代表，且不需要考慮資料的時間先後順序與預測期長度", "C": "每折的驗證窗口取未來 90 天，並以 90 天的平均誤差評估模型，因為窗口越長越能涵蓋各種狀況，估計也越穩定", "D": "先用全部 3 年資料訓練模型，再回頭預測第 1 年的銷量作為驗證，因為訓練資料越多越能反映模型的真實實力"}, "answer": "A", "explanation": "答案 A。驗證要貼近部署：每週一預測未來 7 天，所以每折都應「用過去訓練、緊接其後的 7 天驗證」，並往後推進多折（前向驗證）。隨機打亂會讓未來資料進入訓練集（洩漏）；90 天窗口的預測步長與實際需求不同，誤差特性也不同；用包含驗證期的資料訓練再預測過去，等於讓模型看過答案。", "per_option": {"A": "正確：驗證窗口與部署預測期一致，並多折前向推進。", "B": "隨機打亂使未來資料進入訓練集，造成洩漏。", "C": "90 天預測步長與實際部署（7 天）不同，無法反映真實表現。", "D": "訓練資料包含驗證期，模型已看過答案，成績被嚴重高估。"}, "guide_ref": "指引未載（時間序列驗證）", "hot": true}, {"no": 48, "section": "X", "topic_id": "X-03", "topic": "網格與隨機搜尋", "style": "情境", "stem": "某團隊訓練大型模型，單次訓練需要 6 小時，預算最多只能評估 30 組超參數組合。他們希望每次挑選下一組超參數時，能參考已經評估過的結果，而不是每一組都獨立盲目挑選。下列哪種方法最適當？", "options": {"A": "網格搜尋（Grid Search）：事先列出所有候選值並窮舉所有組合，各組之間彼此獨立，且組合數會隨超參數個數連乘而爆炸", "B": "貝氏最佳化（Bayesian Optimization）：以已評估的結果建立代理模型，估計各組合的表現與不確定性，據以挑選下一個最值得評估的組合", "C": "隨機搜尋（Random Search）：在指定範圍內獨立隨機抽樣固定組數，每一組都互相獨立，不會利用先前的結果調整後續的抽樣，可用來平行評估大量組合以節省整體所需的時間", "D": "手動依序調參（Manual Tuning）：每次只改一個超參數、其他固定，直到每個參數都找到最佳值，必然能找到全域最佳組合"}, "answer": "B", "explanation": "答案 B。貝氏最佳化是序列式方法：用已評估的結果建立代理模型（如高斯過程），權衡「利用已知好區域」與「探索不確定區域」，挑下一組最有價值的組合，適合單次評估昂貴、預算有限的情境。網格與隨機搜尋的每一組彼此獨立，不利用先前結果；逐一手動調參可能因超參數之間的交互作用而錯過最佳組合，「必然」過於絕對。", "per_option": {"A": "網格搜尋各組獨立且組合數連乘爆炸，不利用先前結果。", "B": "正確：貝氏最佳化以過往結果決定下一組，適合昂貴評估。", "C": "隨機搜尋各組獨立，不利用先前結果。", "D": "超參數常有交互作用，逐一調整不保證全域最佳。"}, "guide_ref": "指引未載（超參數搜尋）", "hot": true}, {"no": 49, "section": "X", "topic_id": "X-04", "topic": "蒙地卡羅方法", "style": "情境", "stem": "某專案經理用蒙地卡羅模擬 10,000 次，估計「專案超出預算」的機率。兩位同事在輸入分佈完全相同的情況下分別執行程式，得到 12.4% 與 12.9%。其中一位懷疑程式有錯，因為「同樣的輸入應該得到同樣的答案」。下列判斷何者最適當？", "options": {"A": "確實有錯：蒙地卡羅是確定性演算法，輸入相同就必須得到完全相同的結果，兩次不同代表程式計算有誤", "B": "代表輸入分佈假設錯誤：只要把模擬次數增加到 100,000 次，兩人的結果就會完全相同，誤差來源與抽樣無關", "C": "代表模擬次數太少導致結果無效：蒙地卡羅至少需要 100 萬次以上才能得到可用的機率估計，10,000 次完全不可信", "D": "屬於抽樣隨機性造成的正常波動：每次抽到的隨機情境不同；可固定隨機種子讓結果可重現，並以增加模擬次數縮小波動"}, "answer": "D", "explanation": "答案 D。蒙地卡羅依賴隨機抽樣，每次抽到的情境不同，估計值會有抽樣誤差；10,000 次下 0.5 個百分點的差距在合理範圍內。固定隨機種子（seed）可以讓結果重現，增加模擬次數可縮小波動（誤差約與 √N 成反比），但不會讓不同種子的結果完全相同。輸入分佈假設錯誤是另一種問題，增加次數也無法修正。", "per_option": {"A": "蒙地卡羅依賴隨機抽樣，不是確定性演算法。", "B": "增加次數只會縮小波動，不會讓不同種子的結果完全相同；兩人輸入分佈相同，也沒有證據顯示假設錯誤。", "C": "沒有「至少 100 萬次」的硬性標準，10,000 次已能得到有參考價值的估計。", "D": "正確：這是抽樣隨機性造成的正常波動，可固定種子與增加次數。"}, "guide_ref": "指引未載（蒙地卡羅方法）", "hot": true}, {"no": 50, "section": "X", "topic_id": "X-09", "topic": "時間複雜度", "style": "計算", "stem": "某團隊以暴力法（Brute-force）實作 K 近鄰預測：每筆查詢都要計算與全部 n 筆訓練資料的距離，每次距離計算的成本與特徵數 d 成正比。目前訓練資料 n＝50,000、查詢數 q＝2,000、d＝100。若訓練資料量與查詢數都變成原本的 2 倍，特徵數 d 不變，總距離運算量大約變為原本的幾倍？", "options": {"A": "約 4 倍：總運算量為 O(q×n×d)，q 與 n 各乘 2 倍，整體乘 2×2＝4", "B": "約 2 倍：訓練資料與查詢數同步變 2 倍，工作量也只會跟著線性成長 2 倍，不會相乘", "C": "約 8 倍：除了 q 與 n 之外，距離計算還要把特徵維度的處理成本再多算一次 2 倍", "D": "約 16 倍：兩兩比對的成本與 n² 成正比，n 變 2 倍為 4 倍，查詢數 q 再平方一次變 4 倍，相乘得 16 倍"}, "answer": "A", "explanation": "答案 A。暴力法的總運算量約為 q × n × d 次基本運算；q 與 n 各變成 2 倍、d 不變，總量變成 2×2 = 4 倍。B 把兩個因素當成相加；C 重複計入並未變動的 d；D 把 q 也平方了。已用 Python 驗算比例。", "per_option": {"A": "正確：O(q×n×d)，q 與 n 各乘 2，總量乘 4。", "B": "q 與 n 是相乘關係，不是相加，不會只增加 2 倍。", "C": "特徵數 d 不變，不應再乘 2。", "D": "查詢數 q 只出現一次，不應平方；n² 也不是此演算法的成本。"}, "guide_ref": "指引未載（時間複雜度）", "hot": false, "detail": {"steps": [["① 寫出暴力法 KNN 的總運算量", "總運算量 ∝ 查詢數 q × 訓練筆數 n × 特徵數 d（每筆查詢要和每筆訓練資料算一次距離，每次距離又要看 d 個特徵；∝ 讀作「成正比」）", "原本：q ＝ 2,000，n ＝ 50,000，d ＝ 100 → 2,000 × 50,000 × 100 ＝ 10,000,000,000 ＝ 1×10¹⁰"], ["② 算改變後的運算量", "新的 q、n 各是原本的 2 倍，d 不變", "q' ＝ 2 × 2,000 ＝ 4,000；n' ＝ 2 × 50,000 ＝ 100,000；d ＝ 100 → 4,000 × 100,000 × 100 ＝ 40,000,000,000 ＝ 4×10¹⁰"], ["③ 算倍數", "倍數 ＝ 新運算量 ÷ 原運算量（也等於 q 的倍數 × n 的倍數 × d 的倍數）", "4×10¹⁰ ÷ 1×10¹⁰ ＝ 4；用倍數驗算：2 × 2 × 1 ＝ 4，選 A"], ["④ 對照其他選項", "三個因素是「相乘」，只有 q 與 n 會變", "B：2 倍是只算一個因素，漏了 q 與 n 相乘（2 × 2 ＝ 4，不是 2）。C：8 倍＝ 2 × 2 × 2，多乘了一次 d，但 d 不變（倍數是 1）。D：16 倍＝ (2²) × (2²)，把 q 與 n 各平方了一次，但各只出現一次"]], "tip": "暴力法 KNN：運算量 ∝ q × n × d，哪個變幾倍就乘幾倍，沒變的乘 1。"}}], "15": [{"no": 1, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "情境", "stem": "某零售企業建立一個銷售預測模型，希望評估該模型在不同月份的新資料上，是否仍能維持穩定的預測表現。資料科學團隊計畫利用統計方法檢驗模型對未觀察資料的適應能力與泛化效果。下列哪一種方法最適合用於此目的？", "options": {"A": "F 檢定（F-test）", "B": "交叉驗證（Cross-Validation）", "C": "配對樣本t 檢定（Paired-sample t-test）", "D": "卡方檢定（Chi-square Test）"}, "answer": "B", "explanation": "答案 B。要看模型在「沒看過的資料」上表現是否穩定，就是交叉驗證：把資料切成多份，輪流當訓練與驗證，看每一份的成績是否一致。F 檢定、t 檢定、卡方檢定都是檢驗統計差異的工具，不是用來評估模型泛化的。", "per_option": {"A": "F 檢定是比較變異數或迴歸整體顯著性，不是評估泛化能力。", "B": "正確：交叉驗證輪流用不同資料驗證，能反映模型對未見資料的穩定度。", "C": "配對樣本 t 檢定是比較同一批對象前後平均數有沒有差異，不是模型驗證法。", "D": "卡方檢定是檢驗類別資料的關聯或分布差異，不是模型驗證法。"}, "guide_ref": "學習指引 p.5-17～5-18、5-26～5-29", "hot": true}, {"no": 2, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "定義", "stem": "在建立迴歸或分類模型時，若希望避免模型過度擬合（Overfitting），可透過加入正則化項以限制模型的複雜度。其中，L1 正則化（Lasso）的主要效果為何？", "options": {"A": "增加模型參數的數量，以提升表現靈活度", "B": "強化梯度穩定性，避免參數更新過度震盪", "C": "產生稀疏模型（Sparse Model），使部分參數權重收斂為零", "D": "提高學習率（Learning Rate），加速模型收斂速度"}, "answer": "C", "explanation": "答案 C。L1 正則化（Lasso）在損失函數加上「權重絕對值總和」當懲罰，會把不重要特徵的權重壓到剛好等於 0，所以得到稀疏模型，同時有特徵篩選的效果。L2（Ridge）只會讓權重變小，不會變成 0。", "per_option": {"A": "正則化是限制複雜度、減少過擬合，不會增加參數數量。", "B": "梯度穩定屬於梯度裁剪、權重初始化等做法，不是 L1 的主要效果。", "C": "正確：L1 懲罰會讓部分權重收斂為 0，形成稀疏模型。", "D": "學習率是另一個超參數，正則化不會提高學習率。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true}, {"no": 3, "section": "3.3", "topic_id": "3.3-02", "topic": "非凸與局部最優", "style": "定義", "stem": "在訓練非線性模型時，若目標函數為非凸函數（Non-convex Function），演算法在參數更新過程中可能出現多個極值點，導致最佳化結果不穩定。請問此時最可能發生下列哪一種情況？", "options": {"A": "梯度消失", "B": "資料過少", "C": "局部最優解", "D": "過擬合"}, "answer": "C", "explanation": "答案 C。非凸函數可能有很多個「谷底」，梯度下降走到其中一個就停了，但那不一定是最低的，這就是局部最優解。梯度消失是深層網路反向傳播時梯度越來越小，過擬合是資料與模型複雜度的問題，都不是「非凸」直接造成的。", "per_option": {"A": "梯度消失是反向傳播層層連乘讓梯度變太小，與函數是否非凸是不同問題。", "B": "資料過少是資料面的問題，與目標函數的形狀無關。", "C": "正確：非凸函數有多個極值點，演算法可能停在局部最優而不是全域最優。", "D": "過擬合是模型記住訓練資料細節，不是由非凸函數直接造成。"}, "guide_ref": "學習指引 p.3-20～3-21", "hot": false}, {"no": 4, "section": "4.2", "topic_id": "4.2-16", "topic": "DBSCAN", "style": "情境", "stem": "在執行 DBSCAN（Density-Based Spatial Clustering of Applications with Noise）群集分析時，若某資料點鄰域內的樣本數不足以形成核心點（Core Point），且該點未被任何核心點的鄰域所包含，也未與其他群集形成密度可達關係（Density Reachability），此資料點最終將被歸類為哪一種類型？", "options": {"A": "鄰近點（Neighbor Point）", "B": "雜訊點（Noise Point）", "C": "邊界點（Border Point）", "D": "潛在點（Potential Point）"}, "answer": "B", "explanation": "答案 B。DBSCAN 把點分成三類：核心點（鄰域夠密）、邊界點（自己不夠密但落在某核心點的鄰域內）、雜訊點（兩者都不是）。題目說這點既不是核心點，也沒被任何核心點的鄰域涵蓋，所以是雜訊點。", "per_option": {"A": "DBSCAN 沒有「鄰近點」這種分類。", "B": "正確：不是核心點、也不在任何核心點鄰域內，就是雜訊點（Noise）。", "C": "邊界點是落在核心點鄰域內的點，題目明講它沒被任何核心點涵蓋，所以不是。", "D": "DBSCAN 沒有「潛在點」這種分類。"}, "guide_ref": "學習指引 p.4-43～4-44", "hot": false}, {"no": 5, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "情境", "stem": "某智慧製造公司開發一套影像辨識系統，用於自動檢測生產線上的瑕疵產品。系統採用卷積神經網路（Convolutional Neural Network, CNN）作為主要模型架構，其中第一層卷積層（Convolutional Layer）主要負責的功能為下列何者？", "options": {"A": "自動提取輸入影像中的局部特徵", "B": "降低影像維度以加速運算效率", "C": "增加神經元與參數數量以提升模型容量", "D": "整合所有特徵並輸出最終分類結果"}, "answer": "A", "explanation": "答案 A。卷積層用小小的卷積核在影像上滑動，自動抽取局部特徵（第一層通常是邊緣、紋理），這就是它的主要功能。降維是池化層做的事，整合特徵並輸出分類是全連接層與輸出層做的事。", "per_option": {"A": "正確：卷積核掃過影像，自動提取邊緣、紋理等局部特徵。", "B": "降低影像維度、加速運算是池化層的主要功能。", "C": "卷積層靠權重共享反而讓參數變少，不是為了增加參數。", "D": "整合所有特徵並輸出最終分類是全連接層加輸出層的工作。"}, "guide_ref": "學習指引 p.4-67～4-71", "hot": true}, {"no": 6, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "情境", "stem": "某智慧城市團隊開發一套交通監控系統，用於即時辨識路口監視器影像中的車輛與行人。團隊比較後發現，卷積神經網路（Convolutional Neural Network, CNN）在訓練與推論效率上，明顯優於傳統的全連接神經網路（Fully Connected Neural Network, FCNN）。請問下列何者為主要原因？", "options": {"A": "CNN 能自動學習影像的旋轉與比例不變性", "B": "CNN 可直接跳過人工特徵提取步驟進行分類", "C": "CNN 透過區域感知（Local Receptive Field）與參數共享（Parameter Sharing）機制，降低模型參數量與運算複雜度", "D": "CNN 捨棄激勵函數（Activation Function），以加快運算速度"}, "answer": "C", "explanation": "答案 C。CNN 的卷積核只看局部區域（區域感知），而且同一個卷積核在整張圖共用（參數共享），所以參數量比「每個像素都連到每個神經元」的全連接網路少很多，運算也輕得多。", "per_option": {"A": "旋轉與比例不變性並不是 CNN 自動學到的（池化只提供一點平移上的穩定），也不是效率較好的主因。", "B": "不用人工特徵提取是 CNN 的優點之一，但它說的是便利性，不是訓練與推論效率變好的原因。", "C": "正確：區域感知與參數共享大幅降低參數量與運算複雜度。", "D": "CNN 仍然使用激活函數（如 ReLU），沒有捨棄。"}, "guide_ref": "學習指引 p.4-67～4-71", "hot": true}, {"no": 7, "section": "4.3", "topic_id": "4.3-09", "topic": "RNN 與 LSTM", "style": "定義", "stem": "下列哪一種應用最適合採用長短期記憶網路（Long Short-Term Memory, LSTM）模型？", "options": {"A": "預測未來七天的電力需求變化趨勢", "B": "辨識監視影像中不同類別的物件", "C": "將大量顧客資料依相似特徵自動分群", "D": "將高維度的感測器資料壓縮成低維表示"}, "answer": "A", "explanation": "答案 A。LSTM 是處理序列資料的模型，擅長記住較長的時間依賴，所以預測未來七天電力需求這種時間序列最適合。影像辨識用 CNN，自動分群用 K-means 之類的非監督方法，高維壓縮成低維用 PCA 或自編碼器。", "per_option": {"A": "正確：電力需求是隨時間變化的序列，LSTM 擅長處理。", "B": "辨識影像中的物件類別是 CNN 的強項。", "C": "依相似特徵自動分群是非監督式分群（如 K-means）。", "D": "把高維資料壓縮成低維表示是降維（PCA）或自編碼器的工作。"}, "guide_ref": "學習指引 p.4-72～4-76", "hot": false}, {"no": 8, "section": "4.2", "topic_id": "4.2-04", "topic": "決策樹", "style": "定義", "stem": "資訊增益（Information Gain）常用於衡量特徵對分類結果的不確定性貢獻程度，並據以進行特徵選擇。此方法主要應用於下列哪一類模型架構中？", "options": {"A": "使用 L1 正則化進行特徵篩選的線性模型", "B": "利用激活函數（Activation Function）進行特徵擷取的深度神經網路", "C": "透過核函數（Kernel Function）將特徵映射至高維空間的分類模型", "D": "透過遞迴分裂方式建立分類規則的決策樹模型"}, "answer": "D", "explanation": "答案 D。資訊增益是「切分前後熵（不確定性）減少了多少」，決策樹每一步都用它挑出最能把類別分開的特徵來遞迴分裂。其他選項的模型分別靠正則化、激活函數、核函數運作，沒有用資訊增益。", "per_option": {"A": "L1 線性模型靠係數歸零做特徵篩選，不是資訊增益。", "B": "深度神經網路用激活函數與梯度下降學習，沒有資訊增益。", "C": "SVM 等核方法靠核函數映射高維空間，與資訊增益無關。", "D": "正確：決策樹遞迴分裂時，以資訊增益挑選切分特徵。"}, "guide_ref": "學習指引 p.4-19～4-21、4-30～4-31", "hot": false}, {"no": 9, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "定義", "stem": "在建構以距離為基礎的機器學習模型（如KNN、SVM）時，下列哪一項資料前處理方式最為關鍵？", "options": {"A": "進行特徵縮放（Feature Scaling），使各特徵變數具有相似的數值範圍", "B": "將連續型特徵變數轉換為類別型變數", "C": "以平均值或中位數進行缺失值補齊", "D": "進行隨機抽樣以平衡資料筆數"}, "answer": "A", "explanation": "答案 A。KNN、SVM 都要計算點與點的「距離」，如果某個特徵數值特別大（如薪水 5 萬 vs 年齡 30），距離就會被它主導。特徵縮放讓每個特徵的數值範圍相近，是這類模型最關鍵的前處理。", "per_option": {"A": "正確：距離式模型最怕尺度不一，需要先做特徵縮放。", "B": "連續轉類別會丟失資訊，也不是為了解決尺度問題。", "C": "補缺失值重要，但不是距離式模型「最關鍵」的前處理。", "D": "隨機抽樣平衡筆數是處理類別不平衡，與特徵尺度無關。"}, "guide_ref": "學習指引 p.5-6～5-8", "hot": true}, {"no": 10, "section": "X", "topic_id": "X-05", "topic": "AutoML", "style": "情境", "stem": "下列哪一種應用情境最適合導入AutoML，以提升模型開發效率？", "options": {"A": "公司已有完整的MLOps 平台與資深資料科學團隊，模型更新採固定流程", "B": "製造部門的生產良率模型已長期穩定運作，只需定期調整參數", "C": "行銷部門希望在短時間內比較多種顧客流失預測模型，缺乏專職工程師與時間進行手動建模", "D": "財務部門正在開發高度客製化的信用風險評估模型，需要精細控制特徵工程與演算法細節"}, "answer": "C", "explanation": "答案 C。AutoML 的價值是自動化選模型、調超參數，讓缺工程師、時間緊的團隊快速比較多種模型。已有完整 MLOps 與資深團隊、模型長期穩定的情境，或需要精細控制特徵與演算法的客製化模型，都不是 AutoML 最能發揮的場合。", "per_option": {"A": "已有完整 MLOps 與資深團隊、流程固定，不太需要 AutoML 來提升開發效率。", "B": "模型已穩定運作、只需定期調參，用不到大範圍自動搜尋。", "C": "正確：缺專職工程師又要在短時間比較多種模型，正是 AutoML 的適用情境。", "D": "需要精細控制特徵工程與演算法細節的客製化模型，不適合交給 AutoML。"}, "guide_ref": "指引未載（AutoML：自動挑模型與調超參數的工具，依通用說明）", "hot": false}, {"no": 11, "section": "X", "topic_id": "X-03", "topic": "網格與隨機搜尋", "style": "比較", "stem": "相較於Grid Search，Random Search 在超參數調整上具備哪一項主要優勢？", "options": {"A": "可自動產生模型架構", "B": "可使用更大的訓練集", "C": "避免模型過擬合", "D": "能更有效率搜尋高維參數空間"}, "answer": "D", "explanation": "答案 D。網格搜尋要把所有組合都跑一遍，超參數一多組合數就爆炸；隨機搜尋只隨機抽一部分組合，在高維空間用較少次數就有機會找到不錯的設定，所以效率較高。兩者都不能自動產生架構、不能增加訓練集，也都不能保證避免過擬合。", "per_option": {"A": "自動產生模型架構是 NAS（神經架構搜尋）的事，不是 Random Search。", "B": "訓練集大小與用哪種搜尋法無關。", "C": "兩種搜尋都不能保證避免過擬合，避免過擬合要靠正則化、驗證等做法。", "D": "正確：隨機抽樣組合，在高維參數空間比逐一枚舉更有效率。"}, "guide_ref": "指引未載（網格搜尋與隨機搜尋，超參數搜尋屬補充考點）", "hot": true}, {"no": 12, "section": "5.4", "topic_id": "5.4-03", "topic": "學習率", "style": "情境", "stem": "某智慧製造公司開發一套設備故障預測系統，利用感測器資料訓練深度神經網路（Deep Neural Network, DNN）模型，以提前偵測異常運作跡象。在訓練過程中，團隊發現模型收斂速度不穩定：有時過快導致過擬合，有時又遲遲無法達到最佳準確率。開發團隊可以藉由調整下列哪一項超參數（Hyperparameter）以改善此問題？", "options": {"A": "每個神經元的輸出結果", "B": "損失函數（Loss Function）在訓練過程中的梯度變化值（Gradient）", "C": "學習率（Learning Rate），控制模型權重更新的速度", "D": "模型在訓練後產生的權重值"}, "answer": "C", "explanation": "答案 C。收斂時快時慢、不穩定，是學習率（每次更新權重走多大步）沒調好的典型症狀：太大會震盪或衝過頭，太小會走得很慢。學習率是我們可以事先設定的超參數，而神經元輸出、梯度、訓練後權重都是訓練中算出來的結果，不是超參數。", "per_option": {"A": "神經元輸出是計算結果，不是可以事先調整的超參數。", "B": "梯度是反向傳播算出來的值，不是超參數。", "C": "正確：學習率控制權重更新的步伐，是調整收斂速度與穩定度的超參數。", "D": "訓練後的權重是學習的結果，不是超參數。"}, "guide_ref": "學習指引 p.5-19、5-31～5-32", "hot": true}, {"no": 13, "section": "6.2", "topic_id": "6.2-01", "topic": "偏見類型與成因", "style": "定義", "stem": "標籤偏差(Label Bias)通常是因為什麼原因造成？", "options": {"A": "訓練資料量過大", "B": "標記資料本身帶有主觀偏見", "C": "模型結構設計不當", "D": "特徵數量設定過多"}, "answer": "B", "explanation": "答案 B。標籤偏差（Label Bias）指資料的標籤（答案）本身就帶有人為的主觀偏見，例如標註員對某族群的刻板印象，模型學了就會把偏見複製下去。資料量大小、模型結構、特徵數量都不是它的成因。", "per_option": {"A": "資料量大不會造成標籤偏差。", "B": "正確：標記者的主觀偏見直接寫進標籤，就是標籤偏差。", "C": "模型結構設計不當會造成效能問題，與標籤偏差無關。", "D": "特徵數量設定過多是維度問題，與標籤偏差無關。"}, "guide_ref": "學習指引 p.6-14～6-17", "hot": true}, {"no": 14, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "情境", "stem": "下列哪一種AI 應用情境中，模型的可解釋性（Explainability）最為關鍵？", "options": {"A": "電商平台利用深度學習模型預測用戶的下一次購買時間，以優化推播行銷策略", "B": "新創公司使用機器學習演算法自動調整廣告出價策略，以提升點擊轉換率", "C": "醫院導入AI 模型分析病患影像並給出腫瘤惡性可能性，作為臨床醫師診斷依據", "D": "銀行導入AI 模型預測客戶流失率，並自動推薦留客優惠方案"}, "answer": "C", "explanation": "答案 C。醫療影像診斷關係到人命，醫師需要知道模型為何判斷為惡性，才能拿來當診斷依據並負責，所以可解釋性最關鍵。預測購買時間、調廣告出價、預測流失與推優惠，錯了損失比較小，主要看效果即可。", "per_option": {"A": "預測下次購買時間錯了只是行銷效果打折，對解釋性要求較低。", "B": "自動調廣告出價追求轉換率，主要看成效而非解釋。", "C": "正確：高風險的醫療診斷必須讓醫師理解並驗證模型的判斷依據。", "D": "預測流失並推優惠屬一般商業決策，風險相對較低。"}, "guide_ref": "學習指引 p.5-14～5-15", "hot": true}, {"no": 15, "section": "5.3", "topic_id": "5.3-05", "topic": "迴歸評估指標", "style": "定義", "stem": "在線性迴歸模型中，若R²值為0.85，其意義為何？", "options": {"A": "模型準確率為85%", "B": "85%的變異可被模型解釋", "C": "預測誤差為15%", "D": "模型有85%的信心水準"}, "answer": "B", "explanation": "答案 B。R²（決定係數）代表模型「解釋了多少比例的變異」，0.85 就是目標變數 85% 的變異可以被模型解釋。它不是準確率（那是分類指標）、不是誤差百分比，也不是信心水準。", "per_option": {"A": "準確率是分類指標，R² 是迴歸指標，兩者不能互換。", "B": "正確：R² ＝ 0.85 表示 85% 的變異可被模型解釋。", "C": "R² 不是誤差比例，預測誤差要看 MSE、RMSE、MAE。", "D": "信心水準是統計推論中的概念（如 95% 信賴區間），與 R² 無關。"}, "guide_ref": "學習指引 p.5-22～5-24", "hot": true}, {"no": 16, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "定義", "stem": "在二元分類問題中，若精確率（Precision）為0.8，召回率（Recall）為0.6，則F1 分數（F1 Score）為何？", "options": {"A": "0.686", "B": "0.700", "C": "0.720", "D": "0.750"}, "answer": "A", "explanation": "答案 A。F1 是精確率與召回率的調和平均：F1 ＝ 2×P×R ÷ (P＋R) ＝ 2×0.8×0.6 ÷ (0.8＋0.6) ＝ 0.96 ÷ 1.4 ≈ 0.686。調和平均會偏向較小的那個數，所以比算術平均 0.7 還低。", "per_option": {"A": "正確：2×0.8×0.6÷1.4 ≈ 0.686。", "B": "0.700 是 (0.8＋0.6)÷2 的算術平均，不是 F1。", "C": "0.720 不是 P 與 R 任何標準算法的結果，是干擾選項。", "D": "0.750 恰好是 R÷P＝0.6÷0.8，與 F1 無關。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true, "detail": {"steps": [["① 公式", "F1 ＝ 2 × Precision × Recall ÷ (Precision ＋ Recall)（精確率與召回率的調和平均）", "代入 Precision ＝ 0.8、Recall ＝ 0.6：分子 2 × 0.8 × 0.6 ＝ 0.96；分母 0.8 ＋ 0.6 ＝ 1.4"], ["② 相除", "分子 ÷ 分母", "0.96 ÷ 1.4 ≈ 0.6857，四捨五入約 0.686，選 A"], ["③ 對照其他選項", "算術平均 ＝ (P ＋ R) ÷ 2；調和平均會偏向較小的數", "B：(0.8 ＋ 0.6) ÷ 2 ＝ 0.700，是算術平均，不是 F1。D：0.6 ÷ 0.8 ＝ 0.75，是 R ÷ P。C：0.72 不是標準算法的結果"]], "tip": "F1 是調和平均，一定比算術平均小（偏向較低的那個）；先算好分子 2PR 再除以 P＋R。"}}, {"no": 17, "section": "3.3", "topic_id": "3.3-05", "topic": "動量與 Adam", "style": "定義", "stem": "下列哪一種優化演算法內建動量（Momentum）的設計機制？", "options": {"A": "SGD+Momentum", "B": "Adam", "C": "RMSProp", "D": "Adagrad"}, "answer": "B", "explanation": "答案 B。Adam 同時結合「動量（一階動量，累積過去梯度方向）」與「RMSProp 式的自適應學習率（二階動量）」，演算法本身就內建動量機制。RMSProp、Adagrad 只有自適應學習率，沒有動量。（註：SGD＋Momentum 也含動量，但它是在 SGD 外加動量項，選項名稱已註明；此題 A 與 B 都有動量，有爭議，考試照官方答案選 B。）", "per_option": {"A": "SGD＋Momentum 是在 SGD 外加動量項，名稱就寫明帶動量，並非「內建」；但這是本題爭議點。", "B": "正確：Adam ＝ 動量 ＋ RMSProp，內建一階動量與自適應學習率。", "C": "RMSProp 只調整各參數的學習率（累積平方梯度），沒有動量。", "D": "Adagrad 只做自適應學習率（累積梯度平方，學習率會越來越小），沒有動量。"}, "guide_ref": "學習指引 p.3-24～3-26", "hot": true}, {"no": 18, "section": "4.2", "topic_id": "4.2-07", "topic": "XGBoost", "style": "比較", "stem": "下列何者最能同時反映XGBoost（eXtreme Gradient Boosting）相較於傳統梯度提升決策樹（Gradient Boosting Decision Tree, GBDT）的主要技術改進？", "options": {"A": "引入正則化項（Regularization）以抑制過擬合，並支援缺失值自動處理與並行化訓練", "B": "改以隨機森林（Random Forest）架構取代樹模型以提升準確率", "C": "以類神經網路（Neural Network）取代弱分類器（Weak Learners）", "D": "採用批次正規化（Batch Normalization）技術提升模型穩定性"}, "answer": "A", "explanation": "答案 A。XGBoost 是 GBDT 的工程強化版：在目標函數加入正則化項抑制過擬合、能自動處理缺失值、支援並行化，所以又快又不容易過擬合。它的弱學習器仍然是決策樹，沒有換成隨機森林或神經網路，也不用批次正規化。", "per_option": {"A": "正確：正則化項、缺失值自動處理、並行化訓練是 XGBoost 的主要改進。", "B": "隨機森林是另一種集成方法（bagging），XGBoost 並沒有改成隨機森林架構。", "C": "XGBoost 的弱學習器是決策樹，不是神經網路。", "D": "批次正規化是深度學習的技術，與 XGBoost 無關。"}, "guide_ref": "學習指引 p.4-22～4-24", "hot": true}, {"no": 19, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "否定", "stem": "某醫療機構開發疾病早期偵測模型，正樣本（確診病例）僅佔 3%。在模型訓練與評估過程中，下列哪一種作法最不適合用於提升對少數類病例的預測能力？", "options": {"A": "使用SMOTE 過採樣", "B": "調整類別權重", "C": "使用準確率（Accuracy）作為評估指標", "D": "欠採樣多數類(Undersampling the majority class)"}, "answer": "C", "explanation": "答案 C。正樣本只占 3%，模型即使全部猜「陰性」準確率也有 97%，所以準確率根本看不出對少數類的預測好壞，用它當指標最不適合。SMOTE 過採樣、類別權重、欠採樣都是改善不平衡資料的常見做法；評估應改看 Recall、Precision、F1、PR-AUC。", "per_option": {"A": "SMOTE 合成少數類樣本，是常用的不平衡處理法。", "B": "調整類別權重讓少數類錯誤的代價更高，是常用做法。", "C": "正確：不平衡資料下準確率會被多數類墊高，無法反映少數類表現。", "D": "欠採樣多數類可平衡類別比例，是常用做法（缺點是可能丟資料）。"}, "guide_ref": "學習指引 p.5-20～5-22、5-48～5-49", "hot": true}, {"no": 20, "section": "5.1", "topic_id": "5.1-03", "topic": "特徵工程策略", "style": "情境", "stem": "某電子商務公司為開發商品評論情感分析模型，希望模型能捕捉評論中不同特徵之間的關聯影響，例如「商品價格」與「顧客滿意度」的互動效果。下列哪一種特徵工程設計方式最適合用於建立互動特徵（Interaction Features）？", "options": {"A": "將單一特徵取平方", "B": "對所有特徵進行對數轉換", "C": "將兩個或多個特徵進行乘積或交互組合", "D": "對特徵進行標準化"}, "answer": "C", "explanation": "答案 C。互動特徵（Interaction Features）就是把兩個以上的特徵相乘或組合，讓模型捕捉「價格與滿意度一起變化」的效果。取平方是多項式特徵，對數是處理偏態，標準化是縮放，都不是兩個特徵的交互。", "per_option": {"A": "單一特徵取平方是多項式特徵，沒有跨特徵的交互。", "B": "對數轉換用來處理偏態，也只針對單一特徵。", "C": "正確：多個特徵相乘或交互組合，才是互動特徵。", "D": "標準化是尺度調整，不會產生特徵間的交互。"}, "guide_ref": "學習指引 p.5-9～5-10", "hot": true}, {"no": 21, "section": "4.3", "topic_id": "4.3-12", "topic": "注意力機制", "style": "情境", "stem": "某語音辨識系統開發團隊採用 Transformer 架構，為了讓模型能同時理解語音片段中的發音特徵、語速變化與語意脈絡等多層次資訊，團隊在設計中導入了多頭注意力（Multi-head Attention）機制。請問下列何者為此機制的主要優點？", "options": {"A": "減少模型參數量以降低訓練成本", "B": "加速整體注意力計算過程", "C": "從不同表示子空間（Representation Subspaces）同時捕捉多樣化關聯資訊", "D": "避免梯度消失（Gradient Vanishing）問題"}, "answer": "C", "explanation": "答案 C。多頭注意力把表示拆成多個「頭」，每個頭在不同的表示子空間學不同類型的關聯（如發音、語速、語意），再合併起來，所以能同時捕捉多樣化資訊。它不是為了減少參數、加速計算或避免梯度消失。", "per_option": {"A": "多頭注意力通常不會減少參數量，目的是增加表達能力。", "B": "多頭並不是為了加速；各頭可平行計算，但整體計算量並沒有因此變小。", "C": "正確：不同的頭在不同表示子空間同時捕捉多種關聯。", "D": "避免梯度消失主要靠殘差連接與層正規化，不是多頭注意力的目的。"}, "guide_ref": "學習指引 p.4-76～4-83", "hot": true}, {"no": 22, "section": "3.1", "topic_id": "3.1-03", "topic": "貝氏定理與條件機率", "style": "情境", "stem": "某電商平台希望預測顧客是否會購買特定商品。系統蒐集顧客的瀏覽紀錄、停留時間、商品類別偏好與過去購買行為，並以此推估「在觀察到這些行為特徵的情況下，該顧客會購買的機率」。若模型採用貝氏定理（Bayes’Theorem）進行推論，下列敘述何者最符合其核心運作機制？", "options": {"A": "根據歷史樣本自動分群，找出行為相似的顧客群", "B": "以條件機率方式計算顧客屬於「會購買」或「不會購買」的分類機率", "C": "以最小平方誤差（Mean Squared Error）為損失函數，預測顧客的購買金額", "D": "依據回饋信號（Feedback Signal）透過強化學習（Reinforcement Learning）動態調整推薦策略"}, "answer": "B", "explanation": "答案 B。貝氏定理的核心是條件機率 P(類別｜特徵)，題目要的「看到這些行為後會購買的機率」正是它。所以最符合的是「用條件機率算出屬於會購買或不會購買的分類機率」（單純貝氏分類器）。分群是非監督、MSE 預測金額是迴歸、回饋信號調策略是強化學習。", "per_option": {"A": "依歷史樣本自動分群是非監督式學習（如 K-means）。", "B": "正確：以條件機率計算屬於各類別的機率，就是貝氏分類。", "C": "以 MSE 預測購買金額是迴歸問題，不是貝氏定理的運作。", "D": "依回饋信號調整策略是強化學習。"}, "guide_ref": "學習指引 p.3-5～3-6", "hot": true}, {"no": 23, "section": "X", "topic_id": "X-04", "topic": "蒙地卡羅方法", "style": "情境", "stem": "一家再生能源公司希望預測未來三個月太陽能發電量的波動範圍。由於氣候條件具有高度隨機性，且輸入變數（如日照時數、雲量、溫度）之間存在不確定關係，工程團隊決定以隨機抽樣方式模擬多種可能情境，以估算整體發電量的機率分佈與風險區間。請問此時所採用的技術最符合下列哪一種方法？", "options": {"A": "蒙地卡羅方法（Monte Carlo Method）", "B": "K-means 聚類（K-means Clustering）", "C": "支持向量迴歸（Support Vector Regression, SVR）", "D": "特徵選取（Feature Selection）"}, "answer": "A", "explanation": "答案 A。蒙地卡羅方法用大量隨機抽樣模擬各種可能情境，來估算結果的機率分布與風險區間，題目描述的就是這件事。K-means 是分群、SVR 是迴歸模型、特徵選取是挑選輸入變數，都不是用隨機模擬估分布。", "per_option": {"A": "正確：以隨機抽樣模擬多種情境，估算機率分布與風險區間，就是蒙地卡羅。", "B": "K-means 是把資料分群，不是模擬不確定性。", "C": "SVR 是一種迴歸模型，輸出預測值，而不是模擬機率分布。", "D": "特徵選取是挑選有用的輸入變數，與模擬情境無關。"}, "guide_ref": "指引未載（蒙地卡羅方法：用大量隨機抽樣模擬不確定性）", "hot": true}, {"no": 24, "section": "5.3", "topic_id": "5.3-04", "topic": "殘差分析", "style": "情境", "stem": "某房地產公司利用多元迴歸模型（Multiple Regression Model）預測房價，並繪製殘差圖（Residual Plot）檢查模型品質。結果顯示部分資料點的殘差極大，且在高價區樣本中出現系統性彎曲分佈現象。根據此觀察，下列何者為最可能的正確解釋？", "options": {"A": "模型過度擬合（Overfitting），導致在訓練資料上表現過好、泛化能力不足", "B": "模型特徵數量不足，導致欠擬合（Underfitting）", "C": "模型存在異常值（Outlier）或非線性關係，違反迴歸假設", "D": "殘差圖呈現隨機分佈，表示模型已完全符合所有假設"}, "answer": "C", "explanation": "答案 C。殘差圖正常應該是隨機散布在 0 附近、沒有規律。題目出現少數極大殘差（異常值）加上系統性彎曲（代表有非線性關係沒被線性模型抓到），都違反迴歸的假設。", "per_option": {"A": "過擬合是訓練表現很好、測試很差，殘差圖的彎曲型態更像是非線性關係沒被捕捉。", "B": "特徵不足會造成欠擬合，但題目的重點是「極大殘差＋系統性彎曲」，更直接指向異常值與非線性。", "C": "正確：極大殘差指向異常值，系統性彎曲指向非線性，兩者都違反線性迴歸假設。", "D": "殘差圖有系統性彎曲就不是隨機分布，不能說模型完全符合假設。"}, "guide_ref": "學習指引 p.5-24", "hot": true}, {"no": 25, "section": "X", "topic_id": "X-08", "topic": "信用評分卡", "style": "否定", "stem": "某金融機構正在建立傳統信用評分卡模型，採用邏輯迴歸（Logistic Regression）作為建模方法，並依循監理機關建議的標準化流程進行模型開發。下列哪一項不是傳統信用評分卡模型開發流程中的常見步驟？", "options": {"A": "使用生成式模型進行特徵學習", "B": "進行特徵選擇與多重共線性（Multicollinearity）分析", "C": "進行分箱（Binning）與資訊值（Information Value, IV）檢定", "D": "使用樣本穩定性指標（Population Stability Index, PSI）檢驗模型穩定性"}, "answer": "A", "explanation": "答案 A。傳統信用評分卡的標準流程是：資料清理與分箱（Binning）、用 IV 值篩選變數、特徵選擇與共線性檢查、邏輯迴歸建模、轉成分數，再用 PSI 等指標監控穩定性。「使用生成式模型做特徵學習」不是傳統評分卡的常見步驟。", "per_option": {"A": "正確：生成式模型特徵學習不屬於傳統評分卡流程。", "B": "特徵選擇與共線性分析是評分卡的常見步驟。", "C": "分箱與 IV 檢定是評分卡的核心步驟。", "D": "PSI 檢驗模型與樣本的穩定性是評分卡的常見步驟。"}, "guide_ref": "指引未載（信用評分卡流程為學習指引外的補充考點）", "hot": false}, {"no": 26, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "否定", "stem": "在防止監督式學習模型過擬合（Overfitting）時，下列哪一種策略不屬於降低模型複雜度或限制學習能力的作法？", "options": {"A": "採用L1 或L2 正則化", "B": "在訓練過程中使用Dropout 技術", "C": "採取早期停止（Early Stopping）機制", "D": "擴增輸入特徵變數以提升模型表達能力"}, "answer": "D", "explanation": "答案 D。防止過擬合要「降低複雜度或限制學習能力」：正則化、Dropout、早停都是。擴增輸入特徵只會讓模型更複雜、更容易過擬合，方向正好相反。", "per_option": {"A": "L1／L2 正則化對權重加懲罰，限制複雜度，屬於防過擬合做法。", "B": "Dropout 訓練時隨機關閉神經元，限制模型依賴特定神經元，屬於防過擬合做法。", "C": "早停在驗證損失不再改善時提早停止，避免過度學習訓練資料。", "D": "正確：增加特徵讓模型更複雜，不屬於降低複雜度的做法。"}, "guide_ref": "學習指引 p.5-45～5-46", "hot": true}, {"no": 27, "section": "4.3", "topic_id": "4.3-02", "topic": "激活函數與輸出層", "style": "情境", "stem": "某智慧製造團隊在開發瑕疵影像檢測模型時，發現使用線性激活函數（Activation Function）後，模型的訓練準確率長期停滯，懷疑模型無法學習到足夠複雜的特徵表達。若要改善此問題，下列哪一項調整方案最為合適？", "options": {"A": "增加卷積層（Convolutional Layer）數量，使網路更深以強化特徵提取", "B": "將輸入影像先進行灰階化處理，降低運算量", "C": "使用Sigmoid 激活函數，以將輸出壓縮至[0,1]範圍", "D": "改用ReLU（Rectified Linear Unit）激活函數，以引入非線性並提升模型表達能力"}, "answer": "D", "explanation": "答案 D。線性激活函數不論疊幾層，整個網路仍等於一個線性函數，學不到複雜的特徵。換成 ReLU 引入非線性，網路才有足夠的表達能力。增加層數、灰階化、Sigmoid 都沒有真正解決「缺乏非線性」。", "per_option": {"A": "全部層都是線性激活時，網路再深也只是線性組合，不會變強。", "B": "灰階化只是降低輸入資訊量與運算量，不能解決線性問題。", "C": "Sigmoid 雖然是非線性，但題目重點是引入非線性並提升表達力，ReLU 才是隱藏層的標準選擇，Sigmoid 容易梯度消失。", "D": "正確：ReLU 引入非線性，讓網路能學到複雜特徵。"}, "guide_ref": "學習指引 p.4-57～4-58；4-65", "hot": true}, {"no": 28, "section": "6.2", "topic_id": "6.2-01", "topic": "偏見類型與成因", "style": "情境", "stem": "一家零售電商公司希望建立顧客流失預測模型，用以判斷哪些會員可能在三個月內不再消費。團隊以去年會員資料進行訓練，並僅採用「曾經購買三次以上」的活躍顧客紀錄作為樣本。模型上線後，對整體會員進行預測時，發現模型對於新註冊會員與低消費會員的預測準確率明顯偏低。下列何者為造成此現象最可能的原因？", "options": {"A": "特徵設計未排除與會員忠誠度高度相關的變數，導致特徵偏差（Feature Bias）", "B": "標記（Label）由人工標註，導致標籤偏差（Label Bias）", "C": "訓練樣本僅涵蓋高活躍顧客，造成取樣偏差（Sampling Bias）", "D": "模型未進行超參數調整，導致過擬合（Overfitting）"}, "answer": "C", "explanation": "答案 C。團隊只用「曾購買三次以上」的活躍顧客訓練，樣本不能代表全體會員，所以對新會員、低消費會員預測很差，這是取樣偏差（Sampling Bias）。", "per_option": {"A": "特徵偏差是特徵設計帶來的偏差，題目的關鍵是只挑了活躍顧客當樣本。", "B": "標籤偏差是標註過程的主觀偏見，題目沒有提到人工標註。", "C": "正確：訓練樣本只涵蓋高活躍顧客，造成取樣偏差。", "D": "沒做超參數調整不是這個現象的主因，過擬合也不會專挑新會員變差。"}, "guide_ref": "學習指引 p.6-14～6-17", "hot": true}, {"no": 29, "section": "X", "topic_id": "X-02", "topic": "時間序列驗證", "style": "定義", "stem": "在工業設備故障預測專案中，模型訓練與超參數調整均依賴於一段歷史數據作為驗證集。然而，隨著設備運行環境與工況條件的變化，原有驗證集已無法充分反映現況，導致模型在實際部署後的預測準確率逐漸下降。下列哪一種策略最能有效提升模型在長期運行環境中的穩健性與泛化能力？", "options": {"A": "固定驗證集內容，並透過模型正則化技巧（如 L2 正則化）強化模型泛化", "B": "將全部歷史資料納入訓練，不使用驗證集，依靠早期停止（Early Stopping）控制訓練", "C": "簡化模型架構，減少模型參數數量以降低過擬合風險", "D": "採用時間序列交叉驗證（Time Series Cross Validation）或滑動視窗驗證（Rolling Window Validation）方法，動態更新驗證資料以適應時間演進"}, "answer": "D", "explanation": "答案 D。資料會隨時間改變時，固定的驗證集會過時。時間序列交叉驗證或滑動視窗驗證會依時間順序切資料、持續更新驗證集，才能反映最新工況，長期最穩健。其他選項沒解決「驗證集過時」的核心問題。", "per_option": {"A": "固定驗證集再加 L2 正則化，驗證集仍然過時。", "B": "不使用驗證集就無法評估泛化，也等於放棄監控。", "C": "簡化模型是降低過擬合，但沒解決驗證集不再反映現況的問題。", "D": "正確：依時間動態更新驗證資料，才能適應環境變化。"}, "guide_ref": "指引未載（時間序列驗證／滑動視窗驗證，屬補充考點）", "hot": true}, {"no": 30, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "情境", "stem": "某情感分析模型在英文資料集上取得macro F1-score = 0.91。當該模型部署於西班牙文資料集時，F1-score 驟降至0.58。下列哪一項解釋最合理，且與F1-score 變化相關？", "options": {"A": "macro F1-score 本身波動性高，建議改用 micro-average F1-score評估", "B": "模型在西班牙文語料上過度擬合，導致評估結果偏高", "C": "語言轉移造成召回率（Recall）下降，模型無法正確辨識關鍵情緒詞彙", "D": "以均方誤差（MSE）取代 F1-score 評估可獲得更準確的結果"}, "answer": "C", "explanation": "答案 C。F1 從 0.91 掉到 0.58，是模型在新語言（語言轉移）上表現差；有可能是召回率下降，抓不到關鍵情緒詞。其他選項的推論不合理：過擬合不會讓評估結果偏高，換 micro F1 或 MSE 也無法解決語言差異。", "per_option": {"A": "Macro F1 本身不特別容易波動，題目的關鍵是跨語言的落差。", "B": "過擬合會使訓練表現好、測試差，不會讓評估結果偏高；也沒有「偏高」的現象。", "C": "正確：語言轉移讓模型認不出關鍵情緒詞，召回率下降，F1 跟著降。", "D": "情感分析是分類問題，MSE 是迴歸指標，不適用。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true}, {"no": 31, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "情境", "stem": "某能源公司利用歷史氣象與用電資料，開發長期電力需求預測模型，採用深度神經網路架構進行訓練。在訓練過程中，模型在訓練集上的損失值持續下降，但在驗證集上，損失在第80 輪後開始波動，呈現週期性上升與下降。團隊懷疑模型受到季節性資料波動與隨機噪音影響，導致驗證損失難以穩定收斂。若要在此情境下合理運用早期停止法（Early Stopping）以確保模型具最佳泛化能力，下列哪一項策略最為適當？", "options": {"A": "直接根據訓練集損失最低點停止訓練，以確保模型充分擬合所有樣本", "B": "監控驗證集損失並設定適度的耐心值（Patience），在連續多輪未改善後再停止訓練", "C": "改以測試集損失作為早停依據，以提升模型最終評估一致性", "D": "將所有資料重新合併後訓練至收斂，避免因資料分割導致評估波動"}, "answer": "B", "explanation": "答案 B。驗證損失有週期性波動時，早停應看「驗證集損失」並設耐心值（Patience）：連續多輪沒改善才停，避免被一時的上下波動誤導。看訓練損失會愈學愈過擬合，測試集不能拿來決定何時停，合併資料更是沒有驗證可依據。", "per_option": {"A": "訓練損失會一直下降，用它停訓練會造成過擬合。", "B": "正確：監控驗證損失並設耐心值，能避開短期波動、挑到泛化最好的點。", "C": "測試集應保留到最後評估，拿來做早停會造成資料洩漏。", "D": "合併資料訓練到收斂，沒有驗證就無法判斷何時該停。"}, "guide_ref": "學習指引 p.5-19～5-20", "hot": true}, {"no": 32, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "情境", "stem": "某電信公司開發客戶流失預測模型，使用大量顧客行為特徵，例如通話時長、上網頻率、帳單金額、客服聯絡次數等。在訓練過程中，團隊發現部分特徵彼此高度相關，但同時也懷疑有些特徵對流失預測的貢獻度有限。若希望模型在避免過擬合（Overfitting）的同時，能自動篩選出較具代表性的特徵，採用下列哪一種方法最為合適？", "options": {"A": "使用早期停止法（Early Stopping）控制訓練回合數，避免過擬合（Overfitting）", "B": "同時移除多重共線性特徵並採用L2 正則化（Ridge），以確保模型穩定收斂", "C": "僅使用L2 正則化（Ridge），抑制所有權重幅度但保留全部特徵", "D": "採用L1 正則化（Lasso），透過懲罰項使部分特徵係數縮為0"}, "answer": "D", "explanation": "答案 D。題目要「避免過擬合，同時自動篩選特徵」。L1（Lasso）會把不重要特徵的係數壓成 0，等於自動做特徵選擇；L2 只縮小係數、不會變 0；早停只控制訓練回合；移除共線性再用 L2 也沒有自動篩選的效果。", "per_option": {"A": "早停控制訓練回合數，不會篩選特徵。", "B": "移除共線性是手動做法，L2 又不會讓係數歸零，無法自動篩選特徵。", "C": "L2 保留全部特徵，題目要的是「自動篩選」。", "D": "正確：L1 的懲罰會讓部分特徵係數變成 0，自動篩選出代表性特徵。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true}, {"no": 33, "section": "X", "topic_id": "X-09", "topic": "時間複雜度", "style": "情境", "stem": "某資料科學團隊正在開發一個客戶相似度比對系統，用於計算所有客戶之間的相似度分數。若系統需逐一比對每一位客戶與其他所有客戶的資料組合，此時演算法的時間複雜度最可能為哪一種？其代表意義為何？", "options": {"A": "O(n) — 執行時間與資料量成線性關係", "B": "O(n²) — 執行時間與資料量平方成正比", "C": "O(1) — 執行時間固定不變", "D": "O(log n) — 執行時間與資料量呈對數成長關係"}, "answer": "B", "explanation": "答案 B。要比對「每位客戶和其他所有客戶」，n 位客戶就有約 n×(n−1)/2 組配對，量級是 n²，所以時間複雜度是 O(n²)，執行時間與資料量的平方成正比。例如 1,000 位客戶約要比對 499,500 組。", "per_option": {"A": "O(n) 是每筆資料只看一次，不符合「兩兩比對」。", "B": "正確：兩兩比對約 n² 組，時間複雜度 O(n²)。", "C": "O(1) 是執行時間不隨資料量改變，不可能逐一比對所有客戶。", "D": "O(log n) 是像二分搜尋那樣每次砍半，與逐一比對無關。"}, "guide_ref": "指引未載（時間複雜度為學習指引外的補充考點）", "hot": false}, {"no": 34, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "情境", "stem": "某醫療人工智慧團隊正在開發心臟病風險預測模型，資料量僅有150 筆，其中陽性個案不到8%。由於樣本數稀少且類別分布極不平衡，團隊希望在有限資料下，仍能準確評估模型在不同資料上的表現穩定性，同時避免訓練資料被過度切分而影響模型效能。若團隊希望在有限樣本下，同時兼顧資料的利用率與各類別在驗證折中的比例一致性，最適合採用下列哪一種交叉驗證方法？", "options": {"A": "5-Fold 交叉驗證（5-Fold Cross Validation）", "B": "留一法交叉驗證（Leave-One-Out Cross Validation）", "C": "隨機交叉驗證（Random Cross Validation）", "D": "分層留一法交叉驗證（Stratified Leave-One-Out Cross Validation）"}, "answer": "D", "explanation": "答案 D。這是官方答案。題目要同時「資料利用率高」與「各折類別比例一致」：留一法每次只留 1 筆驗證，訓練資料幾乎用滿；分層的概念是保持類別比例。官方把兩者合起來選 D。（註：留一法每次驗證集只有 1 筆，本身無法維持折內比例，「分層留一法」並非 scikit-learn 的標準方法；實務上小樣本不平衡資料較常用 Stratified K-Fold，選項中沒有。此題有爭議，考試照官方答案選 D。）", "per_option": {"A": "5 折交叉驗證沒有分層，陽性只有約 12 筆，可能某折幾乎沒有陽性。", "B": "留一法資料利用率最高，但沒有分層概念，題目還要求比例一致。", "C": "「隨機交叉驗證」沒有保證各折類別比例，也沒說明提高利用率。", "D": "正確：官方解答，兼顧資料利用率（留一）與類別比例一致（分層）。"}, "guide_ref": "學習指引 p.5-17～5-18、5-26～5-29", "hot": true}, {"no": 35, "section": "5.1", "topic_id": "5.1-02", "topic": "PCA 與降維", "style": "情境", "stem": "某公司針對製程感測器資料進行主成分分析（PCA），經標準化與協方差矩陣分解後，得到三個主成分的特徵值如下：λ1=6.0, λ2=3.0, λ3=1.0。若團隊決定僅保留能解釋至少 80% 總變異量的主成分，以進行後續模型建構，下列哪一項敘述最合理且數據解讀正確？", "options": {"A": "前兩個主成分合計解釋90%的總變異量，因此可安全降維至二維，且仍保留大部分資訊", "B": "第一主成分解釋60%的變異量，表示資料結構呈現明顯線性關係，僅保留一維即可避免過擬合", "C": "雖然前兩個主成分可解釋超過 80% 變異量，但第二主成分貢獻仍高達30%，不宜捨棄第三主成分", "D": "三個特徵值相差不大，顯示各主成分變異均衡，降維可能導致資訊損失"}, "answer": "A", "explanation": "答案 A。每個主成分解釋的比例＝特徵值 ÷ 特徵值總和：6÷10＝60%、3÷10＝30%、1÷10＝10%。前兩個累積 90%，已超過 80% 的門檻，所以可降到二維；只留第一個只有 60%，不夠。", "per_option": {"A": "正確：前兩個主成分累積 60%＋30%＝90% ≥ 80%，降到二維即可。", "B": "第一主成分只有 60%，低於 80% 的門檻，不能只留一維。", "C": "前兩個已達 80%，第三個只占 10%，可以捨棄；說「不宜捨棄第三個」的推論顛倒了。", "D": "特徵值是 6、3、1，差距很大，並不均衡；變異集中在前幾個主成分才適合降維。"}, "guide_ref": "學習指引 p.5-6、3-13～3-15", "hot": true, "detail": {"steps": [["① 總變異量", "總變異量 ＝ 所有特徵值相加（每個特徵值就是該主成分的變異量）", "6.0 ＋ 3.0 ＋ 1.0 ＝ 10.0"], ["② 各主成分的解釋比例", "解釋比例 ＝ 該特徵值 ÷ 總變異量", "λ1：6 ÷ 10 ＝ 60%；λ2：3 ÷ 10 ＝ 30%；λ3：1 ÷ 10 ＝ 10%"], ["③ 累積解釋比例並對照 80% 門檻", "累積比例 ＝ 由大到小依序加起來，直到 ≥ 80%", "只留 1 個：60%（不夠）；留 2 個：60% ＋ 30% ＝ 90%（達標）→ 保留 2 個主成分，選 A"], ["④ 對照其他選項", "用步驟②、③的數字檢查每句話", "B：只留一維只有 60% < 80%，未達門檻。C：第三個才是被捨棄的，它只占 10%，「不宜捨棄第三個」不成立。D：特徵值 6、3、1 相差很大，變異集中在前面，並不均衡"]], "tip": "解釋比例＝特徵值÷特徵值總和；由大到小累加到超過門檻，就知道要留幾個主成分。"}}, {"no": 36, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "情境", "stem": "某銀行計畫與多家合作機構共同訓練一個AI 信用風險預測模型，為避免客戶交易資料在傳輸與運算過程中外洩，技術團隊評估使用同態加密（Homomorphic Encryption）技術。下列何者最能正確描述同態加密在此應用中的關鍵特性？", "options": {"A": "系統以隨機雜訊（Noise）干擾輸出，確保統計結果不洩漏個資", "B": "各參與銀行透過安全通道交換私鑰，確保模型參數一致", "C": "將原始資料壓縮並同時加密，以減少加密後資料量與運算時間", "D": "資料在加密狀態下仍可進行數值運算，模型訓練可於未解密資料上完成"}, "answer": "D", "explanation": "答案 D。同態加密的關鍵特性是「資料在加密狀態下仍可直接做運算」，運算結果解密後與直接對明文運算一致，所以多家機構可以在不解密的資料上完成訓練或統計。加雜訊是差分隱私，交換私鑰與壓縮都不是同態加密的特性。", "per_option": {"A": "加隨機雜訊干擾輸出是差分隱私的做法。", "B": "交換私鑰是金鑰交換問題，同態加密的重點不在此。", "C": "同態加密不是壓縮技術，加密後資料通常會變大、運算更慢。", "D": "正確：資料維持加密狀態仍可進行運算，不必解密即可訓練。"}, "guide_ref": "學習指引 p.6-10～6-12", "hot": true}, {"no": 37, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "情境", "stem": "某跨銀行風控平台希望整合多家銀行的用戶行為資料，用於訓練信用風險預測模型。由於競爭與法規限制，各銀行僅願意提供加密後資料，且資料在任何時間不得被平台解密。同時，平台需建立安全通訊協議以確保資料在傳輸過程未被竄改或重放。下列哪一組技術最能完整對應上述需求？", "options": {"A": "對稱加密（Symmetric Encryption）＋ 單向雜湊（Hash Function）＋非對稱加密（Asymmetric Encryption）＋ 差分隱私（Differential Privacy）", "B": "同態加密（Homomorphic Encryption）＋ 非對稱加密（Asymmetric Encryption）＋ 單向雜湊（ One-way Hash Function）＋ 對稱加密（Symmetric Encryption）", "C": "差分隱私（Differential Privacy）＋ 對稱加密（Symmetric Encryption）＋ 同態加密（Homomorphic Encryption）＋ 數位簽章（Digital Signature）", "D": "同態加密（Homomorphic Encryption）＋ 安全多方計算（Secure Multi-party Computation, MPC）＋ 雜湊函數（Hash Function）＋ 對稱加密（Symmetric Encryption）"}, "answer": "B", "explanation": "答案 B。這是官方答案。需求一：資料全程不能被平台解密，要用同態加密。需求二：通訊要防竄改與重放，需要非對稱加密（簽章、金鑰交換）、單向雜湊（完整性）、對稱加密（傳輸加密）。B 的四項剛好涵蓋兩個需求。", "per_option": {"A": "A 沒有同態加密，平台就得解密才能運算；差分隱私也不能滿足「不被解密」。", "B": "正確：同態加密處理「不解密就運算」，非對稱、雜湊、對稱加密組成安全通訊。", "C": "C 雖然也有同態加密與數位簽章，但多了差分隱私（在結果加雜訊保護個資，與「資料不被解密」「通訊防竄改」都不直接相關），沒有明列單向雜湊與非對稱加密；官方答案不選它。", "D": "D 有同態加密與 MPC，但沒有非對稱加密（或簽章），無法完整對應防竄改、防重放的通訊協議；官方答案不選它。"}, "guide_ref": "學習指引 p.6-10～6-12", "hot": true}, {"no": 38, "section": "5.3", "topic_id": "5.3-05", "topic": "迴歸評估指標", "style": "定義", "stem": "附圖程式碼所計算的是哪一類型的評估指標？\n\n【原題附圖】程式碼如下\n```python\ndef metric(y_true, y_pred):\n    return sum((y_true - y_pred) ** 2) / len(y_true)\n```\n", "options": {"A": "MAE", "B": "MSE", "C": "RMSE", "D": "R²"}, "answer": "B", "explanation": "答案 B。程式把「真實值 − 預測值」逐筆平方、加總，再除以筆數，這就是均方誤差 MSE（Mean Squared Error）。因為最後沒有開根號，所以不是 RMSE；也沒有取絕對值，所以不是 MAE；R² 還要拿誤差跟「用平均值預測的誤差」相比。", "per_option": {"A": "MAE 是誤差取絕對值再平均，程式裡是平方，不是絕對值。", "B": "正確：平方誤差的平均＝MSE。", "C": "RMSE 是 MSE 再開根號，程式最後沒有開根號。", "D": "R² 是 1 減（殘差平方和 ÷ 總變異），程式沒有用平均值當基準，不是 R²。"}, "guide_ref": "學習指引 p.5-22～5-24", "hot": true, "detail": {"steps": [["① 逐筆算誤差", "誤差 eᵢ ＝ yᵢ（真實值）− ŷᵢ（預測值）", "舉例：真實值 [3, 5, 2, 7]、預測值 [2.5, 5, 4, 8]；誤差 ＝ [0.5, 0, −2, −1]"], ["② 每個誤差平方", "平方誤差 ＝ eᵢ²（負的變正的，大誤差被放大）", "[0.5², 0², (−2)², (−1)²] ＝ [0.25, 0, 4, 1]"], ["③ 加總後除以筆數", "MSE ＝ Σ eᵢ² ÷ n（n 是資料筆數）", "(0.25 ＋ 0 ＋ 4 ＋ 1) ÷ 4 ＝ 5.25 ÷ 4 ＝ 1.3125，這就是程式的回傳值"], ["④ 對照其他選項（怎麼算才會是它們）", "MAE ＝ Σ|eᵢ| ÷ n；RMSE ＝ √MSE；R² ＝ 1 − 殘差平方和 ÷ 總變異平方和", "A（MAE）：(0.5 ＋ 0 ＋ 2 ＋ 1) ÷ 4 ＝ 0.875。C（RMSE）：√1.3125 ≈ 1.1456。D（R²）：平均 4.25，總變異 ＝ 1.5625＋0.5625＋5.0625＋7.5625 ＝ 14.75，R² ＝ 1 − 5.25 ÷ 14.75 ≈ 0.6441。這三個數字都跟程式輸出的 1.3125 不同"]], "code": [["def metric(y_true, y_pred):", "定義一個函式，輸入「真實值」與「預測值」兩串數字（要是 numpy 陣列，才能整串直接相減）"], ["y_true - y_pred", "兩串數字逐位置相減，得到每一筆的誤差"], ["(y_true - y_pred) ** 2", "每個誤差各自平方：負的變正的，誤差大的被放大"], ["sum(...)", "把所有平方誤差加總"], ["/ len(y_true)", "除以資料筆數＝取平均，所以叫「均方」誤差；後面沒有開根號"], ["return ...", "把算出來的那一個數字傳回去"]], "tip": "平方後取平均、沒開根號＝MSE；開根號＝RMSE；取絕對值＝MAE。"}}, {"no": 39, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "定義", "stem": "附圖程式碼實現的是哪一種正則化技術？\n\n【原題附圖】程式碼如下\n```python\ndef forward(x, p, training=True):\n    if training:\n        mask = np.random.binomial(1, p, size=x.shape)\n        return x * mask / p\n    else:\n        return x\n```\n", "options": {"A": "L1 正則化", "B": "L2 正則化", "C": "Dropout", "D": "Batch Normalization"}, "answer": "C", "explanation": "答案 C。程式在訓練時用 np.random.binomial 隨機產生 0/1 遮罩，把一部分神經元的輸出變成 0（關掉），其餘留下的再除以 p 放大，這是 Dropout（inverted dropout）；測試時則不丟，直接輸出。L1／L2 是在損失函數加權重的懲罰項，Batch Normalization 是把輸出減平均除標準差，兩者程式碼都不長這樣。", "per_option": {"A": "L1 正則化是損失函數加上 λ×Σ|w|，程式裡沒有權重也沒有損失。", "B": "L2 正則化是損失函數加上 λ×Σw²，程式裡沒有權重也沒有損失。", "C": "正確：隨機遮罩關掉神經元、保留者除以 p 放大、測試時不丟，正是 Dropout。", "D": "Batch Normalization 要算批次的平均與變異數再標準化，程式沒有這些計算。"}, "guide_ref": "學習指引 p.5-45～5-46", "hot": true, "detail": {"steps": [["① 遮罩 mask 是什麼", "mask 的每個位置獨立擲一次硬幣：保留的機率 P(mask＝1) ＝ p，關掉的機率 ＝ 1 − p", "p ＝ 0.8 時：約 80% 的神經元留下（mask＝1）、約 20% 被關成 0（模擬 200,000 個位置，關掉的比例約 0.2）"], ["② 為什麼要除以 p", "期望值 E[x × mask ÷ p] ＝ x × E[mask] ÷ p ＝ x × p ÷ p ＝ x（放大 1/
