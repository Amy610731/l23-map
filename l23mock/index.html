  const TL = (x, y, s, max, cls, anc, lh = 16) => wrapU(s, max).map((l, i) => T(x, y + i * lh, l, cls, anc)).join("");
  const ARR = (x1, y1, x2, y2) => {
    const a = Math.atan2(y2 - y1, x2 - x1), h = 7, P = (d) => `${(x2 - h * Math.cos(a + d)).toFixed(1)},${(y2 - h * Math.sin(a + d)).toFixed(1)}`;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="fg-ln"/><polygon points="${x2},${y2} ${P(-0.45)} ${P(0.45)}" class="fg-ah"/>`;
  };
  const R = (x, y, w, h, cls) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" class="${cls}"/>`;
  const SV = (h, body) => `<svg viewBox="0 0 460 ${Math.ceil(h)}" role="img" aria-label="${esc(f.title || "圖解")}">${body}</svg>`;
  let s = "", y = 8;
  if (f.type === "layers") {  // 由上往下：每層一個方塊（名稱＋形狀），右邊寫參數或算法
    f.items.forEach((L, i) => {
      s += R(10, y, 180, 50, "fg-box" + (L.hl ? " fg-hl" : "")) + T(100, y + 21, L.name, "b2", "middle") + T(100, y + 40, L.shape, "s", "middle");
      if (L.note) { const ls = wrapU(L.note, 19); s += ls.map((l, j) => T(202, y + 30 - (ls.length - 1) * 8 + j * 16, l, "s2")).join(""); }
      if (i < f.items.length - 1) s += ARR(100, y + 52, 100, y + 70);
      y += 72;
    });
    if (f.note) { s += TL(10, y + 8, f.note, 36, "s"); y += wrapU(f.note, 36).length * 16 + 4; }
    return SV(y, s);
  }
  if (f.type === "tree") {  // 由左往右：全部 → 第一層分支 → 第二層分支；hl:"num" 綠（分子）、"den" 黃（也在分母）
    const rows = f.branches.reduce((a, b) => a + b.leaves.length, 0), RH = 50, top = 8, H = rows * RH;
    const rootY = top + H / 2;
    s += R(4, rootY - 24, 84, 48, "fg-box") + T(46, rootY - 4, "全部", "s", "middle") + T(46, rootY + 15, f.total, "b2", "middle");
    let r = 0;
    f.branches.forEach(b => {
      const by = top + (r + b.leaves.length / 2) * RH;
      s += ARR(88, rootY, 116, by) + R(118, by - 22, 132, 44, "fg-box") + T(184, by - 4, `${b.label}（${b.p}）`, "s2", "middle") + T(184, by + 14, b.n, "b2", "middle");
      b.leaves.forEach(L => {
        const ly = top + (r + 0.5) * RH;
        s += ARR(250, by, 276, ly) + R(278, ly - 21, 178, 42, "fg-box" + (L.hl === "num" ? " fg-hl" : L.hl === "den" ? " fg-den" : ""))
          + T(367, ly - 4, `${L.label}（${L.p}）`, "s2", "middle") + T(367, ly + 14, L.n, "b2", "middle");
        r++;
      });
    });
    y = top + H + 8;
    const hasHl = f.branches.some(b => b.leaves.some(L => L.hl));
    if (hasHl) { s += T(10, y + 8, "綠色＝分子；綠色＋黃色＝分母", "s"); y += 20; }
    if (f.result) { s += TL(10, y + 8, f.result, 31, "b2", "", 18); y += wrapU(f.result, 31).length * 18 + 4; }
    return SV(y, s);
  }
  if (f.type === "flow") {  // 一或兩欄流程，由上往下；步驟前加「!」＝出問題的那一步（紅框）
    const cols = f.cols, two = cols.length === 2, w = two ? 214 : 300;
    let maxY = 0;
    cols.forEach((c, ci) => {
      const x = two ? 8 + ci * 230 : 80; let yy = 8;
      s += T(x + w / 2, yy + 14, c.label, c.bad ? "b2 ng" : "b2 ok", "middle"); yy += 24;
      c.steps.forEach((st, i) => {
        const bad = st.startsWith("!"), txt = bad ? st.slice(1) : st;
        s += R(x, yy, w, 34, "fg-box" + (bad ? " fg-bad" : "")) + T(x + w / 2, yy + 22, txt, "s2", "middle");
        if (i < c.steps.length - 1) s += ARR(x + w / 2, yy + 35, x + w / 2, yy + 51);
        yy += 52;
      });
      if (c.note) { s += TL(x + 2, yy + 8, c.note, two ? 17 : 24, "s"); yy += wrapU(c.note, two ? 17 : 24).length * 16 + 4; }
      maxY = Math.max(maxY, yy);
    });
    return SV(maxY + 4, s);
  }
  if (f.type === "matrix") {  // 由左往右：A · B ＝ C，方塊大小依列×行；相乘時中間兩個數字綠色、結果的形狀紅色
    const all = [...f.ops, f.out], nums = all.flatMap(m => [m.r, m.c]).filter(v => typeof v === "number");
    const maxd = Math.max(...nums, 1), small = maxd <= 8;
    const sz = v => typeof v !== "number" ? 40 : small ? v * 12 : 22 + 58 * Math.log(v) / Math.log(maxd);
    const boxH = Math.max(...all.map(m => sz(m.r))), mid = 12 + boxH / 2;
    const mm = f.op === "·" && f.ops.length === 2;
    const gap = 30; let x = 10;
    const tot = all.reduce((a, m) => a + Math.max(sz(m.c), 50), 0) + gap * f.ops.length;
    x = Math.max(6, (460 - tot) / 2);
    all.forEach((m, i) => {
      const w = sz(m.c), h = sz(m.r), cw = Math.max(w, 50), bx = x + (cw - w) / 2, by = mid - h / 2, isOut = i === all.length - 1;
      s += `<rect x="${bx}" y="${by}" width="${w}" height="${h}" class="fg-box${isOut ? " fg-hl" : ""}"/>`;
      if (small && typeof m.r === "number" && typeof m.c === "number") {
        for (let k = 1; k < m.r; k++) s += `<line x1="${bx}" y1="${by + k * 12}" x2="${bx + w}" y2="${by + k * 12}" class="fg-cell"/>`;
        for (let k = 1; k < m.c; k++) s += `<line x1="${bx + k * 12}" y1="${by}" x2="${bx + k * 12}" y2="${by + h}" class="fg-cell"/>`;
      }
      const rc = mm ? (i === 0 ? ["rd", "ok"] : i === 1 ? ["ok", "rd"] : ["rd", "rd"]) : ["", ""];
      const ts = (v, c) => `<tspan${c ? ` class="${c}"` : ""}>${esc(v)}</tspan>`;
      s += T(x + cw / 2, mid + boxH / 2 + 18, m.name, "b2", "middle")
        + `<text x="${x + cw / 2}" y="${mid + boxH / 2 + 36}" text-anchor="middle" class="s2">${ts(m.r, rc[0])}×${ts(m.c, rc[1])}</text>`;
      x += cw;
      if (i < all.length - 1) { s += T(x + gap / 2, mid + 6, i === all.length - 2 ? "＝" : (f.op || "·"), "b", "middle"); x += gap; }
    });
    y = mid + boxH / 2 + 50;
    if (mm) { s += T(10, y + 8, "綠色兩個數字要一樣才能相乘；紅色＝結果的形狀", "s"); y += 20; }
    if (f.note) { s += TL(10, y + 8, f.note, 36, "s2"); y += wrapU(f.note, 36).length * 16 + 4; }
    return SV(y, s);
  }
  if (f.type === "folds") {  // 每一輪一條：綠＝訓練、黃＝驗證；timeseries 只往前延伸；test＝一開始就切走、不參與的測試集
    const k = f.k, ts = f.mode === "timeseries", seg = ts ? k + 1 : k, X0 = 64, BW = (f.test ? 320 : 380), sw = BW / seg;
    if (f.n) { s += T(10, y + 12, f.n, "s2"); y += 22; }
    for (let i = 0; i < k; i++) {
      s += T(8, y + 15, `第 ${i + 1} 輪`, "s");
      for (let j = 0; j < seg; j++) {
        const cls = ts ? (j <= i ? "fg-tr" : j === i + 1 ? "fg-va" : "fg-no") : (j === i ? "fg-va" : "fg-tr");
        s += `<rect x="${(X0 + j * sw).toFixed(1)}" y="${y}" width="${(sw - 2).toFixed(1)}" height="20" class="${cls}"/>`;
      }
      if (f.test) s += `<rect x="${X0 + BW + 4}" y="${y}" width="${380 - BW - 6}" height="20" class="fg-te"/>`;
      y += 26;
    }
    if (f.test) s += T(X0 + BW + 4 + (380 - BW - 6) / 2, y + 12, `測試集 ${f.test}`, "s", "middle");
    y += 4;
    s += `<rect x="10" y="${y + 10}" width="14" height="12" class="fg-tr"/>` + T(30, y + 21, "訓練", "s")
      + `<rect x="72" y="${y + 10}" width="14" height="12" class="fg-va"/>` + T(92, y + 21, "驗證", "s")
      + (ts ? `<rect x="134" y="${y + 10}" width="14" height="12" class="fg-no"/>` + T(154, y + 21, "還沒發生（不能用）", "s") : "");
    y += 30;
    if (f.note) { s += TL(10, y + 8, f.note, 36, "s2"); y += wrapU(f.note, 36).length * 16 + 4; }
    return SV(y, s);
  }
  return "";
}
function figText(f){
  if (!f) return "";
  if (f.type === "layers") return "各層：" + f.items.map(L => `${L.name} ${L.shape}${L.note ? `（${L.note}）` : ""}`).join(" → ");
  if (f.type === "tree") return `機率樹：全部 ${f.total}；` + f.branches.map(b => `${b.label} ${b.p} ${b.n}，其中 ` + b.leaves.map(L => `${L.label} ${L.p} ${L.n}`).join("、")).join("；") + (f.result ? `；${f.result}` : "");
  if (f.type === "flow") return f.cols.map(c => `${c.label}：${c.steps.map(s => s.replace(/^!/, "")).join(" → ")}${c.note ? `（${c.note}）` : ""}`).join("；");
  if (f.type === "matrix") return "形狀：" + f.ops.map(m => `${m.name}(${m.r}×${m.c})`).join(` ${f.op || "·"} `) + ` ＝ ${f.out.name}(${f.out.r}×${f.out.c})` + (f.note ? `；${f.note}` : "");
  if (f.type === "folds") return `${f.k} 輪${f.mode === "timeseries" ? "時間序列" : ""}交叉驗證${f.note ? `；${f.note}` : ""}`;
  return "";
}
function detailHTML(q){
  const d = q.detail; if (!d) return "";
  let h = `<div class="dt"><span class="dth">詳解</span>`;
  if (d.fig) h += `<span class="dtsub">${esc(d.fig.title || "圖解")}</span>${figSVG(d.fig)}`;
  if (d.code && d.code.length) h += `<span class="dtsub">程式一行一行看</span><div class="dtw"><table><thead><tr><th>程式</th><th>意思</th></tr></thead><tbody>`
    + d.code.map(r => `<tr><td class="cl"><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td></tr>`).join("") + `</tbody></table></div>`;
  if (d.cm) h += `<span class="dtsub">混淆矩陣（題目的數字放進去）</span>${cmSVG(d.cm)}`;
  if (d.steps && d.steps.length) h += `<span class="dtsub">先寫公式，再代入數字</span><div class="dtw"><table><thead><tr><th>步驟</th><th>公式</th><th>代入</th></tr></thead><tbody>`
    + d.steps.map(r => `<tr><td>${esc(r[0])}</td><td class="f">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("") + `</tbody></table></div>`;
  if (d.tip) h += `<div class="tip">${esc(d.tip)}</div>`;
  return h + `</div>`;
}
function detailText(q){

/* ---------- 題目：每回固定打散順序（種子＝回數），id＝d01-07（原題號），n＝本回卷面題號 ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PAPER = {}, QBY = {};
for (const [d, qs] of Object.entries(DATA)) {
  const arr = qs.map(q => ({...q, id: `d${String(d).padStart(2,"0")}-${String(q.no).padStart(2,"0")}`, day: +d}));
  const r = rng(+d * 7919);
  if (!PAST[d]) for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  arr.forEach((q, i) => q.n = i + 1);
  PAPER[d] = arr; arr.forEach(q => QBY[q.id] = q);
}

function recordFirst(q, pick){
  if (!S.first[q.id]) S.first[q.id] = {p: pick, ok: pick === q.answer, t: Date.now()};
  if (pick !== q.answer && !S.nb[q.id]) S.nb[q.id] = {add: Date.now(), streak: 0, wrong: 1, done: false};
  else if (pick !== q.answer) { S.nb[q.id].wrong++; S.nb[q.id].streak = 0; S.nb[q.id].done = false; }
}

function today0(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
const daysLeft = () => Math.round((EXAM - today0()) / 864e5);
function todayRound(){
  const t = today0();
  if (t < new Date(2026,10,1)) return 1;
  if (t.getMonth() === 10 && t.getDate() <= 13) return t.getDate();
  return 14;
}

function histAnswers(d, i){
  const h = S.days[d]?.history?.[i]; if (!h) return null;
  if (h.answers) return h.answers;
  if (i !== 0) return null;

// 每題現在的狀態：選了什麼、要不要公布答案、能不能再點
function qState(q){

/* ---------- 計時：每秒更新，時間到自動交卷 ---------- */
function tick(){
  for (const [d, r] of Object.entries(S.days)) if (PAPER[d] && r.exam && !r.exam.done && examLeft(r.exam) === 0) { submitExam(+d, true); return; }
  const r = curDay && S.days[curDay], clock = $("#examclock"), tm = $("#timer"), nt = document.querySelector(".navtimer");
  const on = page === "paper" && r && r.mode === "exam";
  clock.hidden = tm.hidden = !on;
  if (!on) { if (nt) nt.textContent = ""; return; }
  const ex = r.exam, live = ex && !ex.done, left = live ? examLeft(ex) : null, low = live && left <= 300;
  $("#clock-t").textContent = !ex ? fmt(S.limit * 60) : ex.done ? fmt(ex.secs) : fmt(left);
  $("#clock-l").textContent = !ex ? `限時 ${S.limit} 分鐘・按「開始計時」或作答第一題就開始倒數`
    : ex.done ? (ex.secs >= (ex.lim || S.limit) * 60 ? "時間到，已自動交卷" : "已交卷，作答時間") : "剩餘時間";
  $("#clock-start").hidden = $("#clock-lim").hidden = !!ex;
  clock.classList.toggle("low", !!low);
  clock.classList.toggle("done", !!ex?.done);
  tm.textContent = !ex ? `限時 ${S.limit} 分鐘：作答第一題後開始倒數` : ex.done ? `作答時間 ${fmt(ex.secs)}` : `剩餘時間 ${fmt(left)}`;
  tm.classList.toggle("low", !!low);
  if (nt) { nt.textContent = live ? "剩 " + fmt(left) : ""; nt.classList.toggle("low", !!low); }
}
setInterval(tick, 1000);
function submitExam(d, timeout){
  const qs = PAPER[d], r = S.days[d], ex = r?.exam;
  if (!ex || ex.done) return;
  ex.done = true; ex.end = Date.now(); ex.secs = Math.min((ex.lim || S.limit)*60, Math.floor((ex.end - ex.start)/1000));
  qs.forEach(q => recordFirst(q, ex.answers[q.id] || "-"));
  ex.score = grade(qs, ex).ok * 2;
  r.history.push({score: ex.score, secs: ex.secs, at: ex.end, lim: ex.lim || S.limit, answers: Object.assign({}, ex.answers), flags: ex.flags.slice()});
  $("#confirm").hidden = true;
  if (d === curDay) { rfilter = "wrong"; focusId = null; delete cur[d + "-exam"]; }
  save(); render();
  if (d === curDay && page === "paper") window.scrollTo(0, 0);
}

/* ---------- 弱點分析 ---------- */
let aiText = "", aiBusy = false, sampleFn = undefined;
function stats(){
  const bySec = {}, byTopic = {};
  for (const [id, f] of Object.entries(S.first)) {
    const q = QBY[id]; if (!q) continue;
    const s = bySec[q.section] ||= [0,0]; s[1]++; if (f.ok) s[0]++;
    const t = byTopic[q.topic_id] ||= {name: q.topic, sec: q.section, ok: 0, n: 0}; t.n++; if (f.ok) t.ok++;
  }
  return {bySec, byTopic};
}
function trendSvg(){
  const pts = [];
  for (let d = 1; d <= DAYS; d++) { const h = S.days[d]?.history; if (h?.length) pts.push({d, s: h[0].score}); }
  if (!pts.length) return `<div class="empty">還沒有考試模式的成績</div>`;
  const W = 640, H = 220, L = 34, R = 10, T = 12, B = 30, x = d => L + (d - 1) * (W - L - R) / (DAYS - 1), y = s => T + (100 - s) * (H - T - B) / 100;
  let g = "";
  for (const s of [0,25,50,70,100]) g += `<line x1="${L}" x2="${W-R}" y1="${y(s)}" y2="${y(s)}" style="stroke:var(${s===70?"--news":"--line"})" ${s===70?'stroke-dasharray="4 4"':""}/><text x="${L-6}" y="${y(s)+4}" text-anchor="end" font-size="11" style="fill:var(--ink-soft)">${s}</text>`;
  for (let d = 1; d <= DAYS; d++) g += `<text x="${x(d)}" y="${H-10}" text-anchor="middle" font-size="11" style="fill:var(--ink-soft)">${d}</text>`;
  const path = pts.map((p,i) => `${i?"L":"M"}${x(p.d)},${y(p.s)}`).join("");
  const area = `${path}L${x(pts.at(-1).d)},${y(0)}L${x(pts[0].d)},${y(0)}Z`;
  g += `<path d="${area}" style="fill:var(--card-red-soft)" stroke="none"/><path d="${path}" fill="none" style="stroke:var(--card-red)" stroke-width="2.5"/>`;
  pts.forEach((p,i) => g += `<circle cx="${x(p.d)}" cy="${y(p.s)}" r="${i===pts.length-1?5:3.5}" style="fill:var(--card-red)"/><text x="${x(p.d)}" y="${y(p.s)-9}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--ink)">${p.s}</text>`);
  g += `<text x="${W-R}" y="${y(70)-5}" text-anchor="end" font-size="11" style="fill:var(--news)">目標 70</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="各回第一次考試分數">${g}</svg><p class="note">橫軸＝第幾回，只畫每回第一次考試的分數。${Object.keys(PAST).filter(d => S.days[d]?.history?.length).map(d => `${PAST[d]}第一次 ${S.days[d].history[0].score} 分`).join("；")}</p>`;
}

    <div class="tile"><div class="k">距離考試</div><div class="v">${daysLeft()}<small> 天</small></div></div></div>`;
  if (!n) { el.innerHTML = tiles + `<div class="empty">做完第一回就會出現各小節正確率、最弱考點與分數走勢。</div>`; return; }
  const secs = SEC_ORDER.filter(s => bySec[s]).sort((a,b) => bySec[a][0]/bySec[a][1] - bySec[b][0]/bySec[b][1]);
  const weak = Object.entries(byTopic).filter(([,t]) => t.n >= 2 && t.ok < t.n).sort((a,b) => a[1].ok/a[1].n - b[1].ok/b[1].n || b[1].n - a[1].n).slice(0, 12);
  const secHtml = secBars(bySec, secs, true) + `<p class="note">由弱到強排列。紅＝低於 60%，黃＝60～79%，綠＝80% 以上。</p>`;
  const weakHtml = weak.length ? `<div class="tw"><table><thead><tr><th>考點</th><th>小節</th><th style="text-align:right">答對／作答</th><th style="text-align:right">正確率</th></tr></thead><tbody>
    ${weak.map(([id,t]) => `<tr><td><a href="${STAR}go/${encodeURIComponent(id)}/" target="_blank" rel="noopener">${esc(t.name)}</a></td><td>${t.sec}</td><td class="n">${t.ok}/${t.n}</td><td class="n" style="color:${t.ok/t.n<.6?"var(--bad)":"var(--news)"}">${Math.round(t.ok/t.n*100)}%</td></tr>`).join("")}</tbody></table></div>
    <p class="note">至少作答 2 題才列入。點考點名稱直接開星圖那一顆複習。</p>` : `<div class="empty">目前沒有作答 2 題以上又答錯的考點</div>`;
  el.innerHTML = tiles + `<div class="panel"><h3>分數走勢</h3><div class="trend">${trendSvg()}</div></div>
    <div class="panel"><h3>各小節正確率</h3>${secHtml}</div>
    <div class="panel"><h3>最該補強的考點</h3>${weakHtml}</div>
    <div class="panel" id="aipanel" ${sampleFn === null ? "hidden" : ""}><h3>請 Claude 看錯題寫診斷</h3>
      <p class="note">把你目前的各小節正確率和錯題（題幹摘要、你選的、正解）交給 Claude，請它指出觀念漏洞和考前三天的複習順序。</p>
      <div class="actions"><button class="btn" id="aigo" ${aiBusy||!active&&!weak.length?"disabled":""}>${aiBusy ? "分析中…" : "產生診斷"}</button></div>
      <div class="ai" id="aiout">${esc(aiText)}</div></div>`;
  $("#aigo")?.addEventListener("click", runAI);
}
async function runAI(){
  if (aiBusy || !sampleFn) return;
  aiBusy = true; aiText = ""; render();
  const {bySec} = stats();
  const secLine = SEC_ORDER.filter(s => bySec[s]).map(s => `${s} ${SEC[s]}：${bySec[s][0]}/${bySec[s][1]}`).join("\n");
  const wrongs = Object.entries(S.nb).filter(([id,v]) => QBY[id] && !v.done).slice(0, 60).map(([id,v]) => {
    const q = QBY[id], p = S.first[id]?.p;
    return `【${q.section} ${q.topic}】${q.stem.replace(/```[\s\S]*?```/g,"（程式碼）").slice(0,90)}…｜考生選 ${p}：${(q.options[p]||"未作答").slice(0,40)}｜正解 ${q.answer}：${q.options[q.answer].slice(0,40)}｜錯 ${v.wrong} 次`;
  }).join("\n");
  const prompt = `你是 iPAS AI 應用規劃師（中級）科目三「機器學習技術與應用」的考前輔導老師。考生 11/14 應考，今天距考試 ${daysLeft()} 天。以下是考生模擬考的各小節第一次作答正確率與目前還沒畢業的錯題。
請用台灣繁體中文、純文字（不要 markdown 符號），寫一份 400～600 字的弱點診斷：
1. 指出 3～5 個「觀念漏洞」（不是只列考點名，要說她可能誤以為什麼、正確觀念一句話）
2. 哪些錯題其實是同一個漏洞造成的
3. 剩下天數的複習順序建議（具體到考點）
語氣直接、像老師批改考卷。

各小節正確率（答對/作答）：
${secLine}

未畢業錯題：
${wrongs || "（無）"}`;
  try {
    await sampleFn(prompt, {modelTier: "default", onText: ({text}) => { aiText = text; const o = $("#aiout"); if (o) o.textContent = text; }});
  } catch(e) { aiText = e?.code === "rate_limited" ? "請求太頻繁，過幾分鐘再按一次。" : "這次沒有產生診斷，稍後再試。"; }
  aiBusy = false; render();
}
(async () => { try { sampleFn = (await window.claude?.use?.("sample")) || null; } catch(e) { sampleFn = null; } if (page === "ana") render(); })();

/* ---------- 陪讀：GitHub Pages 版嵌在陪讀手機版時，把畫面上這一題送給語音老師 ----------
   格式同資安「考前大猜題」（src:"l23-map"、type:"topic"/"answer"/"home"、topic.kind:"mock"）。
   artifact 版 build 時 SITE＝false，EMBED 永遠是 false，一則訊息都不送。
   考試模式交卷前只送題幹與選項（quiz 裡沒有 answer、explanation）；
   練習模式、錯題本一顯示題目就附答案與解析（同資安大猜題，老師規則是她回答前不能講），她在畫面上作答再送 answer；
   交卷後檢討：一題一題送畫面上那題，全部列出時點哪題送哪題。 */
function emit(msg){ if (!EMBED) return; try { window.parent.postMessage(Object.assign({src:"l23-map"}, msg), "*"); } catch(e) {} }
let lastEmit = "", lastAns = "";
function topicFor(q, n, mode, reveal, o){
  const quiz = {stem: q.stem, options: ["A","B","C","D"].map(k => q.options[k]), hint: "", source: "科目三考前 14 回自編題"};
  if (reveal) {
    quiz.answer = "ABCD".indexOf(q.answer);
    quiz.explanation = `${q.explanation} ${detailText(q)} ${"ABCD".split("").map(k => `(${k}) ${q.per_option?.[k] ?? ""}`).join(" ")}${q.guide_ref ? `（${q.guide_ref}）` : ""}`;
  }
  const hot = q.hot ? `「${q.topic}」是考古熱點（115-1、114-2 兩次公告試題合計考過 2 題以上）。` : "";
  return {id: "l23mock-" + q.id, kind: "mock", mode, notebook: !!o.notebook, focusQi: o.notebook ? 0 : null,
    title: o.notebook ? `錯題本｜${q.topic}（出自${RN(q.day)}）` : `${RN(q.day)}第 ${n} 題｜${q.topic}`,
    sectionName: "科目三 機器學習技術與應用", chapter: `${q.section} ${SEC[q.section] || ""}`,
    why: (o.note || "") + hot, summary: "", keyPoints: [], trap: "", related: [], quiz: [quiz]};
}
function emitAnswer(q, pick){
  const k = q.id + "|" + pick;
  if (!EMBED || !pick || pick === "-" || k === lastAns) return;
  lastAns = k;
  emit({type: "answer", topicId: "l23mock-" + q.id, qi: 0, picked: "ABCD".indexOf(pick), tries: 1});
}
function emitQ(q, n, mode, o){
  const t = topicFor(q, n, mode, mode !== "exam", o), key = [t.id, mode, o.review ? "rev" : "", o.notebook ? "nb" : ""].join("|");
  if (key === lastEmit) return;
  lastEmit = key; lastAns = "";
  emit({type: "topic", topic: t});
  if (mode !== "exam") emitAnswer(q, o.pick);
}
function peiduSync(){
  if (!EMBED) return;
  const q = page !== "ana" && (page === "book" || PAPER[curDay]) ? focusQ() : null;
  if (q) {
    if (UI.view === "all") document.querySelectorAll("#qlist article.q").forEach(c => c.classList.toggle("focus", c.dataset.qid === q.id));
    if (page === "book") return emitQ(q, 0, "practice", {notebook: true, pick: nbPicks[q.id]});
    const r = rec(), ex = r.exam;
    if (r.mode === "practice") return emitQ(q, q.n, "practice", {pick: r.practice[q.id]});
    if (ex?.done) {
      const p = ex.answers[q.id] || "-";
      return emitQ(q, q.n, "practice", {pick: p, review: true, note: `她已交卷，${RN(curDay)}考 ${ex.score} 分，現在在看檢討；這題她${p === "-" ? "沒作答" : `選 (${p})，${p === q.answer ? "答對" : "答錯"}`}。`});
    }
    return emitQ(q, q.n, "exam", {});
  }
  if (lastEmit !== "home") { lastEmit = "home"; emit({type: "home"}); }
}

/* ---------- 總渲染與操作 ---------- */
function render(){
  if (curDay == null) return;  // 開頁時先補交逾時的卷，那時還沒決定要顯示哪一回
  renderTop();
  if (page === "ana") renderAna(); else { renderMain(); renderCard(); }
  tick();
  peiduSync();
}
function ask(msg, yes, yesLabel, noLabel){
  const box = $("#confirm");
  box.innerHTML = `<span>${esc(msg)}</span><span class="actions"><button class="btn" id="c-yes">${esc(yesLabel || "確定")}</button><button class="btn ghost" id="c-no">${esc(noLabel || "取消")}</button></span>`;
  box.hidden = false;
  $("#c-yes").onclick = () => { box.hidden = true; yes(); };
  $("#c-no").onclick = () => { box.hidden = true; };
  box.scrollIntoView({block: "nearest", behavior: "smooth"});
}
function go(d){
  const list = visible();
  if (!list.length) return;
  const i = Math.min(Math.max(curIndex(list) + d, 0), list.length - 1);
  cur[ctxKey()] = list[i].id; render();
  const el = $("#qlist");
  if (el.getBoundingClientRect().top < 0) el.scrollIntoView({block: "start"});
}
function pickOpt(id, L){
  const q = QBY[id]; if (!q) return;
  let answerNow = false;
  if (page === "book") {
    if (nbPicks[id]) return;
    nbPicks[id] = L; const v = S.nb[id];
    if (L === q.answer) { v.streak++; if (v.streak >= 2) { v.done = true; nbGrad[id] = 1; } } else { v.streak = 0; v.wrong++; }
    save(); answerNow = true;
  } else {
    const r = rec();
    if (r.mode === "practice") { if (r.practice[id]) return; r.practice[id] = L; recordFirst(q, L); save(); answerNow = true; }
    else { if (r.exam?.done) return; if (!r.exam) r.exam = newExam(); r.exam.answers[id] = L; save(); }
  }
  focusId = id;
  render();
  if (answerNow) emitAnswer(q, L);
}
function jump(id){
  if (UI.view === "one") {
    if (!visible().some(q => q.id === id)) { UI.filter = "全部"; UI.sec = "all"; if (!baseList().some(q => q.id === id)) rfilter = "all"; saveUI(); }
    cur[ctxKey()] = id; focusId = id; render();
    const el = $("#qlist"), top = el.getBoundingClientRect().top;
    if (top < 0 || top > innerHeight * 0.6) el.scrollIntoView({behavior: "smooth", block: "start"});
    return;
  }
  if (!document.getElementById("q-" + id)) { UI.filter = "全部"; UI.sec = "all"; if (!baseList().some(q => q.id === id)) rfilter = "all"; saveUI(); }
  focusId = id; render();
  document.getElementById("q-" + id)?.scrollIntoView({behavior: "smooth", block: "start"});
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (roundsOpen && !e.target.closest("#roundpanel, #roundbtn")) { roundsOpen = false; renderTop(); }
  if (!t) {
    // 全部列出或交卷檢討時，點題卡空白處＝把這題送給陪讀老師
    const card = EMBED && e.target.closest("#qlist article.q[data-qid]");
    if (card && card.dataset.qid !== focusId) { focusId = card.dataset.qid; if (UI.view === "one") cur[ctxKey()] = focusId; peiduSync(); }
    return;
  }
  const D = t.dataset;
  if (D.act === "rounds") { roundsOpen = !roundsOpen; renderTop(); }
  else if (D.round) { curDay = +D.round; page = "paper"; roundsOpen = false; rfilter = "wrong"; focusId = null; $("#confirm").hidden = true; render(); }
  else if (D.mode) {
    $("#confirm").hidden = true; focusId = null;
    if (D.mode === "notebook") { if (page !== "book") { nbPicks = {}; nbGrad = {}; nbSnap = {}; nbShowDone = false; } page = "book"; }
    else if (D.mode === "ana") page = "ana";
    else { page = "paper"; const r = rec(); if (r.mode !== D.mode) { r.mode = D.mode; save(); } }
    render(); if (D.mode === "notebook" && t.closest(".result")) window.scrollTo(0, 0);
  }
  else if (D.themeSet) { theme = D.themeSet; store.set("l23mock-theme", theme); applyTheme(); }
  else if (D.view) { UI.view = D.view; saveUI(); render(); }
  else if (D.go) go(+D.go);
  else if (D.filter) { UI.filter = D.filter; saveUI(); render(); }
  else if (D.rf) { rfilter = D.rf; focusId = null; render(); }
  else if (D.pq) pickOpt(D.pq, D.k);
  else if (D.flag) {
    const r = rec(); if (r.exam?.done) return;
    if (!r.exam) r.exam = newExam();
    const ex = r.exam, id = D.flag;
    ex.flags = ex.flags.includes(id) ? ex.flags.filter(x => x !== id) : [...ex.flags, id];
    save(); render();
  }
  else if (D.nbretry) { delete nbPicks[D.nbretry]; render(); }
  else if (D.jump) { e.preventDefault(); jump(D.jump); }
  else if (D.act === "start") { const r = rec(); if (r.mode === "exam" && !r.exam) { r.exam = newExam(); save(); render(); } }
  else if (D.act === "submit") {
    const r = rec(), qs = PAPER[curDay];
    const blank = qs.filter(q => !r.exam?.answers[q.id]).length;
    ask(`${blank ? `還有 ${blank} 題沒作答，` : ""}確定交卷？交卷後就不能改答案。`, () => { if (!r.exam) r.exam = newExam(); submitExam(curDay, false); }, "確定交卷", "繼續作答");
  }
  else if (D.hist != null) {
    const r = rec(), i = +D.hist, h = r.history[i], a = histAnswers(curDay, i);
    if (!h || !a || (r.exam && !r.exam.done)) return;
    r.exam = {start: h.at - h.secs * 1000, end: h.at, secs: h.secs, lim: h.lim || S.limit, answers: Object.assign({}, a), flags: (h.flags || []).slice(), done: true, score: h.score};
    rfilter = "wrong"; focusId = null; delete cur[curDay + "-exam"]; save(); render(); window.scrollTo(0, 0);
  }
  else if (D.act === "retry") { rec().exam = null; delete cur[curDay + "-exam"]; focusId = null; $("#confirm").hidden = true; save(); render(); window.scrollTo(0, 0); }
  else if (D.act === "reset") {
    const r = rec();
    if (r.mode === "exam") {
      if (!r.exam || r.exam.done) return;
      ask(`清除${RN(curDay)}考試模式這次的作答？計時會重新開始；之前交卷的成績不受影響。`, () => { r.exam = null; delete cur[curDay + "-exam"]; save(); render(); });
    } else {
      if (!Object.keys(r.practice).length) return;
      ask(`清除${RN(curDay)}練習模式的所有作答？錯題本和弱點分析的紀錄不受影響。`, () => { r.practice = {}; delete cur[curDay + "-practice"]; save(); render(); });
    }
  }
  else if (D.act === "nbtoggle") { nbShowDone = !nbShowDone; focusId = null; render(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "secsel") { UI.sec = e.target.value; saveUI(); render(); }
  else if (e.target.id === "lim") { S.limit = +e.target.value; save(); render(); }
});
document.addEventListener("keydown", e => {
  if (page === "ana" || UI.view !== "one" || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest?.("select, input, textarea") || !$("#confirm").hidden) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (/^[a-dA-D]$/.test(e.key)) document.querySelector(`#qlist .opt[data-k="${e.key.toUpperCase()}"]:not([disabled])`)?.click();
});
if (EMBED) {
  // disabled 的選項按鈕會吃掉點擊，讓點擊穿到整張題卡（檢討時點題卡送給老師）
  const st = document.createElement("style");
  st.textContent = "#qlist .q[data-qid]{cursor:pointer}#qlist .opt:disabled{pointer-events:none}";
  document.head.appendChild(st);
}
$("#lim").innerHTML = [60,75,90,100,120].map(m => `<option value="${m}" ${m === S.limit ? "selected" : ""}>${m} 分鐘</option>`).join("");
autoSubmitStale();
{ const live = Object.entries(S.days).find(([d, r]) => PAPER[d] && r.exam && !r.exam.done);
  curDay = live ? +live[0] : (PAPER[todayRound()] ? todayRound() : +Object.keys(PAPER)[0] || 1); }
render();
</script>
