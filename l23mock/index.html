准率。", "per_option": {"A": "正確敘述：機會平等才看真正合格者的 TPR。", "B": "正確敘述：統計均等比較各群體的正向預測比例。", "C": "正確敘述：公平與準確度之間可能需要取捨。", "D": "錯誤（本題答案）：其他特徵可能是族群的代理變數，須直接檢查各族群核准率。"}, "guide_ref": "學習指引 p.6-17～6-19", "hot": false}, {"no": 46, "section": "X", "topic_id": "X-01", "topic": "參數量與運算量", "style": "計算", "stem": "某 Transformer 編碼器層的多頭自注意力，模型維度 d_model=512，頭數 h=8（每頭維度 64）。線性投影 W_Q、W_K、W_V（把輸入投影成查詢、鍵、值，8 個頭合併計算）與輸出投影 W_O 都是 512→512 的全連接層且含偏差。這個自注意力模組的可訓練參數總量為何？（不含 LayerNorm 與前饋網路）", "options": {"A": "1,050,624：4 個 512→512 的投影，每個 512×512＋512", "B": "786,432：只算 W_Q、W_K、W_V 的權重 3×512×512", "C": "1,048,576：4 個投影的權重 4×512×512，漏算偏差", "D": "8,388,608：把 4 個投影的權重再乘以頭數 8"}, "answer": "A", "explanation": "答案 A。每個投影層的參數=輸入×輸出＋偏差=512×512＋512=262,656；共 W_Q、W_K、W_V、W_O 四個，總計 4×262,656=1,050,624。頭數 h 只是把 512 維切成 8 個 64 維的子空間平行計算（每頭的 W_Q 為 512×64，8 個頭合起來仍是 512×512），並不會讓參數量乘以 8。", "per_option": {"A": "正確：4×262,656=1,050,624。", "B": "漏算輸出投影 W_O，也漏算偏差。", "C": "漏掉每個投影的 512 個偏差，共 2,048 個。", "D": "頭數只是把 512 維切成 8 個 64 維子空間，不會讓參數乘以 8。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 單一個 512→512 投影層的參數", "參數量 ＝ 輸入維度 × 輸出維度 ＋ 偏差（輸出維度個）", "＝ 512×512 ＋ 512 ＝ 262,144 ＋ 512 ＝ 262,656"], ["② 共有幾個投影層", "W_Q、W_K、W_V、W_O 各一個", "共 4 個（8 個頭只是把 512 維切成 8 個 64 維，不會多出參數）"], ["③ 自注意力總參數", "總參數 ＝ 投影層數 × 每層參數", "＝ 4 × 262,656 ＝ 1,050,624"]], "tip": "全連接層參數＝輸入×輸出＋偏差；多頭是「切開」512 維，不是「複製」8 份。", "fig": {"type": "layers", "title": "自注意力的參數", "items": [{"name": "輸入", "shape": "512"}, {"name": "W_Q／W_K／W_V", "shape": "各 512→512", "note": "三個平行投影，各 262,656，共 787,968"}, {"name": "注意力運算", "shape": "512", "note": "8 頭各 64 維，合併回 512，沒有參數"}, {"name": "W_O", "shape": "512→512", "note": "輸出投影 512×512＋512 ＝ 262,656", "hl": true}], "note": "總參數 ＝ 3×262,656＋262,656 ＝ 1,050,624；8 個頭是切開 512，不是複製"}}}, {"no": 47, "section": "X", "topic_id": "X-02", "topic": "時間序列驗證", "style": "情境", "stem": "某零售團隊要預測「未來 7 天的累積銷量」。訓練資料的每筆樣本在時間點 t 的標籤，是 t+1 到 t+7 天的銷量加總。團隊使用 TimeSeriesSplit(n_splits=5) 的預設設定做驗證，驗證集緊接在訓練集之後，驗證 RMSE 很漂亮，但上線後誤差高出許多。下列何者最可能是原因，並該如何改善？", "options": {"A": "折數太少，應把 n_splits 增加到 50，每折驗證集縮短為 1 天", "B": "訓練集最後幾筆樣本的標籤涵蓋了驗證期間的銷量，造成資訊重疊；應在訓練與驗證之間設定至少 7 天的間隔（gap）", "C": "訓練視窗應由擴張視窗改為固定長度的滾動視窗", "D": "時間序列不該使用 TimeSeriesSplit，應改用打散順序的 K 折交叉驗證以涵蓋各時期"}, "answer": "B", "explanation": "答案 B。標籤是 t+1～t+7 天的銷量加總，所以訓練集最後 7 筆樣本的標籤包含了「驗證期間」才會發生的銷量，等於訓練時偷看到驗證集的答案，驗證分數會偏樂觀。TimeSeriesSplit 的 gap 參數可在訓練與驗證區間之間留下間隔（此例至少 7 天），隔離重疊的標籤窗口。多折前向驗證、改視窗型態都不能取代這個隔離。", "per_option": {"A": "增加折數不會消除標籤重疊造成的洩漏。", "B": "正確：以 gap 隔離重疊的標籤窗口。", "C": "改變視窗類型不會消除邊界附近標籤窗口與驗證期間的重疊。", "D": "隨機打散會讓未來資料進入訓練集，洩漏更嚴重。"}, "guide_ref": "指引未載", "hot": true}, {"no": 48, "section": "X", "topic_id": "X-07", "topic": "RAG 混合搜尋", "style": "情境", "stem": "某公司的客服 RAG 系統已用混合搜尋（BM25 加向量搜尋，以 RRF 融合）找回候選文件。檢查發現，正確答案所在的文件常排在第 8～15 名，但系統只把前 3 名送給 LLM，因此常漏掉關鍵內容。若不想把前 15 名全部塞進 LLM（成本高、雜訊多），下列哪一種作法最適當？", "options": {"A": "對 LLM 進行微調，讓它直接記住整個知識庫，之後不必再檢索", "B": "關閉 BM25，只保留向量搜尋，讓排序只依語意相似度決定", "C": "擴大 top-k，把前 100 名全部送給 LLM，讓它自行挑選有用的內容", "D": "加入重排序（Reranker）：用較精細的模型對前 N 筆候選重新評分，再取前幾名送入 LLM"}, "answer": "D", "explanation": "答案 D。檢索常分兩階段：先用快速的混合搜尋「廣泛召回」候選，再用較精細（如交叉編碼器）的重排序模型對前 N 筆重新評分，只把最相關的少數幾筆送入 LLM，兼顧召回與精準度並控制成本。單純加大 top-k 會增加雜訊與花費；微調 LLM 或關閉其中一路搜尋，都無法解決「已找回但排名太後面」的問題。", "per_option": {"A": "這等於放棄 RAG，知識更新時要重新訓練，也無法提供引用出處。", "B": "移除一路只會減少線索，無法讓已找回的正確文件排到前面。", "C": "會大幅增加 token 成本與雜訊，關鍵內容也可能被無關內容稀釋。", "D": "正確：先廣泛召回，再精細重排。"}, "guide_ref": "指引未載", "hot": false}, {"no": 49, "section": "X", "topic_id": "X-08", "topic": "信用評分卡", "style": "計算", "stem": "某銀行的信用評分卡設定：基準分數 600 分對應好壞勝算（好客戶：壞客戶）為 50:1，並規定「好壞勝算每增加一倍，分數增加 20 分」（PDO=20）。若某位申請人經模型估計的好壞勝算為 200:1，其信用分數應為多少？", "options": {"A": "640 分：200÷50=4 倍＝2 次加倍，600＋2×20", "B": "680 分：把倍數 4 直接乘以 PDO，即 600＋4×20", "C": "620 分：勝算只加倍了 1 次", "D": "612 分：用 log₁₀ 計算，即 600＋20×log₁₀4"}, "answer": "A", "explanation": "答案 A。評分卡把邏輯迴歸輸出的對數勝算線性轉換成分數：分數=基準分＋(PDO÷ln2)×ln(勝算÷基準勝算)。勝算由 50:1 變 200:1 是 4 倍＝2 次加倍（2²=4），每次加倍加 20 分，所以 600＋2×20=640 分。用公式驗算：20÷ln2×ln4=20×2=40 分。分數越高代表勝算越有利，違約風險越低。", "per_option": {"A": "正確：勝算加倍 2 次，加 40 分。", "B": "PDO 是「每加倍一次」加的分數，要用加倍次數 log₂4=2，而不是倍數 4。", "C": "200:1 是 50:1 的 4 倍，等於加倍 2 次。", "D": "分數與勝算的關係以「加倍次數」(log₂) 計，不是 log₁₀。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 勝算變成幾倍", "倍數 ＝ 新勝算 ÷ 基準勝算", "＝ 200 ÷ 50 ＝ 4 倍"], ["② 換算成「加倍次數」", "加倍次數 ＝ log₂(倍數)，即 2 的幾次方等於倍數", "＝ log₂4 ＝ 2（因為 2²＝4）"], ["③ 算分數", "分數 ＝ 基準分 ＋ 加倍次數 × PDO", "＝ 600 ＋ 2 × 20 ＝ 600 ＋ 40 ＝ 640"], ["④ 用原公式驗算", "分數 ＝ 基準分 ＋ (PDO ÷ ln2) × ln(新勝算 ÷ 基準勝算)", "＝ 600 ＋ (20 ÷ ln2) × ln4 ＝ 600 ＋ 20 × 2 ＝ 640（ln4＝2×ln2）"]], "tip": "PDO 是「勝算每加倍一次」加的分數：先算加倍幾次，再乘 PDO。"}}, {"no": 50, "section": "X", "topic_id": "X-09", "topic": "時間複雜度", "style": "情境", "stem": "某資料團隊用下列 Python 程式，找出 m 位使用者中有哪些在黑名單內：\n```\nblacklist = [...]   # 內含 n 個使用者 ID（list）\nhits = [u for u in users if u in blacklist]   # users 共 m 位\n```\n因為 `u in blacklist` 在 list 上需要逐一比對，資料量增大後程式越來越慢。若把 blacklist 先轉成 set（雜湊集合，平均查詢時間為常數）再比對，整體時間複雜度從何變成何？", "options": {"A": "從 O(m×n) 降為 O(m＋n)：轉成 set 需 O(n)，之後 m 次查詢各平均 O(1)", "B": "維持 O(m×n)：轉成 set 只是資料型態不同，每次查詢仍需逐一比對全部元素", "C": "從 O(m×n) 降為 O(n)：因為 set 轉換後 m 位使用者可以一次比對完", "D": "從 O(m×n) 降為 O(m×log n)：set 查詢像二分搜尋一樣每次砍半"}, "answer": "A", "explanation": "答案 A。list 的 in 要由頭掃到尾，最壞要比對 n 個元素，m 位使用者就是 O(m×n)；set 以雜湊直接定位，平均每次查詢 O(1)。先花 O(n) 把 blacklist 轉成 set，再做 m 次 O(1) 查詢，總共 O(m＋n)。例如 m=n=100,000，最壞約 10¹⁰ 次比對降為約 2×10⁵ 次運算。Big-O 描述的是成長趨勢，不是實際秒數。", "per_option": {"A": "正確：建集合 O(n)＋m 次 O(1) 查詢。", "B": "set 以雜湊值直接定位，不必逐一比對。", "C": "仍需對 m 位使用者各查詢一次，至少 O(m)；轉換的 O(n) 也要計入。", "D": "set 是雜湊結構，平均查詢為 O(1)，不是 O(log n)，也沒有排序。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① list 版的時間", "時間 ＝ 查詢次數 × 每次最壞比對個數 ＝ m × n", "舉例（題目沒給數字）：若 m＝n＝100,000，100,000 × 100,000 ＝ 10,000,000,000（10¹⁰）次 → O(m×n)"], ["② set 版的時間", "時間 ＝ 建 set 一次（O(n)）＋ m 次查詢 × 每次 O(1)", "同樣舉例：n ＋ m ＝ 100,000 ＋ 100,000 ＝ 200,000（約 2×10⁵）次 → O(m＋n)"]], "code": [["blacklist = [...]   # 內含 n 個使用者 ID（list）", "把黑名單存成 list（串列），[...] 代表省略的 n 個 ID。list 要找東西只能從頭一個一個比。# 後面是註解，不會執行。"], ["hits = [u for u in users if u in blacklist]   # users 共 m 位", "串列推導式（list comprehension），整句意思：對 users 裡的每個 u，若 u 在黑名單中（if u in blacklist），就收進新串列 hits（hits＝命中者）。其中 u in blacklist 在 list 上要逐一比對，最壞比 n 次，m 位使用者就是 m×n 次；若 blacklist 先轉成 set（雜湊集合），in 平均只要 1 次。"]], "tip": "list 的 in 是 O(n)、set 的 in 平均 O(1)；查很多次時，先轉 set 超划算。"}}], "10": [{"no": 1, "section": "3.1", "topic_id": "3.1-02", "topic": "連續分佈與 PDF", "style": "計算", "stem": "某工廠生產的軸承外徑近似常態分佈（Normal Distribution），平均 50.00 mm、標準差 2.00 mm。品管規定外徑超過 54.00 mm 者一律報廢（只管上限，下限不報廢）。下列何者最接近預期的報廢比例？", "options": {"A": "約 4.6%：將 −2σ 與 +2σ 兩側的尾部面積相加", "B": "約 15.9%：超過平均 +1σ 的單尾面積（對應 52 mm 以上）", "C": "約 2.3%：54 mm 位於平均 +2σ 處，右側尾部面積約 0.0228", "D": "約 0.13%：超過平均 +3σ 的單尾面積（對應 56 mm 以上）"}, "answer": "C", "explanation": "答案 C。連續型變數的機率是密度曲線下的面積；54 mm 與平均相差 (54−50)/2 = 2 個標準差，Z = 2。標準常態在 Z > 2 的右尾面積為 1 − Φ(2) ≈ 0.0228，約 2.3%。Python 驗算：1 − norm.cdf(2) = 0.02275；兩側合計才是 4.55%。注意 PDF 的函數值本身不是機率，機率要對區間積分（取面積）。", "per_option": {"A": "本題只管上限，只計右側單尾，不能把左尾也算進去。", "B": "+1σ 才是 15.9%，54 mm 是 +2σ。", "C": "正確：Z=(54−50)/2=2，單尾面積 P(Z>2)≈0.0228。", "D": "+3σ 才是 0.13%，54 mm 只有 +2σ。"}, "guide_ref": "學習指引 p.3-3～3-4（常態分佈與 PDF 面積）；σ 倍數對應的尾部面積指引未載", "hot": false, "detail": {"steps": [["① 把 54 mm 換成 Z 分數（距離平均幾個標準差）", "Z ＝ (x － μ) ÷ σ（μ＝平均、σ＝標準差）", "＝ (54 － 50) ÷ 2 ＝ 4 ÷ 2 ＝ 2"], ["② 算「超過 54 mm」的右尾面積（只管上限，所以只算右邊一側）", "報廢比例 ＝ P(X＞54) ＝ P(Z＞2) ＝ 1 － Φ(2)（Φ(z)＝標準常態中 Z 以下的面積）", "＝ 1 － 0.9772 ＝ 0.0228 ≈ 2.3%"], ["③ 對照其他選項的 σ 位置", "右尾面積：+1σ ≈ 0.1587、+2σ ≈ 0.0228、+3σ ≈ 0.00135；兩側合計 ＝ 2 × 單尾", "A：2 × 0.0228 ＝ 0.0456 ≈ 4.6%（多算了左尾）；B：+1σ ＝ 15.9%；D：+3σ ＝ 0.13%"]], "tip": "常態分佈：+1σ 右尾約 16%、+2σ 約 2.3%、+3σ 約 0.13%；只管單邊就只算單尾。"}}, {"no": 2, "section": "3.1", "topic_id": "3.1-03", "topic": "貝氏定理與條件機率", "style": "計算", "stem": "某電信公司用單純貝氏（Naive Bayes）預測客戶是否流失。歷史資料中流失者占 20%、未流失者占 80%。對一位新客戶觀察到兩個特徵：「近 30 天客服來電偏多」與「近 90 天未使用優惠」。已知流失客戶身上這兩項出現的機率分別為 0.7 與 0.6，未流失客戶分別為 0.2 與 0.3，且在給定類別下兩特徵條件獨立。依貝氏定理，此客戶的預測類別與後驗機率最接近下列何者？", "options": {"A": "預測流失，後驗約 0.64：以 0.084 ÷ (0.084 + 0.048) 計算", "B": "預測未流失，後驗約 0.80：未流失的先驗 0.8 較大，兩個特徵不會改變結果，後驗仍為 0.80", "C": "預測流失，後驗約 0.084：直接取 0.2×0.7×0.6 的乘積作為機率", "D": "預測流失，後驗約 0.42：只將兩個似然 0.7×0.6 相乘，忽略先驗"}, "answer": "A", "explanation": "答案 A。單純貝氏假設特徵在類別下條件獨立：P(流失|x) ∝ P(流失)·P(x₁|流失)·P(x₂|流失) = 0.2×0.7×0.6 = 0.084；未流失為 0.8×0.2×0.3 = 0.048。分母 P(x) 是兩者相加 0.132，所以後驗為 0.084÷0.132 ≈ 0.636，流失的後驗較大，預測流失。Python 驗算 0.0840、0.0480、0.6364。", "per_option": {"A": "正確：先驗乘以各特徵似然，再除以兩類分子總和。", "B": "忽略似然。證據會把信念更新，未流失的後驗其實只有約 0.36。", "C": "0.084 只是未正規化的分子，還要除以 P(證據)=0.084+0.048。", "D": "漏掉先驗 0.2，也漏掉分母的正規化。"}, "guide_ref": "學習指引 p.3-5～3-6（貝氏定理）；單純貝氏的條件獨立假設指引未載", "hot": true, "detail": {"steps": [["① 算「流失」的分子（先驗 × 兩個特徵的似然）", "分子(流失) ＝ P(流失) × P(x₁｜流失) × P(x₂｜流失)（特徵條件獨立才能直接相乘）", "＝ 0.2 × 0.7 × 0.6 ＝ 0.084"], ["② 算「未流失」的分子", "分子(未流失) ＝ P(未流失) × P(x₁｜未流失) × P(x₂｜未流失)", "＝ 0.8 × 0.2 × 0.3 ＝ 0.048"], ["③ 算分母 P(x)（所有可能來源加總，作用是把兩個分子變成加起來等於 1 的機率）", "P(x) ＝ 分子(流失) ＋ 分子(未流失)", "＝ 0.084 ＋ 0.048 ＝ 0.132"], ["④ 算流失的後驗機率", "P(流失｜x) ＝ 分子(流失) ÷ P(x)", "＝ 0.084 ÷ 0.132 ≈ 0.636 ≈ 0.64"], ["⑤ 對照未流失，決定預測類別", "P(未流失｜x) ＝ 分子(未流失) ÷ P(x)", "＝ 0.048 ÷ 0.132 ≈ 0.364；0.636 ＞ 0.364 → 預測流失"]], "tip": "單純貝氏：每一類算「先驗 × 各特徵似然相乘」，再除以兩類加總；千萬別漏掉先驗，也別忘記除分母。", "fig": {"type": "tree", "title": "機率樹（假設 1,000 位客戶）", "total": "1,000 人", "branches": [{"label": "流失", "p": "20%", "n": "200 人", "leaves": [{"label": "兩特徵都有", "p": "42%", "n": "84 人", "hl": "num"}, {"label": "其他", "p": "58%", "n": "116 人"}]}, {"label": "未流失", "p": "80%", "n": "800 人", "leaves": [{"label": "兩特徵都有", "p": "6%", "n": "48 人", "hl": "den"}, {"label": "其他", "p": "94%", "n": "752 人"}]}], "result": "P(流失｜兩特徵) ＝ 84 ÷ (84＋48) ＝ 84 ÷ 132 ≈ 63.6%，預測流失"}}}, {"no": 3, "section": "3.2", "topic_id": "3.2-01", "topic": "向量矩陣運算", "style": "情境", "stem": "某工程師撰寫全連接層的前向傳播程式：一個批次含 32 筆樣本、每筆 20 個特徵，輸入矩陣 X 的形狀為 (32, 20)；權重矩陣 W 的形狀為 (20, 8)，偏差向量 b 的形狀為 (8,)。他在 NumPy 中執行 Z = X @ W + b。下列關於執行結果的敘述何者正確？", "options": {"A": "形狀為 (32, 8)，但 b 只加到第一筆樣本，其餘 31 筆不加偏差", "B": "形狀為 (8, 32)，因為矩陣相乘時 NumPy 會自動轉置結果", "C": "會出錯：b 的形狀 (8,) 與 (32, 8) 不同，必須手動複製成 (32, 8) 才能相加", "D": "形狀為 (32, 8)；b 以廣播（Broadcasting）加到每一筆樣本的 8 個輸出"}, "answer": "D", "explanation": "答案 D。矩陣相乘的內側維度 20 相同，結果為 (32, 20)@(20, 8) = (32, 8)。相加時 b 的形狀 (8,) 從最後一軸對齊，與 Z 的最後一軸 8 相符，因此 NumPy 廣播把 b 沿第 0 軸擴展到 32 列，每一筆樣本都加上同一組偏差，這正是神經網路 z = Wa + b 在批次運算下的寫法。", "per_option": {"A": "廣播會把 b 套用到每一列，不是只加第一列。", "B": "矩陣乘法 (a,b)×(b,c) 的結果是 (a,c)，不會自動轉置。", "C": "形狀由尾端對齊且 8=8，廣播自動擴展，不需手動複製。", "D": "正確：(32,20)@(20,8)=(32,8)，(8,) 沿第 0 軸廣播到 32 列。"}, "guide_ref": "學習指引 p.3-9～3-11（矩陣乘法與神經網路 z=Wa+b）；廣播規則指引未載", "hot": true}, {"no": 4, "section": "3.2", "topic_id": "3.2-01", "topic": "向量矩陣運算", "style": "計算", "stem": "某神經網路層的權重矩陣 W = [[1, 0, 2], [-1, 3, 1]]（形狀 2×3），輸入向量 a = [2, 1, 3]，偏差向量 b = [1, -4]。該層線性輸出 z = W·a + b 為下列何者？", "options": {"A": "z = [8, 4]：只算 W·a，漏加了偏差向量 b", "B": "z = [9, 0]：W·a = [8, 4]，再逐元素加上 b", "C": "z = [7, 8]：將偏差誤用成相減（W·a − b）", "D": "無法相乘：2×3 的矩陣不能與長度 3 的向量相乘"}, "answer": "B", "explanation": "答案 B。W 為 2×3、a 長度 3，內側維度相符，W·a 的結果長度為 2：[1×2+0×1+2×3, −1×2+3×1+1×3] = [8, 4]。再加 b = [1, −4] 得 z = [9, 0]。Python 驗算 W @ a + b = [9, 0]。", "per_option": {"A": "題目要求 z = W·a + b，偏差不能省略。", "B": "正確：先做矩陣乘向量，再逐元素加偏差。", "C": "公式是加偏差，不是減偏差。", "D": "(2,3)×(3,) 內側維度同為 3，可以相乘，結果長度為 2。"}, "guide_ref": "學習指引 p.3-9～3-11（矩陣乘法、z = Wa + b）", "hot": true, "detail": {"steps": [["① 先確認形狀能不能乘", "(m×n) 的矩陣 × 長度 n 的向量 → 長度 m 的向量（內側的 n 必須相同）", "W 是 2×3、a 長度 3，內側都是 3，可以乘；結果長度是 2"], ["② 算 W·a 的第 1 個數字（W 第 1 列 × a，對應位置相乘再加起來）", "(W·a)₁ ＝ W₁₁×a₁ ＋ W₁₂×a₂ ＋ W₁₃×a₃", "＝ 1×2 ＋ 0×1 ＋ 2×3 ＝ 2 ＋ 0 ＋ 6 ＝ 8"], ["③ 算 W·a 的第 2 個數字（W 第 2 列 × a）", "(W·a)₂ ＝ W₂₁×a₁ ＋ W₂₂×a₂ ＋ W₂₃×a₃", "＝ (−1)×2 ＋ 3×1 ＋ 1×3 ＝ −2 ＋ 3 ＋ 3 ＝ 4，所以 W·a ＝ [8, 4]"], ["④ 逐元素加上偏差 b", "z ＝ W·a ＋ b（相同位置的數字相加）", "＝ [8＋1, 4＋(−4)] ＝ [9, 0]"]], "tip": "矩陣乘向量：每一列各自「對應相乘再加總」得到一個數；最後別忘了加偏差。", "fig": {"type": "matrix", "title": "W·a 的形狀", "op": "·", "ops": [{"name": "W", "r": 2, "c": 3}, {"name": "a", "r": 3, "c": 1}], "out": {"name": "Wa", "r": 2, "c": 1}, "note": "內側 3 相消，Wa 長度 2＝[8, 4]；再加 b＝[1, −4] 得 z＝[9, 0]"}}}, {"no": 5, "section": "3.3", "topic_id": "3.3-03", "topic": "損失函數選擇", "style": "計算", "stem": "某二元分類模型對 4 筆樣本輸出「屬於正類的機率」p，真實標籤 y 依序為：(y=1, p=0.9)、(y=1, p=0.6)、(y=0, p=0.2)、(y=0, p=0.5)。以自然對數計算，這 4 筆樣本的平均二元交叉熵損失（Binary Cross-Entropy）最接近下列何者？", "options": {"A": "約 0.383：四筆損失 0.105、0.511、0.223、0.693 的平均", "B": "約 0.729：負類樣本也誤用 −ln p（−ln 0.2、−ln 0.5）計算", "C": "約 0.166：誤用以 10 為底的對數（log₁₀）計算", "D": "約 0.115：誤把 (y − p)² 的平均（均方誤差 MSE）直接當作交叉熵損失"}, "answer": "A", "explanation": "答案 A。二元交叉熵 L = −[y·ln p + (1−y)·ln(1−p)]。四筆分別為 −ln0.9 = 0.105、−ln0.6 = 0.511、−ln(1−0.2) = −ln0.8 = 0.223、−ln(1−0.5) = 0.693，平均 = 1.532÷4 ≈ 0.383。Python 驗算 0.3831。交叉熵會對「高信心卻錯誤」的預測給予很大的懲罰，這是分類任務的標準損失。", "per_option": {"A": "正確：正類取 −ln p，負類取 −ln(1−p)，再取平均。", "B": "負類樣本要用 −ln(1−p)，不能直接用 p。", "C": "題目指定自然對數；改用 log₁₀ 會得到不同數值。", "D": "這是均方誤差而不是交叉熵，兩者損失尺度與梯度行為不同。"}, "guide_ref": "學習指引 p.3-21～3-23（交叉熵為分類標準損失）；逐筆計算屬補充", "hot": true, "detail": {"steps": [["① 寫出每一筆的損失公式", "L ＝ －[ y×ln(p) ＋ (1－y)×ln(1－p) ]（y＝1 時只剩 −ln p；y＝0 時只剩 −ln(1−p)）", "ln 是自然對數；p 是模型說「屬於正類」的機率"], ["② 第 1 筆 (y=1, p=0.9)", "L ＝ −ln(p)", "＝ −ln 0.9 ≈ 0.105"], ["③ 第 2 筆 (y=1, p=0.6)", "L ＝ −ln(p)", "＝ −ln 0.6 ≈ 0.511"], ["④ 第 3 筆 (y=0, p=0.2)", "L ＝ −ln(1－p)", "＝ −ln(1 − 0.2) ＝ −ln 0.8 ≈ 0.223"], ["⑤ 第 4 筆 (y=0, p=0.5)", "L ＝ −ln(1－p)", "＝ −ln(1 − 0.5) ＝ −ln 0.5 ≈ 0.693"], ["⑥ 取平均", "平均損失 ＝ 各筆損失總和 ÷ 筆數", "＝ (0.105 ＋ 0.511 ＋ 0.223 ＋ 0.693) ÷ 4 ＝ 1.532 ÷ 4 ≈ 0.383"]], "tip": "交叉熵：真實是 1 看 −ln(p)，真實是 0 看 −ln(1−p)；永遠是「模型給正確答案的機率」取負對數。"}}, {"no": 6, "section": "3.3", "topic_id": "3.3-04", "topic": "小批次梯度下降", "style": "情境", "stem": "某團隊微調影像模型時，理想的批次大小是 64 筆，但單張 GPU 的記憶體一次最多只能處理 16 筆樣本。他們希望在不更換硬體的前提下，讓每次參數更新所用的梯度，等效於 64 筆樣本的小批次梯度。下列哪種做法最適當？", "options": {"A": "放大學習率（Larger Learning Rate）：每處理 16 筆就更新一次，並把學習率放大 4 倍，以補償批次變小", "B": "隨機梯度下降（SGD）：每次只用 1 筆樣本，把每步的記憶體需求降到最低", "C": "梯度累積（Gradient Accumulation）：連續處理 4 個 16 筆小批次，累加梯度後才更新一次參數", "D": "樣本重複（Sample Repetition）：將 16 筆樣本重複 4 次湊成 64 筆再計算梯度"}, "answer": "C", "explanation": "答案 C。小批次的價值在於用一批樣本平均出較穩定的梯度。記憶體裝不下大批次時，可用梯度累積：連續做 4 次前向與反向傳播，把梯度加總（損失先除以 4 以取平均），再執行一次 optimizer.step()，數學上等效於批次 64。重複樣本、縮小批次加放大學習率，都不能取得同等穩定的梯度估計。", "per_option": {"A": "每次更新仍只用 16 筆估計梯度，雜訊沒有降低，放大學習率反而更不穩。", "B": "SGD 的梯度雜訊更大，與「等效 64 筆」的目標相反。", "C": "正確：4×16=64，等效於一個 64 筆的小批次梯度。", "D": "重複的樣本不帶來新資訊，梯度估計的變異並沒有降低。"}, "guide_ref": "學習指引 p.3-23～3-24（小批次梯度下降）；梯度累積指引未載", "hot": false}, {"no": 7, "section": "3.3", "topic_id": "3.3-05", "topic": "動量與 Adam", "style": "情境", "stem": "某工程師用帶動量（Momentum）的 SGD 訓練迴歸網路，動量係數 β = 0.9 時損失平穩下降。為了讓更新「更平滑」，他把 β 改成 0.999，其餘設定不變，結果損失曲線在最低點附近來回擺盪很久才慢慢收斂。最可能的原因為何？", "options": {"A": "有效學習率縮小（Shrinking Step Size）：β 越大等效學習率越小，更新太慢而卡在平坦處", "B": "慣性過大（Excess Inertia）：動量累積過長的歷史梯度，參數衝過最低點而長時間擺盪", "C": "梯度消失（Vanishing Gradient）：β 接近 1 會使梯度逐層縮小趨近於零", "D": "批次雜訊（Batch Noise）：動量係數過大使單批梯度的估計雜訊變大"}, "answer": "B", "explanation": "答案 B。動量把過去梯度以指數加權累積成「速度」，有效記憶長度約 1/(1−β)：β=0.9 約記住 10 步，β=0.999 則約 1000 步。記憶過長代表慣性極大，參數衝過最低點後，反向的梯度要花很多步才能把累積的速度抵消，於是出現過衝與擺盪。β 並不是越大越好，常用 0.9 左右。", "per_option": {"A": "β 越大代表保留更多過去的速度，並不會讓步伐自動縮小；問題出在慣性過大，而不是步伐太小。", "B": "正確：β 越接近 1，有效記憶長度（約 1/(1−β)）越長，慣性越大。", "C": "梯度消失與網路深度、激活函數有關，不是動量係數造成。", "D": "動量不改變單批梯度的雜訊大小，而是改變歷史梯度被累積的權重。"}, "guide_ref": "學習指引 p.3-24～3-26（動量法）；β 過大的副作用屬補充", "hot": true}, {"no": 8, "section": "3.3", "topic_id": "3.3-08", "topic": "梯度裁剪", "style": "計算", "stem": "某訓練迴圈使用 clip_grad_norm_(parameters, max_norm=2.0)，依 L2 範數裁剪整體梯度。某一步的梯度向量為 g₁ = [1.2, 0.9]，另一步為 g₂ = [3.6, 4.8]。兩者裁剪後的 L2 範數依序為下列何者？", "options": {"A": "2.0 與 2.0：所有梯度都會被調整到剛好等於 max_norm", "B": "1.5 與約 2.83：將 g₂ 的每個元素各自截斷在 2.0 以內", "C": "1.5 與 18.0：縮放係數誤用「範數÷max_norm」而放大了 g₂，導致超過上限", "D": "1.5 與 2.0：g₁ 未超過上限而不變，g₂ 依範數等比例縮小到 2.0"}, "answer": "D", "explanation": "答案 D。g₁ 的範數 √(1.2²+0.9²) = 1.5 < 2.0，不處理，仍為 1.5。g₂ 的範數 √(3.6²+4.8²) = 6.0 > 2.0，縮放係數 = 2.0÷6.0 = 1/3，裁剪後為 [1.2, 1.6]，範數 2.0；方向不變。Python 驗算 1.5 與 2.0。", "per_option": {"A": "裁剪只縮小過大的梯度，範數未超過上限者不會被放大。", "B": "這是逐元素截斷（clip by value），而 clip_grad_norm_ 是依整體範數等比例縮放。", "C": "縮放係數是 max_norm÷範數（小於 1 才縮小），不是反過來。", "D": "正確：只有超過 max_norm 的梯度才依 max_norm÷範數縮小，不會被放大。"}, "guide_ref": "學習指引 p.3-27（梯度裁剪）；範數裁剪的細節屬補充", "hot": false, "detail": {"steps": [["① 算 g₁ 的 L2 範數（向量的長度）", "‖g‖ ＝ √(g₁² ＋ g₂²)", "＝ √(1.2² ＋ 0.9²) ＝ √(1.44 ＋ 0.81) ＝ √2.25 ＝ 1.5"], ["② 判斷 g₁ 要不要裁剪", "只有範數 ＞ max_norm 才裁剪", "1.5 ＜ 2.0，不處理，裁剪後範數仍是 1.5"], ["③ 算 g₂ 的 L2 範數", "‖g‖ ＝ √(g₁² ＋ g₂²)", "＝ √(3.6² ＋ 4.8²) ＝ √(12.96 ＋ 23.04) ＝ √36 ＝ 6.0（6.0 ＞ 2.0，要裁剪）"], ["④ 算縮放係數", "縮放係數 ＝ max_norm ÷ ‖g‖（小於 1 才是縮小）", "＝ 2.0 ÷ 6.0 ＝ 1/3 ≈ 0.333"], ["⑤ 每個元素乘上係數，再驗算新範數", "g' ＝ g × 縮放係數；‖g'‖ ＝ √(g'₁² ＋ g'₂²)", "g₂' ＝ [3.6×(1/3), 4.8×(1/3)] ＝ [1.2, 1.6]；‖g₂'‖ ＝ √(1.44 ＋ 2.56) ＝ √4 ＝ 2.0"]], "code": [["clip_grad_norm_(parameters, max_norm=2.0)", "clip＝剪裁；grad＝gradient（梯度）；norm＝範數（向量的長度）；結尾底線 _ 是 PyTorch 的慣例，表示「直接就地修改」。意思：把所有參數的梯度合起來算一個總長度，超過 max_norm（上限）2.0 就整體等比例縮小到 2.0，沒超過就不動；方向不變。"]], "tip": "clip_grad_norm_ 是「整體等比例縮小」：只縮不放大，範數沒超過上限就不動。"}}, {"no": 9, "section": "4.1", "topic_id": "4.1-01", "topic": "三大學習類型", "style": "否定", "stem": "下列關於監督式、非監督式與強化式學習的敘述，何者錯誤？", "options": {"A": "聚類（Clustering）：訓練時需要每筆資料的正確群別標籤，因此屬於監督式學習", "B": "強化式學習（Reinforcement Learning）：代理人靠環境給的獎勵，學習最大化長期累積報酬", "C": "分類與迴歸（Classification and Regression）：都需要標註資料，差別在預測離散類別或連續數值", "D": "降維（Dimensionality Reduction）：如 PCA 不使用標籤，屬於非監督式學習常見任務"}, "answer": "A", "explanation": "答案 A。非監督式學習處理沒有標籤的資料，常見任務是聚類與降維；聚類產生的群別編號只是演算法的輸出，不是事先給定的標準答案，所以「聚類需要群別標籤」是錯的。監督式學習靠標註資料學分類與迴歸；強化式學習靠環境回饋的獎勵學習序列決策，沒有每一步的標準答案。", "per_option": {"A": "錯誤的敘述：聚類沒有標籤，是從資料本身找群集結構，屬於非監督式學習。", "B": "敘述正確，這正是強化式學習的定義。", "C": "敘述正確，兩者都是監督式學習的任務。", "D": "敘述正確，降維是非監督式學習的常見任務之一。"}, "guide_ref": "學習指引 p.4-2～4-3（三大學習類型）", "hot": false}, {"no": 10, "section": "4.2", "topic_id": "4.2-09", "topic": "集成策略比較", "style": "情境", "stem": "某醫療影像團隊事後發現，訓練資料中約有 8% 的標籤是人工誤標。資料科學家打算比較 Bagging 型的隨機森林，與樹很深、迭代很多輪的梯度提升（Gradient Boosting）。關於兩者面對這些誤標樣本的表現，下列何者最合理？", "options": {"A": "完全不受影響（Noise Immunity）：兩者都以決策樹為基礎，所以都不受標籤雜訊影響", "B": "角色顛倒（Reversed Roles）：Bagging 依序修正前一模型的錯誤而最敏感，Boosting 獨立訓練並以平均降低雜訊影響而最穩定", "C": "雜訊敏感度（Noise Sensitivity）：Boosting 逐輪加重錯誤樣本而追逐誤標，Bagging 各模型獨立較能稀釋", "D": "降低變異（Variance Reduction）：Boosting 的目標是降低變異，誤標造成的高變異正是它的強項"}, "answer": "C", "explanation": "答案 C。Bagging 對資料隨機抽樣、各模型獨立訓練，最後多數決或平均，主要降低變異，個別誤標樣本只影響部分樹，容易被平均掉。Boosting 依序訓練，後面的模型專門修正前面的錯誤，誤標樣本會被反覆加重關注，樹深又多輪時容易把雜訊也學進去。實務上可降低學習率、限制樹深或早停來緩解。", "per_option": {"A": "樹模型同樣會學到錯誤標籤，尤其樹很深時。", "B": "兩者描述顛倒：依序修正前者錯誤的是 Boosting。", "C": "正確：Boosting 逐輪放大難樣本（含誤標）的影響，Bagging 靠獨立抽樣與投票平均稀釋雜訊。", "D": "Boosting 主要降低偏差；用在含雜訊資料時反而更容易過擬合。"}, "guide_ref": "學習指引 p.4-21、4-36～4-37（Bagging 與 Boosting）；對雜訊的敏感度指引未明載，依主流教科書", "hot": false}, {"no": 11, "section": "4.2", "topic_id": "4.2-10", "topic": "邏輯迴歸", "style": "計算", "stem": "某銀行用邏輯迴歸（Logistic Regression）預測貸款違約，其中「信用卡循環利用率」（標準化後）的係數為 β = 0.4，其餘特徵不變。已知 e^0.4 ≈ 1.49。下列對這個係數的解讀，何者最正確？", "options": {"A": "每增加 1 單位，違約機率增加約 0.4（40 個百分點），因為係數代表機率的增量", "B": "每增加 1 單位，違約機率變為原來的 1.5 倍", "C": "每增加 1 單位，違約勝算增加 0.4 倍（變為 1.4 倍）", "D": "每增加 1 單位，違約的勝算（Odds）約變為原來的 1.5 倍"}, "answer": "D", "explanation": "答案 D。邏輯迴歸假設特徵與對數勝率（Log-Odds）呈線性：ln(p/(1−p)) = β₀ + β₁x₁ + …。某特徵增加 1 單位，對數勝率增加 β，亦即勝算乘上 e^β。此處 e^0.4 ≈ 1.49，勝算約變為 1.5 倍。機率本身不是線性變化，所以不能說「機率增加 0.4」或「機率變 1.5 倍」。", "per_option": {"A": "係數不是機率的加法增量，機率與特徵之間不是線性關係。", "B": "e^β 是勝算的倍數，不是機率的倍數，兩者只在機率很小時才近似。", "C": "對數勝率是加 0.4，換算回勝算要取指數相乘 e^0.4，不是加 0.4 倍。", "D": "正確：係數是對數勝率的變化量，勝算倍數為 e^β。"}, "guide_ref": "學習指引 p.4-26～4-28（特徵與對數勝率呈線性）；勝算比 e^β 的換算屬補充", "hot": false, "detail": {"steps": [["① 寫出邏輯迴歸的式子（機率不是直線，對數勝率才是）", "ln( p ÷ (1－p) ) ＝ β₀ ＋ β₁x₁ ＋ …（p÷(1−p) 就是勝算 Odds；ln 取對數後叫對數勝率）", "特徵 x 的係數 β ＝ 0.4"], ["② x 增加 1 單位，對數勝率增加多少", "新對數勝率 － 舊對數勝率 ＝ β", "＝ 0.4"], ["③ 換回「勝算」（兩邊取 e 的次方，加法變乘法）", "新勝算 ÷ 舊勝算 ＝ e^β", "＝ e^0.4 ≈ 1.49 ≈ 1.5 倍"], ["④ 舉例驗證「機率不是 1.5 倍」", "p ＝ 勝算 ÷ (1＋勝算)", "舉例（題目沒給數字）：原本 p＝0.2，勝算＝0.2÷0.8＝0.25；新勝算＝0.25×1.49≈0.373，新 p＝0.373÷1.373≈0.27；0.27÷0.2≈1.36 倍，不是 1.5 倍，也不是加 0.4"]], "tip": "邏輯迴歸係數 β：特徵加 1，「勝算」乘上 e^β；不是機率加 β，也不是機率乘 e^β。"}}, {"no": 12, "section": "4.2", "topic_id": "4.2-11", "topic": "支援向量機 SVM", "style": "否定", "stem": "某團隊評估是否採用支援向量機（Support Vector Machine, SVM）處理分類問題。下列關於 SVM 的敘述，何者錯誤？", "options": {"A": "懲罰參數（Parameter C）：C 很大時對誤分類容忍度低、間隔變窄，較容易過擬合", "B": "訓練規模（Training Scale）：樣本數達數百萬時，核函數 SVM 訓練時間仍線性成長，最適合超大資料", "C": "核函數（Kernel Function）：RBF 等核隱含地映射到高維，讓線性不可分的資料有機會被分隔，此即核技巧", "D": "支援向量（Support Vectors）：決策邊界只由支援向量決定，移除遠離邊界的樣本通常不變"}, "answer": "B", "explanation": "答案 B。SVM 適合中小型資料與高維特徵，但訓練成本會隨樣本數明顯上升（核函數 SVM 的複雜度約介於 O(n²) 到 O(n³)），資料量非常大時並不是首選。C 與 γ 是關鍵超參數；C 大則間隔窄、擬合訓練資料更緊，容易過擬合。決策邊界只取決於支援向量。", "per_option": {"A": "敘述正確，C 越大越強調訓練集分類正確。", "B": "錯誤的敘述：核函數 SVM 的成本隨樣本數快速上升（超線性），大資料是它的弱點。", "C": "敘述正確，這是 SVM 處理非線性問題的方式。", "D": "敘述正確，這是 SVM 邊界的核心性質。"}, "guide_ref": "學習指引 p.4-28～4-30（SVM 的優缺點與參數 C、γ）", "hot": false}, {"no": 13, "section": "4.2", "topic_id": "4.2-16", "topic": "DBSCAN", "style": "情境", "stem": "某連鎖咖啡店用 DBSCAN 依門市座標分群。市區門市很密集（相距常小於 300 公尺），郊區門市很稀疏（相距常在 5 公里以上）。工程師把 Eps 設成 500 公尺時，郊區門市幾乎全被標為噪聲；改設成 6 公里後，市區好幾個獨立商圈又被併成同一大群。造成這種兩難的主因最可能是下列何者？", "options": {"A": "全域單一密度門檻（Global Density Threshold）：整個資料只用一組 Eps 與 MinPts，難以兼顧密度差異大的群集", "B": "球形群集假設（Spherical Cluster Assumption）：DBSCAN 只能處理接近球形的群集，市區與郊區形狀不同，因此難以辨識", "C": "預先指定群數（Preset K）：K 設得不對，才會同時出現大量噪聲與群集過度合併", "D": "低維資料限制（Low-dimension Limitation）：座標屬低維度資料，DBSCAN 在低維空間無法定義密度"}, "answer": "A", "explanation": "答案 A。DBSCAN 以單一的鄰域半徑 Eps 與最少點數 MinPts 定義「密集」。市區密、郊區疏時，小 Eps 讓郊區點因鄰域點數不足被視為噪聲；大 Eps 則把密集區域中本該分開的群集連在一起。這就是它處理密度不均的群集效果較差的原因，可改用 HDBSCAN 或分區域處理等方法。", "per_option": {"A": "正確：密度不均是 DBSCAN 的已知限制。", "B": "DBSCAN 的優點正是能找出任意形狀的群集，限制不在形狀。", "C": "DBSCAN 不需要預先指定群數，兩個參數是 Eps 與 MinPts。", "D": "DBSCAN 在二維座標上最容易定義密度，困難反而出現在高維資料。"}, "guide_ref": "學習指引 p.4-43～4-44（DBSCAN 缺點：對密度不均的群集效果差）", "hot": false}, {"no": 14, "section": "4.2", "topic_id": "4.2-20", "topic": "異常偵測", "style": "情境", "stem": "某工廠用孤立森林（Isolation Forest）對 5,000 筆感測資料找異常，程式碼如下：\n```\nmodel = IsolationForest(contamination=0.02, random_state=0)\nlabels = model.fit_predict(X)   # X 共 5,000 筆\n```\n依 scikit-learn 的慣例，labels 中值為 -1 的資料筆數最接近下列何者？", "options": {"A": "約 10 筆：contamination 是異常分數必須超過的絕對門檻，只有極端者被標記，因此數量極少", "B": "約 4,900 筆：-1 代表正常、1 代表異常，因此多數資料為 -1", "C": "約 100 筆：-1 代表異常，contamination=0.02 即預期 2% 為異常", "D": "筆數無法預估：contamination 只影響森林中樹的數量，與異常筆數無關"}, "answer": "C", "explanation": "答案 C。孤立森林讓異常點因為路徑較短而容易被孤立。scikit-learn 的 contamination 參數指定預期異常比例，模型用它把分數門檻設在訓練資料的對應百分位，因此 fit_predict 後約有 5,000×0.02 = 100 筆被標為 -1（異常），其餘標為 1（正常）。Python 實跑結果為 100 筆。", "per_option": {"A": "contamination 是資料中預期的異常比例，用來決定門檻，不是分數的絕對值。", "B": "慣例相反：-1 是異常（離群），1 才是正常。", "C": "正確：scikit-learn 以 -1 表示異常、1 表示正常。", "D": "樹的數量是 n_estimators；contamination 控制異常的比例門檻。"}, "guide_ref": "學習指引 p.4-50～4-53（孤立森林）；contamination 參數與 -1/1 慣例指引未載，依 scikit-learn 文件", "hot": false, "detail": {"steps": [["① 算預期的異常筆數", "異常筆數 ≈ 資料總筆數 × contamination（預期異常比例）", "＝ 5,000 × 0.02 ＝ 100 筆"], ["② 看標籤代表什麼", "scikit-learn 的 fit_predict：異常＝−1、正常＝1", "−1 的筆數 ≈ 100；其餘 5,000 − 100 ＝ 4,900 筆是 1（正常）"]], "code": [["model = IsolationForest(contamination=0.02, random_state=0)", "建立孤立森林模型。Isolation＝孤立、Forest＝森林：用很多棵隨機切資料的樹，越容易被孤立（路徑越短）的點越可能是異常。contamination＝污染率，即預期資料裡有 2% 是異常，模型用它決定「多極端算異常」的門檻；random_state=0 固定隨機種子，每次結果一樣。"], ["labels = model.fit_predict(X)   # X 共 5,000 筆", "fit_predict＝fit（學習：建樹、定門檻）加 predict（預測）一次做完。回傳每一筆的標籤：−1 代表異常、1 代表正常，存進 labels。# 後面是註解，不會執行。"]], "tip": "IsolationForest：−1＝異常、1＝正常；筆數 ≈ 總筆數 × contamination。"}}, {"no": 15, "section": "4.3", "topic_id": "4.3-02", "topic": "激活函數與輸出層", "style": "計算", "stem": "某三類別影像分類網路的輸出層搭配 Softmax。對某張圖片，輸出層在 Softmax 之前的原始分數（logits）為 [3.0, 1.0, 0.0]。這張圖片被判為第 1 類的機率最接近下列何者？", "options": {"A": "約 0.75：直接以 3 ÷ (3+1+0) 做比例正規化，沒有先取指數函數", "B": "約 0.84：e³ ÷ (e³ + e¹ + e⁰) = 20.09 ÷ 23.80", "C": "約 0.95：只對第 1 個分數單獨套用 Sigmoid，三個機率總和將不等於 1", "D": "約 0.73：誤以 2 為底計算 2³ ÷ (2³ + 2¹ + 2⁰)，而非自然常數 e"}, "answer": "B", "explanation": "答案 B。Softmax(zᵢ) = e^zᵢ ÷ Σe^zⱼ。e³ ≈ 20.09、e¹ ≈ 2.72、e⁰ = 1，總和約 23.80，所以第 1 類機率約 0.844，其餘約 0.114 與 0.042，三者加總為 1。Python 驗算 [0.8438, 0.1142, 0.0420]。Softmax 讓輸出成為互斥類別上的機率分佈。", "per_option": {"A": "Softmax 先取指數 e^z 再正規化，不是對原始分數直接按比例。", "B": "正確：Softmax 對每個分數取指數後，除以所有指數的總和。", "C": "Sigmoid 各自獨立，輸出總和不為 1；多類別單標籤應使用 Softmax。", "D": "Softmax 的底數是自然常數 e，不是 2。"}, "guide_ref": "學習指引 p.4-57～4-58（多類別輸出層搭配 Softmax）；數值計算屬補充", "hot": true, "detail": {"steps": [["① 公式：每個分數先取指數 e^z", "e^zᵢ（e ≈ 2.718，自然常數；指數讓大分數更突出，也保證結果是正數）", "e³ ≈ 20.09；e¹ ≈ 2.72；e⁰ ＝ 1"], ["② 把所有指數加總（分母）", "分母 ＝ Σ e^zⱼ", "＝ 20.09 ＋ 2.72 ＋ 1 ＝ 23.80"], ["③ 算第 1 類的機率", "Softmax(z₁) ＝ e^z₁ ÷ Σ e^zⱼ", "＝ 20.09 ÷ 23.80 ≈ 0.844 ≈ 0.84"], ["④ 驗算其他兩類，三個機率加起來要是 1", "Softmax(zᵢ) ＝ e^zᵢ ÷ Σ e^zⱼ", "第 2 類 2.72÷23.80≈0.114；第 3 類 1÷23.80≈0.042；0.844＋0.114＋0.042 ＝ 1.000"]], "tip": "Softmax＝先取 e 的次方、再除以總和；結果是互斥類別的機率，加起來一定是 1。"}}, {"no": 16, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "情境", "stem": "某團隊要辨識 224×224 的彩色產品影像。最初做法是把影像攤平成一長串數值後直接接全連接層，結果參數量龐大，且產品在畫面中稍微位移就會讓表現下降。改用卷積神經網路（CNN）後，參數量大幅減少，對小幅位移也較穩健。這種效率與效果的提升，主要來自下列哪項設計？", "options": {"A": "移除激活函數（No Activation）：讓每一層只做線性運算，以減少計算量", "B": "旋轉縮放不變性（Rotation Invariance）：CNN 天生對任意旋轉與縮放完全不變", "C": "加深加寬網路（Deeper and Wider）：增加層數與神經元，記住所有位移版本", "D": "權重共享（Weight Sharing）：小型卷積核在整張特徵圖滑動，並重複使用同一組權重"}, "answer": "D", "explanation": "答案 D。全連接層讓每個輸入像素都連到每個神經元，參數量隨影像大小暴增，也不認得「同一個特徵出現在不同位置」。CNN 的卷積核只看局部區域（局部連接），並在整張影像上共用同一組權重（權重共享），所以參數少，又能在畫面任何位置偵測到相同的邊緣或紋理；再配合池化層帶來小幅平移不變性。", "per_option": {"A": "移除激活函數會失去非線性，CNN 在卷積後仍使用 ReLU 等激活函數。", "B": "CNN 並非天生旋轉縮放不變，池化只帶來小幅平移不變性。", "C": "加深加寬只會增加參數，不是參數量減少的原因，也不保證位移穩健。", "D": "正確：局部連接加參數共享是 CNN 參數少、能在不同位置辨認相同特徵的主因。"}, "guide_ref": "學習指引 p.4-67～4-71（卷積層：局部連接與參數共享）", "hot": true}, {"no": 17, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "情境", "stem": "研究人員將一個訓練好的人臉辨識 CNN 各層的卷積核視覺化：第一層的濾波器呈現不同方向的邊緣與色塊，中段的層對應眼睛、鼻子等部件的輪廓，最後幾層則對整張臉的身分敏感。這個觀察最能支持下列哪項關於 CNN 特徵學習的敘述？", "options": {"A": "固定濾波器（Fixed Filters）：各層卷積核由人工設計的邊緣偵測器初始化後凍結，訓練時不更新", "B": "特徵圖放大（Feature Map Growth）：卷積層越深，特徵圖的寬高通常越大、保留更多細節", "C": "階層式特徵學習（Hierarchical Feature Learning）：淺層學邊緣紋理，越深層越組合成高階特徵", "D": "池化組合（Pooling Composition）：池化層會自動把像素組合成眼睛、鼻子等語意部件，卷積核只管邊緣，與層數無關"}, "answer": "C", "explanation": "答案 C。CNN 的卷積核是從資料中學出來的：第一層主要自動提取邊緣、紋理等簡單的局部特徵；後面的層把前一層的特徵再組合，感受野逐步變大，學到部件乃至整體物件這類越來越抽象的特徵。這種由簡單到抽象的層層堆疊，稱為階層式特徵學習。", "per_option": {"A": "卷積核是可學習的參數，第一層學到類似邊緣的濾波器是訓練的結果。", "B": "常見做法是越深層特徵圖越小（透過步幅與池化），語意更抽象。", "C": "正確：層層組合，由簡單到抽象。", "D": "池化只做降採樣，語意部件的組合是由後續各層卷積核學出來的。"}, "guide_ref": "學習指引 p.4-67～4-71（第一層提取邊緣紋理，後層更抽象）", "hot": true}, {"no": 18, "section": "4.3", "topic_id": "4.3-08", "topic": "ResNet", "style": "情境", "stem": "有人說 Transformer 能堆疊到數十層，是因為每個子層（自注意力、前饋網路）外面都包著「輸入加上子層輸出，再做層歸一化」的結構。關於其中「輸入加上子層輸出」這一步，下列說明何者最恰當？", "options": {"A": "殘差連接（Residual Connection）：提供讓梯度可以直接回傳的捷徑，使深層堆疊更容易訓練", "B": "位置編碼（Positional Encoding）：把序列順序的資訊加進每個詞的表示，讓模型分得出前後", "C": "遮罩（Masking）：把未來位置的注意力分數設為負無限大，避免模型看到答案", "D": "多頭拼接（Multi-head Concatenation）：把各個注意力頭的輸出串起來，還原成原本的維度"}, "answer": "A", "explanation": "答案 A。Transformer 的每個子層都採「Add & Norm」：輸出 = LayerNorm(x + Sublayer(x))。其中 x + Sublayer(x) 就是殘差連接（跳躍連接），梯度可沿捷徑直接傳回前面的層，減輕深層網路的梯度消失與退化，搭配層歸一化使數十層的堆疊仍可穩定訓練。", "per_option": {"A": "正確：輸出 = 輸入 + 子層(輸入)，梯度可沿捷徑直達前面的層。", "B": "位置編碼只加在輸入嵌入，不是每個子層外的加法結構。", "C": "遮罩作用在注意力分數上，不是把輸入加到輸出上。", "D": "多頭拼接是把各頭輸出串接，並非輸入與輸出的逐元素相加。"}, "guide_ref": "學習指引 p.4-71～4-72、4-81（Transformer 子層採殘差連接加層歸一化）", "hot": true}, {"no": 19, "section": "4.3", "topic_id": "4.3-09", "topic": "RNN 與 LSTM", "style": "情境", "stem": "某物流公司的資料團隊在評估四項專案適合的模型。若要把 LSTM（長短期記憶網路）用在其中「資料具有時間先後順序、需要記住較遠過去資訊」的一項專案，最適合的是下列哪一項？", "options": {"A": "依倉庫攝影機的單張畫面，判斷貨架上有無破損的包裹", "B": "依過去兩年每小時冷鏈溫度紀錄，預測未來 24 小時溫度走勢", "C": "依問卷作答內容，把受訪者自動分成幾種消費族群", "D": "把 128 維的感測器數值壓縮成 8 維，以便儲存與傳輸使用"}, "answer": "B", "explanation": "答案 B。RNN／LSTM 專為有順序的資料設計，隱藏狀態會傳遞過去的資訊；LSTM 用輸入門、遺忘門、輸出門與細胞狀態緩解梯度消失，擅長捕捉長期依賴，典型應用是時間序列預測（用電量、溫度、股價）。單張影像辨識用 CNN，分群用聚類演算法，壓縮資料用降維或自編碼器。", "per_option": {"A": "單張影像的物件辨識屬 CNN 的強項，沒有時間順序。", "B": "正確：時間序列預測，需要記住較早的資訊，是 LSTM 的典型應用。", "C": "沒有標籤的分群屬非監督式的聚類，不涉及序列。", "D": "降維或壓縮可用 PCA、自編碼器，不是序列預測。"}, "guide_ref": "學習指引 p.4-72～4-76（RNN、LSTM 與時間序列應用）", "hot": false}, {"no": 20, "section": "4.3", "topic_id": "4.3-12", "topic": "注意力機制", "style": "情境", "stem": "某客服中心要自動判斷每則顧客留言的情緒（正面、中性、負面）。留言中常有「這次的服務不是不好」這類必須同時參考前後文才能理解的句子。團隊想選用以 Transformer 為基礎的預訓練模型。下列何者最適當？", "options": {"A": "GPT（Generative Pre-trained Transformer）：僅用解碼器，由左而右逐字自迴歸，擅長續寫與生成文字內容", "B": "簡單循環神經網路（Simple RNN）：逐時間步處理序列，只靠隱藏狀態傳遞過去資訊，長距離依賴能力有限，訓練時易梯度消失", "C": "完整編碼器–解碼器 Transformer（如機器翻譯模型）：同時含編碼器與解碼器，專為把一段序列轉成另一段序列的任務而設計", "D": "BERT（Bidirectional Encoder Representations from Transformers）：僅用編碼器、雙向理解，擅長句子分類等理解類任務"}, "answer": "D", "explanation": "答案 D。BERT 只用 Transformer 的編碼器，並以雙向方式同時參考左右上下文，擅長句子分類、情緒分析等理解類任務。GPT 只用解碼器、單向自迴歸，擅長續寫與生成。完整的編碼器–解碼器結構則用於翻譯、摘要這類「序列轉序列」任務。", "per_option": {"A": "GPT 為單向生成，不是題目要求的雙向編碼理解。", "B": "不是 Transformer，也不能直接雙向看到右側上下文，長依賴能力有限。", "C": "題目是分類理解，只需編碼器；完整編碼器–解碼器是為序列轉換任務設計。", "D": "正確：編碼器、雙向，適合理解類任務如情緒分類。"}, "guide_ref": "學習指引 p.4-76～4-83（BERT 為編碼器、雙向理解；GPT 為解碼器、單向生成）", "hot": true}, {"no": 21, "section": "4.3", "topic_id": "4.3-19", "topic": "程式碼閱讀：深度學習", "style": "情境", "stem": "某工程師以 PyTorch 建立小型 CNN，並用假資料測試形狀，程式碼如下：\n```\nmodel = nn.Sequential(\n    nn.Conv2d(3, 16, kernel_size=3, padding=1),\n    nn.ReLU(),\n    nn.MaxPool2d(2),\n    nn.Flatten(),\n    nn.Linear(16 * 32 * 32, 10)\n)\nx = torch.randn(8, 3, 32, 32)\nout = model(x)\n```\n執行這段程式碼時，最可能發生下列何種結果？", "options": {"A": "順利執行，out 的形狀為 (8, 10)，每筆資料對應 10 個類別的分數", "B": "RuntimeError：Flatten 後長度 4096 與 Linear 預期的 16384 不符，矩陣無法相乘", "C": "順利執行，out 的形狀為 (8, 4096)，因為 Linear 會依實際輸入自動調整輸入維度", "D": "ValueError：kernel_size=3 搭配 padding=1 會使輸出尺寸變成負數而無法計算，因此在卷積層就會報錯"}, "answer": "B", "explanation": "答案 B。Conv2d(3, 16, 3, padding=1) 保持寬高為 32×32、通道變 16；MaxPool2d(2) 把寬高減半為 16×16；Flatten 後每筆長度 = 16×16×16 = 4096。但 Linear 宣告的 in_features 是 16×32×32 = 16384（忘了池化已減半），矩陣乘法形狀 (8×4096) 與 (16384×10) 不符，PyTorch 會丟出 RuntimeError。修正為 nn.Linear(16 * 16 * 16, 10)。", "per_option": {"A": "只有當 Linear 的輸入維度為 4096 時才會得到 (8, 10)。", "B": "正確：池化把寬高減半，Linear 的輸入維度卻仍按 32×32 計算。", "C": "Linear 的 in_features 是固定的，不會自動調整。", "D": "3×3 卷積搭配 padding=1 會保持寬高不變，不會出錯。"}, "guide_ref": "學習指引未載（程式碼閱讀題，依 PyTorch 文件與 10/27 分享筆記）", "hot": false, "detail": {"steps": [["① 卷積層輸出的寬高", "輸出邊長 ＝ (輸入邊長 ＋ 2×padding － kernel) ÷ stride ＋ 1（stride 沒寫就是 1）", "＝ (32 ＋ 2×1 － 3) ÷ 1 ＋ 1 ＝ 31 ＋ 1 ＝ 32；通道數變成 16 → 形狀 (16, 32, 32)"], ["② 池化後的寬高", "MaxPool2d(2)：寬、高各除以 2", "＝ 32 ÷ 2 ＝ 16 → 形狀 (16, 16, 16)"], ["③ Flatten 後每筆資料的長度", "長度 ＝ 通道 × 高 × 寬", "＝ 16 × 16 × 16 ＝ 4,096"], ["④ Linear 宣告的輸入長度", "in_features ＝ 程式裡寫的 16 * 32 * 32", "＝ 16 × 32 × 32 ＝ 16,384"], ["⑤ 比對", "Linear 要求輸入長度 ＝ in_features，兩者必須相等才能矩陣相乘", "實際 4,096 ≠ 預期 16,384 → RuntimeError；修正為 nn.Linear(16 * 16 * 16, 10)"]], "code": [["model = nn.Sequential(", "建立模型。nn＝neural network（神經網路）模組；Sequential＝依序的，括號裡的每一層會「照順序」一層接一層處理資料。"], ["nn.Conv2d(3, 16, kernel_size=3, padding=1),", "卷積層。Conv＝convolution（卷積：用小窗口掃過圖片找特徵）；2d＝處理二維圖片。3＝輸入有 3 個通道（RGB）；16＝輸出 16 個通道（16 種特徵）；kernel_size=3＝窗口 3×3；padding=1＝圖片四周補一圈 0，所以寬高不會縮小，仍是 32×32。"], ["nn.ReLU(),", "激活函數。ReLU（Rectified Linear Unit）：負數變 0、正數不變，讓網路能學非線性關係。不改變形狀。"], ["nn.MaxPool2d(2)", "最大池化。Max＝取最大值；Pool＝把一小塊合併成一個；2＝每 2×2 的小塊只留最大的一個，所以寬高減半：32×32 變 16×16。"], ["nn.Flatten(),", "Flatten＝攤平。把 (16, 16, 16) 的立體資料拉成一條長度 4,096 的向量，才能餵給 Linear。"], ["nn.Linear(16 * 32 * 32, 10)", "全連接層。Linear＝線性（輸入 × 權重 ＋ 偏差）。第一個數字是「輸入長度」in_features，這裡寫 16×32×32＝16,384（忘了池化已經減半，應為 16×16×16＝4,096）；10＝輸出 10 個類別的分數。"], ["x = torch.randn(8, 3, 32, 32)", "做假資料。torch＝PyTorch 套件；randn＝random normal（從標準常態分佈隨機抽數字）。形狀 (8, 3, 32, 32)＝8 張圖、3 個通道、高 32、寬 32。"], ["out = model(x)", "把 x 丟進模型，依序走完每一層，結果存在 out。執行到 Linear 時發現長度對不上，就在這行丟出 RuntimeError。"]], "tip": "算 CNN 形狀要一層一層追：卷積 padding=1 不縮、池化 2 減半；Flatten 後長度＝通道×高×寬。"}}, {"no": 22, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "情境", "stem": "某金融團隊發現客戶「年度交易金額」嚴重右偏（少數大戶金額極高）。工程師對該欄位套用 StandardScaler 後畫出直方圖，仍是同樣的右偏長尾，只是橫軸變成平均 0、標準差 1 的尺度。下列對此現象的說明，何者最正確？", "options": {"A": "實作錯誤（Implementation Error）：StandardScaler 有誤，標準化應同時把右偏分佈變成對稱的常態分佈，才算正確完成", "B": "資料洩漏（Data Leakage）：fit 時用到測試集統計量，改成只用訓練集計算即可消除右偏", "C": "線性轉換（Linear Transformation）：標準化只改平均與尺度，不改形狀；降低偏態須用 Log、Box-Cox 等非線性轉換", "D": "Z-score 標準化（Z-score Standardization）：把資料壓縮到 0 到 1 之間，所以長尾被完整保留"}, "answer": "C", "explanation": "答案 C。Z-score 公式 (x−μ)/σ 是線性轉換，只平移並縮放，偏態（skewness）完全不變；Python 驗算 lognormal 資料標準化前後偏態皆為 7.10，取 log 後降為 0.07。要減輕右偏應使用 Log、平方根、Box-Cox 或 Yeo-Johnson 等非線性轉換。", "per_option": {"A": "標準化並不承諾改變分佈形狀，偏態維持不變是正常的。", "B": "只用訓練集 fit 是為了避免資料洩漏，與偏態無關。", "C": "正確：線性縮放不改變偏態，需要非線性轉換。", "D": "壓縮到 0～1 是 Min-Max；Z-score 轉成平均 0、標準差 1，並不限制在 0～1。"}, "guide_ref": "學習指引 p.5-6～5-8（縮放方法與右偏資料的 Log 轉換）", "hot": true}, {"no": 23, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "計算", "stem": "某特徵在訓練集的中位數為 50、第一四分位數 Q1 為 40、第三四分位數 Q3 為 70。工程師使用 RobustScaler（預設以中位數置中，再除以四分位距 IQR）縮放，則原始值 95 轉換後最接近下列何者？", "options": {"A": "1.5：(95 − 50) ÷ (70 − 40)", "B": "約 1.83：(95 − 40) ÷ (70 − 40)，以 Q1 置中", "C": "約 0.64：(95 − 50) ÷ 70，除以 Q3", "D": "2.25：(95 − 50) ÷ (70 − 50)，除以 Q3 減中位數"}, "answer": "A", "explanation": "答案 A。RobustScaler 的公式為 (x − 中位數) ÷ IQR，IQR = Q3 − Q1 = 70 − 40 = 30。所以 (95 − 50) ÷ 30 = 1.5。因為使用中位數與四分位距，極端值對縮放參數影響小，適合含離群值的資料。", "per_option": {"A": "正確：先減中位數，再除以 IQR = Q3 − Q1 = 30。", "B": "RobustScaler 置中用的是中位數。", "C": "分母是四分位距 Q3 − Q1，不是 Q3 本身。", "D": "IQR 是 Q3 − Q1 = 30，不是 Q3 − 中位數。"}, "guide_ref": "學習指引 p.5-6～5-8（Robust 縮放用中位數與 IQR）", "hot": true, "detail": {"steps": [["① 算四分位距 IQR", "IQR ＝ Q3 － Q1（中間 50% 資料的寬度）", "＝ 70 － 40 ＝ 30"], ["② 套 RobustScaler 公式", "x' ＝ (x － 中位數) ÷ IQR", "＝ (95 － 50) ÷ 30 ＝ 45 ÷ 30 ＝ 1.5"]], "tip": "RobustScaler＝（x－中位數）÷（Q3－Q1）；用中位數和四分位距，不怕離群值。"}}, {"no": 24, "section": "5.1", "topic_id": "5.1-02", "topic": "PCA 與降維", "style": "情境", "stem": "資料科學家對 20 個已標準化、彼此幾乎不相關（相關係數接近 0）的感測器特徵做 PCA，原本期待降到 5 維左右，結果發現要保留 18 個主成分才能達到 90% 的累積解釋變異。下列何者最能解釋這個結果？", "options": {"A": "監督式限制（Supervised Requirement）：PCA 是監督式方法，因為沒有提供標籤而降維失敗", "B": "標準化副作用（Standardization Side Effect）：標準化破壞特徵間原本的變異結構，應改用原始資料", "C": "樣本數過多（Too Many Samples）：樣本太多使特徵值被稀釋，減少樣本就能減少需保留的主成分", "D": "特徵冗餘（Feature Redundancy）：PCA 的壓縮來自特徵間的相關；近乎獨立時變異平均分散，無法集中"}, "answer": "D", "explanation": "答案 D。PCA 找的是變異最大的方向，能壓縮是因為許多特徵彼此相關、帶有重複資訊。若 20 個標準化特徵彼此獨立，共變異數矩陣近似單位矩陣，特徵值都約為 1，每個主成分各解釋約 1/20 的變異，累積到 90% 需要約 18 個。Python 模擬 20 個獨立標準常態特徵，也需 18 個主成分。", "per_option": {"A": "PCA 本來就是無監督的，不需要也不使用標籤。", "B": "標準化不會讓獨立特徵變得相關；問題在特徵本身缺乏冗餘。", "C": "特徵值反映特徵間結構，與樣本數多寡無關。", "D": "正確：特徵越不相關，主成分的特徵值越平均，越難壓縮。"}, "guide_ref": "學習指引 p.5-6、3-13～3-15（PCA 找變異最大方向、累積解釋變異）；獨立特徵的情形屬補充", "hot": true}, {"no": 25, "section": "5.1", "topic_id": "5.1-02", "topic": "PCA 與降維", "style": "情境", "stem": "某新聞平台把數萬篇文章轉成稀疏的 TF-IDF 詞–文件矩陣（維度很高，絕大多數元素為 0），想壓縮成約 100 個潛在語意維度，並希望直接對稀疏矩陣做矩陣分解，不先做會讓矩陣變稠密的平均置中。下列方法何者最適當？", "options": {"A": "線性判別分析（LDA）：需要類別標籤，找出最能分開各類別的投影方向", "B": "t-SNE：非線性降維，保留局部鄰域結構，主要用於二維視覺化", "C": "截斷奇異值分解（Truncated SVD／LSA）：直接對稀疏矩陣做奇異值分解，保留前 k 個方向", "D": "標準 PCA（Principal Component Analysis）：先對每個特徵減去平均再分解，置中後矩陣變稠密"}, "answer": "C", "explanation": "答案 C。奇異值分解（SVD）把矩陣分解成奇異向量與奇異值，只保留前 k 個即得到低維表示，不需要平均置中，因此可以直接用在稀疏的詞–文件矩陣，這個應用稱為潛在語意分析（LSA），也常用於推薦系統。LDA 需標籤；t-SNE 偏視覺化；標準 PCA 要置中。", "per_option": {"A": "LDA 需要類別標籤，是有監督的降維，且題目沒有標籤。", "B": "t-SNE 主要用於視覺化探索，不適合作為壓縮成 100 維供後續使用的穩定輸入。", "C": "正確：SVD 適用於矩陣分解，常用於文字分析與推薦系統，可直接作用於稀疏矩陣。", "D": "需要平均置中，置中後稀疏矩陣會變稠密，與題目的限制衝突。"}, "guide_ref": "學習指引 p.5-6、3-13～3-15（SVD 用於矩陣分解、文字分析與推薦系統）", "hot": true}, {"no": 26, "section": "5.1", "topic_id": "5.1-09", "topic": "程式碼閱讀：前處理", "style": "情境", "stem": "某工程師要把類別特徵 color 轉成 One-hot 欄位，程式碼如下：\n```\ntrain = pd.DataFrame({'color': ['red', 'blue', 'green']})\ntest = pd.DataFrame({'color': ['red', 'blue']})\nX_train = pd.get_dummies(train['color'])\nX_test = pd.get_dummies(test['color'])\nprint(X_train.shape, X_test.shape)\n```\n下列對輸出結果與後續影響的敘述，何者正確？", "options": {"A": "(3, 3) (2, 2)；欄位不一致，預測時特徵數不符，應改用在訓練集 fit 的 OneHotEncoder", "B": "(3, 3) (2, 3)；get_dummies 會自動對齊訓練集中出現過的類別", "C": "(3, 2) (2, 2)；get_dummies 預設會刪除第一個類別欄位（drop_first=True），所以兩者欄位剛好一致", "D": "(3, 3) (2, 2)；欄位數不同不影響預測，模型會自動為缺少的欄位補 0"}, "answer": "A", "explanation": "答案 A。get_dummies 只看傳入資料裡實際出現的類別：訓練集有 red、blue、green 三類，得到 3 欄；測試集只有 red、blue，只得到 2 欄，形狀為 (3, 3) 與 (2, 2)。欄位對不起來會讓模型在預測時特徵數不符。正確做法是用 OneHotEncoder 在訓練集 fit，再對測試集 transform，並設定 handle_unknown='ignore' 處理沒出現過的類別。Python 實跑確認 (3, 3) (2, 2)。", "per_option": {"A": "正確：get_dummies 只依各自資料出現的類別建立欄位。", "B": "get_dummies 不會記住訓練集的類別，測試集只有 2 個類別就只產生 2 欄。", "C": "drop_first 的預設值是 False，不會預設刪欄。", "D": "模型不會自動補欄位，特徵數或欄位順序不符通常直接出錯或預測錯位。"}, "guide_ref": "學習指引未載（程式碼閱讀題，依 pandas／scikit-learn 文件與 10/27 分享筆記）", "hot": false, "detail": {"steps": [["① 訓練集會產生幾個欄位", "get_dummies 欄位數 ＝ 「這份資料裡實際出現」的不同類別數", "train 的 color 有 red、blue、green 3 種 → 3 欄；3 筆資料 → 形狀 (3, 3)"], ["② 測試集會產生幾個欄位", "同上，只看測試集自己", "test 的 color 只有 red、blue 2 種 → 2 欄；2 筆資料 → 形狀 (2, 2)"], ["③ 比對", "訓練欄位數 ＝ 測試欄位數 才能餵給同一個模型", "3 ≠ 2，欄位對不起來，缺了 green 欄 → 應改用 OneHotEncoder 在訓練集 fit、測試集只 transform"]], "code": [["train = pd.DataFrame({'color': ['red', 'blue', 'green']})", "建立訓練資料表。pd＝pandas（資料表工具包）；DataFrame＝資料框（像 Excel 的表格）。用字典建立：欄位名稱 color，裡面 3 筆資料：red、blue、green。"], ["test = pd.DataFrame({'color': ['red', 'blue']})", "建立測試資料表，一樣的欄位名稱 color，但只有 2 筆：red、blue（沒有 green）。"], ["X_train = pd.get_dummies(train['color'])", "get_dummies＝取得「虛擬變數」（dummy variable，用 0/1 表示是不是這個類別）；這就是 One-hot 編碼。train['color'] 取出 color 那一欄。結果每個出現過的類別各一欄：red、blue、green 共 3 欄。"], ["X_test = pd.get_dummies(test['color'])", "對測試資料做同樣的事，但它只看得到 red、blue，所以只產生 2 欄。get_dummies 不會記住訓練集有哪些類別。"], ["print(X_train.shape, X_test.shape)", "shape＝形狀（幾列, 幾欄）。印出 (3, 3) (2, 2)。print＝印出結果。"]], "tip": "get_dummies 不會記住訓練集的類別；要用 OneHotEncoder：訓練集 fit、測試集只 transform。"}}, {"no": 27, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "情境", "stem": "某銀行用 LIME 解釋一位被拒貸客戶的模型預測。風控人員對同一筆資料、同一個已訓練好的模型連續執行兩次 LIME，發現解釋中前幾名特徵的權重與排序略有不同。下列何者最可能是原因，且最合理的處置為何？", "options": {"A": "線上更新（Online Update）：模型參數在兩次解釋之間被自動更新，應停止線上學習功能", "B": "全域重要性（Global Importance）：LIME 計算全域特徵重要性，每次隨機看到部分訓練資料", "C": "預測不穩定（Unstable Prediction）：模型本身的預測不穩定，必須重新訓練才能得到一致解釋，無法靠固定種子解決", "D": "擾動取樣隨機性（Random Perturbation）：LIME 隨機產生擾動樣本，故結果略異；可固定種子"}, "answer": "D", "explanation": "答案 D。LIME（Local Interpretable Model-agnostic Explanations）在單筆資料附近隨機擾動特徵，取得黑盒模型的預測後，擬合一個簡單的線性模型來近似該區域，用其係數當作解釋。因為擾動樣本是隨機產生的，每次執行結果會略有差異。固定隨機種子、增加擾動樣本數可提升穩定性；相較之下 SHAP 以 Shapley 值計算，理論上有一致的可加性。", "per_option": {"A": "題目已說明是同一個已訓練好的模型，參數沒有改變。", "B": "LIME 是對單筆資料附近做局部近似，屬局部解釋，不是全域重要性。", "C": "同一筆資料的模型預測並未改變；差異來自解釋方法的取樣隨機性。", "D": "正確：LIME 的解釋依賴隨機擾動取樣。"}, "guide_ref": "學習指引 p.5-14～5-15（SHAP、LIME 等事後解釋工具）；LIME 的隨機性依官方文件", "hot": true}, {"no": 28, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "否定", "stem": "某電商用 SHAP 解釋銷量預測模型，發現「廣告曝光次數」對預測的貢獻值很大。下列對事後解釋工具（SHAP、LIME、偏依圖 PDP）的敘述，何者錯誤？", "options": {"A": "SHAP（Shapley Additive Explanations）：可拆解單筆預測的各特徵貢獻，也能彙總成全域重要性", "B": "SHAP 的因果解讀（Causal Reading）：貢獻大代表增加曝光次數就必然使現實中的銷量上升", "C": "LIME（Local Interpretable Model-agnostic Explanations）：在單筆資料附近用簡單模型近似，屬局部解釋", "D": "偏依圖（Partial Dependence Plot）：呈現某特徵與模型預測的平均關係，屬全域解釋"}, "answer": "B", "explanation": "答案 B。SHAP、LIME、PDP 都是在解釋「模型」如何做出預測，而不是在揭露真實世界的因果機制。特徵貢獻大代表模型很依賴它，可能只是它與銷量相關（例如旺季才大量投放廣告）。要判斷增加曝光是否真的能提升銷量，需要實驗設計（如 A/B 測試）或因果推論方法。", "per_option": {"A": "敘述正確，SHAP 兼具局部與全域解釋。", "B": "錯誤的敘述：SHAP 解釋的是模型為何如此預測，反映相關與模型行為，不能直接視為因果。", "C": "敘述正確，這就是 LIME 的運作方式。", "D": "敘述正確，PDP 看的是特徵與輸出的整體關係。"}, "guide_ref": "學習指引 p.5-14～5-15（事後解釋工具）；解釋不等於因果屬補充", "hot": true}, {"no": 29, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "情境", "stem": "某診所只有 300 筆珍貴的標註資料，無法再額外留出獨立測試集。團隊想用網格搜尋（GridSearchCV）調整超參數，同時希望對最終流程的泛化表現給出盡量不偏樂觀的估計。下列做法何者最適當？", "options": {"A": "最佳分數（best_score_）：直接報告網格搜尋找到的最高交叉驗證分數作為泛化表現", "B": "留一法（LOOCV）：折數提高到 300，挑分數最高的超參數並報告該最高分", "C": "巢狀交叉驗證（Nested CV）：內層選超參數，外層只負責評估整個調參流程的表現", "D": "重複驗證（Re-validation）：用全部資料選出最佳超參數後，在同份資料再做 5 折並報告"}, "answer": "C", "explanation": "答案 C。同一份交叉驗證分數若既用來挑超參數、又拿來報告，會因「從很多組合中挑最高分」而偏樂觀。沒有額外測試集時，可用巢狀交叉驗證：外層切出驗證折，內層只在外層的訓練折上做網格搜尋與交叉驗證，外層的分數才是對「整個調參流程」的較不偏估計。代價是訓練次數大幅增加。", "per_option": {"A": "best_score_ 是從許多組合中挑出的最高分，已被用來選參數，通常偏樂觀。", "B": "仍是用同一份驗證結果同時選參數與報告分數，選擇偏差依然存在。", "C": "正確：評估用的資料沒有參與過選參數，估計較不偏樂觀。", "D": "資料已經影響過超參數的選擇，再用同一份資料評估仍會高估。"}, "guide_ref": "學習指引 p.5-17～5-18、5-26～5-29（交叉驗證）；巢狀交叉驗證指引未載", "hot": true}, {"no": 30, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "計算", "stem": "某篩檢模型對 1,000 位受檢者的結果如下：實際有病者 50 人，其中 45 人被判為陽性；實際無病者 950 人，其中 50 人被誤判為陽性。下列關於此模型敏感度（Sensitivity）與特異度（Specificity）的計算，何者正確？", "options": {"A": "敏感度 0.90、特異度約 0.95：45÷(45+5)；900÷(900+50)", "B": "敏感度約 0.47、特異度約 0.95：敏感度 = 45÷(45+50)，分母採用所有預測為陽性者", "C": "敏感度 0.90、特異度約 0.05：特異度 = 50÷(50+900)", "D": "敏感度約 0.95、特異度 0.90：把兩者的定義對調"}, "answer": "A", "explanation": "答案 A。混淆矩陣：TP = 45、FN = 50−45 = 5、FP = 50、TN = 950−50 = 900。敏感度（Sensitivity，等同召回率）= TP÷(TP+FN) = 45÷50 = 0.90；特異度（Specificity）= TN÷(TN+FP) = 900÷950 ≈ 0.947；假陽性率 = 1 − 特異度 ≈ 0.053；精確率 = 45÷95 ≈ 0.474。Python 驗算相符。", "per_option": {"A": "正確：敏感度即召回率（有病者中被抓到的比例），特異度是無病者中被正確判為陰性的比例。", "B": "45÷(45+50) 是精確率（陽性預測中的正確比例），不是敏感度。", "C": "50÷(50+900) 是假陽性率（1−特異度），不是特異度。", "D": "敏感度看有病者、特異度看無病者，不能對調。"}, "guide_ref": "學習指引 p.5-20～5-22（混淆矩陣與召回率）；敏感度、特異度名稱為醫療常用說法", "hot": true, "detail": {"steps": [["① 整理混淆矩陣的四格", "TP＝有病且判陽性；FN＝有病卻判陰性＝有病總數 − TP；FP＝無病卻判陽性；TN＝無病且判陰性＝無病總數 − FP", "TP ＝ 45；FN ＝ 50 − 45 ＝ 5；FP ＝ 50；TN ＝ 950 − 50 ＝ 900"], ["② 算敏感度（Sensitivity，等同召回率：有病的人抓到幾成）", "敏感度 ＝ TP ÷ (TP ＋ FN)", "＝ 45 ÷ (45 ＋ 5) ＝ 45 ÷ 50 ＝ 0.90"], ["③ 算特異度（Specificity：沒病的人正確放行幾成）", "特異度 ＝ TN ÷ (TN ＋ FP)", "＝ 900 ÷ (900 ＋ 50) ＝ 900 ÷ 950 ≈ 0.947 ≈ 0.95"], ["④ 對照選項的陷阱：精確率", "精確率 ＝ TP ÷ (TP ＋ FP)（判陽性的人裡真的有病幾成）", "＝ 45 ÷ (45 ＋ 50) ＝ 45 ÷ 95 ≈ 0.47（B 選項把它當成敏感度）"]], "cm": {"pos": "有病", "neg": "無病", "tp": 45, "fp": 50, "fn": 5, "tn": 900}, "tip": "敏感度看「有病的人」（分母 TP＋FN）；特異度看「沒病的人」（分母 TN＋FP）。"}}, {"no": 31, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "情境", "stem": "某實習生用兩個模型做欺詐偵測，評估後回報其中一個模型的 ROC-AUC 為 0.28。主管要求他說明這個數字的意義。下列說明何者最合理？", "options": {"A": "無需處理（No Action）：只要 AUC 不等於 0.5 就代表模型有用，0.28 可直接依原分數上線", "B": "計算錯誤（Calculation Error）：ROC-AUC 一定介於 0.5 與 1，0.28 只可能是程式算錯", "C": "準確率（Accuracy）：AUC = 0.28 代表 28% 的預測正確，等同準確率 28%", "D": "排序方向反轉（Inverted Ranking）：分數或標籤方向弄反，比隨機更差；修正後 AUC 約 0.72"}, "answer": "D", "explanation": "答案 D。ROC-AUC 是隨機抽一個正類與一個負類時，模型給正類較高分數的機率；0.5 等於隨機猜測。AUC 為 0.28 表示排序方向系統性相反，把分數反向（或檢查正類標籤是否被編碼顛倒）後 AUC = 1 − 0.28 = 0.72。這與準確率不同，更不是「28% 預測正確」。", "per_option": {"A": "0.28 表示以原分數排序時正類反而排在負類之後（比隨機更差）；雖然反向後等同 0.72，但未修正方向就上線，會把詐欺判成正常、正常判成詐欺，必須檢查標籤或分數方向。", "B": "理論上 AUC 可低於 0.5，代表排序方向反了，並非數值不可能出現。", "C": "AUC 是模型把正類排在負類之前的機率，不是準確率。", "D": "正確：把預測分數反向，AUC 變為 1 − 0.28 = 0.72。"}, "guide_ref": "學習指引 p.5-20～5-22（ROC-AUC 與分類評估）；AUC<0.5 的解讀屬補充", "hot": true}, {"no": 32, "section": "5.3", "topic_id": "5.3-03", "topic": "學習曲線判讀", "style": "否定", "stem": "某工程師訓練一個含 Dropout 的神經網路，在前幾個 epoch 的紀錄中發現驗證損失（val_loss）低於訓練損失（loss）。下列對這個現象的解讀，何者不正確？", "options": {"A": "Dropout 效應（Dropout Effect）：Dropout 與正則化項只在訓練階段啟用，使訓練損失偏高", "B": "過擬合（Overfitting）：驗證損失低於訓練損失，代表模型一定嚴重過擬合", "C": "滾動平均（Running Average）：訓練損失是 epoch 內逐批的平均，含較差的早期權重", "D": "資料切分（Data Split）：驗證集可能剛好比訓練集更容易或樣本較少，使驗證損失偏低"}, "answer": "B", "explanation": "答案 B。過擬合是訓練損失持續下降、驗證損失停滯或回升，兩者落差擴大。早期驗證損失低於訓練損失並不代表過擬合，常見原因包括：Dropout／正則化只在訓練時啟用、訓練損失為 epoch 內的滾動平均（含較差的早期權重）、驗證集本身較易。判讀學習曲線要看差距與走向，不能只憑單點大小關係下結論。", "per_option": {"A": "解讀正確，這是常見原因之一。", "B": "不正確的解讀：過擬合的典型徵兆是訓練表現好、驗證表現差，剛好相反。", "C": "解讀正確，兩者計算時機不同。", "D": "解讀正確，資料切分的偶然性也會造成這個現象。"}, "guide_ref": "學習指引 p.5-19～5-20（學習曲線判讀）；成因說明屬補充", "hot": true}, {"no": 33, "section": "5.3", "topic_id": "5.3-04", "topic": "殘差分析", "style": "情境", "stem": "某分析師建立房價的多元線性迴歸，想報告預測區間，因此要檢驗殘差是否近似常態分佈。下列哪一種診斷圖最能直接回答這個問題？", "options": {"A": "殘差對預測值圖（Residual vs. Fitted Plot）：檢視是否漏掉非線性關係，以及殘差的變異數是否一致", "B": "學習曲線（Learning Curve）：觀察訓練與驗證表現隨樣本數或訓練輪數的變化", "C": "Q-Q 圖（Quantile-Quantile Plot）：對照殘差分位數與理論常態分位數，點落在 45 度線上即近似常態", "D": "自相關圖（ACF Plot）：檢視殘差在不同時間延遲下是否彼此相關"}, "answer": "C", "explanation": "答案 C。殘差分佈是否近似常態，最直觀的檢查是 Q-Q 圖：橫軸為理論常態分位數、縱軸為殘差的樣本分位數，點大致沿 45 度線排列即近似常態，兩端明顯彎離則表示尾部較厚或偏斜。殘差對預測值圖看的是非線性與等變異；ACF 看自相關；學習曲線看過擬合。", "per_option": {"A": "它診斷非線性與等變異，不是直接檢驗常態性。", "B": "它用來診斷過擬合與欠擬合，與殘差的分佈無關。", "C": "正確：Q-Q 圖專門用來檢驗資料是否符合某個理論分佈。", "D": "它檢查殘差的自相關，不是檢查分佈是否常態。"}, "guide_ref": "學習指引 p.5-24（殘差分析）與統計描述中的 QQ-plot；Q-Q 圖判讀屬補充", "hot": true}, {"no": 34, "section": "5.3", "topic_id": "5.3-05", "topic": "迴歸評估指標", "style": "情境", "stem": "實習生用同一組驗證資料評估迴歸模型，報告寫著：MAE = 5.1、RMSE = 4.2。主管看完後認為這組數字有問題。下列說明何者最合理？", "options": {"A": "計算錯誤（Calculation Error）：RMSE 恆大於等於 MAE，RMSE 較小不可能發生", "B": "離群值效應（Outlier Effect）：誤差沒有離群值時 RMSE 會小於 MAE，屬於正常現象，因為平方會縮小誤差", "C": "單位效應（Unit Effect）：RMSE 開根號後數值通常比 MAE 小，屬正常現象", "D": "欠擬合（Underfitting）：模型欠擬合時，MAE 會高於 RMSE"}, "answer": "A", "explanation": "答案 A。MAE = 平均|e|；RMSE = √(平均 e²)。由平方平均數不小於算術平均數可知 RMSE ≥ MAE，只有在所有誤差的絕對值完全相同時才相等；誤差分佈越不均（有離群值）時，RMSE 比 MAE 大得越多。因此 MAE = 5.1、RMSE = 4.2 必有計算錯誤。Python 以 1 萬組隨機誤差驗算，RMSE ≥ MAE 皆成立。", "per_option": {"A": "正確：RMSE ≥ MAE 恆成立，只有所有誤差絕對值都相同時兩者才相等。", "B": "即使沒有離群值，RMSE 也不會小於 MAE，最多相等。", "C": "RMSE 與 MAE 的單位本來就相同，差別在平方是否放大大誤差。", "D": "欠擬合與 MAE、RMSE 的大小關係無關，這個關係在任何模型都成立。"}, "guide_ref": "學習指引 p.5-22～5-24（MSE、RMSE、MAE）；兩者大小關係屬補充", "hot": true}, {"no": 35, "section": "5.3", "topic_id": "5.3-09", "topic": "資料洩漏與 Pipeline", "style": "情境", "stem": "某團隊處理類別極度不平衡的詐欺資料，打算用 SMOTE 過採樣少數類，並把流程包進 scikit-learn 的 Pipeline，程式碼如下：\n```\nfrom sklearn.pipeline import Pipeline\nfrom imblearn.over_sampling import SMOTE\nfrom sklearn.linear_model import LogisticRegression\n\npipe = Pipeline([('smote', SMOTE(random_state=0)),\n                 ('clf', LogisticRegression())])\npipe.fit(X_train, y_train)\n```\n執行這段程式碼時，最可能發生下列何種結果？", "options": {"A": "順利執行：Pipeline 會辨識 SMOTE 為重採樣器，自動只在 fit 時對訓練資料過採樣、predict 時略過，與 imblearn 的 Pipeline 行為相同", "B": "順利執行，但呼叫 predict 時 SMOTE 也會對新資料過採樣，使預測結果的筆數比輸入的資料筆數更多", "C": "ValueError：LogisticRegression 不支援類別不平衡的資料，因此不能接在任何重採樣步驟之後使用", "D": "TypeError：SMOTE 沒有 transform，sklearn 的 Pipeline 無法接受，應改用 imblearn 的 Pipeline"}, "answer": "D", "explanation": "答案 D。scikit-learn 的 Pipeline 中間步驟必須是有 fit 與 transform 的轉換器；SMOTE 是重採樣器，只有 fit_resample，因此 fit 時會丟出 TypeError（All intermediate steps should be transformers...）。imblearn.pipeline.Pipeline 才支援重採樣步驟，且只在訓練階段套用 SMOTE，搭配交叉驗證可避免把合成樣本洩漏到驗證折。Python 實跑確認 TypeError，改用 imblearn 的 Pipeline 後可正常訓練。", "per_option": {"A": "這是 imblearn Pipeline 才有的行為；scikit-learn 的 Pipeline 根本無法接受 SMOTE 當中間步驟。", "B": "程式在 fit 階段就會出錯，且重採樣本來就不應用在預測階段。", "C": "LogisticRegression 可處理不平衡資料，錯誤原因在 Pipeline 中間步驟的介面。", "D": "正確：含重採樣的流程要用 imblearn 的 Pipeline。"}, "guide_ref": "學習指引未載（資料洩漏與 Pipeline 屬 10/27 分享重點，依 imbalanced-learn 文件）", "hot": false, "detail": {"code": [["from sklearn.pipeline import Pipeline", "從 scikit-learn 載入 Pipeline（管線）：把多個處理步驟串成一條流水線，資料依序流過每一步。這是 sklearn 的 Pipeline，中間步驟只能是有 fit 和 transform 的「轉換器」。"], ["from imblearn.over_sampling import SMOTE", "從 imblearn（imbalanced-learn，處理類別不平衡的套件）載入 SMOTE。over_sampling＝過採樣（增加少數類的樣本）；SMOTE＝Synthetic Minority Over-sampling Technique，在少數類樣本之間「合成」新樣本。它只有 fit_resample（學習並重新取樣），沒有 transform。"], ["from sklearn.linear_model import LogisticRegression", "載入邏輯迴歸分類器。linear_model＝線性模型模組；LogisticRegression＝邏輯迴歸，用來做二元分類（這裡是詐欺／正常）。"], ["pipe = Pipeline([('smote', SMOTE(random_state=0)),", "建立管線，括號裡是步驟清單，每個步驟是（名稱, 物件）。第 1 步名稱 'smote'，物件是 SMOTE（random_state=0 固定隨機種子，結果可重現）。"], ["('clf', LogisticRegression())])", "第 2 步名稱 'clf'（classifier 分類器的縮寫），物件是邏輯迴歸，最後一步可以是模型。"], ["pipe.fit(X_train, y_train)", "fit＝學習。依序跑每一步；但 sklearn 的 Pipeline 發現中間步驟 SMOTE 沒有 transform，就丟出 TypeError。要改用 imblearn.pipeline.Pipeline。"]], "tip": "要在 Pipeline 裡放 SMOTE，必須用 imblearn 的 Pipeline（只在訓練階段重採樣）；sklearn 的 Pipeline 會報 TypeError。", "fig": {"type": "flow", "title": "Pipeline 裡放 SMOTE", "cols": [{"label": "✗ sklearn Pipeline", "bad": true, "steps": ["建 sklearn Pipeline", "步驟 1：SMOTE", "!SMOTE 沒有 transform", "fit 丟出 TypeError"], "note": "中間步驟必須是轉換器，重採樣器不行"}, {"label": "✓ imblearn Pipeline", "steps": ["建 imblearn Pipeline", "步驟 1：SMOTE", "步驟 2：邏輯迴歸", "fit：只對訓練資料重採樣"], "note": "imblearn.pipeline 支援重採樣步驟"}]}}}, {"no": 36, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "比較", "stem": "兩位同事討論為什麼 L1 正則化（Lasso）能讓部分權重精確變成 0，而 L2 正則化（Ridge）只會把權重壓小卻不歸零。下列解釋何者最正確？", "options": {"A": "L1 的懲罰與權重的平方成正比，所以小權重幾乎不受影響，只有大權重才會被壓到 0", "B": "L1 對非零權重的梯度大小恆為 λ，小權重仍被固定力道推向 0；L2 梯度與權重成正比，越小推力越弱", "C": "L2 更新時會把絕對值小於 λ 的權重直接截斷為 0，因此精確歸零的反而是 L2 而不是 L1", "D": "L1 需要先做特徵標準化而 L2 不需要，必須標準化後 L1 才會讓部分權重產生 0"}, "answer": "B", "explanation": "答案 B。L1 懲罰項 λ|w| 對 w ≠ 0 的梯度為 λ·sign(w)，大小固定，所以無論權重多小都持續被推向 0，最後可以剛好停在 0，得到稀疏解（自動特徵選擇）。L2 懲罰項 λw² 的梯度是 2λw，與權重成正比，權重越小推力越小，因此只會縮小而不會精確變成 0。", "per_option": {"A": "平方懲罰是 L2；L1 是絕對值懲罰，且對小權重同樣有固定力道。", "B": "正確：常數推力可把權重推到 0，比例推力隨權重縮小而消失。", "C": "歸零的是 L1（稀疏）；L2 只讓權重普遍變小。", "D": "兩者都受特徵尺度影響，標準化也不是產生 0 的原因。"}, "guide_ref": "學習指引 p.5-42～5-45（L1 歸零、L2 不歸零）；梯度角度的解釋屬補充", "hot": true}, {"no": 37, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "情境", "stem": "某工程師以 scikit-learn 的 LogisticRegression() 訓練分類器，沒有傳入任何與正則化有關的參數，並在報告中寫「本模型未使用正則化」。審查者指出報告有誤。下列說明何者最正確？", "options": {"A": "預設即帶有 L2 懲罰（C=1.0）；要關閉須明確取消懲罰，或把 C 設得極大使懲罰趨近於零", "B": "預設不使用正則化；只有明確啟用 L1 或 L2 懲罰時才會加入懲罰項", "C": "預設使用 L1 正則化，因此訓練後有部分係數會被壓成 0", "D": "預設使用 Elastic Net，同時帶有 L1 與 L2 兩種懲罰"}, "answer": "A", "explanation": "答案 A。scikit-learn 的 LogisticRegression 預設使用 L2 懲罰、C=1.0（C 是正則化強度的倒數），也就是預設就有 L2 正則化。若要接近無正則化，需明確取消懲罰（取消的寫法隨版本略有不同）或把 C 調得很大。審閱他人程式時，不能以為「沒寫參數就是沒有正則化」。Python 以 scikit-learn 1.7 讀取預設參數，確認為 L2 與 C=1.0。", "per_option": {"A": "正確：預設就有 L2 正則化。", "B": "預設值就是 L2，並非不使用正則化。", "C": "預設不是 L1，預設的 L2 不會讓係數精確為 0。", "D": "Elastic Net 需要明確指定，不是預設值。"}, "guide_ref": "學習指引 p.5-42～5-45（L2 正則化）；sklearn 預設值依官方文件", "hot": true}, {"no": 38, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "情境", "stem": "某診所有約 1,500 筆表格資料、12 個特徵，工程師建立 5 層、每層 512 個神經元的多層感知器（參數量超過 100 萬），訓練準確率 99%、驗證準確率 72%，且已無法再取得更多資料。下列哪一種做法最能直接緩解這個問題？", "options": {"A": "擴大模型容量（Increase Capacity）：增加到 10 層並提高每層神經元數，讓模型學會更多規律", "B": "擴增特徵（Feature Expansion）：以交互項把 12 個特徵擴充到數百個，提高模型的表達能力", "C": "縮小模型容量（Reduce Capacity）：減少層數與神經元，並搭配 L2 正則化，使參數量與資料量相稱", "D": "特徵標準化（Standardization）：把各特徵縮放為平均 0、標準差 1，使訓練過程更穩定"}, "answer": "C", "explanation": "答案 C。訓練 99%、驗證 72% 是典型過擬合；5 層 × 512 神經元的參數量約 106 萬，遠多於 1,500 筆樣本，模型有能力把訓練資料背起來。直接對症的做法是降低複雜度：減少層數與神經元、加入 L1／L2 正則化、使用 Dropout 等。加大模型與擴增特徵都會增加複雜度；標準化能穩定訓練，但無法解決參數相對資料過多的問題。", "per_option": {"A": "加大模型只會讓過擬合更嚴重。", "B": "增加輸入特徵會讓模型更複雜，樣本又很少，只會加重過擬合。", "C": "正確：參數遠多於樣本時，降低複雜度最直接。", "D": "標準化有助訓練穩定，但不會降低參數量過多造成的過擬合。"}, "guide_ref": "學習指引 p.5-45～5-46（過擬合對策：減少層數與神經元、正則化）", "hot": true}, {"no": 39, "section": "5.4", "topic_id": "5.4-03", "topic": "學習率", "style": "情境", "stem": "某工程師訓練分類網路，前 20 個 epoch 損失快速下降，但之後驗證損失在一個狹窄範圍內來回小幅跳動，始終無法再降到更低。檢查後確認沒有過擬合，也沒有資料問題。最適合優先嘗試的調整是下列何者？", "options": {"A": "提高初始學習率（Higher Initial LR）：把步伐調得更大，跳出目前的區域", "B": "後期預熱（Late Warm-up）：訓練後期才把學習率從極小值逐步升高", "C": "移除正則化（Remove Regularization）：拿掉所有正則化項，讓損失可以降得更低並貼近訓練資料", "D": "學習率衰減（Learning Rate Decay）：後期降低學習率，讓參數在最低點附近更精細地搜尋"}, "answer": "D", "explanation": "答案 D。損失先快速下降再於窄範圍內跳動，代表學習率對後期而言偏大，參數在最低點兩側來回跨越。理想的做法是前期用較大的學習率快速下降，後期調小以精細收斂，常搭配遞減調度器（Step／Exponential Decay）或 ReduceLROnPlateau（驗證表現停滯時自動降低）。warm-up 是訓練初期從小慢慢升高，用途不同。", "per_option": {"A": "損失已在最低點附近跳動，加大步伐會更不穩，甚至發散。", "B": "預熱用在訓練初期穩定起步，且提高學習率與此現象的需求相反。", "C": "題目已確認沒有過擬合，跳動的主因是步伐太大而不是正則化。", "D": "正確：後期步伐過大會在最低點附近來回跨越。"}, "guide_ref": "學習指引 p.5-19、5-31～5-32（學習率與調度策略）", "hot": true}, {"no": 40, "section": "5.4", "topic_id": "5.4-04", "topic": "資料增強", "style": "情境", "stem": "某團隊的影像訓練集有 200 GB，訓練機器的硬碟只剩約 50 GB 可用空間。他們想用翻轉、旋轉、亮度調整等方式，把訓練時見到的資料多樣性提高到原來的 10 倍以上。下列哪種做法最適當？", "options": {"A": "離線資料增強（Offline Augmentation）：預先產生並儲存 10 倍的增強影像，訓練時直接讀取", "B": "線上資料增強（On-the-fly Augmentation）：載入時每個 epoch 即時隨機變換，不必另外存檔", "C": "單次固定翻轉（Single Fixed Flip）：每張圖只做一次水平翻轉並存檔，資料量變成 2 倍", "D": "放棄資料增強（No Augmentation）：改為提高學習率來補償資料多樣性不足"}, "answer": "B", "explanation": "答案 B。線上（動態）增強在資料載入管線中，對每個批次的圖片即時套用隨機變換，每個 epoch 看到的版本都不同，不需預先把增強結果存檔，因此幾乎不增加儲存空間。離線增強需先產生並儲存所有增強版本（此處約 200 GB × 10 = 2 TB），硬碟放不下。注意增強只應用在訓練資料，且變換不能改變標籤語意。", "per_option": {"A": "需要約 2 TB 的額外空間，遠超出可用的 50 GB。", "B": "正確：每輪看到不同變形，卻不佔額外儲存空間。", "C": "只增加 2 倍且仍需約 200 GB 的額外空間，也達不到多樣性目標。", "D": "學習率不能增加資料多樣性，兩者目的不同。"}, "guide_ref": "學習指引 p.5-9、5-47（資料增強）；線上與離線增強的差異屬補充", "hot": true}, {"no": 41, "section": "5.4", "topic_id": "5.4-05", "topic": "模型量化", "style": "計算", "stem": "某模型某一層的權重最大絕對值為 6.35，工程師以對稱線性量化將權重轉成 INT8（整數範圍 −127～127），縮放係數 scale = 最大絕對值 ÷ 127。某個權重原本為 1.37，量化後的整數值與反量化還原後的近似值，最接近下列何者？", "options": {"A": "整數值 137，還原後約 1.37：把原值乘以 100 後直接取整，未使用縮放係數", "B": "整數值 28，還原後約 1.40：將 27.4 無條件進位後再乘以 0.05", "C": "整數值 27，還原後約 1.35：1.37 ÷ 0.05 = 27.4，四捨五入為 27", "D": "整數值 27，還原後恰為 1.37：量化只是改變儲存格式，不會產生任何誤差"}, "answer": "C", "explanation": "答案 C。對稱線性量化：scale = 6.35÷127 = 0.05；量化整數 q = round(w÷scale) = round(27.4) = 27；反量化 w' = q×scale = 1.35，與原值 1.37 差 0.02，這就是量化誤差。誤差累積可能使準確率下降，因此需要量化感知訓練（QAT）等方法補償。Python 驗算 q = 27、w' = 1.35。", "per_option": {"A": "沒有使用 scale，137 也超出 INT8 的範圍 −127～127。", "B": "標準做法是四捨五入；27.4 取整為 27。", "C": "正確：量化是以較少位元近似原值，會產生小誤差。", "D": "整數值正確，但還原值是 27×0.05 = 1.35，與原值有 0.02 的量化誤差。"}, "guide_ref": "學習指引 p.5-51～5-52（模型量化）；對稱量化公式屬補充", "hot": false, "detail": {"steps": [["① 算縮放係數 scale", "scale ＝ 最大絕對值 ÷ 127（INT8 的最大整數）", "＝ 6.35 ÷ 127 ＝ 0.05"], ["② 量化：除以 scale 再四捨五入成整數", "q ＝ round( w ÷ scale )", "＝ round(1.37 ÷ 0.05) ＝ round(27.4) ＝ 27（27 在 −127～127 內）"], ["③ 反量化：把整數乘回 scale", "w' ＝ q × scale", "＝ 27 × 0.05 ＝ 1.35"], ["④ 量化誤差", "誤差 ＝ 原值 − 還原值", "＝ 1.37 − 1.35 ＝ 0.02（不為 0，量化會有小誤差）"]], "tip": "量化三步：除以 scale → 四捨五入 → 乘回 scale；還原值跟原值會差一點點。"}}, {"no": 42, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "計算", "stem": "三家醫院以聯邦學習（Federated Learning）共同訓練模型，伺服器採用依本地樣本數加權的聯邦平均（FedAvg）。某一輪中，三家醫院的本地樣本數分別為 1,000、3,000、6,000 筆，回傳到伺服器的同一個權重參數值分別為 1.0、2.0、3.0。彙整後，全域模型中該參數的新值為下列何者？", "options": {"A": "2.5：(1,000×1.0 + 3,000×2.0 + 6,000×3.0) ÷ 10,000", "B": "2.0：(1.0 + 2.0 + 3.0) ÷ 3，把三家醫院參數視為同等重要的簡單算術平均", "C": "3.0：以樣本數最多（6,000 筆）的醫院的參數為準，其他醫院的參數不納入計算", "D": "6.0：1.0 + 2.0 + 3.0，把三家醫院的參數直接加總作為全域參數"}, "answer": "A", "explanation": "答案 A。FedAvg 的聚合公式為 w = Σ(nₖ÷N)·wₖ：權重 = 1,000÷10,000 = 0.1、0.3、0.6，所以 0.1×1.0 + 0.3×2.0 + 0.6×3.0 = 0.1 + 0.6 + 1.8 = 2.5。聯邦學習中原始資料不離開各機構，只把模型參數（或梯度）更新傳回伺服器彙整。Python 驗算 2.5。", "per_option": {"A": "正確：樣本數越多的醫院權重越大，且原始資料始終留在各醫院。", "B": "題目採依樣本數加權的 FedAvg，不是簡單平均。", "C": "FedAvg 是加權平均，其他醫院的參數仍會按比例影響結果。", "D": "加總會讓參數放大，聚合應為加權平均而不是總和。"}, "guide_ref": "學習指引 p.6-10～6-12（聯邦學習：本地訓練、回傳參數更新）；FedAvg 加權公式屬補充", "hot": true, "detail": {"steps": [["① 算總樣本數", "N ＝ n₁ ＋ n₂ ＋ n₃", "＝ 1,000 ＋ 3,000 ＋ 6,000 ＝ 10,000"], ["② 算每家醫院的權重（占總樣本的比例）", "權重 ＝ nₖ ÷ N", "＝ 1,000÷10,000 ＝ 0.1；3,000÷10,000 ＝ 0.3；6,000÷10,000 ＝ 0.6（加起來 ＝ 1）"], ["③ 加權平均（FedAvg）", "w ＝ Σ (nₖ ÷ N) × wₖ", "＝ 0.1×1.0 ＋ 0.3×2.0 ＋ 0.6×3.0 ＝ 0.1 ＋ 0.6 ＋ 1.8 ＝ 2.5"], ["④ 對照簡單平均（選項 B 的算法）", "簡單平均 ＝ (w₁＋w₂＋w₃) ÷ 3", "＝ (1.0 ＋ 2.0 ＋ 3.0) ÷ 3 ＝ 2.0（沒有考慮樣本數，不是 FedAvg）"]], "tip": "FedAvg＝依樣本數加權的平均：樣本多的醫院影響大；資料不出院，只傳參數。"}}, {"no": 43, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "計算", "stem": "某醫院要釋出就診資料，把「年齡層」與「郵遞區號前三碼」視為準識別碼（Quasi-identifier）。依這兩個欄位分組後，各組的記錄筆數分別為 5、4、6、3 筆。這份資料滿足 K-匿名（K-Anonymity）的最大 K 值為何？若要提升到 K = 4，最直接需處理哪一組？", "options": {"A": "K = 4.5；K 值是各組筆數的平均，不需要再處理任何一組", "B": "K = 6；取筆數最多的組，只需處理 4 筆的那一組", "C": "K = 4；多數組已達 4 筆即可，不需處理其他組", "D": "K = 3；需處理只有 3 筆的那一組，使每組至少 4 筆"}, "answer": "D", "explanation": "答案 D。K-匿名要求：依準識別碼分組後，每一組至少有 K 筆記錄，使任何人混在至少 K−1 個其他人之中而難以被辨識。因此資料集滿足的最大 K 等於最小群組大小 min(5, 4, 6, 3) = 3。要達到 K = 4，必須處理那組 3 筆的群組（泛化或合併）。Python 驗算最小值為 3，平均 4.5 並非 K 值。", "per_option": {"A": "K-匿名要求每一組都至少有 K 筆，由最小組決定，不是平均。", "B": "只要有一組較小，該組成員就較容易被辨識，K 不由最大組決定。", "C": "必須每一組都至少 4 筆，3 筆的那一組仍未達標。", "D": "正確：K-匿名的 K 取決於最小的群組。"}, "guide_ref": "學習指引 p.6-10（K-匿名）；以最小群組定義 K 值屬補充", "hot": true, "detail": {"steps": [["① 判斷「最大的 K」", "資料滿足 K-匿名的最大 K ＝ 最小的群組大小（每一組都至少要有 K 筆）", "＝ min(5, 4, 6, 3) ＝ 3"], ["② 對照平均（選項 A 的錯誤想法）", "平均 ＝ 總和 ÷ 組數（K 不是平均）", "＝ (5＋4＋6＋3) ÷ 4 ＝ 18 ÷ 4 ＝ 4.5"], ["③ 要提升到 K＝4 要處理哪一組", "每組筆數必須 ≥ 4", "5、4、6 都 ≥ 4；只有 3 ＜ 4 → 要處理那組 3 筆的（泛化或合併）"]], "tip": "K-匿名的 K ＝ 最小那一組的人數（木桶效應）；要提升就處理最小的組。"}}, {"no": 44, "section": "6.2", "topic_id": "6.2-01", "topic": "偏見類型與成因", "style": "情境", "stem": "某銀行的信用評分資料已確認各族群的樣本數相當、標註標準一致。為了降低過擬合，團隊把 L2 正則化強度調得很大，並大幅縮小模型規模，整體準確率幾乎不變，但某少數族群的誤判率明顯上升。團隊檢查後確認，只要把正則化強度調回較小，該族群的誤判率就恢復到原本水準。這種偏見最適合歸類為下列何者？", "options": {"A": "來源偏誤（Source Bias）：資料蒐集階段未均衡涵蓋各個群體，導致代表性不足", "B": "正規化與簡化偏誤（Regularization Bias）：為避免過擬合而簡化變數關聯，降低對少數群體的敏感度", "C": "製程偏誤（Process Bias）：標註者的主觀判斷或文化差異造成標籤不一致，進而影響模型", "D": "目標函數偏誤（Objective Function Bias）：只以整體平均精度為優化目標，缺乏公平性約束"}, "answer": "B", "explanation": "答案 B。指引把偏見分成資料層面（來源、內容、製程偏誤）與模型層面（演算法、目標函數、正規化與簡化、對抗式訓練不足）。題目排除了來源與製程問題，且只要放鬆正則化少數族群表現就恢復，說明是為了避免過擬合而簡化變數關聯，使模型對少數群體的細微特徵不敏感，屬正規化與簡化偏誤（Regularization Bias）。", "per_option": {"A": "題目已確認各族群樣本數相當，且問題隨正則化調整而消失，不是資料來源的問題。", "B": "正確：偏差來自模型為降低複雜度所做的簡化，屬模型層面的偏見。", "C": "題目已確認標註標準一致。", "D": "損失函數沒有更動，造成差異的是正則化強度與模型簡化。"}, "guide_ref": "學習指引 p.6-14～6-17（模型偏見：正規化與簡化偏誤）", "hot": true}, {"no": 45, "section": "6.2", "topic_id": "6.2-05", "topic": "去偏方法", "style": "情境", "stem": "某招募模型的訓練資料中，女性應徵者僅占 8%，模型對女性的召回率明顯低於男性。團隊目前只被允許調整訓練資料，不能更動模型結構與損失函數，也不能在上線後修改模型的輸出結果。下列哪種去偏方法最符合這些限制？", "options": {"A": "前處理（Pre-processing）：對少數群體重新抽樣或重加權，使訓練資料分佈較均衡", "B": "後處理（Post-processing）：上線後對不同群體設定不同的通過門檻", "C": "公平性正規化（Fairness Regularization）：在損失函數加入公平性懲罰項", "D": "對抗式去偏（Adversarial Debiasing）：另訓練對抗網路預測敏感特徵，迫使主模型學到不受其影響的表示"}, "answer": "A", "explanation": "答案 A。去偏方法依介入時機分為前處理（改資料）、模型內處理（改訓練）、後處理（改輸出）。題目只允許調整訓練資料，所以應選前處理：對少數群體重新抽樣、類別重加權（或 SMOTE 等）讓群體分佈較均衡。公平性正規化與對抗式去偏需改動訓練目標或結構；門檻調整則在輸出端。", "per_option": {"A": "正確：前處理只改資料，符合所有限制。", "B": "後處理要修改模型輸出，與題目的限制衝突。", "C": "這需要更動損失函數，屬於模型內處理，題目不允許。", "D": "這需要更動模型訓練結構，屬於模型內處理，題目不允許。"}, "guide_ref": "學習指引 p.6-20～6-23（去偏三階段：前處理、模型內處理、後處理）", "hot": false}, {"no": 46, "section": "X", "topic_id": "X-01", "topic": "參數量與運算量", "style": "計算", "stem": "某全連接網路依序為：輸入 784 維 → Dense(256, ReLU) → Dense(128, ReLU) → Dense(10, Softmax)，每層皆含偏差項。若所有可訓練參數都以 16 位元浮點數（FP16，每個參數 2 位元組）儲存，下列關於參數總數與權重檔大小的敘述何者正確？（1 MB = 1,000,000 位元組）", "options": {"A": "總參數 234,752 個，FP16 權重檔約 0.47 MB", "B": "總參數 235,146 個，權重檔約 0.94 MB", "C": "總參數 235,146 個，權重檔約 0.24 MB", "D": "總參數 235,146 個，FP16 權重檔約 0.47 MB"}, "answer": "D", "explanation": "答案 D。Dense 層參數 = 輸入×輸出 + 輸出：第一層 784×256 + 256 = 200,960；第二層 256×128 + 128 = 32,896；第三層 128×10 + 10 = 1,290；合計 235,146。FP16 每個參數 2 位元組，約 470,292 位元組 ≈ 0.47 MB（FP32 約 0.94 MB、INT8 約 0.24 MB）。Python 驗算相符。", "per_option": {"A": "漏算偏差項：權重 234,752 個，偏差還有 256+128+10 = 394 個。", "B": "這是以每個參數 4 位元組（FP32）計算，題目是 FP16。", "C": "這是以每個參數 1 位元組（INT8）計算，題目是 FP16。", "D": "正確：(784×256+256)+(256×128+128)+(128×10+10) = 235,146，再乘以 2 位元組。"}, "guide_ref": "學習指引未載（參數量與運算量屬補充考點）", "hot": true, "detail": {"steps": [["① 第 1 層 Dense(256)（784 → 256）", "參數 ＝ 輸入 × 輸出 ＋ 偏差（偏差個數＝輸出個數）", "＝ 784×256 ＋ 256 ＝ 200,704 ＋ 256 ＝ 200,960"], ["② 第 2 層 Dense(128)（256 → 128）", "參數 ＝ 輸入 × 輸出 ＋ 偏差", "＝ 256×128 ＋ 128 ＝ 32,768 ＋ 128 ＝ 32,896"], ["③ 第 3 層 Dense(10)（128 → 10）", "參數 ＝ 輸入 × 輸出 ＋ 偏差", "＝ 128×10 ＋ 10 ＝ 1,280 ＋ 10 ＝ 1,290"], ["④ 加總", "總參數 ＝ 三層相加（ReLU、Softmax 沒有參數）", "＝ 200,960 ＋ 32,896 ＋ 1,290 ＝ 235,146"], ["⑤ 換算檔案大小（FP16：每個參數 2 位元組）", "檔案大小 ＝ 參數個數 × 每個參數的位元組數", "＝ 235,146 × 2 ＝ 470,292 位元組 ≈ 0.47 MB（FP32 ×4 ≈ 0.94 MB；INT8 ×1 ≈ 0.24 MB）"]], "tip": "Dense 參數＝輸入×輸出＋輸出（偏差）；檔案大小＝參數數 × 每參數位元組（FP32=4、FP16=2、INT8=1）。", "fig": {"type": "layers", "title": "每一層的形狀與參數", "items": [{"name": "輸入", "shape": "784"}, {"name": "Dense(256)", "shape": "256", "note": "參數 784×256＋256 ＝ 200,960"}, {"name": "Dense(128)", "shape": "128", "note": "參數 256×128＋128 ＝ 32,896"}, {"name": "Dense(10)", "shape": "10", "note": "參數 128×10＋10 ＝ 1,290", "hl": true}], "note": "總 235,146 個 × 2 位元組（FP16）＝ 470,292 位元組 ≈ 0.47 MB"}}}, {"no": 47, "section": "X", "topic_id": "X-02", "topic": "時間序列驗證", "style": "否定", "stem": "某零售商要預測每日銷量，目標是預測第 t 日的銷量，且預測時只能取得第 t−1 日（含）以前的資料。下列特徵工程與驗證的做法，何者不適合採用？", "options": {"A": "位移特徵（Lagged Feature）：將滾動平均先 shift(1)，使第 t 日的特徵只用 t−1 日以前的資料", "B": "訓練期縮放（Train-only Scaling）：標準化的平均與標準差只用訓練期資料計算，再套用到驗證期", "C": "含當日滾動平均（Same-day Rolling Mean）：以含第 t 日的 rolling(7).mean() 當特徵", "D": "前向驗證（Walk-forward Validation）：驗證期永遠在訓練期之後，並依時間往後推進多折重複驗證"}, "answer": "C", "explanation": "答案 C。預測第 t 日時，所有特徵只能來自 t−1 日（含）以前。rolling(7).mean() 預設會把當日（第 t 日）也算進去，等於把答案放進特徵，驗證分數會虛高，上線後卻拿不到這個資訊；正確做法是先 shift(1)。其餘三項（位移特徵、只用訓練期統計量縮放、驗證期在訓練期之後的前向驗證）都是避免時間洩漏的標準做法。", "per_option": {"A": "做法適當，特徵不包含未來資訊。", "B": "做法適當，驗證期的資訊沒有進入縮放參數。", "C": "不適當：特徵中包含了要預測的第 t 日銷量，屬於目標洩漏。", "D": "做法適當，符合用過去預測未來的前向驗證。"}, "guide_ref": "學習指引未載（時間序列驗證屬補充考點）", "hot": true}, {"no": 48, "section": "X", "topic_id": "X-03", "topic": "網格與隨機搜尋", "style": "情境", "stem": "某團隊用隨機搜尋（Random Search）調整神經網路的學習率，合理範圍為 0.00001～0.1，跨越四個數量級。若希望每個數量級的學習率都能被有效探索，下列抽樣方式何者最適當？", "options": {"A": "均勻抽樣（Uniform）：在線性尺度上等機率抽值，約 90% 的樣本會落在 0.01～0.1", "B": "對數均勻抽樣（Log-uniform）：在對數尺度上均勻抽值，每個數量級被抽到的機率大致相同", "C": "離散網格抽樣（Discrete Grid）：僅從 0.00001、0.0001、0.001、0.01、0.1 這 5 個值挑選", "D": "常態抽樣（Normal）：以 0.05 為中心依鐘形曲線抽值，越靠近 0.05 越常被抽到"}, "answer": "B", "explanation": "答案 B。在 [0.00001, 0.1] 做線性均勻抽樣，約 90% 的值大於 0.01，小於 0.001 的值僅約 1%，小數量級幾乎不會被探索。學習率這類跨越多個數量級的超參數，有效差異發生在數量級上，應在對數尺度上抽樣（例如 scipy.stats.loguniform），讓每個數量級被抽到的機率相近。隨機搜尋的優勢之一，就是能直接從連續分佈抽值，而不必只用事先列好的離散點。", "per_option": {"A": "線性均勻抽樣約 90% 落在 0.01～0.1，小數量級幾乎抽不到，探索嚴重偏斜。", "B": "正確：學習率的有效差異在數量級，應在對數尺度上抽樣。", "C": "只能試 5 個固定點，無法探索值與值之間的區域，也沒有發揮隨機搜尋可從連續分佈抽值的優勢。", "D": "抽樣集中在 0.05 附近，小於 0.001 的數量級幾乎不會被探索到。"}, "guide_ref": "學習指引未載（網格與隨機搜尋屬補充考點）", "hot": true}, {"no": 49, "section": "X", "topic_id": "X-03", "topic": "網格與隨機搜尋", "style": "計算", "stem": "某工程師執行下列網格搜尋：\n```\nparam_grid = {'C': [0.1, 1, 10], 'kernel': ['linear', 'rbf'], 'gamma': [0.01, 0.1]}\ngs = GridSearchCV(SVC(), param_grid, cv=5)   # refit 使用預設值\ngs.fit(X, y)\n```\n在 fit 完成的過程中，SVC 模型總共被訓練（呼叫 fit）幾次？", "options": {"A": "61 次：12 組合 × 5 折 = 60，再加 refit 重訓最佳參數一次", "B": "60 次：只計算 12 組合 × 5 折的交叉驗證訓練，不含最終重訓", "C": "12 次：每組參數只訓練一次，不做交叉驗證所需的重複訓練", "D": "35 次：把候選值個數相加 (3+2+2=7) 再乘以 5 折，而不是把候選值個數相乘"}, "answer": "A", "explanation": "答案 A。網格搜尋的組合數是各超參數候選值個數相乘：3×2×2 = 12；每組做 5 折交叉驗證，共 12×5 = 60 次訓練。GridSearchCV 的 refit 預設為 True，會用找到的最佳參數在完整資料上再訓練一次最終模型，所以總共 61 次。（gamma 對 linear 核無作用，但仍計入網格組合。）", "per_option": {"A": "正確：refit 預設為 True，會再訓練最終模型一次。", "B": "漏掉 refit=True 時最後以最佳參數用全部資料重訓的那一次。", "C": "每組參數還要乘上交叉驗證的折數 5。", "D": "組合數是各超參數候選數相乘，不是相加。"}, "guide_ref": "學習指引未載（網格搜尋屬補充考點）", "hot": true, "detail": {"steps": [["① 算參數組合數", "組合數 ＝ 各超參數候選值個數相乘", "＝ 3（C）× 2（kernel）× 2（gamma）＝ 12"], ["② 交叉驗證的訓練次數", "訓練次數 ＝ 組合數 × 折數 cv", "＝ 12 × 5 ＝ 60"], ["③ 加上 refit（用最佳參數在全部資料重訓一次）", "總次數 ＝ 交叉驗證次數 ＋ refit 的 1 次（refit 預設 True）", "＝ 60 ＋ 1 ＝ 61"]], "code": [["param_grid = {'C': [0.1, 1, 10], 'kernel': ['linear', 'rbf'], 'gamma': [0.01, 0.1]}", "建立「要嘗試的參數表」（字典）。C＝懲罰強度（越大越不容許分錯、分界線越貼合訓練資料），有 3 個候選；kernel＝核函數（決定怎麼畫分界線），linear＝線性、rbf＝高斯徑向基函數，2 個候選；gamma＝rbf 核的影響範圍，2 個候選。"], ["gs = GridSearchCV(SVC(), param_grid, cv=5)   # refit 使用預設值", "GridSearchCV＝網格搜尋＋交叉驗證（Grid＝格子，把所有組合排成網格全部試一遍；CV＝Cross-Validation）。SVC＝支援向量分類器（Support Vector Classifier）；param_grid 是上面的參數表；cv=5＝切成 5 折。refit（預設 True）＝找到最佳參數後，再用全部資料重訓一次最終模型。"], ["gs.fit(X, y)", "fit＝學習／執行搜尋：每個組合各做 5 折訓練，最後再 refit 一次。X 是特徵、y 是答案。"]], "tip": "網格搜尋次數＝(各候選數相乘)×折數＋1（refit 預設 True）。", "fig": {"type": "folds", "title": "每組都要做 5 折", "k": 5, "note": "3×2×2＝12 組 × 5 折＝60 次，再加 refit 1 次＝61 次"}}}, {"no": 50, "section": "X", "topic_id": "X-04", "topic": "蒙地卡羅方法", "style": "計算", "stem": "某工程師想用蒙地卡羅方法估計積分 ∫₀² x² dx。他在區間 [0, 2] 均勻隨機抽出 5 個點：x = 0.2、0.8、1.2、1.5、1.8。採用「函數值平均 × 區間長度」的估計式，下列估計值何者正確？", "options": {"A": "約 1.52：只取函數值的平均，忘了乘以區間長度", "B": "約 7.61：把 5 個函數值直接加總，沒有取平均", "C": "約 2.67：此積分的解析解 8/3，不是由抽樣得到的估計", "D": "約 3.04：函數值平均 1.522 再乘以區間長度 2"}, "answer": "D", "explanation": "答案 D。蒙地卡羅積分把 ∫ₐᵇ f(x)dx 近似為 (b−a)·(1/N)·Σf(xᵢ)。f(x) = x² 在 5 個點的值為 0.04、0.64、1.44、2.25、3.24，平均 1.522，乘以區間長度 2 得 3.044。與精確值 8/3 ≈ 2.667 有差距，樣本越多估計越接近（誤差約隨 1/√N 縮小）。Python 驗算 3.044。", "per_option": {"A": "需要再乘上區間長度 b−a = 2。", "B": "加總後還要除以樣本數取平均，再乘以區間長度。", "C": "這是精確值，不是由這 5 個隨機點得到的蒙地卡羅估計。", "D": "正確：蒙地卡羅積分 = 區間長度 × 函數值的樣本平均。"}, "guide_ref": "學習指引未載（蒙地卡羅方法屬補充考點）", "hot": true, "detail": {"steps": [["① 算每個抽樣點的函數值 f(x) ＝ x²", "f(x) ＝ x²（x 的平方）", "0.2²＝0.04；0.8²＝0.64；1.2²＝1.44；1.5²＝2.25；1.8²＝3.24"], ["② 取函數值的平均", "平均 ＝ 總和 ÷ 抽樣點數 N", "＝ (0.04＋0.64＋1.44＋2.25＋3.24) ÷ 5 ＝ 7.61 ÷ 5 ＝ 1.522"], ["③ 乘以區間長度（蒙地卡羅積分估計式）", "∫ₐᵇ f(x)dx ≈ (b－a) × 函數值平均", "＝ (2－0) × 1.522 ＝ 2 × 1.522 ＝ 3.044 ≈ 3.04"], ["④ 對照精確值（選項 C 的來源）", "∫₀² x² dx ＝ [x³÷3] 從 0 到 2 ＝ 2³÷3", "＝ 8 ÷ 3 ≈ 2.667（精確值；本題 5 點估計 3.04 有誤差）"]], "tip": "蒙地卡羅積分＝區間長度 × 函數值平均；樣本越多越準。"}}], "11": [{"no": 1, "section": "3.1", "topic_id": "3.1-03", "topic": "貝氏定理與條件機率", "style": "情境", "stem": "某電商的流失預測模型（邏輯迴歸）對一位會員輸出 0.82，系統將此值標示為「流失機率」。資料科學家向行銷團隊說明這個數值在機率上的正確意涵，下列何者最恰當？", "options": {"A": "全體會員中最終會流失的比例為 82%，即流失的邊際機率 P(流失) = 0.82，與該會員的個別特徵無關", "B": "該會員的特徵有 82% 與歷史上流失的會員相同，其餘 18% 與留存的會員相同，因此被判定為流失", "C": "給定該會員的特徵 X（如登入頻率、客訴次數）時，模型估計其流失的條件機率 P(流失|X) 為 0.82", "D": "模型對所有會員的預測有 82% 是正確的，此數值就是模型的準確率，與這位會員無關"}, "answer": "C", "explanation": "答案 C。分類模型學的就是條件機率 P(Y|X)：看到某位會員的特徵 X 之後，估計其標籤為「流失」的機率，所以 0.82 是這位會員在其特徵條件下的流失機率，反映模型的信心。它不是整體流失比例（那是邊際機率 P(流失)，不隨個別會員改變），也不是整體預測正確的比例（準確率）。", "per_option": {"A": "整體流失比例是邊際機率，不會因單一會員的特徵而不同。", "B": "輸出機率不是「特徵相同的比例」，而是依特徵估計的標籤機率。", "C": "正確：輸出機率＝給定特徵下標籤的條件機率 P(Y|X)。", "D": "準確率是整體預測正確的比例，與單筆預測輸出的機率意義不同。"}, "guide_ref": "學習指引 p.3-5～3-6（條件機率與分類模型學習 P(Y|X)）", "hot": true}, {"no": 2, "section": "3.1", "topic_id": "3.1-04", "topic": "參數估計與假設檢定", "style": "情境", "stem": "某團隊用假設檢定篩選特徵：對 20 個候選特徵各自檢定「與目標變數是否有顯著相關」，每次檢定都採顯著水準 α = 0.05。假設事實上這 20 個特徵都與目標變數毫無關係（每個檢定的虛無假設 H0 皆為真）。下列對此情況的敘述何者正確？", "options": {"A": "預期約有 1 個特徵被誤判為顯著；至少誤判 1 個的機率約 64%（1 − 0.95²⁰）", "B": "不會出現任何誤判，因為所有特徵實際上都與目標無關，p 值必然大於 0.05", "C": "預期約有 19 個特徵被誤判為顯著，因為 α = 0.05 代表有 95% 的檢定結果會是顯著", "D": "至少誤判 1 個的機率仍是 5%，因為整體誤判機率等於單一檢定的 α，與檢定個數無關"}, "answer": "A", "explanation": "答案 A。即使 H0 為真，每項檢定仍有 α = 5% 的機率誤判為顯著（型 I 錯誤）。20 項檢定下，預期誤判 20 × 0.05 = 1 項；至少誤判 1 項的機率為 1 − 0.95²⁰ ≈ 0.642，約 64%（Python 驗算 0.6415）。這就是多重檢定問題，大量篩選特徵時需校正（例如 Bonferroni 法改用 α ÷ 20）。", "per_option": {"A": "正確：每項檢定誤判機率 5%，20 項合計預期 1 個，至少 1 個的機率為 1 − 0.95²⁰ ≈ 64%。", "B": "p 值在 H0 為真時是隨機的，約有 5% 的機會小於 0.05，不是必然大於 0.05。", "C": "α = 0.05 是 H0 為真時誤判的機率，不是「95% 會顯著」；預期誤判數是 20 × 0.05 = 1。", "D": "單一檢定的 α 是 5%，但多項檢定下「至少一個誤判」的機率會隨檢定個數上升。"}, "guide_ref": "學習指引 p.3-7（假設檢定與顯著水準）；多重檢定校正指引未載", "hot": false}, {"no": 3, "section": "3.2", "topic_id": "3.2-02", "topic": "線性變換的幾何", "style": "情境", "stem": "某資料團隊以矩陣 A = [[1, 2], [0, 1]] 對二維特徵向量做線性變換 x' = Ax。他們觀察到：向量 (1, 0) 變換後仍為 (1, 0)，向量 (0, 1) 變成 (2, 1)，向量 (1, 1) 變成 (3, 1)，而且 A 的行列式為 1（面積不變、可逆）。這個變換的幾何性質最接近下列何者？", "options": {"A": "旋轉（Rotation）：每個向量的長度保持不變，只有方向改變", "B": "投影（Projection）：把向量壓到一條直線上，部分資訊遺失而無法還原", "C": "等比例縮放（Uniform Scaling）：所有向量依相同倍數放大或縮小，方向保持不變", "D": "剪切（Shearing）：沿 x 方向依 y 的大小做傾斜，方格被推成平行四邊形"}, "answer": "D", "explanation": "答案 D。矩陣 A 把 (0, 1) 變成 (2, 1)：x 座標被加上 2 倍的 y，而 y 座標不變；(1, 0) 不動、(1, 1) 變成 (3, 1)。這是沿 x 方向的剪切，單位方格被推成平行四邊形，行列式為 1，所以面積不變且可逆。旋轉必須保持長度，但 (0, 1) 的長度 1 變成 (2, 1) 的長度 √5；投影的行列式為 0（降維、不可逆）；等比例縮放不會改變方向，但 (0, 1) 的方向變了。", "per_option": {"A": "旋轉不改變長度，但 (0, 1) 的長度由 1 變成 √5。", "B": "投影的行列式為 0 且不可逆，本矩陣的行列式為 1。", "C": "等比例縮放不改變方向，但 (0, 1) 變成 (2, 1) 方向已改變。", "D": "正確：x 座標隨 y 傾斜、y 不變、行列式為 1，是剪切。"}, "guide_ref": "學習指引 p.3-11～3-13（縮放、旋轉、剪切、投影）", "hot": false}, {"no": 4, "section": "3.2", "topic_id": "3.2-03", "topic": "特徵值分解", "style": "計算", "stem": "某特徵工程師對兩個已置中的特徵求得協方差矩陣 Σ = [[3, 1], [1, 3]]，並對 Σ 做特徵值分解以進行 PCA。下列對分解結果的敘述何者正確？", "options": {"A": "特徵值皆為 3（取自對角線）；兩個方向各解釋 50%，任選一軸都可當第一主成分", "B": "特徵值為 4 與 2；第一主成分方向為 (1, 1)/√2，約解釋 66.7% 的總變異", "C": "特徵值為 6 與 0；兩個特徵完全共線，第一主成分解釋 100% 的總變異", "D": "特徵值為 4 與 2；較小的特徵值 2 所對應的 (1, −1)/√2 才是第一主成分，約解釋 33.3%"}, "answer": "B", "explanation": "答案 B。解 det(Σ − λI) = (3 − λ)² − 1 = 0，得 λ = 4 或 2。λ = 4 對應 v = (1, 1)/√2，λ = 2 對應 (1, −1)/√2。變異最大的主成分對應最大特徵值，解釋比例 = 4 ÷ (4 + 2) ≈ 66.7%。特徵值和 6 等於 Σ 的跡（3 + 3），但特徵值不是對角線元素本身。Python（numpy.linalg.eigh）驗算特徵值為 2 與 4。", "per_option": {"A": "對角線元素只是各特徵的變異；有共變異 1 時特徵值會變成 4 與 2。", "B": "正確：λ = 4、2，最大者 4 對應 (1, 1)/√2，占 4÷6 ≈ 66.7%。", "C": "特徵值和雖為 6，但特徵相關係數是 1/3 而非 1，特徵值不是 6 與 0。", "D": "主成分對應「最大」特徵值，較小者對應的是第二主成分，解釋比例也不是第一主成分的。"}, "guide_ref": "學習指引 p.3-13～3-14（特徵值分解與 PCA）", "hot": false, "detail": {"steps": [["① 列出特徵值方程式（特徵值 λ 就是「矩陣只把某方向拉長、不轉向」時的拉長倍數）", "det(Σ － λI) ＝ 0；2×2 矩陣 [[a, b], [b, d]] 的 det ＝ (a－λ)(d－λ) － b²（I 是單位矩陣，只是把對角線減掉 λ）", "＝ (3－λ)(3－λ) － 1×1 ＝ (3－λ)² － 1 ＝ 0"], ["② 解出 λ", "(3－λ)² ＝ 1 → 3－λ ＝ ±1 → λ ＝ 3 ∓ 1", "λ ＝ 3－1 ＝ 2，或 λ ＝ 3＋1 ＝ 4；所以特徵值是 4 與 2（不是對角線的 3 與 3）"], ["③ 求 λ＝4 的特徵向量（第一主成分方向）", "(Σ － λI)v ＝ 0，v ＝ (v₁, v₂)", "(Σ－4I) ＝ [[－1, 1], [1, －1]]，第 1 列：－v₁ ＋ v₂ ＝ 0 → v₂ ＝ v₁ → v ＝ (1, 1)；長度 √(1²＋1²) ＝ √2，單位化 ＝ (1, 1)/√2"], ["④ 求 λ＝2 的特徵向量", "(Σ － λI)v ＝ 0", "(Σ－2I) ＝ [[1, 1], [1, 1]]，第 1 列：v₁ ＋ v₂ ＝ 0 → v₂ ＝ －v₁ → v ＝ (1, －1)/√2（這是第二主成分）"], ["⑤ 算各主成分解釋的變異比例", "解釋比例 ＝ 該特徵值 ÷ 所有特徵值總和", "第一主成分：4 ÷ (4＋2) ＝ 4 ÷ 6 ≈ 0.667 ≈ 66.7%；第二主成分：2 ÷ 6 ≈ 33.3%"], ["⑥ 驗算：特徵值總和 ＝ 跡（對角線加總）", "跡 ＝ Σ 的對角線元素相加 ＝ 所有特徵值相加", "＝ 3 ＋ 3 ＝ 6 ＝ 4 ＋ 2（吻合；但「總和相等」不代表特徵值就等於對角線元素）"]], "tip": "PCA：最大的特徵值對應第一主成分；解釋比例 ＝ 特徵值 ÷ 特徵值總和；特徵值總和 ＝ 對角線加總（跡）。"}}, {"no": 5, "section": "3.3", "topic_id": "3.3-02", "topic": "非凸與局部最優", "style": "情境", "stem": "某團隊需要一個「不論梯度下降從哪個初始值出發，都會收斂到同一個全域最小值」的訓練設定，好讓結果可重現、方便向稽核單位說明。下列哪一種模型與損失的組合，其損失函數對參數而言是凸函數，最符合此需求？", "options": {"A": "含兩層隱藏層、使用 ReLU 的多層感知器搭配均方誤差損失", "B": "線性迴歸（特徵彼此不共線）搭配均方誤差損失", "C": "矩陣分解推薦模型（使用者矩陣 U 與物品矩陣 V 同時學習）搭配重建誤差", "D": "深度自編碼器搭配重構誤差損失"}, "answer": "B", "explanation": "答案 B。線性迴歸搭配 MSE 的損失是參數的二次函數（凸的碗形），特徵不共線時有唯一的全域最小值，不論初始值為何，學習率適當的梯度下降都會走到同一點。含隱藏層與非線性激活的網路、矩陣分解（U 與 V 相乘後同時學習，兩組參數交互作用）、深度自編碼器的損失皆為非凸，存在多個局部最小值與鞍點，結果會受初始值影響。", "per_option": {"A": "含隱藏層與 ReLU 的網路損失為非凸，會有多個局部最小與鞍點。", "B": "正確：線性迴歸＋MSE 為凸問題，只有唯一全域最小值。", "C": "U 與 V 同時學習形成雙線性結構，整體為非凸，結果依初始值而異。", "D": "深度自編碼器本質是深度網路，損失為非凸，結果依初始值而異。"}, "guide_ref": "學習指引 p.3-20～3-21（凸與非凸）", "hot": false}, {"no": 6, "section": "3.3", "topic_id": "3.3-03", "topic": "損失函數選擇", "style": "計算", "stem": "某迴歸模型在一小批資料上的預測殘差（實際值 − 預測值）分別為 0.5、−2、4。工程師改用 Huber 損失（δ = 1）訓練：殘差絕對值 ≤ δ 時損失為 ½r²；超過 δ 時損失為 δ(|r| − ½δ)。這批資料的平均 Huber 損失最接近下列何者？", "options": {"A": "約 1.71：三筆損失為 0.125、1.5、3.5，取平均", "B": "約 6.75：把三個殘差平方後取平均，不依 δ 切換公式", "C": "約 2.17：把三個殘差取絕對值後取平均，不依 δ 切換公式", "D": "約 3.38：三個殘差都以 ½r² 計算後取平均，超過 δ 也不改成線性"}, "answer": "A", "explanation": "答案 A。|0.5| ≤ 1，損失 ½ × 0.5² = 0.125；|−2| > 1，損失 1 × (2 − 0.5) = 1.5；|4| > 1，損失 1 × (4 − 0.5) = 3.5。平均 = (0.125 + 1.5 + 3.5) ÷ 3 ≈ 1.708。對照：MSE = (0.25 + 4 + 16) ÷ 3 = 6.75；MAE = 6.5 ÷ 3 ≈ 2.17；全部用 ½r² = 10.125 ÷ 3 = 3.375。Huber 對大殘差只線性增加，所以比 MSE 小很多（Python 驗算）。", "per_option": {"A": "正確：0.125、1.5、3.5 平均約 1.71。", "B": "這是 MSE，大殘差被平方放大，不是 Huber。", "C": "這是 MAE，小殘差也用絕對值計算，不是 Huber。", "D": "這是對大殘差也套用 ½r²（等於 MSE 的一半），沒有在 δ 之外改用線性。"}, "guide_ref": "學習指引 p.3-21～3-23（MSE、MAE、Huber）", "hot": true, "detail": {"steps": [["① 寫出 Huber 損失公式（小誤差像 MSE、大誤差像 MAE，所以不怕離群值）", "|r| ≤ δ：L ＝ ½ × r²；|r| ＞ δ：L ＝ δ × (|r| － ½δ)（r＝殘差＝實際值－預測值；|r| 是取絕對值）", "題目 δ ＝ 1"], ["② 第 1 筆 r ＝ 0.5（|0.5| ≤ 1，用平方那條）", "L ＝ ½ × r²", "＝ ½ × 0.5² ＝ ½ × 0.25 ＝ 0.125"], ["③ 第 2 筆 r ＝ －2（|－2| ＝ 2 ＞ 1，用線性那條）", "L ＝ δ × (|r| － ½δ)", "＝ 1 × (2 － ½×1) ＝ 1 × 1.5 ＝ 1.5"], ["④ 第 3 筆 r ＝ 4（|4| ＞ 1，用線性那條）", "L ＝ δ × (|r| － ½δ)", "＝ 1 × (4 － 0.5) ＝ 3.5"], ["⑤ 取平均", "平均損失 ＝ 各筆損失總和 ÷ 筆數", "＝ (0.125 ＋ 1.5 ＋ 3.5) ÷ 3 ＝ 5.125 ÷ 3 ≈ 1.708 ≈ 1.71"], ["⑥ 對照其他選項（算法錯在哪）", "MSE ＝ 殘差平方的平均；MAE ＝ 殘差絕對值的平均；全部用 ½r² ＝ MSE 的一半", "B（MSE）：(0.25＋4＋16) ÷ 3 ＝ 6.75；C（MAE）：(0.5＋2＋4) ÷ 3 ＝ 6.5 ÷ 3 ≈ 2.17；D：(0.125＋2＋8) ÷ 3 ＝ 10.125 ÷ 3 ＝ 3.375 ≈ 3.38"]], "tip": "Huber：|殘差| ≤ δ 用 ½r²，超過 δ 就改成線性 δ(|r|－½δ)；大誤差只線性增加，所以比 MSE 小很多。"}}, {"no": 7, "section": "3.3", "topic_id": "3.3-04", "topic": "小批次梯度下降", "style": "情境", "stem": "在討論訓練策略時，A 同事主張：「小批次梯度下降每次只看一小部分資料，算出的梯度方向和用全部資料算出的不一樣，長期更新下來一定會把模型帶偏，所以必須用全批次。」下列對此主張的回應何者最正確？", "options": {"A": "小批次梯度與全批次梯度完全相同，因為每筆樣本的梯度都會乘上批次大小加以補償，所以不會有任何差異", "B": "小批次梯度確實會系統性偏離，但搭配動量即可完全消除偏差，所以仍可使用，不需其他處理", "C": "此說法只在資料少於一千筆時成立；資料量更大時，小批次必須改成全批次才能收斂", "D": "只要是隨機抽樣，小批次梯度的期望值就等於全批次梯度，只是雜訊較大；多次更新後雜訊會互相抵消"}, "answer": "D", "explanation": "答案 D。隨機抽樣的小批次梯度是全批次梯度的無偏估計：期望值相同，只是多了抽樣雜訊（批次越小雜訊越大）。雜訊方向隨機，多次更新後會互相抵消，整體仍朝損失下降的方向前進，所以小批次梯度下降能收斂到與全批次相近的解，同時計算與記憶體成本更低、也能利用 GPU 平行運算。", "per_option": {"A": "小批次梯度並不完全相同，兩者差在抽樣雜訊，沒有「乘上批次大小補償」這回事。", "B": "隨機抽樣的小批次沒有系統性偏差，不需要靠動量消除；動量的作用是累積方向、平滑震盪。", "C": "與資料量無關；資料越大，全批次越昂貴，小批次反而更適合。", "D": "正確：小批次梯度無偏，只是變異較大，雜訊會平均抵消。"}, "guide_ref": "學習指引 p.3-23～3-24（GD／SGD／Mini-batch）；無偏估計的說法指引未載", "hot": false}, {"no": 8, "section": "3.3", "topic_id": "3.3-05", "topic": "動量與 Adam", "style": "情境", "stem": "某團隊以 Adagrad 訓練推薦模型。訓練前期損失下降良好，但到第 40 個 epoch 以後，損失幾乎不再下降，而此時梯度仍明顯不為零，也沒有過擬合跡象。若初始學習率設定合理，最可能的原因與較合適的改善方式為何？", "options": {"A": "Adagrad 內建動量，累積的動量過大使參數衝過最低點；應調低動量係數並繼續使用 Adagrad", "B": "Adagrad 只能處理稠密特徵，遇到稀疏特徵就會完全停止更新；應改用固定學習率的 SGD 並手動調高學習率", "C": "Adagrad 持續累加歷史梯度平方，有效學習率趨近於零；可改用 RMSprop 或 Adam，只保留近期梯度資訊", "D": "Adagrad 每一步都會把學習率放大，後期步伐過大使損失在最低點附近來回震盪而停滯；應加上梯度裁剪即可"}, "answer": "C", "explanation": "答案 C。Adagrad 為每個參數累加歷史梯度的平方，分母單調變大，有效學習率只減不增，後期可能小到幾乎不再更新（學習指引也把「學習率過度衰減而停止收斂」列為其限制）。RMSprop 改用滑動平均，只保留近期梯度平方，修正衰減過快的問題；Adam 再加上動量。Adagrad 本身沒有動量，且正是為稀疏特徵設計的。", "per_option": {"A": "Adagrad 沒有動量機制，問題不在動量過大。", "B": "Adagrad 適合稀疏特徵與不均衡的參數更新，並非不能處理稀疏特徵。", "C": "正確：歷史梯度平方持續累加使學習率過度衰減，RMSprop／Adam 以滑動平均改善。", "D": "Adagrad 的有效學習率是不斷縮小而不是放大，梯度裁剪也不是對症的做法。"}, "guide_ref": "學習指引 p.3-25～3-26（Adagrad 限制、RMSprop 修正）", "hot": true}, {"no": 9, "section": "4.1", "topic_id": "4.1-02", "topic": "監督式學習", "style": "情境", "stem": "某客服中心以監督式學習訓練工單分類模型（共 6 個類別）。標註團隊內部審查發現：同一批工單由兩位標註員各自標示，類別一致的比例僅約 65%，且標註規範對「帳務問題」與「退款申請」的界線描述模糊。模型在測試集上的表現始終停滯。依監督式學習的特性，最優先的處理方向為何？", "options": {"A": "先釐清標註規範、提高標註一致性，必要時重新標註，因為標籤品質決定模型能學到的上限", "B": "改用層數更深的神經網路，深度模型能自動校正人工標註造成的不一致", "C": "把訓練 epoch 增加到原本的 10 倍，讓模型多看幾次就能分辨相互矛盾的標籤", "D": "改用分群讓模型自行找出類別，完全不再使用人工標籤"}, "answer": "A", "explanation": "答案 A。監督式學習靠「特徵＋正確答案（標籤）」學習，成敗高度仰賴標註品質。標註員之間只有 65% 一致，代表標籤本身含有大量雜訊與矛盾，模型再強也學不到穩定的規則。應優先修正標註規範、提升一致性並重新標註。加深網路或加長訓練只會讓模型更貼近雜訊；改用分群會放棄已有的任務定義，無法保證分出業務需要的 6 類。", "per_option": {"A": "正確：標籤品質是監督式學習的天花板，先修標註。", "B": "更深的網路不會自動修正矛盾標籤，反而更容易記住雜訊。", "C": "訓練更久只會讓模型擬合矛盾標籤，無法解決標註不一致。", "D": "分群不保證對應業務定義的 6 類，也等於放棄已有的標註資產。"}, "guide_ref": "學習指引 p.4-5～4-7（監督式學習流程與標註品質）", "hot": false}, {"no": 10, "section": "4.2", "topic_id": "4.2-12", "topic": "K 最近鄰 KNN", "style": "情境", "stem": "某團隊用 KNN 做客戶分類，原本使用 12 個有意義的特徵，準確率不錯。後來為了「多給點資訊」，又加入 400 個與目標幾乎無關的衍生特徵（皆已標準化），KNN 的準確率反而明顯下降。下列對此現象的解釋與對策何者最適當？", "options": {"A": "標準化後的特徵會使 KNN 的距離公式失效；應還原為原始尺度再計算距離，才能得到正確的鄰居", "B": "KNN 在特徵數超過樣本數的平方根時，訓練階段會因權重過多而過擬合；應增加訓練 epoch", "C": "新增特徵使預測速度變慢，進而降低準確率；只要換成更快的硬體即可恢復", "D": "大量無關維度使點與點的距離趨於接近，「最近」的鄰居失去區辨力；應做特徵選擇或降維"}, "answer": "D", "explanation": "答案 D。KNN 完全依賴距離。維度很高且多數特徵無關時，各點之間的距離差異縮小（維度詛咒），「最近的 K 個」不再代表真正相似，準確率因而下降。對策是特徵選擇或降維（如 PCA），只保留有資訊的特徵。標準化是 KNN 的正確前處理，不會使距離失效；KNN 沒有訓練 epoch 這回事；預測變慢只影響速度，不影響準確率。", "per_option": {"A": "標準化讓各特徵尺度一致，正是 KNN 需要的前處理。", "B": "KNN 是惰性學習，沒有訓練權重與 epoch 可以調整。", "C": "速度與準確率是兩回事，換硬體不會恢復準確率。", "D": "正確：維度詛咒使距離失去區辨力，應減少無關維度。"}, "guide_ref": "學習指引 p.4-32～4-34（KNN 與維度詛咒）", "hot": false}, {"no": 11, "section": "4.2", "topic_id": "4.2-15", "topic": "階層式分群", "style": "否定", "stem": "某分析師正在評估是否用階層式分群（Hierarchical Clustering）處理 3 萬筆客戶資料。下列關於階層式分群的敘述，何者錯誤？", "options": {"A": "凝聚式分群從每個資料點各自成一群開始，每一步合併距離最近、最相似的兩群，直到只剩一群", "B": "凝聚式分群在後續步驟若發現先前的合併不理想，可自動撤銷該次合併並重新分配資料點", "C": "不必事先指定群數，可由樹狀圖在不同高度切割，得到不同粒度的分群結果，再依需求挑選群數", "D": "資料量很大時，計算與記憶體成本會明顯增加，效率不如許多其他分群方法（例如 K-Means）"}, "answer": "B", "explanation": "答案 B（題目問錯誤者）。階層式分群的合併（或分裂）一旦完成就不能撤銷，之後只能在既有結果上繼續，因此可能得到次優解。其餘敘述皆正確：凝聚式由下而上逐步合併最相似的兩群；不需預設群數，由樹狀圖決定切割位置；資料多時計算複雜度高、效率較低。", "per_option": {"A": "正確：凝聚式是由下而上逐步合併。", "B": "錯誤敘述：階層式分群的合併不可撤銷，不會自動回頭重新分配。", "C": "正確：樹狀圖可在不同高度切割，不用預先指定群數。", "D": "正確：大資料上計算與記憶體成本高。"}, "guide_ref": "學習指引 p.4-42～4-43（階層式分群的優缺點）", "hot": false}, {"no": 12, "section": "4.2", "topic_id": "4.2-17", "topic": "t-SNE/UMAP", "style": "情境", "stem": "某分析師把 128 維的客戶行為向量用 t-SNE 降到 2 維後作圖，看到 A、B 兩群緊鄰，而 C 群遠離兩者，便向主管報告：「A 與 B 的客戶特性最相似，C 與兩者的差異遠大於 A、B 之間的差異。」下列對此解讀的評論何者最適當？", "options": {"A": "t-SNE 以線性投影保留全域距離，圖上群間距離與原空間距離成固定比例，解讀正確，可直接據此排序群間差異", "B": "只要把 perplexity 調到最大，圖上的群間距離就保證與原空間距離完全一致，不必再另外檢驗", "C": "t-SNE 主要保留局部鄰近關係，群間距離與群的大小沒有可靠的定量意義，結論需用其他方法佐證", "D": "t-SNE 的座標軸代表原始特徵中變異最大的方向，離原點越遠代表該群的特徵值越大"}, "answer": "C", "explanation": "答案 C。t-SNE 擅長讓高維中相近的點在低維也靠近（局部結構），但不保證全域結構：兩群在圖上的距離、群的大小與密度都不能直接解讀為真實的相似度或差異大小，且每次執行結果略有不同、也受 perplexity 影響。想比較群間差異應回到原空間計算距離，或搭配 UMAP、PCA 等方法交叉檢查。t-SNE 是非線性方法，座標軸也沒有「原始特徵」的意義。", "per_option": {"A": "t-SNE 是非線性降維，不保證全域距離比例。", "B": "perplexity 只影響鄰域範圍，無法保證全域距離一致。", "C": "正確：t-SNE 只可靠地保留局部鄰近關係，群間距離與群大小不宜直接解讀。", "D": "t-SNE 的座標軸沒有可對應原始特徵的意義，不同於 PCA 的主成分方向。"}, "guide_ref": "學習指引 p.4-44～4-47（t-SNE 與 UMAP）", "hot": false}, {"no": 13, "section": "4.2", "topic_id": "4.2-18", "topic": "Apriori", "style": "計算", "stem": "某超市以 Apriori 演算法做購物籃分析，已知頻繁 2-項集為 {A,B}、{A,C}、{B,C}、{B,D}（其餘 2-項集皆不頻繁）。依 Apriori 性質做「連接後剪枝」，下一輪需要掃描資料計數的候選 3-項集為何？", "options": {"A": "只有 {A,B,C}，因為只有它的 3 個 2-項子集皆為頻繁", "B": "{A,B,C} 與 {A,B,D}，因為 {A,B}、{B,D} 皆為頻繁", "C": "{A,B,C} 與 {B,C,D}，因為每個候選都含有至少兩個頻繁的 2-項子集", "D": "{A,B,C}、{A,B,D}、{A,C,D}、{B,C,D} 四個全部都要計數，剪枝只用在最後一層"}, "answer": "A", "explanation": "答案 A。先連接頻繁 2-項集，得到候選 {A,B,C}（由 {A,B}、{A,C}）與 {B,C,D}（由 {B,C}、{B,D}）。剪枝時檢查所有 2-項子集是否都頻繁：{A,B,C} 的子集 {A,B}、{A,C}、{B,C} 皆頻繁，保留；{B,C,D} 的子集 {C,D} 不頻繁，剪掉。{A,B,D} 含不頻繁的 {A,D}，同樣不可能成為候選。因此只需對 {A,B,C} 計數。依據是 Apriori 性質：不頻繁項集的任何超集一定也不頻繁。", "per_option": {"A": "正確：只有 {A,B,C} 的所有 2-項子集皆頻繁。", "B": "{A,B,D} 含有不頻繁的 {A,D}，必須剪掉。", "C": "{B,C,D} 含有不頻繁的 {C,D}，必須剪掉；「至少兩個」不是剪枝條件，要求是全部子集都頻繁。", "D": "剪枝是每一層產生候選時就要做，目的就是減少計數的候選數。"}, "guide_ref": "學習指引 p.4-48～4-49（Apriori 性質與剪枝）", "hot": false, "detail": {"steps": [["① 連接（Join）：把兩個「前面幾項相同」的 2-項集合併成 3-項集", "兩個 k-項集，若前 k－1 項相同，就合併成一個 (k＋1)-項集（項目先按字母排序）", "頻繁 2-項集：AB、AC、BC、BD。AB 與 AC 前 1 項都是 A → 合併成 ABC；BC 與 BD 前 1 項都是 B → 合併成 BCD；其餘沒有相同前綴 → 連接後的候選：ABC、BCD"], ["② 剪枝（Prune）的規則（Apriori 性質：不頻繁項集的任何超集一定也不頻繁）", "候選 3-項集的「全部」2-項子集都必須是頻繁的，只要有一個不頻繁就剪掉（不是「至少兩個」）", "3-項集共有 3 個 2-項子集（拿掉其中一項各得一個）"], ["③ 檢查 ABC", "ABC 的 2-項子集 ＝ AB、AC、BC", "AB 頻繁、AC 頻繁、BC 頻繁 → 3 個都頻繁 → 保留"], ["④ 檢查 BCD", "BCD 的 2-項子集 ＝ BC、BD、CD", "BC 頻繁、BD 頻繁，但 CD 不在頻繁清單 → 剪掉"], ["⑤ 對照選項 B 的 ABD（它連接階段就不會產生，就算硬檢查也過不了）", "ABD 的 2-項子集 ＝ AB、AD、BD", "AB 頻繁、BD 頻繁，但 AD 不頻繁 → 不能成為候選；因此需要計數的候選 ＝ 只有 {A,B,C}，共 1 個"]], "tip": "Apriori 剪枝：候選的「每一個」子集都要頻繁，只要有一個不頻繁就剪掉，剪完才去掃資料計數。"}}, {"no": 14, "section": "4.2", "topic_id": "4.2-19", "topic": "FP-Growth", "style": "計算", "stem": "某店有 5 筆交易：T1={A,B,D}、T2={A,B,C}、T3={B,C,E}、T4={A,B,C,D}、T5={B,C,E,F}。以 FP-Growth 處理，最小支持次數為 3。第一次掃描後只保留頻繁項，並依支持次數由高到低排序；第二次掃描時把每筆交易依此順序插入 FP 樹。建好的 FP 樹（不含根節點）共有幾個節點？", "options": {"A": "3 個，因為每個頻繁項在樹上只會出現一個節點", "B": "4 個，因為共用相同前綴的路徑會共用節點", "C": "5 個，因為每筆交易對應一個節點", "D": "12 個，因為樹上節點數等於所有保留項目出現次數的總和"}, "answer": "B", "explanation": "答案 B。第一次掃描：支持次數 B=5、C=4、A=3、D=2、E=2、F=1，最小支持次數 3 → 保留 B、C、A，排序為 B > C > A。各交易過濾排序後：T1=[B,A]、T2=[B,C,A]、T3=[B,C]、T4=[B,C,A]、T5=[B,C]。插入後樹為 B(5) 下有 C(4) 與 A(1)，C 之下有 A(2)，共 4 個節點（B、C、A、A）。同一項目可因路徑不同而有多個節點；共用前綴的交易會共用節點，所以也不是 12 個。", "per_option": {"A": "同一個項目在不同路徑上會是不同節點，A 就出現在兩條路徑。", "B": "正確：節點為 B(5)、C(4)、C 之下的 A(2)、B 之下的 A(1)，共 4 個。", "C": "交易會共用相同前綴的節點，不是一筆交易一個節點。", "D": "共用前綴正是 FP 樹壓縮資料的方式，節點數遠少於項目出現次數總和。"}, "guide_ref": "學習指引 p.4-49～4-50（FP 樹的建構步驟）", "hot": false, "detail": {"steps": [["① 第一次掃描：數每個項目出現在幾筆交易", "支持次數 ＝ 該項目出現在幾筆交易中", "A：T1、T2、T4 ＝ 3；B：5 筆全有 ＝ 5；C：T2、T3、T4、T5 ＝ 4；D：T1、T4 ＝ 2；E：T3、T5 ＝ 2；F：T5 ＝ 1"], ["② 刪掉不頻繁的，剩下的由高到低排序", "保留條件：支持次數 ≥ 最小支持次數（3）", "B(5)、C(4)、A(3) 保留（D、E、F 小於 3，刪掉）；排序 ＝ B ＞ C ＞ A"], ["③ 每筆交易只留下頻繁項，並照 B、C、A 的順序重排", "交易 → 刪不頻繁項 → 依排序重排", "T1{A,B,D} → [B, A]；T2{A,B,C} → [B, C, A]；T3{B,C,E} → [B, C]；T4{A,B,C,D} → [B, C, A]；T5{B,C,E,F} → [B, C]"], ["④ 逐筆插入 FP 樹，並數「新增」的節點", "插入規則：路徑上已有的前綴就共用並把計數 ＋1；沒有的才新增節點", "T1：新增 B、A（B 下面的 A）＝ 2 個；T2：B 共用，新增 C、A（C 下面的 A）＝ 2 個；T3：B、C 都共用 ＝ 0；T4：B、C、A 都共用 ＝ 0；T5：B、C 都共用 ＝ 0"], ["⑤ 加總節點數", "節點總數 ＝ 各筆交易新增的節點數相加", "＝ 2 ＋ 2 ＋ 0 ＋ 0 ＋ 0 ＝ 4 個：B(5)、C(4)、C 底下的 A(2)、B 底下的 A(1)（兩個 A 路徑不同，所以是兩個節點）"]], "tip": "FP 樹：先數次數、刪掉不頻繁、依次數排序，再插入；共用前綴就共用節點，同一項目走不同路徑會是不同節點。"}}, {"no": 15, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "否定", "stem": "某團隊正在檢視一個影像分類用的卷積神經網路（CNN），下列關於 CNN 各層特性的敘述，何者錯誤？", "options": {"A": "卷積層的參數量只取決於卷積核大小、輸入通道數與核數量，與輸入影像的寬高無關", "B": "使用 stride = 2 的卷積可使輸出特徵圖的寬高縮小，達到類似降採樣的效果", "C": "同一個卷積核在整張特徵圖上共用同一組權重，因此能偵測出現在不同位置的相同圖樣", "D": "池化層（Pooling）含有大量可訓練的權重，是 CNN 參數量的主要來源之一"}, "answer": "D", "explanation": "答案 D（題目問錯誤者）。最大池化與平均池化只對區域取最大值或平均值，沒有任何可訓練參數（參數量為 0）；CNN 的參數主要來自卷積核與後段的全連接層。其餘三項皆正確：卷積層參數量 = 核高 × 核寬 × 輸入通道 × 核數量 ＋ 偏差，與影像寬高無關（權重共享）；stride = 2 會使輸出的寬高約縮小一半；共用權重使卷積核能在不同位置偵測相同圖樣。", "per_opti
