<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>科目三考前 14 回</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 版面概念同資安「考前大猜題」：電腦閱卷答案卡。紙面＋卡紅格線，左邊題目，右邊（窄螢幕在題目下方）是可點的劃記卡 */
:root {
  --paper: #fbfaf8;
  --sheet: #ffffff;
  --ink: #1f2a3a;
  --ink-soft: #5b6676;
  --line: #ecd3d0;
  --card-red: #c2413a;
  --card-red-soft: #f7e4e2;
  --pencil: #2b2f36;
  --ok: #1f7a55;
  --ok-soft: #e1f2ea;
  --bad: #b3361f;
  --bad-soft: #fbe6e1;
  --news: #8a5a00;
  --news-soft: #fbf0d9;
  --f-display: "LXGW WenKai TC", "Noto Serif TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15181d; --sheet: #1c2027; --ink: #e8e9ec; --ink-soft: #a3abb8; --line: #4a2f2e;
    --card-red: #ef7d74; --card-red-soft: #3a2422; --pencil: #e8e9ec;
    --ok: #5fd3a0; --ok-soft: #173328; --bad: #ff8f78; --bad-soft: #3c211b; --news: #f2c060; --news-soft: #33290f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15181d; --sheet: #1c2027; --ink: #e8e9ec; --ink-soft: #a3abb8; --line: #4a2f2e;
  --card-red: #ef7d74; --card-red-soft: #3a2422; --pencil: #e8e9ec;
  --ok: #5fd3a0; --ok-soft: #173328; --bad: #ff8f78; --bad-soft: #3c211b; --news: #f2c060; --news-soft: #33290f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 60px;
}
button, select { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--card-red); outline-offset: 2px; }
a { color: var(--card-red); }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; min-width: 0; }
.wrap > * { min-width: 0; }
header.top { display: grid; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--card-red); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 5vw, 42px); line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-soft); margin: 0; max-width: 62ch; }
.sub b { font-family: var(--f-mono); color: var(--card-red); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; border: 1.5px solid var(--card-red); border-radius: 6px; overflow: hidden; max-width: 100%; }
.seg button { background: transparent; border: 0; padding: 6px 14px; font-weight: 500; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--card-red); color: var(--sheet); }
.seg .n { font-family: var(--f-mono); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 2px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--card-red); background: var(--card-red-soft); color: var(--card-red); font-weight: 700; }
.chip .n { font-family: var(--f-mono); font-size: 12px; margin-left: 4px; opacity: .8; }
select.chip { padding: 3px 10px; max-width: 100%; }

/* 回數選單（按「第 N 回 ▾」展開） */
.roundpanel { background: var(--sheet); border: 1.5px solid var(--card-red); border-radius: 4px; padding: 12px; display: grid; gap: 8px; }
.roundpanel .note { margin: 0; }
.rounds { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.rd { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 6px 10px; text-align: left; display: grid; gap: 0; position: relative; }
.rd:hover { border-color: var(--card-red); }
.rd .nm { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.rd .d { font-size: 12px; color: var(--ink-soft); }
.rd .s { font-family: var(--f-mono); font-size: 13px; color: var(--ink-soft); }
.rd .s.ok { color: var(--ok); } .rd .s.no { color: var(--bad); } .rd .s.go { color: var(--news); }
.rd.today { border: 1.5px solid var(--card-red); }
.rd.today::after { content: "今天"; position: absolute; top: 5px; right: 8px; font-size: 11px; font-weight: 700; color: var(--sheet); background: var(--card-red); border-radius: 3px; padding: 0 5px; line-height: 1.6; }
.rd.cur { background: var(--card-red-soft); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.nav .pos { font-family: var(--f-mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.nav .btn { padding: 9px 18px; }
.btn[disabled] { opacity: .35; cursor: default; }
.layout.one .stem { font-size: 19px; }
.layout.one .opt { padding: 11px 12px; }
.bub.cur { outline: 2px solid var(--card-red); outline-offset: 1px; }
.keys { font-size: 12px; color: var(--ink-soft); }
.modehint { margin: -8px 0 0; font-size: 14px; color: var(--ink-soft); }
/* 嵌在陪讀手機版裡：拿掉大標，讓題目多一點空間 */
html.embed header.top { display: none; }
html.embed body { padding-block: 12px 32px; }
html.embed .wrap { gap: 14px; }
.timer { font-family: var(--f-mono); font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.timer.low, .navtimer.low { color: var(--bad); font-weight: 700; }
.navtimer { font-family: var(--f-mono); font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
/* 考試模式的倒數鐘：黏在畫面上方，捲動時也看得到 */
.examclock { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  background: var(--sheet); border: 2px solid var(--card-red); border-radius: 6px; padding: 8px 14px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.examclock .t { font-family: var(--f-mono); font-size: 30px; font-weight: 600; line-height: 1; color: var(--card-red); font-variant-numeric: tabular-nums; }
.examclock .lbl { font-size: 14px; color: var(--ink-soft); }
.examclock .right { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.examclock .lim { font-size: 14px; color: var(--ink-soft); }
.examclock select { border: 1px solid var(--line); background: var(--sheet); border-radius: 4px; padding: 3px 6px; font-size: 14px; }
.examclock.low { background: var(--bad-soft); border-color: var(--bad); }
.examclock.low .t { color: var(--bad); }
.examclock.done .t { color: var(--ink); }
.nav .mid { display: grid; justify-items: center; gap: 0; }
.qlist { scroll-margin-top: 16px; }
.layout.exam .qlist { scroll-margin-top: 96px; }

/* 劃記卡 */
.card-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--sheet); border: 1.5px solid var(--card-red); border-radius: 4px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.layout.exam .card-panel { top: calc(env(safe-area-inset-top, 0px) + 84px); }
@media (max-width: 860px) { .card-panel, .layout.exam .card-panel { position: static; } }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--f-display); font-size: 18px; color: var(--card-red); }
.card-head .score { font-family: var(--f-mono); font-size: 14px; color: var(--ink); white-space: nowrap; }
.bubbles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px 6px; }
@media (max-width: 860px) { .bubbles { grid-template-columns: repeat(10, 1fr); } }
@media (max-width: 480px) { .bubbles { grid-template-columns: repeat(5, 1fr); } }
.bub { display: grid; place-items: center; height: 30px; min-width: 0; border: 1px solid var(--line); border-radius: 3px; background: transparent; font-family: var(--f-mono); font-size: 12px; color: var(--card-red); font-variant-numeric: tabular-nums; position: relative; padding: 0; }
.bub.done { background: var(--ok); color: var(--sheet); border-color: var(--ok); font-weight: 700; }
.bub.fl:not(.ok):not(.bad) { background: var(--news); color: var(--sheet); border-color: var(--news); font-weight: 700; }
.bub.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.bub.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.bub.dim { opacity: .25; }
.bub.fl.ok::after, .bub.fl.bad::after { content: ""; position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--news); }
.legend b { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.legend b.g { background: var(--ok); } .legend b.y { background: var(--news); }
.legend { font-size: 12px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--news); margin-right: 4px; vertical-align: middle; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1.5px solid var(--card-red); background: var(--card-red); color: var(--sheet); border-radius: 4px; padding: 6px 14px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--card-red); }
.note.hist .hbtn { padding: 2px 10px; margin: 2px 4px 2px 0; font-size: .92em; }
.confirm { font-size: 14px; background: var(--card-red-soft); border-radius: 4px; padding: 8px 10px; display: grid; gap: 6px; }
.note { font-size: 13px; color: var(--ink-soft); margin: 0; }

/* 題目 */
.qlist { display: grid; gap: 18px; min-width: 0; }
.q { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 18px 18px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; scroll-margin-top: 16px; min-width: 0; }
.q > * { min-width: 0; max-width: 100%; }
.layout.exam .q { scroll-margin-top: 96px; }
.q.focus { outline: 2px solid var(--card-red); outline-offset: 2px; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.qno { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--card-red); min-width: 2.2em; }
.meta { font-size: 13px; color: var(--ink-soft); }
.tag { font-size: 12px; border-radius: 3px; padding: 1px 7px; border: 1px solid var(--line); color: var(--ink-soft); }
.tag.t-hot { border-color: var(--card-red); color: var(--card-red); }
.tag.t-flag { border-color: var(--news); color: var(--news); background: var(--news-soft); }
.stem { font-size: 17px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
pre.code { font-family: var(--f-mono); font-size: 14px; line-height: 1.55; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; overflow-x: auto; white-space: pre; margin: 8px 0; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--card-red); }
.opt .ab { width: 26px; height: 26px; border: 1.5px solid var(--card-red); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; color: var(--card-red); }
.opt.picked .ab { background: var(--pencil); border-color: var(--pencil); color: var(--sheet); }
.opt.picked { border-color: var(--pencil); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ab { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.qfoot { display: flex; flex-wrap: wrap; gap: 8px; }
.flagbtn[aria-pressed="true"] { border-color: var(--news); color: var(--news); background: var(--news-soft); }
.reveal { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; font-size: 15px; overflow-wrap: anywhere; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.po { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.po li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; color: var(--ink-soft); }
.po li b { font-family: var(--f-mono); color: var(--ink); }
.why { background: var(--card-red-soft); border-radius: 4px; padding: 8px 12px; font-size: 14px; }
.why b { color: var(--card-red); }
.ref { font-size: 13px; color: var(--ink-soft); }
.showbtn { justify-self: start; }
/* 詳解（2026-11-10 加，第 9 回起）：計算題「步驟｜公式｜代入」表、程式碼題逐行表、混淆矩陣圖 */
.dt { display: grid; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.dt .dth { font-weight: 700; color: var(--card-red); letter-spacing: .04em; }
.dt .dtsub { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.dtw { overflow-x: auto; }
.dt table { border-collapse: collapse; width: 100%; font-size: 14px; }
.dt th, .dt td { text-align: left; vertical-align: top; padding: 6px 8px; border-top: 1px solid var(--line); }
.dt th { font-size: 12px; color: var(--ink-soft); border-top: 0; white-space: nowrap; }
.dt td.f { font-weight: 700; }
.dt td.cl { width: 42%; }
.dt td.cl code { font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sheet); padding: 1px 5px; border-radius: 3px; }
.dt .tip { font-size: 14px; border-left: 3px solid var(--card-red); padding-left: 8px; }
.dt svg { width: 100%; max-width: 460px; height: auto; display: block; }
.dt svg text { font-family: var(--f-body, inherit); fill: var(--ink); font-size: 14px; }
.dt svg .s { font-size: 12px; fill: var(--ink-soft); }
.dt svg .b { font-weight: 700; font-size: 17px; }
.cm-tp { fill: var(--ok-soft); stroke: var(--ok); } .cm-fn { fill: var(--bad-soft); stroke: var(--bad); }
.cm-fp { fill: var(--news-soft); stroke: var(--news); } .cm-tn { fill: var(--sheet); stroke: var(--line); }
/* 詳解圖（q.detail.fig）：layers 每層形狀、tree 機率樹、flow 流程對照、matrix 矩陣形狀、folds 交叉驗證切法 */
.dt svg .fg-box { fill: var(--sheet); stroke: var(--ink-soft); stroke-width: 1.5; }
.dt svg .fg-hl { fill: var(--ok-soft); stroke: var(--ok); }
.dt svg .fg-den { fill: var(--news-soft); stroke: var(--news); }
.dt svg .fg-bad { fill: var(--bad-soft); stroke: var(--bad); }
.dt svg .fg-tr { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1; }
.dt svg .fg-va { fill: var(--news-soft); stroke: var(--news); stroke-width: 1.5; }
.dt svg .fg-no { fill: none; stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 3 3; }
.dt svg .fg-te { fill: var(--paper); stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 3 3; }
.dt svg .fg-ln { stroke: var(--ink-soft); stroke-width: 1.5; fill: none; }
.dt svg .fg-ah { fill: var(--ink-soft); }
.dt svg .fg-cell { fill: none; stroke: var(--ink-soft); stroke-width: .6; opacity: .55; }
.dt svg .b2 { font-weight: 700; font-size: 14px; }
.dt svg .s2 { font-size: 13px; }
.dt svg .ok { fill: var(--ok); font-weight: 700; }
.dt svg .ng { fill: var(--bad); font-weight: 700; }
.dt svg .rd { fill: var(--card-red); font-weight: 700; }

/* 成績 */
.result { background: var(--sheet); border: 1.5px solid var(--card-red); border-radius: 4px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.result h2 { font-family: var(--f-display); margin: 0; font-size: 24px; }
.big { font-family: var(--f-mono); font-size: 40px; font-weight: 600; color: var(--card-red); line-height: 1; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 12em minmax(0, 1fr) 4.5em; gap: 8px; align-items: center; font-size: 14px; }
@media (max-width: 600px) { .bar { grid-template-columns: 8.5em minmax(0, 1fr) 3.8em; font-size: 13px; } }
.bar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 10px; background: var(--card-red-soft); border-radius: 2px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--ok); display: block; }
.bar .fill.mid { background: var(--news); } .bar .fill.low { background: var(--bad); }
.bar .v { font-family: var(--f-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }

/* 弱點分析 */
.ana { display: grid; gap: 16px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 700px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; min-width: 0; }
.tile .k { font-size: 13px; color: var(--ink-soft); }
.tile .v { font-family: var(--f-mono); font-weight: 600; font-size: 26px; color: var(--card-red); font-variant-numeric: tabular-nums; line-height: 1.3; }
.tile .v small { font-size: 14px; color: var(--ink-soft); font-weight: 500; }
.panel { background: var(--sheet); border: 1.5px solid var(--card-red); border-radius: 4px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.panel h3 { margin: 0; font-family: var(--f-display); font-size: 20px; color: var(--card-red); }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--ink-soft); font-size: 13px; }
td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.trend svg { width: 100%; height: auto; display: block; }
.ai { white-space: pre-wrap; font-size: 15px; line-height: 1.8; }
.empty { color: var(--ink-soft); padding: 20px; text-align: center; border: 1px dashed var(--line); border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) { .bar .fill { transition: width .4s ease; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">iPAS AI 應用規劃師（中級）・科目三 L23 機器學習技術與應用・11/14 考前</div>
    <h1>科目三考前 14 回</h1>
    <p class="sub">14 回 × 50 題自編仿真題，11/1 起每天一回，第 14 回是考前加碼；另附 114 年第二次、115 年第一次兩回官方公告試題（原題原答案，解析與圖解自編）。每回題目都不同，同一考點換情境、換問法出。距 11/14 考試 <b id="dleft">–</b> 天。</p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="回數">
      <button id="roundbtn" data-act="rounds" aria-expanded="false" aria-controls="roundpanel">第 1 回 ▾</button>
    </div>
    <div class="seg" role="group" aria-label="模式">
      <button data-mode="practice">練習模式</button>
      <button data-mode="exam">考試模式</button>
      <button data-mode="notebook" id="mode-notebook">錯題本 <span class="n">0</span></button>
    </div>
    <div class="seg" role="group" aria-label="顯示方式">

<script>
const DATA = {"1": [{"no": 1, "section": "3.1", "topic_id": "3.1-01", "topic": "離散分佈與 PMF", "style": "情境", "stem": "某線上客服中心的分析師要為「每小時接到的來電通數」建立機率模型。歷史資料顯示平均每小時約 12 通來電，來電彼此獨立，且一小時內的通數沒有明確上限。她想用機率質量函數（PMF，Probability Mass Function）計算「某一小時恰好接到 15 通」的機率，應優先選擇下列哪一種分佈？", "options": {"A": "伯努利分佈（Bernoulli Distribution）：描述單次試驗只有成功或失敗兩種結果的機率", "B": "泊松分佈（Poisson Distribution）：描述固定時間內事件的發生次數，事件獨立且平均發生率固定", "C": "二項分佈（Binomial Distribution）：描述事先固定 n 次獨立試驗中成功的次數，且每次試驗的成功機率 p 都相同", "D": "常態分佈（Normal Distribution）：以鐘形曲線描述連續型變數的分佈情形"}, "answer": "B", "explanation": "答案 B。來電通數是離散計數，且固定時間內事件彼此獨立、平均發生率（λ=12）固定，這是泊松分佈的典型情境，其 PMF 為 P(X=k)=λ^k·e^(-λ)/k!。二項分佈要先知道固定的試驗次數 n；伯努利只有單次試驗；常態分佈是連續型，不用 PMF。", "per_option": {"A": "伯努利只描述「單次」二元試驗，無法描述一小時內的來電總數。", "B": "來電通數是離散計數，固定時間內事件獨立、平均發生率固定（12 通／小時），正是泊松分佈的適用條件。", "C": "二項分佈需要事先固定試驗次數 n，題目只知道平均發生率、沒有上限，不符。", "D": "常態分佈屬連續型，用機率密度函數（PDF）；來電通數是離散值，應用 PMF。"}, "guide_ref": "學習指引 p.3-3～3-4", "hot": false}, {"no": 2, "section": "3.1", "topic_id": "3.1-03", "topic": "貝氏定理與條件機率", "style": "計算", "stem": "某工廠有 A、B、C 三條產線，產量占比分別為 50%、30%、20%，各線不良率依序為 2%、3%、5%。品管人員從全部成品中隨機抽出一件，發現它是不良品，則這件不良品來自 C 線的機率約為多少？", "options": {"A": "5.0%：直接採用 C 線自己的不良率 P(不良｜C)", "B": "20.0%：直接採用 C 線的產量占比 P(C)", "C": "2.9%：採用全廠整體的不良率 P(不良)", "D": "34.5%：以貝氏定理計算後驗機率 P(C｜不良)"}, "answer": "D", "explanation": "答案 D。先算邊際機率 P(不良)=0.5×0.02+0.3×0.03+0.2×0.05=0.029；再用貝氏定理 P(C|不良)=P(不良|C)·P(C)÷P(不良)=0.05×0.20÷0.029≈0.345。C 線產量雖只占 20%，但不良率最高，所以抽到不良品時它的嫌疑上升到約 34.5%。", "per_option": {"A": "5% 只是似然 P(不良|C)，沒有除以整體不良率，也沒考慮 C 線產量占比。", "B": "20% 是先驗 P(C)，沒有利用「已知是不良品」這個證據來更新。", "C": "2.9% 是邊際機率 P(不良)（貝氏公式的分母），不是 C 線的後驗機率。", "D": "P(C|不良)=0.20×0.05÷0.029≈0.345。"}, "guide_ref": "學習指引 p.3-5～3-6", "hot": true, "detail": {"steps": [["① 先算「抽到不良品」的總機率 P(不良)（全廠整體不良率）", "P(不良) ＝ Σ P(產線ᵢ) × P(不良｜產線ᵢ)（Σ 是全部加起來；每條線都是「產量占比 × 該線不良率」，這叫全機率定理）", "＝ 0.5 × 0.02 ＋ 0.3 × 0.03 ＋ 0.2 × 0.05 ＝ 0.010 ＋ 0.009 ＋ 0.010 ＝ 0.029"], ["② 套用貝氏定理求 P(C｜不良)（已知是不良品，它來自 C 線的機率）", "P(C｜不良) ＝ P(不良｜C) × P(C) ÷ P(不良)（直線右邊的「不良」是已知條件；分子是「C 線且不良」，分母是第①步算出的總機率）", "＝ 0.05 × 0.20 ÷ 0.029 ＝ 0.010 ÷ 0.029 ≈ 0.345 ＝ 34.5%，選 D"], ["③ 對照其他選項（各自拿了哪個數字）", "每個選項都是把貝氏公式裡的某一塊直接當成答案", "A：5.0% 就是 P(不良｜C) ＝ 0.05，只有 C 線自己的不良率，少了「× 0.20 ÷ 0.029」。B：20.0% 就是 P(C) ＝ 0.20，產量占比，完全沒用到「抽到不良品」這個證據。C：2.9% 就是第①步的 P(不良) ＝ 0.029，那是貝氏公式的分母，不是 C 線的機率"]], "tip": "貝氏：後驗 ＝ 似然 × 先驗 ÷ 證據；先用全機率算出分母，再算分子。", "fig": {"type": "tree", "title": "三條產線（假設 10,000 件）", "total": "10,000 件", "branches": [{"label": "A 線", "p": "50%", "n": "5,000 件", "leaves": [{"label": "不良", "p": "2%", "n": "100 件", "hl": "den"}]}, {"label": "B 線", "p": "30%", "n": "3,000 件", "leaves": [{"label": "不良", "p": "3%", "n": "90 件", "hl": "den"}]}, {"label": "C 線", "p": "20%", "n": "2,000 件", "leaves": [{"label": "不良", "p": "5%", "n": "100 件", "hl": "num"}]}], "result": "P(C｜不良) ＝ 100 ÷ (100＋90＋100) ＝ 100 ÷ 290 ≈ 34.5%"}}}, {"no": 3, "section": "3.2", "topic_id": "3.2-01", "topic": "向量矩陣運算", "style": "計算", "stem": "某團隊用正規方程式（Normal Equation）求線性迴歸的封閉解，過程中需要先計算 XᵀX。已知特徵矩陣 X 的形狀為 (500, 12)，即 500 筆樣本、12 個特徵，則 XᵀX 的形狀為何？", "options": {"A": "(12, 12)", "B": "(500, 500)", "C": "(500, 12)", "D": "(12, 500)"}, "answer": "A", "explanation": "答案 A。矩陣乘法 (a×b)·(b×c) 得到 (a×c)，內側的 b 必須相同。Xᵀ 是 (12×500)，X 是 (500×12)，內側 500 相同並相消，結果為 (12×12)，剛好是「特徵 × 特徵」的方陣。若寫成 X·Xᵀ 才會得到 (500×500)。", "per_option": {"A": "Xᵀ 為 (12, 500)，乘上 X 的 (500, 12)，內側 500 相消，得 (12, 12)。", "B": "(500, 500) 是 X·Xᵀ 的形狀，順序顛倒了。", "C": "(500, 12) 只是 X 本身的形狀，矩陣乘法並不會保留樣本數那一維。", "D": "(12, 500) 是 Xᵀ 本身的形狀，還沒有與 X 相乘。"}, "guide_ref": "學習指引 p.3-9～3-11", "hot": true, "detail": {"steps": [["① 寫出矩陣乘法的形狀規則", "(a, b) · (b, c) → (a, c)（形狀寫成 (列數, 行數)；左矩陣的行數必須等於右矩陣的列數，這個相同的 b 相乘時被消掉）", "題目沒有要你算數字，只要把形狀代進規則就好"], ["② 先求 Xᵀ 的形狀（轉置＝列與行對調）", "矩陣 (m, n) 轉置後變成 (n, m)", "X 是 (500, 12) → Xᵀ 是 (12, 500)"], ["③ 代入乘法規則求 XᵀX", "(a, b) · (b, c) → (a, c)", "Xᵀ(12, 500) · X(500, 12)：內側 500 與 500 相同，消掉；外側剩 (12, 12)，選 A（剛好是「特徵 × 特徵」的方陣）"], ["④ 對照其他選項（各自是哪個形狀）", "把順序或對象換掉，形狀就會跟著變", "B：(500, 500) 是 X · Xᵀ（順序顛倒）：(500, 12) · (12, 500)，內側 12 消掉，剩 (500, 500)。C：(500, 12) 是 X 本身的形狀。D：(12, 500) 是 Xᵀ 本身，還沒有乘上 X"]], "tip": "(a, b)·(b, c) → (a, c)：內側相同、相消，外側留下；XᵀX 一定是「特徵數 × 特徵數」。", "fig": {"type": "matrix", "title": "矩陣形狀", "op": "·", "ops": [{"name": "Xᵀ", "r": 12, "c": 500}, {"name": "X", "r": 500, "c": 12}], "out": {"name": "XᵀX", "r": 12, "c": 12}, "note": "內側 500 相同被消掉，剩外側 12×12（特徵數×特徵數）"}}}, {"no": 4, "section": "3.2", "topic_id": "3.2-01", "topic": "向量矩陣運算", "style": "計算", "stem": "某學生在 Python 中執行下列程式：\n```\nimport numpy as np\na = np.array([2, -1, 3])\nb = np.array([4, 5, 1])\nprint(np.dot(a, b))\nprint(a * b)\n```\n兩行 print 依序輸出的結果為何？", "options": {"A": "[ 8 -5  3]；6", "B": "6；6", "C": "6；[ 8 -5  3]", "D": "ValueError：兩個陣列形狀相同但不能相乘，需先轉置"}, "answer": "C", "explanation": "答案 C。np.dot(a, b) 是點積：對應元素相乘再加總 = 8+(-5)+3 = 6，結果是單一數值。a * b 是逐元素相乘，結果是陣列 [8, -5, 3]。這是 NumPy 常見混淆點：* 不是點積。", "per_option": {"A": "兩行的對應顛倒了：點積會得到單一數值，逐元素相乘才得到向量。", "B": "把 * 誤當成點積；NumPy 的 * 是逐元素相乘，結果仍是陣列。", "C": "np.dot 是點積：2×4+(-1)×5+3×1=6；a*b 是逐元素相乘，得 [8, -5, 3]。", "D": "兩個一維陣列形狀都是 (3,)，np.dot 與 * 都可以正常執行，不會出錯。"}, "guide_ref": "學習指引 p.3-9～3-11", "hot": true, "detail": {"steps": [["① 算點積 np.dot(a, b)（結果是一個數字）", "a·b ＝ a₁b₁ ＋ a₂b₂ ＋ a₃b₃（對應位置先相乘，再全部加起來）", "＝ 2×4 ＋ (−1)×5 ＋ 3×1 ＝ 8 ＋ (−5) ＋ 3 ＝ 6"], ["② 算逐元素相乘 a * b（結果仍是一個陣列）", "a * b ＝ [a₁b₁, a₂b₂, a₃b₃]（對應位置相乘，但不加總）", "＝ [2×4, (−1)×5, 3×1] ＝ [8, −5, 3]"], ["③ 兩行 print 依序輸出，並對照其他選項", "第一行輸出點積（單一數字），第二行輸出逐元素相乘（陣列）", "輸出：6；[ 8 -5  3]，選 C。A：兩行顛倒了。B：把 * 誤當成點積，以為也是 6，但 * 不會加總，結果仍是 [ 8 -5  3]。D：兩個陣列長度都是 3（形狀同為 (3,)），np.dot 與 * 都能正常執行，不會報錯"]], "code": [["import numpy as np", "import＝匯入套件；numpy 是做數字與矩陣運算的工具箱；as np＝幫它取簡稱 np，之後寫 np.xxx 就等於 numpy.xxx"], ["a = np.array([2, -1, 3])", "np.array＝把括號裡的清單轉成 NumPy 陣列（可以整批運算的一排數字）；結果存進名為 a 的變數"], ["b = np.array([4, 5, 1])", "同上，建立第二個陣列 b，三個數字：4、5、1"], ["print(np.dot(a, b))", "np.dot＝點積（dot product）：a 與 b 對應位置相乘再全部加起來，即 8＋(−5)＋3，得到單一數字 6；print＝把結果印出來"], ["print(a * b)", "* 在 NumPy 裡是逐元素相乘：對應位置各自相乘、不加總，得到陣列 [ 8 -5  3]；注意 * 不是點積"]], "tip": "np.dot＝相乘後「加總」變一個數；* ＝只相乘「不加總」仍是陣列。"}}, {"no": 5, "section": "3.3", "topic_id": "3.3-02", "topic": "非凸與局部最優", "style": "情境", "stem": "某工程師用同一份資料、同一組超參數，分別訓練線性迴歸與一個三層神經網路各 5 次。線性迴歸 5 次得到的最終係數與損失完全相同；神經網路在不同的隨機初始化下，最終訓練損失卻落在 0.29 到 0.37 之間。下列何者最能解釋這個差異？", "options": {"A": "過擬合（Overfitting）：神經網路必然過擬合，而程度每次都不同，所以損失不同", "B": "非凸損失（Non-convex Loss）：有多個局部最小值，最終停在哪裡取決於起點", "C": "資料量差異（Data Size）：線性迴歸使用的資料筆數較少，所以損失函數比較單純", "D": "梯度消失（Vanishing Gradient）：更新量全部是 0，損失因此停在隨機的位置"}, "answer": "B", "explanation": "答案 B。線性迴歸（及邏輯迴歸）的損失函數是凸函數，從任何起點往下走都會到達同一個全域最小值，因此結果可重現。神經網路的損失函數是非凸的，有許多局部最小值與鞍點，梯度下降停在哪裡取決於起點（初始化），所以每次結果不同。實務上用適當的初始化、動量與學習率調整來緩解。", "per_option": {"A": "過擬合描述的是訓練與驗證表現的落差，不是「不同起點得到不同結果」的原因。", "B": "線性迴歸的損失為凸函數，只有一個全域最小值；神經網路的損失為非凸，終點會隨初始化不同而改變。", "C": "損失函數是否為凸，取決於模型形式，與資料筆數多寡無關。", "D": "梯度消失是反向傳播中梯度變得極小的問題，並不會因此讓不同初始化停在不同位置；若更新量真為 0，損失也不會從初始值下降。"}, "guide_ref": "學習指引 p.3-20～3-21", "hot": false}, {"no": 6, "section": "3.3", "topic_id": "3.3-03", "topic": "損失函數選擇", "style": "情境", "stem": "某半導體廠的瑕疵檢測模型，資料中瑕疵品僅占 0.5%，絕大多數良品都很容易被分類正確。工程師發現這些大量的「簡單樣本」主導了整體損失，模型幾乎學不到少數難分的瑕疵。他希望更換損失函數，讓訓練時能依每筆樣本被分類的難易程度，自動調整它對總損失的貢獻，應優先選擇下列哪一種損失函數？", "options": {"A": "對比損失（Contrastive Loss）：學習樣本對的相似或相異程度，常用於人臉驗證", "B": "平均絕對誤差（MAE）：對誤差做線性懲罰，常用於迴歸並降低離群值影響，對每筆樣本一視同仁地計算誤差", "C": "重建損失（Reconstruction Loss）：比較輸入與重建輸出的差異，常用於自編碼器", "D": "焦點損失（Focal Loss）：降低易分類樣本的權重，強化對難分類樣本的學習，適合類別不平衡"}, "answer": "D", "explanation": "答案 D。當簡單樣本（良品）占多數時，它們累積的損失會淹沒少數難分類樣本的訊號。Focal Loss 在交叉熵上乘上一個調節因子，對預測信心已高的簡單樣本降權，使模型專注於難分類的瑕疵，適合資料不平衡的分類任務。", "per_option": {"A": "對比損失處理的是成對樣本的相似度學習，不是類別不平衡。", "B": "MAE 是迴歸損失，用在分類的瑕疵偵測並不合適，也不會針對難樣本加權。", "C": "重建損失用於自編碼器等重建任務，與讓分類器聚焦難樣本無關。", "D": "Focal Loss 會對已分類得很好的簡單樣本降權，讓訓練集中在難樣本，專為類別不平衡設計。"}, "guide_ref": "學習指引 p.3-21～3-23", "hot": true}, {"no": 7, "section": "3.3", "topic_id": "3.3-04", "topic": "小批次梯度下降", "style": "情境", "stem": "某團隊為了節省 GPU 記憶體，把小批次梯度下降（Mini-batch Gradient Descent）的批次大小（Batch Size）從 256 縮小到 4，其他設定都不變。結果發現訓練損失曲線呈劇烈鋸齒狀震盪，收斂變得很不穩定。下列何者最可能是主要原因？", "options": {"A": "梯度估計變異增大（High Gradient Variance）：每批樣本太少，更新方向不穩定", "B": "參數量減少（Fewer Parameters）：批次變小使模型參數量減少而造成欠擬合", "C": "激活函數飽和（Activation Saturation）：批次變小使激活函數飽和，梯度必然消失", "D": "全批次訓練（Full-batch GD）：批次變小等同每次更新都使用整份資料"}, "answer": "A", "explanation": "答案 A。梯度下降每次用一批資料來「估計」整體梯度。批次越小，估計的變異越大，更新方向就越抖，曲線呈鋸齒狀；批次越大估計越穩，但計算成本高。這也是 Mini-batch 要折衷（如 256～2048）並善用 GPU 平行運算的原因。", "per_option": {"A": "批次越小，用少數樣本估計的梯度雜訊越大，更新方向就越不穩定。", "B": "批次大小不會改變模型的參數量；且欠擬合表現為損失偏高，不是鋸齒狀震盪。", "C": "激活函數是否飽和取決於輸入數值範圍與函數形狀，不由批次大小決定。", "D": "批次變小是往隨機梯度下降（每次一筆）的方向靠攏，不是全批次；全批次的更新反而最穩定。"}, "guide_ref": "學習指引 p.3-23～3-24", "hot": false}, {"no": 8, "section": "3.3", "topic_id": "3.3-05", "topic": "動量與 Adam", "style": "情境", "stem": "某模型的損失曲面像一條狹長的山谷：沿谷底前進的方向很平緩，垂直谷底的方向則十分陡峭。使用一般梯度下降時，參數在山谷兩側來回震盪，沿著谷底前進得很慢。下列哪一種做法最能抵消來回震盪，並加速沿谷底前進？", "options": {"A": "提高學習率（Learning Rate）：將步長放大 10 倍以更快跨越山谷", "B": "丟棄法（Dropout）：訓練時隨機關閉部分神經元以降低過擬合", "C": "動量法（Momentum）：累積過去梯度，方向一致處加速、來回震盪處互相抵消", "D": "早停法（Early Stopping）：驗證損失不再改善時提早結束訓練"}, "answer": "C", "explanation": "答案 C。動量法把前幾次的梯度累積起來：與谷底同向的梯度每次都指向同一邊，速度越累積越快；垂直谷底的梯度正負交替，累積後互相抵消。因此能加速收斂、減少震盪，特別適合高曲率的曲面。Adam 則進一步結合動量與自適應學習率。", "per_option": {"A": "步長放大會讓兩側的來回跳動更劇烈，甚至發散。", "B": "Dropout 是對抗過擬合的正則化手段，不改變更新方向的累積方式。", "C": "動量像慣性：沿谷底方向的梯度一致會越走越快，兩側來回的分量正負抵消而衰減。", "D": "早停法是決定何時停止訓練，不能改善山谷中的震盪與緩慢前進。"}, "guide_ref": "學習指引 p.3-24～3-26", "hot": true}, {"no": 9, "section": "4.1", "topic_id": "4.1-04", "topic": "強化學習", "style": "情境", "stem": "某影音平台訓練一個強化學習（Reinforcement Learning）推薦代理人，報酬（Reward）設為「使用者每點擊一次推薦內容 +1」。上線一段時間後發現，代理人學會大量推送聳動標題的內容，點擊次數雖然飆升，使用者的觀看完成率與回訪率卻下降。下列何者是最根本的改善方向？", "options": {"A": "延長訓練（More Training Episodes）：增加互動回合數，讓策略收斂到點擊報酬的最大值", "B": "報酬重塑（Reward Redesign）：讓報酬綁定真正目標，如完整觀看率與回訪率，而非只算點擊", "C": "使用者分群（K-means Clustering）：依群集平均偏好決定推薦內容，以取代報酬設計", "D": "降低學習率（Lower Learning Rate）：讓策略更新得更慢，避免過度探索聳動內容"}, "answer": "B", "explanation": "答案 B。強化學習的目標是讓長期累積報酬最大，報酬就是你給它的「目標」。若只獎勵表面行為（點擊），代理人會鑽漏洞刷分，卻偏離真正想要的結果（滿意度、留存）。根本解法是把報酬綁在真正的任務成果上，而不是多訓練或調學習率。", "per_option": {"A": "訓練更久只會讓代理人更徹底地鑽「點擊」這個漏洞。", "B": "代理人只會最大化被給予的報酬；報酬與真正目標脫鉤時，必須修正報酬設計。", "C": "分群是非監督學習，無法取代強化學習中的報酬回饋，也沒有解決目標錯置的問題。", "D": "調低學習率只是改變學習速度，代理人最終仍會朝錯誤的報酬目標收斂。"}, "guide_ref": "學習指引 p.4-9～4-11", "hot": false}, {"no": 10, "section": "4.2", "topic_id": "4.2-04", "topic": "決策樹", "style": "計算", "stem": "某決策樹將 20 筆樣本依某特徵切成左右兩個子節點。左節點有 10 筆（9 筆為正類、1 筆為負類），右節點有 10 筆（3 筆為正類、7 筆為負類）。以基尼不純度（Gini Impurity）計算，切分後的加權平均基尼不純度為何？", "options": {"A": "0.18", "B": "0.48", "C": "0.60", "D": "0.30"}, "answer": "D", "explanation": "答案 D。基尼不純度 = 1 − Σ(各類別比例²)。左節點：1−(0.9²+0.1²)=0.18；右節點：1−(0.3²+0.7²)=0.42；兩邊各占 10/20，加權平均 = 0.5×0.18+0.5×0.42 = 0.30。切分前父節點（12 正、8 負）為 0.48，所以這次切分讓不純度下降了 0.18。", "per_option": {"A": "0.18 只是左子節點的基尼不純度，沒有納入右子節點。", "B": "0.48 是切分前父節點（12 正、8 負）的基尼不純度，不是切分後的結果。", "C": "0.60 把左右兩個基尼值直接相加（0.18+0.42），沒有依樣本比例加權平均。", "D": "左 1−(0.9²+0.1²)=0.18、右 1−(0.3²+0.7²)=0.42，各占一半，加權平均=0.30。"}, "guide_ref": "學習指引 p.4-19～4-21", "hot": false, "detail": {"steps": [["① 算左節點的基尼不純度（10 筆：9 正、1 負）", "Gini ＝ 1 － Σpᵢ²（pᵢ 是該類別占節點的比例；Σ 是全部加起來）", "p正 ＝ 9÷10 ＝ 0.9、p負 ＝ 1÷10 ＝ 0.1；Σpᵢ² ＝ 0.9² ＋ 0.1² ＝ 0.81 ＋ 0.01 ＝ 0.82；Gini左 ＝ 1 － 0.82 ＝ 0.18"], ["② 算右節點的基尼不純度（10 筆：3 正、7 負）", "Gini ＝ 1 － Σpᵢ²", "p正 ＝ 3÷10 ＝ 0.3、p負 ＝ 7÷10 ＝ 0.7；Σpᵢ² ＝ 0.3² ＋ 0.7² ＝ 0.09 ＋ 0.49 ＝ 0.58；Gini右 ＝ 1 － 0.58 ＝ 0.42"], ["③ 依樣本數加權平均", "切分後 Gini ＝ Σ（子節點筆數 ÷ 總筆數）× 該節點的 Gini（筆數多的節點，話語權大）", "左、右各 10 筆，總共 20 筆：＝ (10÷20) × 0.18 ＋ (10÷20) × 0.42 ＝ 0.5 × 0.18 ＋ 0.5 × 0.42 ＝ 0.09 ＋ 0.21 ＝ 0.30，選 D"], ["④ 對照其他選項（怎麼算錯的）", "A 少算一邊；B 是切分前；C 沒加權", "A：0.18 只是左節點，沒納入右節點。B：0.48 是切分前的父節點：正類 9＋3 ＝ 12 筆、負類 1＋7 ＝ 8 筆，p正 ＝ 12÷20 ＝ 0.6、p負 ＝ 0.4，Gini ＝ 1 － (0.36 ＋ 0.16) ＝ 1 － 0.52 ＝ 0.48。C：0.60 ＝ 0.18 ＋ 0.42，兩邊直接相加沒有乘比例"]], "tip": "Gini ＝ 1 － 比例平方和；切分後要「依筆數比例加權」，不是直接相加或只看一邊。"}}, {"no": 11, "section": "4.2", "topic_id": "4.2-07", "topic": "XGBoost", "style": "情境", "stem": "某風控團隊的貸款申請資料有約 30% 的欄位值缺漏。專案成員主張「使用 XGBoost 前一定要先用平均值或中位數把所有缺失值補齊，否則模型無法訓練」。下列何者最符合 XGBoost 對缺失值的處理方式？", "options": {"A": "先補齊再訓練（Mandatory Imputation）：遇到缺失值會直接中斷，必須先用平均數補齊", "B": "視為零值（Zero Filling）：自動把缺失值當成 0，因此補值與否沒有差別", "C": "預設走向學習（Default Direction）：分裂時學習缺失值該走左或右子樹，可直接處理缺失值", "D": "刪除樣本（Listwise Deletion）：自動刪除含缺失值的整列樣本，再用剩餘資料訓練"}, "answer": "C", "explanation": "答案 C。XGBoost 的特色之一是支援稀疏資料並能自動處理缺失值：在尋找分裂點時，會嘗試把缺失值分到左邊或右邊，挑損失下降較多的方向當作預設方向。因此不一定要先做平均值補值（當然是否補值仍可視資料而定）。", "per_option": {"A": "XGBoost 支援缺失值，不需要事先補齊也能訓練。", "B": "它不是把缺失值當 0；若真如此，真實的 0 與缺漏就被混為一談。", "C": "XGBoost 內建稀疏感知的分裂演算法，會從資料中學出缺失值的預設走向。", "D": "XGBoost 不會刪除含缺失值的樣本，這些樣本仍會參與訓練並被導向學到的預設方向。"}, "guide_ref": "學習指引 p.4-22～4-24", "hot": true}, {"no": 12, "section": "4.2", "topic_id": "4.2-13", "topic": "樸素貝氏", "style": "情境", "stem": "某新聞網站用樸素貝氏（Naive Bayes）做文章分類。一篇體育新聞含有「煞停」一詞，該詞在訓練資料的「體育」類別中從未出現過，導致「體育」類別的後驗機率在連乘時被乘成 0，即使文中其他詞都強烈指向體育。下列哪一種做法最能直接解決此問題？", "options": {"A": "拉普拉斯平滑（Laplace Smoothing）：對每個詞的計數加上小常數，避免機率為 0", "B": "特徵標準化（Feature Scaling）：將詞頻縮放到相同的數值範圍，使各詞影響力接近", "C": "增加訓練回合（Epoch）：讓模型多看幾次訓練資料，期望它學到該詞的分佈", "D": "L1 正則化（L1 Regularization）：對權重加上絕對值懲罰，把不重要的特徵權重壓成 0"}, "answer": "A", "explanation": "答案 A。樸素貝氏的後驗機率是各特徵條件機率的連乘，只要有一個詞在某類別從未出現，該類別的機率就變成 0（零機率問題）。拉普拉斯平滑在每個詞的計數上加上一個小常數（通常 1），使所有條件機率都大於 0，是此問題的標準解法。", "per_option": {"A": "平滑讓未出現的詞也有很小的非零機率，避免整串連乘被一個 0 抹掉。", "B": "縮放數值範圍不會改變「某詞在該類別出現次數為 0」這個事實。", "C": "樸素貝氏靠計數估計機率，不是迭代訓練；多看幾輪資料也不會出現沒出現過的詞。", "D": "L1 正則化是線性模型等的權重懲罰，不能補上機率為 0 的缺口。"}, "guide_ref": "學習指引 p.4-34～4-36", "hot": false}, {"no": 13, "section": "4.2", "topic_id": "4.2-14", "topic": "K-means", "style": "情境", "stem": "某電信業者要用 K-means 將顧客分群，輸入特徵為「年收入（單位：元，約 30 萬至 300 萬）」與「每月客服來電次數（0 至 10 次）」。結果發現分群幾乎只依年收入高低劃分，來電次數幾乎沒有影響。下列哪一種做法最能改善此問題？", "options": {"A": "增加群數（Larger K）：讓每個群集的樣本數變少，期望來電次數因此被納入考量，同時讓各群集之間的區隔更細緻", "B": "改用 DBSCAN（DBSCAN）：把 Eps 設得更大，因為 DBSCAN 的分群不依賴距離", "C": "增加迭代次數（More Iterations）：讓質心有更多次機會更新位置直到收斂", "D": "特徵標準化（Standardization）：先做 Z-score 再分群，避免距離被數值大的特徵主導"}, "answer": "D", "explanation": "答案 D。K-means 用歐氏距離決定歸屬。年收入數值是百萬等級、來電次數只有個位數，距離幾乎完全由年收入決定。分群（非監督學習）前通常要先標準化，讓各特徵尺度相近。DBSCAN 也靠距離，換演算法不是解法。", "per_option": {"A": "增加 K 只會把年收入軸切得更細，不會讓來電次數的影響變大。", "B": "DBSCAN 同樣以距離（Eps 鄰域）判斷密度，一樣會受尺度影響，並非不依賴距離。", "C": "增加迭代次數只影響是否收斂，不會改變距離被大尺度特徵主導的問題。", "D": "K-means 以歐氏距離為基礎，尺度大的特徵會主導距離；標準化後各特徵才有相近的影響力。"}, "guide_ref": "學習指引 p.4-41～4-42", "hot": false}, {"no": 14, "section": "4.2", "topic_id": "4.2-16", "topic": "DBSCAN", "style": "情境", "stem": "某工程師對一批 GPS 座標點執行 DBSCAN，設定 Eps = 0.05 公里、MinPts = 20。結果幾乎所有點都被標成雜訊（Noise），只形成零個或極少個群集。已知資料點之間的實際距離多半在 0.2 公里左右。下列哪一種調整最合理？", "options": {"A": "指定群數（Specify K）：設定 K 並重新隨機初始化質心，確保每個點都有所屬群集", "B": "放寬密度條件（Relax Density）：調大 Eps 或調小 MinPts，讓更多點達到核心點門檻", "C": "收緊密度條件（Tighten Density）：調小 Eps 並調大 MinPts，以縮小雜訊的範圍並提高群集的純度", "D": "雜訊獨立成群（Noise as Clusters）：把雜訊點視為各自獨立的群集，因為不允許雜訊"}, "answer": "B", "explanation": "答案 B。DBSCAN 的核心點要求「Eps 鄰域內至少 MinPts 個點」。點間距約 0.2 公里而 Eps 只有 0.05，幾乎沒有點能湊到 20 個鄰居，所以全成雜訊。應調大 Eps 或調小 MinPts（或兩者），使密度條件放寬；DBSCAN 本身不需指定群數。", "per_option": {"A": "DBSCAN 不需要也沒有群數 K 與質心，那是 K-means 的概念。", "B": "點與點相距約 0.2 公里，遠大於 Eps=0.05，鄰域幾乎沒有點；放寬 Eps 或 MinPts 才能產生核心點。", "C": "條件更嚴格只會讓更少的點成為核心點，雜訊更多，與目標相反。", "D": "DBSCAN 的特色之一就是能辨識並保留雜訊點，並非不允許雜訊。"}, "guide_ref": "學習指引 p.4-43～4-44", "hot": false}, {"no": 15, "section": "4.3", "topic_id": "4.3-02", "topic": "激活函數與輸出層", "style": "情境", "stem": "某新聞平台要建立文章標籤模型，每篇文章可同時屬於「財經」「科技」「政治」三個標籤中的零個、一個或多個。工程師希望輸出層對每個標籤各自輸出 0 到 1 的機率，彼此獨立判斷。下列輸出層與損失函數的設計，何者最適當？", "options": {"A": "Sigmoid＋二元交叉熵（Binary Cross-Entropy）：3 個神經元，各自獨立輸出 0～1 的機率", "B": "Softmax＋類別交叉熵（Categorical Cross-Entropy）：3 個神經元，三個機率總和為 1", "C": "線性輸出＋均方誤差（MSE）：1 個神經元，輸出一個連續數值代表標籤編號", "D": "ReLU＋均方誤差（MSE）：3 個神經元，直接輸出非負的數值作為各標籤分數"}, "answer": "A", "explanation": "答案 A。多標籤分類：每個標籤各自是「是／否」的獨立二元判斷，所以輸出層用與標籤數相同的神經元，各接 Sigmoid（0～1 機率），損失用二元交叉熵。Softmax 會讓機率互相競爭、總和為 1，只適合單標籤（互斥）的多類別分類。", "per_option": {"A": "多標籤問題中每個標籤是獨立的二元判斷，故各用 Sigmoid 輸出機率並以二元交叉熵計算損失。", "B": "Softmax 讓各類別機率總和為 1、彼此互斥，適合單標籤多分類，不適合同時屬於多個標籤。", "C": "單一連續輸出屬於迴歸，並隱含標籤編號有大小順序，不適用多標籤分類。", "D": "ReLU 輸出不限於 0～1，不是機率；用 MSE 也不是分類問題的標準損失。"}, "guide_ref": "學習指引 p.4-57～4-58、4-65", "hot": true}, {"no": 16, "section": "4.3", "topic_id": "4.3-06", "topic": "CNN 架構", "style": "計算", "stem": "某工程師建立 CNN，輸入為 64×64 的 RGB 彩色影像（形狀 (64, 64, 3)），第一層為 Conv2D：16 個 3×3 濾波器、步幅（stride）為 1、padding='same'。這一層輸出的特徵圖形狀為何？", "options": {"A": "(64, 64, 3)", "B": "(62, 62, 16)", "C": "(64, 64, 16)", "D": "(64, 64, 48)"}, "answer": "C", "explanation": "答案 C。padding='same' 搭配 stride=1，輸出寬高與輸入相同（64×64）。輸出通道數等於濾波器個數（16）；每個 3×3×3 的濾波器會把 3 個輸入通道的卷積結果加總成一張特徵圖。所以輸出為 (64, 64, 16)。", "per_option": {"A": "輸出通道數由濾波器個數決定，不會沿用輸入的 3 個通道。", "B": "(62, 62) 是 padding='valid'（不補零）時的結果，本題是 'same'。", "C": "padding='same' 且 stride=1 時寬高不變；輸出通道數等於濾波器個數 16。", "D": "每個濾波器會跨 3 個輸入通道加總，得到一張特徵圖，不是 3×16 張。"}, "guide_ref": "學習指引 p.4-67～4-71", "hot": true, "detail": {"steps": [["① 算輸出的寬高（卷積輸出尺寸公式）", "輸出邊長 ＝ ⌊(輸入邊長 － 濾波器邊長 ＋ 2 × 補零圈數) ÷ 步幅⌋ ＋ 1（⌊ ⌋ 是無條件捨去；padding='same' 的意思是補到寬高不變，stride＝1 時補零圈數 ＝ (濾波器邊長 － 1) ÷ 2）（這個算法適用於濾波器邊長為奇數，如 3×3、5×5）", "補零圈數 ＝ (3 － 1) ÷ 2 ＝ 1；輸出邊長 ＝ (64 － 3 ＋ 2×1) ÷ 1 ＋ 1 ＝ 63 ＋ 1 ＝ 64（寬高都不變：64×64）"], ["② 算輸出的通道數", "輸出通道數 ＝ 濾波器個數（每個濾波器會把所有輸入通道的結果加總成「一張」特徵圖）", "題目有 16 個濾波器 → 輸出通道數 ＝ 16（跟輸入有幾個通道無關，輸入的 3 個通道在每個濾波器內被加總掉了）"], ["③ 合併形狀", "輸出形狀 ＝ (邊長, 邊長, 通道數)", "(64, 64, 16)，選 C"], ["④ 對照其他選項（怎麼算錯的）", "A：通道沿用輸入；B：用了 valid；D：通道亂乘", "A：(64, 64, 3) 把輸入的 3 個通道原樣保留，但通道數由濾波器個數決定。B：(62, 62, 16) 是 padding='valid'（不補零）：(64 － 3 ＋ 0) ÷ 1 ＋ 1 ＝ 62，題目是 'same'。D：(64, 64, 48) 把 3 × 16 ＝ 48 當通道數，但每個濾波器只產生一張特徵圖，不是 3 張"]], "tip": "'same'＋stride 1 → 寬高不變；輸出通道數 ＝ 濾波器個數。", "fig": {"type": "layers", "title": "每一層的形狀", "items": [{"name": "輸入", "shape": "64×64×3"}, {"name": "Conv 3×3，16 個", "shape": "64×64×16", "note": "same＋stride 1，寬高不變；通道＝濾波器數 16", "hl": true}], "note": "參數（題目沒問）：(3×3×3＋1)×16 ＝ 448"}}}, {"no": 17, "section": "4.3", "topic_id": "4.3-08", "topic": "ResNet", "style": "情境", "stem": "某團隊向同事說明 ResNet 為何能堆到上百層而不容易退化。已知殘差區塊的輸出為「輸入 x 加上子層輸出 F(x)」，若某個區塊訓練後學到的 F(x) 趨近於 0，下列說明何者最恰當？", "options": {"A": "全層關閉（Dead Block）：輸出趨近於 0，後續層將接收不到任何資訊", "B": "梯度中斷（Zero Gradient）：區塊的梯度必然變成 0，該層權重從此不再更新", "C": "自動剪枝（Auto Pruning）：區塊被網路自動移除，實際層數因此變少", "D": "近似恆等映射（Identity Mapping）：輸出趨近於輸入 x，加深不會讓表現變差"}, "answer": "D", "explanation": "答案 D。殘差區塊把輸入直接加到輸出（跳躍連接）。若某區塊不需要做任何轉換，只要讓 F(x)≈0 就能輸出≈x，即近似恆等映射，所以多堆的層至少不會比淺網路更差；同時梯度能沿捷徑直接回傳，緩解梯度消失與模型退化，因此可訓練數百層。", "per_option": {"A": "輸出是 x + F(x)，F(x) 為 0 時輸出是 x 而不是 0，資訊仍完整傳遞。", "B": "捷徑連接讓梯度可直接回傳，不會變成 0，權重也仍可更新。", "C": "殘差連接並不會自動剪枝；區塊仍存在，只是學到近似恆等的函數。", "D": "輸出 = x + F(x)，F(x)≈0 時輸出≈x，區塊相當於恆等映射，加深不會比較淺的網路更差。"}, "guide_ref": "學習指引 p.4-71～4-72、4-81", "hot": true}, {"no": 18, "section": "4.3", "topic_id": "4.3-09", "topic": "RNN 與 LSTM", "style": "比較", "stem": "在 LSTM（Long Short-Term Memory）的門控機制中，哪一個門負責「決定要從細胞狀態（Cell State）中保留或丟棄多少過去累積的舊資訊」？", "options": {"A": "輸入門（Input Gate）：決定要把多少新資訊寫入細胞狀態", "B": "遺忘門（Forget Gate）：決定細胞狀態中要保留或丟棄多少舊資訊", "C": "輸出門（Output Gate）：決定細胞狀態有多少內容輸出成隱藏狀態", "D": "重置門（Reset Gate）：決定忽略多少過去資訊以計算新的候選狀態"}, "answer": "B", "explanation": "答案 B。LSTM 有三個門與一條細胞狀態：遺忘門決定舊資訊保留多少；輸入門決定新資訊寫入多少；輸出門決定細胞狀態輸出多少到隱藏狀態。重置門是 GRU 的設計。這些門讓 LSTM 能選擇性記憶，緩解長序列的梯度消失。", "per_option": {"A": "輸入門管的是「新資訊」寫入多少，不是舊資訊的保留。", "B": "遺忘門對舊的細胞狀態逐項乘上 0～1 的係數，決定保留或遺忘多少。", "C": "輸出門管的是細胞狀態要輸出多少到隱藏狀態，不改變細胞狀態本身。", "D": "重置門是 GRU（門控循環單元）的機制，不屬於 LSTM 的三個門。"}, "guide_ref": "學習指引 p.4-72～4-76", "hot": false}, {"no": 19, "section": "4.3", "topic_id": "4.3-12", "topic": "注意力機制", "style": "定義", "stem": "在 Transformer 的自注意力（Self-Attention）中，每個詞會被轉換成查詢 Q、鍵 K 與值 V。計算 Q 與各個 K 的相似度並經過 Softmax 之後，所得到的結果在後續步驟中的用途是什麼？", "options": {"A": "直接輸出（Direct Output）：直接當作該詞的最終輸出向量，不再與 V 做任何運算", "B": "位置編碼（Positional Encoding）：加到輸入詞嵌入上，用來記錄詞在句中的順序，與詞義向量相加後一起輸入", "C": "注意力權重（Attention Weights）：作為各個 V 的加權係數，對 V 加權求和得到輸出", "D": "損失權重（Loss Weighting）：決定哪些詞的預測誤差在訓練時要被忽略"}, "answer": "C", "explanation": "答案 C。自注意力的步驟：Q 與 K 做點積得到相似度分數 → Softmax 轉成注意力權重（相關度越高權重越大）→ 以此權重對 V 加權求和 → 得到包含上下文的輸出。因此任兩個位置不論距離多遠都能直接建立關聯，且可平行計算。", "per_option": {"A": "注意力權重只是中間量，還要與 V 相乘求和才得到輸出。", "B": "位置編碼是另外加入的固定或可學習向量，與 Q·K 的相似度無關。", "C": "Softmax 後的相似度即注意力權重，再對 V 加權求和，得到包含重點上下文的向量。", "D": "注意力權重作用在序列內部的資訊整合，不是損失函數的權重。"}, "guide_ref": "學習指引 p.4-76～4-83", "hot": true}, {"no": 20, "section": "4.3", "topic_id": "4.3-14", "topic": "遷移學習", "style": "情境", "stem": "某團隊微調（Fine-Tuning）預訓練的 BERT 做客服意圖分類，把學習率設成 0.1 並解凍所有層。訓練幾輪後，模型在預訓練時學到的語言能力幾乎消失，準確率掉到接近隨機猜測。下列何者最可能是原因與較合適的對策？", "options": {"A": "降低學習率（Lower Learning Rate）：過大會破壞預訓練特徵，應降到 1e-5～1e-4", "B": "重新初始化（Re-initialization）：解凍層數太少，應把所有權重隨機初始化後從頭訓練", "C": "改用分群（K-means Clustering）：預訓練模型不適合分類任務，應放棄微調改做分群", "D": "縮小批次（Batch Size of 1）：批次大小太大，應改成每次只用一筆樣本的隨機梯度下降"}, "answer": "A", "explanation": "答案 A。微調的精神是在預訓練特徵上做小幅調整，所以學習率通常設得很小（如 1e-5～1e-4）。學習率 0.1 會讓權重一次被推得很遠，預訓練學到的表示被破壞，表現退到接近隨機。對策是降低學習率（必要時凍結部分層、逐步解凍）。", "per_option": {"A": "微調時學習率要很小，才能在保留預訓練特徵的前提下做細微調整。", "B": "題目是解凍「所有」層，且重新初始化等於放棄遷移學習的好處。", "C": "BERT 預訓練＋微調本來就是分類等下游任務的標準流程；K-means 是非監督分群，不是替代。", "D": "批次大小不是主因，且改成每次一筆只會讓梯度更不穩定。"}, "guide_ref": "學習指引 p.4-82", "hot": true}, {"no": 21, "section": "4.3", "topic_id": "4.3-19", "topic": "程式碼閱讀：深度學習", "style": "情境", "stem": "某工程師撰寫下列 Keras 程式，訓練一個 3 類別的分類模型：\n```\nmodel = Sequential([Dense(16, activation='relu', input_shape=(8,)), Dense(3, activation='softmax')])\nmodel.compile(optimizer='adam', loss='categorical_crossentropy', metrics=['accuracy'])\ny_train = np.array([0, 2, 1, 1, 0, 2])   # 整數類別標籤\nmodel.fit(X_train, y_train, epochs=10)\n```\n下列對此程式的敘述，何者最正確？", "options": {"A": "程式可正常執行，Keras 會自動把整數標籤轉成 One-hot 後再計算損失", "B": "整數標籤與 categorical_crossentropy 不配對，應改用 sparse 版本的損失函數", "C": "輸出層的 softmax 應改為 sigmoid，因為整數標籤代表的是二元輸出，不是多分類", "D": "Dense(3) 應改成 Dense(1)，因為整數標籤只有一個欄位，所以輸出層只需要一個神經元就足以輸出類別編號"}, "answer": "B", "explanation": "答案 B。多分類單標籤時輸出層為「類別數個神經元＋Softmax」。損失函數與標籤格式要配對：One-hot 標籤用 categorical_crossentropy；整數標籤用 sparse_categorical_crossentropy。本題標籤是整數卻搭配 categorical_crossentropy，標籤形狀 (6,) 與預測 (6, 3) 不相容，需改損失函數或把標籤轉成 One-hot。", "per_option": {"A": "Keras 不會替 categorical_crossentropy 自動轉換整數標籤，形狀不符會出問題。", "B": "categorical_crossentropy 期待 One-hot 標籤；整數標籤應配 sparse_categorical_crossentropy。", "C": "3 類單標籤分類的輸出層應維持 softmax；是否為整數標籤只影響損失函數的選擇。", "D": "輸出層神經元數要等於類別數 3，標籤格式不改變這一點。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 比對「預測」與「標籤」的形狀（categorical_crossentropy 要求兩者形狀一致）", "預測形狀 ＝ (樣本數, 輸出層神經元數)；categorical_crossentropy 期待標籤是同形狀 (樣本數, 類別數) 的 One-hot（只有一格是 1、其餘是 0）", "預測：最後一層 Dense(3)，共 6 筆樣本 → (6, 3)。標籤 y_train 是 6 個整數 → (6,)。(6, 3) 與 (6,) 不相容，所以損失函數與標籤格式對不上"], ["② 看整數標籤該怎麼配（兩種修法）", "修法一：損失函數改成 sparse_categorical_crossentropy（直接吃整數標籤）；修法二：標籤轉成 One-hot，維持 categorical_crossentropy", "整數 0 → [1, 0, 0]；整數 1 → [0, 1, 0]；整數 2 → [0, 0, 1]（以類別數 3 為例）。本題 y_train 轉完會變成 6 列、3 行，剛好對得上 (6, 3)"], ["③ 對照其他選項（為什麼不對）", "輸出層神經元數 ＝ 類別數；Softmax 對應多分類", "A：Keras 不會自動把整數標籤轉成 One-hot，形狀不符會出錯。C：3 類單標籤要保留 softmax；sigmoid 是二元（或多標籤）用的。D：輸出層要有 3 個神經元（每個類別一個分數），不能只放 1 個。所以選 B"]], "code": [["model = Sequential([...])", "model＝模型；Sequential＝依序堆疊的模型，方括號裡的層會由上到下一層接一層，上一層的輸出就是下一層的輸入"], ["Dense(16, activation='relu', input_shape=(8,))", "Dense＝全連接層（每個輸入都連到每個神經元）；16＝這層有 16 個神經元；activation='relu'＝激活函數 ReLU（負數變 0、正數不變，加入非線性）；input_shape=(8,)＝每筆輸入有 8 個特徵"], ["Dense(3, activation='softmax')", "輸出層：3 個神經元，對應 3 個類別；softmax＝把 3 個分數轉成機率（都大於 0，加起來等於 1）"], ["model.compile(optimizer='adam', loss='categorical_crossentropy', metrics=['accuracy'])", "compile＝設定訓練方式（不是真的訓練）；optimizer='adam'＝用 Adam 優化器更新權重；loss='categorical_crossentropy'＝損失函數是「分類交叉熵」，要求標籤是 One-hot；metrics=['accuracy']＝訓練時順便顯示準確率"], ["y_train = np.array([0, 2, 1, 1, 0, 2])   # 整數類別標籤", "建立 6 個標籤，每個數字代表類別編號（0、1、2），這是「整數標籤」、不是 One-hot；形狀是 (6,)；# 後面是註解，電腦不會執行"], ["model.fit(X_train, y_train, epochs=10)", "fit＝學習（真正開始訓練）；X_train＝訓練特徵，y_train＝標準答案；epochs=10＝把全部資料完整看 10 輪。這行會因標籤形狀 (6,) 與預測 (6, 3) 對不上而出錯"]], "tip": "One-hot 標籤配 categorical_crossentropy；整數標籤配 sparse_categorical_crossentropy。"}}, {"no": 22, "section": "5.1", "topic_id": "5.1-01", "topic": "特徵轉換與縮放", "style": "否定", "stem": "關於特徵縮放（Feature Scaling）與轉換，下列敘述何者錯誤？", "options": {"A": "最小最大縮放（Min-Max Scaling）可把數值壓到 0 到 1，但容易受極端值影響", "B": "穩健縮放（Robust Scaling）使用中位數與四分位距（IQR），對離群值的抵抗力較強", "C": "對右偏的資料（如收入）做對數轉換，可降低偏態並縮小極端值的影響", "D": "Z-score 標準化會把轉換後的數值限制在 0 到 1 之間"}, "answer": "D", "explanation": "答案 D。Z-score（標準化）是減去平均再除以標準差，結果平均 0、標準差 1，並不限制在 0～1，這是 Min-Max 的特性，兩者常被混淆。Min-Max 對極端值敏感；Robust 用中位數與 IQR 抗離群值；右偏資料常用對數轉換。", "per_option": {"A": "敘述正確：Min-Max 把最小值映射到 0、最大值映射到 1，一個極端值就會壓縮其他點。", "B": "敘述正確：中位數與 IQR 不易被少數離群值拉動。", "C": "敘述正確：對數轉換會壓縮大值，右偏分佈因而變得較對稱。", "D": "Z-score 轉換後平均為 0、標準差為 1，數值不受限於 0～1，可為負值，也可能超出 ±3。"}, "guide_ref": "學習指引 p.5-6～5-8", "hot": true}, {"no": 23, "section": "5.1", "topic_id": "5.1-02", "topic": "PCA 與降維", "style": "定義", "stem": "某分析師在已標準化的特徵矩陣上執行下列程式：\n```\nfrom sklearn.decomposition import PCA\npca = PCA(n_components=0.95)\nX_new = pca.fit_transform(X_scaled)\n```\n其中 n_components=0.95 的意義為何？", "options": {"A": "自動挑選最少的主成分個數，使累積解釋變異比例達到 95% 以上", "B": "隨機保留 95% 的原始特徵欄位，其餘欄位直接刪除", "C": "只保留原特徵數量的 0.95 倍，例如 100 維的資料保留 95 個主成分", "D": "只保留各自解釋變異比例超過 0.95 的主成分，其餘一律丟棄"}, "answer": "A", "explanation": "答案 A。PCA(n_components=0.95) 表示保留「累積解釋變異比例」至少 95% 所需的最少主成分數。每個主成分的解釋變異比例＝該特徵值÷全部特徵值總和，依大到小累加到 95% 為止。這是決定降到幾維的常用方式（使用前要先標準化）。", "per_option": {"A": "n_components 設為 0 到 1 之間的小數時，代表要求的累積解釋變異比例，sklearn 會自動決定主成分個數。", "B": "PCA 不是挑選原始欄位，而是產生新的線性組合座標軸（主成分）。", "C": "0.95 是變異比例門檻，不是維度的縮放倍率。", "D": "門檻是「累積」的解釋變異比例，不是單一主成分要超過 0.95；否則幾乎沒有資料能保留任何成分。"}, "guide_ref": "學習指引 p.5-6、3-13～3-15", "hot": true, "detail": {"steps": [["① 先搞懂「解釋變異比例」與「累積」怎麼算", "解釋變異比例 ＝ 該主成分的特徵值 ÷ 全部特徵值的總和；累積比例 ＝ 由大到小依序把比例加起來", "舉例（題目沒給數字）：4 個主成分的特徵值 5、3、1、1，總和 ＝ 5＋3＋1＋1 ＝ 10；比例各為 0.5、0.3、0.1、0.1；累積為 0.5、0.8、0.9、1.0"], ["② n_components 設成 0 到 1 的小數時，怎麼決定個數", "挑最小的 k，使「前 k 個的累積比例」≥ 設定的門檻", "沿用上面的舉例，門檻 0.95：累積 0.5、0.8、0.9 都不到，累積 1.0 才達標 → 需要 4 個。這就是選 A：自動挑最少個數、讓累積達到門檻"], ["③ 對照其他選項（錯在哪）", "B：選欄位；C：當倍率；D：單一成分超過門檻", "B：PCA 不是挑原始欄位，是產生新的線性組合座標軸。C：若是倍率，100 維 × 0.95 ＝ 95 個；但 0.95 是變異比例門檻，要保留固定 95 個得寫 n_components=95（整數）。D：用上面的舉例，最大的主成分只占 0.5，沒有任何一個超過 0.95，會全部被丟掉、什麼都留不下"]], "code": [["from sklearn.decomposition import PCA", "from … import …＝從 sklearn 套件的 decomposition（降維分解）模組裡，把 PCA 這個工具拿出來用；PCA＝主成分分析（Principal Component Analysis）"], ["pca = PCA(n_components=0.95)", "建立一個 PCA 物件，存進 pca；n_components＝要保留的主成分數量；填 0 到 1 的小數 0.95＝不是 0.95 個，而是「累積解釋變異比例要達到 95%」，由程式自動決定要幾個"], ["X_new = pca.fit_transform(X_scaled)", "fit＝學習（從資料算出特徵值、主成分方向）；transform＝套用（把資料投影到這些主成分上，得到降維後的新座標）；fit_transform＝兩步一次做完；X_scaled＝已標準化的特徵矩陣（PCA 前要先標準化）；結果存進 X_new"]], "tip": "n_components 是 0~1 小數 ＝ 累積解釋變異比例門檻；是整數 ＝ 固定保留幾個。"}}, {"no": 24, "section": "5.1", "topic_id": "5.1-03", "topic": "特徵工程策略", "style": "情境", "stem": "某電信公司要預測「每位用戶下個月是否退租」，但手上的原始資料是通話明細表，每通電話一列（用戶編號、時間、通話秒數、是否撥打客服專線）。若要把它轉成適合建模的「每位用戶一列」特徵，下列哪一種特徵工程策略最適當？", "options": {"A": "對數轉換（Log Transform）：對通話秒數取對數，壓縮右偏分佈但仍維持每通電話一列，模型依舊看不到用戶層級行為", "B": "標籤編碼（Label Encoding）：把用戶編號轉成整數，直接當作模型的特徵", "C": "統計聚合（Aggregation）：依用戶彙總出近 30 天通話次數、平均通話秒數與撥打客服專線次數", "D": "隨機抽樣（Random Sampling）：每位用戶只隨機保留一通電話作為代表"}, "answer": "C", "explanation": "答案 C。當原始資料粒度（每通電話）與預測對象（每位用戶）不同，要用統計聚合把明細彙整成使用者層級的特徵，例如近 30 天的次數、平均值、比例。這是特徵工程中「挖掘隱含結構」的常見做法，與單純轉換單一欄位不同。", "per_option": {"A": "對數轉換只改變單一欄位的分佈，並沒有把資料轉成用戶層級。", "B": "用戶編號只是識別碼，轉成整數會引入毫無意義的大小順序，也沒有預測資訊。", "C": "統計聚合能把多筆行為紀錄彙整成使用者層級的行為特徵，直接對應「每位用戶一列」的建模需求。", "D": "只留一通電話會丟失絕大部分行為資訊，不能代表用戶的整體使用習慣。"}, "guide_ref": "學習指引 p.5-9～5-10", "hot": true}, {"no": 25, "section": "5.1", "topic_id": "5.1-04", "topic": "類別特徵編碼", "style": "情境", "stem": "某工程師對高基數的「郵遞區號」欄位做目標編碼（Target Encoding）：先用整份訓練資料算出各郵遞區號的平均購買率，再用這個平均取代區號，然後做交叉驗證，AUC 高達 0.95。模型上線後 AUC 卻掉到 0.70。下列何者是最可能的原因與改善方式？", "options": {"A": "改用獨熱編碼（One-Hot Encoding）：目標編碼會讓維度暴增，應改用增加欄位的做法", "B": "防止洩漏（Leakage Prevention）：編碼平均值含驗證樣本的標籤，應只用每折訓練資料計算", "C": "改用標籤編碼（Label Encoding）：郵遞區號屬於有順序的類別，應保留大小關係", "D": "改用準確率（Accuracy）：AUC 對類別不平衡過度敏感，驗證分數因而不可信"}, "answer": "B", "explanation": "答案 B。目標編碼（以類別在目標上的平均取代類別）不增加維度，適合高基數，但要小心資料洩漏：若平均值是用包含驗證樣本標籤的資料算出來的，交叉驗證分數會虛高，上線就崩。正確做法是每一折只用訓練折資料計算編碼（可放進 Pipeline 或用交叉折疊、平滑處理）。", "per_option": {"A": "目標編碼每個類別只用一個數字取代，不增加維度；One-Hot 才會使高基數維度暴增。", "B": "目標編碼用到標籤資訊，若編碼時包含了驗證樣本的標籤，驗證分數就會被高估。", "C": "郵遞區號是無序的名目類別，用標籤編碼會引入錯誤的大小順序。", "D": "AUC 通常比準確率更適合不平衡資料；問題的根源是洩漏，不是指標選擇。"}, "guide_ref": "學習指引 p.5-7～5-8", "hot": false}, {"no": 26, "section": "5.1", "topic_id": "5.1-09", "topic": "程式碼閱讀：前處理", "style": "情境", "stem": "某分析師執行下列程式：\n```\nimport pandas as pd\ndf = pd.DataFrame({'color': ['red', 'blue', 'green', 'blue']})\nout = pd.get_dummies(df['color'], drop_first=True)\nprint(out.shape)\n```\n下列對輸出結果的敘述，何者正確？", "options": {"A": "(4, 3)：三種顏色各產生一欄，drop_first=True 只影響欄位的排列順序，欄位數量維持不變", "B": "(4, 1)：只保留出現次數最多的 blue 這一欄，其餘欄位全部移除", "C": "(4, 2)：保留 blue 與 green 兩欄，移除字母順序最後的 red 欄", "D": "(4, 2)：依字母順序移除第一個類別 blue，保留 green 與 red，避免虛擬變數陷阱"}, "answer": "D", "explanation": "答案 D。pd.get_dummies 會把類別依排序（blue、green、red）展開成 One-hot 欄位；drop_first=True 會丟掉第一個類別（blue），得到 green、red 兩欄，形狀 (4, 2)。目的是避免虛擬變數陷阱（三欄總和恆為 1，造成共線性）。blue 的列在 green、red 都是 0。", "per_option": {"A": "drop_first=True 會真的少一欄，不只是改順序；(4, 3) 是預設 False 的結果。", "B": "drop_first 丟的是第一個類別，與出現次數無關，且不會只剩一欄。", "C": "形狀 (4, 2) 沒錯，但被移除的是字母順序最前的 blue，不是最後的 red。", "D": "get_dummies 會依類別排序（blue、green、red）產生欄位，drop_first=True 丟掉第一欄 blue，剩 green、red 兩欄。"}, "guide_ref": "指引未載", "hot": false, "detail": {"steps": [["① 數類別、排順序", "get_dummies 的類別依排序展開；drop_first=True 會丟掉排序後的第一個類別", "color 欄出現 red、blue、green、blue → 不重複的類別有 3 種，依字母排序：blue、green、red；丟掉第一個 blue，剩 green、red"], ["② 算輸出形狀", "形狀 ＝ (列數, 欄數)；欄數 ＝ 類別數 － 1（drop_first=True 時；預設 False 就是不減）", "列數：資料有 4 筆 → 4；欄數 ＝ 3 － 1 ＝ 2 → 形狀 (4, 2)。展開結果：red 列 → green＝0、red＝1；blue 列 → 0、0；green 列 → 1、0；blue 列 → 0、0"], ["③ 為什麼要丟一欄＋對照其他選項", "完整 One-hot 時，每列各欄總和恆為 1，其中一欄可由其他欄推出來（共線性，稱虛擬變數陷阱），所以丟掉一欄", "選 D：(4, 2)，丟掉 blue。A：(4, 3) 是預設 drop_first=False 的結果，drop_first=True 會真的少一欄。B：丟哪一欄與出現次數無關，也不會只剩一欄，(4, 1) 不對。C：形狀 (4, 2) 沒錯，但被丟掉的是排序第一的 blue，不是最後的 red"]], "code": [["import pandas as pd", "import＝匯入套件；pandas 是處理表格資料的工具；as pd＝簡稱 pd"], ["df = pd.DataFrame({'color': ['red', 'blue', 'green', 'blue']})", "DataFrame＝資料表（像 Excel）；大括號 {欄名: 資料清單}；這裡建立只有一欄 color 的表，共 4 列：red、blue、green、blue；存進變數 df"], ["out = pd.get_dummies(df['color'], drop_first=True)", "df['color']＝取出 color 那一欄；get_dummies＝虛擬變數（One-hot）編碼，每個類別變成一欄 0/1；drop_first=True＝丟掉排序後的第一個類別，避免欄位之間共線性；結果存進 out"], ["print(out.shape)", "shape＝形狀，格式 (列數, 欄數)；print＝印出來；結果是 (4, 2)"]], "tip": "get_dummies 欄位數 ＝ 類別數（drop_first=True 時再減 1），丟的是「排序第一」那一個。"}}, {"no": 27, "section": "5.2", "topic_id": "5.2-01", "topic": "模型可解釋性", "style": "情境", "stem": "某銀行以梯度提升樹（XGBoost）建立信貸審核模型，一位被拒絕的客戶依法要求銀行說明「我這一筆申請為什麼被拒絕」。下列哪一種方法最能針對這位客戶的單筆預測，量化各特徵的貢獻？", "options": {"A": "整體特徵重要性（Feature Importance）：彙總模型整體上哪些特徵較常被用來分裂", "B": "偏依圖（Partial Dependence Plot, PDP）：呈現單一特徵與預測平均值之間的整體關係，可顯示特徵變動時的平均趨勢", "C": "SHAP 值（SHapley Additive exPlanations）：依賽局理論計算每個特徵對該筆預測的貢獻", "D": "混淆矩陣（Confusion Matrix）：呈現各類別預測對錯的數量與整體分類表現"}, "answer": "C", "explanation": "答案 C。要解釋「單一個案為什麼這樣判斷」需要局部解釋方法，如 SHAP 或 LIME。整體特徵重要性與 PDP 屬全域層級，混淆矩陣只呈現整體分類結果。高風險場景（金融、醫療）常用黑盒子模型搭配 SHAP 等事後解釋工具滿足法遵稽核。", "per_option": {"A": "整體特徵重要性屬全域解釋，只能說明哪些特徵整體重要，無法回答某位客戶為何被拒。", "B": "PDP 呈現的是特徵與預測的整體（平均）關係，也不是針對單一個案。", "C": "SHAP 可拆解單筆預測，指出每個特徵把該客戶的分數往哪個方向推了多少。", "D": "混淆矩陣評估整體分類表現，無法解釋任何單一預測的成因。"}, "guide_ref": "學習指引 p.5-14～5-15", "hot": true}, {"no": 28, "section": "5.2", "topic_id": "5.2-02", "topic": "偏差與變異", "style": "情境", "stem": "某團隊用兩個迴歸模型預測房價（房價本身的標準差約 52 萬元）並比較誤差（RMSE，單位：萬元）。模型 X：訓練集 RMSE = 48、驗證集 RMSE = 50；模型 Y：訓練集 RMSE = 6、驗證集 RMSE = 41。依偏差與變異的觀點，下列判斷何者最合理？", "options": {"A": "模型 X 偏差高（欠擬合），模型 Y 變異高（過擬合）", "B": "模型 X 變異高（過擬合），模型 Y 偏差高（欠擬合）", "C": "模型 X 與模型 Y 都是高變異，只是程度不同", "D": "模型 X 已達到最佳的偏差與變異平衡，模型 Y 則是欠擬合"}, "answer": "A", "explanation": "答案 A。高偏差（欠擬合）＝連訓練資料都擬合不好，訓練誤差與驗證誤差都高且接近（X：48 與 50）。高變異（過擬合）＝訓練很好但驗證差、落差大（Y：6 與 41）。對策不同：X 要提高模型複雜度或補更有資訊的特徵；Y 要用正則化、更多資料或降低複雜度。", "per_option": {"A": "X 訓練與驗證誤差都高且接近＝高偏差；Y 訓練很低但驗證很高、落差大＝高變異。", "B": "兩個模型的判讀顛倒了：訓練誤差高而且接近驗證誤差是欠擬合，不是過擬合。", "C": "X 的訓練誤差本身就很高，並沒有「訓練好、驗證差」的落差，不是高變異。", "D": "X 的訓練與驗證誤差都很高，沒有達到好的平衡；Y 的落差大是過擬合而非欠擬合。"}, "guide_ref": "學習指引 p.5-16", "hot": false}, {"no": 29, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "情境", "stem": "某團隊用 300 筆資料評估分類模型，先後 3 次各自做 10 折交叉驗證（每次重新洗牌），平均分數分別為 0.78、0.84、0.81，波動明顯。團隊想降低「因切分方式不同」造成的估計不穩，並能觀察分數的變異程度，下列哪一種驗證方式最合適？", "options": {"A": "單次留出法（Hold-out）：只切一次訓練集與測試集，節省訓練時間，做法也最簡單", "B": "重複分層 K 折（Repeated Stratified K-Fold）：多次隨機重切並平均，還能看標準差", "C": "降低折數（2-Fold）：每折的驗證資料量變大，因此估計一定更穩定可靠，成本也更低", "D": "挑選最佳結果（Best-case Selection）：只取三次中最高的 0.84 作為泛化表現估計值"}, "answer": "B", "explanation": "答案 B。單次 K 折的結果會受隨機切分影響。重複 K 折（Repeated K-Fold）多次隨機重切再做 K 折，取平均能得到更穩的估計，也可以計算標準差看穩定度，代價是訓練成本更高。因為是分類問題，搭配分層（Stratified）可讓每折類別比例一致。", "per_option": {"A": "只切一次會更依賴運氣，波動更大，且看不出變異。", "B": "多次不同切分的 K 折結果取平均，可降低單次切分的運氣成分，也能看出分數的波動。", "C": "折數變少會使每折的訓練資料變少，估計偏差變大，並不保證更穩定。", "D": "只挑最高分是樂觀偏誤，會高估真實的泛化能力。"}, "guide_ref": "學習指引 p.5-17～5-18、5-26～5-29", "hot": true}, {"no": 30, "section": "5.3", "topic_id": "5.3-01", "topic": "交叉驗證", "style": "否定", "stem": "關於 scikit-learn 中 cross_val_score(model, X, y, cv=5) 的行為，下列敘述何者錯誤？", "options": {"A": "會把資料切成 5 份，輪流用 1 份驗證，共訓練並評分 5 次", "B": "會傳回 5 個分數，通常取平均值作為泛化表現的估計", "C": "若 model 是分類器且 y 為二元或多類別，預設使用分層 K 折（Stratified K-Fold）", "D": "若 model 是迴歸模型，同樣會預設使用分層切分，使各折目標值的分佈一致"}, "answer": "D", "explanation": "答案 D。cv 傳整數時，sklearn 的規則是：估計器為分類器且 y 為二元或多類別 → 使用 StratifiedKFold；其他情況（含迴歸）→ 使用一般 KFold。分層是依「類別比例」切分，連續的迴歸目標沒有類別可分層，所以不會有此預設。", "per_option": {"A": "敘述正確：5 折代表訓練與評分各 5 次。", "B": "敘述正確：回傳每一折的分數，常取平均與標準差。", "C": "敘述正確：這是 sklearn 對分類器的預設行為。", "D": "迴歸模型的目標是連續值，cv 為整數時只會用一般的 KFold，不會分層。"}, "guide_ref": "學習指引 p.5-26～5-29", "hot": true}, {"no": 31, "section": "5.3", "topic_id": "5.3-02", "topic": "分類評估指標", "style": "計算", "stem": "某醫院的肺結節篩檢模型在 1,000 位受檢者上的結果為：TP = 45、FN = 15、FP = 30、TN = 910。此模型的召回率（Recall）與精確率（Precision）分別為何？", "options": {"A": "召回率 0.75、精確率 0.60", "B": "召回率 0.60、精確率 0.75", "C": "召回率 0.75、精確率 0.97", "D": "召回率 0.955、精確率 0.60"}, "answer": "A", "explanation": "答案 A。Recall＝TP÷(TP+FN)＝45÷60＝0.75（實際陽性中抓到多少）；Precision＝TP÷(TP+FP)＝45÷75＝0.60（預測陽性中有多少是真的）。另外 Accuracy＝(45+910)÷1000＝0.955，特異度＝910÷940≈0.97，都不是題目所問。", "per_option": {"A": "Recall=45÷(45+15)=0.75；Precision=45÷(45+30)=0.60。", "B": "兩個指標的分母弄反了：Recall 的分母是 TP+FN，Precision 的分母是 TP+FP。", "C": "0.97 是 TN÷(TN+FP)=910÷940 的特異度，不是精確率。", "D": "0.955 是 (TP+TN)÷總數的準確率，不是召回率。"}, "guide_ref": "學習指引 p.5-20～5-22", "hot": true, "detail": {"steps": [["① 算召回率 Recall（實際陽性裡，抓到幾成）", "Recall ＝ TP ÷ (TP ＋ FN)（分母是「實際為陽性」的總數）", "＝ 45 ÷ (45 ＋ 15) ＝ 45 ÷ 60 ＝ 0.75"], ["② 算精確率 Precision（預測為陽性裡，有幾成是真的）", "Precision ＝ TP ÷ (TP ＋ FP)（分母是「預測為陽性」的總數）", "＝ 45 ÷ (45 ＋ 30) ＝ 45 ÷ 75 ＝ 0.60，所以 Recall 0.75、Precision 0.60，選 A"], ["③ 對照其他選項（那些數字是什麼）", "特異度 ＝ TN ÷ (TN ＋ FP)；準確率 ＝ (TP ＋ TN) ÷ 全部筆數", "B：把兩個分母弄反了（Recall 用了 TP＋FP 的 75、Precision 用了 TP＋FN 的 60）。C：0.97 是特異度 ＝ 910 ÷ (910 ＋ 30) ＝ 910 ÷ 940 ≈ 0.97，不是 Precision。D：0.955 是準確率 ＝ (45 ＋ 910) ÷ 1,000 ＝ 955 ÷ 1,000 ＝ 0.955，不是 Recall（全部筆數 ＝ 45＋15＋30＋910 ＝ 1,000）"]], "cm": {"pos": "有結節", "neg": "無結節", "tp": 45, "fp": 30, "fn": 15, "tn": 910}, "tip": "Recall 分母看「實際陽性」(TP＋FN)；Precision 分母看「預測陽性」(TP＋FP)。"}}, {"no": 32, "section": "5.3", "topic_id": "5.3-03", "topic": "學習曲線判讀", "style": "情境", "stem": "某工程師記錄影像分類模型在不同訓練輪數的損失：\n第 5 輪：訓練 0.62／驗證 0.64\n第 10 輪：訓練 0.41／驗證 0.47\n第 15 輪：訓練 0.30／驗證 0.46\n第 20 輪：訓練 0.19／驗證 0.52\n第 30 輪：訓練 0.08／驗證 0.71\n依學習曲線判讀，下列結論何者最合理？", "options": {"A": "兩條曲線整體都在下降，模型仍處於欠擬合，應繼續訓練直到訓練損失接近 0", "B": "第 30 輪的訓練損失最低，應以第 30 輪結束時的模型作為最終模型", "C": "約第 15 輪後驗證損失轉為上升，訓練損失仍下降，已過擬合，早停點應在此附近", "D": "訓練損失與驗證損失的差距始終很小，屬於健康的擬合，不需要調整任何設定"}, "answer": "C", "explanation": "答案 C。判讀學習曲線要同時看「差距」與「走向」：訓練損失持續下降，驗證損失在第 15 輪附近達到最低（0.46）後回升（0.52、0.71），兩者落差擴大，是過擬合。驗證損失開始反轉的位置就是早停（Early Stopping）要抓的時間點，應採用該處的模型。", "per_option": {"A": "驗證損失在第 15 輪後上升，並非兩條都下降；且兩者落差持續擴大。", "B": "訓練損失最低不代表泛化最好；第 30 輪驗證損失高達 0.71，是最差的。", "C": "驗證損失在第 15 輪最低（0.46），之後上升到 0.52、0.71，而訓練損失一路下降，是過擬合的典型走向。", "D": "訓練與驗證的差距從 0.02 一路擴大到 0.63，並不小，也不是健康的擬合。"}, "guide_ref": "學習指引 p.5-19～5-20", "hot": true}, {"no": 33, "section": "5.3", "topic_id": "5.3-04", "topic": "殘差分析", "style": "情境", "stem": "某能源公司用迴歸模型預測每日用電量，將殘差依日期先後排列後發現：連續好幾天殘差為正、接著連續好幾天為負，呈現緩慢起伏的波浪，相鄰日期的殘差明顯彼此相關。這最可能代表什麼問題？對應的處理方式為何？", "options": {"A": "異質變異性（Heteroscedasticity）：殘差隨預測值增大而擴散，宜對目標取對數轉換", "B": "殘差自相關（Autocorrelation）：模型沒納入時間的前後關聯，宜加入滯後特徵或改用時序模型", "C": "離群值（Outliers）：少數點的殘差特別大，宜先檢查並處理資料錯誤", "D": "多重共線性（Multicollinearity）：特徵之間高度相關，宜以 PCA 合併特徵"}, "answer": "B", "explanation": "答案 B。健康的殘差應隨機散布、彼此無關。若依時間排列後出現連續同號、起伏的規律，代表相鄰殘差相關（自相關），常見於時間序列資料——模型沒用上「前幾天」的資訊。對策是加入滯後特徵（lag）、移動平均，或改用時間序列模型。", "per_option": {"A": "異質變異性的特徵是殘差寬度隨預測值變大而呈喇叭形，不是依時間的波浪。", "B": "依時間排列的殘差有連續同號、波浪狀規律，是相鄰殘差相關（自相關）的典型現象。", "C": "離群值是個別極端大的殘差，不是整段連續的規律起伏。", "D": "共線性是特徵之間的問題，不會以「殘差沿時間起伏」呈現。"}, "guide_ref": "學習指引 p.5-24", "hot": true}, {"no": 34, "section": "5.3", "topic_id": "5.3-05", "topic": "迴歸評估指標", "style": "計算", "stem": "某迴歸模型對 5 筆測試資料的預測誤差（實際值減預測值，單位：萬元）分別為 2、−1、3、−2、8。此模型的 MAE 與 RMSE 約為多少？", "options": {"A": "MAE 約 3.2；RMSE 約 16.4", "B": "MAE 約 4.05；RMSE 約 3.2", "C": "MAE 約 2.0；RMSE 約 4.05", "D": "MAE 約 3.2；RMSE 約 4.05"}, "answer": "D", "explanation": "答案 D。MAE＝誤差絕對值的平均＝(2+1+3+2+8)÷5＝3.2。MSE＝誤差平方的平均＝(4+1+9+4+64)÷5＝16.4，RMSE＝√16.4≈4.05。RMSE 大於 MAE，是因為 8 這個大誤差被平方放大；兩者差距越大，代表誤差中極端值越明顯。", "per_option": {"A": "16.4 是 MSE，還沒開根號，不是 RMSE。", "B": "MAE 與 RMSE 的數值對調了；因為平方會放大大誤差，RMSE 必定不小於 MAE。", "C": "2.0 是誤差直接平均（正負抵銷），不是取絕對值後的 MAE。", "D": "MAE=(2+1+3+2+8)÷5=3.2；MSE=(4+1+9+4+64)÷5=16.4，RMSE=√16.4≈4.05。"}, "guide_ref": "學習指引 p.5-22～5-24", "hot": true, "detail": {"steps": [["① 算 MAE（平均絕對誤差）", "MAE ＝ (Σ|誤差ᵢ|) ÷ 筆數（先取絕對值，正負才不會抵消）", "絕對值：|2| ＋ |−1| ＋ |3| ＋ |−2| ＋ |8| ＝ 2 ＋ 1 ＋ 3 ＋ 2 ＋ 8 ＝ 16；筆數 5；MAE ＝ 16 ÷ 5 ＝ 3.2"], ["② 算 MSE（均方誤差）", "MSE ＝ (Σ 誤差ᵢ²) ÷ 筆數（每個誤差先平方再平均）", "平方：2² ＋ (−1)² ＋ 3² ＋ (−2)² ＋ 8² ＝ 4 ＋ 1 ＋ 9 ＋ 4 ＋ 64 ＝ 82；MSE ＝ 82 ÷ 5 ＝ 16.4"], ["③ 算 RMSE（開根號後回到原單位）", "RMSE ＝ √MSE", "＝ √16.4 ≈ 4.05（驗算：4.05² ≈ 16.40）。所以 MAE ＝ 3.2、RMSE ≈ 4.05，選 D"], ["④ 對照其他選項（怎麼算錯的）", "RMSE 一定 ≥ MAE（平方會放大大誤差）", "A：16.4 是第②步的 MSE，還沒開根號。B：MAE 與 RMSE 對調，4.05 > 3.2 不可能是 MAE（RMSE 不會小於 MAE）。C：2.0 是誤差直接平均 (2 － 1 ＋ 3 － 2 ＋ 8) ÷ 5 ＝ 10 ÷ 5 ＝ 2.0，正負互相抵消，沒取絕對值"]], "tip": "MAE＝絕對值平均；RMSE＝平方平均再開根號；RMSE ≥ MAE，差越多代表有極端大誤差。"}}, {"no": 35, "section": "5.3", "topic_id": "5.3-09", "topic": "資料洩漏與 Pipeline", "style": "情境", "stem": "某生技團隊有 200 位樣本、5,000 個基因特徵。他們先用全部資料以 SelectKBest 挑出與標籤最相關的 20 個特徵，再用這 20 個特徵做 10 折交叉驗證，AUC 高達 0.96；但實際對新受試者驗證時 AUC 僅 0.62。下列何者最可能是主因與正確作法？", "options": {"A": "保留全部特徵（Keep All Features）：特徵數 20 太少造成欠擬合，應用 5,000 個特徵再驗證", "B": "減少折數（2-Fold）：折數太多使分數被高估，應降為 2 折並重新比較結果", "C": "放進 Pipeline（Leakage Prevention）：特徵選擇已看過全部標籤，應與分類器同在每折內執行", "D": "改用準確率（Accuracy）：AUC 不適用於基因資料，準確率才能反映真實表現"}, "answer": "C", "explanation": "答案 C。任何「會看資料（尤其是標籤）」的步驟——標準化、特徵選擇、SMOTE、LDA／PCA——都必須只用訓練折 fit。若在交叉驗證之前用全資料選特徵，等於讓驗證折的標籤提前影響了模型，分數被高估。正確做法是 Pipeline(SelectKBest, 分類器) 搭配交叉驗證，讓每折各自選特徵。", "per_option": {"A": "問題是洩漏而非欠擬合；在樣本只有 200、特徵 5,000 的情況下，保留全部特徵反而更容易過擬合。", "B": "折數多寡不是造成虛高的原因，根本問題在於前處理沒有放進每一折。", "C": "特徵選擇用到標籤，若在交叉驗證之前對全資料做，驗證折的標籤資訊已經影響了特徵挑選，分數會虛高。", "D": "AUC 是合適的評估指標，更換指標不能消除資料洩漏。"}, "guide_ref": "指引未載", "hot": false}, {"no": 36, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "情境", "stem": "某工程師為嶺迴歸（Ridge Regression）調整正則化強度 λ，把 λ 由 0.1 一路加到 10,000 後，發現訓練誤差與驗證誤差都明顯上升，且幾乎所有係數都被壓得非常接近 0。下列判斷何者最合理？", "options": {"A": "降低 λ（Lower λ）：λ 過大使模型過於簡單而欠擬合，應用交叉驗證找適當值", "B": "加大 λ（Larger λ）：λ 越大越能防止過擬合，應繼續加大直到驗證誤差最低", "C": "精確歸零（Exact Zeroing）：L2 已把不重要特徵的權重壓成 0，等於完成特徵選擇", "D": "增加複雜度（More Complexity）：兩種誤差同時上升代表過擬合，應改用更複雜的模型"}, "answer": "A", "explanation": "答案 A。λ 控制懲罰強度：越大模型越簡單，過大會欠擬合（訓練與驗證誤差都升高、係數趨近 0）；越小越靈活，過小可能過擬合。所以 λ 要用驗證集或交叉驗證去找平衡點。L2（Ridge）只會讓權重變小，不會精確歸零；歸零是 L1（Lasso）的特性。", "per_option": {"A": "λ 太大使權重被過度壓縮，模型連訓練資料都學不好，是欠擬合；λ 需要用驗證調整。", "B": "λ 過大反而造成欠擬合；本題誤差已經上升，繼續加大只會更糟。", "C": "L2 只會讓權重變小、接近 0，不會精確等於 0；會歸零的是 L1。", "D": "兩者同時上升是欠擬合的訊號；過擬合才是訓練好、驗證差，且對策是降低複雜度而非提高。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true}, {"no": 37, "section": "5.4", "topic_id": "5.4-01", "topic": "L1/L2 正則化", "style": "否定", "stem": "關於 L1 與 L2 正則化，下列敘述何者不正確？", "options": {"A": "L1（Lasso）以權重絕對值總和作為懲罰，常使部分權重變成 0，得到稀疏模型", "B": "L2（Ridge）以平方和為懲罰，會把不重要特徵的權重精確壓成 0，可直接選特徵", "C": "在深度學習中，L2 懲罰常被稱為權重衰減（Weight Decay）", "D": "λ 是需要調整的超參數，過大可能欠擬合，過小可能無法有效抑制過擬合"}, "answer": "B", "explanation": "答案 B。L1（Lasso）：絕對值懲罰，部分權重變 0，稀疏、自動特徵選擇。L2（Ridge）：平方懲罰，權重變小但不歸零，遇到高度相關特徵時會分攤權重、較穩定。選項 B 把 L1 的特性安在 L2 身上，所以是錯的。", "per_option": {"A": "敘述正確：絕對值懲罰的幾何特性使部分權重落在 0。", "B": "L2 會讓權重普遍變小，但不會精確變成 0，所以不能直接用來篩選特徵；會歸零的是 L1。", "C": "敘述正確：權重衰減等效於 L2 正則化的做法。", "D": "敘述正確：λ 要透過驗證集或交叉驗證選擇。"}, "guide_ref": "學習指引 p.5-42～5-45", "hot": true}, {"no": 38, "section": "5.4", "topic_id": "5.4-02", "topic": "過擬合對策", "style": "情境", "stem": "某工程師訓練了含 Dropout 層的 PyTorch 影像分類模型，驗證時準確率正常。部署推論後，卻發現對同一張圖片重複推論多次，輸出的預測機率每次都略有不同。下列何者最可能是原因？", "options": {"A": "過擬合（Overfitting）：模型過度貼合訓練資料，所以同一輸入的輸出本來就不穩定", "B": "未標準化（No Normalization）：推論時沒有對圖片標準化，輸出因此隨機漂移", "C": "未呼叫 eval（Missing model.eval()）：推論時 Dropout 仍隨機關閉神經元", "D": "梯度爆炸（Gradient Explosion）：權重在推論過程中數值暴增，輸出隨之改變，需改用梯度裁剪來穩定"}, "answer": "C", "explanation": "答案 C。Dropout 是訓練時才隨機關閉部分神經元的正則化技巧，預測時不應丟棄。PyTorch 中需呼叫 model.eval()（搭配 torch.no_grad()）讓 Dropout 停止作用；否則每次前向傳播都套用不同的隨機遮罩，同一張圖的輸出就會不一樣。", "per_option": {"A": "過擬合是泛化差，不會讓同一輸入的輸出隨機變動。", "B": "少了標準化會讓輸出偏離，但每次相同輸入、相同處理的結果仍是固定的，不會隨機波動。", "C": "Dropout 只應在訓練時隨機關閉神經元；推論時未切換 eval 模式，隨機遮罩持續作用，輸出就會變動。", "D": "推論只做前向傳播，不會更新權重，也沒有梯度爆炸。"}, "guide_ref": "學習指引 p.5-45～5-46", "hot": true}, {"no": 39, "section": "5.4", "topic_id": "5.4-03", "topic": "學習率", "style": "情境", "stem": "某團隊訓練時發現，驗證損失連續 5 輪都沒有明顯改善，但手動把學習率調低後，損失又繼續下降。他們希望訓練流程能在「驗證表現停滯時」自動降低學習率，應採用下列哪一種學習率調度策略？", "options": {"A": "預熱（Warm-up）：訓練初期從很小的學習率逐步升高，常見於 Transformer", "B": "固定學習率（Constant Learning Rate）：整個訓練過程都使用同一個學習率", "C": "階梯式衰減（Step Decay）：不論驗證表現，每隔固定輪數就將學習率乘上固定比例", "D": "停滯時降低學習率（ReduceLROnPlateau）：監控驗證指標，停滯一定輪數後自動降低學習率"}, "answer": "D", "explanation": "答案 D。學習率調度常見策略：固定、遞減（Step、Exponential Decay，依預定時程降低）、ReduceLROnPlateau（驗證指標停滯就降低）、預熱（Warm-up，由小升大）。題目要求依「驗證表現停滯」自動調整，對應 ReduceLROnPlateau。", "per_option": {"A": "Warm-up 是一開始把學習率由小升大，不是在停滯時降低。", "B": "固定學習率不會隨訓練變化，無法自動降低。", "C": "Step Decay 依固定輪數排程降低，與驗證表現是否停滯無關。", "D": "ReduceLROnPlateau 以驗證指標是否停滯作為觸發條件，符合「停滯時才自動降低」。"}, "guide_ref": "學習指引 p.5-19、5-31～5-32", "hot": true}, {"no": 40, "section": "5.4", "topic_id": "5.4-04", "topic": "資料增強", "style": "情境", "stem": "某團隊訓練語音指令辨識模型（辨識「開燈」「關燈」等短指令），錄音資料不多，想用資料增強（Data Augmentation）提升泛化。下列哪一種增強方式最能增加多樣性，又不會改變語音指令的標籤語意？", "options": {"A": "噪音與變速（Noise and Speed Change）：加入背景噪音並輕微變速 ±10%", "B": "反向播放（Time Reversal）：把整段音訊倒著播放，當作新的訓練樣本使用", "C": "時間打亂（Segment Shuffling）：切成 10 段後隨機打亂時間順序再接回", "D": "極端變調（Extreme Pitch Shift）：把音高大幅提高到原來的三倍以上"}, "answer": "A", "explanation": "答案 A。資料增強的關鍵是「變換不能改變標籤語意」。音訊常用的增強有變速、變音量、加背景噪音。倒放、打亂時間順序、極端改變音高都會破壞語音內容，等於餵給模型錯誤的標籤。", "per_option": {"A": "背景噪音與輕微變速模擬真實環境的變化，語音內容仍可辨識，標籤不變。", "B": "倒放後語音內容無法辨識，已不再是原指令，標籤與內容不符。", "C": "打亂時間順序會破壞音節的先後關係，語意被改變。", "D": "音高大幅變動會使語音失真到難以辨識，可能產生與標籤不符的樣本。"}, "guide_ref": "學習指引 p.5-9、5-47", "hot": true}, {"no": 41, "section": "5.4", "topic_id": "5.4-05", "topic": "模型量化", "style": "計算", "stem": "某模型有 2,500 萬個參數，原以 32-bit 浮點數（FP32）儲存。團隊將權重量化為 8-bit 整數（INT8）以部署到行動裝置。若只計算權重所需的儲存空間（1 MB = 10⁶ bytes），量化前後約為多少？", "options": {"A": "100 MB 降為 50 MB", "B": "100 MB 降為 25 MB", "C": "800 MB 降為 200 MB", "D": "25 MB 降為 6.25 MB"}, "answer": "B", "explanation": "答案 B。32-bit＝4 bytes，所以 FP32 權重為 25,000,000×4 bytes＝100 MB；8-bit＝1 byte，INT8 為 25 MB，體積縮小為 1/4。量化是降低數值精度（不是移除權重），直接量化可能讓準確率下降，常搭配量化感知訓練（QAT）。", "per_option": {"A": "降為 50 MB 相當於 16-bit（2 bytes），不是 8-bit。", "B": "FP32 每個參數 4 bytes：2,500 萬×4＝100 MB；INT8 每個參數 1 byte：25 MB。", "C": "800 MB 是把 bit 數 32×2,500 萬直接當成 bytes，單位弄錯（32 bit＝4 bytes）。", "D": "25 MB 是 INT8 的大小，不是 FP32 的大小，起點算錯。"}, "guide_ref": "學習指引 p.5-51～5-52", "hot": false, "detail": {"steps": [["① 每個參數佔幾 bytes", "每參數 bytes ＝ bit 數 ÷ 每 byte 的 bit 數", "每 byte 有 8 bit。FP32：32 ÷ 8 ＝ 4 bytes；INT8：8 ÷ 8 ＝ 1 byte"], ["② 算量化前（FP32）的總大小", "總大小(MB) ＝ 參數個數 × 每參數 bytes ÷ 一百萬（MB 換算依題目設定：一 MB 等於一百萬 bytes）", "2,500 萬 ＝ 25,000,000；25,000,000 × 4 ＝ 100,000,000 bytes ＝ 100 MB"], ["③ 算量化後（INT8）的總大小", "總大小(MB) ＝ 參數個數 × 每參數 bytes ÷ 一百萬", "25,000,000 × 1 ＝ 25,000,000 bytes ＝ 25 MB（縮小倍數 ＝ 100 ÷ 25 ＝ 4 倍），選 B：100 MB 降為 25 MB"], ["④ 對照其他選項（怎麼算錯的）", "A：用錯位元數；C：bit 當 byte；D：起點弄錯", "A：50 MB ＝ 25,000,000 × 2 bytes，2 bytes 是 16-bit（16 ÷ 8 ＝ 2），不是 8-bit。C：800 MB ＝ 25,000,000 × 32，把 32 bit 直接當成 32 bytes；INT8 的 200 MB ＝ 25,000,000 × 8 也是同樣的錯。D：25 MB 是 INT8 的大小不是 FP32；再 ÷ 4 ＝ 6.25 MB 是把已經量化過的大小又縮了一次"]], "tip": "bytes ＝ bit ÷ 8；FP32 → INT8，體積縮小為 1/4。"}}, {"no": 42, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "情境", "stem": "五家區域醫院想共同訓練一個病理影像辨識模型，但依法病患影像不能離開各院，也不能集中到單一平台。下列哪一種做法最符合需求？", "options": {"A": "集中式訓練（Centralized Training）：各院先把影像匿名化，再上傳到同一平台統一訓練", "B": "同態加密（Homomorphic Encryption）：各院把影像加密後上傳，由雲端直接在密文上訓練", "C": "資料增強（Data Augmentation）：用翻轉與旋轉擴增各院的影像，彌補資料量不足", "D": "聯邦學習（Federated Learning）：影像留在各院本地訓練，只回傳模型參數更新，由中央彙整"}, "answer": "D", "explanation": "答案 D。題目的關鍵限制是「影像不能離開各院」。聯邦學習在各機構本地訓練，只把模型參數更新傳回中央彙整，原始資料不出門。同態加密是資料可以送出去、以密文狀態運算，與本題限制不同。聯邦學習的代價是通訊成本高，且參數仍可能被逆向推導。", "per_option": {"A": "集中式訓練必須把影像上傳，違反影像不能離開各院的規定。", "B": "同態加密的做法是把（加密後的）資料送出去運算，資料仍離開各院，與題目限制不符。", "C": "資料增強只是擴充樣本，與跨機構的隱私與共同訓練需求無關。", "D": "聯邦學習讓資料不出本地，只交換模型更新，符合「影像不能離開各院」。"}, "guide_ref": "學習指引 p.6-10～6-12", "hot": true}, {"no": 43, "section": "6.1", "topic_id": "6.1-05", "topic": "隱私保護技術", "style": "否定", "stem": "關於隱私強化技術（PETs）的敘述，下列何者錯誤？", "options": {"A": "聯邦學習只傳回模型參數更新而不傳原始資料，但通訊成本可能較高，且參數仍有被逆向推導的風險", "B": "同態加密允許直接對密文運算，解密後的結果與在明文上運算相同，但計算效能通常較低", "C": "差分隱私是直接對加密後的資料做運算，因此計算結果與在明文上運算完全相同，也不影響準確度", "D": "安全多方計算（MPC）讓多方在不揭露各自輸入的情況下，共同算出某個函數的結果"}, "answer": "C", "explanation": "答案 C。差分隱私（Differential Privacy）的做法是加入噪聲保護個體，不是在密文上運算；「在密文上運算、解密後結果與明文相同」描述的是同態加密。選項 C 把兩者混為一談，且噪聲會造成隱私與準確度的取捨，所以敘述錯誤。", "per_option": {"A": "敘述正確：這是聯邦學習的特性與已知弱點。", "B": "敘述正確：這是同態加密的定義與缺點（效能低）。", "C": "差分隱私是對結果或訓練過程加入精心設計的噪聲，使單一個人的資料難被察覺，必然會對準確度有些影響。", "D": "敘述正確：這是 MPC 的定義。"}, "guide_ref": "學習指引 p.6-10～6-12", "hot": true}, {"no": 44, "section": "6.2", "topic_id": "6.2-01", "topic": "偏見類型與成因", "style": "情境", "stem": "某公司以過去十年的人事錄取紀錄訓練履歷篩選模型。資料中男女申請者人數相近、樣本量充足，但過去的錄取決策長期偏好男性。上線後，模型對條件相近的女性申請者給出較低的錄取分數。這個現象最主要屬於下列哪一類偏見成因？", "options": {"A": "標籤偏差（Label Bias）：作為標籤的歷史決策本身就帶有主觀偏見，被模型學了進去", "B": "取樣偏差（Sampling Bias）：訓練樣本沒有涵蓋目標族群，導致代表性不足", "C": "過擬合（Overfitting）：模型過度貼合訓練資料的雜訊，使泛化能力下降", "D": "維度災難（Curse of Dimensionality）：特徵太多使距離計算失效"}, "answer": "A", "explanation": "答案 A。偏見的資料層面成因包含取樣偏差（樣本沒代表全體）與標籤偏差（標記資料本身帶主觀偏見）。本題樣本充足、男女相當，但標籤是「歷史錄取決策」，本身偏好男性，所以是標籤偏差。過擬合、維度災難屬技術問題，不是偏見類型。", "per_option": {"A": "錄取與否的標籤是人過去的決策，這些決策本身偏好男性，模型就學到同樣的偏見。", "B": "題目明講男女人數相近、樣本量充足，樣本並非缺少某族群。", "C": "過擬合是技術上的泛化問題，不是偏見的來源類型。", "D": "特徵過多造成的距離失效與偏見成因無關。"}, "guide_ref": "學習指引 p.6-14～6-17", "hot": true}, {"no": 45, "section": "6.2", "topic_id": "6.2-03", "topic": "公平性指標", "style": "情境", "stem": "某醫療 AI 用於早期篩檢某疾病。在「實際有病」的人之中，A 族群有 90% 被模型正確判為陽性，B 族群只有 70% 被正確判為陽性。這個結果最直接顯示模型未滿足下列哪一項公平性準則？", "options": {"A": "統計均等（Demographic Parity）：各族群被判為正向的比例應相近，不考慮實際是否有病", "B": "機會平等（Equal Opportunity）：在實際應被判為正向的人之中，各族群的真陽性率（TPR）應相同", "C": "個體公平（Individual Fairness）：條件相似的個人應得到相似的預測", "D": "無意識公平（Fairness through Unawareness）：不把族群欄位當輸入特徵就視為公平"}, "answer": "B", "explanation": "答案 B。機會平等（Equal Opportunity）要求：在真正應被選中（有病）的人之中，各群體被正確預測為正的機率（TPR）要相同。本題 A 為 90%、B 為 70%，兩群 TPR 差 20 個百分點，B 族群的病患更容易被漏診，直接違反機會平等。", "per_option": {"A": "統計均等比較的是各族群被判為正向的整體比例，不看實際是否有病，題目給的不是這個量。", "B": "題目比較的是「實際有病者中被抓到的比例」＝TPR，這正是機會平等要求相同的量。", "C": "個體公平比較的是相似個人之間的預測差異，題目給的是族群層級的 TPR。", "D": "無意識公平只是不使用敏感欄位的做法，並不能保證各族群的結果相同，也不是題目比較的量。"}, "guide_ref": "學習指引 p.6-17～6-19", "hot": false}, {"no": 46, "section": "X", "topic_id": "X-01", "topic": "參數量與運算量", "style": "計算", "stem": "某 CNN 的其中一層為 nn.Conv2d(in_channels=16, out_channels=32, kernel_size=5)，含偏差項（bias），輸入特徵圖大小為 128×128。這一層的可學習參數量為何？", "options": {"A": "12,800", "B": "196,812,800", "C": "832", "D": "12,832"}, "answer": "D", "explanation": "答案 D。卷積層參數量＝核高×核寬×輸入通道×輸出通道＋輸出通道＝5×5×16×32＋32＝12,832，與輸入特徵圖大小無關（權重共享）。圖片大小只會影響運算量：約 12,800×124×124≈1.97 億次乘加。", "per_option": {"A": "12,800 只算了權重，漏掉 32 個偏差項。", "B": "196,812,800 是把權重數乘上輸出特徵圖 124×124 的結果，那是運算量（乘加次數），不是參數量。", "C": "832 是漏乘了輸入通道數 16（5×5×32＋32）。", "D": "5×5×16×32＋32＝12,800＋32＝12,832。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 寫出卷積層參數量公式，代入題目", "參數量 ＝ 核高 × 核寬 × 輸入通道數 × 輸出通道數 ＋ 輸出通道數（最後的「＋輸出通道數」是每個濾波器各一個偏差 bias）", "核 5×5、輸入通道 16、輸出通道 32：權重 ＝ 5×5×16×32 ＝ 25×16×32 ＝ 400×32 ＝ 12,800；加偏差 ＋ 32 ＝ 12,832，選 D"], ["② 為什麼跟輸入特徵圖大小無關", "同一個濾波器會在整張圖上滑動、重複使用（權重共享）", "輸入 128×128 只決定輸出圖多大，不會增加參數；參數量固定是 12,832"], ["③ 對照其他選項（怎麼算錯的）", "輸出邊長 ＝ (輸入邊長 － 核邊長) ÷ 步幅 ＋ 1（預設無補零、步幅取預設值）", "A：12,800 只有權重，漏掉 32 個偏差。C：832 ＝ 5×5×32 ＋ 32 ＝ 800 ＋ 32，漏乘輸入通道 16。B：196,812,800：輸出邊長 ＝ (128 － 5) ÷ 1 ＋ 1 ＝ 124，輸出圖有 124×124 ＝ 15,376 格，12,800 × 15,376 ＝ 196,812,800，這是「運算量」（乘加次數），不是參數量"]], "tip": "Conv 參數量 ＝ 核面積 × 輸入通道 × 輸出通道 ＋ 輸出通道；與圖片大小無關。", "fig": {"type": "layers", "title": "每一層的形狀", "items": [{"name": "輸入", "shape": "128×128×16"}, {"name": "Conv 5×5，32 個", "shape": "124×124×32", "note": "參數 (5×5×16＋1)×32 ＝ 12,832", "hl": true}], "note": "參數量只看濾波器，與圖片 128×128 的大小無關"}}}, {"no": 47, "section": "X", "topic_id": "X-02", "topic": "時間序列驗證", "style": "計算", "stem": "某團隊對 500 筆依時間排序的銷售資料，使用 scikit-learn 的 TimeSeriesSplit(n_splits=4)（其餘參數為預設）做驗證。四折的訓練集筆數依序為何？", "options": {"A": "100、200、300、400", "B": "400、400、400、400", "C": "400、300、200、100", "D": "100、100、100、100"}, "answer": "A", "explanation": "答案 A。TimeSeriesSplit 預設為擴張視窗：驗證集（test）大小＝n÷(n_splits+1)＝500÷5＝100；第 k 折的訓練集為前 k×100 筆，所以訓練集筆數為 100、200、300、400，驗證集始終緊接在訓練集之後的 100 筆。若要接近滾動視窗，可設定 max_train_size 限制訓練長度。", "per_option": {"A": "預設是擴張視窗：每折驗證集 500÷(4+1)＝100 筆，訓練集由 100 逐折增加到 400。", "B": "訓練集長度並非固定 400；預設不是固定長度的視窗，也不是 4 折全用同樣大小。", "C": "訓練集會隨時間往後推進而變大，不會越來越小。", "D": "每折訓練集會累積先前的資料，而不是每次都只有 100 筆。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 算每折的驗證集大小", "驗證集大小 ＝ 總筆數 ÷ (折數 ＋ 1)（TimeSeriesSplit 的預設算法，無條件捨去）", "＝ 500 ÷ (4 ＋ 1) ＝ 500 ÷ 5 ＝ 100 筆"], ["② 算第一折的訓練集大小", "第一折訓練集 ＝ 總筆數 － 折數 × 驗證集大小（把後面要留給四折驗證的資料扣掉，前面剩下的都是第一折訓練）", "＝ 500 － 4 × 100 ＝ 500 － 400 ＝ 100 筆"], ["③ 之後每折（預設是擴張視窗：訓練集越滾越大）", "第 k 折訓練集 ＝ 第一折訓練集 ＋ (k － 1) × 驗證集大小", "第 1 折：100；第 2 折：100 ＋ 100 ＝ 200；第 3 折：300；第 4 折：400。驗證集永遠緊接在訓練集後面：第 1 折訓練第 1～100 筆、驗證第 101～200 筆；……第 4 折訓練前 400 筆、驗證第 401～500 筆。訓練集筆數 100、200、300、400，選 A"], ["④ 對照其他選項（為什麼不對）", "預設不限制訓練長度（max_train_size 預設沒設定）", "B：400、400、400、400 是四折訓練集都一樣大，預設不是固定。C：400、300、200、100 是越來越小，時間往後走，已見過的資料會累積，只會越來越多。D：100、100、100、100 是固定長度的滾動視窗，要設 max_train_size＝100 才會出現"]], "tip": "TimeSeriesSplit 預設：驗證集 ＝ n÷(折數＋1)，訓練集由小逐折變大，驗證集永遠在未來。"}}, {"no": 48, "section": "X", "topic_id": "X-03", "topic": "網格與隨機搜尋", "style": "計算", "stem": "某團隊要調整梯度提升模型的超參數：learning_rate 有 4 個候選值、max_depth 有 5 個、n_estimators 有 3 個、subsample 有 2 個。若用網格搜尋（GridSearchCV）搭配 3 折交叉驗證，與用隨機搜尋（抽樣 50 組、同樣 3 折）相比，網格搜尋在搜尋階段（不含最後以最佳參數重新訓練）多出幾次模型訓練？", "options": {"A": "360 次", "B": "120 次", "C": "210 次", "D": "70 次"}, "answer": "C", "explanation": "答案 C。網格搜尋的組合數是各超參數候選數「相乘」：4×5×3×2＝120；每組要做 3 折交叉驗證，總訓練次數＝120×3＝360。隨機搜尋抽 50 組、每組 3 折＝150 次。差距 360−150＝210 次。", "per_option": {"A": "360 是網格搜尋本身的總訓練次數，還沒扣掉隨機搜尋的 150 次。", "B": "120 只是網格的組合數，沒有乘上折數，也沒有扣掉隨機搜尋。", "C": "網格：4×5×3×2＝120 組，×3 折＝360 次；隨機：50×3＝150 次；差 210 次。", "D": "70 是 120−50 的組合數差，忘了每組都要訓練 3 折。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 算網格搜尋要試幾組超參數", "組合數 ＝ 各超參數候選數「相乘」（每個值都要跟其他超參數的每個值搭配一次）", "＝ 4 × 5 × 3 × 2 ＝ 20 × 3 × 2 ＝ 60 × 2 ＝ 120 組"], ["② 算網格搜尋的總訓練次數", "總訓練次數 ＝ 組合數 × 交叉驗證折數（每一組都要在每一折各訓練一次）", "＝ 120 × 3 ＝ 360 次"], ["③ 算隨機搜尋的總訓練次數", "總訓練次數 ＝ 抽樣組數 × 折數", "＝ 50 × 3 ＝ 150 次"], ["④ 算差距", "多出的次數 ＝ 網格次數 － 隨機次數", "＝ 360 － 150 ＝ 210 次，選 C"], ["⑤ 對照其他選項（怎麼算錯的）", "A：沒扣隨機；B：沒乘折數；D：用組數差", "A：360 是網格自己的總次數，沒扣掉隨機的 150。B：120 只是組合數，沒乘折數也沒扣隨機。D：70 ＝ 120 － 50 是「組數」的差，忘了每組要訓練 3 折（70 × 3 ＝ 210，這才是對的）"]], "tip": "網格搜尋＝候選數相乘；總訓練次數＝組合數 × 折數；兩者相比要用「次數」不要用「組數」。", "fig": {"type": "folds", "title": "每組都要做 3 折", "k": 3, "note": "網格 120 組×3＝360 次；隨機 50 組×3＝150 次；多 210 次"}}}, {"no": 49, "section": "X", "topic_id": "X-04", "topic": "蒙地卡羅方法", "style": "計算", "stem": "工程師用蒙地卡羅方法估計圓周率：在邊長 1 的正方形內均勻隨機撒 20,000 個點，其中 15,700 個落在以正方形左下角為圓心、半徑 1 的四分之一圓內。依此估計，π 約為多少？", "options": {"A": "0.785", "B": "3.14", "C": "1.57", "D": "1.274"}, "answer": "B", "explanation": "答案 B。正方形面積 1，四分之一圓面積 π/4，隨機落點落在圓內的機率＝面積比＝π/4。所以 π≈4×(圓內點數÷總點數)＝4×15,700÷20,000＝3.14。樣本越多越準，誤差約與 √N 成反比。", "per_option": {"A": "0.785 是落點比例，也就是 π/4，還沒乘以 4。", "B": "落點比例＝15,700÷20,000＝0.785 ≈ 四分之一圓面積 π/4，故 π≈4×0.785＝3.14。", "C": "1.57 只乘了 2（0.785×2），四分之一圓要乘 4 才是 π。", "D": "1.274 是 20,000÷15,700（總點數÷圓內點數），比例上下顛倒了；正確的落點比例應是圓內點數÷總點數＝0.785。"}, "guide_ref": "指引未載", "hot": true, "detail": {"steps": [["① 算實際落點的比例", "落在圓內的比例 ＝ 圓內點數 ÷ 總點數", "＝ 15,700 ÷ 20,000 ＝ 0.785"], ["② 用幾何面積找出比例與 π 的關係", "點是均勻亂撒的，落進某區域的機率 ＝ 該區域面積 ÷ 正方形面積；四分之一圓面積 ＝ π × 半徑² ÷ 4；正方形面積 ＝ 邊長²", "半徑 1、邊長 1：落點機率 ＝ (π × 1² ÷ 4) ÷ 1² ＝ π ÷ 4。所以 π ≈ 4 × 落點比例"], ["③ 估計 π", "π ≈ 4 × (圓內點數 ÷ 總點數)", "＝ 4 × 0.785 ＝ 3.14，選 B"], ["④ 對照其他選項（怎麼算錯的）", "A：沒乘係數；C：係數乘不夠；D：比例上下顛倒", "A：0.785 就是第①步的落點比例 ＝ π ÷ 4，還沒乘 4。C：1.57 ＝ 0.785 × 2，只乘了 2，四分之一圓要乘 4。D：1.274 ＝ 20,000 ÷ 15,700 ≈ 1.274，把總點數放分子、圓內點數放分母，上下顛倒了"]], "tip": "蒙地卡羅估 π：π ≈ 4 × 圓內點數 ÷ 總點數；因為四分之一圓面積是 π/4。"}}, {"no": 50, "section": "X", "topic_id": "X-05", "topic": "AutoML", "style": "否定", "stem": "關於自動化機器學習（AutoML），下列敘述何者錯誤？", "options": {"A": "可自動化資料前處理、特徵工程、演算法選擇與超參數調整等重複性高的步驟", "B": "適合在短時間內比較多種模型、快速建立基準模型與驗證原型的情境", "C": "對需要精細控制特徵工程與演算法細節的高度客製化專案，手工建模通常仍較合適", "D": "AutoML 可自動完成資料品質檢查與問題定義，不再需要人為把關"}, "answer": "D", "explanation": "答案 D。AutoML 把前處理、特徵工程、模型選擇與超參數調整等重複步驟自動化，能縮短開發時間、適合快速建立基準。但它不等於免除人的工作：問題怎麼定義、資料品質好不好、結果如何解讀仍需要人把關；黑箱程度與客製化限制也是缺點。", "per_option": {"A": "敘述正確：這是 AutoML 自動化的主要範圍。", "B": "敘述正確：這是 AutoML 最適合的使用情境。", "C": "敘述正確：AutoML 的客製化與控制細節有限，高度客製專案是手工建模的主場。", "D": "AutoML 自動化的是建模流程中重複的步驟，問題定義、資料品質與結果解讀仍需要人來把關。"}, "guide_ref": "指引未載", "hot": false}], "2": [{"no": 1, "section": "3.1", "topic_id": "3.1-02", "topic": "連續分佈與 PDF", "style": "情境", "stem": "某品管工程師量測某種零件的厚度（單位：公分），並以連續機率分佈擬合資料。擬合後在厚度恰為 2.00 的位置，機率密度函數（PDF）的值為 3.2。同事質疑：「機率不可能大於 1，這一定是算錯了。」下列關於此情況的說明，何者最正確？", "options": {"A": "連續變數取到某個確切數值的機率為 0，所以該點的 PDF 值必定為 0，3.2 一定是算錯", "B": "PDF 的值必須介於 0 到 1 之間，否則曲線下的總面積會超過 1，因此此擬合結果無效", "C": "PDF 的值是密度而不是機率，可以大於 1；厚度落在某區間的機率要看曲線下的面積", "D": "PDF 的值就是該點出現的機率，超過 1 代表尚未正規化，需把所有密度值除以最大值"}, "answer": "C", "explanation": "答案 C。PDF 描述的是機率「密度」，不是機率本身。厚度落在 [a, b] 的機率等於密度曲線在該區間下的面積，單一點的機率為 0。只要全部面積加起來等於 1，某些位置的密度值就可以大於 1，例如分佈很集中、範圍很窄時。", "per_option": {"A": "單點機率為 0 是指「面積」為 0，並不代表該點的密度高度為 0。", "B": "總面積為 1 並不要求每一點的高度都不超過 1；範圍很窄的分佈密度值可以遠大於 1。", "C": "密度值可以大於 1，只要在整個範圍內積分後總面積等於 1，區間機率才是面積。", "D": "密度值不是機率，也不需要除以最大值；正規化的條件是總面積為 1，與單點的高度無關。"}, "guide_ref": "學習指引 p.3-3～3-4", "hot": false}, {"no": 2, "section": "3.1", "topic_id": "3.1-03", "topic": "貝氏定理與條件機率", "style": "計算", "stem": "某電商分析 10,000 次網站訪客紀錄：其中 2,500 次曾瀏覽促銷頁面（事件 B），這 2,500 次之中有 600 次最後下單購買（事件 A 且 B），全部 10,000 次中共有 1,200 次下單購買（事件 A）。若要估計「在已知訪客瀏覽過促銷頁面的條件下，會下單購買」的機率 P(A|B)，結果最接近下列何者？", "options": {"A": "0.24", "B": "0.50", "C": "0.06", "D": "0.12"}, "answer": "A", "explanation": "答案 A。條件機率 P(A|B) = P(A∩B) ÷ P(B)，分母是「已知發生」的條件事件。本題 P(A∩B) = 600/10,000，P(B) = 2,500/10,000，相除得 600 ÷ 2,500 = 0.24。注意 P(A|B) 與 P(B|A) 不是同一個數。", "per_option": {"A": "P(A|B) = P(A∩B) ÷ P(B) = 600 ÷ 2,500 = 0.24，分母是條件事件 B 的次數。", "B": "600 ÷ 1,200 是以「下單」為分母，算出的是 P(B|A)，條件顛倒了。", "C": "600 ÷ 10,000 是 A 與 B 同時發生的聯合機率 P(A∩B)，還沒有除以條件事件的機率。", "D": "1,200 ÷ 10,000 是下單的邊際機率 P(A)，沒有考慮「已瀏覽促銷頁」這個條件。"}, "guide_ref": "學習指引 p.3-5～3-6", "hot": true, "detail": {"steps": [["① 把題目的次數換成機率", "機率 ＝ 事件次數 ÷ 總次數", "P(A∩B)（瀏覽促銷頁且下單）＝ 600 ÷ 10,000 ＝ 0.06；P(B)（瀏覽促銷頁）＝ 2,500 ÷ 10,000 ＝ 0.25"], ["② 套用條件機率公式", "P(A｜B) ＝ P(A∩B) ÷ P(B)（直線右邊的 B 是「已知條件」，要放分母）", "＝ 0.06 ÷ 0.25 ＝ 0.24（也可以直接用次數：600 ÷ 2,500 ＝ 0.24，總次數會互相約掉），選 A"], ["③ 對照其他選項（各自算的是哪個機率）", "每個選項都是不同的「次數 ÷ 次數」", "B：600 ÷ 1,200 ＝ 0.50，分母放「下單」，算的是 P(B｜A)，條件顛倒。C：600 ÷ 10,000 ＝ 0.06，是 A 與 B 同時發生的聯合機率 P(A∩B)，還沒除以 P(B)。D：1,200 ÷ 10,000 ＝ 0.12，是下單的邊際機率 P(A)，沒用到「已瀏覽促銷頁」"]], "tip": "條件機率：分母是「已知發生」的那件事；P(A｜B) ＝ A 且 B ÷ B。", "fig": {"type": "tree", "title": "機率樹（10,000 次訪客）", "total": "10,000 次", "branches": [{"label": "看過促銷", "p": "25%", "n": "2,500 次", "leaves": [{"label": "下單", "p": "24%", "n": "600 次", "hl": "num"}, {"label": "沒下單", "p": "76%", "n": "1,900 次", "hl": "den"}]}, {"label": "沒看促銷", "p": "75%", "n": "7,500 次", "leaves": [{"label": "下單", "p": "8%", "n": "600 次"}, {"label": "沒下單", "p": "92%", "n": "6,900 次"}]}], "result": "P(A｜B) ＝ 600 ÷ (600＋1,900) ＝ 600 ÷ 2,500 ＝ 24%"}}}, {"no": 3, "section": "3.2", "topic_id": "3.2-02", "topic": "線性變換的幾何", "style": "計算", "stem": "某影像處理團隊對二維座標點套用矩陣 A = [[0, −1], [1, 0]]，也就是計算 A·x。若輸入向量 x = (3, 4)，輸出為 (−4, 3)。下列對此線性變換幾何意義的判斷，何者最適當？", "options": {"A": "縮放（Scaling）：向量方向保持不變，只改變長度", "B": "投影（Projection）：把向量壓到較低維的子空間，資訊會遺失", "C": "剪切（Shear）：一個軸向保持不動，另一個軸向被推斜", "D": "旋轉（Rotation）：向量長度保持不變，只改變方向"}, "answer": "D", "explanation": "答案 D。先算 A·x = (0×3 + (−1)×4, 1×3 + 0×4) = (−4, 3)。輸入長度 √(3²+4²) = 5，輸出長度 √((−4)²+3²) = 5，長度沒變但方向不同，所以是旋轉（此例為逆時針 90 度）。縮放改長度、不改方向；旋轉改方向、不改長度。", "per_option": {"A": "縮放的輸出會與輸入同方向（成比例），但 (−4,3) 與 (3,4) 並不平行。", "B": "此矩陣的行列式為 1、可逆，不會壓扁空間；投影才會讓資訊遺失並降維。", "C": "剪切會讓某個軸向保持不動，而此矩陣把 (1,0) 轉到 (0,1)、(0,1) 轉到 (−1,0)，兩軸都動了且長度不變。", "D": "輸入與輸出長度同為 5（√(9+16)＝√(16+9)），方向由 (3,4) 轉到 (−4,3)，這是旋轉。"}, "guide_ref": "學習指引 p.3-11～3-13", "hot": false, "detail": {"steps": [["① 算 A·x（矩陣乘向量）", "[[a, b], [c, d]] · (x, y) ＝ (a·x ＋ b·y, c·x ＋ d·y)（每一列各自跟向量做點積）", "A ＝ [[0, −1], [1, 0]]，x ＝ (3, 4)：第一個數 ＝ 0×3 ＋ (−1)×4 ＝ −4；第二個數 ＝ 1×3 ＋ 0×4 ＝ 3 → (−4, 3)，與題目一致"], ["② 比較長度有沒有變", "向量長度 ‖v‖ ＝ √(第一個數² ＋ 第二個數²)", "輸入：√(3² ＋ 4²) ＝ √(9 ＋ 16) ＝ √25 ＝ 5；輸出：√((−4)² ＋ 3²) ＝ √(16 ＋ 9) ＝ √25 ＝ 5 → 長度不變"], ["③ 比較方向有沒有變（算夾角）", "cosθ ＝ (u·v) ÷ (‖u‖ × ‖v‖)；內積為 0 代表垂直（夾角 90°）", "內積 ＝ 3×(−4) ＋ 4×3 ＝ −12 ＋ 12 ＝ 0 → 夾角 90°。長度不變、方向轉了 90°，這是旋轉（逆時針 90 度），選 D"], ["④ 檢查行列式（排除投影）", "2×2 矩陣的行列式 ＝ a·d － b·c；行列式為 0 才會壓扁空間（投影）", "＝ 0×0 － (−1)×1 ＝ 0 ＋ 1 ＝ 1，不是 0，空間沒被壓扁，可逆，資訊沒有遺失"], ["⑤ 對照其他選項（為什麼不對）", "縮放：輸出與輸入平行；剪切：有一個軸不動", "A：縮放要同方向，但 (−4, 3) 與 (3, 4) 不平行（內積 0 ＝ 垂直）。B：投影的行列式為 0，這裡是 1。C：剪切有一軸不動，但這個矩陣把 (1, 0) 轉到 (0, 1)、把 (0, 1) 轉到 (−1, 0)，兩個軸都動了，且長度不變"]], "tip": "長度不變、方向改變 ＝ 旋轉；縮放改長度、投影行列式為 0。"}}, {"no": 4, "section": "3.2", "topic_id": "3.2-03", "topic": "特徵值分解", "style": "情境", "stem": "某資料科學家手上有一個 100 筆樣本 × 5 個特徵的資料矩陣 X，想直接對 X 做特徵值分解（A = QΛQᵀ），找出資料被拉伸最多的方向，但程式回報「矩陣不是方陣，無法分解」。下列處理方式，何者最合理？", "options": {"A": "特徵值分解本來就只能用在稀疏矩陣，因此需先把 X 轉成稀疏格式再進行分解", "B": "改對 5×5 的協方差矩陣做特徵值分解（PCA 的作法），或直接對 X 做奇異值分解（SVD）", "C": "在 X 後面補上 95 欄全為 0 的特徵，擴充成 100×100 的方陣，分解結果與原資料等價", "D": "先計算 X 的反矩陣 X⁻¹，因為反矩陣一定是方陣，再對 X⁻¹ 做特徵值分解即可"}, "answer": "B", "explanation": "答案 B。特徵值分解只適用於方陣（指引強調對稱方陣）。對任意形狀的 100×5 資料矩陣，常見作法有二：先算 5×5 的協方差矩陣再做特徵值分解（這就是 PCA），或直接對 X 做 SVD。補零、求反矩陣都不是正確解法。", "per_option": {"A": "特徵值分解的適用條件是（對稱）方陣，與是否稀疏無關。", "B": "協方差矩陣是 5×5 的對稱方陣，可做特徵值分解；任意形狀的矩陣則可用 SVD。", "C": "補零只是人為製造無意義的欄位，不能讓分解結果與原資料的結構等價，也不是標準作法。", "D": "非方陣沒有反矩陣，這個步驟本身就無法執行。"}, "guide_ref": "學習指引 p.3-13～3-14", "hot": false}, {"no": 5, "section": "3.3", "topic_id": "3.3-01", "topic": "最佳化問題的組成", "style": "情境", "stem": "某團隊訓練二元分類器時，直接把「分類出錯的筆數」（錯一筆算 1、對一筆算 0）當作要最小化的目標函數，並用梯度下降更新權重。訓練許多回合後，參數幾乎沒有變動，出錯的筆數也沒有改善。最可能的原因是下列何者？", "options": {"A": "可行域缺失（Missing Feasible Region）：沒有設定參數的上下限，導致參數跑到無法計算的數值範圍，所以更新停滯", "B": "階梯狀目標函數（Non-differentiable Objective）：分段為常數，梯度處處為 0 或不存在，應改用可導損失（如交叉熵）", "C": "缺少正則化（No Regularization）：沒有加入正則化項，導致梯度下降在最小值附近來回震盪而無法收斂", "D": "決策變數過多（Too Many Variables）：權重的數量大於樣本筆數，使梯度下降一定無法順利收斂到任何解"}, "answer": "B", "explanation": "答案 B。訓練模型是一個最佳化問題，梯度下降要能運作，目標函數必須可導，才能算出梯度（損失對各參數的偏微分）來決定更新方向。以「錯誤筆數」（0-1 損失）為目標時，參數微小變動通常不會改變錯誤筆數，梯度處處為 0，所以參數不動。實務上改用交叉熵等可導的替代損失。", "per_option": {"A": "若是參數數值失控，會看到數值爆炸或 NaN，而不是參數幾乎不動。", "B": "梯度下降需要目標函數可導；分類錯誤筆數是分段常數，梯度為 0 或不存在，就沒有下降方向。", "C": "缺少正則化會影響過擬合，不是造成「參數完全不更新」的原因。", "D": "權重多於樣本只會增加過擬合風險，並不會讓梯度恆為 0。"}, "guide_ref": "學習指引 p.3-18～3-20", "hot": false}, {"no": 6, "section": "3.3", "topic_id": "3.3-03", "topic": "損失函數選擇", "style": "情境", "stem": "某門禁系統要訓練模型產生人臉的特徵向量，用於比對兩張照片是否為同一人。訓練資料是成對的照片，每一對都標註「同一人」或「不同人」。下列哪一種損失函數最符合此訓練設計？", "options": {"A": "排序損失（Ranking Loss）：使搜尋結果中相關的項目排在不相關的項目之前", "B": "均方誤差（MSE）：對預測值與真實值的差距取平方，適合預測連續數值", "C": "重建損失（Reconstruction Loss）：衡量輸出與原始輸入的差異，用於自編碼器", "D": "對比損失（Contrastive Loss）：用成對樣本學習相似度，同類距離小、異類距離大"}, "answer": "D", "explanation": "答案 D。當資料以「成對樣本＋相似／相異標註」的形式出現，目標是學出能反映相似度的特徵向量，應使用對比損失（Contrastive Loss）。MSE 用於連續數值預測，重建損失用於自編碼器，排序損失用於搜尋推薦，皆與本題設計不符。", "per_option": {"A": "排序損失針對搜尋與推薦的結果排序，不是以同一人／不同人的成對標註來學習距離。", "B": "MSE 針對連續數值的回歸，沒
