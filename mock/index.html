名單，避免日後針對同一檔案再次誤報而造成困擾", "C": "在正式主機上直接執行該檔案，觀察是否出現異常行為後再決定如何處理", "D": "先隔離以保留還原的可能，並送沙箱觀察行為後，再決定刪除或還原"}, "answer": "D", "explanation": "答案 D。防毒軟體偵測到來源不明的可疑項目又怕誤刪時，應先隔離並保留還原可能；對新型惡意程式可用啟發式探索或沙箱做動態分析。外來檔案要先掃描，並搭配使用者教育。", "per_option": {"A": "若其實是業務必要檔案，永久刪除就無法還原，應先隔離。", "B": "來源不明又未經確認就放行，等於放任潛在的惡意程式。", "C": "在正式環境執行可能直接造成感染，觀察應在隔離的沙箱中進行。", "D": "先隔離可阻止擴散又保留還原餘地；沙箱讓可疑程式在隔離環境執行，觀察是否有惡意行為。"}, "why_guess": "惡意程式防護：近五場 3/5 場出現、累計 4 題（115-1 出 0 題）；沙箱與惡意程式分析：近五場 3/5 場出現、累計 3 題（115-1 出 1 題）。常勝軍、回馬槍：惡意程式防護近五場有 3 場出現，115-1 沒出；沙箱與惡意程式分析也有 3 場出現。", "event": null, "guide_ref": "學習指引 p.59~60"}, {"no": 37, "chapter": "6", "topic": "應用程式白名單", "tags": ["回馬槍"], "style": "定義", "stem": "企業希望防止員工自行安裝未經授權的軟體，同時讓尚無特徵碼的新型惡意程式也無法在主機上執行。下列何種作法最為適當？", "options": {"A": "以 BitLocker 加密磁碟，使未授權軟體無法被安裝", "B": "建立黑名單，列出已知惡意程式的名稱並禁止其執行", "C": "以 Windows AppLocker 建立應用程式白名單，只允許經核准的程式執行", "D": "每週執行一次全機掃描，發現未授權軟體後再通知刪除"}, "answer": "C", "explanation": "答案 C。應用程式白名單的原則是預設全部禁止、只允許明確核准的程式；黑名單是預設放行、只擋已知有害的。AppLocker 限制程式執行，BitLocker 是磁碟加密，兩者名字像但用途不同。", "per_option": {"A": "BitLocker 是磁碟加密，保護的是資料機密性，不控管哪些程式可執行。", "B": "黑名單只擋得住已被列入的對象，擋不住新型惡意程式。", "C": "白名單預設全部禁止、只允許核准的程式，對未知的新型惡意程式也有效；AppLocker 就是限制程式執行的功能。", "D": "事後掃描無法在事前阻止；防止未授權軟體最有效的是事前管控。"}, "why_guess": "應用程式白名單：近五場 3/5 場出現、累計 4 題（115-1 出 0 題）。回馬槍：應用程式白名單近五場有 3 場出現，115-1 沒出。", "event": null, "guide_ref": "學習指引 p.59"}, {"no": 38, "chapter": "6", "topic": "日誌記錄內容與保存", "tags": ["升溫"], "style": "否定", "stem": "關於資通系統稽核日誌的記錄與管理，下列何者「不」適當？", "options": {"A": "為了方便問題排查，將使用者登入時輸入的明文密碼一併記錄於日誌", "B": "記錄使用者 ID、事件發生的日期時間，以及存取成功或被拒絕的結果", "C": "保存期限須符合法規或組織政策，並設定日誌輪替以避免空間耗盡", "D": "管理者與操作員的活動也應納入記錄"}, "answer": "A", "explanation": "答案 A。日誌要記「誰、何時、做了什麼、結果如何」，包含登入登出、存取成功與被拒、組態變更、特別權限的使用等；但不可記錄明文密碼。保存期限依法規或政策，並防止被竄改。", "per_option": {"A": "日誌不應記錄明文密碼等敏感資訊，否則日誌外洩就等於密碼外洩。", "B": "這些都是指引要求日誌宜包含的內容，這句話適當。", "C": "依法規或政策保存，並以輪替管理容量，這句話適當。", "D": "管理者也是被記錄的對象，不能自己掌控日誌，這句話適當。"}, "why_guess": "日誌記錄內容與保存：近五場 4/5 場出現、累計 6 題（115-1 出 2 題）。升溫：日誌記錄內容與保存近五場累計出 6 題，是科目二出題最多的考點之一。", "event": null, "guide_ref": "學習指引 p.74~75"}, {"no": 39, "chapter": "6", "topic": "日誌分析與 SIEM", "tags": ["升溫"], "style": "定義", "stem": "資安人員要比對防火牆、Windows 伺服器與 Linux 主機的日誌，但各設備的欄位名稱與時間格式不同，造成無法關聯分析。分析前應先進行下列何項處理？", "options": {"A": "資料清理與正規化（Normalization），統一欄位、命名與格式", "B": "延長各設備日誌的保存期限，並將日誌備份到不同的實體主機上", "C": "關閉格式不一致的設備日誌，改為只分析防火牆日誌，以降低分析的複雜度", "D": "將所有日誌去識別化後再匯出，並移除其中的使用者帳號與 IP 位址欄位"}, "answer": "A", "explanation": "答案 A。日誌管理流程是收集、保存、保護、分析。分析前要先做資料清理與正規化，統一不同設備的格式與命名；SIEM 則集中蒐集日誌、做關聯分析與告警。", "per_option": {"A": "不同設備的日誌格式與命名不同，分析前要先清理並正規化，才能集中關聯分析。", "B": "保存時間長短與格式不一致的問題無關。", "C": "少了來源就看不到完整事件全貌，並非解決方法。", "D": "去識別化是保護個資，並不能統一格式。"}, "why_guess": "日誌分析與 SIEM：近五場 3/5 場出現、累計 4 題（115-1 出 2 題）。升溫：日誌分析與 SIEM 在 115-1 出 2 題，近五場累計 4 題。", "event": null, "guide_ref": "學習指引 p.75、p.78~79"}, {"no": 40, "chapter": "6", "topic": "Syslog 嚴重等級", "tags": ["回馬槍"], "style": "定義", "stem": "依 RFC 5424，下列 Syslog 嚴重等級（Severity）的數值與名稱配對，何者正確？", "options": {"A": "0：Emergency（系統無法使用）", "B": "1：Critical", "C": "4：Notice", "D": "7：Informational"}, "answer": "A", "explanation": "答案 A。RFC 5424 嚴重等級：0 Emergency、1 Alert、2 Critical、3 Error、4 Warning、5 Notice、6 Informational、7 Debug，數值越小越嚴重。訊息開頭的 PRI＝Facility×8＋Severity。", "per_option": {"A": "嚴重等級 0 是最嚴重的 Emergency。", "B": "1 是 Alert，Critical 是 2。", "C": "4 是 Warning，Notice 是 5。", "D": "7 是 Debug，Informational 是 6。"}, "why_guess": "Syslog 與 RFC 5424：近五場 3/5 場出現、累計 3 題（115-1 出 0 題）。回馬槍：Syslog 與 RFC 5424 近五場有 3 場出現，115-1 沒出；等級對照是有標準答案的事實題。", "event": null, "guide_ref": "學習指引 p.77（Syslog 練習題）；嚴重等級對照指引未寫，依 RFC 5424"}, {"no": 41, "chapter": "6", "topic": "日誌時間同步", "tags": ["一般"], "style": "定義", "stem": "不同設備的日誌時間差了數分鐘，導致事件發生的先後順序難以對照。要求資訊系統與網路設備進行時鐘同步（例如使用 NTP），其主要目的為何？", "options": {"A": "讓日誌檔案自動加密，確保日誌內容的機密性", "B": "避免日誌因儲存空間不足而被覆蓋", "C": "加快日誌傳送到日誌伺服器的速度", "D": "確保稽核日誌的時間準確，以便記錄事件順序並作為證據"}, "answer": "D", "explanation": "答案 D。資訊系統與網路設備的時鐘要同步，才能確保稽核日誌的時間準確，作為事件證據。NTP 是常用的時間同步協定。", "per_option": {"A": "時間同步與加密無關。", "B": "避免被覆蓋靠容量規劃與日誌輪替。", "C": "同步時鐘不會提升傳輸速度。", "D": "時鐘同步讓各設備日誌的時間一致，才能正確還原事件順序並生成可用的證據。"}, "why_guess": "日誌防竄改與完整性：近五場 3/5 場出現、累計 3 題（115-1 出 1 題）。一般題：日誌防竄改與完整性近五場有 3 場出現，時鐘同步是其中一個考點。", "event": null, "guide_ref": "學習指引 p.78"}, {"no": 42, "chapter": "6", "topic": "資料保護與媒體報廢", "tags": ["回馬槍"], "style": "定義", "stem": "企業淘汰一批存有機密資料的舊硬碟，為確保資料無法被復原，下列何項處理方式最為適當？", "options": {"A": "刪除所有檔案後清空資源回收筒", "B": "使用資料覆寫工具徹底覆寫，或將硬碟實體粉碎等方式銷毀", "C": "快速格式化硬碟後重新安裝作業系統", "D": "在硬碟外殼貼上「資料已清除」標籤後交給回收廠商處理"}, "answer": "B", "explanation": "答案 B。含機密資訊或個資的媒體，不再需要時要用正式程序安全汰除。單純刪除、清空資源回收筒或格式化都救得回來，應使用資料覆寫工具或物理銷毀。", "per_option": {"A": "刪除檔案只移除目錄資訊，資料本體仍在，可被復原。", "B": "要永久刪除機密資料，應使用資料覆寫工具或物理銷毀（燒毀、粉碎）。", "C": "格式化同樣只移除目錄資訊，資料還救得回來。", "D": "標籤不會讓資料消失，機密資料仍可能外洩。"}, "why_guess": "儲存媒體與銷毀：近五場 2/5 場出現、累計 3 題（115-1 出 0 題）。回馬槍：儲存媒體與銷毀近五場有 2 場出現（113-2 考 1 題、114-1 考 2 題），近兩場（114-2、115-1）沒出。", "event": null, "guide_ref": "學習指引 p.67~68"}, {"no": 43, "chapter": "6", "topic": "勒索軟體與離線備份", "tags": ["時事"], "style": "情境", "stem": "2026 年 10 月，日本雲端業者 IDC Frontier 遭勒索軟體攻擊，服務中斷，部分客戶的資料恐難以復原，需依賴客戶自己的備份重建。某企業目前的備份全放在同一個雲端帳號內，且管理者帳號有權刪除備份。為降低類似風險，下列何項補強最為適當？", "options": {"A": "另外保存一份離線或不可變（Immutable）、與正式環境隔離的備份，並限制備份的刪除權限", "B": "在同一個雲端帳號中增加更多份備份副本，並提高備份頻率", "C": "要求雲端業者在服務水準協議（SLA）中承諾 100% 的可用率，即可確保資料不會遺失", "D": "將備份檔加密後仍放在同一帳號內，使攻擊者無法讀取"}, "answer": "A", "explanation": "答案 A。勒索軟體的善後防線是備份，且備份要離線或與主系統隔離；不可變備份（WORM、物件鎖定）寫入後在保留期內無法修改或刪除，再搭配零信任式的存取控管（最小權限、MFA、備份專用帳號）。多份、多處但可被有權限帳號刪除的備份，仍會被一起清掉。", "per_option": {"A": "勒索軟體常先刪除或加密備份；離線或不可變的備份寫入後無法被修改刪除，搭配最小權限，才能保證有乾淨版本可還原。", "B": "副本都在同一帳號，管理者帳號被盜或整個環境被加密時會一起被刪。", "C": "SLA 談的是服務可用率，不保證資料能復原，雲端業者的備份也不等於自己的備份。", "D": "加密保護機密性，卻擋不住備份被刪除或被勒索軟體一併加密。"}, "why_guess": "勒索軟體：近五場 2/5 場出現、累計 2 題（115-1 出 0 題）；不可變備份：近五場 2/5 場出現、累計 2 題（115-1 出 1 題）。時事題：勒索軟體與不可變備份各有 2 場出現，用 IDC Frontier 事件當情境，考的是離線／不可變備份的價值。", "event": {"id": "G3", "title": "日本 IDC Frontier 雲端遭勒索軟體攻擊", "date": "2026-10", "summary": "日本雲端業者 IDC Frontier（IDCF Cloud）遭勒索軟體攻擊造成服務中斷，部分客戶資料恐難以復原，需依賴客戶自己的備份重建。", "source": "https://www.bleepingcomputer.com/news/security/ransomware-attack-disrupts-japans-idcf-cloud-used-by-govt-clients/"}, "guide_ref": "學習指引 p.36~37（勒索軟體）、p.66~67（備份）；不可變備份指引未寫（近年試題考過）"}, {"no": 44, "chapter": "7", "topic": "行動裝置風險", "tags": ["回馬槍"], "style": "定義", "stem": "關於行動裝置越獄（Jailbreak）或取得 Root 權限對資訊安全的影響，下列敘述何者最為適當？", "options": {"A": "會破壞作業系統原有的沙盒隔離與權限限制，使惡意 App 更容易存取其他 App 的資料", "B": "能強化作業系統的完整性檢查，降低惡意軟體感染的機率", "C": "只影響手機的外觀與效能，對資訊安全沒有影響", "D": "可讓使用者安全地從任何來源安裝 App，不需再留意 App 的權限"}, "answer": "A", "explanation": "答案 A。App 沙盒讓每個 App 在獨立空間執行、不能任意讀取其他 App 的資料。越獄或 Root 會破壞這層隔離；行動裝置應只從官方商店安裝 App，並檢查權限是否合理。", "per_option": {"A": "越獄或 Root 會繞過沙盒隔離，提高惡意程式竊取資料的風險。", "B": "剛好相反，它拿掉了原廠設下的保護。", "C": "它直接影響權限與隔離機制，與資安高度相關。", "D": "從不明來源安裝 App 正是常見的感染途徑，更需要留意權限。"}, "why_guess": "行動裝置風險與防護：近五場 3/5 場出現、累計 5 題（115-1 出 0 題）；App 攻擊與沙盒：近五場 2/5 場出現、累計 2 題（115-1 出 0 題）。回馬槍：行動裝置風險與防護近五場有 3 場出現，113-1 與 114-2 各出 2 題，115-1 沒出。", "event": null, "guide_ref": "學習指引 p.96~98"}, {"no": 45, "chapter": "7", "topic": "行動裝置防護 MDM", "tags": ["回馬槍"], "style": "否定", "stem": "關於行動裝置管理（MDM）與行動應用管理（MAM），下列敘述何者「不」正確？", "options": {"A": "MDM 只管企業 App 及其資料、不接管整台手機，最符合 BYOD 的隱私趨勢", "B": "MDM 可對遺失的裝置進行遠端鎖定，或遠端清除其中的企業資料與設定", "C": "MAM 的管理範圍僅限於企業應用程式與其資料，不接管整台裝置", "D": "在 BYOD 情境下，企業資訊與私人資訊應加以隔離，並於使用前簽署協議"}, "answer": "A", "explanation": "答案 A。MDM（行動裝置管理）管整台裝置，可限制行為、遠端變更與清除；MAM（行動應用管理）只管企業 App 與其資料，不接管整台手機，更符合隱私保護趨勢，適合員工抗拒 MDM 的 BYOD 情境。", "per_option": {"A": "只管企業 App 與資料、不接管整台手機的是 MAM，MDM 管的是整台裝置。", "B": "MDM 管整台裝置，可遠端變更與清除內容，這句話正確。", "C": "這是 MAM 的特色，這句話正確。", "D": "指引明確要求企業與私人資訊隔離，這句話正確。"}, "why_guess": "BYOD 與 MDM/MAM：近五場 3/5 場出現、累計 3 題（115-1 出 1 題）。回馬槍：BYOD 與 MDM/MAM 近五場有 3 場出現，115-1 考過 MAM，這次改成否定式。", "event": null, "guide_ref": "學習指引 p.98"}, {"no": 46, "chapter": "7", "topic": "雲端服務模型", "tags": ["一般"], "style": "定義", "stem": "企業向雲端業者租用 IaaS 虛擬主機。依共同責任模型，下列何者屬於企業（客戶）自身應負責的項目？", "options": {"A": "資料中心實體機房的門禁與監視設備", "B": "虛擬化平台（Hypervisor）本身的漏洞修補", "C": "雲端業者機房的電力與空調備援", "D": "虛擬主機內作業系統的更新修補與防火牆設定"}, "answer": "D", "explanation": "答案 D。IaaS 提供伺服器、網路、儲存等基礎設施，使用者自己管理作業系統與軟體；越接近 SaaS，供應商負責越多，但資料與帳號存取管理仍是使用者的事。實體安全由供應商負責。", "per_option": {"A": "實體安全由雲端業者負責。", "B": "虛擬化平台屬於業者管理的底層基礎設施。", "C": "機房設施由業者負責。", "D": "IaaS 提供基礎設施，使用者自己管理作業系統與其上的軟體。"}, "why_guess": "雲端服務與部署模式：近五場 2/5 場出現、累計 2 題（115-1 出 1 題）。一般題：雲端服務與部署模式近五場有 2 場出現，責任分擔是常考的核心。", "event": null, "guide_ref": "學習指引 p.83~85"}, {"no": 47, "chapter": "7", "topic": "雲端威脅", "tags": ["回馬槍", "時事"], "style": "情境", "stem": "2026 年 10 月，台灣雲端部署平台 Zeabur 遭入侵，攻擊者讀取了平台資料庫中用戶存放的環境變數，其中含有用戶的雲端與 AI 服務 API 金鑰，並已觀察到部分金鑰遭盜用。作為使用該平台的企業用戶，下列因應何者最為適當？", "options": {"A": "金鑰由平台負責保管，平台已公告處理，用戶無須採取任何動作", "B": "只更改平台帳號的登入密碼，原有的 API 金鑰不必更換", "C": "立即撤銷並輪替存放於該平台的所有 API 金鑰，並檢視各服務的使用紀錄", "D": "把 API 金鑰改成 Base64 編碼後再存回環境變數，使攻擊者無法直接使用"}, "answer": "C", "explanation": "答案 C。雲端常見威脅包含資料洩露、身分憑證與金鑰管理不足、帳戶劫持等；雲端資源集中、共享，一處被攻破可能波及很多租戶。供應商出事時，用戶仍要負責自己的金鑰與資料，首要動作是立即輪替金鑰。", "per_option": {"A": "共同責任模型下，用戶仍要負責自己的金鑰與資料。", "B": "API 金鑰已隨環境變數外洩，不換掉仍可被持續盜用。", "C": "金鑰已可能外洩，必須立即輪替並查看是否遭盜用；平台出事，用戶仍要自行保護金鑰與資料，這就是共同責任。", "D": "Base64 只是編碼，不是加密，攻擊者一還原就能使用。"}, "why_guess": "雲端威脅：近五場 3/5 場出現、累計 4 題（115-1 出 0 題）。時事題（回馬槍）：雲端威脅近五場有 3 場出現，用 Zeabur 事件當情境，考的是金鑰輪替與共同責任。", "event": {"id": "T4", "title": "Zeabur 雲端部署平台遭入侵、用戶環境變數遭讀取", "date": "2026-10", "summary": "台灣雲端部署平台 Zeabur 遭入侵，攻擊者讀取平台資料庫中用戶存放的環境變數，其中含有雲端與 AI 服務的 API 金鑰，部分金鑰已被觀察到遭盜用。", "source": "https://zeabur.com/zh-TW/blogs/october-2026-security-incident"}, "guide_ref": "學習指引 p.86~87"}, {"no": 48, "chapter": "7", "topic": "物聯網常見弱點", "tags": ["回馬槍", "時事"], "style": "情境", "stem": "2026 年 10 月，法國多家超市的冷藏控制設備被遠端操控而異常升溫。報導指出，受影響的控制器直接暴露在網際網路上，且部分韌體版本過舊。下列哪一項改善措施最能降低此類物聯網設備被遠端利用的風險？", "options": {"A": "增加冷藏設備內的溫度感測器數量，異常時由人員巡檢確認", "B": "把控制器的管理介面改到較少人知道的連接埠，並維持舊版韌體以免相容問題", "C": "只要更換預設帳號密碼即可，不需更新韌體，也不必限制連線來源", "D": "不讓控制器直接暴露於網際網路（改經 VPN 或專用管理網段存取），更新韌體並更改預設帳號密碼"}, "answer": "D", "explanation": "答案 D。OWASP IoT Top 10 的常見弱點包含弱或預設密碼、不安全的網路服務、缺乏安全更新機制、使用過時元件等。對策是不直接暴露公網、做網路分段與存取來源限制、定期更新韌體，並更改預設密碼。", "per_option": {"A": "感測器只能事後發現異常，沒有阻止設備被遠端操控。", "B": "改埠號只是障眼法     : "剩餘時間 " + mmss(left);
  el.classList.toggle("low", low);
  if (nt) { nt.textContent = left != null ? "剩 " + mmss(left) : ""; nt.classList.toggle("low", low); }
}
setInterval(tick, 1000);
// 交卷（手動或時間到）：答錯的題目收進錯題本
function doSubmit(timeout) {
  if (submitted) return;
  submitted = true; timedOut = !!timeout;
  if (t0 && !t1) t1 = timeout ? t0 + LIMIT : Date.now();
  qs().forEach(q => { if (ans[q.no] != null && ans[q.no] !== q.answer) nbAdd(q.no); });
  document.getElementById("confirm").hidden = true;
  save(); render(); document.getElementById("qlist").scrollIntoView({ behavior: "smooth" });
}
const qs = () => DATA[st.subj] || [];
const revealed = (n) => st.mode === "exam" ? submitted : (ans[n] != null || shown[n]);
const baseList = () => st.mode === "notebook" ? qs().filter(q => nb[q.no] || grad[q.no]) : qs();

function renderTop() {
  document.querySelectorAll("[data-subj]").forEach(b => b.setAttribute("aria-pressed", b.dataset.subj === st.subj));
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === st.mode));
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === st.view));
  document.querySelector(".layout").classList.toggle("one", st.view === "one");
  document.getElementById("keys").hidden = st.view !== "one";
  document.getElementById("modehint").textContent = {
    practice: "練習模式：每題選完馬上看答案、解析和猜題理由；50 題都做完會出成績。答錯的題目自動收進錯題本。",
    exam: "考試模式：限時 90 分鐘（作答第一題開始倒數，時間到自動交卷）。寫完按「交卷」才公布答案並算分；作答紀錄和練習模式分開。交卷後答錯的題目收進錯題本。",
    notebook: "錯題本：練習答錯、考試交卷後答錯的題目都在這裡。每一輪第一次就答對算一次，連續兩輪都答對就畢業移出。"
  }[st.mode];
  document.getElementById("mode-notebook").textContent = "錯題本 " + nbCount();
  tick();
  const list = baseList();
  const chips = ["全部", ...TAGS].map(t => {
    const n = t === "全部" ? list.length : list.filter(q => hasTag(q, t)).length;
    return `<button class="chip" data-filter="${t}" aria-pressed="${st.filter === t}">${t}<span class="n">${n}</span></button>`;
  }).join("");
  document.getElementById("chips").innerHTML = chips;
  document.getElementById("card-title").textContent = SUBJ[st.subj].name + " 劃記卡";
}

function optClass(q, k) {
  const n = q.no, picked = ans[n] === k;
  let c = "opt" + (picked ? " picked" : "");
  if (revealed(n)) { if (k === q.answer) c += " right"; else if (picked) c += " wrong"; }
  return c;
}

function qHTML(q) {
  const n = q.no, sj = SUBJ[st.subj];
  const tags = q.tags.filter(t => t !== "一般").map(t => `<span class="tag ${t.includes("時事") ? "t-news" : t.includes("常勝軍") ? "t-hot" : ""}">${H(t)}</span>`).join("");
  const ev = q.event ? `<div class="event"><b>事件小檔案｜${H(q.event.title)}（${H(q.event.date)}）</b><br>${H(q.event.summary)}${q.event.source ? `<br><a href="${H(q.event.source)}" target="_blank" rel="noopener">來源</a>` : ""}</div>` : "";
  const lock = st.mode === "exam" ? submitted : ans[n] != null || !!shown[n];
  const opts = ["A", "B", "C", "D"].map(k => `<button class="${optClass(q, k)}" data-q="${n}" data-k="${k}" ${lock ? "disabled" : ""}><span class="ab">${k}</span><span>${H(q.options[k])}</span></button>`).join("");
  let rev = "";
  if (revealed(n)) {
    const a = ans[n];
    const v = a == null ? `<div class="verdict">正確答案 ${q.answer}</div>` : a === q.answer ? `<div class="verdict ok">答對了｜答案 ${q.answer}</div>` : `<div class="verdict bad">你選 ${a}，正確答案 ${q.answer}</div>`;
    let nbLine = "";
    if (st.mode === "notebook") {
      const e = nb[n];
      const note = grad[n] ? "連續兩輪第一次就答對，畢業了！已移出錯題本。"
        : tried[n] === "bad" && a === q.answer ? "這次答對了，但這一輪第一次答錯，不算進度；下一輪再試。"
        : e ? `錯題本進度：連續 ${e.streak}／2 輪第一次就答對。` : "";
      const retry = !grad[n] && a !== q.answer ? `<button class="btn ghost showbtn" data-retry="${n}">再試一次（不算進度）</button>` : "";
      nbLine = `<div class="why"><b>錯題本：</b>${note}</div>${retry}`;
    } else if (st.mode === "practice" && a !== q.answer) {
      nbLine = `<div class="ref">這題已收進錯題本。</div>`;
    }
    rev = `<div class="reveal">${v}${nbLine}<div>${H(q.explanation)}</div>
      <ul class="po">${["A", "B", "C", "D"].map(k => `<li><b>${k}</b><span>${H(q.per_option[k])}</span></li>`).join("")}</ul>
      <div class="why"><b>為什麼猜這題：</b>${H(q.why_guess)}</div>
      <div class="ref">出處：${H(q.guide_ref)}</div></div>`;
  } else if (st.mode !== "exam") {
    rev = `<button class="btn ghost showbtn" data-show="${n}">不作答，直接看解析</button>`;
  }
  return `<article class="q" id="q${n}"><div class="qhead"><span class="qno">${n}</span><span class="meta">第 ${H(q.chapter)} 章 ${H(sj.ch[q.chapter] || "")}</span>${tags}</div>${ev}<p class="stem">${H(q.stem)}</p><div class="opts">${opts}</div>${rev}</article>`;
}

const visible = () => baseList().filter(q => st.filter === "全部" || hasTag(q, st.filter));
function curIndex(list) {
  let i = list.findIndex(q => q.no === st.cur[ck()]);
  if (i < 0 && list.length) { i = 0; st.cur[ck()] = list[0].no; }
  return i;
}
const showsResult = () => (st.mode === "exam" && submitted) || (st.mode === "practice" && practiceDone());
function navHTML(i, n) {
  const next = i < n - 1 ? `<button class="btn" data-go="1">下一題 →</button>`
    : st.mode === "exam" && !submitted ? `<button class="btn" data-act="submit">交卷</button>`
    : showsResult() || st.mode === "notebook" ? `<button class="btn" data-act="top">${st.mode === "notebook" ? "看這一輪結果" : "看成績"}</button>`
    : `<button class="btn" disabled>已是最後一題</button>`;
  return `<nav class="nav" aria-label="換題"><button class="btn ghost" data-go="-1" ${i === 0 ? "disabled" : ""}>← 上一題</button><span class="mid"><span class="pos">${i + 1} / ${n}</span><span class="navtimer"></span></span>${next}</nav>`;
}
function go(d) {
  const list = visible();
  if (!list.length) return;
  const i = Math.min(Math.max(curIndex(list) + d, 0), list.length - 1);
  st.cur[ck()] = list[i].no; save(); renderList(); renderCard();
  const el = document.getElementById("qlist");
  if (el.getBoundingClientRect().top < 0) el.scrollIntoView({ block: "start" });
}
function renderList() {
  const list = visible();
  let html = "";
  if (showsResult()) html += resultHTML();
  if (st.mode === "notebook") html += nbHeadHTML(list);
  if (st.view === "one" && list.length) {
    const i = curIndex(list);
    html += qHTML(list[i]) + navHTML(i, list.length);
    emitCurrent(list[i]);
  } else html += list.map(qHTML).join("");
  if (!list.length && st.mode !== "notebook") html += `<p class="note">這個分類沒有題目。</p>`;
  document.getElementById("qlist").innerHTML = html;
  tick();
}
function nbHeadHTML(list) {
  const sj = SUBJ[st.subj].name;
  if (!baseList().length) return `<section class="result"><h2>${sj} 錯題本是空的</h2><p class="note">練習模式答錯、按「直接看解析」，或考試模式交卷後答錯的題目，會自動收進來。</p></section>`;
  if (!list.length) return `<section class="result"><p class="note">錯題本裡沒有這個分類的題目，換一個分類或按「全部」。</p></section>`;
  const done = list.filter(q => tried[q.no]).length, firstOk = list.filter(q => tried[q.no] === "ok").length;
  const g = Object.keys(grad).length, finished = done === list.length;
  return `<section class="result"><h2>${sj} 錯題本・${nbCount()} 題</h2>
    <div class="note">這一輪：做了 ${done}／${list.length} 題，第一次就答對 ${firstOk} 題${g ? `，畢業 ${g} 題` : ""}。${finished ? "這一輪做完了！按右邊（手機在下面）的「開始新的一輪」再練一次，連續兩輪都答對的題目就會畢業。" : ""}</div></section>`;
}

function renderCard() {
  const list = qs(), inBase = new Set(baseList().map(q => q.no));
  const answered = list.filter(q => ans[q.no] != null).length;
  const correct = list.filter(q => ans[q.no] === q.answer).length;
  const showScore = st.mode !== "exam" || submitted;
  document.getElementById("progress").textContent = st.mode === "notebook" ? `錯題 ${nbCount()} 題`
    : showScore ? `${correct} 對／已答 ${answered}` : `已答 ${answered}／${list.length}`;
  document.getElementById("bubbles").innerHTML = list.map(q => {
    let c = "bub";
    const a = ans[q.no], off = !inBase.has(q.no);
    if (revealed(q.no) && a != null) c += a === q.answer ? " ok" : " bad";
    else if (a != null) c += " done";
    if (q.event) c += " ev";
    if (off || (st.filter !== "全部" && !hasTag(q, st.filter))) c += " dim";
    if (st.view === "one" && q.no === st.cur[ck()]) c += " cur";
    return `<button class="${c}" data-jump="${q.no}" aria-label="第 ${q.no} 題" ${off ? "disabled" : ""}>${a && (st.mode === "exam" && !submitted) ? a : q.no}</button>`;
  }).join("");
  const acts = [];
  if (st.mode === "exam" && !submitted) acts.push(`<button class="btn" data-act="submit">交卷</button>`);
  if (st.mode === "notebook") {
    acts.push(`<button class="btn" data-act="reset">開始新的一輪</button>`);
    if (nbCount()) acts.push(`<button class="btn ghost" data-act="nbclear">清空錯題本</button>`);
  } else acts.push(`<button class="btn ghost" data-act="reset">清除作答</button>`);
  document.getElementById("actions").innerHTML = acts.join("");
}

function resultHTML() {
  const list = qs();
  const correct = list.filter(q => ans[q.no] === q.answer).length;
  const blank = list.filter(q => ans[q.no] == null).length;
  const blankLabel = st.mode === "practice" ? `直接看解析 ${blank} 題（算答錯）` : `未作答 ${blank} 題`;
  const row = (label, sub) => {
    const c = sub.filter(q => ans[q.no] === q.answer).length;
    const p = sub.length ? Math.round(c / sub.length * 100) : 0;
    return `<div class="bar"><span>${H(label)}</span><span class="track"><span class="fill" style="width:${p}%;display:block"></span></span><span class="v">${c}/${sub.length}</span></div>`;
  };
  const chs = [...new Set(list.map(q => q.chapter))];
  const wrong = list.filter(q => ans[q.no] !== q.answer).map(q => q.no);
  return `<section class="result"><h2>${SUBJ[st.subj].name} ${st.mode === "exam" ? "考試" : "練習"}成績</h2>
    <div><span class="big">${correct * 2}</span> 分 <span class="note">（${correct}/50 題，每題 2 分；${blankLabel}${t0 && t1 ? "；作答時間 " + mmss(t1 - t0) : ""}${timedOut ? "；90 分鐘時間到，自動交卷" : ""}；及格門檻請以簡章為準）</span></div>
    <div class="bars">${chs.map(c => row("第 " + c + " 章", list.filter(q => q.chapter === c))).join("")}</div>
    <div class="bars">${TAGS.map(t => row(t, list.filter(q => hasTag(q, t)))).join("")}</div>
    <div class="note">要回頭看的題號：${wrong.length ? wrong.map(n => `<a href="#q${n}" data-jump="${n}">${n}</a>`).join("、") : "全對！"}</div>
    <div class="actions"><button class="btn" data-mode="notebook">去錯題本重做（${nbCount()} 題）</button></div></section>`;
}

function render() { renderTop(); renderList(); renderCard(); }
function ask(msg, yes) {
  const box = document.getElementById("confirm");
  box.innerHTML = `<span>${H(msg)}</span><span class="actions"><button class="btn" id="c-yes">確定</button><button class="btn ghost" id="c-no">取消</button></span>`;
  box.hidden = false;
  document.getElementById("c-yes").onclick = () => { box.hidden = true; yes(); };
  document.getElementById("c-no").onclick = () => { box.hidden = true; };
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.subj) { st.subj = t.dataset.subj; st.filter = "全部"; loadSubj(); save(); render(); }
  else if (t.dataset.mode) { st.mode = t.dataset.mode; loadSubj(); save(); render(); }
  else if (t.dataset.themeSet) { theme = t.dataset.themeSet; store.set("mock1031-theme", theme); applyTheme(); }
  else if (t.dataset.view) { st.view = t.dataset.view; save(); render(); }
  else if (t.dataset.go) { go(+t.dataset.go); }
  else if (t.dataset.filter) { st.filter = t.dataset.filter; save(); render(); }
  else if (t.dataset.k) {
    const n = +t.dataset.q, q = qs().find(x => x.no === n), ok = t.dataset.k === q.answer;
    const wasDone = showsResult();
    ans[n] = t.dataset.k;
    if (st.mode === "exam" && !t0) t0 = Date.now();
    if (st.mode === "practice" && !ok) nbAdd(n);
    if (st.mode === "notebook") firstTry(n, ok);
    save(); tick();
    emitCurrent(q);
    if (st.mode !== "exam") emit({ type: "answer", topicId: tid(q), qi: 0, picked: "ABCD".indexOf(ans[n]), tries: 1 });
    afterAnswer(q, wasDone);
  }
  else if (t.dataset.show) {
    const n = +t.dataset.show, q = qs().find(x => x.no === n), wasDone = showsResult();
    shown[n] = true;
    if (st.mode === "practice") nbAdd(n);
    if (st.mode === "notebook") firstTry(n, false);
    save();
    emitCurrent(q); emit({ type: "reveal", topicId: tid(q), qi: 0 });
    afterAnswer(q, wasDone);
  }
  else if (t.dataset.retry) {
    const n = +t.dataset.retry; delete ans[n]; delete shown[n]; save();
    document.getElementById("q" + n).outerHTML = qHTML(qs().find(x => x.no === n));
  }
  else if (t.dataset.act === "top") {
    document.getElementById("qlist").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  else if (t.dataset.act === "nbclear") {
    ask(`清空${SUBJ[st.subj].name}的錯題本？裡面的 ${nbCount()} 題會全部移除。`, () => { nb = {}; saveNb(); ans = {}; shown = {}; tried = {}; grad = {}; save(); render(); });
  }
  else if (t.dataset.jump) {
    e.preventDefault();
    const n = t.dataset.jump;
    if (st.view === "one") {
      if (!visible().some(q => q.no === +n)) st.filter = "全部";
      st.cur[ck()] = +n; save(); render();
      const el = document.getElementById("qlist");
      if (el.getBoundingClientRect().top < 0 || el.getBoundingClientRect().top > innerHeight * 0.6) el.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (!document.getElementById("q" + n)) { st.filter = "全部"; render(); }
    document.getElementById("q" + n)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  else if (t.dataset.act === "submit") {
    const blank = qs().filter(q => ans[q.no] == null).length;
    const go = () => doSubmit(false);
    blank ? ask(`還有 ${blank} 題沒作答，確定交卷？`, go) : go();
  }
  else if (t.dataset.act === "reset") {
    const msg = st.mode === "notebook" ? "開始新的一輪？錯題本裡的題目都會清成沒作答（題目不會刪掉）。"
      : `清除${SUBJ[st.subj].name}${st.mode === "exam" ? "考試" : "練習"}模式的所有作答？（錯題本不受影響）`;
    ask(msg, () => { ans = {}; submitted = false; shown = {}; t0 = null; t1 = null; tried = {}; grad = {}; timedOut = false; save(); render(); });
  }
});
// 錯題本：只有這一輪「第一次」作答算進度；連續兩輪第一次就答對 → 畢業
function firstTry(n, ok) {
  if (tried[n]) return;
  tried[n] = ok ? "ok" : "bad";
  const e = nb[n];
  if (!e) return;
  if (ok) { e.streak += 1; if (e.streak >= 2) { delete nb[n]; grad[n] = true; } }
  else { e.streak = 0; e.misses += 1; }
  saveNb();
}
// 作答後：剛好全部做完就整頁重畫（出成績／這一輪結果），否則只換這一題
function afterAnswer(q, wasDone) {
  const nowDone = showsResult() || (st.mode === "notebook" && visible().every(x => tried[x.no]));
  if (nowDone && !wasDone) {
    renderTop(); renderList(); renderCard();
    if (st.view === "all" || st.mode !== "notebook") document.getElementById("qlist").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const el = document.getElementById("q" + q.no);
  if (st.mode === "notebook") renderList(); else if (el) el.outerHTML = qHTML(q);
  renderTop(); renderCard();
}
document.addEventListener("keydown", (e) => {
  if (st.view !== "one" || e.altKey || e.ctrlKey || e.metaKey || document.getElementById("confirm").hidden === false) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (/^[a-dA-D]$/.test(e.key)) document.querySelector(`#qlist .opt[data-k="${e.key.toUpperCase()}"]:not([disabled])`)?.click();
});
loadSubj(); render();
</script>

</html>
